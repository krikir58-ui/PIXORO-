<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #111}.top b{color:#fff}
.prev{margin:12px;height:400px;background:#111;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}.cell{padding:16px;background:#1a1a1a;border-radius:14px;text-align:center;cursor:pointer}
.btn{margin:12px;background:#fff;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900;color:#000}
</style></head><body>
<div class="top"><b>New Reel 🎬</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">🎬 Video Select Pannu</div>
<div class="grid"><div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div><div class="cell" onclick="document.getElementById('f').click()">➕ Add Video</div></div>
<button class="btn" onclick="go()">Next →</button>
<input type="file" id="f" hidden accept="video/*" onchange="h(event)">
<script>
let m='';
function h(e){
  let f=e.target.files[0];if(!f)return;
  let u=URL.createObjectURL(f);
  m=u;
  document.getElementById('prev').innerHTML=`<video src="${u}" autoplay loop controls muted></video>`;
  // FIX: Blob URL odaiyaama irukka - Session la save pannu da
  sessionStorage.setItem('pixoro_pending_media',u);
  sessionStorage.setItem('pixoro_pending_type','video');
  localStorage.setItem('pix_media',u);
  localStorage.setItem('pix_media_type','video');
  localStorage.setItem('pix_media_is_reel','true');
  // Video file name ah save pannu - Upload page la use aagum da
  localStorage.setItem('pix_video_name',f.name);
}
function go(){
  if(!m){alert('Video select pannu da Giri!');return}
  location.href='reels-upload.html'
}
</script></body></html>
