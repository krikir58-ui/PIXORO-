<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #111}
.prev{margin:12px;height:400px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}.cell{padding:16px;background:#1a1a1a;border-radius:14px;text-align:center;cursor:pointer}
.btn{margin:12px;background:#fff;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900;color:#000}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.progress{margin:0 12px;background:#111;border:1px solid #222;border-radius:12px;padding:10px;display:none}
.bar{height:6px;background:#333;border-radius:10px;overflow:hidden;margin-top:6px}
.barFill{height:100%;background:#00C853;width:0%}
.info{margin:0 12px;padding:8px;background:#111;border:1px solid #222;border-radius:10px;font-size:12px;color:#aaa;text-align:center}
</style></head><body>
<div class="top"><b>New Reel 🎬</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">🎬 Video Select Pannu</div>
<div class="info" id="info">Max: 30 Sec • Max: 15 MB • 720p Recommend da</div>
<div class="grid"><div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div><div class="cell" onclick="document.getElementById('f').click()">➕ Add Video</div></div>
<div class="progress" id="prog"><div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa"><span id="progText">Checking... ⏳</span><span id="progSize"></span></div><div class="bar"><div class="barFill" id="progFill"></div></div></div>
<button class="btn" onclick="go()">Next →</button>
<div id="toast" class="toast"></div>
<input type="file" id="f" hidden accept="video/*" onchange="h(event)">
<script>
const SUPA_URL = 'https://yecpltndhlzfjplzhcpm.supabase.co';
const SUPA_KEY = 'sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
function formatSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
// ✅ LOGIN CHECK - Server Only
let ME_RAW=''
async function checkAuth(){
  let { data: { session } } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return; }
  let { data: profile } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  ME_RAW = (profile?.username || session.user.email.split('@')[0]).toLowerCase()
}
checkAuth()
let m = '';
async function h(e){
  let f = e.target.files[0];
  if(!f) return;
  if(f.size > 15*1024*1024){ showToast('Video perusu da! 15MB kulla irukura video eduthuko'); e.target.value=''; return; }
  let u = URL.createObjectURL(f);
  let vid=document.createElement('video'); vid.preload='metadata'; vid.onloadedmetadata=async()=>{
    if(vid.duration > 35){ showToast('Reel 30 sec ku mela irukku da! Cut pannitu vaa'); e.target.value=''; return; }
    document.getElementById('prev').innerHTML = `<video src="${u}" autoplay loop muted controls playsinline></video>`;
    document.getElementById('prog').style.display='block';
    document.getElementById('progText').innerText='Uploading Reel... '+Math.round(vid.duration)+' sec • '+formatSize(f.size);
    document.getElementById('progSize').innerText=formatSize(f.size);
    document.getElementById('progFill').style.width='30%';
    document.getElementById('info').innerText='✅ Size OK: '+formatSize(f.size)+' • Duration: '+Math.round(vid.duration)+' sec • Storage Saved!';
    showToast('Uploading... ⏳');
    let fileName = Date.now() + '_' + ME_RAW + '_' + f.name.replace(/[^a-zA-Z0-9.]/g,'_');
    let {data, error} = await supa.storage.from('reels').upload(fileName, f);
    if(error){ showToast('Adutha side la problem da - Try again'); document.getElementById('prog').style.display='none'; return; }
    let {data: urlData} = supa.storage.from('reels').getPublicUrl(fileName);
    m = urlData.publicUrl;
    // ✅ NO localStorage / sessionStorage - URL la Thaan da
    document.getElementById('progFill').style.width='100%';
    document.getElementById('progText').innerText='Upload Done ✅';
    showToast('Upload Done da 🔥 Next ku po da');
  };
  vid.src=u;
}
function go(){
  if(!m){ showToast('Video select pannu da - Upload aagattum'); return; }
  location.href = 'reels-upload.html?media='+encodeURIComponent(m)+'&type=video';
}
</script></body></html>
