<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>
*{margin:0;box-sizing:border-box}body{background:#fff;color:#111;font-family:sans-serif;max-width:450px;margin:auto;min-height:100vh;padding-bottom:20px}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}.top b{font-size:20px;font-weight:900}
.logo{text-align:center;padding:20px 10px 0}.logo h1{font-size:44px;line-height:1;font-weight:900}.logo h1 span{color:#FF4D8D}.logo p{font-size:14px;color:#888;margin-top:6px}
.prev{margin:16px 12px;height:360px;background:#f8f8f8;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#999;font-size:14px}.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}.cell{padding:18px;background:#f8f8f8;border-radius:14px;text-align:center;cursor:pointer;font-weight:800;font-size:14px}.cell span{display:block;font-size:12px;font-weight:400;color:#888;margin-top:4px}
.btn{margin:12px;background:#111;border:0;width:calc(100% - 24px);padding:15px;border-radius:14px;font-weight:900;color:#fff;font-size:16px;cursor:pointer}
.btn2{margin:0 12px 12px;background:#fff;border:1px solid #eee;color:#111;width:calc(100% - 24px);padding:14px;border-radius:14px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.5}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.info{margin:0 12px;padding:10px;font-size:12px;color:#888;text-align:center}
.trimBox{margin:12px;padding:16px;border-radius:16px;background:#f8f8f8}
input[type=range]{width:100%;accent-color:#FF4D8D;margin:8px 0}
#bar{height:6px;background:#eee;border-radius:20px;overflow:hidden;margin:12px;display:none}#bar div{height:100%;width:0%;background:#FF4D8D;transition:.3s}
</style></head><body>
<div class="top"><b id="pageTitle">New Reel</b><span onclick="location.href='index.html'" style="font-size:24px;cursor:pointer">✕</span></div>

<div id="step1">
<div class="logo"><h1>Pix<span>o</span>ro</h1><p>Create • Share • Grow</p></div>
<div style="text-align:center;padding:12px"><div style="font-size:44px">🎬</div><div style="font-size:17px;margin-top:6px;color:#333">Select a video to create<br>your Reel</div></div>
<div class="prev" id="prev">Select Video</div>
<div class="info">Max: 30 Sec • Trim inside</div>
<div class="grid" style="margin-top:10px"><div class="cell" onclick="document.getElementById('f').click()">Gallery<span>Video Select</span></div><div class="cell" onclick="document.getElementById('f').click()">Add Video<span>From Phone</span></div></div>
<button class="btn" onclick="goEdit()">Next → Edit Video</button>
</div>

<div id="step2" style="display:none">
<div class="prev"><video id="editV" controls playsinline></video></div>
<div class="trimBox">
<div style="display:flex;justify-content:space-between;font-weight:800"><span id="tInfo">0.0s - 30.0s</span><span style="color:#FF4D8D;font-size:12px">TRIM</span></div>
<label style="font-size:12px;color:#888">START</label><input type="range" id="sR" min="0" max="60" step="0.1" value="0">
<label style="font-size:12px;color:#888">END</label><input type="range" id="eR" min="0" max="60" step="0.1" value="30">
<button onclick="previewTrim()" style="width:100%;background:#fff;border:1px solid #eee;padding:11px;border-radius:12px;font-weight:800;margin-top:8px;cursor:pointer">Preview Trim</button>
</div>
<div id="bar"><div id="fill"></div></div>
<div id="status" style="text-align:center;font-size:12px;color:#888"></div>
<button class="btn" id="nextBtn" onclick="goEditPage()">Next → Edit Page</button>
<button class="btn2" onclick="backSelect()">Back</button>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="f" hidden accept="video/*" onchange="h(event)">
<script>
let supa=window.supa, selFile=null, selUrl='', publicUrl='', dur=0, start=0, end=30, ME_RAW='', ME_ID='';
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
async function init(){let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}ME_ID=session.user.id;let {data:p}=await supa.from('profiles').select('*').eq('id',ME_ID).single();ME_RAW=(p?.username||session.user.email.split('@')[0]).toLowerCase();}
init();
function h(e){let f=e.target.files[0];if(!f)return;selFile=f;publicUrl='';selUrl=URL.createObjectURL(f);document.getElementById('prev').innerHTML=`<video src="${selUrl}" autoplay loop muted playsinline></video>`;showToast('Video Selected');}
function goEdit(){
  if(!selUrl){showToast('Select a video');return}
  document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';document.getElementById('pageTitle').innerText='Edit Video';
  let v=document.getElementById('editV');v.src=selUrl;v.onloadedmetadata=()=>{dur=v.duration;document.getElementById('sR').max=dur;document.getElementById('eR').max=dur;end=Math.min(30,dur);document.getElementById('eR').value=end;update();};
}
function backSelect(){document.getElementById('step2').style.display='none';document.getElementById('step1').style.display='block';document.getElementById('pageTitle').innerText='New Reel';}
function update(){start=parseFloat(document.getElementById('sR').value);end=parseFloat(document.getElementById('eR').value);if(end<=start)end=start+1;if(end-start>30)end=start+30;document.getElementById('eR').value=end;document.getElementById('tInfo').innerText=start.toFixed(1)+'s - '+end.toFixed(1)+'s';document.getElementById('editV').currentTime=start;}
document.getElementById('sR').oninput=update;document.getElementById('eR').oninput=update;
function previewTrim(){let v=document.getElementById('editV');v.currentTime=start;v.play();setTimeout(()=>v.pause(),(end-start)*1000);}
async function goEditPage(){
  if(!selFile){showToast('No video');return}
  let btn=document.getElementById('nextBtn');btn.disabled=true;btn.innerText='Uploading...';
  document.getElementById('bar').style.display='block';document.getElementById('fill').style.width='40%';document.getElementById('status').innerText='Uploading... 40%';
  try{
    let fileName=Date.now()+'_'+ME_RAW+'.mp4';
    let {error}=await supa.storage.from('reels').upload(fileName, selFile);
    if(error) throw error;
    document.getElementById('fill').style.width='80%';document.getElementById('status').innerText='Done... 80%';
    let {data}=supa.storage.from('reels').getPublicUrl(fileName);
    publicUrl=data.publicUrl;
    let q=new URLSearchParams({media:publicUrl,type:'video',trim_start:String(start),trim_end:String(end)});
    location.href='reel-edit.html?'+q.toString();
  }catch(e){showToast('Try again');btn.disabled=false;btn.innerText='Next → Edit Page';}
}
</script></body></html>
