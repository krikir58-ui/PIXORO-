<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #FFD700}.top b{color:#FFD700}
.prev{margin:12px;height:400px;background:#111;border:2px dashed #FFD700;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}.cell{aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer}
.btn{margin:12px;background:#FFD700;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900;color:#000}
</style></head><body>
<div class="top"><b>New Reel 🎬</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">🎬 Real Video Select Pannu</div>
<div class="grid"><div class="cell" onclick="location.href='camera.html?type=reel'">🎥 Camera</div><div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div><div class="cell" onclick="document.getElementById('f').click()">➕ Add</div></div>
<button class="btn" onclick="go()">Next →</button>
<input type="file" id="f" hidden accept="video/*" onchange="h(event)">
<script>let m='';function h(e){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);m=u;document.getElementById('prev').innerHTML=`<video src="${u}" autoplay loop controls></video>`;localStorage.setItem('pix_media',u);localStorage.setItem('pix_media_type','video');sessionStorage.setItem('pixoro_pending_media',u);sessionStorage.setItem('pixoro_pending_type','video')}
function go(){if(!m){alert('Video select pannu da Giri!');return}location.href='reels-upload.html'}</script></body></html>
