<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Live - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #111;position:sticky;top:0;background:#000;z-index:50;height:56px}
.liveCard{background:#111;border:1px solid #222;border-radius:16px;margin:12px;overflow:hidden}.liveCard img{width:100%;height:220px;object-fit:cover}
.badge{background:#ff3040;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:900}.badge.off{background:#222;color:#888}
.btn{width:calc(100% - 24px);margin:12px;padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.btnR{background:#ff3040;color:#fff}.btnW{background:#fff;color:#000}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#ff5ea8}.bottom-nav a.active svg{stroke:#ff5ea8}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#ff5ea8;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555}
</style></head><body>
<div class="top"><span onclick="location.href='index.html'" style="font-size:22px;cursor:pointer">←</span><b>🔴 Pixoro Live</b><span style="margin-left:auto;font-size:12px;color:#888" id="liveCount"></span></div>
<div style="padding:12px 14px"><b>Go Live da?</b><p style="font-size:12px;color:#888;margin-top:4px">Camera On Pannu - Followers Paapanga da</p></div>
<video id="cam" autoplay playsinline muted style="width:calc(100% - 24px);margin:0 12px;border-radius:16px;background:#111;height:280px;object-fit:cover"></video>
<div style="padding:12px"><input id="liveTitle" placeholder="Live Title - Eg: Talking with Giri 🔥" style="width:100%;padding:12px;background:#262626;border:0;color:#fff;border-radius:10px;outline:none"></div>
<button class="btn btnR" id="goBtn" onclick="toggleLive()">🔴 Go Live</button>
<div id="list"></div>
<div class="bottom-nav"><a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa, ME='', ME_ID='', STREAM=null, LIVE=false, LIVE_ID='';
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
async function toggleLive(){ if(LIVE){ await supa.from('lives').update({is_live:false}).eq('id',LIVE_ID); if(STREAM) STREAM.getTracks().forEach(t=>t.stop()); LIVE=false; document.getElementById('goBtn').innerText='🔴 Go Live'; document.getElementById('cam').srcObject=null; loadLives(); return } try{ STREAM=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('cam').srcObject=STREAM; }catch(e){ alert('Camera Permission Kudu da'); return } let title=document.getElementById('liveTitle').value||'Live with '+ME; let {data}=await supa.from('lives').insert({user_id:ME_ID,username:ME,title:title,is_live:true}).select('id').single(); LIVE_ID=data?.id; LIVE=true; document.getElementById('goBtn').innerText='⏹️ End Live'; loadLives(); }
async function loadLives(){ let {data}=await supa.from('lives').select('*').eq('is_live',true).order('created_at',{ascending:false}); let list=document.getElementById('list'); document.getElementById('liveCount').innerText=(data||[]).length+' Live'; if(!data||!data.length){ list.innerHTML=`<p style="text-align:center;padding:30px;color:#666">No one live da 😴<br><span style="font-size:12px">Nee Go Live Pannu da</span></p>`; return } list.innerHTML=data.map(l=>`<div class="liveCard"><img src="https://picsum.photos/400/220?random=${l.id}"><div style="padding:12px;display:flex;justify-content:space-between;align-items:center"><div><span class="badge">🔴 LIVE</span> <b style="margin-left:6px">@${cleanUser(l.username)}</b><p style="font-size:12px;color:#888;margin-top:4px">${l.title||''}</p></div><button onclick="alert('Joining @${cleanUser(l.username)} Live da 🔥')" style="background:#ff5ea8;color:#fff;border:0;padding:8px 16px;border-radius:20px;font-weight:700">Join</button></div></div>`).join(''); }
async function init(){ if(!window.supa){setTimeout(init,300);return} supa=window.supa; let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return} ME_ID=session.user.id; let {data:my}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME=cleanUser(my?.username||''); let navPfp=document.getElementById('navPfp'); if(navPfp) navPfp.src=my?.avatar_url||''; loadLives(); }
init();
</script></body></html>
