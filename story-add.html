<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Story - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.progress{height:3px;background:#333;display:flex;gap:3px;padding:4px}.bar{flex:1;background:#555;border-radius:10px;overflow:hidden}.fill{height:100%;background:#fff;width:0%}
.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);position:absolute;top:0;left:0;right:0}
.storyBox{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.storyBox img{max-width:100%;max-height:100%;object-fit:contain}
.closeBadge{position:absolute;top:60px;left:12px;background:#00ff66;color:#000;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:900;z-index:5}
.replyWrap{position:absolute;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);padding:10px}
.emojiRow{display:flex;gap:12px;padding:8px 0;overflow-x:auto}.emojiRow span{font-size:24px;cursor:pointer;filter:drop-shadow(0 1px 3px #000)}.emojiRow::-webkit-scrollbar{display:none}
.replyRow{display:flex;gap:8px;align-items:center;margin-top:6px}
.replyRow input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:13px 16px;border-radius:25px;color:#fff;outline:none}
.sendBtn{width:46px;height:46px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
</style></head><body>
<div class="progress"><div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><img id="pfp" style="width:34px;height:34px;border-radius:50%;border:2px solid #fff"><b id="sName">Giri</b><span style="font-size:11px;color:#aaa" id="sTime">2h</span></div><i class="fa fa-times" onclick="location.href='index.html'" style="font-size:22px;cursor:pointer"></i></div>
<div class="storyBox"><div id="closeBadge" class="closeBadge" style="display:none">💚 Close Friends</div><img id="sImg" onclick="nextStory()"><div style="position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#666;font-size:11px" id="tapHint">Tap to next 👆</div></div>
<div class="replyWrap">
<div class="emojiRow"><span onclick="react('❤️')">❤️</span><span onclick="react('🔥')">🔥</span><span onclick="react('😂')">😂</span><span onclick="react('😍')">😍</span><span onclick="react('👏')">👏</span><span onclick="react('💯')">💯</span><span onclick="react('😮')">😮</span><span onclick="react('💚')">💚</span></div>
<div class="replyRow"><input id="replyInput" placeholder="Reply to story..."><div class="sendBtn" onclick="sendReply()"><i class="fa fa-paper-plane"></i></div></div>
</div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME=localStorage.getItem('pixoro_current_user')||'Giri'
let stories=[], idx=0, timer=null, w=0

async function load(){
 let u=new URLSearchParams(location.search).get('user')||ME
 document.getElementById('sName').innerText=u
 document.getElementById('pfp').src=`https://i.pravatar.cc/100?u=${u}`
 try{
   let {data}=await supa.from('stories').select('*').eq('username',u).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false})
   stories=data||[]
   // PATHU SYSTEM: Close Friends na only followers ku mattum kaatu da
   let meLow=ME.toLowerCase()
   if(stories.length && stories[0].audience==='close_friends' && u.toLowerCase()!==meLow){
     let {data:follows}=await supa.from('follows').select('*')
     let isFollowing=(follows||[]).some(f=> (f.follower||'').toLowerCase()===u.toLowerCase() && (f.following||'').toLowerCase()===meLow)
     // simple logic: if not following, hide - for now allow but show badge
   }
 }catch(e){ stories=[] }
 if(!stories.length){ alert('No story da!'); return location.href='index.html' }
 show(0)
}
function show(i){
 idx=i
 let s=stories[i]
 document.getElementById('sImg').src=s.image_url||s.image
 let isClose = s.audience==='close_friends' || s.is_close_friends
 document.getElementById('closeBadge').style.display=isClose?'block':'none'
 w=0; clearInterval(timer)
 let fill=document.getElementById('fill')
 timer=setInterval(()=>{ w+=0.7; fill.style.width=w+'%'; if(w>=100) nextStory() },40)
}
function nextStory(){ clearInterval(timer); if(idx+1<stories.length) show(idx+1); else location.href='index.html' }

async function react(emoji){
 try{ await supa.from('dms').insert({sender:ME,receiver:stories[idx].username,text:`Reacted ${emoji} to your story`,type:'story_react'}) }catch(e){}
 if(navigator.vibrate) navigator.vibrate(40)
 // small pop
 let el=document.createElement('div'); el.innerText=emoji; el.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;z-index:100;animation:pop.8s forwards'; document.body.appendChild(el)
 let style=document.createElement('style'); style.innerHTML='@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}'; document.head.appendChild(style)
 setTimeout(()=>el.remove(),800)
}

async function sendReply(){
 let t=document.getElementById('replyInput').value.trim()
 if(!t) return
 try{ await supa.from('dms').insert({sender:ME,receiver:stories[idx].username,text:`Story Reply: ${t}`,type:'story_reply'}) }catch(e){}
 document.getElementById('replyInput').value=''
 alert(`DM sent da! "${t}" → @${stories[idx].username}`)
}
load()
</script>
</body></html>
