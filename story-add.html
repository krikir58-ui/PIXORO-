<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Story - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding:15px}
.top{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #222;margin-bottom:20px}
.box{border:2px dashed #333;border-radius:15px;padding:30px;text-align:center;margin-bottom:20px;background:#111}
.box img{max-width:100%;max-height:300px;border-radius:10px;margin-bottom:10px}
input[type=file]{display:none}
.btn{background:#0095f6;color:#fff;border:0;padding:12px 20px;border-radius:8px;font-weight:700;width:100%;cursor:pointer;margin-top:10px;font-size:16px}
.btn:disabled{background:#555}
.opt{display:flex;gap:10px;margin:15px 0}
.opt button{flex:1;padding:10px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;cursor:pointer}
.opt button.active{background:#fff;color:#000}
.filterBar{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:5px}
.filterBar::-webkit-scrollbar{display:none}
.f{padding:8px 14px;border-radius:20px;background:#222;white-space:nowrap;cursor:pointer;font-size:13px;border:1px solid transparent}
.f.active{border-color:#fff;background:#333}
</style></head><body>
<div class="top"><span onclick="location.href='./index.html'" style="font-size:22px;cursor:pointer">←</span><b>Add to Story</b></div>

<div class="box" id="previewBox" onclick="document.getElementById('file').click()">
<div id="ph"><div style="font-size:50px">📸</div><p>Tap to select image / video</p><p style="font-size:12px;color:#666;margin-top:8px">Gallery la irunthu edukkalam da!</p></div>
<img id="prev" style="display:none">
</div>
<input type="file" id="file" accept="image/*,video/*">

<div class="filterBar" id="filterBar">
<div class="f active" onclick="setFilter('none',this)">Normal</div>
<div class="f" onclick="setFilter('grayscale(100%)',this)">B&W</div>
<div class="f" onclick="setFilter('sepia(100%)',this)">Sepia</div>
<div class="f" onclick="setFilter('contrast(150%) brightness(110%)',this)">Vivid</div>
<div class="f" onclick="setFilter('blur(1px) brightness(110%)',this)">Blur</div>
<div class="f" onclick="setFilter('hue-rotate(90deg)',this)">Hulk 💚</div>
</div>

<div class="opt">
<button id="bPublic" class="active" onclick="setAud('public',this)">🌍 Public</button>
<button id="bClose" onclick="setAud('close_friends',this)">💚 Close Friends</button>
</div>

<button class="btn" id="uploadBtn" onclick="upload()" disabled>Share Story 🔵</button>
<p id="status" style="text-align:center;margin-top:15px;color:#666;font-size:13px"></p>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME = localStorage.getItem('pixoro_current_user') || 'Giri'
let selectedFile=null, filter='none', audience='public', base64=''

document.getElementById('file').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return
  selectedFile=f
  let r=new FileReader()
  r.onload= ev=>{
    base64=ev.target.result
    document.getElementById('ph').style.display='none'
    let img=document.getElementById('prev')
    img.src=base64; img.style.display='block'; img.style.filter=filter
    document.getElementById('uploadBtn').disabled=false
  }
  r.readAsDataURL(f)
})

function setFilter(f,el){
  filter=f; document.getElementById('prev').style.filter=f
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('active')); el.classList.add('active')
}
function setAud(a,el){
  audience=a; document.querySelectorAll('.opt button').forEach(x=>x.classList.remove('active')); el.classList.add('active')
}

async function upload(){
  if(!selectedFile &&!base64){ alert('Image select pannu da!'); return }
  let btn=document.getElementById('uploadBtn'); btn.disabled=true; btn.innerText='Uploading... ⏳'
  document.getElementById('status').innerText='Uploading to Pixoro...'

  try{
    // 1. Try upload to storage bucket if exists, else use base64 data url directly
    let imageUrl = base64
    // If bucket 'stories' exists, upload
    try{
      let fileName = `${ME}_${Date.now()}_${selectedFile.name}`
      let {data, error} = await supa.storage.from('stories').upload(fileName, selectedFile)
      if(!error){
        let {data:pub}= supa.storage.from('stories').getPublicUrl(fileName)
        imageUrl = pub.publicUrl
      }
    }catch(e){ console.log('storage fallback to base64') }

    let expires = new Date(Date.now()+24*60*60*1000).toISOString()

    let {error} = await supa.from('stories').insert({
      username: ME,
      image_url: imageUrl,
      media_url: imageUrl,
      media_type: 'image',
      filter: filter,
      audience: audience,
      expires_at: expires
    })

    if(error) throw error

    document.getElementById('status').innerText='Story added! 🔵 Redirecting...'
    setTimeout(()=> location.href='./index.html', 1200)

  }catch(err){
    console.error(err)
    document.getElementById('status').innerText='Error: '+err.message
    btn.disabled=false; btn.innerText='Share Story 🔵'
  }
}
</script>
</body></html>
