<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story - Pixoro Black</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:80px}
.top{padding:14px;display:flex;align-items:center;justify-content:space-between;background:#000;border-bottom:1px solid #111}
.top b{font-size:18px}.top span{font-size:22px;cursor:pointer}
.chips{display:flex;gap:8px;padding:12px}
.chip{flex:1;background:#111;border:1px solid #222;border-radius:12px;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.chip:active{background:#222}
.bigPrev{margin:0 12px;border-radius:16px;overflow:hidden;aspect-ratio:9/13;background:#111;position:relative}
.bigPrev img,.bigPrev video{width:100%;height:100%;object-fit:cover;display:none}
.bigPrev.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#666;text-align:center;padding:20px}
.bigPrev.empty img,.bigPrev.empty video{display:none}
.filterBar{display:flex;gap:8px;overflow-x:auto;padding:12px}
.filterBar::-webkit-scrollbar{display:none}
.fbtn{padding:8px 14px;background:#111;border:1px solid #222;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.fbtn.active{border-color:#fff;background:#fff;color:#000;font-weight:700}
input,textarea{width:calc(100% - 24px);margin:0 12px;background:#111;border:1px solid #222;padding:12px;border-radius:12px;color:#fff;outline:none;box-sizing:border-box}
textarea{min-height:60px;resize:none}
.btnRow{display:flex;gap:8px;margin:12px}
.btnRow button{flex:1;background:#111;border:1px solid #222;color:#fff;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
.shareBtn{margin:0 12px;width:calc(100% - 24px);background:#fff!important;color:#000!important;border:0;padding:14px;border-radius:22px;font-weight:800;font-size:15px;cursor:pointer}
.closeBtn{margin:8px 12px;width:calc(100% - 24px);background:#002a14!important;border:1px solid #00ff66!important;color:#00ff66!important;padding:14px;border-radius:22px;font-weight:800;font-size:15px;cursor:pointer}
.backBtn{margin:12px;width:calc(100% - 24px);background:#111;border:1px solid #222;color:#888;padding:12px;border-radius:12px;cursor:pointer}
.recHead{display:flex;justify-content:space-between;padding:14px 12px}
.recHead b{font-size:16px}.recHead span{color:#888;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 2px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;cursor:pointer}
.grid.cam{background:#111;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#888;cursor:pointer}
.tabs{display:flex;justify-content:center;gap:28px;padding:14px;background:#111;margin:12px;border-radius:20px}
.tabs span{color:#888;font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer}.tabs span.act{color:#fff}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='index.html'">✕</span><b>Add to story</b><span>⚙️</span></div>
<div class="chips"><div class="chip">✨ Templates</div><div class="chip">🎵 Music</div><div class="chip">🖼️ Collage</div></div>

<div class="bigPrev" id="bigPrev">
  <img id="preview">
  <video id="previewVideo" autoplay muted loop playsinline></video>
  <div id="emptyMsg" style="text-align:center"><div style="font-size:40px">📷</div><div style="margin-top:10px">+ Add your photo or video</div><div style="font-size:12px;color:#666;margin-top:4px">Tap to import from Gallery or capture now</div></div>
</div>

<div class="filterBar">
  <div class="fbtn active" onclick="setF('none',this)">Normal</div>
  <div class="fbtn" onclick="setF('grayscale(1)',this)">B&W</div>
  <div class="fbtn" onclick="setF('sepia(1)',this)">Sepia</div>
  <div class="fbtn" onclick="setF('contrast(1.5) saturate(1.5)',this)">Vivid</div>
  <div class="fbtn" onclick="setF('blur(0.5px) brightness(1.2)',this)">Soft</div>
</div>

<textarea id="caption" placeholder="Caption + Poll + @Mention... Ex: Enna da poll? 😍"></textarea>
<div class="btnRow">
  <button onclick="addPoll()">📊 Poll</button>
  <button onclick="aiGen()" style="background:linear-gradient(to right,#111,#222);border:1px solid #333">🤖 AI Image</button>
  <button onclick="document.getElementById('file').click()">📁 Gallery</button>
</div>

<button class="shareBtn" onclick="up()">+ Share to Your Story ⭐</button>
<button class="closeBtn" onclick="upClose()">💚 Share to Close Friends</button>
<p id="st" style="text-align:center;color:#aaa;margin-top:10px"></p>

<div class="recHead"><b>Recents ∨</b><span onclick="document.getElementById('file').click()">Select</span></div>
<div class="grid" id="grid"><div class="cam" onclick="document.getElementById('file').click()">📷<span>Camera</span></div></div>

<div class="tabs"><span onclick="location.href='upload.html'">POST</span><span class="act">STORY</span><span onclick="location.href='reels-upload.html'">REEL</span><span>LIVE</span></div>
<button class="backBtn" onclick="location.href='index.html'">← Back to Home</button>
<input type="file" id="file" accept="image/*,video/*" hidden onchange="preview(this)">
<script>
const supa = supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME = localStorage.getItem('pixoro_current_user') || 'Giri'
let curFilter='none', mediaType='image', fileData='', base64Cache=''
function preview(input){
  if(input.files && input.files[0]){
    let f=input.files[0]
    mediaType = f.type.startsWith('video')?'video':'image'
    fileData=f
    let r=new FileReader()
    r.onload=e=>{ base64Cache=e.target.result }
    r.readAsDataURL(f)
    let url=URL.createObjectURL(f)
    document.getElementById('bigPrev').classList.remove('empty')
    document.getElementById('emptyMsg').style.display='none'
    if(mediaType==='video'){
      let v=document.getElementById('previewVideo'); v.src=url; v.style.display='block'; v.style.filter=curFilter
      document.getElementById('preview').style.display='none'
    }else{
      let im=document.getElementById('preview'); im.src=url; im.style.display='block'; im.style.filter=curFilter
      document.getElementById('previewVideo').style.display='none'
    }
  }
}
function setF(f, el){
  curFilter=f
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'))
  el.classList.add('active')
  document.getElementById('preview').style.filter=f
  document.getElementById('previewVideo').style.filter=f
}
function addPoll(){
  let q=prompt('Poll Question enna da Giri?')
  if(q){ document.getElementById('caption').value += `\n📊 POLL: ${q} (Yes/No)` }
}
function aiGen(){
  let p=prompt('AI Image prompt enna da? Ex: cyberpunk cat')
  if(p){
    let aiUrl=`https://picsum.photos/seed/${encodeURIComponent(p)}/400/700`
    document.getElementById('preview').src=aiUrl
    document.getElementById('preview').style.display='block'
    document.getElementById('previewVideo').style.display='none'
    document.getElementById('bigPrev').classList.remove('empty')
    document.getElementById('emptyMsg').style.display='none'
    fileData=null; base64Cache=aiUrl; window.aiImageUrl=aiUrl; mediaType='image'
  }
}
async function uploadFile(){
  if(window.aiImageUrl) return window.aiImageUrl
  let f=fileData
  if(!f) return null
  let name=Date.now()+'_'+f.name.replace(/\s/g,'_')
  try{
    let {error} = await supa.storage.from('stories').upload(name, f, {upsert:true})
    if(error) throw error
    let {data}=supa.storage.from('stories').getPublicUrl(name)
    return data.publicUrl
  }catch(e){ return base64Cache }
}
async function up(){ share('public') }
async function upClose(){ share('close_friends') }
async function share(audience){
  let fileInput=document.getElementById('file')
  if(!fileInput.files[0] &&!window.aiImageUrl){alert('File select pannu da Giri!');return;}
  document.getElementById('st').innerText='Uploading... ⏳ PIXORO SAFE 🛡️'
  let mediaUrl = await uploadFile()
  if(!mediaUrl){ document.getElementById('st').innerText='Upload failed!'; return }
  let expires=new Date(Date.now()+24*60*60*1000).toISOString()
  let localId='local_'+Date.now()
  let localStories=JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]')
  localStories.unshift({id:localId,username:ME,image_url:mediaUrl,image:mediaUrl,media_url:mediaUrl,media_type:mediaType,caption:document.getElementById('caption').value,filter:curFilter,audience:audience,is_close_friends: audience==='close_friends',stickers:[],expires_at:expires,created_at:new Date().toISOString()})
  localStorage.setItem('pixoro_local_stories',JSON.stringify(localStories))
  let {error}=await supa.from('stories').insert({username: ME,image_url: mediaUrl,image: mediaUrl,media_url: mediaUrl,media_type: mediaType,caption: document.getElementById('caption').value,filter: curFilter,audience: audience,is_close_friends: audience==='close_friends',stickers: [],expires_at: expires})
  if(error){ document.getElementById('st').innerText='⚠️ Local saved! Cloud: '+error.message } else { document.getElementById('st').innerText = audience==='close_friends'?'💚 Close Friends ku poyiduchu!':'✅ Your Story Added da Giri! 🔥' }
  setTimeout(()=>location.href='index.html',1200)
}
// Recents grid - video mari
let g=document.getElementById('grid')
for(let i=1;i<=11;i++){let im=document.createElement('img');im.src=`https://picsum.photos/300/400?${i+30}`;im.onclick=()=>{window.aiImageUrl=im.src; base64Cache=im.src; document.getElementById('preview').src=im.src; document.getElementById('preview').style.display='block'; document.getElementById('previewVideo').style.display='none'; document.getElementById('bigPrev').classList.remove('empty'); document.getElementById('emptyMsg').style.display='none'};g.appendChild(im)}
</script>
</body>
</html>
