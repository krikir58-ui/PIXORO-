<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add to story</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:14px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}.top span{font-size:22px}
.chips{display:flex;gap:8px;padding:0 12px 12px}
.chip{flex:1;background:#1a1a1a;border-radius:20px;padding:11px;text-align:center;font-size:13px;font-weight:600}
.recHead{display:flex;justify-content:space-between;padding:14px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.cell{aspect-ratio:1/1.4;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#888;font-size:12px;cursor:pointer;position:relative;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tabs{display:flex;justify-content:center;gap:30px;padding:14px;background:#1a1a1a;margin:12px;border-radius:24px}
.tabs span{color:#888;font-weight:700;font-size:13px;letter-spacing:.5px}.tabs span.act{color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
</style></head><body>
<div class="top"><span onclick="location.href='index.html'">✕</span><b>Add to story</b><span>⚙️</span></div>
<div class="chips"><div class="chip">✨ Templates</div><div class="chip">🎵 Music</div><div class="chip">🖼️ Collage</div></div>
<div class="recHead"><b>Recents ∨</b><span>☐ Select</span></div>
<div class="grid" id="grid">
  <div class="cell" onclick="openPicker()">📷<span>Camera</span></div>
  <div class="cell" onclick="openPicker()"><span style="font-size:22px">🖼️</span></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
  <div class="cell" onclick="openPicker()"></div>
</div>
<div class="tabs"><span id="tPOST" onclick="sw('POST',this)">POST</span><span id="tSTORY" class="act" onclick="sw('STORY',this)">STORY</span><span onclick="sw('REEL',this)">REEL</span><span onclick="sw('LIVE',this)">LIVE</span></div>
<div id="toast" class="toast"></div>
<input type="file" id="file" accept="image/*,video/*" hidden onchange="goNext(this)">
<script>
const supa = supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_');
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
let ME_RAW='giri', ME_ID=null
async function checkAuth(){
  let { data: { session } } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return; }
  ME_ID = session.user.id
  let { data: profile } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  ME_RAW = (profile?.username || session.user.email.split('@')[0]).toLowerCase()
}
checkAuth()
let urlParams = new URLSearchParams(location.search)
let urlMedia = urlParams.get('media')
if(urlMedia){
  setTimeout(()=>{ location.href='story-editor.html?media='+encodeURIComponent(urlMedia)+'&type='+(urlParams.get('type')||'image') }, 300)
}
function openPicker(){ document.getElementById('file').click() }
function sw(t,el){ document.querySelectorAll('.tabs span').forEach(s=>s.classList.remove('act')); el.classList.add('act'); if(t=='LIVE') location.href='live.html'; if(t=='POST') location.href='post-create.html'; if(t=='REEL') location.href='reel-create.html'; }
async function goNext(inp){
  if(!inp.files[0]) return
  let f=inp.files[0]
  showToast('Uploading Story... ⏳')
  let uploadFile = f
  if(f.type.startsWith('image/')){
    uploadFile = await new Promise(res=>{
      let img=new Image(); let url=URL.createObjectURL(f);
      img.onload=()=>{ let w=img.width,h=img.height; let maxW=720; if(w>maxW){ h=h*maxW/w; w=maxW; } let c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>{ res(new File([b],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})); },'image/jpeg',0.72); URL.revokeObjectURL(url); };
      img.onerror=()=>res(f); img.src=url;
    })
  }
  if(!ME_RAW) ME_RAW='giri'
  let fileName = Date.now()+'_'+ME_RAW+'_'+uploadFile.name.replace(/[^a-zA-Z0-9.]/g,'_')
  let {error}=await supa.storage.from('stories').upload(fileName, uploadFile)
  if(error){ showToast('Upload Fail: '+error.message); return; }
  let {data}=supa.storage.from('stories').getPublicUrl(fileName)
  let mType = f.type.startsWith('video')?'video':'image'
  location.href='story-editor.html?media='+encodeURIComponent(data.publicUrl)+'&type='+mType
}
</script></body></html>
