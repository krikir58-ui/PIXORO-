<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Story</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding:16px;font-family:sans-serif}.btn{width:100%;background:#fff;color:#000;padding:14px;border-radius:12px;font-weight:900;border:0;margin-top:12px}</style></head><body>
<div style="display:flex;justify-content:space-between"><span onclick="location.href='index.html'">← Back</span><b>Add Story 🔥</b><span></span></div>
<div style="margin-top:20px;border:2px dashed #444;border-radius:20px;padding:30px;text-align:center;background:#111" onclick="document.getElementById('file').click()"><div style="font-size:40px">📸</div><b>Tap to Select Photo</b></div>
<img id="preview" style="width:100%;max-height:60vh;object-fit:contain;background:#111;border-radius:16px;margin-top:12px;display:none">
<input type="file" id="file" accept="image/*" style="display:none">
<div style="display:flex;gap:8px;margin-top:12px"><button id="bPub" onclick="setAud('public')" style="flex:1;padding:10px;border-radius:20px;border:0;background:#fff;color:#000;font-weight:700">🌍 Public</button><button id="bClose" onclick="setAud('close_friends')" style="flex:1;padding:10px;border-radius:20px;border:0;background:#222;color:#00ff66">💚 Close</button></div>
<button class="btn" id="postBtn" onclick="upload()">Post Story 🚀</button>
<p id="status" style="text-align:center;color:#888;margin-top:10px;font-size:12px"></p>
<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME=localStorage.getItem('pixoro_current_user')||'Giri', img='', aud='public'
function setAud(a){aud=a; document.getElementById('bPub').style.background=a==='public'?'#fff':'#222'; document.getElementById('bPub').style.color=a==='public'?'#000':'#fff'; document.getElementById('bClose').style.background=a==='close_friends'?'#00ff66':'#222'; document.getElementById('bClose').style.color=a==='close_friends'?'#000':'#00ff66'}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=ev=>{img=ev.target.result; let p=document.getElementById('preview'); p.src=img; p.style.display='block'; document.getElementById('status').innerText='Ready ✅'}; r.readAsDataURL(f)})
async function upload(){
 if(!img){alert('Photo select pannu da!'); return}
 let btn=document.getElementById('postBtn'); btn.innerText='Posting...'; btn.disabled=true
 let expires=new Date(Date.now()+24*60*60*1000).toISOString()
 let localStories=JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]')
 localStories.unshift({id:Date.now(), username:ME, image_url:img, image:img, audience:aud, expires_at:expires, created_at:new Date().toISOString()})
 localStorage.setItem('pixoro_local_stories',JSON.stringify(localStories))
 document.getElementById('status').innerText='Local saved! Trying Supabase...'
 try{ await supa.from('stories').insert({username:ME, image_url:img, image:img, media_url:img, audience:aud, expires_at:expires}) }catch(e){ console.log(e) }
 alert('Story Posted da! ✅ - Home ku poren da!'); location.href='index.html'
}
</script>
</body></html>
