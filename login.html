<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding:20px}
.inp{width:100%;background:#111;border:1px solid #FFD700;padding:14px;border-radius:12px;color:#fff;margin-top:10px;outline:none}
.btn{width:100%;background:#FFD700;color:#000;padding:14px;border:0;border-radius:12px;font-weight:900;margin-top:14px;cursor:pointer}
.btn2{width:100%;background:#1a1a1a;color:#FFD700;padding:12px;border:1px solid #FFD700;border-radius:12px;margin-top:10px;cursor:pointer}
</style></head><body>
<div style="text-align:center;margin-top:30px"><b style="font-size:36px;color:#FFD700">PIXORO</b><div style="font-size:12px;color:#888;margin-top:6px">INSTAGRAM STYLE • 100% SAFE</div></div>

<div id="loginBox">
<input id="email" class="inp" placeholder="Email">
<input id="pass" type="password" class="inp" placeholder="Password">
<button class="btn" onclick="doLogin()">Login</button>
<button class="btn2" onclick="doGoogle()">Continue with Google</button>
<button class="btn2" onclick="showCreate()">Create New Account</button>
<p id="msg" style="text-align:center;margin-top:10px;color:#0f0"></p>
</div>

<div id="createBox" style="display:none">
<input id="cUser" class="inp" placeholder="@Username - giri_official">
<input id="cEmail" class="inp" placeholder="Email">
<input id="cPass" type="password" class="inp" placeholder="Password - Min 6 Letters">
<button class="btn" onclick="doSignup()">Sign Up - Free</button>
<button class="btn2" onclick="showLogin()">Back to Login</button>
</div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')

async function doSignup(){
  let u=document.getElementById('cUser').value.trim()
  let e=document.getElementById('cEmail').value.trim()
  let p=document.getElementById('cPass').value.trim()
  if(!u || !e.includes('@') || p.length<6) return alert('Username/Email/Password check pannu da - Password 6+ venum da')
  let {data,error} = await supa.auth.signUp({email:e, password:p, options:{data:{username:u}}})
  if(error) return alert(error.message)
  alert('Account Created da! Login pannu da 🔥')
  showLogin(); document.getElementById('email').value=e
}
async function doLogin(){
  let e=document.getElementById('email').value.trim()
  let p=document.getElementById('pass').value.trim()
  let {data,error} = await supa.auth.signInWithPassword({email:e, password:p})
  if(error) return alert(error.message)
  localStorage.setItem('pixoro_current_user', data.user.user_metadata.username || e)
  alert('Login Success da!'); location.href='index.html'
}
async function doGoogle(){
  await supa.auth.signInWithOAuth({provider:'google', options:{redirectTo:'https://krikir58-ui.github.io/pixoro/index.html'}})
}
function showCreate(){document.getElementById('loginBox').style.display='none';document.getElementById('createBox').style.display='block'}
function showLogin(){document.getElementById('loginBox').style.display='block';document.getElementById('createBox').style.display='none'}
</script></body></html>
