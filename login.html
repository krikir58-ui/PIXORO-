<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixoro Login</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.box{width:360px;text-align:center}.card{border:1px solid #262626;padding:20px;border-radius:10px;margin-bottom:10px}
input{width:100%;padding:11px;margin:6px 0;background:#121212;border:1px solid #333;color:#fff;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:11px;background:#0095F6;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.acc{display:flex;justify-content:space-between;padding:12px;border:1px solid #262626;border-radius:8px;margin:6px 0;cursor:pointer;text-align:left}
</style></head><body>
<div class="box">
<h1 style="font-family:cursive;font-size:36px">Pixoro</h1>
<div id="accList"></div>
<div class="card">
<input id="email" placeholder="Email - Ex: giri@gmail.com">
<input id="pass" type="password" placeholder="Password">
<button onclick="doLogin()">Log In - Pazhaya Password</button>
<button onclick="doSignup()" style="background:#262626">Create New Account</button>
<button onclick="showOtp()" style="background:#262626">OTP Login - Password Theriyala na</button>
<div id="otpBox" style="display:none;margin-top:10px">
<input id="otpCode" placeholder="6 Digit OTP - Gmail la vantha code">
<button onclick="verifyOtp()" style="background:#00c853">Verify OTP</button>
</div>
<button onclick="forgot()" style="background:none;color:#0095F6">Forgot Password? Reset Pannu da</button>
<p id="msg" style="color:#ff6b6b"></p>
</div>
<div class="card"><button onclick="addAccount()" style="background:#262626">+ Add Account - Friend ID</button></div>
<button onclick="doLogout()" style="background:#ed4956">Log Out</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supa = supabase.createClient("https://yecpltndhlzfjplzhcpm.supabase.co","sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_")
let saved = JSON.parse(localStorage.getItem('pixoro_accounts')||'[]')
let list = document.getElementById('accList')
saved.forEach(e=>{ list.innerHTML+=`<div class="acc" onclick="switchAcc('${e}')"><b>${e}</b><span>Login →</span></div>` })
function switchAcc(e){ document.getElementById('email').value=e; alert('Password / OTP podu da - '+e) }
function saveAcc(email){ let a=JSON.parse(localStorage.getItem('pixoro_accounts')||'[]'); if(!a.includes(email)) a.push(email); localStorage.setItem('pixoro_accounts',JSON.stringify(a)); localStorage.setItem('pixoro_current_user',email) }
async function doLogin(){
  let email=document.getElementById('email').value, pass=document.getElementById('pass').value
  let {error}=await supa.auth.signInWithPassword({email,password:pass})
  if(error) return document.getElementById('msg').innerText='Password thappu da! Friend password maathittan pola da - Forgot click pannu da'
  saveAcc(email); location.href='index.html'
}
async function doSignup(){
  let email=document.getElementById('email').value, pass=document.getElementById('pass').value
  let {error}=await supa.auth.signUp({email,password:pass})
  if(error) return document.getElementById('msg').innerText=error.message
  saveAcc(email); alert('Account Created da Giri!'); location.href='index.html'
}
async function showOtp(){
  let email=document.getElementById('email').value.trim()
  if(!email) return alert('Email podu da Giri')
  let {error}=await supa.auth.signInWithOtp({ email, options:{ shouldCreateUser: true } })
  if(error) alert(error.message); else { document.getElementById('otpBox').style.display='block'; alert('OTP Gmail ku pooyiruchu da! 6 Number check pannu da!') }
}
async function verifyOtp(){
  let email=document.getElementById('email').value.trim(), token=document.getElementById('otpCode').value.trim()
  if(!token) return alert('OTP Number podu da Giri')
  let {error}=await supa.auth.verifyOtp({email,token,type:'email'})
  if(error) return alert(error.message)
  saveAcc(email); alert('OTP Correct da!'); location.href='index.html'
}
async function forgot(){
  let email=document.getElementById('email').value
  if(!email) return alert('Email podu da')
  await supa.auth.resetPasswordForEmail(email)
  alert('Gmail la link pooyiruchu da - Pudhu password vei da')
}
function addAccount(){ document.getElementById('email').value=''; document.getElementById('pass').value=''; alert('Friend ID podu da Giri - Add aayidum da') }
async function doLogout(){ await supa.auth.signOut(); localStorage.removeItem('pixoro_current_user'); alert('Logged Out da - Account list irukkum da'); location.reload() }
</script></body></html>
