<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload Photo - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:sans-serif;max-width:400px;margin:auto;padding:20px}
input,textarea{width:100%;background:#111;border:1px solid #333;padding:12px;border-radius:10px;color:#fff;margin:10px 0;box-sizing:border-box}
button{background:#0095f6;border:0;color:#fff;padding:12px;width:100%;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h2>📸 New Post</h2>
<input type="file" id="file" accept="image/*">
<textarea id="cap" placeholder="Caption type pannu da..."></textarea>
<button onclick="up()">Share Post</button>
<p id="st" style="text-align:center;color:#aaa"></p>
<button onclick="location.href='index.html'" style="background:#222;margin-top:10px">Back</button>
<script>
const supa = supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
async function up(){
let f=document.getElementById('file').files[0];
if(!f){alert('Photo select pannu da!');return;}
document.getElementById('st').innerText='Uploading... ⏳';
let name=Date.now()+'_'+f.name;
let {error}=await supa.storage.from('posts').upload(name,f);
if(error){document.getElementById('st').innerText='Error: '+error.message;return;}
let {data}=supa.storage.from('posts').getPublicUrl(name);
await supa.from('posts').insert({image_url:data.publicUrl,caption:document.getElementById('cap').value,username:'Giri'});
document.getElementById('st').innerText='Posted ✅';setTimeout(()=>location.href='index.html',1000);
}
</script>
</body>
</html>
