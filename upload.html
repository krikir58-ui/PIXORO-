<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}
.top{padding:14px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.cell{aspect-ratio:1;background:#222;display:flex;align-items:center;justify-content:center}
.tabs{margin:12px;background:#222;border-radius:30px;display:flex;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:#888;padding:10px;border-radius:20px;font-weight:700}
.tabs button.on{background:#fff;color:#000}
.next{margin:0 12px;background:#fff;border:0;width:calc(100% - 24px);padding:13px;border-radius:20px;font-weight:900}
</style></head><body>
<div class="top"><span>Recents ▼</span><span>Select</span></div>
<div class="grid"><div class="cell" onclick="document.getElementById('f').click()">📷 Camera</div><div class="cell">Photo 1</div><div class="cell">Photo 2</div></div>
<div class="tabs">
<button id="bPost" class="on" onclick="sel('post',this)">POST</button>
<button onclick="sel('story',this)">STORY</button>
<button onclick="sel('reel',this)">REEL</button>
<button onclick="sel('live',this)">LIVE</button>
</div>
<button class="next" onclick="go()">Next →</button>
<input type="file" id="f" hidden accept="image/*,video/*" onchange="localStorage.setItem('pix_media','yes')">
<script>
let mode='post';
function sel(t,el){mode=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function go(){
 if(mode==='post') location.href='post-upload.html';
 else if(mode==='story') location.href='story-upload.html';
 else if(mode==='reel') location.href='reels-upload.html';
 else alert('LIVE soon da');
}
</script></body></html>
