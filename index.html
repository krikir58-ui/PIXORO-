<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V1 - GIRI</title>
<style>
body{background:#000; color:white; font-family:Arial; margin:0; padding:0;}
.box{background:#121212; border:1px solid #333; border-radius:12px; padding:15px; margin:10px;}
h1{color:#FFD700; text-align:center;}
button{background:#FFD700; color:black; border:none; padding:10px 20px; border-radius:20px; font-weight:bold;}
#posts{padding:10px;}
.post-card{background:#1a1a1a; border-radius:12px; margin-bottom:15px; overflow:hidden; border:1px solid #2a2a2a;}
.ad-card{background:linear-gradient(135deg,#000,#1a1a00); border:2px solid #FFD700; border-radius:12px; padding:15px; margin-bottom:15px; text-align:center;}
</style>
</head>
<body>

<h1>PIXORO V1 🔥</h1>
<div class="box"><b>BLUE TICK VERIFICATION 👑</b></div>

<div id="authDiv" class="box">
<h3>Login Da Giri</h3>
<input id="li_user" placeholder="Username" style="width:90%; padding:8px;"><br><br>
<button onclick="loginUser()">Login</button>
<button onclick="logoutUser()">Logout</button>
</div>

<div id="feedDiv" class="feed">
<div class="box"><h3>🔥 Stories - 24hrs</h3><div id="stories"></div></div>
<div class="box" style="text-align:center;"><h3>PIXORO Feed</h3></div>
<div class="box"><h3>🔍 Search Users</h3></div>
<div class="box"><h3>📸 Story Pannu Da</h3><input type="file" id="storyFile"></div>
<div class="box"><h3>Post Pannu Da 📸</h3><input type="file" id="postFile"><br><br><textarea id="postCaption" placeholder="Caption..."></textarea><br><br><button onclick="createPost()">Post</button></div>

<div id="posts">Loading...</div>
</div>

<div id="storyView"></div>
<div id="userView"></div>
<div id="pfpView" onclick="closePfpView()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://yecpltndhlzfjpxqhbtu.supabase.co";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";"sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let curStories=[],curView=[],timer=null;
let postCount = 0;

async function loadPosts(){
  const {data,error} = await supabase.from('posts').select('*').order('created_at',{ascending:false});
  const container = document.getElementById('posts');
  if(error){container.innerHTML='Error'; return;}
  container.innerHTML='';
  postCount=0;
  
  data.forEach(post=>{
    postCount++;
    // POST
    const div=document.createElement('div');
    div.className='post-card';
    div.innerHTML=`
      <div style="padding:10px; display:flex; gap:10px;"><b>@${post.username||'user'}</b></div>
      <div style="background:#FFD700; color:black; padding:5px 10px; font-weight:bold;">👁️ ${post.views||1246} Views | 💰 ₹${post.earnings||'9.34'} | 4K=₹30</div>
      ${post.image_url?`<img src="${post.image_url}" style="width:100%;">`:''}
      <div style="padding:10px;">${post.caption||''}</div>
    `;
    container.appendChild(div);
    
    // AD - EVERY 1 POST (TESTING) - aprom 3 nu maathu da
    if(postCount % 1 === 0){
      const ad=document.createElement('div');
      ad.className='ad-card';
      ad.innerHTML=`
        <span style="background:#FFD700; color:black; font-size:10px; padding:3px 8px; border-radius:10px; font-weight:bold;">SPONSORED AD</span>
        <h3 style="color:#FFD700;">🔥 Watch Ad & Earn ₹5 🔥</h3>
        <p style="color:#aaa; font-size:12px;">Ad paaru da Giri!</p>
        <button onclick="alert('₹5 Earned da Giri! 💰'); this.innerText='✅ Earned!'">Watch Ad Now</button>
      `;
      container.appendChild(ad);
    }
  });
}

function loginUser(){let u=li_user.value; localStorage.setItem('pixoro_user',u); alert('Logged in da '+u); loadPosts();}
function logoutUser(){localStorage.removeItem('pixoro_user'); alert('Logged out da');}
async function createPost(){alert('Post create pannu da Giri!');}

loadPosts();
</script>

</body>
</html>
