<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO 🔥</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}
#feed img{width:100%;border-radius:12px;margin:12px 0;display:block}
button{background:red;color:white;border:none;padding:12px;width:100%;border-radius:20px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<h2>PIXORO 🔥</h2>
<input type="file" id="fileInput" accept="image/*">
<button onclick="handlePost()">Post</button>
<p id="msg" style="color:lightgreen;text-align:center"></p>
<div id="feed"></div>
<script>
function showPosts(){
 let p=JSON.parse(localStorage.getItem("pixoro_posts")||"[]");
 document.getElementById("feed").innerHTML=p.map(u=>`<img src="${u}">`).join("");
}
function handlePost(){
 let input=document.getElementById("fileInput");
 if(!input.files[0]){alert("Photo select pannu da");return}
 let reader=new FileReader();
 reader.onload=function(e){
  let posts=JSON.parse(localStorage.getItem("pixoro_posts")||"[]");
  posts.unshift(e.target.result);
  localStorage.setItem("pixoro_posts",JSON.stringify(posts));
  document.getElementById("msg").innerText="Semma da Giri! Post Ready!";
  showPosts();
 };
 reader.readAsDataURL(input.files[0]);
}
showPosts();
</script>
</body>
</html>
