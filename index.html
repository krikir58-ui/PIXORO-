<!DOCTYPE html>
<html style="background:#fff">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXORO</title>
<style>
html,body{background:#fff;margin:0;padding:0}
*{box-sizing:border-box;font-family:-apple-system,sans-serif}
#splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center}
#splash.hide{transform:scale(1.1);opacity:0;pointer-events:none;transition:all 0.35s ease}
.splash-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.splash-logo{width:85px;height:85px;border-radius:22px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:48px;animation:pop 0.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.splash-bottom{padding-bottom:40px;text-align:center}
#app{display:none}
#app.show{display:block;animation:appIn 0.3s ease}
@keyframes appIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
/* YOUR APP CSS */
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbdbdb;padding:12px 16px;display:flex;justify-content:space-between;z-index:90}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.post{max-width:470px;margin:0 auto 12px;background:#fff;border:1px solid #dbdbdb;border-radius:8px;overflow:hidden}
.post img{width:100%;display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:12px 0 18px;z-index:90}
.bottom-nav i{font-size:24px;cursor:pointer}.bottom-nav i.active{color:#ff004f}
.authBox{width:350px;background:#fff;border:1px solid #dbdbdb;padding:30px 20px;border-radius:8px;text-align:center;margin:60px auto}
.authBox input{width:100%;padding:10px;margin:6px 0;border:1px solid #dbdbdb;border-radius:4px}
.authBox button{width:100%;padding:10px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-weight:600;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:1000}.modal.active{display:flex}.modalBox{background:#fff;border-radius:12px;width:90%;max-width:400px;padding:20px}
.bottom-sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:flex-end}.bottom-sheet.active{display:flex}.sheet-box{background:#1e1e1e;width:100%;border-radius:20px 20px 0 0;padding:20px;color:#fff}
.tab-section{display:none;max-width:470px;margin:0 auto;padding:10px}.tab-section.active{display:block}
</style>
</head>
<body>

<!-- SPLASH = FIRST PAINT - NO WHITE -->
<div id="splash">
<div class="splash-center"><div class="splash-logo">📸</div><div style="font-weight:900;font-size:28px;margin-top:14px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</div></div>
<div class="splash-bottom"><div style="color:#999;font-size:12px">from</div><div style="font-weight:900;color:#ff004f">∞ GIRI</div></div>
</div>

<div id="app">
<div id="authPage"><div class="authBox"><h1 style="font-weight:900;font-size:32px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</h1><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Log In</button><button onclick="guestLogin()" style="background:#000;margin-top:12px">⚡ Fast Guest Login</button></div></div>
<div id="mainPage" style="display:none"><div class="header"><div class="logo">PIXORO</div><i class="fa-solid fa-right-from-bracket" onclick="logout()"></i></div><div id="homeTab" class="tab-section active"><div id="posts"></div></div><div id="searchTab" class="tab-section"><div id="searchResults"></div></div><div id="reelsTab" class="tab-section"><div id="reels"></div></div><div id="profileTab" class="tab-section"><div style="text-align:center;padding:30px"><h2 id="profileName">GIRI</h2><p id="profileEmail"></p><button onclick="logout()" style="margin-top:10px;padding:8px 16px;background:#ff3040;color:#fff;border:none;border-radius:8px">Logout</button><div id="myPosts"></div></div></div><div class="bottom-nav"><i id="nav-home" class="fa-solid fa-house active" onclick="switchTab('home')"></i><i id="nav-search" class="fa-solid fa-magnifying-glass" onclick="switchTab('search')"></i><i class="fa-regular fa-square-plus" onclick="openBottomSheet()"></i><i id="nav-reels" class="fa-solid fa-clapperboard" onclick="switchTab('reels')"></i><i id="nav-profile" class="fa-regular fa-user" onclick="switchTab('profile')"></i></div></div>
</div>

<div id="createModal" class="modal"><div class="modalBox"><input id="postImage" placeholder="Image URL" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:10px 0"><input id="postCaption" placeholder="Caption" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px"><button onclick="createPost()" style="width:100%;padding:11px;background:#0095f6;color:#fff;border:none;border-radius:8px;margin-top:10px">Share</button><button onclick="closeCreate()" style="width:100%;margin-top:8px;padding:10px;background:#eee;border:none;border-radius:8px">Cancel</button></div></div>
<div id="bottomSheet" class="bottom-sheet" onclick="closeBottomSheet()"><div class="sheet-box" onclick="event.stopPropagation()"><div onclick="openCreate()" style="padding:16px;border-bottom:1px solid #333">📷 POST</div><div onclick="openCreate()" style="padding:16px">🎬 REEL</div></div></div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script>
// INSTAGRAM SPEED LOGIC - NO WHITE SCREEN EVER
const app=document.getElementById('app');
const splash=document.getElementById('splash');
const authPage=document.getElementById('authPage');

// Show splash instantly (already visible) -> after 0.8s like insta -> show app with zoom
setTimeout(()=>{
splash.classList.add('hide');
app.style.display='block';
app.classList.add('show');
authPage.style.display='block';
setTimeout(()=>{splash.style.display='none'},350);
},800); // 0.8s logo speed - Instagram same

// Load supabase AFTER splash - so no white block
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
<script>
let currentUser=null,allPosts=[];
function waitSupa(cb){const i=setInterval(()=>{if(window.supabase){clearInterval(i);cb()}},50)}
const SUPABASE_URL="https://rrjrmvdvyqvtjdwdhmsd.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyanJtdmR2eXF2dGpkd2RobXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyODk3OTYsImV4cCI6MjA3Mzg2NTc5Nn0.o3J4YjRjK3a8v5b9c2d1e6f7g8h9i0j1k2l3m4n5o6p";
function getSupa(){return supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}
function switchTab(t){document.querySelectorAll('.tab-section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.bottom-nav i').forEach(x=>x.classList.remove('active'));document.getElementById(t+'Tab').classList.add('active');document.getElementById('nav-'+t)?.classList.add('active');if(t==='reels')document.getElementById('reels').innerHTML=document.getElementById('posts').innerHTML;if(t==='profile'&&currentUser){document.getElementById('myPosts').innerHTML=document.getElementById('posts').innerHTML}}
function openBottomSheet(){document.getElementById('bottomSheet').classList.add('active')}
function closeBottomSheet(){document.getElementById('bottomSheet').classList.remove('active')}
function openCreate(){document.getElementById('createModal').classList.add('active')}
function closeCreate(){document.getElementById('createModal').classList.remove('active')}
function guestLogin(){currentUser={email:"giri@pixoro.app"};showMain()}
function login(){guestLogin()}
function showMain(){document.getElementById('authPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('profileEmail').innerText=currentUser.email;document.getElementById('profileName').innerText=currentUser.email.split('@')[0].toUpperCase();waitSupa(loadPosts)}
async function createPost(){const url=document.getElementById('postImage').value;if(!url)return;waitSupa(async()=>{try{await getSupa().from('posts').insert({image_url:url,caption:document.getElementById('postCaption').value,username:currentUser.email.split('@')[0],likes:0})}catch{}closeCreate();loadPosts()})}
async function loadPosts(){try{const {data}=await getSupa().from('posts').select('*').order('created_at',{ascending:false});allPosts=data||[];document.getElementById('posts').innerHTML=allPosts.map(p=>`<div class="post"><div style="padding:10px;font-weight:600">${p.username}</div><img src="${p.image_url}"><div style="padding:10px"><b>${p.username}</b> ${p.caption||''}</div></div>`).join('')||'<p style="text-align:center;margin-top:40px;color:#999">No posts da! + thodu 👇</p>'}catch{}}
async function logout(){location.reload()}
</script>
</body>
</html>
