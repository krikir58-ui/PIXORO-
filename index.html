<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.header{background:#111;padding:12px;text-align:center;font-weight:bold;font-size:22px;position:fixed;top:0;width:100%;z-index:100;border-bottom:1px solid #333}.header span{color:#ff0050}.feed{margin-top:60px;margin-bottom:70px;max-width:500px;margin:0 auto}.post{background:#111;margin-bottom:15px;border:1px solid #222;border-radius:10px;overflow:hidden}.post-top{padding:10px;display:flex;justify-content:space-between}.post-img{width:100%;height:500px;object-fit:cover;background:#222}.post-actions{padding:10px;display:flex;gap:15px}.btn{background:none;border:none;color:#fff;font-size:20px}.report-btn{background:red;color:#fff;border:none;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}.bottom{position:fixed;bottom:0;width:100%;background:#111;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #333}.bottom button{background:none;border:none;color:#fff;font-size:22px}.login-box{margin-top:100px;text-align:center;padding:20px}input{padding:10px;border-radius:8px;border:none;width:250px;margin:5px}
</style>
</head>
<body>
<div class="header">PIX<span>ORO</span> 🔥</div>

<div id="loginBox" class="login-box">
<h2>PIXORO Login</h2><br>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()" style="background:#ff0050;color:#fff;padding:10px 30px;border:none;border-radius:8px;">Login</button>
</div>

<div id="feed" class="feed" style="display:none;"></div>

<!-- UPLOAD BOX - ITHU THAN PUTHUSU DA GIRI -->
<div id="uploadBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;padding:20px;text-align:center;">
<h3 style="margin-top:40px;">Post Podu da Giri! 🔥</h3><br>
<input id="captionInput" placeholder="Caption enna da?" style="width:90%;padding:12px;"><br><br>
<input type="file" id="fileInput" accept="image/*" style="width:90%;color:white;"><br><br>
<img id="preview" style="width:220px;height:300px;object-fit:cover;display:none;border-radius:10px;margin:10px auto;border:2px solid #ff0050;"><br>
<button onclick="uploadRealPost()" style="background:#ff0050;color:white;padding:12px 30px;border:none;border-radius:20px;font-weight:bold;">POST PANNU DA 🚀</button><br><br>
<button onclick="document.getElementById('uploadBox').style.display='none'" style="background:#333;color:white;padding:10px 20px;border:none;border-radius:20px;">Cancel</button>
</div>

<div class="bottom" id="bottomNav" style="display:none;">
<button onclick="loadFeed()">🏠</button>
<button onclick="addPost()">➕</button>
<button onclick="logout()">🚪</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwOxSyjqp2OoT2PoxSyHojksr5r58vQ10",
  authDomain: "pixoro-75927.firebaseapp.com",
  projectId: "pixoro-75927",
  storageBucket: "pixoro-75927.firebasestorage.app",
  messagingSenderId: "814840120295",
  appId: "1:814840120295:web:6c02c613df5a17209bf342"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();let currentUser=null;
auth.onAuthStateChanged(u=>{if(u){currentUser=u;loginBox.style.display="none";feed.style.display="block";bottomNav.style.display="flex";loadFeed();}else{loginBox.style.display="block";feed.style.display="none";bottomNav.style.display="none";}});
function login(){let e=email.value.trim();let p=pass.value.trim();auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p));}
function logout(){auth.signOut();}
async function loadFeed(){let s=await db.collection("reels").orderBy("createdAt","desc").get();let h="";s.forEach(d=>{let x=d.data();let fake=(x.reports||0)>=3;h+=`<div class="post"><div class="post-top"><b>${x.email}</b><button class="report-btn" onclick="reportFake('${d.id}')">🚨 Report</button></div>${fake?`<div style="background:red;text-align:center;padding:8px;font-weight:bold;">🚨 ALERT! Idhu FAKE ID da! 🚨</div>`:""}<img class="post-img" src="${x.videoUrl}"><div class="post-actions"><button class="btn" onclick="likePost('${d.id}',${x.likes||0})">❤️</button><span>${x.likes||0} likes</span></div><div style="padding:0 10px 10px;"><b>${x.email}</b> ${x.caption}</div></div>`});if(!h)h="<p style='text-align:center;margin-top:50px;color:#666;'>No posts da Giri! + thottu first post podu da!</p>";feed.innerHTML=h;}
async function likePost(id,l){await db.collection("reels").doc(id).update({likes:l+1});loadFeed();}
async function reportFake(id){if(!confirm("Fake ID ah da?"))return;await db.collection("reels").doc(id).update({reports:firebase.firestore.FieldValue.increment(1)});alert("Report pannita! 3 vantha Red Alert!");loadFeed();}
function addPost(){uploadBox.style.display='block';}
document.getElementById('fileInput').addEventListener('change',e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';};r.readAsDataURL(f);}});
async function uploadRealPost(){let cap=captionInput.value.trim();if(!cap){alert("Caption podu da!");return;}let imgUrl="https://picsum.photos/500/700?random="+Math.random();let f=fileInput.files[0];if(f){imgUrl=await new Promise(res=>{let r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}await db.collection("reels").add({email:currentUser.email.split("@")[0],caption:cap,videoUrl:imgUrl,likes:1,reports:0,createdAt:new Date()});uploadBox.style.display='none';captionInput.value='';preview.style.display='none';fileInput.value='';alert("Post pannita da Giri! 🔥");loadFeed();}
</script>
</body>
</html>
