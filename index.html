<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:470px;min-height:100vh;background:#fff;position:relative}
.insta{font-family:'Grand Hotel',cursive;font-size:34px}
#splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2.5px;border-radius:50%;display:inline-block}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #efefef;display:flex;justify-content:space-between;padding:10px 12px;align-items:center}
.stories{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #efefef}
.post{border-bottom:1px solid #efefef}
.bottom{position:fixed;bottom:0;width:100%;max-width:470px;background:#000;color:#fff;display:flex;justify-content:space-around;padding:14px 0;font-size:22px;z-index:30}
.modal{position:fixed;inset:0;z-index:100;display:none;background:#fff;flex-direction:column}.modal.on{display:flex}
#noti{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:200;display:none}
.badge{background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
#zoomModal{background:rgba(0,0,0,.92);align-items:center;justify-content:center}
#zoomModal img{width:85vw;height:85vw;max-width:320px;max-height:320px;border-radius:50%;border:4px solid #fff}
.listItem{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f2f2f2}
</style>
</head><body>
<div id="splash"><div class="logo">📸</div></div>
<div id="app">
<div class="top"><div class="insta">Pixoro</div><div>❤️ ✈️</div></div>
<div class="stories" id="stories"></div>
<div style="display:flex;gap:8px;padding:12px;border-bottom:1px solid #efefef;align-items:center"><img src="https://i.pravatar.cc/80?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="quickCap" placeholder="What's on mind?" style="flex:1;border:0;outline:none;font-size:14px;font-family:Poppins"><button onclick="openUpload()" style="background:#0095f6;color:#fff;border:0;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700">Post</button></div>
<div id="feed" style="padding-bottom:80px"></div>
<div class="bottom"><span>🏠</span><span>🔍</span><span onclick="openUpload()" style="border:1px solid #fff;padding:2px 14px;border-radius:8px">+</span><span>🎬</span><span onclick="openProfilePage('girikri')">👤</span></div>

<div id="uploadModal" class="modal"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeUpload()">✕</span><b>New post</b><span onclick="shareNow()" style="color:#0095f6;font-weight:700">Share</span></div><div style="flex:1;background:#111;display:flex;align-items:center;justify-content:center" onclick="document.getElementById('fileInput').click()"><div id="previewBox" style="display:none;width:100%;height:100%"><img id="previewImg" style="width:100%;height:100%;object-fit:contain"></div><p id="noPhoto" style="color:#fff">Tap + to select</p></div><textarea id="captionInput" placeholder="Caption @mention #tag" style="padding:12px;border:0;outline:none" rows="2"></textarea></div>

<div id="profilePage" class="modal" style="overflow-y:auto;z-index:90"><div style="padding:12px;border-bottom:1px solid #efefef;display:flex;justify-content:space-between"><span onclick="closeProfilePage()">←</span><b id="pUser" style="font-family:'Grand Hotel';font-size:26px">girikri</b><span>⋯</span></div><div style="padding:16px;display:flex;gap:16px;align-items:center"><div class="ring" onclick="openZoom(document.getElementById('pImg').src)"><img id="pImg" src="https://i.pravatar.cc/150?u=giri" style="width:86px;height:86px;border-radius:50%;padding:3px;background:#fff"></div><div style="flex:1;display:flex;justify-content:space-around;text-align:center"><div onclick="openFollowers()"><div id="pPosts" style="font-weight:700;font-size:18px">0</div><div style="font-size:12px">Posts</div></div><div onclick="openFollowers()"><div id="pFollowers" style="font-weight:700;font-size:18px">129</div><div style="font-size:12px">Followers</div></div><div onclick="openFollowing()"><div id="pFollowing" style="font-weight:700;font-size:18px">1</div><div style="font-size:12px">Following</div></div></div></div><div style="padding:0 16px"><p id="pName" style="font-weight:700">Giri 🔥</p><p style="font-size:13px;color:#555">Coimbatore | PIXORO Founder</p><p style="font-size:12px;margin-top:6px"><b id="pViews">1</b> Views • <b id="pLikes">130</b> Likes • <b id="pComments">12</b> Comments</p><div style="display:flex;gap:8px;margin-top:12px"><button id="followBtn" onclick="toggleFollow(currentP)" style="flex:1;background:#000;color:#fff;border:0;padding:9px;border-radius:8px;font-weight:700">Following</button><button style="flex:1;background:#efefef;border:0;padding:9px;border-radius:8px;font-weight:700">Message</button></div><div id="followReq" style="margin-top:10px;background:#fff3f4;border:1px solid #ffd1d6;padding:10px 12px;border-radius:10px;font-size:12px"><b>Follow Requests</b><br>whitezzz__04 wants to follow you<div style="display:flex;gap:8px;margin-top:8px"><button onclick="acceptReq()" style="background:#0095f6;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-weight:700">Accept</button><button onclick="rejectReq()" style="background:#efefef;border:0;padding:6px 14px;border-radius:6px">Reject</button></div></div></div><div id="pGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:16px"></div></div>

<!-- FOLLOWERS LIST MODAL -->
<div id="followListModal" class="modal" style="z-index:110"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeFollowList()">←</span><b id="followListTitle">Followers</b><span></span></div><div id="followList" style="overflow-y:auto"></div></div>

<!-- COMMENT MODAL -->
<div id="commentModal" class="modal" style="z-index:110"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeComment()">✕</span><b>Comments</b><span>⋯</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:12px"></div><div style="display:flex;gap:8px;padding:10px;border-top:1px solid #efefef"><img src="https://i.pravatar.cc/40?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="commentInput" placeholder="Add a comment..." style="flex:1;border:1px solid #efefef;border-radius:20px;padding:8px 14px;outline:none"><button onclick="postComment()" style="color:#0095f6;font-weight:700;border:0;background:0">Post</button></div></div>

<!-- PROFILE ZOOM -->
<div id="zoomModal" class="modal" onclick="closeZoom()"><img id="zoomImg" src=""><p style="color:#fff;margin-top:12px;font-size:12px">Tap to close • Profile zoom</p></div>

<div id="noti"></div><input type="file" id="fileInput" accept="image/*" hidden>
</div>
<script src="js/app.js"></script>
</body></html>
