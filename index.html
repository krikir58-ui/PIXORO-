<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f2f2;
  color:#111;
  padding-bottom:75px;
}

header{
  height:60px;
  background:#c2185b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

header button{
  background:none;
  border:0;
  color:white;
  font-size:23px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CREATE */
.create{
  background:white;
  padding:15px;
  margin-bottom:8px;
}

.create input[type="text"]{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:16px;
  outline:none;
}

.file{
  width:100%;
  margin-top:12px;
}

.post-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2196f3;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* POST */
.post{
  background:white;
  margin-bottom:10px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#2196f3;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

.user{
  flex:1;
}

.user b{
  display:block;
}

.user small{
  color:#777;
}

.more{
  border:0;
  background:none;
  font-size:25px;
}

.post-photo{
  width:100%;
  min-height:300px;
  background:linear-gradient(135deg,#2196f3,#673ab7);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:60px;
}

.post-photo img{
  width:100%;
  max-height:550px;
  object-fit:cover;
}

.actions{
  display:flex;
  gap:18px;
  padding:12px 18px;
}

.actions button{
  background:none;
  border:0;
  font-size:30px;
  cursor:pointer;
}

.like.active{
  color:#e91e63;
}

.likes{
  padding:0 18px 8px;
  font-weight:bold;
}

.caption{
  padding:5px 18px 15px;
}

.comments{
  padding:0 18px;
}

.comment{
  padding:7px 0;
}

.comment-box{
  display:flex;
  gap:8px;
  padding:12px 18px;
  border-top:1px solid #eee;
}

.comment-box input{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:20px;
}

.comment-box button{
  border:0;
  background:#2196f3;
  color:white;
  padding:9px 16px;
  border-radius:20px;
}

/* SEARCH */
.search-box{
  background:white;
  padding:15px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:16px;
}

.search-result{
  background:white;
  margin-top:8px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

/* PROFILE */
.profile{
  background:white;
  padding:25px;
  text-align:center;
}

.profile .avatar{
  margin:auto;
  width:80px;
  height:80px;
  font-size:35px;
}

.profile h2{
  margin:10px 0 5px;
}

.profile p{
  color:#777;
}

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.stats b{
  display:block;
  font-size:20px;
}

.profile-btn{
  margin-top:20px;
  padding:11px 30px;
  border:0;
  border-radius:8px;
  background:#c2185b;
  color:white;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:25px;
}

.bottom-nav span{
  display:block;
  font-size:11px;
  margin-top:3px;
}
  /* LOGIN */
#loginScreen{
  position:fixed;
  inset:0;
  background:#c2185b;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:white;
  padding:30px 22px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.login-box h1{
  color:#c2185b;
  font-size:35px;
  margin-bottom:8px;
}

.login-box p{
  color:#777;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.login-box button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#c2185b;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.logout-btn{
  background:#e91e63;
  color:white;
  border:0;
  padding:10px 20px;
  border-radius:8px;
  margin-top:15px;
  }
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">

  <div class="login-box">

    <h1>PIXORO</h1>
    <p>Login to continue</p>

    <input id="loginUser"
           type="text"
           placeholder="Username">

    <input id="loginPass"
           type="password"
           placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p id="loginMessage"></p>

  </div>

</div>

<header>
  <div class="logo">PIXORO</div>
  <button onclick="showPage('profile')">👤</button>
</header>

<!-- HOME -->
<section id="home" class="page active">

  <div class="create">
    <input id="captionInput" type="text"
           placeholder="What's on your mind?">

    <input id="imageInput"
           class="file"
           type="file"
           accept="image/*">

    <button class="post-btn" onclick="createPost()">
      + Create Post
    </button>
  </div>

  <div id="posts">

    <div class="post">

      <div class="post-head">
        <div class="avatar">P</div>

        <div class="user">
          <b>PIXORO User</b>
          <small>Just now</small>
        </div>

        <button class="more">⋮</button>
      </div>

      <div class="post-photo">
        📷
      </div>

      <div class="actions">
        <button class="like"
                onclick="toggleLike(this)">♡</button>

        <button onclick="focusComment(this)">💬</button>

        <button>↗</button>
      </div>

      <div class="likes">0 likes</div>

      <div class="caption">
        Welcome to PIXORO 🎉
      </div>

      <div class="comments"></div>

      <div class="comment-box">
        <input type="text" placeholder="Write a comment...">
        <button onclick="addComment(this)">Send</button>
      </div>

    </div>

  </div>
</section>

<!-- SEARCH -->
<section id="search" class="page">

  <div class="search-box">
    <input id="searchInput"
           type="text"
           placeholder="Search PIXORO..."
           oninput="searchUsers()">
  </div>

  <div id="searchResults">

    <div class="search-result">
      <div class="avatar">P</div>
      <div>
        <b>PIXORO User</b>
        <small>@pixoro</small>
      </div>
    </div>

  </div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">

  <div class="profile">

    <div class="avatar">P</div>

    <h2>PIXORO User</h2>
    <p>@pixoro</p>

    <div class="stats">
      <div>
        <b id="postCount">1</b>
        Posts
      </div>

      <div>
        <b>0</b>
        Followers
      </div>

      <div>
        <b>0</b>
        Following
      </div>
    </div>

    <button class="profile-btn">
      Edit Profile
    </button>

  </div>

</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button onclick="showPage('home')">
    🏠
    <span>Home</span>
  </button>

  <button onclick="showPage('search')">
    🔍
    <span>Search</span>
  </button>

  <button onclick="showPage('home'); scrollToCreate()">
    +
    <span>Post</span>
  </button>

  <button onclick="showPage('home')">
    ❤️
    <span>Like</span>
  </button>

  <button onclick="showPage('profile')">
    👤
    <span>Profile</span>
  </button>

</nav>

<script>

/* PAGE NAVIGATION */

function showPage(pageName){

  const pages = document.querySelectorAll(".page");

  pages.forEach(function(page){
    page.classList.remove("active");
  });

  const selected = document.getElementById(pageName);

  if(selected){
    selected.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* LIKE */

function toggleLike(button){

  button.classList.toggle("active");

  const post = button.closest(".post");
  const likes = post.querySelector(".likes");

  let count = parseInt(
    likes.innerText.replace(/\D/g,"")
  ) || 0;

  if(button.classList.contains("active")){

    count++;

    button.innerText = "♥";

  }else{

    count = Math.max(0,count-1);

    button.innerText = "♡";
  }

  likes.innerText = count + " likes";
}


/* COMMENT */

function addComment(button){

  const box = button.parentElement;
  const input = box.querySelector("input");

  const text = input.value.trim();

  if(text === ""){
    return;
  }

  const post = button.closest(".post");
  const comments = post.querySelector(".comments");

  const comment = document.createElement("div");

  comment.className = "comment";

  comment.innerHTML =
    "<b>You:</b> " +
    escapeHTML(text);

  comments.appendChild(comment);

  input.value = "";
}


/* COMMENT FOCUS */

function focusComment(button){

  const post = button.closest(".post");

  const input = post.querySelector(".comment-box input");

  if(input){
    input.focus();
  }
}


/* CREATE POST */
/* LOGIN */

function login(){
const username = document.getElementById("loginUser").value.trim();
const password = document.getElementById("loginPass").value.trim();
const message = document.getElementById("loginMessage");

if(username === "pixoro" && password === "123456"){
  document.getElementById("loginScreen").style.display = "none";
  message.innerText = "";
}else{
  message.innerText = "Invalid username or password";
  message.style.color = "#e91e63";
 }
  
</script>
  <!-- PIXORO REWARDS -->
<div id="rewardBox" style="
  margin:15px;
  padding:18px;
  border-radius:15px;
  background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
">
  <h2>💰 PIXORO Rewards</h2>

  <p>Views: <b id="totalViews">0</b></p>
  <p>Coins: <b id="totalCoins">0</b> 🪙</p>

  <button onclick="showWallet()">Wallet</button>
  <button onclick="requestPayout()">Request Payout</button>

  <p id="payoutMessage"></p>
</div>

<script>
let totalViews = 0;
let totalCoins = 0;

/* VIEW → COIN */
function addView(){

  totalViews++;

  // Every 100 views = 1 coin
  totalCoins = Math.floor(totalViews / 100);

  document.getElementById("totalViews").innerText = totalViews;
  document.getElementById("totalCoins").innerText = totalCoins;

}

/* WALLET */
function showWallet(){

  alert(
    "PIXORO WALLET\n\n" +
    "Views: " + totalViews + "\n" +
    "Coins: " + totalCoins
  );

}

/* PAYOUT DEMO */
function requestPayout(){

  const message = document.getElementById("payoutMessage");

  if(totalCoins < 100){

    message.innerText =
      "Minimum 100 coins required for payout.";

    message.style.color = "red";

    return;
  }

  message.innerText =
    "Payout request submitted for review.";

  message.style.color = "green";

}

function createPost(){

  const caption =
    document.getElementById("captionInput").value.trim();

  const imageInput =
    document.getElementById("imageInput");

  if(caption === "" && imageInput.files.length === 0){

    alert("Please add a caption or image.");

    return;
  }

  const post =
    document.createElement("div");

  post.className = "post";

  let photoHTML = "";

  if(imageInput.files.length > 0){

    const file = imageInput.files[0];

    const imageURL =
      URL.createObjectURL(file);

    photoHTML =
      '<div class="post-photo">' +
      '<img src="' + imageURL + '">' +
      '</div>';

  }else{

    photoHTML =
      '<div class="post-photo">📷</div>';
  }

  post.innerHTML =

    '<div class="post-head">' +

      '<div class="avatar">P</div>' +

      '<div class="user">' +
        '<b>PIXORO User</b>' +
        '<small>Just now</small>' +
      '</div>' +

      '<button class="more">⋮</button>' +

    '</div>' +

    photoHTML +

    '<div class="actions">' +

      '<button class="like" ' +
      'onclick="toggleLike(this)">♡</button>' +

      '<button onclick="focusComment(this)">💬</button>' +

      '<button>↗</button>' +

    '</div>' +

    '<div class="likes">0 likes</div>' +

    '<div class="caption">' +
      escapeHTML(caption) +
    '</div>' +

    '<div class="comments"></div>' +

    '<div class="comment-box">' +

      '<input type="text" ' +
      'placeholder="Write a comment...">' +

      '<button onclick="addComment(this)">Send</button>' +

    '</div>';

  const posts =
    document.getElementById("posts");

  posts.prepend(post);

  document.getElementById("captionInput").value = "";

  imageInput.value = "";

  updatePostCount();
}


/* POST COUNT */

function updatePostCount(){

  const posts =
    document.querySelectorAll("#posts .post");

  document.getElementById("postCount").innerText =
    posts.length;
}


/* SEARCH */

function searchUsers(){

  const value =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const results =
    document.getElementById("searchResults");

  if(value === ""){

    results.innerHTML =
      '<div class="search-result">' +
        '<div class="avatar">P</div>' +
        '<div>' +
          '<b>PIXORO User</b>' +
          '<small>@pixoro</small>' +
        '</div>' +
      '</div>';

    return;
  }

  if(
    "pixoro".includes(value) ||
    "user".includes(value)
  ){

    results.innerHTML =
      '<div class="search-result">' +
        '<div class="avatar">P</div>' +
        '<div>' +
          '<b>PIXORO User</b>' +
          '<small>@pixoro</small>' +
        '</div>' +
      '</div>';

  }else{

    results.innerHTML =
      '<div style="padding:20px;text-align:center">' +
      'No users found' +
      '</div>';
  }
}


/* SCROLL TO CREATE */

function scrollToCreate(){

  setTimeout(function(){

    const create =
      document.querySelector(".create");

    if(create){

      create.scrollIntoView({
        behavior:"smooth"
      });

      document
        .getElementById("captionInput")
        .focus();
    }

  },100);
}


/* SECURITY */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* START */

updatePostCount();

</script>

</body>
</html>
