<!DOCTYPE html>
<html style="background:#fff">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXORO - Full Instagram</title>
<style>
html,body{background:#fff;margin:0}*{box-sizing:border-box;font-family:-apple-system,sans-serif}
#splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center}
#splash.hide{transform:scale(1.1);opacity:0;pointer-events:none;transition:all.35s ease}
.splash-logo{width:85px;height:85px;border-radius:22px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:48px;animation:pop.8s both}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}
#app{display:none}#app.show{display:block;animation:in.3s ease}@keyframes in{from{opacity:0}to{opacity:1}}
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbdbdb;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:90}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.story-bar{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #efefef}
.story{width:66px;text-align:center;flex-shrink:0;cursor:pointer}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.story-ring img{width:100%;height:100%;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#ddd}
.post{max-width:470px;margin:0 auto 10px;background:#fff;border:1px solid #dbdbdb;border-radius:12px;overflow:hidden}
.post img,.post video{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.post-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.post-actions{padding:8px 12px;display:flex;gap:18px;font-size:22px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:10px 0 16px;z-index:90}
.bottom-nav i{font-size:22px;cursor:pointer}.bottom-nav i.active{color:#ff004f}
.tab-section{display:none;max-width:470px;margin:0 auto}.tab-section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{aspect-ratio:1/1;object-fit:cover;width:100%}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:800;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:1000}.modal.active{display:flex}.modalBox{background:#fff;border-radius:16px;width:94%;max-width:420px;padding:16px;max-height:85vh;overflow:auto}
.authBox{width:340px;border:1px solid #dbdbdb;padding:28px 18px;border-radius:10px;text-align:center;margin:50px auto;background:#fff}
.authBox input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}
.authBox button{width:100%;padding:11px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px}
.filterBtn{padding:7px 14px;background:#efefef;border-radius:20px;font-size:12px;font-weight:600;margin:2px;cursor:pointer;border:none}.filterBtn.active{background:#000;color:#fff}
</style>
</head>
<body>
<div id="splash"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center"><div class="splash-logo">📸</div><div style="font-weight:900;font-size:26px;margin-top:10px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</div></div><div style="padding-bottom:30px;text-align:center"><div style="color:#999;font-size:11px">from</div><div style="font-weight:900;color:#ff004f">∞ GIRI</div></div></div>
<div id="app">
<div id="authPage"><div class="authBox"><h1 style="font-weight:900;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</h1><input id="email" placeholder="Username"><input id="password" type="password" placeholder="Password"><input id="bio" placeholder="Bio"><button onclick="login()">Log In / Sign Up</button><button onclick="guestLogin()" style="background:#000">⚡ Guest Login</button></div></div>
<div id="mainPage" style="display:none">
<div class="header"><div class="logo">PIXORO</div><div style="display:flex;gap:14px;font-size:20px"><i class="fa-regular fa-paper-plane" onclick="switchTab('dm')"></i><i class="fa-regular fa-heart" onclick="switchTab('notif')"></i><i class="fa-solid fa-shield" onclick="switchTab('admin')"></i></div></div>
<div id="homeTab" class="tab-section active">
<div class="story-bar" id="storyBar"><div class="story" onclick="openCreateStory()"><div class="story-ring" style="background:#ddd;display:flex;align-items:center;justify-content:center;font-size:28px">+</div><div style="font-size:11px;margin-top:4px">Your Story</div></div></div>
<div id="posts"></div>
</div>
<div id="exploreTab" class="tab-section"><div style="padding:10px;display:flex;gap:8px"><input id="searchInput" oninput="searchAll()" placeholder="Search user, hashtag..." style="flex:1;padding:11px;border:1px solid #ddd;border-radius:20px"><button onclick="searchAll()" style="padding:10px 14px;border:none;background:#000;color:#fff;border-radius:20px">Search</button></div><div class="grid" id="exploreGrid"></div></div>
<div id="reelsTab" class="tab-section" style="background:#000;color:#fff;min-height:80vh"><div id="reels" style="height:80vh;overflow-y:scroll;scroll-snap-type:y mandatory"></div></div>
<div id="dmTab" class="tab-section"><h3 style="padding:12px">💬 Messages</h3><div id="dmList"></div><div style="padding:12px;display:flex;gap:8px"><input id="dmInput" placeholder="Message..." style="flex:1;padding:11px;border:1px solid #ddd;border-radius:20px"><button onclick="sendDM()" style="padding:10px 16px;background:#0095f6;color:#fff;border:none;border-radius:20px">Send</button></div></div>
<div id="notifTab" class="tab-section"><h3 style="padding:12px">🔔 Notifications</h3><div id="notifList"></div></div>
<div id="profileTab" class="tab-section"><div style="padding:16px"><div style="display:flex;gap:14px;align-items:center"><div id="pAvatar" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:900">G</div><div style="display:flex;gap:18px;text-align:center"><div><b id="postCount">0</b><br><span style="font-size:12px">Posts</span></div><div><b id="followerCount">0</b><br><span style="font-size:12px">Followers</span></div><div><b id="followingCount">0</b><br><span style="font-size:12px">Following</span></div></div></div><div style="margin-top:10px"><b id="profileName">GIRI</b><div id="profileBio" style="font-size:13px;color:#333"></div><div id="profileBadges" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"></div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="editProfile()" style="flex:1;padding:7px;border:1px solid #ddd;border-radius:8px;background:#efefef;font-weight:600">Edit Profile</button><button onclick="shareProfile()" style="flex:1;padding:7px;border:1px solid #ddd;border-radius:8px;background:#fff">Share</button></div><div style="display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:14px;padding-top:10px"><i class="fa-solid fa-table-cells" onclick="showProfileTab('grid')"></i><i class="fa-solid fa-clapperboard" onclick="showProfileTab('reels')"></i><i class="fa-solid fa-id-badge" onclick="showProfileTab('tagged')"></i><i class="fa-solid fa-trophy" onclick="switchTab('award')"></i></div></div><div id="profileGrid" class="grid"></div></div>
<div id="awardTab" class="tab-section"><div style="padding:16px;text-align:center"><h2>🏆 PIXORO Awards</h2><div id="awardInfo" style="margin:14px 0;padding:14px;background:#fff7e6;border-radius:12px;border:1px solid #ffd27f"></div><h4>Leaderboard Top 10</h4><div id="leaderboard"></div></div></div>
<div id="adminTab" class="tab-section"><h3 style="padding:12px">🛡️ Admin</h3><div id="adminList" style="padding:12px"></div></div>
<div class="bottom-nav">
<i id="nav-home" class="fa-solid fa-house active" onclick="switchTab('home')"></i>
<i id="nav-explore" class="fa-solid fa-magnifying-glass" onclick="switchTab('explore')"></i>
<i class="fa-regular fa-square-plus" onclick="openCreate()"></i>
<i id="nav-reels" class="fa-solid fa-clapperboard" onclick="switchTab('reels')"></i>
<i id="nav-profile" class="fa-regular fa-user" onclick="switchTab('profile')"></i>
</div>
</div>
</div>

<div id="createModal" class="modal"><div class="modalBox"><h3>Create</h3><input id="postImage" placeholder="Image/Video URL" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:8px 0"><input id="postCaption" placeholder="Caption + #hashtag" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px"><input id="postLocation" placeholder="Location" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:8px 0"><input id="postTag" placeholder="Tag people (comma)"><div style="margin:8px 0"><button class="filterBtn active" onclick="setFilter('normal',this)">Normal</button><button class="filterBtn" onclick="setFilter('clarendon',this)">Clarendon</button><button class="filterBtn" onclick="setFilter('juno',this)">Juno</button><button class="filterBtn" onclick="setFilter('SYSTEM',this)">⚡ SYSTEM SETHU</button></div><select id="postType" style="width:100%;padding:10px;border-radius:8px;margin:8px 0"><option value="post">Post</option><option value="reel">Reel (15-90s)</option><option value="story">Story (24h)</option></select><button onclick="createPost()" style="width:100%;padding:12px;background:#0095f6;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:700">Share</button><button onclick="closeCreate()" style="width:100%;margin-top:8px;padding:10px;background:#eee;border:none;border-radius:10px">Cancel</button></div></div>
<div id="storyModal" class="modal" onclick="closeStory()"><div style="position:relative;width:100%;max-width:420px;height:85vh;background:#000;border-radius:16px;overflow:hidden"><img id="storyImg" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff"><span id="storyUser"></span><span id="storyTime"></span></div><div style="position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:8px"><input id="storyReply" placeholder="Reply..." style="flex:1;padding:10px;border-radius:20px;border:none"><button onclick="replyStory()" style="padding:10px 14px;background:#fff;border:none;border-radius:20px">Send</button></div></div></div>
<div id="commentModal" class="modal"><div class="modalBox"><h3>Comments</h3><div id="commentList" style="margin:10px 0;max-height:350px;overflow:auto"></div><div style="display:flex;gap:8px"><input id="commentInput" placeholder="Add comment..." style="flex:1;padding:11px;border:1px solid #ddd;border-radius:20px"><button onclick="addComment()" style="padding:11px 16px;background:#0095f6;color:#fff;border:none;border-radius:20px">Post</button></div><button onclick="closeComment()" style="width:100%;margin-top:10px;padding:10px;border:1px solid #ddd;background:#fff;border-radius:10px">Close</button></div></div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script>setTimeout(()=>{document.getElementById('splash').classList.add('hide');document.getElementById('app').style.display='block';document.getElementById('app').classList.add('show');document.getElementById('authPage').style.display='block';setTimeout(()=>document.getElementById('splash').style.display='none',400)},800);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rrjrmvdvyqvtjdwdhmsd.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyanJtdmR2eXF2dGpkd2RobXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyODk3OTYsImV4cCI6MjA3Mzg2NTc5Nn0.o3J4YjRjK3a8v5b9c2d1e6f7g8h9i0j1k2l3m4n5o6p";const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,allPosts=[],stories=[],currentPostId=null,currentFilter='normal',dms=[],notifs=JSON.parse(localStorage.getItem('notifs')||'[]'),followed=JSON.parse(localStorage.getItem('followed')||'[]'),liked=JSON.parse(localStorage.getItem('liked')||'[]'),viewsMap=JSON.parse(localStorage.getItem('views')||'{}');
function switchTab(t){document.querySelectorAll('.tab-section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.bottom-nav i').forEach(x=>x.classList.remove('active'));document.getElementById(t+'Tab').classList.add('active');document.getElementById('nav-'+t)?.classList.add('active');if(t==='explore')renderExplore();if(t==='reels')renderReels();if(t==='profile')loadProfile();if(t==='notif')renderNotifs();if(t==='award')renderAwards();if(t==='admin')renderAdmin();if(t==='dm')renderDM()}
function showProfileTab(type){if(type==='grid')renderPosts(allPosts.filter(p=>p.username===currentUser.email.split('@')[0]),'profileGrid',true);if(type==='reels')renderPosts(allPosts.filter(p=>p.type==='reel'),'profileGrid',true)}
function openCreate(){document.getElementById('createModal').classList.add('active')}function closeCreate(){document.getElementById('createModal').classList.remove('active')}
function openComment(id){currentPostId=id;document.getElementById('commentModal').classList.add('active');loadComments()}function closeComment(){document.getElementById('commentModal').classList.remove('active')}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filterBtn').forEach(b=>b.classList.remove('active'));btn?.classList.add('active')}
function guestLogin(){currentUser={email:"giri@pixoro.app",bio:"∞ GIRI - SYSTEM SETHU"};showMain()}function login(){let e=document.getElementById('email').value||"giri";let b=document.getElementById('bio').value||"∞ GIRI";currentUser={email:e+"@pixoro.app",username:e,bio:b};showMain()}
function showMain(){document.getElementById('authPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('profileName').innerText=currentUser.username||currentUser.email.split('@')[0].toUpperCase();document.getElementById('profileBio').innerText=currentUser.bio||"";document.getElementById('pAvatar').innerText=(currentUser.username||'G')[0].toUpperCase();loadAll()}
async function loadAll(){loadPosts();loadStories()}
async function createPost(){
let url=document.getElementById('postImage').value.trim();let cap=document.getElementById('postCaption').value;let loc=document.getElementById('postLocation').value;let tag=document.getElementById('postTag').value;let type=document.getElementById('postType').value;
if(!url)return alert("URL podu da!");
let finalUrl=url;if(currentFilter==='SYSTEM'){finalUrl=await applyGlitch(url)}
try{await supa.from('posts').insert({image_url:finalUrl,caption:cap,username:currentUser.username||currentUser.email.split('@')[0],likes:0,views:0,type:type,location:loc,tags:tag,filter:currentFilter})}catch(e){}
closeCreate();loadAll();switchTab(type==='story'?'home':type==='reel'?'reels':'home');
}
async function applyGlitch(url){return new Promise(res=>{let img=new Image();img.crossOrigin="anonymous";img.onload=()=>{let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let d=ctx.getImageData(0,0,c.width,c.height);for(let y=0;y<c.height;y+=5){if(Math.random()>0.7){ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;ctx.fillRect(0,y,c.width,2)}}res(c.toDataURL('image/jpeg',0.8))};img.onerror=()=>res(url);img.src=url})}
async function loadPosts(){try{const {data}=await supa.from('posts').select('*').order('created_at',{ascending:false});allPosts=data||[];renderPosts(allPosts,'posts',false);renderExplore();renderReels()}catch{allPosts=[]}}
function renderPosts(list,elId,isGrid){
const el=document.getElementById(elId);if(!list.length){el.innerHTML='<p style="text-align:center;color:#999;margin-top:20px">No posts</p>';return;}
if(isGrid){el.innerHTML=list.map(p=>`<div style="position:relative"><img src="${p.image_url}"><div style="position:absolute;top:6px;right:6px;color:#fff;font-size:12px">${p.type==='reel'?'▶️ '+ (p.views||0):''}</div></div>`).join('');return;}
el.innerHTML=list.map(p=>{
let isLiked=liked.includes(p.id);let totalViews=(p.views||0)+(viewsMap[p.id]||0);let badge=getBadge(totalViews);
return `<div class="post"><div class="post-head"><div style="display:flex;gap:8px;align-items:center"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900">${p.username[0].toUpperCase()}</div><div><b>${p.username}</b>${p.location?`<span style="font-size:11px;color:#666"> • ${p.location}</span>`:''}<div style="font-size:10px">${badge}</div></div></div><div style="display:flex;gap:10px"><button onclick="toggleFollow('${p.username}')" style="padding:4px 10px;border-radius:6px;border:none;background:${followed.includes(p.username)?'#efefef':'#0095f6'};color:${followed.includes(p.username)?'#000':'#fff'};font-weight:700;font-size:12px">${followed.includes(p.username)?'Following':'Follow'}</button><i class="fa-solid fa-ellipsis" onclick="if(confirm('Delete?'))deletePost('${p.id}')"></i></div></div>
<img src="${p.image_url}" style="filter:${filterCSS(p.filter)}" onclick="addView('${p.id}')">
<div class="post-actions"><i class="${isLiked?'fa-solid':'fa-regular'} fa-heart" style="${isLiked?'color:#ed4956':''}" onclick="toggleLike('${p.id}','${p.username}')"></i><i class="fa-regular fa-comment" onclick="openComment('${p.id}')"></i><i class="fa-regular fa-paper-plane" onclick="sharePost('${p.id}')"></i><i class="fa-regular fa-bookmark" onclick="savePost('${p.id}')" style="margin-left:auto"></i></div>
<div style="padding:0 12px;font-weight:700;font-size:13px">${(p.likes||0)+(isLiked?1:0)} likes • ${totalViews} views</div>
<div style="padding:6px 12px 12px;font-size:14px"><b>${p.username}</b> ${p.caption||''} <span style="color:#00376b">${(p.tags||'').split(',').map(t=>t.trim()? '#'+t.trim():'').join(' ')}</span></div></div>`}).join('');
}
function filterCSS(f){if(f==='clarendon')return 'contrast(1.2) saturate(1.35)';if(f==='juno')return 'contrast(1.1) saturate(1.5) hue-rotate(-10deg)';if(f==='SYSTEM')return 'contrast(1.4) saturate(2) hue-rotate(90deg)';return 'none'}
function getBadge(v){if(v>=1000000)return '👑 PIXORO KING';if(v>=100000)return '💎 Diamond';if(v>=50000)return '🥇 Gold';if(v>=10000)return '🥈 Silver';if(v>=1000)return '🥉 Bronze';return ''}
function addView(id){viewsMap[id]=(viewsMap[id]||0)+1;localStorage.setItem('views',JSON.stringify(viewsMap));checkAward(id)}
function checkAward(id){let v=viewsMap[id]||0;let badge=getBadge(v);if(badge && v%1000===0){notifs.unshift({text:`🎉 Congrats da! ${badge} Award vangita da! ${v} views!`,time:new Date().toLocaleTimeString()});localStorage.setItem('notifs',JSON.stringify(notifs))}}
function toggleLike(id,owner){let i=liked.indexOf(id);if(i>-1)liked.splice(i,1);else{liked.push(id);notifs.unshift({text:`❤️ ${owner} post ah like pannita`,time:new Date().toLocaleTimeString()})}localStorage.setItem('liked',JSON.stringify(liked));localStorage.setItem('notifs',JSON.stringify(notifs));renderPosts(allPosts,'posts',false)}
function toggleFollow(u){let i=followed.indexOf(u);if(i>-1)followed.splice(i,1);else{followed.push(u);notifs.unshift({text:`👤 ${u} ah follow pannita`,time:new Date().toLocaleTimeString())}}localStorage.setItem('followed',JSON.stringify(followed));localStorage.setItem('notifs',JSON.stringify(notifs));renderPosts(allPosts,'posts',false);loadProfile()}
async function deletePost(id){try{await supa.from('posts').delete().eq('id',id)}catch{}loadPosts()}
function sharePost(id){let p=allPosts.find(x=>x.id===id);if(navigator.share)navigator.share({title:'PIXORO',url:p.image_url});else{navigator.clipboard.writeText(p.image_url);alert("Link copied da!")}}
function savePost(id){alert("Saved da! 🔖")}
function renderExplore(){document.getElementById('exploreGrid').innerHTML=allPosts.map(p=>`<img src="${p.image_url}" onclick="addView('${p.id}');openComment('${p.id}')">`).join('')}
function renderReels(){document.getElementById('reels').innerHTML=allPosts.filter(p=>p.type==='reel').map(p=>`<div style="scroll-snap-align:start;height:80vh;position:relative"><img src="${p.image_url}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:20px;left:12px;right:60px;color:#fff"><b>${p.username}</b><br>${p.caption||''}<br>👁️ ${(p.views||0)+(viewsMap[p.id]||0)} views</div><div style="position:absolute;right:12px;bottom:60px;display:flex;flex-direction:column;gap:18px;font-size:26px"><i class="fa-regular fa-heart" onclick="toggleLike('${p.id}')"></i><i class="fa-regular fa-comment"></i><i class="fa-regular fa-paper-plane"></i></div></div>`).join('')||'<p style="text-align:center;padding:40px">No reels da! Create la Reel select pannu!</p>'}
function searchAll(){let q=document.getElementById('searchInput').value.toLowerCase();let f=allPosts.filter(p=>(p.caption||'').toLowerCase().includes(q)||p.username.toLowerCase().includes(q)||(p.tags||'').toLowerCase().includes(q));renderPosts(f,'exploreGrid',false)}
async function loadStories(){try{const {data}=await supa.from('posts').select('*').eq('type','story').order('created_at',{ascending:false});stories=(data||[]).filter(s=>{let t=new Date(s.created_at);return (Date.now()-t.getTime())<24*60*60*1000});renderStories()}catch{stories=[]}}
function renderStories(){let bar=document.getElementById('storyBar');let base=bar.innerHTML.split('</div></div>')[0]+'</div></div>';bar.innerHTML=base+stories.map(s=>`<div class="story" onclick="openStory('${s.id}')"><div class="story-ring"><img src="${s.image_url}"></div><div style="font-size:11px;margin-top:4px">${s.username}</div></div>`).join('')}
function openCreateStory(){document.getElementById('postType').value='story';openCreate()}
function openStory(id){let s=stories.find(x=>x.id===id);if(!s)return;document.getElementById('storyImg').src=s.image_url;document.getElementById('storyUser').innerText=s.username;document.getElementById('storyTime').innerText=new Date(s.created_at).toLocaleTimeString();document.getElementById('storyModal').classList.add('active');addView(id)}
function closeStory(){document.getElementById('storyModal').classList.remove('active')}
function replyStory(){let txt=document.getElementById('storyReply').value;if(!txt)return;dms.push({from:currentUser.username||'me',text:'Story reply: '+txt,time:new Date().toLocaleTimeString()});document.getElementById('storyReply').value='';closeStory();switchTab('dm')}
function sendDM(){let txt=document.getElementById('dmInput').value;if(!txt)return;dms.push({from:'me',text:txt,time:new Date().toLocaleTimeString()});document.getElementById('dmInput').value='';renderDM();notifs.unshift({text:`💬 DM: ${txt}`,time:new Date().toLocaleTimeString()});localStorage.setItem('notifs',JSON.stringify(notifs))}
function renderDM(){document.getElementById('dmList').innerHTML=dms.map(m=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${m.from}</b> ${m.text} <span style="float:right;font-size:11px;color:#888">${m.time}</span></div>`).join('')||'<p style="text-align:center;color:#999">No messages</p>'}
async function loadComments(){try{const {data}=await supa.from('comments').select('*').eq('post_id',currentPostId).order('created_at',{ascending:false});document.getElementById('commentList').innerHTML=(data||[]).map(c=>`<div style="padding:8px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between"><span><b>${c.username}</b> ${c.text}</span><span onclick="deleteComment('${c.id}')" style="cursor:pointer">🗑️</span></div>`).join('')||'No comments'}catch{}}
async function addComment(){let t=document.getElementById('commentInput').value;if(!t)return;try{await supa.from('comments').insert({post_id:currentPostId,text:t,username:currentUser.username||'giri'})}catch{}document.getElementById('commentInput').value='';notifs.unshift({text:`💬 Comment: ${t}`,time:new Date().toLocaleTimeString()});localStorage.setItem('notifs',JSON.stringify(notifs));loadComments()}
async function deleteComment(id){try{await supa.from('comments').delete().eq('id',id)}catch{}loadComments()}
function renderNotifs(){document.getElementById('notifList').innerHTML=notifs.map(n=>`<div style="padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px"><span>🔔</span><div><div style="font-size:14px">${n.text}</div><div style="font-size:11px;color:#888">${n.time}</div></div></div>`).join('')||'<p style="text-align:center;color:#999;margin-top:30px">No notifications</p>'}
function loadProfile(){document.getElementById('postCount').innerText=allPosts.filter(p=>p.username===(currentUser.username||'giri')).length;document.getElementById('followerCount').innerText=followed.length+Math.floor(Math.random()*5);document.getElementById('followingCount').innerText=followed.length;let totalViews=Object.values(viewsMap).reduce((a,b)=>a+b,0);document.getElementById('profileBadges').innerHTML=`<span class="badge" style="background:#cd7f32">${getBadge(totalViews)||'Newbie'}</span> <span style="font-size:12px">${totalViews} views</span>`;renderPosts(allPosts.filter(p=>p.username===(currentUser.username||'giri')),'profileGrid',true)}
function renderAwards(){let totalViews=Object.values(viewsMap).reduce((a,b)=>a+b,0);let badge=getBadge(totalViews);document.getElementById('awardInfo').innerHTML=`<h3>${badge||'Keep posting da Giri!'} 🏆</h3><p>Total Views: ${totalViews}</p><p>1K=Bronze 🥉 | 10K=Silver 🥈 | 50K=Gold 🥇 | 100K=Diamond 💎 | 1M=PIXORO KING 👑</p>`;let sorted=Object.entries(viewsMap).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById('leaderboard').innerHTML=sorted.map(([id,v],i)=>`<div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>${i+1}. ${allPosts.find(p=>p.id===id)?.username||'User'}</span><span><b>${v}</b> views - ${getBadge(v)}</span></div>`).join('')||'No data yet'}
function renderAdmin(){document.getElementById('adminList').innerHTML=allPosts.map(p=>`<div style="padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><b>${p.username}</b><br><img src="${p.image_url}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><br><span style="font-size:11px">${p.caption||''}</span></div><div><button onclick="deletePost('${p.id}')" style="padding:6px 12px;background:#ed4956;color:#fff;border:none;border-radius:6px">Delete</button><button onclick="alert('Reported da!')" style="padding:6px 12px;background:#ffad33;color:#fff;border:none;border-radius:6px;margin-left:6px">Report</button></div></div>`).join('')}
function editProfile(){let n=prompt("Username:",currentUser.username);let b=prompt("Bio:",currentUser.bio);if(n)currentUser.username=n;if(b)currentUser.bio=b;document.getElementById('profileName').innerText=currentUser.username;document.getElementById('profileBio').innerText=b||''}
function shareProfile(){if(navigator.share)navigator.share({title:'PIXORO',text:currentUser.username,url:location.href});else{alert("Profile link copied da!")}}
</script>
</body>
</html>
