<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f2f2;
  color:#111;
  padding-bottom:75px;
}

header{
  height:60px;
  background:#c2185b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

header button{
  background:none;
  border:0;
  color:white;
  font-size:23px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CREATE POST */

.create{
  background:white;
  padding:15px;
  margin-bottom:8px;
}

.create input[type="text"]{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:16px;
  outline:none;
}

.file{
  width:100%;
  margin-top:12px;
}

.post-btn{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2196f3;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* POST */

.post{
  background:white;
  margin-bottom:10px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#2196f3;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

.user{
  flex:1;
}

.user b{
  display:block;
  font-size:16px;
}

.user small{
  color:#777;
}

.more{
  border:0;
  background:none;
  font-size:25px;
}

.post-photo{
  width:100%;
  min-height:300px;
  background:linear-gradient(135deg,#2196f3,#673ab7);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:60px;
}

.post-photo img{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}

.actions{
  display:flex;
  gap:18px;
  padding:12px 18px;
}

.actions button{
  background:none;
  border:0;
  font-size:32px;
  cursor:pointer;
}

.like.active{
  color:#e91e63;
}

.likes{
  padding:0 18px 8px;
  font-weight:bold;
}

.caption{
  padding:5px 18px 15px;
  font-size:16px;
}

.comments{
  padding:0 18px;
}

.comment{
  padding:7px 0;
}

.comment-box{
  display:flex;
  gap:8px;
  padding:12px 18px;
  border-top:1px solid #eee;
}

.comment-box input{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:20px;
  outline:none;
}

.comment-box button{
  border:0;
  background:#2196f3;
  color:white;
  padding:9px 16px;
  border-radius:20px;
}

.search-box{
  background:white
