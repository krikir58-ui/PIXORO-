<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.post{border-bottom:1px solid #222;background:#000;padding-bottom:12px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.actions{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.actions .left{display:flex;gap:18px;align-items:center}
.actions button{background:none;border:0;cursor:pointer;display:flex;transition:.15s}
.actions button:active{transform:scale(.85)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px}.nav a.active{color:#fff}
.pfpRing{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:2px}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.verifiedBadge{width:16px;height:16px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.followBtn{border:1.5px solid #fff;border-radius:20px;background:#000;color:#fff;padding:5px 18px;font-size:13px;font-weight:600}.followBtn.following{background:#fff;color:#000}
.storyBar{display:flex;gap:12px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #222;background:#000}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:68px;cursor:pointer;position:relative}.sRing{width:64px;height:64px;border-radius:50%;padding:3px;display:flex;align-items:center;justify-content:center}.sRing.public{background:conic-gradient(from 45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}.sRing.close{background:conic-gradient(from 45deg,#00ff66,#00cc44,#00ff66)}.sRing.seen{background:#333}.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2.5px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.sAdd{width:64px;height:64px;border-radius:50%;background:#111;border:2px dashed #333;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}.sAdd::after{content:'+';position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:#0095F6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #000;color:#fff}.sName{font-size:11px;margin-top:4px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.closeBadge{position:absolute;top:0;right:4px;background:#00ff66;color:#000;font-size:8px;font-weight:800;padding:2px 4px;border-radius:10px}
</style></head><body>
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><div style="display:flex;gap:15px"><span onclick="openCloseFriend()" style="cursor:pointer">💚</span><span onclick="location.href='notifications.html'" style="cursor:pointer;font-size:22px">🔔</span></div></div>
<div class="storyBar" id="storyBar"><div class="sItem" onclick="location.href='./story-add.html'"><div class="sAdd">👤</div><div class="sName">Your Story</div></div><div style="color:#444;display:flex;align-items:center;font-size:12px">Loading...</div></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#666">Loading Pixoro... 🔵</p></div>
<div style="height:70px"></div>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<!-- CLOSE FRIEND MODAL -->
<div id="cfModal" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;padding:20px"><div style="background:#111;border-radius:15px;padding:15px;max-width:400px;margin:20% auto"><div style="display:flex;justify-content:space-between"><b>💚 Close Friends</b><span onclick="closeCF()" style="cursor:pointer">✕</span></div><input id="cfInput" placeholder="Username..." style="width:100%;margin-top:12px;padding:10px;border-radius:10px;border:0;background:#222;color:#fff"><button onclick="addCF()" style="width:100%;margin-top:10px;padding:10px;background:#00ff66;border:0;border-radius:10px;font-weight:700">Add</button><div id="cfList" style="margin-top:12px;font-size:13px;color:#888"></div></div></div>

<!-- COMMENT MODAL - INSTA SECRET -->
<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center">
<div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column">
<div style="padding:14px;display:flex;justify-content:center;border-bottom:1px solid #222;position:relative"><div style="width:40px;height:4px;background:#333;border-radius:10px"></div><b style="position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:14px">Comments</b><span onclick="closeComment()" style="position:absolute;right:15px;top:10px;font-size:22px;cursor:pointer">✕</span></div>
<div id="commentList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div>
<div style="padding:10px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;background:#000"><img src="https://i.pravatar.cc/100?u=Giri" style="width:32px;height:32px;border-radius:50%"><input id="commentInput" placeholder="Add a comment..." style="flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff;outline:none"><button onclick="addComment()" style="background:none;border:0;color:#0095f6;font-weight:700;cursor:pointer;font-size:14px">Post</button></div>
</div>
</div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allFollows=[],allSaves=[],allStories=[]
let allComments=[],allCommentLikes=[],currentPostId=null

function blueTick(){return `<span class="verifiedBadge"><svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M17 8.5L10.5 15L7 11.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`}
function pfpHtml(u){return `<div class="pfpRing"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}

async function loadAll(){
 let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false})
 let {data:likes}=await supa.from('likes').select('*')
 let {data:follows}=await supa.from('follows').select('*')
 let {data:saves}=await supa.from('saves').select('*').eq('username',ME)
 let {data:stories}=await supa.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false})
 allPosts=posts||[]; allLikes=likes||[]; allFollows=follows||[]; allSaves=saves||[]; allStories=stories||[]; renderStories(); renderFeed(); loadCF()
}
function renderStories(){
 let bar=document.getElementById('storyBar')
 let users=[...new Set(allStories.map(s=>s.username))]
 let html=`<div class="sItem" onclick="location.href='./story-add.html'"><div class="sAdd">👤</div><div class="sName">Your Story</div></div>`
 html+=users.map(u=>{ let s=allStories.find(x=>x.username===u); let isClose=s.audience==='close_friends'; let img=s.image_url||s.media_url||`https://i.pravatar.cc/100?u=${u}`; return `<div class="sItem" onclick="location.href='./story-view.html?user=${encodeURIComponent(u)}'"><div class="sRing ${isClose?'close':'public'}"><div class="sRingInner"><img src="${img}"></div></div><div class="sName">${u}</div>${isClose?'<div class="closeBadge">💚</div>':''}</div>` }).join('')
 if(!users.length) html+=`<div style="color:#555;display:flex;align-items:center;font-size:12px">No stories 👻</div>`
 bar.innerHTML=html
}
function renderFeed(){
 let html=''
 for(let p of allPosts){
  let lCount=allLikes.filter(l=>l.post_id==p.id).length
  let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME)
  let isSaved=allSaves.some(s=>s.post_id==p.id)
  let isMe=p.username===ME
  let followBtn=isMe?`<span style="font-size:11px;color:#555">YOU</span>`:`<button class="followBtn ${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'following':''}" onclick="toggleFollow('${p.username}')">${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'Following':'Follow'}</button>`
  html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<div><b style="display:flex;align-items:center">@${p.username}${isMe?blueTick():''}</b><div style="font-size:11px;color:#777">${allFollows.filter(f=>f.following==p.username).length} followers</div></div></div>${followBtn}</div><img class="main" src="${p.image_url}" ondblclick="likePost(${p.id})"><div class="actions"><div class="left"><button onclick="likePost(${p.id})"><svg viewBox="0 0 24 24" width="28" height="28" fill="${isLiked?'#ff3040':'none'}" stroke="${isLiked?'#ff3040':'#fff'}" stroke-width="${isLiked?'2':'1.8'}"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button><button onclick="openComment(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button><button onclick="sharePost()"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div><button onclick="savePost(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="${isSaved?'#fff':'none'}" stroke="#fff" stroke-width="2"><path d="M19 21L12 16L5 21V5C5 3.89543 5.89543 3 7 3H17C18.1046 3 19 3.89543 19 5V21Z"/></svg></button></div><div style="padding:0 12px"><b>${lCount} likes</b><br><b>@${p.username} ${isMe?blueTick():''}</b> ${p.caption||''}</div></div>`
 }
 document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px">No posts da!</p>'
}
async function likePost(id){ let liked=allLikes.some(l=>l.post_id==id&&l.username==ME); if(liked) await supa.from('likes').delete().eq('post_id',id).eq('username',ME); else await supa.from('likes').insert({post_id:id,username:ME}); let {data}=await supa.from('likes').select('*'); allLikes=data||[]; renderFeed() }
async function savePost(id){ let saved=allSaves.some(s=>s.post_id==id); if(saved) await supa.from('saves').delete().eq('post_id',id).eq('username',ME); else await supa.from('saves').insert({post_id:id,username:ME}); let {data}=await supa.from('saves').select('*').eq('username',ME); allSaves=data||[]; renderFeed() }
function sharePost(){ if(navigator.share) navigator.share({url:location.href}); else prompt('Copy:',location.href) }
async function toggleFollow(u){ let a=allFollows.some(f=>f.follower==ME&&f.following==u); if(a) await supa.from('follows').delete().eq('follower',ME).eq('following',u); else await supa.from('follows').insert({follower:ME,following:u}); let {data}=await supa.from('follows').select('*'); allFollows=data||[]; renderFeed() }

// COMMENT SYSTEM - INSTA SECRET
async function openComment(postId){
 currentPostId=postId
 document.getElementById('commentModal').style.display='flex'
 setTimeout(()=>document.getElementById('commentInput').focus(),100)
 await loadComments()
}
function closeComment(){ document.getElementById('commentModal').style.display='none'; currentPostId=null }

async function loadComments(){
 let {data:comments}=await supa.from('comments').select('*').eq('post_id',currentPostId).order('created_at',{ascending:true})
 let {data:clikes}=await supa.from('comment_likes').select('*')
 allComments=comments||[]; allCommentLikes=clikes||[]
 let list=document.getElementById('commentList')
 if(allComments.length===0){ list.innerHTML=`<p style="text-align:center;color:#666;padding:40px">No comments yet da! <br>First comment nee podu! 👇</p>`; return }
 list.innerHTML=allComments.map(c=>{
   let lc=allCommentLikes.filter(l=>l.comment_id==c.id).length
   let liked=allCommentLikes.some(l=>l.comment_id==c.id && l.username==ME)
   let isMe=c.username===ME
   return `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #111">
     <img src="https://i.pravatar.cc/100?u=${c.username}" style="width:28px;height:28px;border-radius:50%">
     <div style="flex:1">
       <b style="font-size:13px">@${c.username}</b> <span style="font-size:13px;color:#ddd">${c.text}</span>
       <div style="display:flex;gap:12px;margin-top:5px;font-size:11px;color:#777"><span>${new Date(c.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><span style="font-weight:700;cursor:pointer;color:${liked?'#ff3040':'#777'}" onclick="likeComment(${c.id})">${lc>0?lc+' likes':'Like'}</span>${isMe?`<span onclick="deleteComment(${c.id})" style="color:#ff3040;cursor:pointer;font-weight:700">Delete 🗑️</span>`:''}</div>
     </div>
     <div onclick="likeComment(${c.id})" style="cursor:pointer;padding:4px"><svg viewBox="0 0 24 24" width="14" height="14" fill="${liked?'#ff3040':'none'}" stroke="${liked?'#ff3040':'#666'}" stroke-width="2"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></div>
   </div>`
 }).join('')
 list.scrollTop=list.scrollHeight
}
async function addComment(){
 let txt=document.getElementById('commentInput').value.trim()
 if(!txt || !currentPostId) return
 await supa.from('comments').insert({post_id:currentPostId, username:ME, text:txt})
 document.getElementById('commentInput').value=''
 await loadComments()
}
async function likeComment(cId){
 let liked=allCommentLikes.some(l=>l.comment_id==cId && l.username==ME)
 if(liked) await supa.from('comment_likes').delete().eq('comment_id',cId).eq('username',ME)
 else await supa.from('comment_likes').insert({comment_id:cId, username:ME})
 await loadComments()
}
async function deleteComment(cId){
 if(!confirm('Delete panava da Giri? 🗑️')) return
 let com=allComments.find(c=>c.id===cId)
 if(com.username!==ME){ alert('Un comment mattum delete pannalam!'); return }
 await supa.from('comments').delete().eq('id',cId)
 await loadComments()
}

function openCloseFriend(){ document.getElementById('cfModal').style.display='block'; loadCF() }
function closeCF(){ document.getElementById('cfModal').style.display='none' }
async function addCF(){ let f=document.getElementById('cfInput').value.trim(); if(!f) return; await supa.from('close_friends').insert({owner:ME,friend:f}); document.getElementById('cfInput').value=''; loadCF() }
async function loadCF(){ let {data}=await supa.from('close_friends').select('*').eq('owner',ME); let list=document.getElementById('cfList'); if(!list) return; list.innerHTML=(data||[]).map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span>💚 ${c.friend}</span><span onclick="removeCF('${c.id}')" style="color:#f44;cursor:pointer">remove</span></div>`).join('')||'No close friends' }
async function removeCF(id){ await supa.from('close_friends').delete().eq('id',id); loadCF() }
loadAll()
</script>
</body></html>
