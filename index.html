<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIXORO - WEEK 2 Account</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI}body{background:#000;color:#fff}
.header{height:60px;padding:0 14px;position:fixed;top:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);z-index:100;background:#000;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Grand Hotel',cursive;font-size:30px}
.feed{margin-top:60px;margin-bottom:80px;max-width:500px;margin:auto}
.post{background:#000;border-bottom:1px solid #111;padding-bottom:8px}
.post-top{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.post-img-wrap{width:100%;aspect-ratio:4/5;background:#111;overflow:hidden}
.post-img{width:100%;height:100%;object-fit:cover}
.post-actions{display:flex;gap:18px;padding:10px 14px}
.action-btn{background:none;border:none;color:#fff;font-size:22px}
.bottom{position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#000;height:60px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #111;z-index:100}
.bottom button{background:none;border:none;color:#888;font-size:22px;width:48px;height:48px}.bottom button.active{color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.login-card{width:100%;max-width:350px;text-align:center;border:1px solid #111;padding:28px 20px;border-radius:2px;background:#000}
input{width:100%;padding:12px;background:#121212;border:1px solid #222;border-radius:3px;color:#fff;margin:5px 0;outline:none}
.blue-btn{width:100%;background:#0095f6;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
#profileBox{display:none;margin-top:60px;max-width:500px;margin-left:auto;margin-right:auto}
.profile-head{padding:16px;display:flex;gap:20px;align-items:center}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.edit-btn{width:100%;background:#222;color:#fff;border:none;padding:7px;border-radius:6px;margin-top:12px;font-weight:600}
.follow-btn-main{background:#0095f6;color:#fff;border:none;padding:7px 20px;border-radius:8px;font-weight:700}
</style>
</head>
<body>
<div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;display:flex;align-items:center;justify-content:center;"><h1 style="font-family:'Grand Hotel',cursive;font-size:60px;">Pixoro</h1></div>

<!-- WEEK 1 BASE READY - NO AD -->
<div class="header" id="mainHeader" style="display:none;"><div class="logo" onclick="showFeed()">Pixoro</div><div style="display:flex;gap:16px;"><span onclick="showSearch()">🔍</span><span onclick="openSettings()">☰</span></div></div>

<!-- WEEK 2 ACCOUNT - LOGIN / SIGNUP -->
<div id="loginBox" class="login-wrap">
<div class="login-card">
<h1 style="font-family:'Grand Hotel',cursive;font-size:50px;margin-bottom:20px;">Pixoro</h1>
<input id="email" type="email" placeholder="Email" oninput="this.value=this.value.replace(/\s/g,'').toLowerCase()">
<input id="pass" type="password" placeholder="Password">
<input id="displayName" type="text" placeholder="Username (Signup ku mattum)" style="display:none;">
<p id="toggleText" style="font-size:12px;color:#888;margin-top:12px;cursor:pointer;" onclick="toggleSignup()">New user? <span style="color:#0095f6;">Signup pannu da</span></p>
<button id="loginBtn" onclick="handleAccount()" class="blue-btn">Log in</button>
<p id="loginError" style="color:#ff3040;font-size:12px;margin-top:10px;display:none;"></p>
<p style="font-size:10px;color:#555;margin-top:16px;">WEEK 2 - Account System ✅<br>No Ad - Clean Base</p>
</div>
</div>

<div id="feed" class="feed" style="display:none;"></div>

<!-- PROFILE - WEEK 2 MAIN -->
<div id="profileBox">
<div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #111;position:sticky;top:0;background:#000;"><button onclick="showFeed()" style="background:none;border:none;color:#fff;font-size:20px;">←</button><b id="profileUsername">pixoro4</b></div>
<div class="profile-head">
<img id="profilePic" src="https://i.pravatar.cc/100" style="width:80px;height:80px;border-radius:50%;object-fit:cover;">
<div class="stats">
<div><b id="postCount">0</b><br><small style="color:#888;font-size:12px;">Posts</small></div>
<div onclick="showFollowers()"><b id="followerCount">0</b><br><small style="color:#888;font-size:12px;">Followers</small></div>
<div onclick="showFollowing()"><b id="followingCount">0</b><br><small style="color:#888;font-size:12px;">Following</small></div>
</div>
</div>
<div style="padding:0 16px;">
<b id="pName" style="font-size:14px;"></b>
<p id="pBio" style="font-size:13px;margin-top:2px;color:#ddd;">Tiruchuli to World 🌍</p>
<p id="pEmail" style="font-size:11px;color:#666;margin-top:4px;"></p>
<button id="profileActionBtn" class="edit-btn" onclick="editProfile()">Edit profile</button>
</div>
<div style="display:flex;border-top:1px solid #111;margin-top:16px;"><div style="flex:1;padding:12px;text-align:center;border-bottom:1px solid #fff;">POSTS</div><div style="flex:1;padding:12px;text-align:center;color:#666;">TAGGED</div></div>
<div id="myPosts" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;"></div>
</div>

<div id="commentBox" style="position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#121212;padding:14px;display:none;z-index:1000;max-height:60%;overflow-y:auto;border-radius:16px 16px 0 0;"><div style="display:flex;justify-content:space-between;"><b>Comments</b><button onclick="commentBox.style.display='none'" style="background:none;border:none;color:#fff;">✕</button></div><div id="commentList" style="margin-top:10px;"></div><div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid #222;padding-top:12px;"><input id="commentInput" placeholder="Add a comment..." style="flex:1;background:transparent;border:none;color:#fff;outline:none;"><button onclick="addComment()" style="background:none;border:none;color:#0095f6;font-weight:700;">Post</button></div></div>
<div id="settingsPage" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column;"><div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #111;"><button onclick="settingsPage.style.display='none'" style="background:none;border:none;color:#fff;font-size:22px;">←</button><b>Settings</b></div><div style="padding:20px;"><button onclick="logout()" style="width:100%;background:#111;border:1px solid #222;color:#ff3040;padding:14px;border-radius:8px;">Log out</button></div></div>

<div class="bottom" id="bottomNav" style="display:none;">
<button onclick="showFeed()" id="navHome" class="active">⌂</button>
<button onclick="showSearch()" id="navSearch">⌕</button>
<button onclick="addPost()" style="font-size:28px;color:#fff;">+</button>
<button onclick="showProfile()" id="navProfile">◯</button>
<button onclick="openSettings()">☰</button>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">
<div id="uploadBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;"><div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #111;"><button onclick="uploadBox.style.display='none'" style="background:none;border:none;color:#fff;">✕</button><b>New post</b><button onclick="uploadRealPost()" style="background:none;border:none;color:#0095f6;font-weight:700;">Share</button></div><div style="width:100%;aspect-ratio:4/5;background:#111;"><img id="preview" style="width:100%;height:100%;object-fit:cover;display:none;"></div><div style="padding:16px;"><input id="captionInput" placeholder="Write a caption..." style="width:100%;background:transparent;border:none;color:#fff;outline:none;"></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCwOxSyjqp2OoT2PoxSyHojksr5r58vQ10",authDomain:"pixoro-75927.firebaseapp.com",projectId:"pixoro-75927",storageBucket:"pixoro-75927.firebasestorage.app",messagingSenderId:"814840120295",appId:"1:814840120295:web:6c02c613df5a17209bf342"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let currentUser=null,isSignupMode=false,currentCommentPostId=null,viewingUid=null;

setTimeout(()=>{let s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},600);

function toggleSignup(){isSignupMode=!isSignupMode;document.getElementById('displayName').style.display=isSignupMode?'block':'none';document.getElementById('loginBtn').innerText=isSignupMode?'Sign up':'Log in';document.getElementById('toggleText').innerHTML=isSignupMode?'Already have account? <span style="color:#0095f6;">Log in pannu da</span>':'New user? <span style="color:#0095f6;">Signup pannu da</span>';}

auth.onAuthStateChanged(async u=>{
if(u){currentUser=u;viewingUid=u.uid;loginBox.style.display="none";mainHeader.style.display="flex";bottomNav.style.display="flex";feed.style.display="block";profileBox.style.display="none";await ensureUserDoc(u);loadFeed();loadProfileStats(u.uid);}else{loginBox.style.display="flex";mainHeader.style.display="none";bottomNav.style.display="none";feed.style.display="none";profileBox.style.display="none";}
});

async function ensureUserDoc(user){
let ref=db.collection("users").doc(user.uid);
let snap=await ref.get();
if(!snap.exists){
let username=user.email.split("@")[0];
if(document.getElementById('displayName').value.trim()) username=document.getElementById('displayName').value.trim();
await ref.set({email:user.email,username:username,bio:"Tiruchuli to World 🌍",photo:"https://i.pravatar.cc/150?u="+user.uid,followers:0,following:0,posts:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}
}

async function handleAccount(){
let e=email.value.trim().toLowerCase();let p=pass.value.trim();let errEl=document.getElementById('loginError');let btn=document.getElementById('loginBtn');
if(!e||!p){errEl.style.display='block';errEl.innerText="Email + Password podu da";return;}
errEl.style.display='none';btn.innerText="Wait...";btn.disabled=true;
try{
if(isSignupMode){await auth.createUserWithEmailAndPassword(e,p);}else{await auth.signInWithEmailAndPassword(e,p);}
}catch(err){errEl.style.display='block';errEl.innerText=err.message;btn.innerText=isSignupMode?'Sign up':'Log in';btn.disabled=false;}
}

function logout(){auth.signOut();}
function clearNav(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'))}
function showFeed(){clearNav();navHome.classList.add('active');feed.style.display="block";profileBox.style.display="none";viewingUid=currentUser.uid;loadFeed();}
function showSearch(){alert("Week 8 la Discovery varum da Giri!");}
function showProfile(){clearNav();navProfile.classList.add('active');viewingUid=currentUser.uid;feed.style.display="none";profileBox.style.display="block";loadProfileStats(viewingUid);}
function openSettings(){settingsPage.style.display='flex';}
function addPost(){fileInput.click();}
fileInput.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';uploadBox.style.display='block';};r.readAsDataURL(f);});
async function uploadRealPost(){let cap=captionInput.value.trim();let img=preview.src;if(!img)return alert("Photo select pannu");await db.collection("reels").add({email:currentUser.email.split("@")[0],uid:currentUser.uid,caption:cap,videoUrl:img,likes:0,likedBy:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection("users").doc(currentUser.uid).update({posts:firebase.firestore.FieldValue.increment(1)});uploadBox.style.display='none';captionInput.value='';preview.style.display='none';showFeed();}

// WEEK 2 ACCOUNT - PROFILE + FOLLOW
async function loadProfileStats(uid){
viewingUid=uid;
let uSnap=await db.collection("users").doc(uid).get();
if(!uSnap.exists)return;
let u=uSnap.data();
pName.innerText=u.username;profileUsername.innerText=u.username;pEmail.innerText=u.email;pBio.innerText=u.bio||"Tiruchuli to World 🌍";profilePic.src=u.photo;postCount.innerText=u.posts||0;followerCount.innerText=u.followers||0;followingCount.innerText=u.following||0;

// Own profile vs others
let actionBtn=document.getElementById('profileActionBtn');
if(uid===currentUser.uid){actionBtn.innerText="Edit profile";actionBtn.className="edit-btn";actionBtn.onclick=editProfile;}else{
let isFollowing=await checkIsFollowing(uid);
actionBtn.innerText=isFollowing?"Following":"Follow";actionBtn.className=isFollowing?"edit-btn":"follow-btn-main";actionBtn.onclick=()=>toggleFollow(uid);
}

let myPostsSnap=await db.collection("reels").where("uid","==",uid).get();
let h="";myPostsSnap.forEach(d=>{h+=`<div style="aspect-ratio:1/1;background:#111;"><img src="${d.data().videoUrl}" style="width:100%;height:100%;object-fit:cover;"></div>`;});
myPosts.innerHTML=h||"<p style='text-align:center;color:#333;padding:20px;'>No posts</p>";
}

async function checkIsFollowing(targetUid){
let snap=await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).get();
return snap.exists;
}

async function toggleFollow(targetUid){
let followingRef=db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid);
let followerRef=db.collection("users").doc(targetUid).collection("followers").doc(currentUser.uid);
let isFollowing=await checkIsFollowing(targetUid);
if(isFollowing){
await followingRef.delete();await followerRef.delete();
await db.collection("users").doc(currentUser.uid).update({following:firebase.firestore.FieldValue.increment(-1)});
await db.collection("users").doc(targetUid).update({followers:firebase.firestore.FieldValue.increment(-1)});
}else{
await followingRef.set({uid:targetUid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
await followerRef.set({uid:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
await db.collection("users").doc(currentUser.uid).update({following:firebase.firestore.FieldValue.increment(1)});
await db.collection("users").doc(targetUid).update({followers:firebase.firestore.FieldValue.increment(1)});
}
loadProfileStats(targetUid);
}

async function editProfile(){
let newBio=prompt("Bio enna da?",document.getElementById('pBio').innerText);
if(newBio!==null){await db.collection("users").doc(currentUser.uid).update({bio:newBio});loadProfileStats(currentUser.uid);}
}

async function loadFeed(){
try{
let s=await db.collection("reels").orderBy("createdAt","desc").limit(20).get();
let h="";
for(let doc of s.docs){
let x=doc.data();
let uSnap=await db.collection("users").doc(x.uid).get();
let u=uSnap.exists?uSnap.data():{username:x.email};
let isLiked=x.likedBy&&x.likedBy.includes(currentUser.uid);
let isOwn=x.uid===currentUser.uid;
h+=`<div class="post">
<div class="post-top">
<div style="display:flex;gap:10px;align-items:center;cursor:pointer;" onclick="viewUserProfile('${x.uid}')">
<img src="${u.photo||'https://i.pravatar.cc/100?u='+x.email}" style="width:32px;height:32px;border-radius:50%;">
<b style="font-size:13px;">${u.username||x.email}</b>
</div>
${!isOwn?`<button onclick="toggleFollow('${x.uid}')" style="background:${await checkIsFollowing(x.uid)?'#222':'#0095f6'};color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;">${await checkIsFollowing(x.uid)?'Following':'Follow'}</button>`:`<span>⋯</span>`}
</div>
<div class="post-img-wrap" ondblclick="doubleTapLike('${doc.id}',this)"><img class="post-img" src="${x.videoUrl}"></div>
<div class="post-actions">
<button class="action-btn" onclick="likePost('${doc.id}',this)">${isLiked?'❤️':'🤍'}</button>
<button class="action-btn" onclick="openComments('${doc.id}')">💬</button>
<button class="action-btn" onclick="sharePost()">↗️</button>
</div>
<div style="padding:0 14px 2px 14px;"><b style="font-size:13px;">${x.likes||0} likes</b></div>
<div style="padding:2px 14px 12px 14px;font-size:13px;"><b>${u.username||x.email}</b> ${x.caption||''}</div>
</div>`;
}
feed.innerHTML=h||"<p style='text-align:center;margin-top:80px;color:#444;'>No posts yet - + tap pannu da Giri</p>";
}catch(e){feed.innerHTML=e.message;}
}

function viewUserProfile(uid){viewingUid=uid;feed.style.display="none";profileBox.style.display="block";loadProfileStats(uid);}
function doubleTapLike(id,el){let heart=document.createElement('div');heart.className='heart-pop';heart.innerText='❤️';heart.style.cssText="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;animation:heartPop.9s ease forwards;";el.appendChild(heart);setTimeout(()=>heart.remove(),900);likePost(id,null);}
async function likePost(id,btn){let ref=db.collection("reels").doc(id);let doc=await ref.get();let x=doc.data();let liked=x.likedBy&&x.likedBy.includes(currentUser.uid);if(btn)btn.innerText=liked?'🤍':'❤️';if(liked)await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});else await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});}
function sharePost(){navigator.clipboard.writeText(location.href);alert("Link copied da");}
async function openComments(id){currentCommentPostId=id;commentBox.style.display="block";let s=await db.collection("reels").doc(id).collection("comments").orderBy("createdAt","asc").get();let h="";s.forEach(d=>{h+=`<div style="padding:6px 0;"><b style="font-size:13px;">${d.data().email}</b> ${d.data().text}</div>`;});commentList.innerHTML=h||"No comments"; }
async function addComment(){let t=commentInput.value.trim();if(!t)return;await db.collection("reels").doc(currentCommentPostId).collection("comments").add({email:currentUser.email.split("@")[0],text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp()});commentInput.value="";openComments(currentCommentPostId);}
function showFollowers(){alert("Followers list - Week 9 la full varum da");}
function showFollowing(){alert("Following list - Week 9 la full varum da");}
</script>
</body>
</html>
