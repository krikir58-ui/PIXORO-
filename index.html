<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PIXORO V8.2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>iframe{display:none!important;}div[style*="position: fixed"]{display:none!important;}body{background:#000;color:#fff;font-family:Arial;padding:12px;text-align:center;margin:0}h1{color:#FFD700;letter-spacing:5px;margin:12px 0 3px;font-size:26px}.sub{color:#ff3366;font-size:9px;letter-spacing:2px;margin-bottom:12px}.box{background:#111;border:1px solid #333;padding:13px;border-radius:14px;margin-bottom:10px;text-align:left}.box h3{color:#FFD700;margin:0 0 8px}input{width:100%;padding:10px;margin-bottom:7px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}button{width:100%;padding:11px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.feed{display:none}.pfp{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle;margin-right:7px}.big-pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 8px}.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#FFD700,#ff3366);display:inline-block}.story-ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;display:block}.story-bar{display:flex;overflow-x:auto;padding:10px 0;gap:4px}.story-item{text-align:center;min-width:70px;cursor:pointer}.story-item b{font-size:10px;display:block;margin-top:4px;width:70px;overflow:hidden;text-overflow:ellipsis}.story-add{width:62px;height:62px;border-radius:50%;border:2px dashed #FFD700;display:flex;align-items:center;justify-content:center;font-size:28px;background:#111;color:#FFD700}.post{background:#111;border:1px solid #333;padding:11px;border-radius:14px;margin:11px 0}#storyView{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;flex-direction:column}.story-progress{height:3px;background:#333;width:100%;margin:8px 0}.story-progress-fill{height:100%;background:#FFD700;width:0%}#cropModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}.crop-box{width:300px;height:300px;overflow:hidden;position:relative;border:3px solid #FFD700;border-radius:50%;background:#222}.crop-box.post-mode{border-radius:12px;height:380px}.crop-box img{position:absolute;top:0;left:0;cursor:move;max-width:none}</style></head><body>
<h1>PIXORO V1</h1><div class="sub">V8.2 STORY FIX 👑</div>
<div id="authDiv"><div class="box"><h3>Signup</h3><input id="su_user" placeholder="giri"><input id="su_pass" type="password" placeholder="Password"><button onclick="signupUser()">Signup</button></div><div class="box"><h3>Login</h3><input id="li_user" placeholder="giri"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div></div>
<div id="feedDiv" class="feed">
<div class="box"><h3>🔥 Stories Da - 24hrs</h3><div id="storyBar" class="story-bar">Loading...</div><div id="storyDebug" style="font-size:10px;color:#666;margin-top:6px"></div></div>
<div class="box" style="text-align:center"><img id="myPfp" class="big-pfp" src="https://via.placeholder.com/90"><h3>Welcome <span id="uName"></span> 👑</h3><button onclick="logoutUser()" style="background:#111;color:#ff4444;margin-top:6px;border:1px solid #333;font-size:11px">Logout</button></div>
<div class="box"><h3>📸 Story Pannu Da</h3><input type="file" id="storyFile" accept="image/*" onchange="openCropper(this,'story')" style="display:none"><button onclick="document.getElementById('storyFile').click()" style="background:linear-gradient(45deg,#FFD700,#ff3366);color:#000">+ Add Story 🔥 (24hrs)</button><img id="storyPreview" style="width:100%;border-radius:12px;display:none;margin:8px 0"><button id="storyBtn" onclick="createStory()" style="display:none;background:#ff3366;color:#fff;margin-top:8px">Story Podu Da 🚀</button></div>
<div class="box"><h3>Post Pannu Da 📸</h3><input type="file" id="imgFile" accept="image/*" onchange="openCropper(this,'post')" style="display:none"><button onclick="document.getElementById('imgFile').click()" style="background:#222;color:#FFD700;border:1px dashed #FFD700;margin-bottom:8px">📁 Gallery Photo</button><img id="preview" style="width:100%;border-radius:12px;display:none;margin:8px 0"><input id="cap" placeholder="Caption"><button onclick="createPost()">Post Podu Da 🔥</button></div><div id="posts"></div></div>
<div id="storyView"><div class="story-progress"><div id="storyProg" class="story-progress-fill"></div></div><div style="display:flex;justify-content:space-between;padding:10px"><div style="display:flex;align-items:center"><img id="svPfp" class="pfp" src=""><b id="svName">@user</b></div><button onclick="closeStory()" style="width:auto;background:#222;color:#fff;padding:8px 16px;border-radius:20px">✕</button></div><img id="svImg" style="width:100%;flex:1;object-fit:contain;background:#000"></div>
<div id="cropModal"><h3 style="color:#FFD700" id="cropTitle">Crop Pannu</h3><div id="cropContainer" class="crop-box"><img id="cropImg" src=""></div><input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" oninput="applyZoom()" style="width:300px;margin-top:12px"><div style="margin-top:10px"><button onclick="doCrop()" style="background:#00ff88;width:auto;padding:9px 20px;border-radius:20px">OK ✅</button><button onclick="closeCropper()" style="background:#222;color:#fff;width:auto;padding:9px 20px;border-radius:20px;margin-left:6px">Cancel</button></div></div><canvas id="c" style="display:none"></canvas>
<script>
setInterval(()=>{document.querySelectorAll('div').forEach(el=>{if(el.innerText&&el.innerText.includes('Hide this banner'))el.remove();});},500);
const SUPABASE_URL="https://yecpltndhlzfjplzhcpm.supabase.co";const SUPABASE_KEY="sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let selectedFile=null,storyFileBlob=null,cropMode='pfp',currentScale=1,posX=0,posY=0,isDrag=false,startX,startY,imgOrigW,imgOrigH,currentStories=[],currentStoriesView=[],currentStoryIdx=0,storyTimer=null;
function signupUser(){let u=su_user.value.trim().toLowerCase(),p=su_pass.value.trim();if(!u||!p)return alert("Poduda");sb.from('users').insert([{username:u,password:p}]).then(e=>{if(e.error&&!e.error.message.includes('duplicate'))return alert(e.error.message);localStorage.setItem('pix_user',u);location.reload();});}
function loginUser(){let u=li_user.value.trim().toLowerCase();sb.from('users').select('*').eq('username',u).single().then(e=>{if(e.error)return alert("User illa");localStorage.setItem('pix_user',u);location.reload();});}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){let u=localStorage.getItem('pix_user');if(!u)return;authDiv.style.display='none';feedDiv.style.display='flex';feedDiv.style.flexDirection='column';uName.innerText=u;let {data}=await sb.from('users').select('profile_pic').eq('username',u).single();if(data?.profile_pic)myPfp.src=data.profile_pic;loadPosts();loadStories();}
async function loadStories(){
 let {data:stories,error}=await sb.from('stories').select('*').order('created_at',{ascending:false});
 document.getElementById('storyDebug').innerText= error? "Error: "+error.message : "Total stories in DB: "+(stories?.length||0);
 if(error){storyBar.innerHTML=`DB Error: ${error.message}<br>SQL run panniya da?`;return;}
 if(!stories||stories.length==0){storyBar.innerHTML=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div><span style="color:#666;font-size:11px;margin-left:10px">No stories yet - First story nee podu da 🔥</span>`;return;}
 let {data:users}=await sb.from('users').select('username,profile_pic');let userMap={};(users||[]).forEach(x=>userMap[x.username]=x.profile_pic);
 let grouped={};stories.forEach(s=>{if(!grouped[s.username])grouped[s.username]=[];grouped[s.username].push(s);});
 let h=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div>`;
 Object.keys(grouped).forEach(un=>{let pfp=userMap[un]||'https://via.placeholder.com/40';let count=grouped[un].length;h+=`<div class="story-item" onclick="viewUserStories('${un}')"><div class="story-ring"><img src="${pfp}"></div><b>@${un} ${count>1?'('+count+')':''}</b></div>`;});
 storyBar.innerHTML=h;currentStories=stories;
}
async function createStory(){
 if(!storyFileBlob)return alert("Photo select pannu da");
 let btn=document.getElementById('storyBtn');btn.innerText="Uploading... ⏳";btn.disabled=true;
 try{
  let fname=Date.now()+"_story.jpg";let f=new File([storyFileBlob],"story.jpg",{type:"image/jpeg"});
  let {error:upErr}=await sb.storage.from('post-images').upload(fname,f);if(upErr)throw upErr;
  let {data}=sb.storage.from('post-images').getPublicUrl(fname);
  let u=localStorage.getItem('pix_user');
  let {error:insErr}=await sb.from('stories').insert([{username:u,image_url:data.publicUrl}]);
  if(insErr)throw insErr;
  alert("Story OK da! 🔥");storyPreview.style.display='none';storyBtn.style.display='none';storyFileBlob=null;loadStories();
 }catch(err){alert("STORY ERROR DA:\n"+err.message+"\n\nSQL ah run panniya nu paaru da!");}
 btn.innerText="Story Podu Da 🚀";btn.disabled=false;
}
function viewUserStories(username){let userStories=currentStories.filter(s=>s.username==username);openStoryView(userStories,0);}
function openStoryView(stories,idx){currentStoriesView=stories;currentStoryIdx=idx;let s=stories[idx];storyView.style.display='flex';svImg.src=s.image_url;svName.innerText='@'+s.username;sb.from('users').select('profile_pic').eq('username',s.username).single().then(({data})=>{svPfp.src=data?.profile_pic||'https://via.placeholder.com/40';});let prog=0;clearInterval(storyTimer);storyProg.style.width='0%';storyTimer=setInterval(()=>{prog+=1;storyProg.style.width=prog+'%';if(prog>=100){clearInterval(storyTimer);nextStory();}},50);}
function nextStory(){currentStoryIdx++;if(currentStoryIdx<currentStoriesView.length){openStoryView(currentStoriesView,currentStoryIdx);}else{closeStory();}}
function closeStory(){storyView.style.display='none';clearInterval(storyTimer);}
function openCropper(input,mode){cropMode=mode;let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{cropImg.src=e.target.result;cropContainer.className=mode==='pfp'?'crop-box':'crop-box post-mode';cropModal.style.display='flex';setTimeout(()=>initCropper(),100);};r.readAsDataURL(file);}
function initCropper(){let img=cropImg;imgOrigW=img.naturalWidth;imgOrigH=img.naturalHeight;let box=cropContainer,bw=box.clientWidth,bh=box.clientHeight;let scale=Math.max(bw/imgOrigW,bh/imgOrigH);currentScale=scale;posX=(bw-imgOrigW*scale)/2;posY=(bh-imgOrigH*scale)/2;zoomRange.value=scale;zoomRange.min=scale*0.8;zoomRange.max=scale*3;applyTransform();setupDrag();}
function applyTransform(){cropImg.style.width=(imgOrigW*currentScale)+'px';cropImg.style.height=(imgOrigH*currentScale)+'px';cropImg.style.left=posX+'px';cropImg.style.top=posY+'px';}
function applyZoom(){currentScale=parseFloat(zoomRange.value);applyTransform();}
function setupDrag(){let img=cropImg;let getPos=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};img.onmousedown=img.ontouchstart=e=>{isDrag=true;let p=getPos(e);startX=p.x-posX;startY=p.y-posY;e.preventDefault();};window.onmousemove=window.ontouchmove=e=>{if(!isDrag)return;let p=getPos(e);posX=p.x-startX;posY=p.y-startY;applyTransform();};window.onmouseup=window.ontouchend=()=>{isDrag=false;};}
function closeCropper(){cropModal.style.display='none';}
function doCrop(){let box=cropContainer,img=cropImg,canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let bw=box.clientWidth,bh=box.clientHeight;if(cropMode==='pfp'){canvas.width=500;canvas.height=500;}else if(cropMode==='story'){canvas.width=720;canvas.height=1280;}else{canvas.width=800;canvas.height=1000;}let sx=(-posX)/currentScale,sy=(-posY)/currentScale,sW=bw/currentScale,sH=bh/currentScale;ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,sx,sy,sW,sH,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(cropMode==='story'){storyPreview.src=URL.createObjectURL(blob);storyPreview.style.display='block';storyBtn.style.display='block';storyFileBlob=blob;}else{preview.src=URL.createObjectURL(blob);preview.style.display='block';selectedFile=blob;}closeCropper();},'image/jpeg',0.92);}
async function createPost(){let cap=document.getElementById('cap').value.trim(),u=localStorage.getItem('pix_user');if(!selectedFile)return alert("Photo select pannu");let fname=Date.now()+"_post.jpg";let f=new File([selectedFile],"post.jpg",{type:"image/jpeg"});let {error}=await sb.storage.from('post-images').upload(fname,f);if(error)return alert(error.message);let {data}=sb.storage.from('post-images').getPublicUrl(fname);await sb.from('posts').insert([{username:u,image_url:data.publicUrl,caption:cap}]);alert("Post OK da!");cap.value="";preview.style.display='none';selectedFile=null;loadPosts();}
async function loadPosts(){let u=localStorage.getItem('pix_user');let {data:posts}=await sb.from('posts').select('*').order('id',{ascending:false});if(!posts||posts.length==0){document.getElementById('posts').innerHTML="<p style='color:#666'>No posts</p>";return;}let {data:users}=await sb.from('users').select('username,profile_pic');let userMap={};(users||[]).forEach(x=>userMap[x.username]=x.profile_pic);let h='';posts.forEach(p=>{let pfp=userMap[p.username]||'https://via.placeholder.com/40';h+=`<div class="post"><div style="display:flex;align-items:center"><img class="pfp" src="${pfp}"><b>@${p.username}</b></div><br><img src="${p.image_url}" style="width:100%;border-radius:10px"><p>${p.caption||''}</p></div>`;});document.getElementById('posts').innerHTML=h;}
checkUser();
</script></body></html>
