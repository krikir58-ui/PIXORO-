<!-- PIXORO Bottom Navigation -->
<nav class="bottom-nav">
  <button onclick="showPage('home')">🏠<span>Home</span></button>
  <button onclick="showPage('search')">🔍<span>Search</span></button>
  <button onclick="showPage('create')">➕<span>Create</span></button>
  <button onclick="showPage('reels')">🎬<span>Reels</span></button>
  <button onclick="showPage('profile')">👤<span>Profile</span></button>
</nav>

<div id="pageContent"></div>

<script>
function showPage(page) {

  const content = document.getElementById("pageContent");

  if (page === "home") {
    content.innerHTML = `
      <h2>🏠 PIXORO</h2>
      <p>Welcome to your feed!</p>
    `;
  }

  if (page === "search") {
    content.innerHTML = `
      <h2>🔍 Search</h2>
      <input type="text" placeholder="Search users or posts..."
             style="width:90%;padding:12px;border-radius:10px;">
    `;
  }

  if (page === "create") {
    content.innerHTML = `
      <h2>➕ Create Post</h2>
      <input type="file" accept="image/*,video/*">
      <br><br>
      <input type="text" placeholder="Write a caption..."
             style="padding:12px;width:90%;">
      <br><br>
      <button onclick="alert('Post created!')">Post</button>
    `;
  }

  if (page === "reels") {
    content.innerHTML = `
      <h2>🎬 PIXORO Reels</h2>
      <p>Short videos will appear here.</p>
    `;
  }

  if (page === "profile") {
    content.innerHTML = `
      <h2>👤 My Profile</h2>
      <p>@pixoro_user</p>
      <p>Followers: 0 &nbsp; Following: 0</p>
      <button>Edit Profile</button>
    `;
  }
}
</script>
