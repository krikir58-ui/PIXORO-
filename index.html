<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXORO</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #111;
}

body {
    padding-bottom: 70px;
}

/* HEADER */
.header {
    width: 100%;
    height: 60px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #1296ed;
}

.header-icons {
    display: flex;
    gap: 18px;
}

.icon-btn {
    border: none;
    background: transparent;
    font-size: 24px;
    cursor: pointer;
}

/* CONTENT */
.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

/* CREATE POST */
.create-post {
    background: white;
    margin: 10px 0;
    padding: 14px;
    border-radius: 10px;
}

.create-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #1296ed;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.post-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 11px 15px;
    outline: none;
}

/* POST */
.post {
    background: white;
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
}

.user-info {
    flex: 1;
}

.username {
    font-weight: bold;
}

.time {
    font-size: 12px;
    color: #777;
}

.more {
    border: none;
    background: transparent;
    font-size: 22px;
}

/* POST IMAGE */
.post-image {
    width: 100%;
    height: 380px;
    background: linear-gradient(135deg, #1296ed, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 45px;
    font-weight: bold;
}

/* ACTIONS */
.post-actions {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    gap: 15px;
}

.like-button {
    border: none;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
}

.like-button.liked {
    color: red;
}

.comment-action,
.share-action {
    border: none;
    background: transparent;
    font-size: 23px;
    cursor: pointer;
}

.like-count {
    padding: 2px 14px 5px;
    font-weight: bold;
}

.caption {
    padding: 0 14px 14px;
    font-size: 15px;
    line-height: 1.5;
}

/* COMMENTS */
.comments {
    padding: 0 14px 10px;
}

.comment {
    margin: 6px 0;
    font-size: 14px;
}

.comment-box {
    width: 100%;
    display: flex;
    border-top: 1px solid #eee;
}

.comment-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 14px;
    font-size: 15px;
}

.comment-button {
    border: none;
    background: white;
    color: #1296ed;
    font-weight: bold;
    padding: 0 15px;
    cursor: pointer;
}

/* PROFILE */
.profile-page {
    display: none;
    background: white;
    margin-top: 10px;
    padding: 30px 15px;
    text-align: center;
    border-radius: 14px;
}
