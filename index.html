<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXORO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  width: 100%;
  height: 70px;
  background: white;
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
  border-bottom: 1px solid #ddd;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.search {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 25px;
}

.owner {
  font-weight: bold;
  font-size: 13px;
}

main {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.stories {
  background: white;
  margin-top: 10px;
  padding: 15px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
  border-radius: 12px;
}

.story {
  min-width: 65px;
  text-align: center;
}

.story img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #ff2685;
}

.create {
  background: white;
  margin-top: 10px;
  padding: 20px;
  border-radius: 12px;
}

.create button {
  background: #1296ed;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 8px;
  margin-top: 10px;
}

.post {
  background: white;
  margin-top: 10px;
  border: 1px solid #ddd;
}

.post-header {
  padding: 12px;
  font-weight: bold;
}

.post-image {
  width: 100%;
  display: block;
}

.actions {
  padding: 12px;
  font-size: 28px;
}

.caption {
  padding: 0 12px 15px;
}

@media (max-width: 600px) {
  .logo {
    font-size: 22px;
  }

  .owner {
    font-size: 11px;
  }

  main {
    width: 100%;
  }

  .post {
    border-left: 0;
    border-right: 0;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">PIXORO</div>

  <input
    class="search"
    type="text"
    placeholder="Search users..."
  >

  <div class="owner">
    👑 OWNER
  </div>

</header>

<main>

  <div class="stories">

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=12">
      <p>You</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=2">
      <p>Arun</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=3">
      <p>Kavi</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=4">
      <p>Ravi</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=5">
      <p>Priya</p>
    </div>

  </div>

  <div class="create">

    <h2>Create Post</h2>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <br>

    <button onclick="createPost()">
      Post
    </button>

  </div>

  <div class="post">

    <div class="post-header">
      @pixoro_user 👑
    </div>

    <img
      class="post-image"
      src="https://picsum.photos/600/600"
      alt="PIXORO"
    >

    <div class="actions">
      ♡ &nbsp; 💬 &nbsp; ↗
    </div>

    <div class="caption">
      <b>@pixoro_user</b>
      Welcome to PIXORO 🚀
    </div>

  </div>

</main>

<script>

function createPost() {

  var file =
    document.getElementById("photo").files[0];

  if (!file) {
    alert("Please choose a photo");
    return;
  }

  var reader =
    new FileReader();

  reader.onload = function(e) {

    var post =
      document.createElement("div");

    post.className = "post";

    post.innerHTML =
      '<div class="post-header">' +
      '@pixoro_user 👑' +
      '</div>' +

      '<img class="post-image" src="' +
      e.target.result +
      '">' +

      '<div class="actions">' +
      '♡ &nbsp; 💬 &nbsp; ↗' +
      '</div>' +

      '<div class="caption">' +
      '<b>@pixoro_user</b> ' +
      'My new PIXORO post 🚀' +
      '</div>';

    document
      .querySelector("main")
      .appendChild(post);

  };

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
