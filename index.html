<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🔵</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/comments.css">
<link rel="stylesheet" href="css/follow.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.post{border-bottom:1px solid #222;padding-bottom:10px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%!important;aspect-ratio:1/1!important;object-fit:cover!important;display:block!important}
.actions{padding:10px 12px;display:flex;gap:18px;align-items:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px}.nav a.active{color:#fff}
.heart-btn,.cmt-btn,.share-btn{background:none;border:0;cursor:pointer}
.heart-btn.liked svg{fill:#ff3040!important;stroke:#ff3040!important;animation:likePop 0.3s ease}
@keyframes likePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes heartBlast{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
/* PROFILE CIRCLE SECRET */
.pfpRing{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:2px;cursor:pointer;flex-shrink:0}
.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}
.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pfpBig{width:88px;height:88px}
</style></head><body>
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><span>📩</span></div>

<!-- NAMMA PHOTO CIRCLE HEADER -->
<div style="padding:16px;display:flex;gap:18px;align-items:center;border-bottom:1px solid #222">
  <div style="position:relative">
    <div class="pfpRing pfpBig" onclick="chooseGilli()"><div class="pfpInner"><img src="https://i.pravatar.cc/300?u=Giri" id="myPfp"></div></div>
    <div onclick="chooseGilli()" style="position:absolute;bottom:0;right:0;background:#0095f6;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #000;cursor:pointer;font-size:14px">📷</div>
  </div>
  <div style="flex:1">
    <b style="font-size:18px">@Giri</b><br>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:14px">
      <span><b id="myPostCount">0</b> posts</span>
      <span onclick="openFollowModal('Giri','followers')" style="cursor:pointer"><b id="myFollowers">0</b> followers</span>
      <span onclick="openFollowModal('Giri','following')" style="cursor:pointer"><b id="myFollowing">0</b> following</span>
    </div>
    <div style="margin-top:6px;font-size:13px;color:#aaa">Pixoro Founder 🔵<br>Tap 📷 to set your photo</div>
    <button onclick="chooseGilli()" style="margin-top:8px;background:#222;border:1px solid #444;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer">Choose My Photo</button>
  </div>
</div>
<input type="file" id="gilliInput" accept="image/*" hidden>

<div id="feed"></div><div style="height:70px"></div>
<div class="nav"><a class="active">🏠</a><a href="reels.html">🎬</a><a>➕</a><a>🔎</a><a>👤</a></div>

<div id="commentModal" onclick="if(event.target==this)closeComments()"><div id="commentSheet"><div class="cmtHeader">Comments <span onclick="closeComments()" style="position:absolute;right:15px;top:12px;font-size:20px;cursor:pointer">✕</span></div><div id="cmtList" class="cmtList"></div><div id="replyTag" class="replyTag" style="display:none"><span id="replyTxt"></span><span onclick="cancelReply()" style="cursor:pointer">✕</span></div><div class="emojiBar"><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😂')">😂</span></div><div class="cmtInputArea"><div class="cmtBox"><div style="width:32px;height:32px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center">G</div><input id="cmtInput" placeholder="What do you think?" onkeydown="if(event.key==='Enter')postComment()"><button class="sendBtn" onclick="postComment()">↑</button></div></div></div></div>
<div id="cmtOptionModal" onclick="if(event.target==this)closeCmtOptions()"><div id="cmtOptBox"><div style="width:40px;height:4px;background:#555;border-radius:10px;margin:8px auto"></div><div id="cmtOptContent"></div></div></div>
<div id="followModal" onclick="if(event.target==this)closeFollowModal()"><div id="followSheet"><div style="padding:14px;text-align:center;border-bottom:1px solid #222;position:relative"><b id="followTitle">Followers</b><span onclick="closeFollowModal()" style="position:absolute;right:15px;top:12px;font-size:20px;cursor:pointer">✕</span><div class="followHeader"><span id="tabFollowers" onclick="switchFollowTab('followers')">Followers</span><span id="tabFollowing" onclick="switchFollowTab('following')">Following</span><span id="tabRequests" onclick="switchFollowTab('requests')">Requests</span></div></div><div id="followList" class="followList"></div></div></div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME='Giri'
let allPosts=[], allLikes=[], allComments=[], allFollows=[], blockedUsers=[]

function blastHeart(){let h=document.createElement('div');h.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:9999;animation:heartBlast 1s ease-out;pointer-events:none';h.innerHTML='❤️🔵';document.body.appendChild(h);setTimeout(()=>h.remove(),1000);if(navigator.vibrate)navigator.vibrate(100)}

// NAMMA PHOTO CHOOSE CODE 🔵
function chooseGilli(){ document.getElementById('gilliInput').click(); }
document.getElementById('gilliInput').addEventListener('change', function(e){
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = function(ev){
    let dataUrl = ev.target.result;
    document.getElementById('myPfp').src = dataUrl;
    localStorage.setItem('pixoro_gilli_pfp', dataUrl);
    renderFeed();
    alert('Namma photo set aachu da! 🔵');
  };
  reader.readAsDataURL(file);
});

function pfpHtml(username){
  let saved = localStorage.getItem('pixoro_gilli_pfp');
  let pic = (username===ME && saved)? saved : `https://i.pravatar.cc/100?u=${username}`;
  return `<div class="pfpRing" onclick="openFollowModal('${username}','followers')"><div class="pfpInner"><img src="${pic}"></div></div>`;
}
async function loadAll(){
 let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false})
 let {data:likes}=await supa.from('likes').select('*')
 let {data:comments}=await supa.from('comments').select('*').order('created_at',{ascending:true})
 allPosts=posts||[]; allLikes=likes||[]; allComments=comments||[];
 let saved = localStorage.getItem('pixoro_gilli_pfp');
 if(saved) document.getElementById('myPfp').src = saved;
 await loadFollows(); renderFeed(); updateProfileCounts();
}
function updateProfileCounts(){
  if(document.getElementById('myPostCount')) document.getElementById('myPostCount').innerText = allPosts.filter(p=>p.username===ME).length;
  if(document.getElementById('myFollowers')) document.getElementById('myFollowers').innerText = getFollowersCount(ME);
  if(document.getElementById('myFollowing')) document.getElementById('myFollowing').innerText = getFollowingCount(ME);
}
function renderFeed(){
 let html=''
 for(let p of allPosts){
  if(blockedUsers.includes(p.username)) continue;
  let lCount=allLikes.filter(l=>l.post_id==p.id).length
  let cCount=allComments.filter(c=>c.post_id==p.id).length
  let isLiked=allLikes.some(l=>l.post_id==p.id && l.username==ME)
  html+=`<div class="post">
   <div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<div><b onclick="openFollowModal('${p.username}','followers')" style="cursor:pointer">@${p.username}</b><div style="font-size:11px;color:#777">${getFollowersCount(p.username)} followers</div></div></div>${followBtnHtml(p.username)}</div>
   <img class="main" src="${p.image_url}" ondblclick="likePost(${p.id});blastHeart()">
   <div class="actions">
     <button onclick="likePost(${p.id})" class="heart-btn ${isLiked?'liked':''}"><svg viewBox="0 0 24 24" width="26" height="26" fill="${isLiked?'#ff3040':'none'}" stroke="${isLiked?'#ff3040':'#fff'}" stroke-width="2"><path d="M12 21s-6.5-4.35-9-8.5S3 4 8.5 4 12 7.5 12 7.5 15 4 20.5 4 21 8.5 18 12.5 12 21 12 21z"/></svg></button>
     <button onclick="openComments(${p.id})" class="cmt-btn"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
     <button onclick="sharePost()" class="share-btn"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
   </div>
   <div style="padding:0 12px"><b>${lCount} likes</b> • <b onclick="openComments(${p.id})" style="color:#aaa;cursor:pointer">${cCount>0?`View ${cCount} comments`:'Add comment'}</b><br><b>@${p.username}</b> ${p.caption||''}</div>
  </div>`
 }
 document.getElementById('feed').innerHTML=html
}
async function likePost(id){
 let liked=allLikes.some(l=>l.post_id==id && l.username==ME)
 if(liked){ await supa.from('likes').delete().eq('post_id',id).eq('username',ME) } else { await supa.from('likes').insert({post_id:id,username:ME}); blastHeart() }
 let {data}=await supa.from('likes').select('*'); allLikes=data||[]; renderFeed()
}
function sharePost(){ if(navigator.share){navigator.share({title:'Pixoro',url:location.href})} else {prompt('Copy link:',location.href)} }
loadAll()
</script>
<script src="js/follow.js"></script>
<script src="js/comments.js"></script>
<script src="js/realtime.js"></script>
<script>setTimeout(()=>{if(window.enableRealtime)enableRealtime()},1200)</script>
</body></html>
