<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:470px;min-height:100vh;background:#fff;position:relative;padding-bottom:70px}
.insta{font-family:'Grand Hotel',cursive;font-size:34px}
#splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2.5px;border-radius:50%;display:inline-block}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #efefef;display:flex;justify-content:space-between;padding:10px 12px;align-items:center}
.stories{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #efefef}
.post{border-bottom:1px solid #efefef}
.bottom{position:fixed;bottom:0;width:100%;max-width:470px;background:#000;color:#fff;display:flex;justify-content:space-around;padding:14px 0;font-size:22px;z-index:50;border-top:1px solid #222}
.modal{position:fixed;inset:0;z-index:100;display:none;background:#fff;flex-direction:column}.modal.on{display:flex}
#noti{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:200;display:none}
.listItem{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f2f2f2}
#zoomModal{background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:120}
#zoomModal img{width:85vw;height:85vw;max-width:340px;max-height:340px;border-radius:50%;border:4px solid #fff;object-fit:cover}
</style>
</head><body>
<div id="splash"><div class="logo">📸</div></div>
<div id="app">
<div class="top"><div class="insta">Pixoro</div><div>❤️ ✈️</div></div>
<div class="stories" id="stories"></div>
<div style="display:flex;gap:8px;padding:12px;border-bottom:1px solid #efefef;align-items:center"><img src="https://i.pravatar.cc/80?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="quickCap" placeholder="What's on mind? @tag" style="flex:1;border:0;outline:none;font-size:14px;font-family:Poppins"><button onclick="openUpload()" style="background:#0095f6;color:#fff;border:0;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700">Post</button></div>
<div id="feed"></div>
<div class="bottom"><span>🏠</span><span>🔍</span><span onclick="openUpload()" style="border:1px solid #fff;padding:2px 14px;border-radius:8px">+</span><span>🎬</span><span onclick="openProfilePage('girikri')">👤</span></div>

<div id="uploadModal" class="modal"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeUpload()">✕</span><b>New post</b><span onclick="shareNow()" style="color:#0095f6;font-weight:700">Share</span></div><div style="flex:1;background:#111;display:flex;align-items:center;justify-content:center" onclick="document.getElementById('fileInput').click()"><div id="previewBox" style="display:none;width:100%;height:100%"><img id="previewImg" style="width:100%;height:100%;object-fit:contain"></div><p id="noPhoto" style="color:#fff">Tap + to select photo</p></div><textarea id="captionInput" placeholder="Caption @mention #tag" style="padding:12px;border:0;outline:none" rows="2"></textarea></div>

<div id="profilePage" class="modal" style="overflow-y:auto;z-index:90"><div style="padding:12px;border-bottom:1px solid #efefef;display:flex;justify-content:space-between"><span onclick="closeProfilePage()">←</span><b id="pUser" style="font-family:'Grand Hotel';font-size:28px">girikri</b><span>⋯</span></div><div style="padding:16px;display:flex;gap:16px;align-items:center"><div class="ring" onclick="openZoom(document.getElementById('pImg').src)"><img id="pImg" src="https://i.pravatar.cc/150?u=giri" style="width:88px;height:88px;border-radius:50%;padding:3px;background:#fff;object-fit:cover"></div><div style="flex:1;display:flex;justify-content:space-around;text-align:center"><div onclick="void(0)"><div id="pPosts" style="font-weight:700;font-size:18px">0</div><div style="font-size:12px">Posts</div></div><div onclick="openFollowers()"><div id="pFollowers" style="font-weight:700;font-size:18px">129</div><div style="font-size:12px">Followers</div></div><div onclick="openFollowing()"><div id="pFollowing" style="font-weight:700;font-size:18px">1</div><div style="font-size:12px">Following</div></div></div></div><div style="padding:0 16px"><p id="pName" style="font-weight:700">Giri 🔥</p><p style="font-size:13px;color:#555">Coimbatore | PIXORO Founder | DM for collab</p><p style="font-size:12px;margin-top:6px"><b id="pViews">0</b> Views • <b id="pLikes">0</b> Likes • <b id="pComments">0</b> Comments</p><div style="display:flex;gap:8px;margin-top:12px"><button id="followBtn" onclick="toggleFollow(currentP)" style="flex:1;background:#000;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:700;font-size:13px">Follow</button><button style="flex:1;background:#efefef;border:0;padding:10px;border-radius:8px;font-weight:700;font-size:13px">Message</button></div><div id="followReq" style="margin-top:12px;background:#fff0f1;border:1px solid #ffc2c8;padding:10px 12px;border-radius:10px;font-size:12px"><b>Follow Requests • 1</b><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><img src="https://i.pravatar.cc/40?u=whitezzz" style="width:32px;height:32px;border-radius:50%"><div style="flex:1"><b>whitezzz__04</b> wants to follow you</div></div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="acceptReq()" style="flex:1;background:#0095f6;color:#fff;border:0;padding:7px;border-radius:6px;font-weight:700">Accept</button><button onclick="rejectReq()" style="flex:1;background:#efefef;border:0;padding:7px;border-radius:6px">Reject</button></div></div></div><div id="pGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:16px"></div></div>

<div id="followListModal" class="modal" style="z-index:110"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeFollowList()">←</span><b id="followListTitle">Followers</b><span></span></div><div id="followList" style="overflow-y:auto;flex:1"></div></div>

<div id="commentModal" class="modal" style="z-index:110"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeComment()">✕</span><b>Comments</b><span>⋯</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:12px"></div><div style="display:flex;gap:8px;padding:10px;border-top:1px solid #efefef;align-items:center"><img src="https://i.pravatar.cc/40?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="commentInput" placeholder="Add a comment..." style="flex:1;border:1px solid #efefef;border-radius:20px;padding:9px 14px;outline:none;font-size:13px"><button onclick="postComment()" style="color:#0095f6;font-weight:700;border:0;background:0">Post</button></div></div>

<div id="zoomModal" class="modal" onclick="closeZoom()"><img id="zoomImg" src=""><p style="color:#fff;margin-top:16px;font-size:12px">Profile Photo Zoom • Tap to close</p></div>

<div id="noti"></div><input type="file" id="fileInput" accept="image/*" hidden>
</div>

<script>
let posts=JSON.parse(localStorage.getItem('pixoro_posts')||'[]');
let likes=JSON.parse(localStorage.getItem('pixoro_likes')||'{}');
let follows=JSON.parse(localStorage.getItem('pixoro_follows')||'{}');
let comments=JSON.parse(localStorage.getItem('pixoro_comments')||'{}');
let viewedIds=JSON.parse(localStorage.getItem('pixoro_viewedIds')||'[]');
let deviceId=localStorage.getItem('pixoro_device')||'dev_'+Date.now(); localStorage.setItem('pixoro_device',deviceId);
let currentP='girikri', currentCommentId=null;

if(posts.length==0){
 posts=[
  {id:1,img:'https://picsum.photos/seed/pixoro1/700/700',caption:'Mass entry da @whitezzz__04 🔥 #cbe',user:'girikri',likes:129,viewers:[deviceId],time:'now',shares:2},
  {id:2,img:'https://picsum.photos/seed/pixoro2/700/700',caption:'Coimbatore vibes 😍 sunset',user:'whitezzz__04',likes:91,viewers:[],time:'2h',shares:0}
 ]; localStorage.setItem('pixoro_posts',JSON.stringify(posts));
 comments[1]=[{user:'whitezzz__04',text:'Mass da Giri 🔥'},{user:'don_deepa',text:'Semma da!'}];
 localStorage.setItem('pixoro_comments',JSON.stringify(comments));
}

function init(){ renderFeed(); renderStories(); setTimeout(()=>{ const s=document.getElementById('splash'); if(s){ s.style.opacity='0'; s.style.transition='opacity.2s'; setTimeout(()=>s.remove(),200);} },400); }
if(document.readyState=='loading') document.addEventListener('DOMContentLoaded',init); else init();

function renderFeed(){
 const feed=document.getElementById('feed');
 feed.innerHTML=posts.map(p=>{
  const v=p.viewers?.length||0; const baseLikes=p.likes; const isL=likes[p.id]; const displayLikes=baseLikes + (isL?1:0); const c=comments[p.id]?.length||0; const isF=follows[p.user];
  return `<div class="post" data-id="${p.id}">
  <div style="display:flex;justify-content:space-between;padding:10px 12px;align-items:center">
   <div style="display:flex;gap:8px;align-items:center" onclick="openProfilePage('${p.user}')"><div class="ring"><img src="https://i.pravatar.cc/80?u=${p.user}" style="width:32px;height:32px;border-radius:50%;padding:2px;background:#fff"></div><div><div style="font-size:14px;font-weight:700">${p.user} ${isF?'<span style=color:#0095f6;font-size:11px>• Following</span>':''}</div><div style="font-size:10px;color:#888">${p.time} • <span id="view-${p.id}">${v} views</span> • <span id="c-${p.id}">${c} comments</span></div></div></div><span>⋯</span>
  </div>
  <img src="${p.img}" loading="eager" style="width:100%;aspect-ratio:1;object-fit:cover;background:#f5f5f5" ondblclick="likePost(${p.id})">
  <div style="display:flex;gap:16px;font-size:24px;padding:10px 12px;align-items:center"><span onclick="likePost(${p.id})">${isL?'❤️':'🤍'}</span><span onclick="openComment(${p.id})">💬</span><span onclick="sharePost(${p.id})">✈️</span><span style="margin-left:auto">🔖</span></div>
  <div style="padding:0 12px 12px;font-size:13px;font-weight:700;line-height:18px"><span id="like-${p.id}">${displayLikes} likes</span> • ${v} views • ${c} comments • ${p.shares||0} shares<br>
  <span style="font-weight:400"><b>${p.user}</b> ${p.caption}</span><br>
  <span onclick="openComment(${p.id})" style="font-weight:400;color:#888;font-size:12px">View all ${c} comments</span>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span onclick="likePost(${p.id})" style="background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px">${isL?'❤️ Unlike':'🤍 Like'} ${displayLikes}</span><span onclick="openComment(${p.id})" style="background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px">💬 Comment ${c}</span><span onclick="sharePost(${p.id})" style="background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px">✈️ Share ${p.shares||0}</span><span style="background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px">👁️ Views ${v}</span></div>
  </div></div>`;
 }).join(''); observePosts();
}
function observePosts(){
 const obs=new IntersectionObserver((es)=>{ es.forEach(e=>{
  if(e.isIntersecting){
   const id=parseInt(e.target.dataset.id); const p=posts.find(x=>x.id==id); if(!p.viewers) p.viewers=[];
   if(!viewedIds.includes(id)&&!p.viewers.includes(deviceId)){
    p.viewers.push(deviceId); viewedIds.push(id);
    localStorage.setItem('pixoro_posts',JSON.stringify(posts)); localStorage.setItem('pixoro_viewedIds',JSON.stringify(viewedIds));
    const el=document.getElementById(`view-${id}`); if(el) el.textContent=p.viewers.length+' views';
   }
  }
 }); },{threshold:0.6}); document.querySelectorAll('.post').forEach(el=>obs.observe(el));
}
function renderStories(){
 document.getElementById('stories').innerHTML=['whitezzz__04','don_deepa','sweety_sw'].map(u=>`<div style="display:flex;flex-direction:column;align-items:center;min-width:64px" onclick="showNoti('Story +1 view 👁️')"><div class="ring"><img src="https://i.pravatar.cc/80?u=${u}" style="width:60px;height:60px;border-radius:50%;padding:3px;background:#fff"></div><span style="font-size:11px;margin-top:4px">${u.slice(0,9)}</span><span style="font-size:10px;color:#888">50 views</span></div>`).join('');
}

// REAL LIKE / UNLIKE TOGGLE 2010-2026 SYSTEM
window.likePost=(id)=>{
 const p=posts.find(x=>x.id==id);
 if(likes[id]){ likes[id]=false; p.likes=Math.max(0,p.likes-1); showNoti('🤍 Unliked'); }
 else { likes[id]=true; p.likes++; showNoti('❤️ Liked +1 mass!'); }
 localStorage.setItem('pixoro_likes',JSON.stringify(likes));
 localStorage.setItem('pixoro_posts',JSON.stringify(posts));
 const likeEl=document.getElementById(`like-${id}`);
 if(likeEl) likeEl.textContent=(p.likes + (likes[id]?1:0))+' likes';
 renderFeed();
};

window.openComment=(id)=>{ currentCommentId=id; document.getElementById('commentModal').classList.add('on'); renderComments(); };
window.closeComment=()=>document.getElementById('commentModal').classList.remove('on');
function renderComments(){
 const list=comments[currentCommentId]||[];
 document.getElementById('commentList').innerHTML=list.map(c=>`<div style="display:flex;gap:8px;margin-bottom:12px"><img src="https://i.pravatar.cc/40?u=${c.user}" style="width:32px;height:32px;border-radius:50%"><div><b style="font-size:13px">${c.user}</b> <span style="font-size:13px">${c.text}</span><div style="font-size:10px;color:#888;margin-top:2px">1 like • Reply • now</div></div><span style="margin-left:auto">❤️</span></div>`).join('')||'<p style="color:#999;text-align:center;margin-top:30px">No comments yet.<br>Be first to comment!</p>';
}
window.postComment=()=>{ const input=document.getElementById('commentInput'); const t=input.value.trim(); if(!t) return; if(!comments[currentCommentId]) comments[currentCommentId]=[]; comments[currentCommentId].push({user:'girikri',text:t}); localStorage.setItem('pixoro_comments',JSON.stringify(comments)); input.value=''; renderComments(); renderFeed(); showNoti('💬 Comment posted!'); };

window.sharePost=(id)=>{ const p=posts.find(x=>x.id==id); p.shares=(p.shares||0)+1; localStorage.setItem('pixoro_posts',JSON.stringify(posts)); navigator.clipboard.writeText(location.href); renderFeed(); showNoti(`✈️ Shared • ${p.shares} shares`); };

window.toggleFollow=(u)=>{
 if(follows[u]){ follows[u]=false; localStorage.setItem('pixoro_follows',JSON.stringify(follows)); showNoti('Unfollowed'); }
 else { follows[u]=true; localStorage.setItem('pixoro_follows',JSON.stringify(follows)); showNoti(`Following +1 • ${u}`); }
 renderFeed(); openProfilePage(u);
};

window.openProfilePage=(u)=>{
 currentP=u; document.getElementById('profilePage').classList.add('on');
 document.getElementById('pUser').innerText=u; document.getElementById('pImg').src=`https://i.pravatar.cc/150?u=${u}`;
 const up=posts.filter(p=>p.user==u); document.getElementById('pPosts').innerText=up.length;
 let tv=0,tl=0,tc=0; up.forEach(p=>{ tv+=p.viewers?.length||0; tl+=p.likes+(likes[p.id]?1:0); tc+=comments[p.id]?.length||0; });
 document.getElementById('pViews').innerText=tv; document.getElementById('pLikes').innerText=tl; document.getElementById('pComments').innerText=tc;
 document.getElementById('pFollowing').innerText=Object.keys(follows).filter(k=>follows[k]).length||1;
 document.getElementById('pFollowers').innerText=128+(follows[u]?1:0);
 document.getElementById('pGrid').innerHTML=up.map(p=>`<img src="${p.img}" style="width:100%;aspect-ratio:1;object-fit:cover;background:#f2f2f2">`).join('')||'<p style="grid-column:1/4;text-align:center;padding:20px;color:#999">No posts</p>';
 document.getElementById('followBtn').innerText=follows[u]?'Following':'Follow'; document.getElementById('followBtn').style.background=follows[u]?'#efefef':'#000'; document.getElementById('followBtn').style.color=follows[u]?'#000':'#fff';
 document.getElementById('followReq').style.display=u=='girikri'?'block':'none';
};
window.closeProfilePage=()=>document.getElementById('profilePage').classList.remove('on');
window.openFollowers=()=>{ document.getElementById('followListModal').classList.add('on'); document.getElementById('followListTitle').innerText='Followers • 129'; document.getElementById('followList').innerHTML=['whitezzz__04','don_deepa','sweety_sw','arjun_99','priya_official','giri_mass'].map(u=>`<div class="listItem"><div style="display:flex;gap:10px;align-items:center"><img src="https://i.pravatar.cc/40?u=${u}" style="width:40px;height:40px;border-radius:50%"><div><div style="font-weight:700;font-size:13px">${u}</div><div style="font-size:11px;color:#888">Followed you • 2h ago</div></div></div><button style="background:#000;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-size:12px">Remove</button></div>`).join(''); };
window.openFollowing=()=>{ document.getElementById('followListModal').classList.add('on'); document.getElementById('followListTitle').innerText='Following • '+(Object.keys(follows).filter(k=>follows[k]).length||1); const list=Object.keys(follows).filter(k=>follows[k]); const finalList=list.length?list:['girikri']; document.getElementById('followList').innerHTML=finalList.map(u=>`<div class="listItem"><div style="display:flex;gap:10px;align-items:center"><img src="https://i.pravatar.cc/40?u=${u}" style="width:40px;height:40px;border-radius:50%"><div><div style="font-weight:700;font-size:13px">${u}</div><div style="font-size:11px;color:#888">Following • Tap to unfollow</div></div></div><button onclick="toggleFollow('${u}');closeFollowList()" style="background:#efefef;border:0;padding:6px 14px;border-radius:6px;font-size:12px">Unfollow</button></div>`).join(''); };
window.closeFollowList=()=>document.getElementById('followListModal').classList.remove('on');
window.acceptReq=()=>{ document.getElementById('followReq').innerHTML='<b style=color:green>✅ Accepted • whitezzz__04 is now follower • +1</b>'; document.getElementById('pFollowers').innerText=130; showNoti('✅ Request Accepted - Followers +1'); };
window.rejectReq=()=>{ document.getElementById('followReq').style.display='none'; showNoti('Rejected'); };
window.openZoom=(src)=>{ document.getElementById('zoomImg').src=src; document.getElementById('zoomModal').classList.add('on'); };
window.closeZoom=()=>document.getElementById('zoomModal').classList.remove('on');
window.openUpload=()=>document.getElementById('uploadModal').classList.add('on');
window.closeUpload=()=>document.getElementById('uploadModal').classList.remove('on');
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ window._img=ev.target.result; document.getElementById('previewImg').src=ev.target.result; document.getElementById('previewBox').style.display='block'; document.getElementById('noPhoto').style.display='none'; openUpload(); }; r.readAsDataURL(f); });
window.shareNow=()=>{ const cap=document.getElementById('captionInput').value||document.getElementById('quickCap').value||'Mass post 🔥'; if(!window._img) return alert('Photo select pannu da!'); posts.unshift({id:Date.now(),img:window._img,caption:cap,user:'girikri',likes:0,viewers:[],shares:0,time:'now'}); localStorage.setItem('pixoro_posts',JSON.stringify(posts)); closeUpload(); renderFeed(); showNoti('Posted 🚀'); window._img=null; document.getElementById('previewBox').style.display='none'; document.getElementById('noPhoto').style.display='block'; };
function showNoti(t){ const n=document.getElementById('noti'); n.textContent=t; n.style.display='block'; setTimeout(()=>n.style.display='none',2000); }
</script></body></html>
