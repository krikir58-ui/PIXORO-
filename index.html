<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXORO - Insta Single File</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding-bottom:80px}
.post{max-width:420px;margin:15px auto;background:#121212;border:1px solid #262626;border-radius:14px;overflow:hidden}
.post img, .post video{width:100%}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px}
</style>
</head>
<body>
<h2 style="text-align:center">PIXORO 🔥</h2>
<div id="feed"></div>
<div class="nav"><span>🏠 Home</span><span>❤️ Likes</span><span>👤 You</span></div>

<script type="module">
// FIREBASE + ELLA JS SERTHU 1 FILE LA DA GIRI
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, increment, setDoc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCwOxSyjqp2OoT2PoxSyjqp2OoT2PoxSyHojksr5r58vQ10", authDomain: "pixoro-75927.firebaseapp.com", projectId: "pixoro-75927" };
const db = getFirestore(initializeApp(firebaseConfig));

// REAL FEED + REAL LIKE ELLAM INGA THAN DA
const feedEl = document.getElementById("feed");
const q = query(collection(db, "reels"), orderBy("createdAt","desc"));
onSnapshot(q, snap=>{
  feedEl.innerHTML="";
  snap.forEach(d=>{
    const p = {id:d.id, ...d.data()};
    feedEl.innerHTML += `
      <div class="post">
        <div style="padding:10px"><b>${p.email||'giri'}</b></div>
        ${p.videoUrl? (p.isVideo? `<video src="${p.videoUrl}" controls></video>` : `<img src="${p.videoUrl}">`) : ''}
        <div style="padding:12px;display:flex;gap:15px">
          <span onclick="likePost('${p.id}')" style="cursor:pointer">❤️ ${p.likes||0}</span>
          <span>💬 ${p.comments||0}</span>
          <span>👁️ ${p.views||0}</span>
        </div>
        <div style="padding:0 12px 12px"><b>${p.email||'giri'}</b> ${p.caption||''}</div>
      </div>`;
  });
});

// REAL LIKE FUNCTION DA
window.likePost = async (id)=>{
  const postRef = doc(db, "reels", id);
  await updateDoc(postRef, { likes: increment(1) });
}
</script>
</body>
</html>
