<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PIXORO</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f6ff;color:#222}
button{cursor:pointer;border:0}
.login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#667eea,#764ba2)
}
.login-box{
  width:90%;max-width:380px;background:white;padding:30px;
  border-radius:20px;text-align:center;box-shadow:0 10px 30px #0004
}
.logo{font-size:38px;font-weight:bold;color:#667eea;margin-bottom:25px}
input,textarea{
  width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;
  border-radius:12px;outline:none
}
.login-btn,.post-btn,.send{
  width:100%;padding:14px;background:#667eea;color:white;
  border-radius:12px;margin-top:10px;font-weight:bold
}
#msg{color:red;margin-top:12px}
#app{display:none}
header{
  position:sticky;top:0;background:white;padding:15px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 2px 10px #0001;z-index:5
}
header h2{color:#667eea}
.container{max-width:650px;margin:auto;padding:15px 15px 90px}
.page{display:none}
.page.active{display:block}
.card,.post{
  background:white;border-radius:18px;padding:15px;margin:12px 0;
  box-shadow:0 3px 15px #0001
}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{
  width:45px;height:45px;border-radius:50%;background:#667eea;
  color:white;display:flex;align-items:center;justify-content:center;
  font-weight:bold
}
.post img{width:100%;border-radius:14px;margin-top:10px;max-height:500px;object-fit:cover}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{
  background:#f0f2f8;padding:10px 14px;border-radius:10px
}
.liked{color:#e91e63!important}
.comment{
  background:#f3f4f8;padding:8px;border-radius:10px;margin-top:6px
}
.comment-row{display:flex;gap:7px;margin-top:10px}
.comment-row input{margin:0}
.comment-row button{padding:10px 15px;background:#667eea;color:white;border-radius:10px}
nav{
  position:fixed;bottom:0;left:0;right:0;background:white;
  display:flex;justify-content:space-around;padding:10px;
  box-shadow:0 -2px 12px #0002;z-index:10
}
nav button{background:none;font-size:14px}
nav span{display:block;font-size:22px}
.stat{display:flex;justify-content:space-around;text-align:center;margin:15px 0}
.stat b{font-size:20px}
.logout{background:#ff5252;color:white;padding:12px;border-radius:10px;margin-top:15px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <div class="logo">PIXORO</div>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button class="login-btn" onclick="login()">LOGIN</button>

    <p id="msg"></p>
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
  <h2>PIXORO</h2>
  <b>👤</b>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="page active">

  <div class="card">
    <h3>Create Post</h3>

    <textarea id="caption" rows="3"
      placeholder="What's happening?"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="post-btn" onclick="createPost()">
      + POST
    </button>
  </div>

  <div id="posts"></div>

</section>

<!-- SEARCH -->
<section id="search" class="page">
  <div class="card">
    <h3>🔍 Search</h3>
    <input id="searchInput"
      placeholder="Search posts..."
      oninput="searchPosts()">
  </div>

  <div id="searchResults"></div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">

  <div class="card" style="text-align:center">

    <div class="avatar" style="margin:auto;font-size:22px">
      P
    </div>

    <h2 style="margin-top:10px">Pixoro</h2>

    <div class="stat">
      <div>
        <b id="postCount">0</b>
        <small>Posts</small>
      </div>

      <div>
        <b id="viewCount">0</b>
        <small>Views</small>
      </div>

      <div>
        <b id="coinCount">0</b>
        <small>Coins</small>
      </div>
    </div>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

  </div>

</section>

<!-- REWARDS -->
<section id="rewards" class="page">

  <div class="card">
    <h2>🪙 PIXORO Rewards</h2>

    <p style="margin-top:15px">
      Views: <b id="rewardViews">0</b>
    </p>

    <p style="margin-top:10px">
      Coins: <b id="rewardCoins">0</b>
    </p>

    <button class="post-btn" onclick="payout()">
      Request Payout
    </button>

    <p id="payoutMsg" style="margin-top:15px"></p>
  </div>

</section>

</div>

<!-- NAVIGATION -->
<nav>
  <button onclick="showPage('home')">
    <span>🏠</span>Home
  </button>

  <button onclick="showPage('search')">
    <span>🔍</span>Search
  </button>

  <button onclick="showPage('home');focusPost()">
    <span>➕</span>Post
  </button>

  <button onclick="showPage('rewards')">
    <span>🪙</span>Rewards
  </button>

  <button onclick="showPage('profile')">
    <span>👤</span>Profile
  </button>
</nav>

</div>

<script>

let posts = JSON.parse(
  localStorage.getItem("pixoroPosts") || "[]"
);

let views = Number(
  localStorage.getItem("pixoroViews") || 0
);

let coins = Number(
  localStorage.getItem("pixoroCoins") || 0
);


/* LOGIN */
function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(
    username.toLowerCase() === "pixoro" &&
    password === "123456"
  ){

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";

    renderPosts();

  }else{

    document.getElementById("msg").textContent =
      "Wrong username or password";

  }
}


/* LOGOUT */
function logout(){

  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="flex";

  document.getElementById("password").value="";
}


/* PAGE */
function showPage(id){

  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


/* SAVE */
function saveData(){

  localStorage.setItem(
    "pixoroPosts",
    JSON.stringify(posts)
  );

  localStorage.setItem(
    "pixoroViews",
    views
  );

  localStorage.setItem(
    "pixoroCoins",
    coins
  );
}


/* CREATE POST */
function createPost(){

  const caption =
    document.getElementById("caption").value.trim();

  const file =
    document.getElementById("photo").files[0];

  if(!caption && !file){

    alert("Write something or select an image.");
    return;

  }

  function addPost(image=""){

    posts.unshift({

      id:Date.now(),
      caption:caption,
      image:image,
      likes:0,
      liked:false,
      comments:[]

    });

    document.getElementById("caption").value="";
    document.getElementById("photo").value="";

    saveData();
    renderPosts();

  }


  if(file){

    const reader = new FileReader();

    reader.onload=function(e){
      addPost(e.target.result);
    };

    reader.readAsDataURL(file);

  }else{

    addPost();

  }

}


/* RENDER */
function renderPosts(list=posts){

  const box =
    document.getElementById("posts");

  box.innerHTML="";


  if(list.length===0){

    box.innerHTML=
      "<div class='card'>No posts yet. Create your first post!</div>";

  }


  list.forEach(post=>{

    const div=document.createElement("div");

    div.className="post";


    div.innerHTML=`

      <div class="post-head">

        <div class="avatar">P</div>

        <b>Pixoro</b>

      </div>

      ${
        post.caption
        ? `<p>${safe(post.caption)}</p>`
        : ""
      }

      ${
        post.image
        ? `<img src="${post.image}">`
        : ""
      }

      <div class="actions">

        <button
          class="${post.liked ? "liked":""}"
          onclick="likePost(${post.id})">

          ${post.liked ? "♥" : "♡"}
          ${post.likes}

        </button>

        <button onclick="viewPost(${post.id})">
          👁 View
        </button>

      </div>

      <div>

        ${
          post.comments.map(c=>
            `<div class="comment">
              <b>Pixoro:</b> ${safe(c)}
            </div>`
          ).join("")
        }

      </div>

      <div class="comment-row">

        <input
          id="comment-${post.id}"
          placeholder="Write a comment">

        <button
          onclick="addComment(${post.id})">
          Send
        </button>

      </div>

    `;

    box.appendChild(div);

  });


  updateStats();

}


/* LIKE */
function likePost(id){

  const post =
    posts.find(p=>p.id===id);

  if(!post)return;

  post.liked=!post.liked;

  if(post.liked){
    post.likes++;
  }else{
    post.likes--;
  }

  saveData();
  renderPosts();

}


/* VIEW */
function viewPost(id){

  views++;
  coins++;

  saveData();
  updateStats();

}


/* COMMENT */
function addComment(id){

  const input =
    document.getElementById("comment-"+id);

  const text=input.value.trim();

  if(!text)return;

  const post =
    posts.find(p=>p.id===id);

  post.comments.push(text);

  input.value="";

  saveData();
  renderPosts();

}


/* SEARCH */
function searchPosts(){

  const q =
    document.getElementById("searchInput")
      .value.toLowerCase().trim();

  const result =
    document.getElementById("searchResults");

  if(!q){

    result.innerHTML="";
    return;

  }

  const found =
    posts.filter(p=>
      (p.caption || "")
      .toLowerCase()
      .includes(q)
    );

  if(found.length===0){

    result.innerHTML=
      "<div class='card'>No posts found.</div>";

    return;

  }

  result.innerHTML =
    found.map(p=>`

      <div class="card">

        <b>Pixoro</b>

        <p style="margin-top:8px">
          ${safe(p.caption || "Image post")}
        </p>

      </div>

    `).join("");

}


/* STATS */
function updateStats(){

  document.getElementById("postCount")
    .textContent=posts.length;

  document.getElementById("viewCount")
    .textContent=views;

  document.getElementById("coinCount")
    .textContent=coins;

  document.getElementById("rewardViews")
    .textContent=views;

  document.getElementById("rewardCoins")
    .textContent=coins;

}


/* PAYOUT */
function payout(){

  document.getElementById("payoutMsg")
    .textContent=
    "Demo only. Real payment requires a secure backend and payment service.";

}


/* FOCUS POST */
function focusPost(){

  setTimeout(()=>{

    document.getElementById("caption")
      .focus();

  },100);

}


/* SECURITY */
function safe(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}


/* ENTER LOGIN */
document.getElementById("password")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      login();
    }

  });


updateStats();

</script>

</body>
</html>
