<script>

window.showToast=showToast; function showChoice(){document.getElementById('choice').classList.add('show')} function hideChoice(){document.getElementById('choice').classList.remove('show')}
let supa=window.supa;function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase();return u||''}
let ME_RAW='',ME='',ME_ID='',ME_PFP='',allPosts=[],allLikes=[],allSaves=[],allStories=[],allFollows=[],allProfiles=[],allViews=[],viewedStories=[],lastTap=0,feedMode='foryou';
function getSupa(){return window.supa||supa} window.getSupa=getSupa;
function profileById(id){return allProfiles.find(x=>x.id===id)||null}
function displayNameFor(u){if(!u)return ME_RAW||'user';let p=allProfiles.find(x=>x.id===u)||allProfiles.find(x=>cleanUser(x.username)===cleanUser(u));if(p&&p.username)return cleanUser(p.username);return cleanUser(u)||ME_RAW||'user'}
function getPfp(u){if(u===ME_ID&&ME_PFP)return ME_PFP;let p=allProfiles.find(x=>x.id===u)||allProfiles.find(x=>cleanUser(x.username)===cleanUser(u));if(p&&(p.avatar_url||p.profile_pic||p.photo_url))return p.avatar_url||p.profile_pic||p.photo_url;let name=p?(p.username||''): (u===ME_ID?ME_RAW:cleanUser(u));return 'https://ui-avatars.com/api/?name='+(cleanUser(name).charAt(0).toUpperCase()||'G')+'&background=111&color=fff&size=200&bold=true'}

async function checkLogin(){supa=getSupa();if(!supa){setTimeout(checkLogin,300);return}let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}let {data:profile}=await supa.from('profiles').select('*').eq('id',session.user.id).single();if(!profile||!profile.username){location.href='login.html';return}ME_RAW=cleanUser(profile.username);ME=ME_RAW;ME_ID=session.user.id;ME_PFP=profile.avatar_url||'';window.ME=ME_RAW;window.ME_ID=ME_ID;loadAll()}
async function loadAll(){try{supa=getSupa();if(!supa)return;let [pr,po,re,li,vi,sa,st,fo]=await Promise.all([supa.from('profiles').select('*'),supa.from('posts').select('*').order('created_at',{ascending:false}).limit(30),supa.from('reels').select('*').order('created_at',{ascending:false}).limit(30),supa.from('likes').select('*').limit(500),supa.from('views').select('*').limit(500),supa.from('saves').select('*').limit(200),supa.from('stories').select('*').order('created_at',{ascending:false}).limit(50),supa.from('follows').select('*').limit(1000)]);allProfiles=pr.data||[];allLikes=li.data||[];allViews=vi.data||[];allSaves=sa.data||[];allFollows=fo.data||[];let merged=[];(po.data||[]).forEach(p=>merged.push({...p,_from:'posts'}));(re.data||[]).forEach(p=>merged.push({...p,_from:'reels'}));let seenUrl=new Set(),seenId=new Set(),deduped=[];for(let p of merged){let prof=profileById(p.user_id);p.username=prof?prof.username:(p.username||'');p.username=cleanUser(p.username);p.media_url=p.media_url||p.image||p.image_url||p.video_url||'';let raw=(p.media_url||p.video_url||'').trim();if(!raw) continue;if(p.is_archived) continue;let u=raw.split('?')[0].toLowerCase();if(seenUrl.has(u)) continue;if(seenId.has(String(p.id))) continue;seenUrl.add(u);seenId.add(String(p.id));deduped.push(p);}allPosts=deduped;allStories=(st.data||[]).map(s=>{let prof=profileById(s.user_id);s.username=prof?prof.username:(s.username||'');s.username=cleanUser(s.username);return s}).filter(s=>{if(!s.expires_at)return true;return new Date(s.expires_at)>new Date()});renderStories();renderFeed();let el=document.getElementById('navPfp');if(el&&ME_ID)el.src=getPfp(ME_ID)}catch(e){console.log(e);setTimeout(loadAll,1200)}}

function openMyStory(){let s=allStories.find(x=>x.user_id===ME_ID);if(!s)return location.href='story-upload.html';location.href='story-view.html?user='+(s.user_id||s.username)} function openOtherStory(u){location.href='story-view.html?user='+u}
function renderFeed(){let feedPosts=[...allPosts];if(feedMode=='foryou'){feedPosts.sort((a,b)=>viralScore(b)-viralScore(a))}else if(feedMode=='following'){let followingIds=new Set(allFollows.filter(f=>String(f.follower_id)===String(ME_ID)).map(f=>String(f.following_id)));feedPosts=feedPosts.filter(p=>String(p.user_id)===String(ME_ID)||followingIds.has(String(p.user_id)));feedPosts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}else if(feedMode=='latest'){feedPosts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}let html='';for(let p of feedPosts){let ownerKey=p.user_id;if(!ownerKey || String(ownerKey).length<20){let pr=allProfiles.find(x=>cleanUser(x.username)===cleanUser(p.username));if(pr) ownerKey=pr.id;else ownerKey=p.username}let lCount=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let isLiked=allLikes.some(l=>String(l.post_id)==String(p.id)&&(l.user_id==ME_ID));let isSaved=allSaves.some(s=>String(s.post_id)==String(p.id)&&(s.user_id==ME_ID));let best=getBestMedia(p);let mUrl=best.url||'';let mediaHtml=best.isVid?`<video class="main" src="${mUrl}" loop muted playsinline preload="auto"></video>`:`<img class="main" src="${mUrl}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x500/111/fff?text=Pixoro'">`;let isMe=String(ownerKey)===String(ME_ID);let isFollowing=allFollows.some(f=>String(f.follower_id)===String(ME_ID)&&String(f.following_id)===String(ownerKey));let followBtnHtml='';if(!isMe){followBtnHtml=isFollowing?`<button class="followBtnPost following" onclick="event.stopPropagation();toggleFollow('${ownerKey}',this)">Following ✓</button>`:`<button class="followBtnPost" onclick="event.stopPropagation();toggleFollow('${ownerKey}',this)">Follow</button>`}html+=`<div class="post" id="post-${p.id}"><div class="postTop"><div style="display:flex;align-items:center;gap:10px"><div class="pfpRing" onclick="location.href='profile.html?u=${ownerKey}'"><div class="pfpInner"><img src="${getPfp(ownerKey)}"></div></div><div style="display:flex;align-items:center;gap:8px"><b>${displayNameFor(ownerKey)}</b>${followBtnHtml}</div>${p._from==='reels'?'<span style="font-size:10px;background:#ff5ea8;padding:2px 6px;border-radius:10px">REEL</span>':''}</div><span>⋮</span></div><div style="position:relative" onclick="handleTap('${p.id}')">${mediaHtml}<div id="burst-${p.id}" class="heart-burst">❤</div></div><div class="actions"><div class="left"><button id="likeBtn-${p.id}" class="act ${isLiked?'liked':''}" onclick="fastLike('${p.id}')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button><button class="act" onclick="openComment('${p.id}')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button></div><button class="act ${isSaved?'saved':''}" onclick="savePost('${p.id}')"><svg viewBox="0 0 24 24"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></button></div><div style="padding:0 14px"><b><span id="likeCount-${p.id}">${lCount}</span> likes</b><br><b>${displayNameFor(ownerKey)}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:40px;color:#888">No posts da 😴</p>';observeHomeVideos()}
function observeHomeVideos(){let vs=document.querySelectorAll('.post video.main');let io=new IntersectionObserver(es=>{es.forEach(e=>{let v=e.target;if(e.isIntersecting){v.muted=true;v.play().catch(()=>{})}else{v.pause()}})},{threshold:0.6});vs.forEach(v=>io.observe(v))}
function handleTap(id){let now=Date.now();if(now-lastTap<300){doubleLike(id);lastTap=0}else{lastTap=now}}
async function doubleLike(id){let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));if(liked)return;allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});let btn=document.getElementById('likeBtn-'+id);if(btn)btn.classList.add('liked');let c=document.getElementById('likeCount-'+id);if(c)c.innerText=parseInt(c.innerText||'0')+1;supa=getSupa();if(supa){await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}}
async function fastLike(id){let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));let btn=document.getElementById('likeBtn-'+id);let c=document.getElementById('likeCount-'+id);if(!liked){allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(btn)btn.classList.add('liked');if(c)c.innerText=parseInt(c.innerText||'0')+1;let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}supa=getSupa();if(supa)await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}else{allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&(l.user_id==ME_ID)));if(btn)btn.classList.remove('liked');if(c)c.innerText=Math.max(0,parseInt(c.innerText||'1')-1);supa=getSupa();if(supa)await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID)}}
async function toggleFollow(otherId, btn){
  if(!otherId || String(otherId)===String(ME_ID)) return;
  let targetId = resolveUserId(otherId);
  if(!targetId){ showToast('User ID Kedaikkala da - Refresh Pannu da'); return; }
  if(String(targetId)===String(ME_ID)) return;
  if(btn) btn.disabled = true;
  supa = getSupa();
  let already = allFollows.some(f=>String(f.follower_id)===String(ME_ID) && String(f.following_id)===String(targetId));
  if(already){
    let {error} = await supa.from('follows').delete().eq('follower_id', ME_ID).eq('following_id', targetId);
    if(!error){
      allFollows = allFollows.filter(f=>!(String(f.follower_id)===String(ME_ID) && String(f.following_id)===String(targetId)));
      if(btn){ btn.innerText="Follow"; btn.classList.remove('following'); }
      showToast('Unfollowed da 😴');
      if(feedMode==='following') renderFeed();
    } else { showToast('Unfollow Mudiyala da - ' + error.message); }
  } else {
    let {data: check} = await supa.from('follows').select('*').eq('follower_id', ME_ID).eq('following_id', targetId).maybeSingle();
    if(check){
      allFollows.push(check);
      if(btn){ btn.innerText="Following ✓"; btn.classList.add('following'); }
      showToast('Already Following da 🔥');
      if(btn) btn.disabled = false;
      return;
    }
    let {error} = await supa.from('follows').insert({follower_id: ME_ID, following_id: targetId});
    if(!error){
      allFollows.push({follower_id: ME_ID, following_id: targetId});
      if(btn){ btn.innerText="Following ✓"; btn.classList.add('following'); }
      showToast('Followed da 🔥');
    } else {
      console.log('FOLLOW ERROR', error);
      if(error.code==='23505' || String(error.message).includes('duplicate')){
        if(btn){ btn.innerText="Following ✓"; btn.classList.add('following'); }
        showToast('Already Following da 🔥');
      } else { showToast('Follow Mudiyala: ' + error.message); }
    }
  }
  if(btn) btn.disabled = false;
}
window.toggleFollow = toggleFollow;
async function savePost(id){supa=getSupa();let s=allSaves.some(x=>String(x.post_id)==String(id)&&(x.user_id==ME_ID));if(s){allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&(x.user_id==ME_ID)));if(supa)await supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID)}else{allSaves.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(supa)await supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}renderFeed()}
async function openComment(id){document.getElementById('commentModal').style.display='flex';supa=getSupa();if(!supa)return;let {data}=await supa.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:false});document.getElementById('commentList').innerHTML=(data||[]).map(c=>`<div style="display:flex;gap:10px;padding:10px 0"><img src="${getPfp(c.user_id||c.username)}" style="width:32px;height:32px;border-radius:50%"><div><b>${displayNameFor(c.user_id||c.username)}</b><div>${c.text}</div></div></div>`).join('')||'';window.currentPostId=id}
function closeComment(){document.getElementById('commentModal').style.display='none'}
async function addComment(){supa=getSupa();let t=document.getElementById('commentInput').value.trim();if(!t||!window.currentPostId||!supa)return;await supa.from('comments').insert({post_id:window.currentPostId,user_id:ME_ID,username:ME_RAW,text:t});document.getElementById('commentInput').value='';openComment(window.currentPostId)}
checkLogin()
</script></body></html>
