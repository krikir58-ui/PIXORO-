<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PIXORO V9 FINAL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>iframe{display:none!important;}div[style*="position: fixed"]{display:none!important;}body{background:#000;color:#fff;font-family:Arial;padding:12px 12px 40px 12px;margin:0;text-align:center}h1{color:#FFD700;letter-spacing:5px;margin:12px 0 3px;font-size:26px}.sub{color:#00ff88;font-size:9px;letter-spacing:2px;margin-bottom:12px}.box{background:#111;border:1px solid #333;padding:13px;border-radius:14px;margin-bottom:10px;text-align:left}.box h3{color:#FFD700;margin:0 0 8px}input{width:100%;padding:10px;margin-bottom:7px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}button{width:100%;padding:11px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.feed{display:none}.pfp{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle;margin-right:7px}.big-pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 8px}.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#FFD700,#ff3366,#ff00ff);cursor:pointer;display:inline-block}.story-ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;display:block}.story-bar{display:flex;overflow-x:auto;padding:10px 0;gap:8px}.story-bar::-webkit-scrollbar{display:none}.story-item{text-align:center;min-width:70px;cursor:pointer}.story-item b{font-size:10px;display:block;margin-top:4px;width:70px;overflow:hidden;text-overflow:ellipsis}.story-add{width:62px;height:62px;border-radius:50%;border:2px dashed #FFD700;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;background:#111;color:#FFD700}.post{background:#111;border:1px solid #333;padding:11px;border-radius:14px;margin:11px 0}.action{display:flex;gap:8px;margin:8px 0}.action button{flex:1;padding:8px;font-size:13px;border-radius:20px}.like-btn{background:#222;color:#fff;border:1px solid #333}.like-btn.liked{background:#ff0040;color:#fff;border-color:#ff0040}#storyView{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;flex-direction:column}.prog{height:3px;background:#333;width:100%;margin:8px 0}.prog-fill{height:100%;background:#FFD700;width:0%}</style></head><body>
<h1>PIXORO V1</h1><div class="sub">V9 FINAL CLEAN 👑 NO BANNER • STORIES • POSTS</div>
<div id="authDiv"><div class="box"><h3>Signup</h3><input id="su_user" placeholder="username"><input id="su_pass" type="password" placeholder="Password"><button onclick="signupUser()">Signup</button></div><div class="box"><h3>Login</h3><input id="li_user" placeholder="username"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div></div>
<div id="feedDiv" class="feed">
<div class="box"><h3>🔥 Stories Da - 24hrs</h3><div id="storyBar" class="story-bar">Loading...</div></div>
<div class="box" style="text-align:center"><img id="myPfp" class="big-pfp" src="https://via.placeholder.com/90"><h3>Welcome <span id="uName"></span> 👑</h3><button onclick="logoutUser()" style="background:#111;color:#ff4444;margin-top:8px;border:1px solid #333;font-size:11px">Logout</button></div>
<div class="box"><h3>📸 Story Pannu Da</h3><input type="file" id="storyFile" accept="image/*" style="margin-bottom:8px"><button onclick="createStoryDirect()" style="background:linear-gradient(45deg,#FFD700,#ff3366);color:#000">+ Add Story 🔥</button><img id="sprev" style="width:100%;border-radius:12px;display:none;margin-top:8px"></div>
<div class="box"><h3>Post Pannu Da 📸</h3><input type="file" id="postFile" accept="image/*" style="margin-bottom:8px"><input id="cap" placeholder="Caption - enna news da?"><button onclick="createPostDirect()" style="margin-top:8px">Post Podu Da 🔥</button><img id="pprev" style="width:100%;border-radius:12px;display:none;margin-top:8px"></div>
<div id="posts">Loading...</div></div>
<div id="storyView"><div class="prog"><div id="sprog" class="prog-fill"></div></div><div style="display:flex;justify-content:space-between;padding:12px;align-items:center"><div style="display:flex;align-items:center"><img id="svPfp" class="pfp" src=""><b id="svName" style="margin-left:6px">@user</b></div><button onclick="closeStory()" style="width:auto;background:#222;color:#fff;padding:8px 16px;border-radius:20px">✕</button></div><img id="svImg" style="width:100%;flex:1;object-fit:contain;background:#000"></div>
<script>
setInterval(()=>{document.querySelectorAll('div').forEach(e=>{if(e.innerText&&e.innerText.includes('Hide this banner'))e.remove();});},800);
const SUPABASE_URL="https://yecpltndhlzfjplzhcpm.supabase.co";const SUPABASE_KEY="sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentStories=[],currentView=[],storyTimer=null;
function signupUser(){let u=su_user.value.trim().toLowerCase(),p=su_pass.value.trim();if(!u||!p)return alert("Fill pannu da");sb.from('users').insert([{username:u,password:p}]).then(e=>{if(e.error&&!e.error.message.includes('duplicate'))return alert(e.error.message);localStorage.setItem('pix_user',u);location.reload();});}
function loginUser(){let u=li_user.value.trim().toLowerCase();sb.from('users').select('*').eq('username',u).single().then(e=>{if(e.error)return alert("User illa da");localStorage.setItem('pix_user',u);location.reload();});}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){let u=localStorage.getItem('pix_user');if(!u)return;authDiv.style.display='none';feedDiv.style.display='flex';feedDiv.style.flexDirection='column';uName.innerText=u;let {data}=await sb.from('users').select('profile_pic').eq('username',u).single();if(data?.profile_pic)myPfp.src=data.profile_pic;loadStories();loadPosts();}
async function loadStories(){let {data,error}=await sb.from('stories').select('*').order('created_at',{ascending:false});if(error||!data||data.length==0){storyBar.innerHTML=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div><span style="color:#666;font-size:11px;margin-left:8px">No stories - nee first podu da 🔥</span>`;return;}currentStories=data;let {data:users}=await sb.from('users').select('username,profile_pic');let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);let grouped={};data.forEach(s=>{if(!grouped[s.username])grouped[s.username]=[];grouped[s.username].push(s);});let h=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div>`;Object.keys(grouped).forEach(un=>{let pfp=map[un]||'https://via.placeholder.com/40';let c=grouped[un].length;h+=`<div class="story-item" onclick="viewStories('${un}')"><div class="story-ring"><img src="${pfp}"></div><b>@${un} ${c>1?'('+c+')':''}</b></div>`;});storyBar.innerHTML=h;}
document.getElementById('storyFile').addEventListener('change',function(){if(this.files[0]){sprev.src=URL.createObjectURL(this.files[0]);sprev.style.display='block';}});
document.getElementById('postFile').addEventListener('change',function(){if(this.files[0]){pprev.src=URL.createObjectURL(this.files[0]);pprev.style.display='block';}});
async function createStoryDirect(){let f=document.getElementById('storyFile').files[0];if(!f)return alert("Photo edu da");let btn=event.target;btn.innerText="Uploading...⏳";btn.disabled=true;try{let fname=Date.now()+"_s_"+f.name.replace(/\s/g,'_');let {error:up}=await sb.storage.from('post-images').upload(fname,f);if(up)throw up;let {data}=sb.storage.from('post-images').getPublicUrl(fname);let u=localStorage.getItem('pix_user');let {error:ins}=await sb.from('stories').insert([{username:u,image_url:data.publicUrl}]);if(ins)throw ins;alert("Story OK da! 🔥");document.getElementById('storyFile').value="";sprev.style.display='none';loadStories();}catch(e){alert("Error: "+e.message);}btn.innerText="+ Add Story 🔥";btn.disabled=false;}
async function createPostDirect(){let f=document.getElementById('postFile').files[0];if(!f)return alert("Photo edu da");let cap=document.getElementById('cap').value.trim();let btn=event.target;btn.innerText="Posting...";btn.disabled=true;try{let fname=Date.now()+"_p_"+f.name.replace(/\s/g,'_');let {error:up}=await sb.storage.from('post-images').upload(fname,f);if(up)throw up;let {data}=sb.storage.from('post-images').getPublicUrl(fname);let u=localStorage.getItem('pix_user');let {error:ins}=await sb.from('posts').insert([{username:u,image_url:data.publicUrl,caption:cap}]);if(ins)throw ins;alert("Post OK da! 🔥");document.getElementById('postFile').value="";document.getElementById('cap').value="";pprev.style.display='none';loadPosts();}catch(e){alert("Error: "+e.message);}btn.innerText="Post Podu Da 🔥";btn.disabled=false;}
function viewStories(un){let list=currentStories.filter(s=>s.username==un);openStory(list,0);}function openStory(list,i){currentView=list;storyView.style.display='flex';let s=list[i];svImg.src=s.image_url;svName.innerText='@'+s.username;sb.from('users').select('profile_pic').eq('username',s.username).single().then(({data})=>{svPfp.src=data?.profile_pic||'https://via.placeholder.com/40';});let p=0;clearInterval(storyTimer);sprog.style.width='0%';storyTimer=setInterval(()=>{p+=2;sprog.style.width=p+'%';if(p>=100){clearInterval(storyTimer);i++;if(i<list.length)openStory(list,i);else closeStory();}},80);}function closeStory(){storyView.style.display='none';clearInterval(storyTimer);}
async function loadPosts(){let {data:posts}=await sb.from('posts').select('*').order('id',{ascending:false});let {data:users}=await sb.from('users').select('username,profile_pic');let {data:likes}=await sb.from('likes').select('*');let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);let u=localStorage.getItem('pix_user');let h='';(posts||[]).forEach(p=>{let pfp=map[p.username]||'https://via.placeholder.com/40';let lc=(likes||[]).filter(l=>l.post_id==p.id).length;let liked=(likes||[]).some(l=>l.post_id==p.id&&l.username==u);h+=`<div class="post"><div style="display:flex;align-items:center"><img class="pfp" src="${pfp}"><b>@${p.username}</b></div><img src="${p.image_url}" style="width:100%;border-radius:12px;margin:10px 0"><p>${p.caption||''}</p><div class="action"><button class="like-btn ${liked?'liked':''}" onclick="likePost(${p.id})">${liked?'❤️':'🤍'} ${lc} Like</button></div></div>`;});document.getElementById('posts').innerHTML=h||"<p style='color:#666'>No posts yet</p>";}
async function likePost(id){let u=localStorage.getItem('pix_user');let {data:ex}=await sb.from('likes').select('*').eq('post_id',id).eq('username',u);if(ex&&ex.length>0){await sb.from('likes').delete().eq('post_id',id).eq('username',u);}else{await sb.from('likes').insert([{post_id:id,username:u}]);}loadPosts();}
checkUser();
</script></body></html>
