#storyView,#addStoryPage,#storyEditor,#settingsPage,#reelsPage,#tagModal,#locationModal,#musicModal,#clashPage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column;overflow-y:auto}

<div style="margin-top:10px;"><b id="pName" style="font-size:14px;"></b><p id="pEmail" style="color:#888;font-size:12px;"></p><p id="bioText" style="font-size:13px;margin-top:4px;">🔥 Tiruchuli to World 🌍</p></div>
<div style="margin-top:16px;border-top:1px solid #111;display:flex;"><button style="flex:1;padding:12px;background:none;border:none;color:#fff;border-bottom:1px solid #fff;font-weight:600;">POSTS</button><button onclick="showReels()" style="flex:1;padding:12px;background:none;border:none;color:#666;">REELS</button><button onclick="openClash()" style="flex:1;padding:12px;background:none;border:none;color:#666;">CLASH</button></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCwOxSyjqp2OoT2PoxSyHojksr5r58vQ10",authDomain:"pixoro-75927.firebaseapp.com",projectId:"pixoro-75927",storageBucket:"pixoro-75927.firebasestorage.app",messagingSenderId:"814840120295",appId:"1:814840120295:web:6c02c613df5a17209bf342"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let currentUser=null,currentCommentPostId=null,storiesData=[],currentStoryIndex=0,storyTimer=null,tempStoryImage=null,taggedPeople=[],selectedLocation="",selectedSong=null,currentPlayingUrl=null;
const tamilSongsDB=[
{id:1,title:"Oru Paattale",movie:"Tourist Family",artist:"S.P.B",type:"love",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",cover:"🎵"},
{id:2,title:"Vaathi Coming",movie:"Master",artist:"Anirudh",type:"mass",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",cover:"🔥"},
{id:3,title:"Arabic Kuthu",movie:"Beast",artist:"Anirudh",type:"kuthu",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",cover:"🥁"},
{id:4,title:"Naa Ready",movie:"Leo",artist:"Anirudh",type:"mass",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",cover:"🦁"},
{id:5,title:"Hukum",movie:"Jailer",artist:"Anirudh",type:"mass",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",cover:"👑"},
];
setTimeout(()=>{let s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},800);
auth.onAuthStateChanged(u=>{
if(u){currentUser=u;loginBox.style.display="none";profileBox.style.display="none";feed.style.display="block";bottomNav.style.display="flex";storyBar.style.display="flex";searchBox.style.display="none";clashPage.style.display="none";reelsPage.style.display="none";loadFeed();loadStories();}else{loginBox.style.display="block";feed.style.display="none";bottomNav.style.display="none";storyBar.style.display="none";profileBox.style.display="none";}
});
function login(){let e=email.value.trim().replace(/\s+/g,"").toLowerCase();let p=pass.value.trim();let errEl=document.getElementById('loginError');let btn=document.getElementById('loginBtn');if(!e||!p){errEl.style.display='block';errEl.innerText="Email + Password";return;}errEl.style.display='none';btn.innerText="Logging...";btn.disabled=true;auth.signInWithEmailAndPassword(e,p).catch(err=>{if(err.code==="auth/invalid-credential"||err.code==="auth/user-not-found"){auth.createUserWithEmailAndPassword(e,p).then(()=>{}).catch(e2=>{errEl.style.display='block';errEl.innerText=e2.message;btn.innerText="Log in";btn.disabled=false;});}else{errEl.style.display='block';errEl.innerText=err.message;btn.innerText="Log in";btn.disabled=false;}});}
function logout(){if(confirm("Logout?"))auth.signOut();}
function clearNav(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'))}
function showFeed(){clearNav();navHome.classList.add('active');feed.style.display="block";profileBox.style.display="none";searchBox.style.display="none";storyBar.style.display="flex";settingsPage.style.display="none";clashPage.style.display="none";reelsPage.style.display="none";loadFeed();}
function showSearch(){clearNav();navSearch.classList.add('active');feed.style.display="none";profileBox.style.display="none";storyBar.style.display="none";searchBox.style.display="block";settingsPage.style.display="none";clashPage.style.display="none";reelsPage.style.display="none";}
function showProfile(){clearNav();navProfile.classList.add('active');feed.style.display="none";storyBar.style.display="none";searchBox.style.display="none";profileBox.style.display="block";settingsPage.style.display="none";clashPage.style.display="none";reelsPage.style.display="none";loadProfile();}
function openSettings(){settingsPage.style.display='flex';}
function addPost(){fileInput.click();}
fileInput.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';uploadBox.style.display='block';};r.readAsDataURL(f);});
function openTagPeople(){tagModal.style.display='flex';searchTagPeople();}
function openLocation(){locationModal.style.display='flex';}
function openMusicTag(){musicModal.style.display='flex';loadTamilSongs(tamilSongsDB);}
async function searchTagPeople(){let q=tagSearch.value.toLowerCase();let snap=await db.collection("users").limit(15).get();let h="";snap.forEach(d=>{let name=(d.data().email||d.id).split('@')[0];if(q&&!name.toLowerCase().includes(q))return;h+=`<div onclick="addTag('${name}')" style="display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #111;"><img src="${d.data().photo||'https://i.pravatar.cc/50?u='+d.id}" style="width:32px;height:32px;border-radius:50%;"><b style="font-size:13px;">${name}</b></div>`;});tagSearchResults.innerHTML=h;}
function addTag(name){if(taggedPeople.find(t=>t.name===name))return;taggedPeople.push({name});tagCount.innerText=taggedPeople.length+' tagged';}
function searchLocation(){let q=locationSearch.value.toLowerCase();let places=["Tiruchuli","Coimbatore","Chennai","Madurai"];let f=places.filter(p=>p.toLowerCase().includes(q));locationResults.innerHTML=f.map(p=>`<div onclick="selectLocation('${p}')" style="padding:14px;border-bottom:1px solid #111;">${p}</div>`).join('');}
function selectLocation(loc){selectedLocation=loc;locationText.innerText=loc;locationText.style.color='#fff';uploadLocationShow.innerText=loc;locationModal.style.display='none';}
function loadTamilSongs(songs){let h="";songs.forEach(s=>{h+=`<div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #111;"><div style="width:40px;height:40px;background:#111;border-radius:4px;display:flex;align-items:center;justify-content:center;">${s.cover}</div><div style="flex:1;"><b style="font-size:13px;">${s.title}</b><br><small style="color:#888;font-size:11px;">${s.movie} • ${s.artist}</small></div><button onclick="previewSong('${s.url}',this)" style="background:none;border:none;color:#fff;font-size:16px;">▶</button><button onclick="selectTamilSong(${s.id})" style="background:#fff;color:#000;border:none;padding:6px 12px;border-radius:4px;font-weight:700;font-size:11px;margin-left:8px;">Add</button></div>`;});tamilSongsList.innerHTML=h;}
function searchTamilSongs(){let q=songSearch.value.toLowerCase();let f=tamilSongsDB.filter(s=>s.title.toLowerCase().includes(q)||s.movie.toLowerCase().includes(q));loadTamilSongs(f);}
function previewSong(url,btn){let p=songPreviewPlayer;if(currentPlayingUrl===url&&!p.paused){p.pause();btn.innerText='▶';currentPlayingUrl=null;return;}p.src=url;p.play();btn.innerText='⏸';currentPlayingUrl=url;p.onended=()=>btn.innerText='▶';}
function pauseSong(){songPreviewPlayer.pause();}
function selectTamilSong(id){let s=tamilSongsDB.find(x=>x.id===id);selectedSong=s;musicModal.style.display='none';pauseSong();musicText.innerText=s.title;musicText.style.color='#fff';uploadLocationShow.innerText=`🎵 ${s.title}`;}
async function uploadRealPost(){let cap=captionInput.value.trim();let img=preview.src;if(!img||img.length<10)return alert("Photo select pannu");await db.collection("reels").add({email:currentUser.email.split("@")[0],uid:currentUser.uid,caption:cap,videoUrl:img,taggedPeople,location:selectedLocation,song:selectedSong,likes:0,likedBy:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});uploadBox.style.display='none';captionInput.value='';preview.style.display='none';preview.src='';taggedPeople=[];selectedLocation="";selectedSong=null;tagCount.innerText='›';locationText.innerText='›';musicText.innerText='›';loadFeed();}
async function loadFeed(){try{let s=await db.collection("reels").orderBy("createdAt","desc").limit(30).get();let h="";for(let doc of s.docs){let x=doc.data();let uDoc=await db.collection("users").doc(x.uid).get();let u=uDoc.exists?uDoc.data():{};let loc=x.location?`<span style="font-size:11px;color:#888;"> • ${x.location}</span>`:"";let song=x.song?`<div style="padding:8px 12px;display:flex;align-items:center;gap:6px;"><span style="font-size:11px;">♪</span><small style="font-size:11px;">${x.song.title} • ${x.song.movie}</small></div>`:"";h+=`<div class="post"><div class="post-top"><div style="display:flex;gap:10px;align-items:center;"><img src="${u.photo||'https://i.pravatar.cc/100?u='+x.email}" style="width:32px;height:32px;border-radius:50%;"><div><b style="font-size:13px;">${x.email}</b><span style="font-size:11px;color:#888;display:block;">${x.location||''}</span></div></div><span>⋯</span></div><div style="position:relative;" ondblclick="doubleTapLike('${doc.id}',this)"><img class="post-img" src="${x.videoUrl}"></div><div class="post-actions"><button class="icon-btn" onclick="likePost('${doc.id}',this)">${x.likedBy&&x.likedBy.includes(currentUser.uid)?'❤️':'♡'}</button><button class="icon-btn" onclick="openComments('${doc.id}')">◯</button><button class="icon-btn" onclick="sharePost()">↗</button></div><div style="padding:0 12px 4px 12px;"><b style="font-size:13px;">${x.likes||0} likes</b></div><div style="padding:0 12px 12px 12px;font-size:13px;line-height:1.4;"><b>${x.email}</b> ${x.caption||''}</div>${song}</div>`;}feed.innerHTML=h||"<p style='text-align:center;margin-top:80px;color:#333;'>No posts yet<br><small>Tap + to post</small></p>";}catch(e){feed.innerHTML=e.message;}}
function doubleTapLike(id,el){let heart=document.createElement('div');heart.className='heart-pop';heart.innerText='♡';el.appendChild(heart);setTimeout(()=>heart.remove(),900);likePost(id,null);}
async function likePost(id,btn){let ref=db.collection("reels").doc(id);let doc=await ref.get();let x=doc.data();let liked=x.likedBy&&x.likedBy.includes(currentUser.uid);if(btn)btn.innerText=liked?'♡':'❤️';if(liked)await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});else await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});}
function sharePost(){navigator.clipboard.writeText(location.href);alert("Link copied");}
async function openComments(id){currentCommentPostId=id;commentBox.style.display="block";let s=await db.collection("reels").doc(id).collection("comments").orderBy("createdAt","asc").get();let h="";s.forEach(d=>{h+=`<div style="padding:8px 0;"><b style="font-size:13px;">${d.data().email}</b> <span style="font-size:13px;">${d.data().text}</span></div>`;});commentList.innerHTML=h||"<p style='color:#666;font-size:13px;'>No comments yet</p>";}
async function addComment(){let t=commentInput.value.trim();if(!t)return;await db.collection("reels").doc(currentCommentPostId).collection("comments").add({email:currentUser.email.split("@")[0],text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp()});commentInput.value="";openComments(currentCommentPostId);}
async function loadProfile(){pName.innerText=currentUser.email.split("@")[0];pEmail.innerText=currentUser.email;let my=await db.collection("reels").where("uid","==",currentUser.uid).get();postCount.innerText=my.size;let u=await db.collection("users").doc(currentUser.uid).get();let d=u.exists?u.data():{};if(d.photo)profilePic.src=d.photo;let h="";my.forEach(x=>{h+=`<div style="aspect-ratio:1/1;background:#111;"><img src="${x.data().videoUrl}" style="width:100%;height:100%;object-fit:cover;"></div>`});myPosts.innerHTML=h||"<p style='text-align:center;color:#333;padding:20px;'>No posts</p>";}
function openClash(){clearNav();feed.style.display="none";profileBox.style.display="none";searchBox.style.display="none";storyBar.style.display="none";clashPage.style.display="flex";reelsPage.style.display="none";loadClashes();}
async function loadClashes(){let snap=await db.collection("clashes").orderBy("createdAt","desc").limit(20).get();let h="";snap.forEach(doc=>{let c=doc.data();h+=`<div style="background:#111;border-radius:8px;padding:8px;margin-bottom:12px;display:flex;gap:4px;position:relative;"><div style="flex:1;"><img src="${c.postA.img}" style="width:100%;height:200px;object-fit:cover;border-radius:4px;"><button onclick="voteClash('${doc.id}','A')" style="width:100%;background:#fff;color:#000;padding:8px;border:none;border-radius:4px;margin-top:6px;font-weight:700;font-size:12px;">VOTE A (${c.votesA||0})</button></div><div style="flex:1;"><img src="${c.postB.img}" style="width:100%;height:200px;object-fit:cover;border-radius:4px;"><button onclick="voteClash('${doc.id}','B')" style="width:100%;background:#fff;color:#000;padding:8px;border:none;border-radius:4px;margin-top:6px;font-weight:700;font-size:12px;">VOTE B (${c.votesB||0})</button></div></div>`;});clashList.innerHTML=h||"<p style='text-align:center;color:#555;margin-top:40px;'>No clash yet</p>";}
async function voteClash(id,side){let ref=db.collection("clashes").doc(id);let doc=await ref.get();let c=doc.data();if(c.voted&&c.voted.includes(currentUser.uid))return alert("Already voted");if(side==='A')await ref.update({votesA:firebase.firestore.FieldValue.increment(1),voted:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});else await ref.update({votesB:firebase.firestore.FieldValue.increment(1),voted:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});loadClashes();}
function showReels(){clearNav();navReels.classList.add('active');feed.style.display="none";profileBox.style.display="none";searchBox.style.display="none";storyBar.style.display="none";clashPage.style.display="none";reelsPage.style.display='flex';loadReels();}
async function loadReels(){let rp=document.getElementById('reelsPage');let snap=await db.collection("reels").orderBy("createdAt","desc").limit(20).get();if(snap.empty){rp.innerHTML=`<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;"><p style="color:#666;">No reels</p><button onclick="showFeed()" style="margin-top:12px;background:#fff;color:#000;padding:8px 20px;border-radius:8px;border:none;">Back</button></div>`;return;}let h="";snap.forEach(doc=>{let x=doc.data();let song=x.song?`<div style="margin-top:8px;display:flex;align-items:center;gap:6px;"><span style="font-size:12px;">♪</span><span style="font-size:12px;">${x.song.title} • ${x.song.movie}</span></div>`:`<div style="margin-top:8px;font-size:12px;">♪ Original audio</div>`;h+=`<div class="reel-item" ondblclick="reelDoubleTap(this,'${doc.id}')"><img class="reel-media" src="${x.videoUrl}"><div class="reel-right"><div class="reel-action" onclick="reelLike('${doc.id}')"><span style="font-size:26px;">${x.likedBy&&x.likedBy.includes(currentUser.uid)?'❤️':'♡'}</span><b style="font-size:12px;margin-top:2px;">${x.likes||0}</b></div><div class="reel-action" onclick="openComments('${doc.id}')"><span style="font-size:22px;">◯</span><b style="font-size:11px;">8</b></div><div class="reel-action"><span style="font-size:22px;">↗</span></div></div><div class="reel-bottom"><div style="display:flex;align-items:center;gap:8px;"><b style="font-size:14px;">${x.email}</b></div><div style="font-size:13px;margin-top:4px;">${x.caption||''}</div>${song}</div></div>`;});rp.innerHTML=h;}
function reelDoubleTap(el,id){let heart=document.createElement('div');heart.className='heart-pop';heart.innerText='❤️';el.appendChild(heart);setTimeout(()=>heart.remove(),900);reelLike(id,true);}
async function reelLike(id){let ref=db.collection("reels").doc(id);let doc=await ref.get();let x=doc.data();let liked=x.likedBy&&x.likedBy.includes(currentUser.uid);if(liked)await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});else await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});loadReels();}
function playSong(url){songPreviewPlayer.src=url;songPreviewPlayer.play();}
function openAddStory(){addStoryPage.style.display='flex';}
function onStorySelect(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{tempStoryImage=e.target.result;editorImg.src=e.target.result;storyEditor.style.display='flex';addStoryPage.style.display='none';};r.readAsDataURL(f);}
function closeStoryEditor(){storyEditor.style.display='none';}
async function uploadStoryFinal(){if(!tempStoryImage)return;await db.collection("stories").add({email:currentUser.email.split("@")[0],uid:currentUser.uid,imageUrl:tempStoryImage,createdAt:firebase.firestore.FieldValue.serverTimestamp()});storyEditor.style.display='none';loadStories();}
async function loadStories(){try{let snap=await db.collection("stories").orderBy("createdAt","desc").limit(30).get();storiesData=[];let now=new Date();snap.forEach(d=>{let s=d.data();if(!s.createdAt)return;if((now-s.createdAt.toDate())/1000/3600>24)return;storiesData.push({id:d.id,...s});});let h="";storiesData.forEach((s,i)=>{h+=`<div class="s-item" onclick="viewStoryAt(${i})"><div class="s-ring"><div class="s-ring-inner"><img src="${s.imageUrl}"></div></div><small style="font-size:11px;margin-top:4px;display:block;">${s.email}</small></div>`;});storyList.innerHTML=h;}catch(e){}}
function viewStoryAt(i){currentStoryIndex=i;showStory();}
function showStory(){let s=storiesData[currentStoryIndex];storyView.style.display='flex';svImg.src=s.imageUrl;svName.innerText=s.email;svPic.src=s.imageUrl;progressWrap.innerHTML=storiesData.map((_,idx)=>`<div style="flex:1;height:2px;background:rgba(255,255,255,0.3);border-radius:2px;margin-right:2px;"><div id="pf-${idx}" style="height:100%;background:#fff;width:${idx<currentStoryIndex?'100%':'0%'}"></div></div>`).join('');let pr=0;clearInterval(storyTimer);storyTimer=setInterval(()=>{pr+=2;let el=document.getElementById(`pf-${currentStoryIndex}`);if(el)el.style.width=pr+'%';if(pr>=100)nextStory();},60);}
function nextStory(){clearInterval(storyTimer);if(currentStoryIndex<storiesData.length-1){currentStoryIndex++;showStory();}else closeStory();}
function prevStory(){clearInterval(storyTimer);if(currentStoryIndex>0){currentStoryIndex--;showStory();}else showStory();}
function closeStory(){storyView.style.display='none';clearInterval(storyTimer);}
async function doSearch(){let q=searchInput.value.toLowerCase().trim();if(!q){searchResults.innerHTML="";return;}let snap=await db.collection("reels").orderBy("createdAt","desc").limit(30).get();let h="";snap.forEach(d=>{let x=d.data();if(x.email.toLowerCase().includes(q)||(x.caption||"").toLowerCase().includes(q)){h+=`<div style="display:flex;gap:10px;padding:10px;border-bottom:1px solid #111;"><img src="${x.videoUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;"><div><b style="font-size:13px;">${x.email}</b><br><small style="color:#666;">${x.caption||''}</small></div></div>`;}});searchResults.innerHTML=h||"<p style='text-align:center;color:#555;margin-top:20px;'>No results</p>";}
</script>
</body>
</html>
