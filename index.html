<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PIXORO V10</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>iframe{display:none!important;}div[style*="position: fixed"]{display:none!important;}*{box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:12px 12px 50px 12px;margin:0;text-align:center}h1{color:#FFD700;letter-spacing:5px;margin:10px 0 3px;font-size:26px}.sub{color:#00ff88;font-size:9px;letter-spacing:2px;margin-bottom:12px}.box{background:#111;border:1px solid #333;padding:12px;border-radius:14px;margin-bottom:10px;text-align:left}.box h3{color:#FFD700;margin:0 0 8px;font-size:14px}input{width:100%;padding:10px;margin-bottom:7px;background:#000;border:1px solid #333;color:#fff;border-radius:8px}button{width:100%;padding:11px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.feed{display:none}.pfp{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle;margin-right:6px;cursor:pointer}.big-pfp{width:85px;height:85px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 8px}.story-ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#FFD700,#ff3366,#ff00ff);cursor:pointer;display:inline-block}.story-ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;display:block}.story-bar{display:flex;overflow-x:auto;padding:8px 0;gap:8px}.story-bar::-webkit-scrollbar{display:none}.story-item{text-align:center;min-width:70px;cursor:pointer}.story-item b{font-size:10px;display:block;margin-top:4px;width:70px;overflow:hidden;text-overflow:ellipsis}.story-add{width:62px;height:62px;border-radius:50%;border:2px dashed #FFD700;display:flex;align-items:center;justify-content:center;font-size:26px;background:#111;color:#FFD700}.post{background:#111;border:1px solid #333;padding:11px;border-radius:14px;margin:11px 0}.action{display:flex;gap:7px;margin:8px 0}.action button{flex:1;padding:8px;font-size:12px;border-radius:20px}.like-btn{background:#222;color:#fff;border:1px solid #333}.like-btn.liked{background:#ff0040;color:#fff;border-color:#ff0040}.follow-btn{width:auto;padding:6px 14px;font-size:11px;border-radius:20px;background:#00ff88;color:#000}.follow-btn.following{background:#222;color:#fff;border:1px solid #333}.comment-box{background:#0a0a0a;border-radius:10px;padding:8px;margin-top:8px}.comment{font-size:12px;padding:4px 0;border-bottom:1px solid #1a1a1a;text-align:left}.comment b{color:#FFD700}.c-input{display:flex;gap:6px;margin-top:6px}.c-input input{flex:1;margin:0}.c-input button{width:auto;padding:8px 12px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:10px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}#storyView,#userView{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;flex-direction:column;overflow-y:auto}#storyView.prog{height:3px;background:#333;width:100%;margin-top:8px}.prog-fill{height:100%;background:#FFD700;width:0%}.stats{display:flex;justify-content:center;gap:16px;margin:8px 0;font-size:12px}.stats b{color:#FFD700}#searchRes{background:#111;border:1px solid #333;border-radius:10px;max-height:250px;overflow-y:auto;display:none;margin-top:6px}.search-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px solid #222}</style></head><body>
<h1>PIXORO V1</h1><div class="sub">V10 ULTIMATE 👑 FOLLOW • COMMENT • STORY • LIKE</div>
<div id="authDiv"><div class="box"><h3>Signup</h3><input id="su_user" placeholder="username like giri"><input id="su_pass" type="password" placeholder="password"><button onclick="signupUser()">Signup</button></div><div class="box"><h3>Login</h3><input id="li_user" placeholder="username"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div></div>
<div id="feedDiv" class="feed">
<div class="box"><h3>🔥 Stories - 24hrs</h3><div id="storyBar" class="story-bar">Loading...</div></div>
<div class="box" style="text-align:center"><img id="myPfp" class="big-pfp" src="https://via.placeholder.com/85"><h3 style="text-align:center">Welcome <span id="uName"></span> 👑</h3><div class="stats"><span><b id="fCount">0</b> Followers</span><span><b id="fgCount">0</b> Following</span><span><b id="pCount">0</b> Posts</span></div><button onclick="logoutUser()" style="background:#111;color:#ff4444;border:1px solid #333;font-size:11px;margin-top:6px">Logout</button></div>
<div class="box"><h3>🔍 Search Users</h3><input id="searchInput" placeholder="Search @giri, @pixoro..." oninput="searchUsers()"><div id="searchRes"></div></div>
<div class="box"><h3>📸 Story Pannu Da</h3><input type="file" id="storyFile" accept="image/*"><button onclick="createStory()" style="background:linear-gradient(45deg,#FFD700,#ff3366);color:#000;margin-top:8px">+ Add Story 🔥</button><img id="sprev" style="width:100%;border-radius:12px;display:none;margin-top:8px;max-height:400px;object-fit:contain"></div>
<div class="box"><h3>Post Pannu Da 📸</h3><input type="file" id="postFile" accept="image/*"><input id="cap" placeholder="Caption..."><button onclick="createPost()" style="margin-top:6px">Post Podu Da 🔥</button><img id="pprev" style="width:100%;border-radius:12px;display:none;margin-top:8px;max-height:400px;object-fit:contain"></div>
<div id="posts"></div></div>
<div id="storyView"><div class="prog"><div id="sprog" class="prog-fill"></div></div><div style="display:flex;justify-content:space-between;padding:12px;align-items:center"><div style="display:flex;align-items:center"><img id="svPfp" class="pfp" src=""><b id="svName" style="margin-left:6px">@user</b></div><button onclick="closeStory()" style="width:auto;background:#222;color:#fff;padding:8px 16px;border-radius:20px">✕</button></div><img id="svImg" style="width:100%;flex:1;object-fit:contain"></div>
<div id="userView"><div style="display:flex;justify-content:space-between;padding:12px;align-items:center"><h3 id="uvName" style="color:#FFD700;margin:0">@user</h3><button onclick="closeUser()" style="width:auto;background:#222;color:#fff;padding:8px 16px;border-radius:20px">✕ Close</button></div><div class="box" style="text-align:center"><img id="uvPfp" class="big-pfp" src=""><h3 id="uvTitle">@user</h3><div class="stats"><span><b id="uvF">0</b> Followers</span><span><b id="uvFg">0</b> Following</span><span><b id="uvP">0</b> Posts</span></div><button id="uvFollowBtn" class="follow-btn" style="width:100%;margin-top:8px;padding:10px" onclick="toggleFollowView()">+ Follow</button></div><div id="uvGrid" class="grid" style="padding:0 12px"></div></div>
<script>
setInterval(()=>{document.querySelectorAll('div').forEach(e=>{if(e.innerText&&e.innerText.includes('Hide this banner'))e.remove();});},800);
const SUPABASE_URL="https://yecpltndhlzfjplzhcpm.supabase.co";const SUPABASE_KEY="sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let curStories=[],curView=[],timer=null,curProfile=null;
function signupUser(){let u=su_user.value.trim().toLowerCase(),p=su_pass.value.trim();if(!u||!p)return alert("Fill pannu da");sb.from('users').insert([{username:u,password:p}]).then(e=>{if(e.error&&!e.error.message.includes('duplicate'))return alert(e.error.message);localStorage.setItem('pix_user',u);location.reload();});}
function loginUser(){let u=li_user.value.trim().toLowerCase();sb.from('users').select('*').eq('username',u).single().then(e=>{if(e.error)return alert("User illa");localStorage.setItem('pix_user',u);location.reload();});}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){let u=localStorage.getItem('pix_user');if(!u)return;authDiv.style.display='none';feedDiv.style.display='flex';feedDiv.style.flexDirection='column';uName.innerText=u;let {data}=await sb.from('users').select('profile_pic').eq('username',u).single();if(data?.profile_pic)myPfp.src=data.profile_pic;loadStories();loadPosts();loadStats();}
async function loadStats(){let u=localStorage.getItem('pix_user');let {data:fer}=await sb.from('follows').select('*').eq('following',u);let {data:fing}=await sb.from('follows').select('*').eq('follower',u);let {data:posts}=await sb.from('posts').select('*').eq('username',u);fCount.innerText=fer?.length||0;fgCount.innerText=fing?.length||0;pCount.innerText=posts?.length||0;}
async function loadStories(){let {data,error}=await sb.from('stories').select('*').order('created_at',{ascending:false});if(error||!data){storyBar.innerHTML="No stories";return;}let now=Date.now();let valid=data.filter(s=> now - new Date(s.created_at).getTime() < 24*60*60*1000);curStories=valid;if(valid.length==0){storyBar.innerHTML=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div><span style="color:#666;font-size:11px;margin-left:8px">No stories - nee podu da 🔥</span>`;return;}let {data:users}=await sb.from('users').select('username,profile_pic');let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);let grouped={};valid.forEach(s=>{if(!grouped[s.username])grouped[s.username]=[];grouped[s.username].push(s);});let h=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div>`;Object.keys(grouped).forEach(un=>{let pfp=map[un]||'https://via.placeholder.com/40';let c=grouped[un].length;h+=`<div class="story-item" onclick="viewStories('${un}')"><div class="story-ring"><img src="${pfp}"></div><b>@${un} ${c>1?'('+c+')':''}</b></div>`;});storyBar.innerHTML=h;}
document.getElementById('storyFile').addEventListener('change',function(){if(this.files[0]){sprev.src=URL.createObjectURL(this.files[0]);sprev.style.display='block';}});
document.getElementById('postFile').addEventListener('change',function(){if(this.files[0]){pprev.src=URL.createObjectURL(this.files[0]);pprev.style.display='block';}});
async function createStory(){let f=document.getElementById('storyFile').files[0];if(!f)return alert("Photo edu da");let btn=event.target;btn.innerText="Uploading...⏳";btn.disabled=true;try{let fname=Date.now()+"_s_"+f.name.replace(/\s/g,'_');let {error:up}=await sb.storage.from('post-images').upload(fname,f);if(up)throw up;let {data}=sb.storage.from('post-images').getPublicUrl(fname);let u=localStorage.getItem('pix_user');let {error:ins}=await sb.from('stories').insert([{username:u,image_url:data.publicUrl}]);if(ins)throw ins;alert("Story OK da! 🔥 24hrs irukkum");document.getElementById('storyFile').value="";sprev.style.display='none';loadStories();}catch(e){alert("Error: "+e.message);}btn.innerText="+ Add Story 🔥";btn.disabled=false;}
async function createPost(){let f=document.getElementById('postFile').files[0];if(!f)return alert("Photo edu da");let cap=document.getElementById('cap').value.trim();let btn=event.target;btn.innerText="Posting...";btn.disabled=true;try{let fname=Date.now()+"_p_"+f.name.replace(/\s/g,'_');let {error:up}=await sb.storage.from('post-images').upload(fname,f);if(up)throw up;let {data}=sb.storage.from('post-images').getPublicUrl(fname);let u=localStorage.getItem('pix_user');let {error:ins}=await sb.from('posts').insert([{username:u,image_url:data.publicUrl,caption:cap}]);if(ins)throw ins;alert("Post OK da! 🔥");document.getElementById('postFile').value="";document.getElementById('cap').value="";pprev.style.display='none';loadPosts();loadStats();}catch(e){alert("Error: "+e.message);}btn.innerText="Post Podu Da 🔥";btn.disabled=false;}
function viewStories(un){let list=curStories.filter(s=>s.username==un);openStory(list,0);}function openStory(list,i){curView=list;storyView.style.display='flex';let s=list[i];svImg.src=s.image_url;svName.innerText='@'+s.username;sb.from('users').select('profile_pic').eq('username',s.username).single().then(({data})=>{svPfp.src=data?.profile_pic||'https://via.placeholder.com/40';});let p=0;clearInterval(timer);sprog.style.width='0%';timer=setInterval(()=>{p+=2;sprog.style.width=p+'%';if(p>=100){clearInterval(timer);i++;if(i<list.length)openStory(list,i);else closeStory();}},80);}function closeStory(){storyView.style.display='none';clearInterval(timer);}
async function loadPosts(){let u=localStorage.getItem('pix_user');let {data:posts}=await sb.from('posts').select('*').order('id',{ascending:false});let {data:users}=await sb.from('users').select('username,profile_pic');let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*').order('id',{ascending:true});let {data:follows}=await sb.from('follows').select('*').eq('follower',u);let following=(follows||[]).map(f=>f.following);let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);let h='';(posts||[]).forEach(p=>{let pfp=map[p.username]||'https://via.placeholder.com/40';let postLikes=(likes||[]).filter(l=>l.post_id==p.id);let postComments=(comments||[]).filter(c=>c.post_id==p.id);let iLiked=postLikes.some(l=>l.username==u);let isFollowing=following.includes(p.username);let fb=p.username==u?'':`<button class="follow-btn ${isFollowing?'following':''}" onclick="toggleFollow('${p.username}')">${isFollowing?'✓ Following':'+ Follow'}</button>`;h+=`<div class="post"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;cursor:pointer" onclick="openUser('${p.username}')"><img class="pfp" src="${pfp}"><b>@${p.username}</b></div>${fb}</div><img src="${p.image_url}" style="width:100%;border-radius:12px;margin:10px 0"><p style="text-align:left;margin:6px 0">${p.caption||''}</p><div class="action"><button class="like-btn ${iLiked?'liked':''}" onclick="likePost(${p.id})">${iLiked?'❤️':'🤍'} ${postLikes.length} Like</button><button class="like-btn" onclick="document.getElementById('cbox-${p.id}').focus()">💬 ${postComments.length} Comment</button></div><div class="comment-box">${postComments.map(c=>`<div class="comment"><b onclick="openUser('${c.username}')" style="cursor:pointer">@${c.username}</b> ${c.comment}</div>`).join('')}<div class="c-input"><input id="cbox-${p.id}" placeholder="Comment pannu da..."><button onclick="addComment(${p.id})" style="background:#FFD700">Send</button></div></div></div>`;});document.getElementById('posts').innerHTML=h||"<p style='color:#666'>No posts yet - nee first podu da 🔥</p>";}
async function likePost(id){let u=localStorage.getItem('pix_user');let {data:ex}=await sb.from('likes').select('*').eq('post_id',id).eq('username',u);if(ex&&ex.length>0){await sb.from('likes').delete().eq('post_id',id).eq('username',u);}else{await sb.from('likes').insert([{post_id:id,username:u}]);}loadPosts();}
async function addComment(pid){let inp=document.getElementById('cbox-'+pid);let txt=inp.value.trim();if(!txt)return;let u=localStorage.getItem('pix_user');let {error}=await sb.from('comments').insert([{post_id:pid,username:u,comment:txt}]);if(error)return alert(error.message);inp.value="";loadPosts();}
async function toggleFollow(target){let u=localStorage.getItem('pix_user');if(u==target)return;let {data:ex}=await sb.from('follows').select('*').eq('follower',u).eq('following',target);if(ex&&ex.length>0){await sb.from('follows').delete().eq('follower',u).eq('following',target);}else{await sb.from('follows').insert([{follower:u,following:target}]);}loadPosts();loadStats();}
async function searchUsers(){let q=searchInput.value.trim().toLowerCase();if(!q){searchRes.style.display='none';return;}let {data:users}=await sb.from('users').select('username,profile_pic').ilike('username','%'+q+'%');if(!users||users.length==0){searchRes.innerHTML="<p style='color:#666;padding:8px'>No users</p>";searchRes.style.display='block';return;}let me=localStorage.getItem('pix_user');let {data:follows}=await sb.from('follows').select('*').eq('follower',me);let following=(follows||[]).map(f=>f.following);let h='';users.forEach(u=>{if(u.username==me)return;let pfp=u.profile_pic||'https://via.placeholder.com/40';let isF=following.includes(u.username);h+=`<div class="search-item"><div style="display:flex;align-items:center;cursor:pointer" onclick="openUser('${u.username}')"><img class="pfp" src="${pfp}"><b>@${u.username}</b></div><button class="follow-btn ${isF?'following':''}" onclick="toggleFollow('${u.username}');searchUsers()">${isF?'✓ Following':'+ Follow'}</button></div>`;});searchRes.innerHTML=h||"<p style='color:#666;padding:8px'>No users</p>";searchRes.style.display='block';}
async function openUser(un){curProfile=un;userView.style.display='flex';uvName.innerText='@'+un;uvTitle.innerText='@'+un;uvPfp.src='https://via.placeholder.com/85';uvGrid.innerHTML='Loading...';let {data:user}=await sb.from('users').select('*').eq('username',un).single();if(user?.profile_pic)uvPfp.src=user.profile_pic;let {data:fer}=await sb.from('follows').select('*').eq('following',un);let {data:fing}=await sb.from('follows').select('*').eq('follower',un);let {data:posts}=await sb.from('posts').select('*').eq('username',un).order('id',{ascending:false});uvF.innerText=fer?.length||0;uvFg.innerText=fing?.length||0;uvP.innerText=posts?.length||0;let me=localStorage.getItem('pix_user');if(me==un){uvFollowBtn.style.display='none';}else{uvFollowBtn.style.display='block';let {data:ex}=await sb.from('follows').select('*').eq('follower',me).eq('following',un);if(ex&&ex.length>0){uvFollowBtn.innerText='✓ Following';uvFollowBtn.className='follow-btn following';}else{uvFollowBtn.innerText='+ Follow';uvFollowBtn.className='follow-btn';}}uvGrid.innerHTML=!posts||posts.length==0?"<p style='color:#666;grid-column:1/4;text-align:center'>No posts yet</p>":posts.map(p=>`<img src="${p.image_url}">`).join('');}
function closeUser(){userView.style.display='none';curProfile=null;}
async function toggleFollowView(){if(!curProfile)return;let u=localStorage.getItem('pix_user');if(u==curProfile)return;let {data:ex}=await sb.from('follows').select('*').eq('follower',u).eq('following',curProfile);if(ex&&ex.length>0){await sb.from('follows').delete().eq('follower',u).eq('following',curProfile);}else{await sb.from('follows').insert([{follower:u,following:curProfile}]);}openUser(curProfile);loadStats();loadPosts();}
checkUser();
</script></body></html>
