<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO - from GIRI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#fafafa;padding-bottom:70px}
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbdbdb;padding:12px 16px;display:flex;justify-content:space-between;z-index:90}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.post{max-width:470px;margin:0 auto 12px;background:#fff;border:1px solid #dbdbdb;border-radius:8px;overflow:hidden}
.post img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.post-header{padding:10px;display:flex;justify-content:space-between;font-weight:600}
.post-actions{padding:10px;display:flex;gap:16px;font-size:22px}
.post-actions i{cursor:pointer}
#authPage{min-height:100vh;display:flex;justify-content:center;align-items:center}
.authBox{width:350px;background:#fff;border:1px solid #dbdbdb;padding:30px 20px;border-radius:8px;text-align:center}
.authBox input{width:100%;padding:10px;margin:6px 0;border:1px solid #dbdbdb;border-radius:4px}
.authBox button{width:100%;padding:10px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-weight:600;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:1000}
.modal.active{display:flex}
.modalBox{background:#fff;border-radius:12px;width:90%;max-width:400px;padding:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbdbdb;display:flex;justify-content:space-around;padding:12px 0 18px;z-index:90}
.bottom-nav i{font-size:24px;cursor:pointer}
.bottom-sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:flex-end}
.bottom-sheet.active{display:flex}
.sheet-box{background:#1e1e1e;width:100%;border-radius:20px 20px 0 0;padding:20px 20px 40px;color:#fff}
.sheet-option{display:flex;align-items:center;gap:15px;padding:16px 10px;border-bottom:1px solid #333;font-weight:600;cursor:pointer}
.sheet-tabs{display:flex;justify-content:space-around;background:#2a2a2a;border-radius:30px;padding:10px;margin-top:20px}
.sheet-tabs span{padding:8px 16px;border-radius:20px;color:#888;font-weight:700}
.sheet-tabs span.active{background:#fff;color:#000}
/* INSTAGRAM MARI INSTANT LOGO SPLASH */
#splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:70px 0 45px}
#splash.hide{opacity:0;pointer-events:none;transition:opacity 0.6s}
.splash-logo{animation:pop 0.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<!-- INSTANT LOGO - OTTANEY VARUM -->
<div id="splash">
<div></div>
<div style="text-align:center" class="splash-logo">
<div style="font-size:90px;line-height:1">📸</div>
<div style="font-weight:900;font-size:38px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:5px">PIXORO</div>
</div>
<div style="text-align:center"><div style="color:#9ca3af;font-size:12px">from</div><div style="font-weight:900;color:#ff004f;font-size:20px;letter-spacing:1px">∞ GIRI</div></div>
</div>

<div id="authPage">
<div class="authBox">
<h1 style="font-weight:900;font-size:32px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px">PIXORO</h1>
<input id="email" placeholder="Email" autocomplete="off">
<input id="password" type="password" placeholder="Password" autocomplete="new-password">
<button onclick="login()">Log In</button>
<button onclick="signup()" style="background:#fff;color:#000;border:1px solid #dbdbdb">Sign Up</button>
</div>
</div>

<div id="mainPage" style="display:none">
<div class="header"><div class="logo">PIXORO</div><div style="display:flex;gap:12px;font-size:20px"><i class="fa-regular fa-heart"></i><i class="fa-solid fa-right-from-bracket" onclick="logout()"></i></div></div>
<div id="posts"></div>
<div class="bottom-nav">
<i class="fa-solid fa-house"></i><i class="fa-solid fa-magnifying-glass"></i><i class="fa-regular fa-square-plus" onclick="openBottomSheet()"></i><i class="fa-solid fa-clapperboard"></i><i class="fa-regular fa-user"></i>
</div>
</div>
<div id="createModal" class="modal">
<div class="modalBox">
<h3 style="margin-bottom:10px">Create New</h3>
<input id="postImage" placeholder="Image / Video URL" style="width:100%;padding:10px;border:1px solid #dbdbdb;border-radius:8px;margin-bottom:8px">
<input id="postCaption" placeholder="Caption..." style="width:100%;padding:10px;border:1px solid #dbdbdb;border-radius:8px">
<button id="systemBtn" onclick="toggleSystemFilter()" style="width:100%;padding:12px;background:#fff;color:#000;border:2px dashed #ff004f;border-radius:8px;margin-top:12px;font-weight:900;letter-spacing:1px">⚡ SYSTEM SETHU</button>
<button onclick="createPost()" style="width:100%;padding:11px;background:#0095f6;color:#fff;border:none;border-radius:8px;margin-top:10px;font-weight:700">Share</button>
<button onclick="closeCreate()" style="width:100%;padding:10px;background:#f2f2f2;border:none;border-radius:8px;margin-top:8px">Cancel</button>
</div>
</div>

<div id="commentModal" class="modal">
<div class="modalBox">
<h3>Comments</h3><div id="commentList" style="margin:12px 0;max-height:300px;overflow:auto;color:#666"></div>
<div style="display:flex;gap:8px"><input id="commentInput" placeholder="Add a comment..." style="flex:1;padding:10px;border:1px solid #dbdbdb;border-radius:20px"><button onclick="addComment()" style="padding:10px 18px;background:#0095f6;color:#fff;border:none;border-radius:20px;font-weight:700">Post</button></div>
<button onclick="closeComment()" style="width:100%;margin-top:12px;padding:9px;background:#fff;border:1px solid #dbdbdb;border-radius:8px">Close</button>
</div>
</div>

<div id="bottomSheet" class="bottom-sheet" onclick="closeBottomSheet()">
<div class="sheet-box" onclick="event.stopPropagation()">
<div style="width:40px;height:4px;background:#555;border-radius:10px;margin:0 auto 18px"></div>
<div class="sheet-option" onclick="handleCreate('POST')"><i class="fa-regular fa-square"></i> POST <span style="margin-left:auto">▸</span></div>
<div class="sheet-option" onclick="handleCreate('STORY')"><i class="fa-solid fa-circle-plus"></i> STORY</div>
<div class="sheet-option" onclick="handleCreate('REEL')"><i class="fa-solid fa-clapperboard"></i> REEL</div>
<div class="sheet-option" onclick="handleCreate('LIVE')"><i class="fa-solid fa-video" style="color:#ff3040"></i> LIVE</div>
<div class="sheet-option" onclick="handleCreate('SYSTEM')" style="color:#ff2e88"><i class="fa-solid fa-bolt"></i> SYSTEM SETHU <span style="margin-left:auto;background:#ff004f;color:#fff;padding:2px 9px;border-radius:10px;font-size:11px">NEW 🔥</span></div>
<div class="sheet-tabs"><span>POST</span><span>STORY</span><span class="active">REEL</span><span>LIVE</span></div>
</div>
</div>
<script>

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyanJtdmR2eXF2dGpkd2RobXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyODk3OTYsImV4cCI6MjA3Mzg2NTc5Nn0.o3J4YjRjK3a8v5b9c2d1e6f7g8h9i0j1k2l3m4n5o6p";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function openCreate(){document.getElementById('createModal').classList.add('active')}

function toggleSystemFilter(){glitchMode=!glitchMode;let b=document.getElementById('systemBtn');if(glitchMode){b.style.background='#ff004f';b.style.color='#fff';b.innerHTML='🔥 SYSTEM ON';}else{b.style.background='#fff';b.style.color='#000';b.innerHTML='⚡ SYSTEM SETHU';}}

async function applySystemGlitch(url){
return new Promise((res)=>{
const img=new Image();img.crossOrigin="anonymous";
img.onload=()=>{
const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
const id=ctx.getImageData(0,0,c.width,c.height);const d=id.data;
for(let y=0;y<c.height;y+=3){if(Math.random()>0.65){let s=(Math.random()*30|0)-15;
for(let x=0;x<c.width;x++){let i=(y*c.width+x)*4;let j=(y*c.width+Math.max(0,Math.min(c.width-1,x+s)))*4;d[i]=d[j];d[i+1]=d[j+1];d[i+2]=d[j+2];if(Math.random()>0.97){d[i]=255*Math.random();d[i+1]=255*Math.random();d[i+2]=255*Math.random();}}
if(Math.random()>0.88){ctx.fillStyle=`hsl(${360*Math.random()},100%,50%)`;ctx.fillRect(0,y,c.width,2+4*Math.random());}}
}
ctx.putImageData(id,0,0);res(c.toDataURL('image/jpeg',0.75));
};
img.onerror=()=>res(url);img.src=url;
});
  }
async function login(){
const e=document.getElementById('email').value;
const p=document.getElementById('password').value;
if(!e||!p)return alert("Email password podu da!");
try{
const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});
if(error) throw error;
currentUser=data.user;showMain();
}catch(err){
// FAILED TO FETCH na Guest mode la open pannu
console.log(err);
if(err.message.includes("fetch")||err.message.includes("Failed")){
alert("Supabase pause aayiduchu da! Guest mode la open pandren!");
currentUser={email:e||"giri@pixoro.app",id:"guest"};
showMain();
return;
}
alert("Login failed: "+err.message);
}
}
