<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#f3f6ff;
  color:#222;
  padding-bottom:90px
}

header{
  height:125px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 38px;
  box-shadow:0 2px 12px #dce2f0
}

.logo{
  font-size:48px;
  font-weight:bold;
  color:#6179df
}

.profile{
  font-size:38px;
  color:#1680c8
}

.container{
  padding:35px 30px
}

.card{
  background:white;
  border-radius:35px;
  padding:32px;
  box-shadow:0 8px 25px #dce2f0;
  margin-bottom:30px
}

h2{
  font-size:34px;
  margin-bottom:22px
}

textarea{
  width:100%;
  height:150px;
  border:2px solid #ddd;
  border-radius:25px;
  padding:20px;
  font-size:22px;
  resize:none;
  outline:none
}

.filebox{
  margin-top:20px;
  border:2px solid #ddd;
  border-radius:25px;
  padding:18px
}

input[type=file]{
  width:100%;
  font-size:17px
}

.preview{
  width:100%;
  margin-top:20px;
  border-radius:22px;
  display:none;
  max-height:450px;
  object-fit:cover
}

.filters{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-top:15px;
  padding-bottom:5px
}

.filters button{
  white-space:nowrap;
  padding:12px 18px;
  border-radius:20px;
  background:#eef1ff;
  font-size:16px
}

.filters button:hover{
  background:#637be4;
  color:white
}

.publish{
  width:100%;
  margin-top:20px;
  padding:20px;
  border-radius:22px;
  background:#637be4;
  color:white;
  font-size:24px;
  font-weight:bold
}

.post{
  background:white;
  border-radius:28px;
  margin-bottom:25px;
  overflow:hidden;
  box-shadow:0 5px 20px #dce2f0
}

.posttop{
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1680c8;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:25px
}

.username{
  font-size:19px;
  font-weight:bold
}

.time{
  font-size:13px;
  color:#777
}

.caption{
  padding:0 18px 18px;
  font-size:19px
}

.postimg{
  width:100%;
  display:block;
  max-height:600px;
  object-fit:cover
}

.actions{
  display:flex;
  justify-content:space-around;
  padding:15px 8px;
  border-top:1px solid #eee
}

.actions button{
  background:none;
  font-size:16px;
  color:#444
}

.actions button.liked{
  color:#e91e63
}

.stats{
  padding:0 18px 15px;
  color:#777;
  font-size:14px
}

.comments{
  padding:0 18px 18px
}

.commentrow{
  display:flex;
  gap:8px;
  margin-top:10px
}

.commentrow input{
  flex:1;
  border:1px solid #ddd;
  border-radius:18px;
  padding:10px 14px;
  outline:none
}

.commentrow button{
  border:0;
  border-radius:18px;
  background:#637be4;
  color:white;
  padding:0 15px
}

.comment{
  margin-top:8px;
  background:#f4f5fa;
  padding:9px 12px;
  border-radius:15px
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:90px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -3px 15px #ddd;
  z-index:20
}

.nav{
  text-align:center;
  font-size:16px
}

.nav div{
  font-size:30px
}

.empty{
  text-align:center;
  color:#777;
  padding:30px
}

.filter-normal{filter:none}
.filter-gray{filter:grayscale(100%)}
.filter-sepia{filter:sepia(80%)}
.filter-bright{filter:brightness(1.3)}
.filter-contrast{filter:contrast(1.4)}
.filter-saturate{filter:saturate(1.8)}
.filter-vintage{filter:sepia(.35) contrast(1.15) saturate(1.3)}
.filter-cool{filter:hue-rotate(15deg) saturate(1.2)}
</style>
</head>

<body>

<header>
  <div class="logo">PIXORO</div>
  <div class="profile">👤</div>
</header>

<div class="container">

<div class="card">
<h2>Create Post</h2>

<textarea id="caption" placeholder="Write your post..."></textarea>

<div class="filebox">
<input type="file" id="photo" accept="image/*">
</div>

<img id="preview" class="preview">

<div class="filters">
<button onclick="setFilter('filter-normal')">Normal</button>
<button onclick="setFilter('filter-gray')">B&W</button>
<button onclick="setFilter('filter-sepia')">Sepia</button>
<button onclick="setFilter('filter-bright')">Bright</button>
<button onclick="setFilter('filter-contrast')">Contrast</button>
<button onclick="setFilter('filter-saturate')">Color</button>
<button onclick="setFilter('filter-vintage')">Vintage</button>
<button onclick="setFilter('filter-cool')">Cool</button>
</div>

<button class="publish" onclick="publishPost()">PUBLISH</button>

</div>

<div id="posts"></div>

</div>

<div class="bottom">
  <div class="nav">
    <div>🏠</div>
    Home
  </div>

  <div class="nav">
    <div>🔍</div>
    Search
  </div>

  <div class="nav">
    <div>➕</div>
    Post
  </div>

  <div class="nav">
    <div>🏆</div>
    Rewards
  </div>

  <div class="nav">
    <div>👤</div>
    Profile
  </div>
</div>

<script>

let selectedImage="";
let selectedFilter="filter-normal";
let posts=JSON.parse(localStorage.getItem("pixoroPosts")||"[]");

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");

photo.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    selectedImage=e.target.result;

    preview.src=selectedImage;
    preview.style.display="block";

  };

  reader.readAsDataURL(file);
});

function setFilter(filter){

  selectedFilter=filter;

  preview.className="preview "+filter;
}

function publishPost(){

  const caption=document.getElementById("caption").value.trim();

  if(!selectedImage){

    alert("Please choose a photo!");
    return;

  }

  const post={

    id:Date.now(),

    caption:caption,

    image:selectedImage,

    filter:selectedFilter,

    likes:0,

    liked:false,

    views:0,

    saved:false,

    comments:[],

    time:new Date().toLocaleString()

  };

  posts.unshift(post);

  localStorage.setItem("pixoroPosts",JSON.stringify(posts));

  document.getElementById("caption").value="";
  photo.value="";
  preview.src="";
  preview.style.display="none";

  selectedImage="";

  renderPosts();

  alert("Post published successfully!");

}

function likePost(id){

  const post=posts.find(p=>p.id===id);

  if(!post)return;

  if(post.liked){

    post.likes--;
    post.liked=false;

  }else{

    post.likes++;
    post.liked=true;

  }

  saveAndRender();

}

function viewPost(id){

  const post=posts.find(p=>p.id===id);

  if(!post)return;

  post.views++;

  localStorage.setItem("pixoroPosts",JSON.stringify(posts));

}

function savePost(id){

  const post=posts.find(p=>p.id===id);

  if(!post)return;

  post.saved=!post.saved;

  saveAndRender();

}

function addComment(id){

  const input=document.getElementById("comment-"+id);

  if(!input)return;

  const text=input.value.trim();

  if(!text)return;

  const post=posts.find(p=>p.id===id);

  post.comments.push(text);

  input.value="";

  saveAndRender();

}

function deletePost(id){

  if(!confirm("Delete this post?"))return;

  posts=posts.filter(p=>p.id!==id);

  saveAndRender();

}

function sharePost(id){

  const post=posts.find(p=>p.id===id);

  if(navigator.share){

    navigator.share({

      title:"PIXORO Post",

      text:post.caption||"Check this post on PIXORO"

    });

  }else{

    navigator.clipboard.writeText(
      "PIXORO Post: "+(post.caption||"")
    );

    alert("Post text copied!");

  }

}

function saveAndRender(){

  localStorage.setItem(
    "pixoroPosts",
    JSON.stringify(posts)
  );

  renderPosts();

}

function renderPosts(){

  const box=document.getElementById("posts");

  if(posts.length===0){

    box.innerHTML=
      '<div class="empty">No public posts yet 📸</div>';

    return;

  }

  box.innerHTML=posts.map(post=>`

    <div class="post">

      <div class="posttop">

        <div class="avatar">👤</div>

        <div>

          <div class="username">PIXORO User</div>

          <div class="time">${post.time}</div>

        </div>

      </div>

      ${
        post.caption
        ?
        `<div class="caption">${escapeHTML(post.caption)}</div>`
        :
        ""
      }

      <img
        class="postimg ${post.filter}"
        src="${post.image}"
        onclick="viewPost(${post.id})"
      >

      <div class="actions">

        <button
          class="${post.liked?'liked':''}"
          onclick="likePost(${post.id})">
          ❤️ ${post.likes}
        </button>

        <button onclick="focusComment(${post.id})">
          💬 ${post.comments.length}
        </button>

        <button onclick="sharePost(${post.id})">
          🔗 Share
        </button>

        <button onclick="savePost(${post.id})">
          ${post.saved?'💾 Saved':'🔖 Save'}
        </button>

        <button onclick="deletePost(${post.id})">
          🗑️
        </button>

      </div>

      <div class="stats">
        👁️ ${post.views} views
      </div>

      <div class="comments">

        ${
          post.comments.map(c=>
            `<div class="comment">💬 ${escapeHTML(c)}</div>`
          ).join("")
        }

        <div class="commentrow">

          <input
            id="comment-${post.id}"
            placeholder="Write a comment..."
          >

          <button onclick="addComment(${post.id})">
            Send
          </button>

        </div>

      </div>

    </div>

  `).join("");

}

function focusComment(id){

  const input=document.getElementById("comment-"+id);

  if(input){

    input.focus();

  }

}

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

renderPosts();

</script>

</body>
</html>
