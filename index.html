<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO FULL - Instagram Clone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{background:#000;color:#fff}
header{position:sticky;top:0;z-index:100;background:#000;border-bottom:1px solid #262626;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.coin-box{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:5px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
.rupee{background:#FFD700;color:#000;padding:2px 8px;border-radius:12px;font-weight:800}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px;border-bottom:1px solid #262626;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:64px;cursor:pointer}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.story-ring img{width:100%;height:100%;border-radius:50%;border:2px solid #000;object-fit:cover;background:#222}
.story span{font-size:11px;margin-top:4px;display:block;white-space:nowrap}
.settings-panel{margin:12px;border:2px solid #FFD700;border-radius:16px;padding:14px;background:#111}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.set-item{background:#222;padding:8px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.set-item input{width:52px;background:#000;border:1px solid #FFD700;color:#FFD700;text-align:center;border-radius:6px;padding:3px;font-weight:bold}
.feed{max-width:470px;margin:0 auto;padding-bottom:80px}
.post{background:#000;border-bottom:1px solid #262626;margin-bottom:0}
.post-header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.post-user{display:flex;align-items:center;gap:10px}
.post-user img{width:32px;height:32px;border-radius:50%}
.post-user b{font-size:14px}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;display:block}
.post-actions{padding:10px 12px;display:flex;justify-content:space-between}
.action-left{display:flex;gap:16px;font-size:24px}
.action-left i{cursor:pointer}
.action-left i.liked{color:#ed4956}
.post-likes{padding:0 12px;font-size:14px;font-weight:700}
.post-caption{padding:4px 12px;font-size:14px}
.post-caption b{margin-right:6px}
.post-time{padding:4px 12px 10px;color:#8e8e8e;font-size:11px;text-transform:uppercase}
.comment-box{padding:8px 12px;border-top:1px solid #262626;display:flex;gap:10px;align-items:center}
.comment-box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:14px}
.search-bar{flex:1;margin:0 10px;background:#262626;border-radius:8px;padding:6px 10px;display:flex}
.search-bar input{background:transparent;border:none;color:#fff;width:100%;outline:none;font-size:14px}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(45deg,#FFD700,#ff0055);border:none;font-size:26px;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.active{display:flex}
.modal-box{background:#121212;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:400px}
.modal-box input,.modal-box textarea{width:100%;background:#000;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;margin-top:10px}
.btn{width:100%;background:#0095f6;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;margin-top:12px}
.btn-yellow{background:#FFD700;color:#000}
</style>
</head>
<body>
<header>
<div class="logo">PIXORO FULL</div>
<div style="display:flex;gap:8px;align-items:center">
<div class="coin-box">🪙 <span id="coinCount">19068</span> <span class="rupee">₹<span id="rupeeCount">190</span></span></div>
<i class="fas fa-cog" style="font-size:22px;color:#fff;cursor:pointer" onclick="toggleSet()"></i>
</div>
</header>

<div class="search-bar" style="margin:10px"><i class="fas fa-search" style="color:#888;margin-right:8px"></i><input id="searchInput" placeholder="Search ideas..." oninput="filterPosts()"></div>

<div class="stories">
<div class="story" onclick="openUpload()"><div class="story-ring
