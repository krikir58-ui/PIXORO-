<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.storyBar{display:flex;gap:12px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #222}.sItem{text-align:center;min-width:62px;cursor:pointer}.sRing{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}.sRing img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}
.post{border-bottom:1px solid #222;padding-bottom:10px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111}.actions{padding:10px 12px;display:flex;gap:15px;font-size:22px;align-items:center}.actions span{cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px;cursor:pointer}.nav a.active{color:#fff}
#storyView{display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.cmtBox{display:flex;gap:6px;padding:8px 12px}.cmtBox input{flex:1;background:#111;border:1px solid #333;border-radius:20px;padding:8px 12px;color:#fff;outline:none}
@keyframes heartBlast{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
</style></head><body>
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><span>📩</span></div>
<div id="storyBar" class="storyBar"></div><div id="feed"></div><div style="height:70px"></div>
<div class="nav"><a href="index.html" class="active">🏠</a><a href="reels.html">🎬</a><a onclick="openPlus()">➕</a><a href="#">❤️</a><a href="#">👤</a></div>
<div id="storyView"><div style="position:absolute;top:20px;left:15px;right:15px;display:flex;justify-content:space-between"><b id="sUser"></b><span onclick="document.getElementById('storyView').style.display='none'" style="font-size:28px;cursor:pointer">&times;</span></div><img id="sImg" style="max-width:100%;max-height:85vh;object-fit:contain"></div>

<div id="plusModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:flex-end;justify-content:center">
  <div style="background:#1a1a1a;width:100%;max-width:450px;border-radius:20px 20px 0 0;padding:20px 15px 40px;border:1px solid #333">
    <div style="width:40px;height:4px;background:#555;border-radius:10px;margin:0 auto 20px"></div>
    <div style="text-align:center;font-weight:bold;margin-bottom:15px;font-size:18px">Create 🔵</div>
    <div onclick="location.href='upload.html'" style="display:flex;align-items:center;gap:15px;padding:15px;background:#222;border-radius:12px;margin:8px 0;cursor:pointer"><span style="font-size:28px">🖼️</span><div><b>Post</b><br><small style="color:#aaa">Photo share pannu</small></div><span style="margin-left:auto">➡️</span></div>
    <div onclick="location.href='story-upload.html'" style="display:flex;align-items:center;gap:15px;padding:15px;background:#222;border-radius:12px;margin:8px 0;cursor:pointer"><span style="font-size:28px">⭕</span><div><b>Story</b><br><small style="color:#aaa">24hr ku mattum</small></div><span style="margin-left:auto">➡️</span></div>
    <div onclick="location.href='reels-upload.html'" style="display:flex;align-items:center;gap:15px;padding:15px;background:#222;border-radius:12px;margin:8px 0;cursor:pointer"><span style="font-size:28px">🎬</span><div><b>Reels</b><br><small style="color:#aaa">Short video</small></div><span style="margin-left:auto">➡️</span></div>
    <div onclick="closePlus()" style="text-align:center;padding:12px;margin-top:15px;color:#aaa;cursor:pointer">Cancel</div>
  </div>
</div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME = 'Giri'
function openPlus(){document.getElementById('plusModal').style.display='flex'}
function closePlus(){document.getElementById('plusModal').style.display='none'}
function blastHeart(){let h=document.createElement('div');h.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:9999;animation:heartBlast 1s ease-out;pointer-events:none';h.innerHTML='❤️🔵';document.body.appendChild(h);setTimeout(()=>h.remove(),1000);if(navigator.vibrate)navigator.vibrate(100)}

async function loadStories(){
 const {data}=await supa.from('stories').select('*').order('created_at',{ascending:false})
 let h=`<div class="sItem" onclick="location.href='story-upload.html'"><div style="width:62px;height:62px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px dashed #555">➕</div><div style="font-size:11px;margin-top:4px">Your Story</div></div>`
 if(data) h+=data.map(s=>`<div class="sItem" onclick="viewStory('${s.image_url}','${s.username}')"><div class="sRing"><img src="${s.image_url}"></div><div style="font-size:11px;margin-top:4px">${s.username}</div></div>`).join('')
 document.getElementById('storyBar').innerHTML=h
}
function viewStory(u,n){document.getElementById('sImg').src=u;document.getElementById('sUser').innerText='@'+n+' 🔵';document.getElementById('storyView').style.display='flex';setTimeout(()=>document.getElementById('storyView').style.display='none',5000)}

async function loadPosts(){
 const {data:posts}=await supa.from('posts').select('*')
 const {data:likes}=await supa.from('likes').select('*')
 const {data:comments}=await supa.from('comments').select('*')
 const {data:follows}=await supa.from('follows').select('*').eq('follower',ME)
 if(!posts || posts.length==0){document.getElementById('feed').innerHTML='<p style="text-align:center;padding:30px;color:#777">No posts da 🔵</p>';return}

 // 🔥 PIXORO SMART FEED ALGORITHM - CORRECT ADD PANNIRUKEN DA!
 let rankedPosts = posts.map(p=>{
   const lCount = likes ? likes.filter(l=>l.post_id==p.id).length : 0
   const cCount = comments ? comments.filter(c=>c.post_id==p.id).length : 0
   const hoursAgo = (new Date() - new Date(p.created_at)) / (1000*60*60)
   let score = 0
   score += lCount * 2
   score += cCount * 3
   const isFollowing = follows ? follows.some(f=>f.following==p.username) : false
   if(isFollowing) score += 10
   if(p.username==ME) score += 5
   score -= hoursAgo * 0.5
   if(p.caption && p.caption.includes('#')) score += 8
   return {...p, score, lCount, cCount, isFollowing}
 })
 rankedPosts.sort((a,b)=>b.score - a.score)

 let html=''
 for(let p of rankedPosts){
  const isLiked = likes ? likes.some(l=>l.post_id==p.id && l.username==ME) : false
  const pCmts = comments ? comments.filter(c=>c.post_id==p.id) : []
  const badge = p.score>10 ? '🔥' : p.isFollowing ? '⭐' : ''
  html+=`<div class="post">
   <div class="postTop"><b>@${p.username} ${p.username==ME?'✔️':''} ${badge}</b><button onclick="followUser('${p.username}')" style="background:${p.isFollowing?'#333':'#0095f6'};border:0;color:#fff;padding:5px 12px;border-radius:6px;font-weight:bold;cursor:pointer">${p.isFollowing?'Following':'Follow'}</button></div>
   <img class="main" src="${p.image_url}" ondblclick="likePost(${p.id});blastHeart()">
   <div class="actions">
     <span onclick="likePost(${p.id})" style="color:${isLiked?'red':'#fff'}">${isLiked?'❤️':'🤍'}</span>
     <span onclick="document.getElementById('cmt-${p.id}').focus()">💬</span>
     <span onclick="sharePost('${p.image_url}')">✈️</span>
   </div>
   <div style="padding:0 12px"><b>${p.lCount} likes</b> ${p.score>10?'<span style="background:#ff3040;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:6px">TRENDING</span>':''}<br><b>@${p.username}</b> ${p.caption||''}</div>
   <div style="padding:5px 12px;font-size:13px;color:#aaa">${pCmts.map(c=>`<div><b>${c.username}</b> ${c.comment}</div>`).join('')}</div>
   <div class="cmtBox"><input id="cmt-${p.id}" placeholder="Add a comment..."><button onclick="addComment(${p.id})" style="background:none;border:0;color:#0095f6;font-weight:bold;cursor:pointer">Post</button></div>
  </div>`
 }
 document.getElementById('feed').innerHTML=html
}

async function likePost(id){
 const {data}=await supa.from('likes').select('*').eq('post_id',id).eq('username',ME)
 if(data && data.length>0){ await supa.from('likes').delete().eq('post_id',id).eq('username',ME) } else { await supa.from('likes').insert({post_id:id,username:ME}); blastHeart() }
 loadPosts()
}
async function addComment(id){
 const inp=document.getElementById('cmt-'+id); const txt=inp.value.trim(); if(!txt)return
 await supa.from('comments').insert({post_id:id,username:ME,comment:txt}); inp.value=''; loadPosts()
}
function sharePost(url){ if(navigator.share){navigator.share({title:'Pixoro',text:'Check this on Pixoro 🔵',url:location.href})} else {prompt('Share this link da Giri! Copy pannu 👇',location.href)} }
async function followUser(name){ if(name==ME)return alert('Nee unna follow panna mudiyathu da 😅'); const {data}=await supa.from('follows').select('*').eq('follower',ME).eq('following',name); if(data && data.length>0){await supa.from('follows').delete().eq('follower',ME).eq('following',name);alert('Unfollowed @'+name)} else {await supa.from('follows').insert({follower:ME,following:name});alert('Following @'+name+' ✅🔵')} loadPosts() }

loadStories();loadPosts();
</script></body></html>
