<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f5ff;
  color:#222;
  padding-bottom:75px;
}

button{
  border:0;
  cursor:pointer;
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:13px;
  padding:13px;
  font-size:15px;
  outline:none;
  margin-top:8px;
  background:#fff;
}

textarea{
  height:100px;
  resize:none;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.authbox{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:25px;
  border-radius:24px;
  box-shadow:0 8px 30px #0002;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  color:#635bff;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:22px;
}

.authbox h2{
  margin-bottom:8px;
}

.primary{
  width:100%;
  background:#635bff;
  color:#fff;
  padding:14px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
  margin-top:13px;
}

.switch{
  text-align:center;
  color:#635bff;
  margin-top:17px;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:12px;
  color:#555;
  font-size:14px;
}

/* APP */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:62px;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 2px 12px #0001;
}

.toplogo{
  color:#635bff;
  font-size:25px;
  font-weight:bold;
}

.page{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.heading{
  font-size:24px;
  font-weight:bold;
  margin-bottom:14px;
}

/* CREATE */

.card{
  background:#fff;
  border-radius:19px;
  padding:16px;
  box-shadow:0 3px 16px #0001;
  margin-bottom:15px;
}

.preview{
  width:100%;
  max-height:550px;
  object-fit:contain;
  border-radius:15px;
  margin-top:12px;
  background:#eee;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:5px;
}

.filter{
  white-space:nowrap;
  padding:9px 12px;
  border-radius:10px;
  background:#eee;
}

.filter.active{
  background:#635bff;
  color:#fff;
}

/* POST */

.post{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 3px 16px #0001;
}

.posthead{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#635bff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.userinfo{
  flex:1;
}

.username{
  font-weight:bold;
}

.time{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.deletebtn{
  background:#ffe7e7;
  color:#d00;
  padding:8px 10px;
  border-radius:9px;
}

.postimage{
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#eee;
  display:block;
}

.caption{
  padding:12px 14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  padding:7px;
  gap:3px;
}

.action{
  flex:1;
  padding:10px 3px;
  background:#fff;
  border-radius:10px;
  font-size:14px;
}

.action:hover{
  background:#f3f3f3;
}

.liked{
  color:#e53935;
}

.saved{
  color:#635bff;
}

.comments{
  padding:0 13px 8px;
}

.comment{
  background:#f1f2f6;
  border-radius:10px;
  padding:8px 10px;
  margin-top:5px;
  font-size:14px;
}

.commentbox{
  display:flex;
  gap:7px;
  padding:6px 13px 13px;
}

.commentbox input{
  margin:0;
}

.commentbox button{
  padding:10px 13px;
  border-radius:10px;
  background:#635bff;
  color:#fff;
}

.empty{
  text-align:center;
  color:#888;
  padding:35px 15px;
}

/* SEARCH */

.userrow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.userinfo2{
  flex:1;
}

.followbtn{
  background:#635bff;
  color:#fff;
  padding:9px 13px;
  border-radius:10px;
}

.following{
  background:#eee;
  color:#222;
}

/* PROFILE */

.profile{
  text-align:center;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 3px 16px #0001;
}

.bigavatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#635bff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
  margin:auto;
}

.profile h2{
  margin-top:12px;
}

.profile p{
  color:#777;
  margin-top:4px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:40px;
  margin:20px 0;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  font-size:12px;
  color:#777;
}

/* NAV */

.bottomnav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#fff;
  box-shadow:0 -3px 15px #0002;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav{
  background:#fff;
  color:#666;
  padding:6px 12px;
  font-size:11px;
}

.nav span{
  display:block;
  font-size:23px;
  margin-bottom:2px;
}

.nav.active{
  color:#635bff;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<div class="authbox">

<div class="logo">PIXORO</div>

<div class="subtitle">
Share your world 🌎
</div>

<!-- LOGIN -->

<h2>Login</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

class="primary"
id="loginBtn">
Login

<div
class="switch"
id="openSignup">

<!-- SIGNUP -->

<div id="signupBox" class="hidden">

<h2>Create Account</h2>

<input
id="signupName"
placeholder="Full name"
>

<input
id="signupUsername"
placeholder="Username"

<input
id="signupEmail"

>

Post

<script type="module">

/* =====================================================
   FIREBASE
   ===================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
setDoc,
addDoc,
updateDoc,
deleteDoc,
query,
where,
orderBy,
onSnapshot,
arrayUnion,
arrayRemove,
increment,
serverTimestamp,
writeBatch
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL,
deleteObject
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


/* =====================================================
   🔥 FIREBASE CONFIG
   =====================================================

   Replace these values with your Firebase Web App
   config.
*/

const firebaseConfig = {

apiKey:
"PASTE_YOUR_API_KEY",

authDomain:
"PASTE_YOUR_PROJECT.firebaseapp.com",

projectId:
"PASTE_YOUR_PROJECT_ID",

storageBucket:
"PASTE_YOUR_PROJECT.firebasestorage.app",

messagingSenderId:
"PASTE_YOUR_MESSAGING_SENDER_ID",

appId:
"PASTE_YOUR_APP_ID"

};


/* =====================================================
   INITIALIZE
   ===================================================== */

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);

const storage =
getStorage(firebaseApp);


/* =====================================================
   VARIABLES
   ===================================================== */

let currentUser=null;

let currentUserData=null;

let currentFilter="none";

let unsubscribePosts=null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const authPage=
document.getElementById("authPage");

const app=
document.getElementById("app");

const loginBox=
document.getElementById("loginBox");

const signupBox=
document.getElementById("signupBox");

const authMessage=
document.getElementById("authMessage");


/* =====================================================
   LOGIN / SIGNUP SWITCH
   ===================================================== */

document.getElementById("openSignup").onclick=()=>{

loginBox.classList.add("hidden");

signupBox.classList.remove("hidden");

authMessage.innerText="";

};

document.getElementById("openLogin").onclick=()=>{

signupBox.classList.add("hidden");

loginBox.classList.remove("hidden");

authMessage.innerText="";

};


/* =====================================================
   CREATE ACCOUNT
   ===================================================== */

document.getElementById("signupBtn").onclick=
async()=>{

const name=
document.getElementById("signupName")
.value.trim();

const username=
document.getElementById("signupUsername")
.value
.trim()
.toLowerCase()
.replace(/[^a-z0-9_]/g,"");

const email=
document.getElementById("signupEmail")
.value.trim();

const password=
document.getElementById("signupPassword")
.value;


if(!name||
!username||
!email||
!password){

authMessage.innerText=
"Please fill all fields.";

return;

}


if(username.length<3){

authMessage.innerText=
"Username needs 3+ characters.";

return;

}


if(password.length<6){

authMessage.innerText=
"Password needs 6+ characters.";

return;

}


try{

authMessage.innerText=
"Checking username...";


const usernameQuery=
query(
collection(db,"users"),
where("username","==",username)
);

const usernameResult=
await getDocs(usernameQuery);


if(!usernameResult.empty){

authMessage.innerText=
"Username already taken.";

return;

}


authMessage.innerText=
"Creating account...";


const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(db,"users",result.user.uid),
{

uid:result.user.uid,

name:name,

username:username,

email:email,

followers:[],

following:[],

createdAt:serverTimestamp()

}
);


authMessage.innerText=
"Account created successfully!";


}catch(error){

console.error(error);

authMessage.innerText=
firebaseError(error);

}

};


/* =====================================================
   LOGIN
   ===================================================== */

document.getElementById("loginBtn").onclick=
async()=>{

const email=
document.getElementById("loginEmail")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;


if(!email||!password){

authMessage.innerText=
"Enter email and password.";

return;

}


try{

authMessage.innerText=
"Logging in...";

await signInWithEmailAndPassword(
auth,
email,
password
);


}catch(error){

console.error(error);

authMessage.innerText=
firebaseError(error);

}

};


/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(
auth,
async(user)=>{

if(user){

currentUser=user;

await loadCurrentUser();

authPage.classList.add("hidden");

app.classList.remove("hidden");

loadPublicPosts();

loadProfile();

}else{

currentUser=null;

currentUserData=null;

authPage.classList.remove("hidden");

app.classList.add("hidden");

}

});


/* =====================================================
   LOAD CURRENT USER
   ===================================================== */

async function loadCurrentUser(){

if(!currentUser)return;

const snap=
await getDoc(
doc(db,"users",currentUser.uid)
);


if(snap.exists()){

currentUserData=snap.data();

}

}


/* =====================================================
   IMAGE PREVIEW
   ===================================================== */

document.getElementById("photoInput")
.addEventListener(
"change",
event=>{

const file=
event.target.files[0];

if(!file)return;


const reader=
new FileReader();


reader.onload=
e=>{

const preview=
document.getElementById("preview");

preview.src=e.target.result;

preview.style.filter=
currentFilter;

preview.classList.remove("hidden");

};


reader.readAsDataURL(file);

}
);


/* =====================================================
   FILTER BUTTONS
   ===================================================== */

document.querySelectorAll(".filter")
.forEach(button=>{

button.onclick=()=>{

document.querySelectorAll(".filter")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

currentFilter=
button.dataset.filter;

document.getElementById("preview")
.style.filter=
currentFilter;

};

});


/* =====================================================
   PROCESS IMAGE
   ===================================================== */

function processImage(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
e=>{

const img=
new Image();

img.onload=
()=>{

const maxWidth=1200;

let width=img.width;

let height=img.height;


if(width>maxWidth){

height=
Math.round(
height*maxWidth/width
);

width=maxWidth;

}


const canvas=
document.createElement("canvas");

canvas.width=width;

canvas.height=height;


const ctx=
canvas.getContext("2d");


ctx.filter=
currentFilter==="none"
?"none"
:currentFilter;


ctx.drawImage(
img,
0,
0,
width,
height
);


canvas.toBlob(
blob=>{

if(blob){

resolve(blob);

}else{

reject(
new Error("Image processing failed")
);

}

},
"image/jpeg",
0.82
);

};


img.onerror=reject;

img.src=e.target.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =====================================================
   PUBLISH POST
   ===================================================== */

document.getElementById("publishBtn")
.onclick=
async()=>{

if(!currentUser){

alert("Please login.");

return;

}


const file=
document.getElementById("photoInput")
.files[0];

const caption=
document.getElementById("caption")
.value.trim();


if(!file){

alert("Please choose a photo.");

return;

}


try{

const message=
document.getElementById("postMessage");

message.innerText=
"Processing photo...";


const blob=
await processImage(file);


message.innerText=
"Uploading photo...";


const fileName=
Date.now()+"_"+Math.random()
.toString(36)
.substring(2)+".jpg";


const storagePath=
"posts/"
+currentUser.uid+
"/"+
fileName;


const imageRef=
ref(storage,storagePath);


await uploadBytes(
imageRef,
blob,
{
contentType:"image/jpeg"
}
);


const imageURL=
await getDownloadURL(imageRef);


message.innerText=
"Publishing...";


await addDoc(
collection(db,"posts"),
{

uid:currentUser.uid,

username:
currentUserData?.username||
"user",

name:
currentUserData?.name||
"PIXORO User",

caption:caption,

imageURL:imageURL,

storagePath:storagePath,

likes:[],

saves:[],

comments:[],

views:0,

createdAt:
serverTimestamp()

}
);


document.getElementById("caption")
.value="";

document.getElementById("photoInput")
.value="";

document.getElementById("preview")
.classList.add("hidden");


currentFilter="none";

document.querySelectorAll(".filter")
.forEach(
(x,i)=>
x.classList.toggle("active",i===0)
);


message.innerText=
"✅ Post published!";


showPage("home");


}catch(error){

console.error(error);

document.getElementById("postMessage")
.innerText=
firebaseError(error);

}

};


/* =====================================================
   PUBLIC FEED
   ===================================================== */

function loadPublicPosts(){

const feed=
document.getElementById("feed");


const postsQuery=
query(
collection(db,"posts"),
orderBy("createdAt","desc")
);


if(unsubscribePosts){

unsubscribePosts();

}


unsubscribePosts=
onSnapshot(
postsQuery,

snapshot=>{

if(snapshot.empty){

feed.innerHTML=
`
<div class="card empty">
No public posts yet 📷
</div>
`;

return;

}


feed.innerHTML="";


snapshot.forEach(
snap=>{

const post={
id:snap.id,
...snap.data()
};

feed.insertAdjacentHTML(
"beforeend",
createPostHTML(post)
);

});

},

error=>{

console.error(error);

feed.innerHTML=
`
<div class="card empty">
Could not load posts.<br>
Check Firestore rules.
</div>
`;

}

);

}


/* =====================================================
   CREATE POST HTML
   ===================================================== */

function createPostHTML(post){

const likes=
post.likes||[];

const saves=
post.saves||[];

const comments=
post.comments||[];


const liked=
currentUser&&
likes.includes(currentUser.uid);

const saved=
currentUser&&
saves.includes(currentUser.uid);


const own=
currentUser&&
post.uid===currentUser.uid;


let date="Just now";


if(post.createdAt?.toDate){

date=
post.createdAt
.toDate()
.toLocaleString();

}


let commentsHTML="";


comments.slice(-5)
.forEach(comment=>{

commentsHTML+=
`
<div class="comment">
<b>
@${escapeHTML(comment.username||"user")}
</b>
${escapeHTML(comment.text||"")}
</div>
`;

});


const letter=
(post.name||
post.username||
"P")
.charAt(0)
.toUpperCase();


return`

<div class="post">

<div class="posthead">

<div class="avatar">
${escapeHTML(letter)}
</div>

<div class="userinfo">

<div class="username">
@${escapeHTML(
post.username||"user"
)}
</div>

<div class="time">
${escapeHTML(date)}
</div>

</div>

${
own
?
`
<button
class="deletebtn"
onclick=
"window.deletePost('${post.id}')">
Delete
</button>
`
:
""
}

</div>


<img
class="postimage"
src="${post.imageURL}"
loading="lazy"
onclick=
"window.viewPost('${post.id}')"
>


${
post.caption
?
`
<div class="caption">
${escapeHTML(post.caption)}
</div>
`
:
""
}


<div class="actions">

<button
class=
"action ${liked?"liked":""}"
onclick=
"window.likePost(
'${post.id}',
${liked}
)">

/* =====================================================
   DELETE POST
   ===================================================== */

window.deletePost=
async id=>{

if(!currentUser)return;


const yes=
confirm(
"Are you sure you want to delete this post?"
);


if(!yes)return;


try{

const postRef=
doc(db,"posts",id);

const snap=
await getDoc(postRef);


if(!snap.exists())return;


const post=snap.data();


if(post.uid!==currentUser.uid){

alert(
"You can delete only your own post."
);

return;

}


/* Delete image from Storage */

if(post.storagePath){

try{

await deleteObject(
ref(storage,post.storagePath)
);

}catch(e){

console.log(
"Storage image already missing."
);

}

}


/* Delete Firestore post */

await deleteDoc(postRef);


loadProfile();


}catch(error){

alert(firebaseError(error));

}

};


/* =====================================================
   SEARCH USERS
   ===================================================== */

document.getElementById("searchInput")
.addEventListener(
"input",
searchUsers
);


async function searchUsers(){

const text=
document.getElementById("searchInput")
.value
.trim()
.toLowerCase();


const resultBox=
document.getElementById(
"searchResults"
);


if(!text){

resultBox.innerText=
"Search for a username or name.";

return;

}


try{

const snap=
await getDocs(
collection(db,"users")
);


let html="";


snap.forEach(
docSnap=>{

const u=docSnap.data();


if(
currentUser&&
u.uid===currentUser.uid
){

return;

}


const name=
(u.name||"")
.toLowerCase();

const username=
(u.username||"")
.toLowerCase();


if(
name.includes(text)||
username.includes(text)
){

const followers=
u.followers||[];

const isFollowing=
currentUser&&
followers.includes(
currentUser.uid
);


html+=`

<div class="userrow">

<div class="avatar">
${escapeHTML(
(u.name||"P")
.charAt(0)
.toUpperCase()
)}
</div>

<div class="userinfo2">

<b>
${escapeHTML(
u.name||"PIXORO User"
)}
</b>

<div>
@${escapeHTML(
u.username||"user"
)}
</div>

<small>
${followers.length}
followers
</small>

</div>

<button
class=
"followbtn ${isFollowing?"following":""}"
onclick=
"window.followUser(
'${u.uid}',
${isFollowing}
)">

${
isFollowing
?
"Following"
:
"Follow"
}

</button>

</div>

`;

}

});


resultBox.innerHTML=
html||"No users found.";


}catch(error){

resultBox.innerText=
firebaseError(error);

}

}


/* =====================================================
   FOLLOW / UNFOLLOW
   ===================================================== */

window.followUser=
async(targetUid,isFollowing)=>{

if(!currentUser)return;


try{

const meRef=
doc(db,"users",currentUser.uid);

const targetRef=
doc(db,"users",targetUid);


const batch=
writeBatch(db);


if(isFollowing){

batch.update(
meRef,
{

following:
arrayRemove(targetUid)

}
);


batch.update(
targetRef,
{

followers:
arrayRemove(currentUser.uid)

}
);

}else{

batch.update(
meRef,
{

following:
arrayUnion(targetUid)

}
);


batch.update(
targetRef,
{

followers:
arrayUnion(currentUser.uid)

}
);

}


await batch.commit();


await loadCurrentUser();

await searchUsers();

await loadProfile();


}catch(error){

alert(firebaseError(error));

}

};


/* =====================================================
   PROFILE
   ===================================================== */

async function loadProfile(){

if(!currentUser)return;


await loadCurrentUser();


const u=
currentUserData||{};


document.getElementById(
"myName"
).innerText=
u.name||
"PIXORO User";


document.getElementById(
"myUsername"
).innerText=
"@"+
(u.username||"user");


document.getElementById(
"myAvatar"
).innerText=
(u.name||"P")
.charAt(0)
.toUpperCase();


document.getElementById(
"myFollowers"
).innerText=
(u.followers||[]).length;


document.getElementById(
"myFollowing"
).innerText=
(u.following||[]).length;


try{

const postsQuery=
query(
collection(db,"posts"),
where("uid","==",currentUser.uid)
);


const snap=
await getDocs(postsQuery);


document.getElementById(
"myPostsCount"
).innerText=
snap.size;


const box=
document.getElementById(
"myPosts"
);

box.innerHTML="";


const posts=[];


snap.forEach(
s=>{

posts.push({

id:s.id,
...s.data()

});

});


posts.sort(
(a,b)=>{

const aTime=
a.createdAt?.toMillis
?
a.createdAt.toMillis()
:
0;

const bTime=
b.createdAt?.toMillis
?
b.createdAt.toMillis()
:
0;

return bTime-aTime;

}
);


if(posts.length===0){

box.innerHTML=
`
<div class="card empty">
You haven't posted anything yet 📷
</div>
`;

return;

}


posts.forEach(
post=>{

box.insertAdjacentHTML(
"beforeend",
createPostHTML(post)
);

});

}catch(error){

console.error(error);

}

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   FIREBASE ERROR
   ===================================================== */

function firebaseError(error){

const code=
error?.code||"";


if(
code.includes("invalid-credential")||
code.includes("wrong-password")
){

return "Wrong email or password.";

}


if(
code.includes("email-already-in-use")
){

return "This email is already registered.";

}


if(
code.includes("invalid-email")
){

return "Invalid email address.";

}


if(
code.includes("weak-password")
){

return "Password must contain at least 6 characters.";

}


if(
code.includes("permission-denied")
){

return "Permission denied. Check Firebase Rules.";

}


if(
code.includes("storage/unauthorized")
){

return "Storage permission denied. Check Storage Rules.";

}


if(
code.includes("storage/quota-exceeded")
){

return "Storage limit exceeded.";

}


if(
code.includes("network-request-failed")
){

return "Internet connection problem.";

}


if(
code.includes("api-key-not-valid")
){

return "Firebase API key is invalid.";

}


return error?.message||
"Something went wrong.";

}
