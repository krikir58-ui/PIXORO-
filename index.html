<!-- ==================================================

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ==================================================
SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
"https://yecpltndhlzfjplzhcpm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==================================================
VARIABLES
================================================== */

let currentUser = null;

let currentProfile = null;

let currentFilter = "none";

let feedPosts = [];


/* ==================================================
ELEMENTS
================================================== */

const authPage =
document.getElementById("authPage");

const app =
document.getElementById("app");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");

const authMessage =
document.getElementById("authMessage");


/* ==================================================
AUTH SWITCH
================================================== */

document
.getElementById("openSignup")
.onclick = () => {

loginBox
.classList
.add("hidden");

signupBox
.classList
.remove("hidden");

authMessage.innerText = "";

};


document
.getElementById("openLogin")
.onclick = () => {

signupBox
.classList
.add("hidden");

loginBox
.classList
.remove("hidden");

authMessage.innerText = "";

};


/* ==================================================
CREATE ACCOUNT
================================================== */

document
.getElementById("signupBtn")
.onclick =
async () => {

const name =
document
.getElementById("signupName")
.value
.trim();

const username =
document
.getElementById("signupUsername")
.value
.trim()
.toLowerCase()
.replace(/[^a-z0-9_]/g,"");

const email =
document
.getElementById("signupEmail")
.value
.trim();

const password =
document
.getElementById("signupPassword")
.value;


if(
!name ||
!username ||
!email ||
!password
){

authMessage.innerText =
"Please fill all fields.";

return;

}


if(username.length < 3){

authMessage.innerText =
"Username needs 3+ characters.";

return;

}


if(password.length < 6){

authMessage.innerText =
"Password needs 6+ characters.";

return;

}


try{

authMessage.innerText =
"Checking username...";


const {
data:existing,
error:existingError
} =
await supabase
.from("profiles")
.select("id")
.eq("username",username)
.limit(1);


if(existingError)
throw existingError;


if(existing && existing.length){

authMessage.innerText =
"Username already taken.";

return;

}


authMessage.innerText =
"Creating account...";


const {
data,
error
} =
await supabase.auth.signUp({

email:email,

password:password,

options:{
data:{
username:username,
display_name:name
}
}

});


if(error)
throw error;


if(!data.user){

authMessage.innerText =
"Account created. Please check your email.";

return;

}


/*
Update profile created by trigger
*/

const {
error:profileError
} =
await supabase
.from("profiles")
.upsert({

id:data.user.id,

username:username,

display_name:name

},{
onConflict:"id"
});


if(profileError){

console.log(profileError);

}


authMessage.innerText =
"Account created successfully!";


}catch(error){

console.error(error);

authMessage.innerText =
supabaseError(error);

}

};


/* ==================================================
LOGIN
================================================== */

document
.getElementById("loginBtn")
.onclick =
async () => {

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

authMessage.innerText =
"Enter email and password.";

return;

}


try{

authMessage.innerText =
"Logging in...";


const {
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error)
throw error;


}catch(error){

console.error(error);

authMessage.innerText =
supabaseError(error);

}

};


/* ==================================================
AUTH STATE
================================================== */

const {
data:authListener
} =
supabase.auth
.onAuthStateChange(
async(event,session)=>{

if(session){

currentUser =
session.user;

await loadCurrentProfile();

showApp();

}else{

currentUser = null;

currentProfile = null;

showAuth();

}

}
);


/* ==================================================
CHECK EXISTING SESSION
================================================== */

const {
data:sessionData
} =
await supabase.auth.getSession();


if(sessionData.session){

currentUser =
sessionData.session.user;

await loadCurrentProfile();

showApp();

}


/* ==================================================
SHOW APP
================================================== */

function showApp(){

authPage
.classList
.add("hidden");

app
.classList
.remove("hidden");

loadPublicPosts();

loadProfile();

}


/* ==================================================
SHOW AUTH
================================================== */

function showAuth(){

.classList

}


/* ==================================================
LOAD PROFILE
================================================== */

async function loadCurrentProfile(){

if(!currentUser)
return;


const {
data,
error
} =
await supabase
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();


if(error){

console.error(error);

currentProfile = {

id:currentUser.id,

username:
currentUser.email
?.split("@")[0]
||
"user",

display_name:
"PIXORO User"

};

return;

}


currentProfile = data;

}


/* ==================================================
IMAGE PREVIEW
================================================== */

document
.getElementById("photoInput")
.addEventListener(
"change",
event=>{

const file =
event.target.files[0];

if(!file)
return;


const reader =
new FileReader();


reader.onload =
e=>{

const preview =
document
.getElementById("preview");

preview.src =
e.target.result;

preview.style.filter =
currentFilter;

preview
.classList
.remove("hidden");

};


reader.readAsDataURL(file);

}
);


/* ==================================================
FILTERS
================================================== */

document
.querySelectorAll(".filter")
.forEach(button=>{

button.onclick = () => {

document
.querySelectorAll(".filter")
.forEach(x=>
x.classList.remove("active")
);


button
.classList
.add("active");


currentFilter =
button.dataset.filter;


document
.getElementById("preview")
.style.filter =
currentFilter;

};

});


/* ==================================================
PROCESS IMAGE
================================================== */

function processImage(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();


reader.onload =
e=>{

const img =
new Image();


img.onload =
()=>{

const maxWidth = 1200;

let width =
img.width;

let height =
img.height;


if(width > maxWidth){

height =
Math.round(
height * maxWidth / width
);

width =
maxWidth;

}


const canvas =
document.createElement("canvas");

canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext("2d");


ctx.filter =
currentFilter === "none"
?
"none"
:
currentFilter;


ctx.drawImage(
img,
0,
0,
width,
height
);


canvas.toBlob(
blob=>{

if(blob){

resolve(blob);

}else{

reject(
new Error(
"Image processing failed"
)
);

}

},
"image/jpeg",
0.82
);

};


img.onerror =
reject;

img.src =
e.target.result;

};


reader.onerror =
reject;

reader.readAsDataURL(file);

});

}


/* ==================================================
PUBLISH POST
================================================== */

document
.getElementById("publishBtn")
.onclick =
async()=>{

if(!currentUser){

alert("Please login.");

return;

}


const file =
document
.getElementById("photoInput")
.files[0];


const caption =
document
.getElementById("caption")
.value
.trim();


if(!file){

alert("Please choose a photo.");

return;

}


try{

const message =
document
.getElementById("postMessage");


message.innerText =
"Processing photo...";


const blob =
await processImage(file);


message.innerText =
"Uploading photo...";


const fileName =
Date.now()
+"_"
+
Math.random()
.toString(36)
.substring(2)
+
".jpg";


const storagePath =
currentUser.id
+
"/"
+
fileName;


/*
Upload to existing bucket:
Post-images
*/

const {
error:uploadError
} =
await supabase
.storage
.from("Post-images")
.upload(
storagePath,
blob,
{
contentType:"image/jpeg",
upsert:false
}
);


if(uploadError)
throw uploadError;


const {
data:publicData
} =
supabase
.storage
.from("Post-images")
.getPublicUrl(storagePath);


const imageURL =
publicData.publicUrl;


message.innerText =
"Publishing...";


const {
error:postError
} =
await supabase
.from("posts")
.insert({

user_id:
currentUser.id,

image_url:
imageURL,

caption:
caption

});


if(postError)
throw postError;


/* RESET */

document
.getElementById("caption")
.value = "";

document
.getElementById("photoInput")
.value = "";

document
.getElementById("preview")
.classList
.add("hidden");


currentFilter =
"none";


document
.querySelectorAll(".filter")
.forEach(
(x,i)=>
x.classList
.toggle("active",i===0)
);


message.innerText =
"✅ Post published!";


await loadPublicPosts();

showPage("home");


}catch(error){

console.error(error);

document
.getElementById("postMessage")
.innerText =
supabaseError(error);

}

};


/* ==================================================
LOAD PUBLIC POSTS
================================================== */

async function loadPublicPosts(){

const feed =
document
.getElementById("feed");


feed.innerHTML =
`
<div class="loading">
Loading posts...
</div>
`;


try{

const {
data:posts,
error
} =
await supabase
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error)
throw error;


if(!posts || !posts.length){

feed.innerHTML =
`
<div class="card empty">
No public posts yet 📷
</div>
`;

return;

}


feedPosts = posts;


feed.innerHTML = "";


for(const post of posts){

const html =
await createPostHTML(post);

feed.insertAdjacentHTML(
"beforeend",
html
);

}


}catch(error){

console.error(error);

feed.innerHTML =
`
<div class="card empty">
Could not load posts.<br>
${escapeHTML(
supabaseError(error)
)}
</div>
`;

}

}

{
ascending:true

"Just now";

/* USER */

const username =

name

/* OWN POST */

const own =
currentUser &&
post.user_id === currentUser.id;


/* COMMENTS HTML */

let commentsHTML = "";


comments
.slice(-5)
.forEach(comment=>{

commentsHTML +=
`

*/

/* ==================================================
DELETE POST
================================================== */

window.deletePost =
async postId=>{

if(!currentUser)
return;


const yes =
confirm(
"Are you sure you want to delete this post?"
);


if(!yes)
return;


try{

/* GET POST */

const {
data:post,
error:getError
} =
await supabase
.from("posts")
.select("*")
.eq("id",postId)
.single();


if(getError)
throw getError;


if(
post.user_id !==
currentUser.id
){

alert(
"You can delete only your own post."
);

return;

}


/* DELETE STORAGE IMAGE */

if(post.image_url){

try{

const url =
new URL(post.image_url);

const marker =
"/storage/v1/object/public/Post-images/";

const index =
url.pathname.indexOf(marker);


if(index !== -1){

const path =
decodeURIComponent(
url.pathname.substring(
index + marker.length
)
);


await supabase
.storage
.from("Post-images")
.remove([path]);

}

}catch(storageError){

console.log(
"Storage delete skipped:",
storageError
);

}

}


/* DELETE RELATED DATA */

await supabase
.from("likes")
.delete()
.eq(
"post_id",
postId
);


await supabase
.from("comments")
.delete()
.eq(
"post_id",
postId
);


await supabase
.from("saves")
.delete()
.eq(
"post_id",
postId
);


await supabase
.from("views")
.delete()
.eq(
"post_id",
postId
);


/* DELETE POST */

const {
error:deleteError
} =
await supabase
.from("posts")
.delete()
.eq(
"id",
postId
)
.eq(
"user_id",
currentUser.id
);


if(deleteError)
throw deleteError;


await loadPublicPosts();

await loadProfile();


}catch(error){

console.error(error);

alert(
supabaseError(error)
);

}

};


/* ==================================================
SEARCH USERS
================================================== */

document
.getElementById("searchInput")
.addEventListener(
"input",
searchUsers
);


async function searchUsers(){

const text =
document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();


const resultBox =
document
.getElementById(
"searchResults"
);


if(!text){

resultBox.innerText =
"Search for a username or name.";

return;

}


try{

const {
data:users,
error
} =
await supabase
.from("profiles")
.select("*")
.or(
`username.ilike.%${text}%,display_name.ilike.%${text}%`
)
.limit(30);


if(error)
throw error;


let html = "";


for(const u of users || []){


if(
currentUser &&
u.id === currentUser.id
){

continue;

}


/* FOLLOW STATUS */

const {
data:followData
} =
await supabase
.from("follows")
.select("id")
.eq(
"follower_id",
currentUser.id
)
.eq(
"following_id",
u.id
)
.limit(1);


const isFollowing =
followData &&
followData.length > 0;


/* FOLLOWER COUNT */

const {
count
} =
await supabase
.from("follows")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"following_id",
u.id
);


html +=
`

<div class="userrow">

<div class="avatar">

${escapeHTML(
(u.display_name||"P")
.charAt(0)
.toUpperCase()
)}

</div>


<div class="userinfo2">

<b>
${escapeHTML(
u.display_name ||
"PIXORO User"
)}
</b>

<div>
@${escapeHTML(
u.username ||
"user"
)}
</div>

<small>
${count || 0}
followers
</small>

</div>


<button
class=
"followbtn ${isFollowing?"following":""}"
onclick=
"window.followUser(
'${u.id}',
${isFollowing}
)"
>

${
isFollowing
?
"Following"
:
"Follow"
}

</button>

</div>

`;

}


resultBox.innerHTML =
html ||
"No users found.";


}catch(error){

console.error(error);

resultBox.innerText =
supabaseError(error);

}

}

FOLLOW / UNFOLLOW
================================================== */

window.followUser =
async(
targetUid,
isFollowing
)=>{

if(!currentUser)
return;


try{

if(isFollowing){

const {
error
} =
await supabase
.from("follows")
.delete()
.eq(
"follower_id",
currentUser.id
)
.eq(
"following_id",
targetUid
);


if(error)
throw error;


}else{

const {
error
} =
await supabase
.from("follows")
.insert({

follower_id:
currentUser.id,

following_id:
targetUid

});


if(error)
throw error;

}


await searchUsers();

await loadProfile();


}catch(error){

console.error(error);

alert(
supabaseError(error)
);

}

};

.innerText =

"P"

.charAt(0)
.toUpperCase();


/* FOLLOWERS */

const {

} =
await supabase
.from("follows")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"following_id",
currentUser.id
);

} =
await supabase

.select(

head:true

)

await supabase

);

return;

document
.getElementById("myPostsCount")
.innerText =
posts?.length || 0;

.getElementById("myFollowers")
.innerText =
followersCount || 0;


document
.getElementById("myFollowing")
.innerText =
followingCount || 0;


const box =
document
.getElementById("myPosts");


box.innerHTML = "";


if(!posts || !posts.length){

box.innerHTML =
`

You haven't posted anything yet 📷
</div>
`;

for(const post of posts){

await createPostHTML(post);

html
);

/* ==================================================
ESCAPE HTML
================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* ==================================================
SUPABASE ERROR
================================================== */

function supabaseError(error){

const message =
error?.message ||
"";


const code =
error?.code ||
"";


if(
message
.toLowerCase()
.includes("invalid login")
){

return "Wrong email or password.";

}


if(
message
.toLowerCase()
.includes("email not confirmed")
){

return "Please confirm your email first.";

}


if(
message
.toLowerCase()
.includes("already registered")
){

return "This email is already registered.";

}


if(
message
.toLowerCase()
.includes("password")
){

return message;

}


if(
code === "23505"
){

return "This username is already taken.";

}


if(
code === "42501"
){

return "Permission denied. Check Supabase RLS policies.";

}


if(
message
.toLowerCase()
.includes("row-level security")
){

return "Permission denied. Check Supabase RLS policies.";

}


if(
message
.toLowerCase()
.includes("bucket")
){

return "Storage error. Check the Post-images bucket and Storage policies.";

}


return message ||
"Something went wrong.";

}
