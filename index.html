<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V1 - Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;text-align:center}
h1{color:#FFD700;letter-spacing:5px;margin:20px 0 5px}
.sub{color:#00ff88;font-size:10px;letter-spacing:2px;margin-bottom:20px}
.box{background:#111;border:1px solid #333;padding:15px;border-radius:15px;margin-bottom:15px;text-align:left}
.box h3{color:#FFD700;margin:0 0 10px}
input{width:100%;padding:11px;margin-bottom:8px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.feed{display:none}
.post{background:#111;border:1px solid #333;padding:12px;border-radius:12px;margin:12px 0}
.pfp{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle;margin-right:8px}
.big-pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 10px}
</style>
</head>
<body>
<h1>PIXORO V1</h1><div class="sub">PROFILE PHOTO UPDATE DA GIRI</div>

<div id="authDiv">
<div class="box"><h3>Signup</h3><input id="su_user" placeholder="giri"><input id="su_pass" type="password" placeholder="Password"><button onclick="signupUser()">Signup</button></div>
<div class="box"><h3>Login</h3><input id="li_user" placeholder="giri"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div>
</div>

<div id="feedDiv" class="feed">
<div class="box" style="text-align:center">
<img id="myPfp" class="big-pfp" src="https://via.placeholder.com/90/111/FFD700?text=GIRI" onerror="this.src='https://via.placeholder.com/90'">
<h3 style="text-align:center">Welcome <span id="uName"></span> 👑</h3>
<input type="file" id="pfpFile" accept="image/*" style="font-size:12px">
<button onclick="uploadPfp()" style="background:#00ff88;margin-top:8px">Profile Photo Change Pannu Da 📸</button>
<button onclick="logoutUser()" style="background:#222;color:#ff4444;margin-top:8px;border:1px solid #444">Logout</button>
</div>

<div class="box">
<h3>Photo Upload 📸</h3>
<input type="file" id="imgFile" accept="image/*" onchange="previewImage()">
<img id="preview" style="width:100%;border-radius:10px;display:none;margin:10px 0;max-height:300px;object-fit:cover">
<input id="cap" placeholder="Caption">
<button onclick="createPost()">Post Podu Da 🔥</button>
</div>
<div id="posts"></div>
</div>

<script>
const SUPABASE_URL = "https://yecpltndhlzfjplzhcpm.supabase.co";
const SUPABASE_KEY = "sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedFile=null;
function previewImage(){
 let file=document.getElementById('imgFile').files[0];
 if(!file) return; selectedFile=file;
 let r=new FileReader(); r.onload=e=>{document.getElementById('preview').src=e.target.result; document.getElementById('preview').style.display='block';}; r.readAsDataURL(file);
}
async function signupUser(){
 let u=document.getElementById('su_user').value.trim().toLowerCase();
 let p=document.getElementById('su_pass').value.trim();
 if(!u||!p) return alert("Username Password podu");
 let {error}=await sb.from('users').insert([{username:u,password:p}]);
 if(error&&!error.message.includes('duplicate')) return alert(error.message);
 localStorage.setItem('pix_user',u); location.reload();
}
async function loginUser(){
 let u=document.getElementById('li_user').value.trim().toLowerCase();
 let {error}=await sb.from('users').select('*').eq('username',u).single();
 if(error) return alert("User illa");
 localStorage.setItem('pix_user',u); location.reload();
}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){
 let u=localStorage.getItem('pix_user'); if(!u) return;
 document.getElementById('authDiv').style.display='none';
 document.getElementById('feedDiv').style.display='block';
 document.getElementById('uName').innerText=u;
 loadMyPfp(u); loadPosts();
}
async function loadMyPfp(username){
 let {data}=await sb.from('users').select('profile_pic').eq('username',username).single();
 if(data && data.profile_pic){ document.getElementById('myPfp').src=data.profile_pic; }
}
async function uploadPfp(){
 let file=document.getElementById('pfpFile').files[0];
 let u=localStorage.getItem('pix_user');
 if(!file) return alert("Gallery la irunthu DP select pannu da!");
 alert("DP Uploading da... ⏳");
 let fname="pfp_"+u+"_"+Date.now()+"_"+file.name;
 let {error}=await sb.storage.from('profile-pics').upload(fname,file,{upsert:true});
 if(error) return alert(error.message);
 let {data}=sb.storage.from('profile-pics').getPublicUrl(fname);
 await sb.from('users').update({profile_pic:data.publicUrl}).eq('username',u);
 document.getElementById('myPfp').src=data.publicUrl;
 alert("DP Change OK da Giri! 👑🔥");
}
async function createPost(){
 let cap=document.getElementById('cap').value.trim();
 let u=localStorage.getItem('pix_user');
 if(!selectedFile) return alert("Photo select pannu");
 alert("Uploading da... ⏳");
 let fname=Date.now()+"_"+selectedFile.name;
 let {error}=await sb.storage.from('post-images').upload(fname,selectedFile);
 if(error) return alert(error.message);
 let {data}=sb.storage.from('post-images').getPublicUrl(fname);
 await sb.from('posts').insert([{username:u,image_url:data.publicUrl,caption:cap}]);
 alert("Post OK da!");
 document.getElementById('cap').value=""; document.getElementById('imgFile').value=""; document.getElementById('preview').style.display='none'; selectedFile=null;
 loadPosts();
}
async function loadPosts(){
 let {data: posts}=await sb.from('posts').select('*').order('id',{ascending:false});
 let {data: users}=await sb.from('users').select('username,profile_pic');
 let userMap={}; (users||[]).forEach(x=>userMap[x.username]=x.profile_pic);
 let h=''; (posts||[]).forEach(p=>{
  let pfp=userMap[p.username]||'https://via.placeholder.com/40/111/FFD700?text='+p.username[0];
  h+=`<div class="post"><img class="pfp" src="${pfp}"><b>@${p.username}</b><br><br><img src="${p.image_url}" style="width:100%;border-radius:10px"><p>${p.caption||''}</p></div>`;
 });
 document.getElementById('posts').innerHTML=h;
}
checkUser();
</script>
</body>
</html>
