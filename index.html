<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO - PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI}body{background:#000;color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;border:1px solid #262626;padding:24px;text-align:center}
.logo{font-family:'Grand Hotel',cursive;font-size:52px}
input,textarea{width:100%;padding:11px;background:#121212;border:1px solid #333;border-radius:6px;color:#fff;margin:5px 0;outline:none}
.btn{width:100%;background:#0095f6;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
.link{color:#0095f6;font-size:13px;font-weight:600;cursor:pointer}
.err{background:#2a0a0a;border:1px solid #ff3040;color:#ff8a8a;padding:10px;border-radius:6px;margin:8px 0;font-size:12px;display:none}
.ok{background:#0a2a0a;border:1px solid #00ff88;color:#88ffaa;padding:10px;border-radius:6px;margin:8px 0;font-size:12px;display:none}
.header{height:60px;padding:0 14px;position:fixed;top:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);z-index:100;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.page{margin:auto;max-width:500px;padding-top:60px;padding-bottom:70px}
.bottom{position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#000;height:56px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;z-index:100}
.bottom button{background:none;border:none;color:#888;font-size:22px;cursor:pointer}.bottom button.active{color:#fff}
.profile-top{padding:20px 14px;display:flex;gap:18px;align-items:center}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#222;border:1px solid #333}
.stat{flex:1;display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:#888}
.toggle{width:44px;height:24px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:.2s}.toggle.on{background:#0095f6}.toggle i{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}.toggle.on i{left:23px}
.user-row{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111}
.user-row img{width:36px;height:36px;border-radius:50%}
.followBtn{padding:6px 14px;border-radius:8px;font-weight:700;font-size:12px;border:none;cursor:pointer}.followBtn.follow{background:#0095f6;color:#fff}.followBtn.unfollow{background:#222;color:#fff;border:1px solid #333}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authBox" class="login-wrap">
<div class="login-card">
<div class="logo">Pixoro</div>
<p style="color:#666;font-size:11px;margin-bottom:14px;">TIRUCHULI TO WORLD 🌍 - PRO</p>
<div id="errBox" class="err"></div><div id="okBox" class="ok"></div>
<div id="loginForm">
<input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password">
<button class="btn" id="mainBtn" onclick="login()">Log in</button>
<p style="margin-top:12px;font-size:13px;color:#888;">No account? <span class="link" onclick="toggleAuth()">Sign up - Real Safe</span></p>
</div>
<div id="signupForm" style="display:none;">
<input id="semail" placeholder="Email"><input id="spass" type="password" placeholder="Password 6+ chars"><input id="sname" placeholder="Username (unique) ex: giri_tiru">
<button class="btn" onclick="signup()">Create Account - Safe</button>
<p style="margin-top:12px;font-size:13px;color:#888;">Have account? <span class="link" onclick="toggleAuth()">Log in</span></p>
</div>
</div>
</div>

<!-- MAIN -->
<div id="mainBox" style="display:none;">
<div class="header"><div class="logo" style="font-size:32px;">Pixoro</div><div style="display:flex;gap:14px;align-items:center;"><span id="topUser" style="font-size:12px;color:#888;"></span><span onclick="logout()" style="cursor:pointer;font-size:12px;">Logout</span></div></div>

<!-- FEED -->
<div id="feedPage" class="page">
<p style="text-align:center;color:#666;margin-top:80px;">Feed coming... Profile check pannu da 👇</p>
</div>

<!-- SEARCH / FOLLOW -->
<div id="searchPage" class="page" style="display:none;">
<div style="padding:12px;"><input id="searchInput" placeholder="Search username..." oninput="searchUser()"></div>
<div id="searchResult"></div>
</div>

<!-- PROFILE -->
<div id="profilePage" class="page" style="display:none;">
<div class="profile-top">
<img id="pAvatar" class="avatar" src="https://i.pravatar.cc/150?u=default">
<div class="stat">
<div><b id="pPosts">0</b><span>Posts</span></div>
<div><b id="pFollowers">0</b><span>Followers</span></div>
<div><b id="pFollowing">0</b><span>Following</span></div>
</div>
</div>
<div style="padding:0 14px;">
<b id="pUsername">@giri</b>
<p id="pBio" style="font-size:13px;color:#ccc;margin-top:4px;">Tiruchuli to World 🌍</p>
<button class="btn" style="background:#222;border:1px solid #333;margin-top:12px;" onclick="openEdit()">Edit Profile - Photo, Bio</button>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:10px;border:1px solid #222;border-radius:8px;">
<div><b style="font-size:13px;">Private Account</b><br><small style="color:#888;font-size:11px;">Only followers can see</small></div>
<div class="toggle" id="privateToggle" onclick="togglePrivate()"><i></i></div>
</div>
</div>
</div>

<!-- EDIT PROFILE MODAL -->
<div id="editBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;">
<div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #222;"><button onclick="editBox.style.display='none'" style="background:none;border:none;color:#fff;">✕</button><b>Edit Profile</b><button onclick="saveEdit()" style="background:none;border:none;color:#0095f6;font-weight:700;">Done</button></div>
<div style="padding:20px;text-align:center;">
<img id="editAvatar" class="avatar" style="width:90px;height:90px;margin-bottom:12px;" src="">
<input type="file" id="avatarFile" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
<button class="link" style="background:none;border:none;" onclick="avatarFile.click()">Change Profile Photo</button>
<div style="text-align:left;margin-top:20px;">
<label style="font-size:12px;color:#888;">Username (unique)</label><input id="editUsername">
<label style="font-size:12px;color:#888;">Bio</label><textarea id="editBio" rows="3" placeholder="Bio..."></textarea>
</div>
</div>
</div>

<div class="bottom">
<button id="bFeed" class="active" onclick="showPage('feed')">⌂</button>
<button id="bSearch" onclick="showPage('search')">⌕</button>
<button id="bProfile" onclick="showPage('profile')">◯</button>
</div>
</div>

<script>
const SUPABASE_URL='https://yecpltndhlzfjplzhcpm.supabase.co';
const SUPABASE_KEY='sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser=null, currentProfile=null;
let isLogin=true;
function toggleAuth(){isLogin=!isLogin;loginForm.style.display=isLogin?'block':'none';signupForm.style.display=isLogin?'none':'block';}
function showMsg(t,ok=false){errBox.style.display=ok?'none':'block';okBox.style.display=ok?'block':'none';(ok?okBox:errBox).innerText=t;}
function hideMsg(){errBox.style.display='none';okBox.style.display='none';}

async function signup(){
 let email=semail.value.trim(), pass=spass.value.trim(), username=sname.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
 if(!email||!pass||!username){showMsg('Email + Pass + Username kudu da');return;}
 if(username.length<3){showMsg('Username 3+ chars da');return;}
 showMsg('Checking unique username...',true);
 // check unique
 let {data:exists}=await supabaseClient.from('profiles').select('username').eq('username',username).maybeSingle();
 if(exists){showMsg('Username already taken da - vera try pannu da!');return;}
 try{
  let {data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{data:{username}}});
  if(error) throw error;
  if(data.user){
   await supabaseClient.from('profiles').insert({id:data.user.id,username,bio:'Tiruchuli to World 🌍'});
  }
  showMsg('✅ Account created da! Login pannu da Giri! 🔒',true);
  setTimeout(()=>{toggleAuth();email.value=email;},1200);
 }catch(e){showMsg('❌ '+e.message);}
}

async function login(){
 let e=email.value.trim(), p=pass.value.trim();
 if(!e||!p){showMsg('Email+Pass kudu da');return;}
 mainBtn.innerText='Safe login...';
 try{
  let {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});
  if(error) throw error;
  currentUser=data.user;
  await loadProfile();
  authBox.style.display='none';mainBox.style.display='block';
 }catch(err){showMsg('❌ '+err.message);mainBtn.innerText='Log in';}
}

async function loadProfile(){
 if(!currentUser){ let {data}=await supabaseClient.auth.getSession(); currentUser=data.session?.user; if(!currentUser) return; }
 let {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single();
 if(!profile){ // create if missing
   let uname=currentUser.user_metadata?.username||currentUser.email.split('@')[0];
   let {data:newP}=await supabaseClient.from('profiles').insert({id:currentUser.id,username:uname}).select().single();
   profile=newP;
 }
 currentProfile=profile;
 pUsername.innerText='@'+profile.username;
 pBio.innerText=profile.bio||'';
 pAvatar.src=profile.avatar_url||`https://i.pravatar.cc/150?u=${profile.username}`;
 topUser.innerText='@'+profile.username;
 privateToggle.className='toggle'+(profile.is_private?' on':'');
 // followers count
 let {count:fc}=await supabaseClient.from('follows').select('*',{count:'exact',head:true}).eq('following_id',currentUser.id);
 let {count:fgc}=await supabaseClient.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',currentUser.id);
 pFollowers.innerText=fc||0; pFollowing.innerText=fgc||0;
}

function showPage(p){
 feedPage.style.display=p=='feed'?'block':'none';
 searchPage.style.display=p=='search'?'block':'none';
 profilePage.style.display=p=='profile'?'block':'none';
 bFeed.className=p=='feed'?'active':''; bSearch.className=p=='search'?'active':''; bProfile.className=p=='profile'?'active':'';
 if(p=='profile') loadProfile();
 if(p=='search') searchUser();
}

async function searchUser(){
 let q=searchInput.value.trim().toLowerCase();
 let {data:profiles}=await supabaseClient.from('profiles').select('*').limit(20);
 if(q) profiles=profiles.filter(pr=>pr.username.includes(q));
 let html='';
 for(let pr of profiles){
  if(pr.id===currentUser?.id) continue;
  let {data:isFollowing}=await supabaseClient.from('follows').select('id').eq('follower_id',currentUser.id).eq('following_id',pr.id).maybeSingle();
  let btn=isFollowing?`<button class="followBtn unfollow" onclick="unfollow('${pr.id}')">Following</button>`:`<button class="followBtn follow" onclick="follow('${pr.id}')">Follow</button>`;
  html+=`<div class="user-row"><div style="display:flex;gap:10px;align-items:center;"><img src="${pr.avatar_url||`https://i.pravatar.cc/100?u=${pr.username}`}"><div><b style="font-size:13px;">${pr.username}</b><br><small style="color:#888;">${pr.bio?.substring(0,20)||''}${pr.is_private?' 🔒':''}</small></div></div>${btn}</div>`;
 }
 searchResult.innerHTML=html||'<p style="text-align:center;color:#555;margin-top:20px;">No users da</p>';
}

async function follow(id){
 await supabaseClient.from('follows').insert({follower_id:currentUser.id,following_id:id});
 searchUser(); loadProfile();
}
async function unfollow(id){
 await supabaseClient.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',id);
 searchUser(); loadProfile();
}

async function togglePrivate(){
 let newVal=!currentProfile.is_private;
 await supabaseClient.from('profiles').update({is_private:newVal}).eq('id',currentUser.id);
 currentProfile.is_private=newVal;
 privateToggle.className='toggle'+(newVal?' on':'');
}

function openEdit(){
 editBox.style.display='block';
 editAvatar.src=pAvatar.src;
 editUsername.value=currentProfile.username;
 editBio.value=currentProfile.bio||'';
}
let newAvatarUrl=null;
function previewAvatar(e){
 let file=e.target.files[0]; if(!file)return;
 let reader=new FileReader(); reader.onload=ev=>{editAvatar.src=ev.target.result; newAvatarUrl=ev.target.result;}; reader.readAsDataURL(file);
}
async function saveEdit(){
 let uname=editUsername.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
 let bio=editBio.value.trim();
 if(uname!==currentProfile.username){
  let {data:exists}=await supabaseClient.from('profiles').select('id').eq('username',uname).maybeSingle();
  if(exists){alert('Username taken da - vera username podu da Giri!');return;}
 }
 let avatar_url=currentProfile.avatar_url;
 if(newAvatarUrl){
  // upload to storage
  try{
   let blob=await (await fetch(newAvatarUrl)).blob();
   let fileName=`${currentUser.id}_${Date.now()}.jpg`;
   let {error}=await supabaseClient.storage.from('avatars').upload(fileName,blob,{upsert:true});
   if(!error){ let {data}=supabaseClient.storage.from('avatars').getPublicUrl(fileName); avatar_url=data.publicUrl; }
  }catch{}
 }
 await supabaseClient.from('profiles').update({username:uname,bio,avatar_url}).eq('id',currentUser.id);
 editBox.style.display='none'; newAvatarUrl=null; await loadProfile();
}

function logout(){supabaseClient.auth.signOut();location.reload();}

(async()=>{let {data}=await supabaseClient.auth.getSession();if(data.session){currentUser=data.session.user;authBox.style.display='none';mainBox.style.display='block';await loadProfile();showPage('profile');}})();
</script>
</body>
</html>
