<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: white;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.search {
  width: 40%;
  padding: 9px 15px;
  border: 1px solid #ddd;
  border-radius: 20px;
  outline: none;
}

.profile {
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: 20px auto;
}

/* Stories */

.stories {
  background: white;
  padding: 15px;
  display: flex;
  gap: 15px;
  overflow-x: auto;
  border-radius: 10px;
}

.story {
  min-width: 65px;
  text-align: center;
  font-size: 12px;
}

.story img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid #ff4d8d;
  padding: 2px;
}

/* Post */

.post {
  background: white;
  margin-top: 20px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 12px;
  gap: 10px;
  font-weight: bold;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.post img {
  width: 100%;
  display: block;
}

.actions {
  padding: 12px;
  display: flex;
  gap: 18px;
  font-size: 25px;
}

.like {
  cursor: pointer;
}

.liked {
  color: red;
}

.caption {
  padding: 0 12px 12px;
}

.comment-box {
  display: flex;
  border-top: 1px solid #eee;
}

.comment-box input {
  flex: 1;
  padding: 12px;
  border: none;
  outline: none;
}

.comment-box button {
  border: none;
  background: white;
  color: #0095f6;
  font-weight: bold;
  padding: 10px;
  cursor: pointer;
}

.comments {
  padding: 0 12px 12px;
}

.upload {
  background: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
}

.upload input {
  width: 100%;
  margin: 10px 0;
}

.upload button {
  padding: 10px 18px;
  border: none;
  background: #0095f6;
  color: white;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PIXORO</div>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Search users..."
    oninput="searchUsers()"
  >

   <div class="profile">
  @pixoro_user
  <span class="owner-badge">👑 OWNER</span>
</div>
<div class="container">

  <!-- STORIES -->
  <div class="stories">

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=1">
      <p>You</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=2">
      <p>Arun</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=3">
      <p>Kavi</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=4">
      <p>Ravi</p>
    </div>

    <div class="story">
      <img src="https://i.pravatar.cc/100?img=5">
      <p>Priya</p>
    </div>

  </div>

  <!-- SEARCH RESULT -->
  <div id="searchResults"></div>

  <!-- UPLOAD -->
  <div class="upload">
    <h3>Create Post</h3>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <button onclick="uploadPost()">Post</button>
  </div>

  <!-- POST -->
  <div class="post">

    <div class="post-header">
      <img
        class="avatar"
        src="https://i.pravatar.cc/100?img=12"
      >
      <span>pixoro_user</span>
    </div>

    <img
      src="https://picsum.photos/600/600?random=10"
      alt="Post"
    >

    <div class="actions">

      <span
        id="likeButton"
        class="like"
        onclick="likePost()"
      >♡</span>

      <span>💬</span>
      <span>↗</span>

    </div>

    <div class="caption">
      <b id="likeCount">0</b> likes
      <br><br>
      <b>pixoro_user</b>
      Welcome to PIXORO 🚀
    </div>

    <div id="comments" class="comments"></div>

    <div class="comment-box">
      <input
        id="commentInput"
        type="text"
        placeholder="Add a comment..."
      >

      <button onclick="addComment()">
        Post
      </button>
    </div>

  </div>

</div>

<script>

/* LIKE */

let likes = 0;

function likePost() {

  const button =
    document.getElementById("likeButton");

  if (button.classList.contains("liked")) {

    likes--;

    button.classList.remove("liked");
    button.innerHTML = "♡";

  } else {

    likes++;

    button.classList.add("liked");
    button.innerHTML = "♥";

  }

  document.getElementById("likeCount")
    .innerText = likes;
}


/* COMMENT */

function addComment() {

  const input =
    document.getElementById("commentInput");

  const text = input.value.trim();

  if (!text) return;

  const comment =
    document.createElement("p");

  comment.innerHTML =
    "<b>You</b> " + text;

  document
    .getElementById("comments")
    .appendChild(comment);

  input.value = "";
}


/* SEARCH */

function searchUsers() {

  const value =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const result =
    document.getElementById("searchResults");

  if (!value) {
    result.innerHTML = "";
    return;
  }

  const users = [
    "pixoro_user",
    "arun",
    "kavi",
    "ravi",
    "priya"
  ];

  const found =
    users.filter(user =>
      user.includes(value)
    );

  if (found.length > 0) {

    result.innerHTML =
      "<div style='background:white;padding:15px;margin-top:10px;border-radius:10px'>" +
      found.map(user =>
        "<p style='padding:8px'><b>👤 @" +
        user +
        "</b></p>"
      ).join("") +
      "</div>";

  } else {

    result.innerHTML =
      "<div style='padding:15px'>No users found</div>";
  }
}


/* IMAGE UPLOAD */

function uploadPost() {

  const input =
    document.getElementById("photoInput");

  if (!input.files.length) {
    alert("Please select a photo");
    return;
  }

  const file = input.files[0];

  const reader = new FileReader();

  reader.onload = function(e) {

    const post =
      document.createElement("div");

    post.className = "post";

    post.innerHTML = `
      <div class="post-header">
        <img
          class="avatar"
          src="https://i.pravatar.cc/100?img=12"
        >
        <span>@pixoro_user</span>
      </div>

      <img src="${e.target.result}">

      <div class="actions">
        ❤️ &nbsp
