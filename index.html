<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro - Final Mass</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:50;border-bottom:1px solid #111;height:56px}
.topPlus{width:32px;height:32px;background:linear-gradient(135deg,#ff5ea8,#ff7a00)!important;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 0 12px #ff5ea855}
.bellWhite{width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.bellWhite svg{width:18px;height:18px}
.post{background:#000;border:1px solid #151515;border-radius:20px;margin:10px 8px 14px;overflow:hidden;padding-bottom:10px}
.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:12px;background:#111}
.post video.main{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#111}
.actions{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-direction:row!important}.left{display:flex!important;gap:18px;align-items:center;flex-direction:row!important}
.act{width:28px;height:28px;cursor:pointer;background:none;border:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.act svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8}.act.liked svg{fill:#FF0A33;stroke:#FF0A33}.act.saved svg{fill:#fff;stroke:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#ff5ea8}.bottom-nav a.active svg{stroke:#ff5ea8}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#ff5ea8;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555;background:#111}
.pfpRing{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff5ea8,#ff7a00);padding:1.5px;cursor:pointer;flex-shrink:0}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:1.5px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.storyBar{display:flex;gap:14px;padding:10px 12px;overflow-x:auto;background:#000;border-bottom:1px solid #111;min-height:92px}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:64px;max-width:64px;cursor:pointer;flex-shrink:0}
.sRing{width:60px;height:60px;border-radius:50%;padding:2.3px;background:linear-gradient(135deg,#ff5ea8,#ff7a00,#a259ff)!important}
.sRing.seen{background:#222!important}
.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.sAddWrap{position:relative;width:60px;height:60px}.sAddImg{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#111;border:2px solid #ff5ea8}
.sAddPlus{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:linear-gradient(135deg,#ff5ea8,#ff7a00);border-radius:50%;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:900}
.sName{font-size:10.5px;margin-top:6px;color:#fff;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storySearchWrap{padding:6px 10px;background:#000;border-bottom:1px solid #111;display:flex;gap:8px;align-items:center}.storySearchWrap input{flex:1;background:#111;border:1px solid #ff5ea866;padding:8px 12px;border-radius:20px;color:#fff;outline:none;font-size:12px}
.heart-burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:90px;color:#FF0A33;pointer-events:none;opacity:0}.heart-burst.show{animation:burst .9s forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.postMenuSheet{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:none;align-items:flex-end;justify-content:center}.postMenuSheet.show{display:flex}
.postMenuBox{background:#1a1a1a;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:12px 14px 30px;border:1px solid #333;max-height:85vh;overflow-y:auto}
.menuItem{padding:14px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;cursor:pointer;font-size:14px}.menuItem.delete{color:#ff3040}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff5ea8,#ff7a00);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.choiceSheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:flex-end;justify-content:center}.choiceSheet.show{display:flex}
.createRow{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid #2a2a2a;cursor:pointer}
.createIco{width:44px;height:44px;border-radius:50%;border:1px solid #ff5ea8;background:#ff5ea822;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.trendBar{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #111}.trendBar::-webkit-scrollbar{display:none}
.trendChip{background:#111;border:1px solid #ff5ea866;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.feedTabs{display:flex;border-bottom:1px solid #111}.feedTab{flex:1;text-align:center;padding:12px;font-size:13px;color:#888;cursor:pointer;font-weight:700}.feedTab.active{color:#fff;border-bottom:2px solid #ff5ea8}
.homeMute{position:absolute;right:10px;bottom:10px;width:36px;height:36px;background:#808080!important;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:30;cursor:pointer;border:1.5px solid #808080}
.singleBanner{background:linear-gradient(90deg,#ff5ea8,#ff7a00);padding:10px;text-align:center;font-size:13px;font-weight:800}
</style></head><body>
<div id="splash" style="height:100vh;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#ff149344,transparent 60%),#000"><span style="background:linear-gradient(90deg,#ff5ea8,#a259ff,#ff7a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Pixoro 🔥</span></div>
<div class="top"><b style="font-size:26px;font-weight:900;background:linear-gradient(90deg,#ff5ea8,#a259ff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Pixoro</b><div style="display:flex;gap:8px;align-items:center"><div class="topPlus" onclick="showChoice()">+</div><div class="bellWhite" onclick="location.href='notifications.html'">🔔</div></div></div>
<div id="singleBanner" class="singleBanner" style="display:none">📌 Single Post View - <span onclick="location.href='index.html'" style="text-decoration:underline;cursor:pointer">Back to Feed</span></div>
<div class="storySearchWrap"><input id="storySearch" placeholder="🔍 Search Story..." oninput="renderStories()"><span onclick="document.getElementById('storySearch').value='';renderStories()" style="color:#666;cursor:pointer">✕</span></div>
<div class="storyBar" id="storyBar"></div>
<div class="feedTabs"><div class="feedTab active" id="tabForYou" onclick="setFeedMode('foryou')">✨ For You</div><div class="feedTab" id="tabFollowing" onclick="setFeedMode('following')">👥 Following</div><div class="feedTab" id="tabLatest" onclick="setFeedMode('latest')">🕒 Latest</div></div>
<div id="trendBar" class="trendBar" style="display:none"></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#666">Loading...</p></div>
<div id="toast" class="toast"></div>
<div class="bottom-nav"><a class="active" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;border:1px solid #333"><div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #333"><b>Comments</b><span onclick="closeComment()" style="font-size:22px">✕</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:12px"></div><div style="padding:10px;border-top:1px solid #333;display:flex;gap:10px"><img src="" id="myCommentPfp" style="width:34px;height:34px;border-radius:50%;object-fit:cover"><input id="commentInput" placeholder="Add comment..." style="flex:1;background:#000;border:1px solid #333;padding:12px 14px;border-radius:20px;color:#fff"><button onclick="addComment()" style="background:linear-gradient(90deg,#ff5ea8,#ff7a00);border:0;color:#fff;font-weight:900;padding:10px 16px;border-radius:20px">Post</button></div></div></div>
<div id="postMenu" class="postMenuSheet" onclick="if(event.target==this)closePostMenu()"><div class="postMenuBox" id="postMenuBox"></div></div>
<div id="choice" class="choiceSheet" onclick="if(event.target==this)hideChoice()"><div style="background:#1a1a1a;border-radius:28px 28px 0 0;padding:20px 0 30px;width:100%;max-width:450px"><div style="width:50px;height:5px;background:#333;border-radius:10px;margin:0 auto 16px"></div><div style="text-align:center;font-size:22px;font-weight:900;margin-bottom:10px">Create</div><div class="createRow" onclick="location.href='post-create.html'"><div class="createIco">+</div><div style="flex:1"><b>Post</b><div style="font-size:12px;color:#888">Share a photo</div></div><span>›</span></div><div class="createRow" onclick="location.href='reel-create.html'"><div class="createIco">▶</div><div style="flex:1"><b>Reels</b><div style="font-size:12px;color:#888">Create a short reel</div></div><span>›</span></div><div class="createRow" onclick="location.href='story-upload.html'"><div class="createIco">◯</div><div style="flex:1"><b>Story</b><div style="font-size:12px;color:#888">Share 24h story</div></div><span>›</span></div><div onclick="hideChoice()" style="text-align:center;padding:14px;color:#777">Cancel</div></div></div>
<script>
function showToast(m){let t=document.getElementById('toast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
window.showToast=showToast; function showChoice(){document.getElementById('choice').classList.add('show')} function hideChoice(){document.getElementById('choice').classList.remove('show')}
window.showChoice=showChoice; window.hideChoice=hideChoice;
function getSupa(){return window.supa} window.getSupa=getSupa;
let supa=window.supa;
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase();return u||''}
let ME_RAW='',ME='',ME_ID='',ME_PFP=''
let allPosts=[],allLikes=[],allSaves=[],allStories=[],allFollows=[],allProfiles=[],currentPostId=null,currentMenuPost=null,allViews=[]
let viewedStories=[],lastTap=0,feedMode='foryou',globalMuted=true;
let SINGLE_ID = new URLSearchParams(location.search).get('id')||'';
window.getTick=()=>''; 
function toggleHomeMute(btn){let v=btn.parentElement.querySelector('video');if(!v)return;if(v.muted){v.muted=false;v.volume=1;btn.innerText='🔊';localStorage.setItem('pixoro_sound','on')}else{v.muted=true;btn.innerText='🔇';localStorage.setItem('pixoro_sound','off')}} window.toggleHomeMute=toggleHomeMute;
async function trackView(postId,ownerId){if(!ME_ID||!postId)return;if(String(ownerId)===String(ME_ID))return;if(allViews.some(v=>String(v.post_id)==String(postId)&&String(v.user_id)===String(ME_ID)))return;setTimeout(async()=>{if(allViews.some(v=>String(v.post_id)==String(postId)&&String(v.user_id)===String(ME_ID)))return;supa=getSupa();if(!supa)return;let {error}=await supa.from('views').insert({post_id:postId,user_id:ME_ID,username:ME_RAW});if(!error){allViews.push({post_id:postId,user_id:ME_ID});renderFeed()}},3000)} window.trackView=trackView;
function profileById(id){return allProfiles.find(x=>x.id===id)||null}
function displayNameFor(u){if(!u)return ME_RAW||'user';let p=allProfiles.find(x=>x.id===u)||allProfiles.find(x=>cleanUser(x.username)===cleanUser(u));if(p&&p.username)return cleanUser(p.username);return cleanUser(u)||ME_RAW||'user'}
function getPfp(u){if(u===ME_ID&&ME_PFP)return ME_PFP;let p=allProfiles.find(x=>x.id===u)||allProfiles.find(x=>cleanUser(x.username)===cleanUser(u));if(p&&(p.avatar_url||p.profile_pic||p.photo_url))return p.avatar_url||p.profile_pic||p.photo_url;let name=p?(p.username||''): (u===ME_ID?ME_RAW:cleanUser(u));return 'https://ui-avatars.com/api/?name='+(cleanUser(name).charAt(0).toUpperCase()||'G')+'&background=111&color=fff&size=200&bold=true'}
function isMyPostObj(p){return p.user_id===ME_ID}
function viralScore(p){let likes=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let hours=(Date.now()-new Date(p.created_at||Date.now()).getTime())/3600000;return (likes*10)/(hours+2)}
function setFeedMode(m){feedMode=m;document.getElementById('tabForYou').classList.toggle('active',m=='foryou');document.getElementById('tabFollowing').classList.toggle('active',m=='following');document.getElementById('tabLatest').classList.toggle('active',m=='latest');renderFeed()} window.setFeedMode=setFeedMode;
function renderTrending(){let tags={};allPosts.forEach(p=>{(p.caption||'').match(/#\w+/g)?.forEach(t=>{tags[t.toLowerCase()]=(tags[t.toLowerCase()]||0)+1})});let top=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,8);let bar=document.getElementById('trendBar');if(!top.length){bar.style.display='none';return}bar.style.display='flex';bar.innerHTML=top.map(([t,c])=>`<span class="trendChip" onclick="showToast('${t} • ${c} posts 🔥')">🔥 ${t} • ${c}</span>`).join('')}
function openProfileFast(u){let p=allProfiles.find(x=>x.id===u);let un=p?p.username:cleanUser(u);location.href='profile.html?u='+encodeURIComponent(un)} window.openProfileFast=openProfileFast;
function pfpHtml(u){return `<div class="pfpRing" onclick="event.stopPropagation();openProfileFast('${u}')"><div class="pfpInner"><img src="${getPfp(u)}"></div></div>`}
function updateNavPfp(){let el=document.getElementById('navPfp');if(el&&ME_ID)el.src=getPfp(ME_ID)}
async function checkLogin(){supa=getSupa();if(!supa){setTimeout(checkLogin,300);return}let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}let {data:profile}=await supa.from('profiles').select('*').eq('id',session.user.id).single();if(!profile||!profile.username){location.href='login.html';return}ME_RAW=cleanUser(profile.username);ME=ME_RAW;ME_ID=session.user.id;ME_PFP=profile.avatar_url||profile.profile_pic||'';window.ME=ME_RAW;window.ME_ID=ME_ID;setTimeout(()=>{let s=document.getElementById('splash');if(s)s.style.display='none';loadAll()},500)}
async function loadAll(){try{supa=getSupa();if(!supa)return;let {data:profiles}=await supa.from('profiles').select('*');allProfiles=profiles||[];let {data:pAll}=await supa.from('posts').select('*').order('created_at',{ascending:false});let posts=pAll;if(!posts||!posts.length){let {data:p1}=await supa.from('posts').select('*').eq('user_id',ME_ID).order('created_at',{ascending:false});if(p1&&p1.length)posts=p1}let {data:likes}=await supa.from('likes').select('*');let {data:views}=await supa.from('views').select('*');let {data:saves}=await supa.from('saves').select('*');let {data:stories}=await supa.from('stories').select('*').order('created_at',{ascending:false});let {data:follows}=await supa.from('follows').select('*');let now=new Date();allPosts=(posts||[]).map(p=>{let prof=profileById(p.user_id);p.username=prof?prof.username:(p.username||'');p.username=cleanUser(p.username);p.media_url=p.media_url||p.image||p.image_url||p.video_url||'';return p}).filter(p=>!p.is_archived);allStories=(stories||[]).map(s=>{let prof=profileById(s.user_id);s.username=prof?prof.username:(s.username||'');s.username=cleanUser(s.username);return s}).filter(s=>{if(!s.expires_at)return true;return new Date(s.expires_at)>now});allLikes=likes||[];allSaves=saves||[];allFollows=follows||[];allViews=views||[];renderStories();renderTrending();renderFeed();updateNavPfp();}catch(e){console.log(e)}}
function renderStories(){let bar=document.getElementById('storyBar');let searchQ=(document.getElementById('storySearch')?.value||'').toLowerCase().trim();let myStories=allStories.filter(s=>s.user_id===ME_ID);let otherStories=allStories.filter(s=>s.user_id!==ME_ID);if(searchQ)otherStories=otherStories.filter(s=>displayNameFor(s.user_id||s.username).toLowerCase().includes(searchQ));let grouped={};otherStories.forEach(s=>{let key=s.user_id||cleanUser(s.username||'');if(!grouped[key])grouped[key]=s});let html='';let myPfp=getPfp(ME_ID);if(myStories.length>0){let s=myStories[0];html+=`<div class="sItem" onclick="openMyStory()"><div class="sRing ${viewedStories.includes(s.id)?'seen':''}"><div class="sRingInner"><img src="${myPfp}"></div></div><div class="sName">Your Story</div></div>`}else{html+=`<div class="sItem" onclick="location.href='story-upload.html'"><div class="sAddWrap"><img class="sAddImg" src="${myPfp}"><div class="sAddPlus">+</div></div><div class="sName">Your Story</div></div>`}Object.values(grouped).forEach(s=>{html+=`<div class="sItem" onclick="openOtherStory('${s.user_id||s.username}')"><div class="sRing ${viewedStories.includes(s.id)?'seen':''}"><div class="sRingInner"><img src="${getPfp(s.user_id||s.username)}"></div></div><div class="sName">${displayNameFor(s.user_id||s.username)}</div></div>`});bar.innerHTML=html} window.renderStories=renderStories;
function openMyStory(){let s=allStories.find(x=>x.user_id===ME_ID);if(!s)return location.href='story-upload.html';location.href='story-view.html?user='+(s.user_id||s.username)} function openOtherStory(u){let s=allStories.find(x=>(x.user_id===u||x.username===u));location.href='story-view.html?user='+u} window.openMyStory=openMyStory;window.openOtherStory=openOtherStory;
function renderFeed(){
  let feedPosts=[...allPosts];
  // FIXED: SINGLE POST VIEW DA - profile la click pannalum correct ah varum
  if(SINGLE_ID){ let single=allPosts.find(p=>String(p.id)==String(SINGLE_ID)); if(single){ feedPosts=[single, ...allPosts.filter(p=>String(p.id)!=String(SINGLE_ID))]; let b=document.getElementById('singleBanner'); if(b) b.style.display='block'; } }
  else if(feedMode=='foryou'){feedPosts.sort((a,b)=>viralScore(b)-viralScore(a))} else if(feedMode=='latest'){feedPosts.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0))} else if(feedMode=='following'){let followingSet=new Set(allFollows.filter(f=>f.follower_id===ME_ID).map(f=>f.following_id));feedPosts=feedPosts.filter(p=>followingSet.has(p.user_id)||isMyPostObj(p))}
  let html=''; for(let p of feedPosts){ let ownerKey=p.user_id||p.username; let lCount=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let isLiked=allLikes.some(l=>String(l.post_id)==String(p.id)&&(l.user_id==ME_ID));let isSaved=allSaves.some(s=>String(s.post_id)==String(p.id)&&(s.user_id==ME_ID));let vCount=allViews.filter(v=>String(v.post_id)==String(p.id)).length;let vText=vCount>=1000?(vCount/1000).toFixed(1)+'K':vCount;let likeText=p.hide_likes?'❤️ Like count hidden':`<span id="likeCount-${p.id}">${lCount}</span> likes`;let commentBtn=p.hide_comments?'':`<button class="act" onclick="event.stopPropagation();openComment('${p.id}')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>`;let shareText=p.hide_share?'':`<button class="act" onclick="event.stopPropagation();sharePost('${p.id}')"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>`;let mUrl=p.media_url||'';let isVid=p.media_type=='reel'||p.media_type=='video'||mUrl.includes('.mp4');let mediaHtml=isVid?`<video class="main" src="${mUrl}" loop muted playsinline preload="auto" poster="${p.thumbnail_url||''}"></video>`:`<img class="main" src="${mUrl}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x500/111/fff?text=Pixoro'">`;let locHtml=p.location?`<div style="font-size:11px;padding:0 14px">📍 ${p.location}</div>`:'';let songHtml=p.song?`<div style="font-size:11px;padding:0 14px">🎵 ${p.song}</div>`:'';let aiHtml=p.is_ai?`<div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:10px;font-size:10px">✨ AI</div>`:'';let muteHtml=isVid?`<div style="position:absolute;right:10px;bottom:10px;width:36px;height:36px;background:#808080;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();toggleHomeMute(this)">🔇</div>`:''; html+=`<div class="post" id="post-${p.id}"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(ownerKey)}<b onclick="openProfileFast('${ownerKey}')" style="cursor:pointer">${displayNameFor(ownerKey)}</b></div><span onclick="openPostMenu('${p.id}')" style="cursor:pointer;padding:4px 10px;font-size:20px">⋮</span></div><div style="position:relative;overflow:hidden" onclick="handleHomeVideoTap(this,'${p.id}',${isVid})">${mediaHtml}${aiHtml}${muteHtml}<div id="burst-${p.id}" class="heart-burst">❤</div></div>${locHtml}${songHtml}<div class="actions"><div class="left"><button id="likeBtn-${p.id}" class="act ${isLiked?'liked':''}" onclick="event.stopPropagation();fastLike('${p.id}')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button>${commentBtn}${shareText}</div><button class="act ${isSaved?'saved':''}" onclick="event.stopPropagation();savePost('${p.id}')"><svg viewBox="0 0 24 24"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></button></div><div style="padding:0 14px"><b>${likeText}</b> • 👁️ ${vText} views<br><b onclick="openProfileFast('${ownerKey}')">${displayNameFor(ownerKey)}</b> ${p.caption||''}</div></div>` } document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px;color:#666">No posts - + click panni upload pannu da!</p>'; observeHomeVideos(); if(SINGLE_ID){setTimeout(()=>{let el=document.getElementById('post-'+SINGLE_ID);if(el) el.scrollIntoView({behavior:'smooth',block:'start'})},300)} }
window.renderFeed=renderFeed;
function observeHomeVideos(){let vs=document.querySelectorAll('.post video.main');let io=new IntersectionObserver(es=>{es.forEach(e=>{let v=e.target;if(e.isIntersecting){document.querySelectorAll('.post video.main').forEach(o=>{if(o!==v)o.pause()});v.muted=true;v.play().catch(()=>{})}else{v.pause()}})},{threshold:0.6});vs.forEach(v=>io.observe(v))}
function handleHomeVideoTap(wrap,id,isVid){let now=Date.now();if(now-lastTap<300){lastTap=0;doubleLike(id);return}lastTap=now;setTimeout(()=>{if(!isVid){handleTap(id);lastTap=0;return}let v=wrap.querySelector('video');if(v)v.pause();location.href='reels.html?id='+id},300)} window.handleHomeVideoTap=handleHomeVideoTap;
function handleTap(id){let now=Date.now();if(now-lastTap<300){doubleLike(id);lastTap=0}else{lastTap=now}} window.handleTap=handleTap;
async function doubleLike(id){let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));if(liked)return;allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});let btn=document.getElementById('likeBtn-'+id);if(btn)btn.classList.add('liked');let c=document.getElementById('likeCount-'+id);if(c)c.innerText=parseInt(c.innerText||'0')+1;supa=getSupa();if(supa){let {error}=await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW});if(error){allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&l.user_id==ME_ID));if(btn)btn.classList.remove('liked');if(c)c.innerText=Math.max(0,parseInt(c.innerText||'1')-1)}}} window.doubleLike=doubleLike;
async function fastLike(id){supa=getSupa();if(!supa)return showToast('Supa load aagala da!');if(!ME_ID)return showToast('Login pannu da!');let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));let btn=document.getElementById('likeBtn-'+id);let c=document.getElementById('likeCount-'+id);if(!liked){allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(btn)btn.classList.add('liked');if(c)c.innerText=parseInt(c.innerText||'0')+1;let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}let {error}=await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW});if(error){allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&l.user_id==ME_ID));if(btn)btn.classList.remove('liked');if(c)c.innerText=Math.max(0,parseInt(c.innerText||'1')-1)}}else{allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&(l.user_id==ME_ID)));if(btn)btn.classList.remove('liked');if(c)c.innerText=Math.max(0,parseInt(c.innerText||'1')-1);let {error}=await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID);if(error)showToast(error.message)}} window.fastLike=fastLike;
function openPostMenu(postId){currentMenuPost=allPosts.find(p=>String(p.id)==String(postId));let p=currentMenuPost;if(!p)return;let isMine=isMyPostObj(p);let box=document.getElementById('postMenuBox');if(!isMine){box.innerHTML=`<div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 12px"></div><div class="menuItem" onclick="sharePost('${p.id}');closePostMenu()">🔗 Share</div><div class="menuItem" onclick="closePostMenu()">🚩 Report</div><div class="menuItem" onclick="closePostMenu()" style="justify-content:center;background:#000;border-radius:12px;margin-top:10px;color:#888">Cancel</div>`}else{box.innerHTML=`<div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 12px"></div><div class="menuItem" onclick="toggleHideLikes()">${p.hide_likes?'👁️ Unhide':'❤️ Hide like count'}</div><div class="menuItem" onclick="togglePin()">${p.is_pinned?'📌 Unpin':'📌 Pin'}</div><div class="menuItem" onclick="archivePost()">📦 Archive</div><div class="menuItem delete" onclick="deletePost()">🗑️ Delete</div><div class="menuItem" onclick="closePostMenu()" style="justify-content:center;background:#000;border-radius:12px;margin-top:10px;color:#888">Cancel</div>`}document.getElementById('postMenu').classList.add('show')} window.openPostMenu=openPostMenu;
function closePostMenu(){document.getElementById('postMenu').classList.remove('show')} window.closePostMenu=closePostMenu;
async function toggleHideLikes(){supa=getSupa();if(!supa)return;let v=!currentMenuPost.hide_likes;let {error}=await supa.from('posts').update({hide_likes:v}).eq('id',currentMenuPost.id);if(error)return showToast(error.message);currentMenuPost.hide_likes=v;renderFeed();closePostMenu()} window.toggleHideLikes=toggleHideLikes;
async function togglePin(){supa=getSupa();if(!supa)return;let v=!currentMenuPost.is_pinned;await supa.from('posts').update({is_pinned:v}).eq('id',currentMenuPost.id);currentMenuPost.is_pinned=v;closePostMenu();loadAll()} window.togglePin=togglePin;
async function archivePost(){supa=getSupa();if(!supa)return;await supa.from('posts').update({is_archived:true}).eq('id',currentMenuPost.id);closePostMenu();loadAll()} window.archivePost=archivePost;
async function deletePost(){supa=getSupa();if(supa)await supa.from('posts').delete().eq('id',currentMenuPost.id);allPosts=allPosts.filter(p=>p.id!=currentMenuPost.id);renderFeed();closePostMenu();showToast('Deleted da Giri!')} window.deletePost=deletePost;
async function savePost(id){supa=getSupa();let s=allSaves.some(x=>String(x.post_id)==String(id)&&(x.user_id==ME_ID));if(s){allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&(x.user_id==ME_ID)));if(supa)await supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID);showToast('Unsaved da')}else{allSaves.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(supa){let {error}=await supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW});if(error){showToast(error.message);allSaves=allSaves.filter(x=>String(x.post_id)!=String(id))}else showToast('Saved da ✅')}}renderFeed()} window.savePost=savePost;
async function sharePost(id){let post=allPosts.find(p=>String(p.id)==String(id));let link=location.origin+'/index.html?id='+id;let text='🔥 Pixoro la Paaru da - '+(post?.caption||'Super Post')+' - '+link;if(navigator.share){try{await navigator.share({title:'Pixoro',text:text,url:link});showToast('Shared da ✅');return}catch(e){}}window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')} window.sharePost=sharePost;
async function openComment(id){if(allPosts.find(p=>String(p.id)==String(id))?.hide_comments){showToast('Commenting off da!');return}currentPostId=id;document.getElementById('commentModal').style.display='flex';document.getElementById('myCommentPfp').src=getPfp(ME_ID);supa=getSupa();if(!supa)return;let {data,error}=await supa.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:false});if(error)return showToast(error.message);document.getElementById('commentList').innerHTML=(data||[]).map(c=>{let ck=c.user_id||c.username;return `<div style="display:flex;gap:10px;padding:10px 0"><img src="${getPfp(ck)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover"><div style="flex:1"><b style="font-size:13px">${displayNameFor(ck)}</b><div style="font-size:13px">${c.text}</div></div></div>`}).join('')||'No comments'} window.openComment=openComment;
function closeComment(){document.getElementById('commentModal').style.display='none'} window.closeComment=closeComment;
async function addComment(){supa=getSupa();let t=document.getElementById('commentInput').value.trim();if(!t||!currentPostId||!supa)return;let {error}=await supa.from('comments').insert({post_id:currentPostId,user_id:ME_ID,username:ME_RAW,text:t});if(error)return showToast(error.message);document.getElementById('commentInput').value='';openComment(currentPostId);showToast('Comment added da ✅')} window.addComment=addComment;
checkLogin()
</script>
