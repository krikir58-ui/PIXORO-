<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXORO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
  padding-bottom: 75px;
}

/* HEADER */
header {
  height: 65px;
  width: 100%;
  background: white;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.search {
  flex: 1;
  min-width: 0;
  padding: 11px 14px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-size: 14px;
  outline: none;
}

.owner {
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

/* MAIN */
main {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

/* STORIES */
.stories {
  background: white;
  margin-top: 10px;
  padding: 15px 10px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
  border-radius: 12px;
}

.story {
  min-width: 68px;
  text-align: center;
}

.story img {
  width: 62px;
  height: 62px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #ff2685;
}

.story p {
  margin: 6px 0 0;
}

/* CREATE */
.create {
  background: white;
  margin-top: 10px;
  padding: 20px;
  border-radius: 12px;
}

.create h2 {
  margin-top: 0;
}

.create input {
  width: 100%;
  margin: 10px 0;
}

.postBtn {
  background: #1296ed;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: 16px;
}

/* POST */
.post {
  background: white;
  margin-top: 10px;
  border-bottom: 1px solid #ddd;
}

.postHeader {
  padding: 13px;
  font-weight: bold;
  font-size: 17px;
}

.postImage {
  width: 100%;
  display: block;
  max-height: 650px;
  object-fit: cover;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 20px;
  padding: 10px 13px;
}

.action {
  border: 0;
  background: none;
  font-size: 27px;
  cursor: pointer;
}

.liked {
  color: red;
}

.likeCount {
  padding: 0 13px 8px;
  font-weight: bold;
}

.caption {
  padding: 0 13px 13px;
  line-height: 1.5;
}

/* COMMENT */
.commentBox {
  display: flex;
  border-top: 1px solid #eee;
}

.commentBox input {
  flex: 1;
  border: 0;
  outline: 0;
  padding: 14px;
}

.commentBox button {
  border: 0;
  background: white;
  color: #1296ed;
  font-weight: bold;
  padding: 0 15px;
}

.comments {
  padding: 0 13px 8px;
}

/* PROFILE */
#profilePage {
  display: none;
  background: white;
  margin-top: 10px;
  padding: 25px;
  text-align: center;
  border-radius: 12px;
}

.profilePic {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #ff2685;
}

.followBtn {
  background: #1296ed;
  color: white;
  border: 0;
  padding: 10px 25px;
  border-radius: 8px;
  margin-top: 10px;
}

/* SEARCH */
#searchResults {
  background: white;
  margin-top: 10px;
  border-radius: 10px;
}

.searchUser {
  padding: 15px;
  border-bottom: 1px solid #eee;
}

/* BOTTOM NAVIGATION */
.bottomNav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.navBtn {
  border: 0;
  background: none;
  font-size: 25px;
  cursor: pointer;
}

.navText {
  display: block;
  font-size: 10px;
  margin-top: 2px;
}

/* MOBILE */
@media (max-width: 600px) {

  .logo {
    font-size: 22px;
  }

  .owner {
    font-size: 11px;
  }

  main {
    width: 100%;
  }

  .
