<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial}
body{background:#000;color:#fff}
.login{height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.box{width:320px;background:#111;border:1px solid #333;border-radius:20px;padding:24px;text-align:center}
.box h1{font-family:cursive;font-size:42px}
.input{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;margin:10px 0}
.btn{width:100%;padding:12px;background:#0095f6;border:none;border-radius:10px;color:#fff;font-weight:700}
.head{height:52px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 14px;position:fixed;top:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);z-index:10}
.pages{max-width:500px;margin:52px auto 60px}
#storyBox{display:flex;gap:12px;padding:12px;overflow-x:auto;border-bottom:1px solid #222}
.s{min-width:64px;text-align:center}
.r{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976);padding:2px;display:flex}
.r div{width:100%;height:100%;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.r img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.post{border-bottom:1px solid #222;position:relative}
.post-top{padding:10px 12px;display:flex;align-items:center;gap:10px}
.post-top img{width:32px;height:32px;border-radius:50%}
.post-img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#111}
.post-cap{padding:8px 12px 14px;font-size:14px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:52px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;font-size:22px}
#exploreBox{display:flex;flex-wrap:wrap;gap:2px;padding:2px}
#searchBox{padding:10px;display:none}
#searchBox input{width:100%;padding:10px;background:#111;border:1px solid #333;border-radius:20px;color:#fff}
</style></head><body>

<div id="loginBox" class="login">
<div class="box">
<h1>Pixoro</h1>
<p style="color:#666;font-size:12px;margin:6px 0 14px">Tiruchuli to World 🌍</p>
<input id="usernameInput" class="input" placeholder="Username" value="Giri">
<button class="btn" onclick="window.login()">Login</button>
</div></div>

<div id="mainApp" style="display:none">
<div class="head"><b style="font-family:cursive;font-size:24px">Pixoro</b><span style="margin-left:auto">♡</span></div>
<div class="pages">
<div id="searchBox"><input id="searchInput" placeholder="Search #hashtag..."></div>
<div id="storyBox"></div>
<div id="exploreBox"></div>
<div id="feedList"></div>
</div>
<div class="bottom"><span onclick="location.reload()">⌂</span><span id="searchBtn">⌕</span><span style="background:#fff;color:#000;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center" onclick="document.getElementById('fileInput').click()">+</span><span>♡</span><span id="profileBtn">◯</span></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<script type="module" src="./js/app.js"></script>
</body></html>
