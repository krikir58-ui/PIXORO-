*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}

.act{width:28px;height:28px;cursor:pointer;background:none;border:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.act svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8}.act.liked svg{fill:#FF0A33;stroke:#FF0A33}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#fff}.bottom-nav a.active svg{stroke:#fff}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#fff;font-weight:700}

.sItem{text-align:center;min-width:64px;max-width:64px;cursor:pointer;flex-shrink:0}
.sRing{width:60px;height:60px;border-radius:50%;padding:2.3px;background:#fff!important;border:2px solid #fff}
.sRing.close{background:#00C853!important;border-color:#00C853!important}.sRing.seen{background:#222!important}
.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px;border:1px solid #666}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.sAddWrap{position:relative;width:60px;height:60px}.sAddImg{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#111;border:2px solid #fff}
.sAddPlus{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:#fff;border-radius:50%;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;color:#000;font-weight:900}
.sName{font-size:10.5px;margin-top:6px;color:#fff;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storySearchWrap{padding:6px 10px;background:#000;border-bottom:1px solid #111;display:flex;gap:8px;align-items:center}.storySearchWrap input{flex:1;background:#111;border:1px solid #222;padding:8px 12px;border-radius:20px;color:#fff;outline:none;font-size:12px}
.heart-burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:90px;color:#FF0A33;pointer-events:none;opacity:0}.heart-burst.show{animation:burst .9s forwards}@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.postMenuSheet{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:none;align-items:flex-end;justify-content:center}.postMenuSheet.show{display:flex}
.postMenuBox{background:#1a1a1a;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:12px 14px 30px;border:1px solid #333;max-height:85vh;overflow-y:auto}
.menuItem{padding:14px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;cursor:pointer;font-size:14px}.menuItem.delete{color:#ff3040}
.hlRow{display:flex;gap:12px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #111}.hlRow::-webkit-scrollbar{display:none}
.hlItem{text-align:center;min-width:64px;cursor:pointer}

.songBadge{font-size:11px;color:#fff;padding:0 14px;margin-top:2px}
.aiBadge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:10px;font-size:10px;border:1px solid #fff;color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.choiceSheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:flex-end;justify-content:center}.choiceSheet.show{display:flex}
.createRow{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid #2a2a2a;cursor:pointer}

.createIco{width:44px;height:44px;border-radius:50%;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
</style></head><body>

<script>
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
window.onerror = function(){ showToast('Adutha side la problem da - Try again'); return true; };
window.addEventListener('unhandledrejection', ()=>{ showToast('Net slow da - Try again'); });
function showChoice(){document.getElementById('choice').classList.add('show')}
function hideChoice(){document.getElementById('choice').classList.remove('show')}
let supa=null; try{ supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_') }catch(e){ supa=null }
let ME_RAW=(localStorage.getItem('pixoro_user_id')||localStorage.getItem('pixoro_current_user')||'Giri').trim()
let ME=localStorage.getItem('pixoro_display_name')||cleanUser(ME_RAW)
function cleanUser(u){ if(!u) return 'giri'; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase(); return u||'giri'; }
function displayNameFor(u){ if(!u) return ME; let c=cleanUser(u); let uid=localStorage.getItem('pixoro_user_id')||ME_RAW; let oldC=cleanUser(localStorage.getItem('pixoro_old_user')||''); if(c===cleanUser(uid)||c===oldC||c==='krikir58'||c.includes('kri')) return localStorage.getItem('pixoro_display_name')||cleanUser(uid); return c; }
function isMyPost(u){ let c=cleanUser(u); return c===cleanUser(ME_RAW)||c===cleanUser(ME)||c===cleanUser(localStorage.getItem('pixoro_old_user')||'')||c===cleanUser(localStorage.getItem('pixoro_user_id')||'')||c==='krikir58'||c.includes('kri'); }
async function compressImage(file,maxW=720,quality=0.72){ return new Promise(res=>{ let img=new Image(); let url=URL.createObjectURL(file); img.onload=()=>{ let w=img.width,h=img.height; if(w>maxW){ h=h*maxW/w; w=maxW; } let c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>{ res(new File([b],file.name,{type:'image/jpeg'})); },'image/jpeg',quality); URL.revokeObjectURL(url); }; img.src=url; }); }
function updateStorageBar(){ let total=0; for(let k in localStorage){ try{ total+=localStorage.getItem(k).length*2; }catch(e){} } if(total>4000000){ cleanupExpired(); } }
function cleanupExpired(){ let now=Date.now(); ['pixoro_local_stories','pixoro_viewed_stories'].forEach(k=>{ let arr=JSON.parse(localStorage.getItem(k)||'[]'); let f=arr.filter(s=> !s.expires_at || new Date(s.expires_at).getTime()>now); if(f.length!==arr.length) localStorage.setItem(k,JSON.stringify(f)); }); updateStorageBar(); }
setInterval(cleanupExpired,60000); updateStorageBar();
function openProfileFast(u){ localStorage.setItem('pixoro_view_user',u); location.href='profile.html?u='+encodeURIComponent(displayNameFor(u)); }
let allPosts=[],allLikes=[],allSaves=[],allStories=[],allFollows=[],currentPostId=null,currentMenuPost=null
let viewedStories=JSON.parse(localStorage.getItem('pixoro_viewed_stories')||'[]')
let lastTap=0
let PLUS=JSON.parse(localStorage.getItem('pixoro_plus')||'{"ghost":false,"48h":true,"rewatch":true,"search":true,"audience":"everyone"}')
function getPfp(u){
  let my = localStorage.getItem('pixoro_profile_pic') || localStorage.getItem('pixoro_current_pfp') || localStorage.getItem('pixoro_pfp_'+ME_RAW) || localStorage.getItem('pixoro_pfp_'+ME);
  if(my && my.length > 100 && my.startsWith('data:')) return my;
  if(my && my.startsWith('http') && !my.includes('pravatar')) return my;
  let clean = cleanUser(u);
  let keys = ['pixoro_pfp_'+u,'pixoro_pfp_'+clean];
  for(let k of keys){ let p=localStorage.getItem(k); if(p && p.length>100 && p.startsWith('data:')) return p; }
  return 'https://ui-avatars.com/api/?name='+clean.charAt(0).toUpperCase()+'&background=333&color=fff&size=200&bold=true';
}
function pfpHtml(u){return `<div class="pfpRing" onclick="event.stopPropagation();openProfileFast('${u}')"><div class="pfpInner"><img src="${getPfp(u)}"></div></div>`}
function updateNavPfp(){ let el=document.getElementById('navPfp'); if(el) el.src=getPfp(ME_RAW)||getPfp(ME); }
updateNavPfp(); setInterval(updateNavPfp,1000);
async function loadAll(){
  try{
    if(!supa) throw new Error('no supa')
    let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});
    let {data:likes}=await supa.from('likes').select('*');
    let {data:saves}=await supa.from('saves').select('*').eq('username',ME_RAW);
    let {data:stories}=await supa.from('stories').select('*').order('created_at',{ascending:false});
    let {data:follows}=await supa.from('follows').select('*');
    let now=new Date()
    let supaStories=(stories||[]).filter(s=>{ if(!s.expires_at) return true; return new Date(s.expires_at) > now })
    let localStories=JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]').filter(s=>{ if(!s.expires_at) return true; return new Date(s.expires_at) > now })
    allStories=[...localStories,...supaStories]
    allPosts=(posts||[]).filter(p=>!p.is_archived)
    let localPosts=JSON.parse(localStorage.getItem('pixoro_local_posts')||'[]')
    allPosts=[...localPosts,...allPosts]
    allLikes=likes||[];allSaves=saves||[];allFollows=follows||[];
  }catch(e){ allStories=JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]'); allPosts=JSON.parse(localStorage.getItem('pixoro_local_posts')||'[]'); }
  renderStories();renderHighlights();renderFeed();updateNavPfp();updateStorageBar();
}
function renderHighlights(){
  let row=document.getElementById('highlightRow');
  let hls=JSON.parse(localStorage.getItem('pixoro_highlights')||'[]');
  if(!hls.length){ row.style.display='none'; return; }
  row.style.display='flex';
  row.innerHTML=hls.map((h,i)=>`<div class="hlItem" onclick="openHighlight(${i})"><div style="width:60px;height:60px;border-radius:50%;padding:2.3px;background:#fff;border:2px solid #fff"><div style="width:100%;height:100%;border-radius:50%;background:#000;padding:2px"><img src="${h.items[0].img}" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></div></div><div style="font-size:10.5px;margin-top:6px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.name} ⭐</div></div>`).join('');
}
function openHighlight(i){ let hls=JSON.parse(localStorage.getItem('pixoro_highlights')||'[]'); let h=hls[i]; localStorage.setItem('pixoro_temp_hl',JSON.stringify(h.items)); location.href='story-view.html?user='+ME_RAW+'&highlight='+i; }
function renderStories(){
  let bar=document.getElementById('storyBar');
  let searchQ=(document.getElementById('storySearch')?.value||'').toLowerCase().trim()
  let meLow=cleanUser(ME_RAW)
  let myStories = allStories.filter(s=> cleanUser(s.username||'') === meLow || isMyPost(s.username));
  let otherStories = allStories.filter(s=> !isMyPost(s.username));
  if(searchQ){otherStories = otherStories.filter(s=> displayNameFor(s.username).includes(searchQ));}
  let grouped={}; otherStories.forEach(s=>{ let key=cleanUser(s.username||''); if(!grouped[key]) grouped[key]=s })
  let html=''; let myPfp = getPfp(ME_RAW) || getPfp(ME);
  if(myStories.length>0){ let s=myStories[0]; let seen=viewedStories.includes(s.id); let isClose=(s.audience==='close_friends'||s.is_close_friends); let ringClass = isClose? 'sRing close' : 'sRing'; html+=`<div class="sItem" onclick="openMyStory()"><div class="${ringClass} ${seen?'seen':''}"><div class="sRingInner"><img src="${myPfp}"></div></div><div class="sName">Your Story ${isClose?'💚':''}</div></div>`; } else { html+=`<div class="sItem" onclick="location.href='story-add.html'"><div class="sAddWrap"><img class="sAddImg my-pfp" src="${myPfp}"><div class="sAddPlus">+</div></div><div class="sName">Your Story</div></div>`; }
  Object.values(grouped).forEach(s=>{ let seen=viewedStories.includes(s.id); let isClose=(s.audience==='close_friends'||s.is_close_friends); let ringClass = isClose? 'sRing close' : 'sRing'; html+=`<div class="sItem" onclick="openOtherStory('${s.username}')"><div class="${ringClass} ${seen?'seen':''}"><div class="sRingInner"><img src="${getPfp(s.username)}"></div></div><div class="sName">${displayNameFor(s.username)} ${isClose?'💚':''}</div></div>` })
  bar.innerHTML=html;
}
function openMyStory(){let meLow=cleanUser(ME_RAW);let s=allStories.find(x=> isMyPost(x.username));if(!s) return location.href='story-add.html';if(!PLUS.ghost &&!viewedStories.includes(s.id)){viewedStories.push(s.id);localStorage.setItem('pixoro_viewed_stories',JSON.stringify(viewedStories))}location.href='story-view.html?user='+s.username+(PLUS.ghost?'&ghost=1':'')}
function openOtherStory(u){let s=allStories.find(x=> x.username===u);if(PLUS.ghost){location.href='story-view.html?user='+u+'&ghost=1';return}if(s &&!viewedStories.includes(s.id)){viewedStories.push(s.id);localStorage.setItem('pixoro_viewed_stories',JSON.stringify(viewedStories))}location.href='story-view.html?user='+u}
function renderFeed(){
let html=''; let feedPosts = allPosts;
for(let p of feedPosts){
let lCount=allLikes.filter(l=>l.post_id==p.id).length;let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME_RAW);let isSaved=allSaves.some(s=>s.post_id==p.id);
let likeText = p.hide_likes? '❤️ Like count hidden' : `<span id="likeCount-${p.id}">${lCount}</span> likes`
let commentBtn = p.hide_comments? '' : `<button class="act" onclick="event.stopPropagation();openComment(${p.id})"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>`
let shareText = p.hide_share? '' : `<button class="act" onclick="event.stopPropagation();sharePost(${p.id})"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>`
let mUrl = p.media_url || p.image_url || ''
let isVid = p.media_type=='reel' || p.media_type=='video' || mUrl.includes('.mp4') || mUrl.includes('video')
let mediaHtml = isVid ? `<video class="main" src="${mUrl}" loop muted playsinline autoplay></video>` : `<img class="main" src="${mUrl}" loading="lazy">`
let locHtml = p.location? `<div class="locBadge">📍 ${p.location}</div>` : ''
let songHtml = p.song? `<div class="songBadge">🎵 ${p.song}</div>` : ''
let aiHtml = p.is_ai? `<div class="aiBadge">✨ AI-generated</div>` : ''
html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<b onclick="openProfileFast('${p.username}')" style="cursor:pointer">${displayNameFor(p.username)}</b> ${p.is_pinned?'📌':''}</div><span onclick="openPostMenu(${p.id})" style="cursor:pointer;padding:4px 10px;font-size:20px;font-weight:900">⋮</span></div><div style="position:relative;overflow:hidden" ondblclick="doubleLike(${p.id})" onclick="handleTap(${p.id})">${mediaHtml}${aiHtml}<div id="burst-${p.id}" class="heart-burst">❤</div></div>${locHtml}${songHtml}<div class="actions"><div class="left"><button id="likeBtn-${p.id}" class="act ${isLiked?'liked':''}" onclick="event.stopPropagation();fastLike(${p.id})"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button>${commentBtn}${shareText}</div><button class="act ${isSaved?'saved':''}" onclick="event.stopPropagation();savePost(${p.id})"><svg viewBox="0 0 24 24"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></button></div><div style="padding:0 14px"><b>${likeText}</b><br><b onclick="openProfileFast('${p.username}')" style="cursor:pointer">${displayNameFor(p.username)}</b> ${p.caption||''}</div></div>`
}
document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px;color:#666">No posts - + click panni upload pannu da!</p>'
}
function handleTap(id){let now=Date.now();if(now-lastTap<300){doubleLike(id);}lastTap=now;}
function doubleLike(id){
  let liked=allLikes.some(l=>l.post_id==id && l.username==ME_RAW);
  let burst=document.getElementById('burst-'+id);
  if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show');}
  if(liked) return;
  allLikes.push({post_id:id,username:ME_RAW});
  let btn=document.getElementById('likeBtn-'+id); if(btn) btn.classList.add('liked');
  let c=document.getElementById('likeCount-'+id); if(c) c.innerText=parseInt(c.innerText||'0')+1;
  if(supa) supa.from('likes').insert({post_id:id,username:ME_RAW});
}
function fastLike(id){
  let liked=allLikes.some(l=>l.post_id==id && l.username==ME_RAW);
  let btn=document.getElementById('likeBtn-'+id);
  let c=document.getElementById('likeCount-'+id);
  if(!liked){
    allLikes.push({post_id:id,username:ME_RAW});
    if(btn) btn.classList.add('liked');
    if(c) c.innerText=parseInt(c.innerText||'0')+1;
    let burst=document.getElementById('burst-'+id);
    if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show');}
    if(supa) supa.from('likes').insert({post_id:id,username:ME_RAW});
  }else{
    allLikes=allLikes.filter(l=>!(l.post_id==id && l.username==ME_RAW));
    if(btn) btn.classList.remove('liked');
    if(c) c.innerText=Math.max(0,parseInt(c.innerText||'1')-1);
    if(supa) supa.from('likes').delete().eq('post_id',id).eq('username',ME_RAW);
  }
}
function openPostMenu(postId){
currentMenuPost = allPosts.find(p=> p.id == postId); let p=currentMenuPost; if(!p) return
let userClean=cleanUser(p.username||''); let meClean=cleanUser(ME_RAW); let isMine = isMyPost(p.username)
let box=document.getElementById('postMenuBox')
if(!isMine){box.innerHTML=`<div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 12px"></div><div class="menuItem" onclick="sharePost(${p.id});closePostMenu()">🔗 Share</div><div class="menuItem" onclick="closePostMenu()">🚩 Report</div><div class="menuItem" onclick="closePostMenu()" style="justify-content:center;background:#000;border-radius:12px;margin-top:10px;color:#888">Cancel</div>`}else{box.innerHTML=`<div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 12px"></div><div class="menuItem" onclick="editPost()">✏️ Edit</div><div class="menuItem" onclick="toggleHideLikes()">${p.hide_likes?'👁️ Unhide':'❤️ Hide like count'}</div><div class="menuItem" onclick="toggleHideComments()">${p.hide_comments?'💬 Turn on':'🚫 Turn off commenting'}</div><div class="menuItem" onclick="togglePin()">${p.is_pinned?'📌 Unpin':'📌 Pin'}</div><div class="menuItem" onclick="archivePost()">📦 Archive</div><div class="menuItem delete" onclick="deletePost()">🗑️ Delete</div><div class="menuItem" onclick="closePostMenu()" style="justify-content:center;background:#000;border-radius:12px;margin-top:10px;color:#888">Cancel</div>`}
document.getElementById('postMenu').classList.add('show')
}
function closePostMenu(){document.getElementById('postMenu').classList.remove('show')}
async function editPost(){ showToast('Caption edit - Settings la pannu da'); closePostMenu();}
async function toggleHideLikes(){if(!supa) return; let v=!currentMenuPost.hide_likes;await supa.from('posts').update({hide_likes:v}).eq('id',currentMenuPost.id);currentMenuPost.hide_likes=v;renderFeed();closePostMenu();}
async function toggleHideComments(){if(!supa) return; let v=!currentMenuPost.hide_comments;await supa.from('posts').update({hide_comments:v}).eq('id',currentMenuPost.id);currentMenuPost.hide_comments=v;renderFeed();closePostMenu();}
async function togglePin(){if(!supa) return; let v=!currentMenuPost.is_pinned;await supa.from('posts').update({is_pinned:v}).eq('id',currentMenuPost.id);currentMenuPost.is_pinned=v;closePostMenu();loadAll();}
async function archivePost(){if(!supa) return; await supa.from('posts').update({is_archived:true}).eq('id',currentMenuPost.id);closePostMenu();loadAll();}
async function deletePost(){if(supa) await supa.from('posts').delete().eq('id',currentMenuPost.id);allPosts=allPosts.filter(p=>p.id!=currentMenuPost.id);renderFeed();closePostMenu();showToast('Deleted da Giri!')}
async function savePost(id){let s=allSaves.some(x=>x.post_id==id);if(s){allSaves=allSaves.filter(x=>x.post_id!=id);if(supa) supa.from('saves').delete().eq('post_id',id).eq('username',ME_RAW);}else{allSaves.push({post_id:id});if(supa) supa.from('saves').insert({post_id:id,username:ME_RAW});}renderFeed();}
function sharePost(id){let link=location.origin+'/post.html?id='+id; if(navigator.clipboard){navigator.clipboard.writeText(link); showToast('Link copied da!')}else{showToast(link)}}
async function openComment(id){if(allPosts.find(p=>p.id==id)?.hide_comments){showToast('Commenting off da!');return;}currentPostId=id;document.getElementById('commentModal').style.display='flex';document.getElementById('myCommentPfp').src=getPfp(ME);if(!supa) return; let {data}=await supa.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:false});document.getElementById('commentList').innerHTML=(data||[]).map(c=>`<div style="display:flex;gap:10px;padding:10px 0;align-items:flex-start"><img src="${getPfp(c.username)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0"><div style="flex:1"><b style="font-size:13px">${displayNameFor(c.username)}</b><div style="font-size:13px;margin-top:2px">${c.text}</div></div><span onclick="this.innerText=this.innerText=='♡'?'❤️':'♡'" style="font-size:18px;cursor:pointer">♡</span></div>`).join('')||'No comments'}
function closeComment(){document.getElementById('commentModal').style.display='none'}
async function addComment(){let t=document.getElementById('commentInput').value.trim();if(!t||!currentPostId||!supa)return;await supa.from('comments').insert({post_id:currentPostId,username:ME_RAW,text:t});document.getElementById('commentInput').value='';openComment(currentPostId)}
loadAll()
</script>
</body></html>
