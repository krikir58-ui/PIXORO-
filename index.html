<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PIXORO</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* IMPORTANT PAGE FIX */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    .top-header {
      background: #111;
      color: white;
      padding: 15px;
    }

    .top-header h1 {
      margin: 0;
    }

    .main-content {
      padding: 15px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .post-btn {
      background: #ff6b00;
      color: white;
      font-weight: bold;
      width: 100%;
    }

    #feed img,
    #feed video {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 10px;
    }

    .post {
      background: white;
      margin: 15px 0;
      border-radius: 15px;
      overflow: hidden;
    }

    .post-info {
      padding: 12px;
    }

    .actions {
      padding: 10px;
      display: flex;
      gap: 15px;
    }

    .actions button {
      background: none;
      font-size: 20px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #111;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
    }

    .bottom-nav button {
      background: transparent;
      color: white;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-nav span {
      font-size: 11px;
      margin-top: 3px;
    }

    .profile {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    .avatar {
      font-size: 60px;
    }
  </style>
</head>


<body>

<!-- ================= HEADER ================= -->

<header class="top-header">
  <h1>📸 PIXORO</h1>
</header>
