<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;margin:0}h1{padding:15px;background:linear-gradient(90deg,#ff8a00,#e52e71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:35px}.box{padding:15px}textarea,input{width:100%;padding:12px;background:#111;color:#fff;border-radius:10px;border:1px solid #333;margin-top:10px}button{width:100%;padding:13px;background:#e52e71;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:bold}img{width:100%;border-radius:10px;margin-top:10px}.post{padding:15px;border-top:1px solid #222}</style>
</head>
<body>
<h1>PIXORO</h1>
<div class="box">
<textarea id="t" placeholder="Enna yosikura Giri?"></textarea>
<input type="file" id="f" accept="image/*">
<button onclick="p()">POST 🚀</button>
</div>
<div id="feed"></div>
<script>
function p(){
let txt=document.getElementById('t').value;
let file=document.getElementById('f').files[0];
let d=document.createElement('div');d.className='post';
let im=file?'<img src='+URL.createObjectURL(file)+'>':'';
d.innerHTML='<b>giri 🔥</b><br>'+txt+im+'<br><br>❤️';
document.getElementById('feed').prepend(d);
document.getElementById('t').value='';
}
</script>
</body>
</html>
