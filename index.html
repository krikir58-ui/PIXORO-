<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO 🚀</title>
<style>
  body {
    margin:0; font-family: sans-serif; color: white;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    min-height: 100vh;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .top { background: black; padding: 15px; text-align: center; font-weight: bold; font-size: 22px; letter-spacing: 2px; position: sticky; top:0; z-index:10; }
  .container { max-width: 480px; margin: auto; padding: 15px; }
  .card { background: rgba(0,0,0,0.75); border-radius: 20px; padding: 15px; margin-bottom: 20px; backdrop-filter: blur(10px); }
  .btn-pink { background: #ff2d78; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 16px; }
  input[type="file"] { display: none; }
  .file-label { background: #ff2d78; display: block; text-align: center; padding: 12px; border-radius: 12px; font-weight: bold; }
  #preview { width: 100%; border-radius: 15px; margin-top: 10px; display: none; max-height: 400px; object-fit: cover; }
  .filters { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 5px; }
  .filters button { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; border-radius: 20px; white-space: nowrap; }
  .filters button.active { background: #ff2d78; border-color: #ff2d78; }
  .post-img { width: 100%; border-radius: 15px; margin-top: 10px; }
  .actions { display: flex; justify-content: space-around; margin-top: 10px; font-size: 18px; }
  .actions span { cursor: pointer; user-select: none; }
  .liked { color: #ff2d78; }
  .comment-box { display: flex; gap: 5px; margin-top: 10px; }
  .comment-box input { flex: 1; padding: 8px; border-radius: 20px; border: none; outline: none; }
</style>
</head>
<body>
<div class="top">PIXORO 🚀</div>
<div class="container">

  <div class="card">
    <label for="fileInput" class="file-label">📁 Choose File</label>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview">
    
    <div class="filters" id="filterBox"></div>
    
    <input id="captionInput" placeholder="Caption..." style="width:100%; margin-top:10px; padding:12px; border-radius:10px; border:none; box-sizing: border-box;">
    <br><br>
    <button class="btn-pink" onclick="createPost()">🚀 Post</button>
  </div>

  <div id="feed"></div>
</div>
