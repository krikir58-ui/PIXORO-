<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.post{border-bottom:1px solid #222;background:#000;padding-bottom:12px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.actions{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.actions .left{display:flex;gap:18px;align-items:center}
.actions button{background:none;border:0;cursor:pointer;display:flex;transition:.15s}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding:12px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px}.nav a.active{color:#fff}
.navPlus{width:36px;height:36px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:pointer}
.pfpRing{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:2px;cursor:pointer}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.verifiedBadge{width:16px;height:16px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.followBtn{border:1.5px solid #fff;border-radius:20px;background:#000;color:#fff;padding:5px 18px;font-size:13px;font-weight:600}.followBtn.following{background:#fff;color:#000}
.storyBar{display:flex;gap:12px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #222;background:#000}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:68px;cursor:pointer;position:relative}.sRing{width:64px;height:64px;border-radius:50%;padding:3px;display:flex;align-items:center;justify-content:center}.sRing.public{background:conic-gradient(from 45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}.sRing.close{background:conic-gradient(from 45deg,#00ff66,#00cc44,#00ff66)}.sRing.seen{background:#333}.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2.5px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.sAdd{width:64px;height:64px;border-radius:50%;background:#111;border:2px dashed #333;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}.sAdd::after{content:'+';position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:#0095F6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #000;color:#fff}.sName{font-size:11px;margin-top:4px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.closeBadge{position:absolute;top:0;right:4px;background:#00ff66;color:#000;font-size:8px;font-weight:800;padding:2px 4px;border-radius:10px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.menuItem{padding:14px 20px;border-bottom:1px solid #1f1f1f;cursor:pointer}
</style></head><body>
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><div style="display:flex;gap:15px"><span onclick="openCloseFriend()" style="cursor:pointer">💚</span><span onclick="location.href='notifications.html'" style="font-size:22px">🔔</span></div></div>
<div class="storyBar" id="storyBar"></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#666">Loading...</p></div>
<div style="height:80px"></div>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><div class="navPlus" onclick="openCreate()">+</div><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#161616;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px">Create New</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div onclick="goCreate('post')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">📸</div><div style="margin-top:6px;font-weight:700">Post</div></div><div onclick="goCreate('reel')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🎞️</div><div style="margin-top:6px;font-weight:700">Reels</div></div><div onclick="goCreate('story')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">⭕</div><div style="margin-top:6px;font-weight:700">Story</div></div><div onclick="goCreate('live')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🔴</div><div style="margin-top:6px;font-weight:700">Live</div></div></div><div onclick="closeCreate()" style="margin-top:16px;text-align:center;background:#222;padding:12px;border-radius:12px;color:#aaa">Cancel</div></div></div>

<div id="postMenu" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:flex-end;justify-content:center"><div style="background:#1c1c1c;width:100%;max-width:450px;border-radius:20px 20px 0 0;padding:10px 0 20px;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:8px auto 15px"></div><div id="postMenuOptions"></div><div onclick="closePostMenu()" style="margin:10px 15px;text-align:center;background:#222;padding:12px;border-radius:12px;color:#aaa;cursor:pointer">Cancel</div></div></div>

<div id="profileMenu" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:flex-end;justify-content:center"><div style="background:#1c1c1c;width:100%;max-width:450px;border-radius:20px 20px 0 0;padding:10px 0 20px;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:8px auto 15px"></div><div id="profileMenuOptions"></div><div onclick="closeProfileMenu()" style="margin:10px 15px;text-align:center;background:#222;padding:12px;border-radius:12px;color:#aaa">Cancel</div></div></div>

<div id="cfModal" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;padding:20px"><div style="background:#111;border-radius:15px;padding:15px;max-width:400px;margin:20% auto"><div style="display:flex;justify-content:space-between"><b>💚 Close Friends</b><span onclick="closeCF()">✕</span></div><input id="cfInput" placeholder="Username..." style="width:100%;margin-top:12px;padding:10px;border-radius:10px;border:0;background:#222;color:#fff"><button onclick="addCF()" style="width:100%;margin-top:10px;padding:10px;background:#00ff66;border:0;border-radius:10px;font-weight:700">Add</button><div id="cfList" style="margin-top:12px;font-size:13px;color:#888"></div></div></div>

<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column"><div style="padding:14px;display:flex;justify-content:center;border-bottom:1px solid #222;position:relative"><div style="width:40px;height:4px;background:#333;border-radius:10px"></div><b style="position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:14px">Comments</b><span onclick="closeComment()" style="position:absolute;right:15px;top:10px;font-size:22px">✕</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div><div style="padding:10px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;background:#000"><img src="https://i.pravatar.cc/100?u=Giri" style="width:32px;height:32px;border-radius:50%"><input id="commentInput" placeholder="Add a comment..." style="flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff"><button onclick="addComment()" style="background:none;border:0;color:#0095f6;font-weight:700">Post</button></div></div></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allFollows=[],allSaves=[],allStories=[],allComments=[],allCommentLikes=[],currentPostId=null,curMenuPost=null,curMenuUser=null
function blueTick(){return `<span style="width:16px;height:16px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px"><svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M17 8.5L10.5 15L7 11.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`}
function pfpHtml(u){return `<div class="pfpRing" onclick="openProfileMenu('${u}')"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}
async function loadAll(){let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let {data:likes}=await supa.from('likes').select('*');let {data:follows}=await supa.from('follows').select('*');let {data:saves}=await supa.from('saves').select('*').eq('username',ME);let {data:stories}=await supa.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});allPosts=posts||[];allLikes=likes||[];allFollows=follows||[];allSaves=saves||[];allStories=stories||[];renderStories();renderFeed();loadCF()}
function renderStories(){let bar=document.getElementById('storyBar');let users=[...new Set(allStories.map(s=>s.username))];let html=`<div class="sItem" onclick="location.href='./story-add.html'"><div class="sAdd">👤</div><div class="sName">Your Story</div></div>`;html+=users.map(u=>{let s=allStories.find(x=>x.username===u);let isClose=s.audience==='close_friends';let img=s.image_url||s.media_url||`https://i.pravatar.cc/100?u=${u}`;return `<div class="sItem" onclick="location.href='./story-view.html?user=${encodeURIComponent(u)}'"><div class="sRing ${isClose?'close':'public'}"><div class="sRingInner"><img src="${img}"></div></div><div class="sName">${u}</div>${isClose?'<div class="closeBadge">💚</div>':''}</div>`}).join('');if(!users.length)html+=`<div style="color:#555;display:flex;align-items:center;font-size:12px">No stories 👻</div>`;bar.innerHTML=html}
function renderFeed(){let html='';for(let p of allPosts){let lCount=allLikes.filter(l=>l.post_id==p.id).length;let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME);let isSaved=allSaves.some(s=>s.post_id==p.id);let isMe=p.username===ME;let followBtn=isMe?`<span style="font-size:11px;color:#555">YOU</span>`:`<button class="followBtn ${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'following':''}" onclick="toggleFollow('${p.username}')">${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'Following':'Follow'}</button>`;let likeText=p.hide_likes?(isMe?`${lCount} likes (hidden)`: `Like count hidden`):`${lCount} likes`;let commentBtn=p.comments_off?``:`<button onclick="openComment(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>`;html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<div><b>@${p.username}${isMe?blueTick():''}</b><div style="font-size:11px;color:#777">${allFollows.filter(f=>f.following==p.username).length} followers</div></div></div><div style="display:flex;align-items:center">${followBtn}<span onclick="openPostMenu(${p.id},'${p.username}')" style="font-size:22px;margin-left:12px;cursor:pointer">⋮</span></div></div><img class="main" src="${p.image_url}" ondblclick="likePost(${p.id})"><div class="actions"><div class="left"><button onclick="likePost(${p.id})"><svg viewBox="0 0 24 24" width="28" height="28" fill="${isLiked?'#ff3040':'none'}" stroke="${isLiked?'#ff3040':'#fff'}" stroke-width="2"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button>${commentBtn}<button onclick="sharePost()"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div><button onclick="savePost(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="${isSaved?'#fff':'none'}" stroke="#fff" stroke-width="2"><path d="M19 21L12 16L5 21V5C5 3.89543 5.89543 3 7 3H17C18.1046 3 19 3.89543 19 5V21Z"/></svg></button></div><div style="padding:0 12px"><b>${likeText}</b>${p.comments_off?'<div style="font-size:11px;color:#777">Comments off</div>':''}<br><b>@${p.username}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px">No posts</p>'}
async function likePost(id){let liked=allLikes.some(l=>l.post_id==id&&l.username==ME);if(liked)await supa.from('likes').delete().eq('post_id',id).eq('username',ME);else await supa.from('likes').insert({post_id:id,username:ME});let {data}=await supa.from('likes').select('*');allLikes=data||[];renderFeed()}
async function savePost(id){let saved=allSaves.some(s=>s.post_id==id);if(saved)await supa.from('saves').delete().eq('post_id',id).eq('username',ME);else await supa.from('saves').insert({post_id:id,username:ME});let {data}=await supa.from('saves').select('*').eq('username',ME);allSaves=data||[];renderFeed()}
function sharePost(){if(navigator.share)navigator.share({url:location.href});else prompt('Copy:',location.href)}
async function toggleFollow(u){let a=allFollows.some(f=>f.follower==ME&&f.following==u);if(a)await supa.from('follows').delete().eq('follower',ME).eq('following',u);else await supa.from('follows').insert({follower:ME,following:u});let {data}=await supa.from('follows').select('*');allFollows=data||[];renderFeed()}
function openCreate(){document.getElementById('createSheet').style.display='flex'}function closeCreate(){document.getElementById('createSheet').style.display='none'}function goCreate(t){closeCreate();if(t==='post')location.href='upload.html';if(t==='reel')location.href='reels-upload.html';if(t==='story')location.href='story-add.html';if(t==='live')location.href='live.html'}
// SECRET MENU
function openPostMenu(id,user){curMenuPost=id;curMenuUser=user;let p=allPosts.find(x=>x.id==id);let isOwner=user===ME;let opts='';if(isOwner){opts+=`<div class="menuItem" onclick="deletePost()" style="color:#ff3040;font-weight:700">🗑️ Delete</div>`;opts+=`<div class="menuItem" onclick="toggleHideLikes()">${p.hide_likes?'👁️ Show like count':'🙈 Hide like count'}</div>`;opts+=`<div class="menuItem" onclick="toggleCommentsOff()">${p.comments_off?'💬 Turn on commenting':'🚫 Turn off commenting'}</div>`;opts+=`<div class="menuItem" onclick="editCaption()">✏️ Edit caption</div>`;opts+=`<div class="menuItem" onclick="copyLink()">🔗 Copy link</div>`}else{opts+=`<div class="menuItem" onclick="reportUser('post')" style="color:#ff3040;font-weight:700">🚩 Report</div>`;opts+=`<div class="menuItem" onclick="blockUser()" style="color:#ff3040">⛔ Block @${user}</div>`;opts+=`<div class="menuItem" onclick="hidePost()">🙈 Hide</div>`;opts+=`<div class="menuItem" onclick="copyLink()">🔗 Copy link</div>`}document.getElementById('postMenuOptions').innerHTML=opts;document.getElementById('postMenu').style.display='flex'}
function closePostMenu(){document.getElementById('postMenu').style.display='none'}
async function deletePost(){if(!confirm('Delete panava?'))return;await supa.from('posts').delete().eq('id',curMenuPost);closePostMenu();loadAll()}
async function toggleHideLikes(){let p=allPosts.find(x=>x.id==curMenuPost);await supa.from('posts').update({hide_likes:!p.hide_likes}).eq('id',curMenuPost);closePostMenu();loadAll()}
async function toggleCommentsOff(){let p=allPosts.find(x=>x.id==curMenuPost);await supa.from('posts').update({comments_off:!p.comments_off}).eq('id',curMenuPost);closePostMenu();loadAll()}
function editCaption(){let p=allPosts.find(x=>x.id==curMenuPost);let nc=prompt('New caption:',p.caption||'');if(nc!==null)supa.from('posts').update({caption:nc}).eq('id',curMenuPost).then(()=>{closePostMenu();loadAll()})}
function hidePost(){allPosts=allPosts.filter(x=>x.id!=curMenuPost);renderFeed();closePostMenu()}
function copyLink(){prompt('Copy:',location.href+'?post='+curMenuPost);closePostMenu()}
function openProfileMenu(u){curMenuUser=u;let isOwner=u===ME;let opts='';if(!isOwner){opts+=`<div class="menuItem" onclick="blockUser()" style="color:#ff3040;font-weight:700">⛔ Block @${u}</div>`;opts+=`<div class="menuItem" onclick="reportUser('user')" style="color:#ff3040">🚩 Report @${u}</div>`;opts+=`<div class="menuItem" onclick="location.href='profile.html?user=${u}'">👤 View Profile</div>`;opts+=`<div class="menuItem">🔕 Mute @${u}</div>`}else{opts+=`<div class="menuItem">😎 You da Giri!</div>`}document.getElementById('profileMenuOptions').innerHTML=opts;document.getElementById('profileMenu').style.display='flex'}
function closeProfileMenu(){document.getElementById('profileMenu').style.display='none'}
async function blockUser(){if(!confirm(`Block @${curMenuUser}?`))return;await supa.from('blocks').insert({blocker:ME,blocked:curMenuUser});alert('Blocked!');closePostMenu();closeProfileMenu();allPosts=allPosts.filter(p=>p.username!=curMenuUser);renderFeed()}
async function reportUser(t){let r=prompt('Reason? spam/fake/abusive');if(!r)return;await supa.from('reports').insert({reporter:ME,target_user:curMenuUser,post_id:t==='post'?curMenuPost:null,reason:r});alert('Reported!');closePostMenu();closeProfileMenu()}
async function openComment(id){currentPostId=id;document.getElementById('commentModal').style.display='flex';await loadComments()}
function closeComment(){document.getElementById('commentModal').style.display='none';currentPostId=null}
async function loadComments(){let {data:comments}=await supa.from('comments').select('*').eq('post_id',currentPostId).order('created_at',{ascending:true});let {data:clikes}=await supa.from('comment_likes').select('*');allComments=comments||[];allCommentLikes=clikes||[];let list=document.getElementById('commentList');if(!allComments.length){list.innerHTML=`<p style="text-align:center;color:#666;padding:40px">No comments yet!</p>`;return}list.innerHTML=allComments.map(c=>{let lc=allCommentLikes.filter(l=>l.comment_id==c.id).length;let liked=allCommentLikes.some(l=>l.comment_id==c.id&&l.username==ME);return `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #111"><img src="https://i.pravatar.cc/100?u=${c.username}" style="width:28px;height:28px;border-radius:50%"><div style="flex:1"><b>@${c.username}</b> ${c.text}<div style="font-size:11px;color:#777;margin-top:4px">${lc} likes <span onclick="likeComment(${c.id})" style="margin-left:10px;color:${liked?'#ff3040':'#777'};cursor:pointer">Like</span></div></div></div>`}).join('')}
async function addComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt||!currentPostId)return;await supa.from('comments').insert({post_id:currentPostId,username:ME,text:txt});document.getElementById('commentInput').value='';await loadComments()}
async function likeComment(cId){let liked=allCommentLikes.some(l=>l.comment_id==cId&&l.username==ME);if(liked)await supa.from('comment_likes').delete().eq('comment_id',cId).eq('username',ME);else await supa.from('comment_likes').insert({comment_id:cId,username:ME});await loadComments()}
function openCloseFriend(){document.getElementById('cfModal').style.display='block';loadCF()}function closeCF(){document.getElementById('cfModal').style.display='none'}async function addCF(){let f=document.getElementById('cfInput').value.trim();if(!f)return;await supa.from('close_friends').insert({owner:ME,friend:f});document.getElementById('cfInput').value='';loadCF()}async function loadCF(){let {data}=await supa.from('close_friends').select('*').eq('owner',ME);let list=document.getElementById('cfList');if(!list)return;list.innerHTML=(data||[]).map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span>💚 ${c.friend}</span><span onclick="removeCF('${c.id}')" style="color:#f44">remove</span></div>`).join('')||'No close friends'}async function removeCF(id){await supa.from('close_friends').delete().eq('id',id);loadCF()}
loadAll()
</script>
</body></html>
