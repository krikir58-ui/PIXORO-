<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  *{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
 .insta-font{font-family: 'Grand Hotel', cursive}
  #splash{
    position:fixed; inset:0; background:white; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.6s ease;
  }
 .pixoro-logo{
    width:90px; height:90px; border-radius:22px;
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    display:flex; align-items:center; justify-content:center;
    animation: scaleUp 0.8s ease;
  }
  @keyframes scaleUp{0%{transform:scale(0.6); opacity:0} 100%{transform:scale(1); opacity:1}}
 .story-ring{background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); padding:2px; border-radius:50%}
</style>
</head>
<body class="bg-black md:bg-[#fafafa] flex justify-center">

<!-- ===== 1. SPLASH SCREEN - Instagram Mass Entry ===== -->
<div id="splash">
  <div class="pixoro-logo shadow-xl">
    <i class="fa-solid fa-camera text-white text-[42px]"></i>
  </div>
  <h1 class="insta-font text-[42px] mt-6 tracking-wide">Pixoro</h1>
  <div class="absolute bottom-10 flex flex-col items-center">
    <p class="text-[12px] text-gray-400 tracking-widest">from</p>
    <p class="font-bold text-[16px] mt-1"><span class="text-[#0064e0]">GIRI</span> <span class="bg-clip-text text-transparent bg-gradient-to-r from-[#feda75] via-[#d62976] to-[#4f5bd5]">× Meta</span></p>
  </div>
</div>

<!-- ===== 2. MAIN APP - Instagram UI ===== -->
<div id="mainApp" class="w-full max-w-[470px] bg-white min-h-screen hidden">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white border-b border-[#dbdbdb] px-4 py-2.5 flex justify-between items-center">
    <h1 class="insta-font text-[32px]">Pixoro</h1>
    <div class="flex gap-4 text-[22px]">
      <i class="fa-regular fa-heart"></i>
      <i class="fa-regular fa-paper-plane"></i>
    </div>
  </header>

  <!-- Stories - Like Your Video -->
  <div class="flex gap-4 p-3 overflow-x-auto border-b border-[#efefef] bg-white">
    <div class="flex flex-col items-center gap-1 min-w-[64px]">
      <div class="story-ring"><div class="bg-white p-[2px] rounded-full"><img src="https://i.pravatar.cc/150?u=giri" class="w-[56px] h-[56px] rounded-full object-cover"></div></div>
      <span class="text-[11px]">Your story</span>
    </div>
    <div id="stories" class="flex gap-4"></div>
  </div>

  <!-- Auth - Clean -->
  <div id="authBox" class="m-3 p-4 bg-[#fafafa] border border-[#dbdbdb] rounded-lg">
    <input id="emailInput" value="girikri3@gmail.com" placeholder="Email" class="w-full bg-white border border-[#dbdbdb] rounded-[3px] px-2 py-2 text-[13px] mb-2">
    <input id="passwordInput" type="password" placeholder="Password" class="w-full bg-white border border-[#dbdbdb] rounded-[3px] px-2 py-2 text-[13px] mb-2">
    <div class="flex gap-2">
      <button id="signupBtn" class="flex-1 bg-white border border-[#dbdbdb] font-semibold py-1.5 rounded text-[13px]">Signup</button>
      <button id="loginBtn" class="flex-1 bg-[#0095f6] text-white font-semibold py-1.5 rounded text-[13px]">Login</button>
    </div>
  </div>

  <!-- Upload Bar -->
  <div class="px-4 py-3 flex items-center gap-3 border-b border-[#efefef]">
    <img src="https://i.pravatar.cc/150?u=giri" class="w-8 h-8 rounded-full">
    <input id="captionInput" placeholder="What's on your mind?" class="flex-1 outline-none text-[14px]">
    <label class="cursor-pointer text-[#0095f6]"><i class="fa-solid fa-image"></i><input id="fileInput" type="file" hidden></label>
    <button id="uploadBtn" class="bg-[#0095f6] text-white px-4 py-1 rounded-full text-[12px] font-bold">Post</button>
  </div>

  <!-- Search -->
  <div class="px-4 py-2"><input id="searchInput" placeholder="Search" class="w-full bg-[#efefef] rounded-lg px-3 py-1.5 text-[14px] outline-none"></div>

  <!-- Feed -->
  <div id="feed" class="pb-16"></div>

  <!-- Bottom Nav - Exactly Like Insta -->
  <nav class="fixed bottom-0 w-full max-w-[470px] bg-black md:bg-white text-white md:text-black border-t border-[#222] md:border-[#dbdbdb] flex justify-around py-3 text-[22px] z-40">
    <i class="fa-solid fa-house"></i>
    <i class="fa-solid fa-magnifying-glass"></i>
    <i class="fa-regular fa-square-plus"></i>
    <i class="fa-solid fa-clapperboard"></i>
    <i class="fa-regular fa-user"></i>
  </nav>

</div>

<script>
// === MASS SPLASH LOGIC ===
setTimeout(()=>{
  const splash = document.getElementById('splash');
  splash.style.opacity = '0';
  setTimeout(()=>{
    splash.style.display='none';
    document.getElementById('mainApp').classList.remove('hidden');
    document.body.classList.remove('bg-black');
    document.body.classList.add('bg-[#fafafa]');
  },600)
}, 2200); // 2.2 sec - Instagram maathiri
</script>

<script type="module" src="js/app.js"></script>
<!-- Profile Circle Touch - Full View -->
<div id="profileModal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
  <img id="profileModalImg" class="w-[300px] h-[300px] rounded-full border-4 border-white object-cover">
</div>
<div id="storyModal" class="hidden fixed inset-0 bg-black z-[100] flex items-center justify-center" onclick="this.classList.add('hidden')">
  <img id="storyModalImg" class="w-full max-w-[400px] h-[70vh] object-cover rounded-xl">
</div>
<div id="noti" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-black text-white text-xs px-4 py-2 rounded-full z-[200]">Liked!</div>
</body>
</html>
