<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🔵</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.post{border-bottom:1px solid #222;padding-bottom:10px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%!important;aspect-ratio:1/1!important;object-fit:cover!important;display:block!important}
.actions{padding:10px 12px;display:flex;gap:18px;align-items:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px}.nav a.active{color:#fff}
.pfpRing{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:2px;cursor:pointer;flex-shrink:0}
.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}
.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
/* BLUE TICK + FOLLOW BUTTON STYLE */
.verifiedBadge{width:16px;height:16px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.followBtn{border:1.5px solid #fff;border-radius:20px;background:#000;color:#fff;padding:5px 18px;font-size:13px;font-weight:600;cursor:pointer}
.followBtn.following{background:#fff;color:#000}
@keyframes heartBlast{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
</style></head><body>

<!-- TOP - SEARCH + SETTINGS REMOVE PANNITEN DA - BELL MATTUM -->
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><span onclick="location.href='notifications.html'" style="cursor:pointer;font-size:22px">🔔</span></div>

<div id="feed"><p style="text-align:center;padding:60px;color:#666">Loading Pixoro... 🔵</p></div>
<div style="height:70px"></div>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME='Giri'
let allPosts=[], allLikes=[], allComments=[], allFollows=[]

function blueTick(){return `<span class="verifiedBadge"><svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M17 8.5L10.5 15L7 11.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`}
function isFollowing(u){return allFollows.some(f=>f.follower==ME && f.following==u)}
function pfpHtml(u){return `<div class="pfpRing"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}

async function loadAll(){
  let {data:posts} = await supa.from('posts').select('*').order('created_at',{ascending:false})
  let {data:likes} = await supa.from('likes').select('*')
  let {data:comments} = await supa.from('comments').select('*')
  let {data:follows} = await supa.from('follows').select('*')
  allPosts=posts||[]; allLikes=likes||[]; allComments=comments||[]; allFollows=follows||[]
  renderFeed()
}

function renderFeed(){
  let html=''
  for(let p of allPosts){
    let lCount=allLikes.filter(l=>l.post_id==p.id).length
    let cCount=allComments.filter(c=>c.post_id==p.id).length
    let isMe = p.username===ME
    let followBtn = isMe ? `<span style="font-size:11px;color:#555">YOU</span>` : `<button class="followBtn ${isFollowing(p.username)?'following':''}" onclick="toggleFollow('${p.username}',this)">${isFollowing(p.username)?'Following':'Follow'}</button>`
    
    html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<div><b style="display:flex;align-items:center">@${p.username}${isMe?blueTick():''}</b><div style="font-size:11px;color:#777">${allFollows.filter(f=>f.following==p.username).length} followers</div></div></div>${followBtn}</div><img class="main" src="${p.image_url}"><div style="padding:10px 12px"><b>${lCount} likes</b> • <b style="color:#aaa">${cCount} comments</b><br><b>@${p.username} ${isMe?blueTick():''}</b> ${p.caption||''}</div></div>`
  }
  document.getElementById('feed').innerHTML = html || '<p style="text-align:center;padding:60px;color:#777">No posts da Giri! Upload pannu! 🔵</p>'
}

async function toggleFollow(u,btn){
  let already=isFollowing(u)
  if(already){ await supa.from('follows').delete().eq('follower',ME).eq('following',u) }
  else{ await supa.from('follows').insert({follower:ME,following:u}) }
  let {data} = await supa.from('follows').select('*'); allFollows=data||[]; renderFeed()
}
loadAll()
</script>
</body></html>
