<html lang="en">

*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff}
.header{background:#000;padding:12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
.header h1{color:#ff0050;font-weight:900;letter-spacing:1px}
.container{padding:10px;max-width:500px;margin:auto}
.card{background:#121212;border-radius:15px;padding:12px;margin-bottom:12px;border:1px solid #222}

.btn{width:100%;background:#ff0050;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filters button{padding:8px 16px;border-radius:20px;border:none;background:#222;color:#fff;white-space:nowrap}
.filters button.active{background:#ff0050}

.actions{display:flex;gap:18px;padding:10px 5px;font-size:22px}
.actions span{cursor:pointer}
.liked{color:#ff0050}
