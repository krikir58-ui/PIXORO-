<script>
function showToast(m){let t=document.getElementById('toast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
window.showToast=showToast;
function showChoice(){document.getElementById('choice').classList.add('show')} function hideChoice(){document.getElementById('choice').classList.remove('show')}
let supa=window.supa;function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase();return u||''}
let ME_RAW='',ME='',ME_ID='',ME_PFP='',allPosts=[],allLikes=[],allSaves=[],allStories=[],allFollows=[],allProfiles=[],allViews=[],viewedStories=[],lastTap=0,feedMode='foryou',curMenuPost=null;
function getSupa(){return window.supa||supa} window.getSupa=getSupa;
function profileById(id){return allProfiles.find(x=>String(x.id)===String(id))||null}
function profileByName(n){return allProfiles.find(x=>cleanUser(x.username)===cleanUser(n))||null}
function displayNameFor(u){
  if(!u) return ME_RAW||'user';
  let p=profileById(u)||profileByName(u);
  if(p&&p.username) return cleanUser(p.username);
  let pp=allPosts.find(x=>String(x.user_id)===String(u));
  if(pp&&pp.username) return cleanUser(pp.username);
  if(String(u)===String(ME_ID)) return ME_RAW||'user';
  let cu=cleanUser(u);
  if(cu.length>20) return ME_RAW||'user';
  return cu||ME_RAW||'user';
}
function getRealPfp(u){
  if(!u) return '';
  if(String(u)===String(ME_ID) && ME_PFP && ME_PFP.includes('http') && ME_PFP.length>10) return ME_PFP;
  let p=profileById(u)||profileByName(u);
  let url = p ? (p.avatar_url||p.profile_pic||p.photo_url||'') : '';
  if(url && url.includes('http') && url.length>10) return url;
  if(window._PIXORO_PFP_CACHE){
    let cached = window._PIXORO_PFP_CACHE[cleanUser(displayNameFor(u))] || window._PIXORO_PFP_CACHE[String(u)];
    if(cached) return cached;
  }
  return '';
}
function getPfp(u){ let r=getRealPfp(u); if(r) return r; let uname=displayNameFor(u); let L=avatarLetterFor(u,uname); return 'https://ui-avatars.com/api/?name='+L+'&background=ff5ea8&color=fff&size=200&bold=true'; }
function avatarLetterFor(u, uname){
  let name = cleanUser(uname||'') || cleanUser(displayNameFor(u)||'') || '';
  let onlyLetters = name.replace(/[^a-zA-Z]/g,'');
  let letter = onlyLetters.charAt(0).toUpperCase();
  if(!letter) letter='P';
  return letter;
}
function avatarHtmlHome(u, uname){
  let url=getRealPfp(u);
  let L=avatarLetterFor(u, uname);
  if(url) return `<img src="${url}" onerror="this.outerHTML='<div class=&quot;avaLetterHome&quot;>${L}</div>'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  return `<div class="avaLetterHome">${L}</div>`;
}
function avatarHtmlSmall(u, uname){
  let url=getRealPfp(u);
  let L=avatarLetterFor(u, uname);
  if(url) return `<img src="${url}" onerror="this.outerHTML='<div style=\\'width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ff5ea8,#ff7a00);display:grid;place-items:center;font-weight:900;color:#fff\\'>${L}</div>'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  return `<div style="width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ff5ea8,#ff7a00);display:grid;place-items:center;font-weight:900;color:#fff">${L}</div>`;
}
function pfpErr(el,uname){
  let letter=avatarLetterFor(null, uname);
  el.onerror=null;
  el.src='https://ui-avatars.com/api/?name='+letter+'&background=ff5ea8&color=fff&size=200&bold=true';
}
window.pfpErr=pfpErr;
function isMyPostObj(p){return String(p.user_id)===String(ME_ID)}
function resolveUserId(otherId){
  if(!otherId) return null;
  if(String(otherId).includes('-') && String(otherId).length>20) return String(otherId);
  let pr = profileByName(otherId);
  if(pr) return String(pr.id);
  let pp = allPosts.find(p=>cleanUser(p.username)===cleanUser(otherId) && p.user_id);
  if(pp) return String(pp.user_id);
  return null;
}
function timeAgo(t){
  if(!t) return '';
  let d=new Date(t); let diff=Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return 'now';
  if(diff<3600) return Math.floor(diff/60)+'m';
  if(diff<86400) return Math.floor(diff/3600)+'h';
  if(diff<604800) return Math.floor(diff/86400)+'d';
  return d.toLocaleDateString([],{day:'numeric',month:'short'});
}
function viralScore(p){let likes=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let hours=(Date.now()-new Date(p.created_at||Date.now()).getTime())/3600000;return (likes*10)/(hours+2)}
function setFeedMode(m){feedMode=m;document.getElementById('tabForYou').classList.toggle('active',m=='foryou');document.getElementById('tabFollowing').classList.toggle('active',m=='following');document.getElementById('tabLatest').classList.toggle('active',m=='latest');renderFeed()} window.setFeedMode=setFeedMode;
function getBestMedia(p){
  if(p._from==='reels'){ return {url: p.video_url||p.media_url||'', isVid:true}; }
  let m=(p.media_url||p.video_url||'').toLowerCase().split('?')[0];
  if(m.endsWith('.mp4')||m.endsWith('.mov')||m.endsWith('.webm')||m.endsWith('.m4v')){ return {url: p.media_url||p.video_url, isVid:true}; }
  return {url: p.media_url||p.video_url||'', isVid:false};
}
async function pixoroCheckBell(){

    if(!window.supa || !window.ME_ID) return;
    let {data} = await window.supa.from('notifications').select('id').eq('to_user_id', window.ME_ID).eq('is_read', false).limit(1);
    let dot = document.getElementById('pixoroBellDot');
    if(dot) dot.style.display = (data && data.length) ? 'block' : 'none';
  }catch(e){}
}
window.pixoroCheckBell = pixoroCheckBell;
setInterval(pixoroCheckBell, 15000);
let AUTH_DONE = false;
async function checkLogin(){
  for(let i=0;i<50;i++){ if(window.supa) break; await new Promise(r=>setTimeout(r,200)); }
  supa = window.supa;
  if(!supa){ return; }
  if(AUTH_DONE) return;
  AUTH_DONE = true;
  let {data:{session}} = await supa.auth.getSession();
  if(!session){
    await new Promise(r=>setTimeout(r,800));
    let s2 = await supa.auth.getSession();
    session = s2.data.session;
  }
  if(!session){
    let f=document.getElementById('feed');
    if(f) f.innerHTML='<div style="text-align:center;padding:30px 16px"><p style="font-size:18px;font-weight:900;margin-bottom:8px">Welcome to Pixoro 👋</p><p style="color:#888;font-size:13px;margin-bottom:16px">Login pannu da - Feed Paakalam da</p><button onclick="location.href=\'login.html\'" style="background:#FFD700;color:#000;border:0;padding:13px 28px;border-radius:12px;font-weight:900;font-size:15px">Login / Sign Up ➡️</button></div>';
    return;
  }
  let {data:profile} = await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(profile && profile.username){
    ME_RAW=cleanUser(profile.username);ME_PFP=profile.avatar_url||'';
  } else {
    ME_RAW=cleanUser(session.user.email||'user');ME_PFP='';
  }
  ME=ME_RAW;ME_ID=session.user.id;window.ME=ME_RAW;window.ME_ID=ME_ID;window.ME_RAW=ME_RAW;
  try{ if(window.pixoroLoadFollowing) await window.pixoroLoadFollowing(); }catch(e){ console.log('Follow load fail - Feed continue da'); }
  loadAll();
}
async function loadAll(){
  try{
    supa=getSupa();if(!supa)return;
    let pr={data:[]},po={data:[]},re={data:[]},li={data:[]},vi={data:[]},sa={data:[]},st={data:[]},fo={data:[]};
    try{ pr = await supa.from('profiles').select('*'); }catch(e){}
    try{ po = await supa.from('posts').select('*').order('created_at',{ascending:false}).limit(12); }catch(e){}
    try{ re = await supa.from('reels').select('*').order('created_at',{ascending:false}).limit(12); }catch(e){}
    try{ li = await supa.from('likes').select('*').limit(200); }catch(e){}
    try{ vi = await supa.from('views').select('*').limit(200); }catch(e){}
    try{ sa = await supa.from('saves').select('*').limit(200); }catch(e){}
    try{ st = await supa.from('stories').select('*').order('created_at',{ascending:false}).limit(20); }catch(e){}
    try{ fo = await supa.from('follows').select('*').limit(500); }catch(e){}
    allProfiles=pr.data||[];allLikes=li.data||[];allViews=vi.data||[];allSaves=sa.data||[];allFollows=fo.data||[];
    if(window.PIXORO_FOLLOWING){
      window.PIXORO_FOLLOWING=new Set((allFollows||[]).filter(f=>String(f.follower_id)===String(ME_ID)).map(f=>String(f.following_id)));
      window.PIXORO_ID_TO_NAME = window.PIXORO_ID_TO_NAME || {};
      window.PIXORO_NAME_TO_ID = window.PIXORO_NAME_TO_ID || {};
      (allProfiles||[]).forEach(pp=>{ window.PIXORO_ID_TO_NAME[String(pp.id)] = cleanUser(pp.username); window.PIXORO_NAME_TO_ID[cleanUser(pp.username)] = String(pp.id); });
      window.PIXORO_FOLLOWING_NAMES = new Set([...window.PIXORO_FOLLOWING].map(id=>cleanUser(window.PIXORO_ID_TO_NAME[id]||'')));
    }
    if(window.pixoroRefreshPhotos) window.pixoroRefreshPhotos();
    var merged=[];(po.data||[]).forEach(p=>merged.push({...p,_from:'posts'}));(re.data||[]).forEach(p=>merged.push({...p,_from:'reels'}));
    var seenUrl=new Set(),deduped=[];
    for(let p of merged){
      if(!p.user_id && p.username){
        let pr2 = allProfiles.find(x=>cleanUser(x.username)===cleanUser(p.username));
        if(pr2) p.user_id = pr2.id;
      }
      let prof=profileById(p.user_id);p.username=prof?prof.username:(p.username||'');p.username=cleanUser(p.username);
      p.media_url=p.media_url||p.image||p.image_url||p.video_url||'';
      let raw=(p.media_url||p.video_url||'').trim();if(!raw) continue;if(p.is_archived) continue;
      let u=raw.split('?')[0].split('#')[0].toLowerCase().trim();
      let fileKey=u.includes('/storage/')?u.split('/storage/')[1]:u;
      if(seenUrl.has(u)||seenUrl.has(fileKey)) continue;
      seenUrl.add(u);seenUrl.add(fileKey);deduped.push(p);
    }
    allPosts=deduped;
    allStories=(st.data||[]).map(s=>{let prof=profileById(s.user_id);s.username=prof?prof.username:(s.username||'');s.username=cleanUser(s.username);return s}).filter(s=>{if(!s.expires_at)return true;return new Date(s.expires_at)>new Date()});
    renderStories();renderFeed();
    if(window.pixoroPaintAllFollowBtns) window.pixoroPaintAllFollowBtns();
    let el=document.getElementById('navPfp');
    if(el){
      if(ME_PFP && ME_PFP.includes('http')) el.src=ME_PFP; else el.src=getPfp(ME_ID);
    }
    let cp=document.getElementById('myCommentPfpWrap'); if(cp) cp.innerHTML = avatarHtmlSmall(ME_ID, ME_RAW);
    pixoroCheckBell();
  }catch(e){
    console.log('Load Error',e);
    let feed=document.getElementById('feed');
    if(feed && (!allPosts || !allPosts.length)){
      feed.innerHTML='<p style="text-align:center;padding:40px;color:#888">No posts da</p>';
    }
  }
}
function renderStories(){let bar=document.getElementById('storyBar');let myStories=allStories.filter(s=>String(s.user_id)===String(ME_ID));let otherStories=allStories.filter(s=>String(s.user_id)!==String(ME_ID));let grouped={};otherStories.forEach(s=>{let key=s.user_id||cleanUser(s.username||'');if(!grouped[key])grouped[key]=s});let html='';if(myStories.length>0){let s=myStories[0];html+=`<div class="sItem" onclick="openMyStory()"><div class="sRing"><div class="sRingInner">${avatarHtmlSmall(ME_ID, ME_RAW)}</div></div><div class="sName">Your Story</div></div>`}else{html+=`<div class="sItem" onclick="location.href='story-upload.html'"><div class="sAddWrap"><div style="width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #ff5ea8">${avatarHtmlSmall(ME_ID, ME_RAW)}</div><div class="sAddPlus">+</div></div><div class="sName">Your Story</div></div>`}Object.values(grouped).forEach(s=>{let nm=displayNameFor(s.user_id||s.username);html+=`<div class="sItem" onclick="openOtherStory('${s.user_id||s.username}')"><div class="sRing"><div class="sRingInner">${avatarHtmlSmall(s.user_id||s.username, nm)}</div></div><div class="sName">${nm}</div></div>`});bar.innerHTML=html}
function openMyStory(){let s=allStories.find(x=>String(x.user_id)===String(ME_ID));if(!s)return location.href='story-upload.html';location.href='story-view.html?u='+(s.user_id||s.username)} function openOtherStory(u){location.href='story-view.html?u='+u}

function copyPostLink(id){navigator.clipboard.writeText(location.origin+'/index.html?id='+id);showToast('Link Copied');}
window.openPostMenu=openPostMenu; window.closePostMenu=closePostMenu; window.copyPostLink=copyPostLink;
function renderFeed(){let feedPosts=[...allPosts];if(feedMode=='foryou'){feedPosts.sort((a,b)=>viralScore(b)-viralScore(a))}else if(feedMode=='following'){let followingIds=window.PIXORO_FOLLOWING && window.PIXORO_FOLLOWING.size ? window.PIXORO_FOLLOWING : new Set(allFollows.filter(f=>String(f.follower_id)===String(ME_ID)).map(f=>String(f.following_id)));feedPosts=feedPosts.filter(p=>String(p.user_id)===String(ME_ID)||followingIds.has(String(p.user_id)));feedPosts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}else if(feedMode=='latest'){feedPosts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}let html='';for(let idx=0;idx<feedPosts.length;idx++){let p=feedPosts[idx];let ownerKey=p.user_id;if(!ownerKey || String(ownerKey).length<20){let pr=profileByName(p.username);if(pr) ownerKey=pr.id;else ownerKey=p.username}let lCount=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let isLiked=allLikes.some(l=>String(l.post_id)==String(p.id)&&(l.user_id==ME_ID));let isSaved=allSaves.some(s=>String(s.post_id)==String(p.id)&&(s.user_id==ME_ID));let best=getBestMedia(p);let mUrl=best.url||'';let mediaHtml=best.isVid?(idx===0?`<video class="main" src="${mUrl}" loop muted playsinline preload="metadata"></video>`:`<video class="main" data-src="${mUrl}" loop muted playsinline preload="none"></video>`):`<img class="main" src="${mUrl}" loading="${idx===0?'eager':'lazy'}" decoding="async" onerror="this.src='https://via.placeholder.com/400x500/111/fff?text=Pixoro'">`;let isMe=String(ownerKey)===String(ME_ID);let followName=cleanUser(p.username || displayNameFor(ownerKey) || '');let isFollowing = window.PIXORO_FOLLOWING_NAMES ? window.PIXORO_FOLLOWING_NAMES.has(followName) : (window.PIXORO_FOLLOWING ? window.PIXORO_FOLLOWING.has(String(ownerKey)) : allFollows.some(f=>String(f.follower_id)===String(ME_ID)&&String(f.following_id)===String(ownerKey)));let followBtnHtml='';if(!isMe && followName && followName!=='null' && followName!=='undefined' && followName!=='user'){followBtnHtml=`<button data-follow-user="${followName}" data-follow-username="${followName}" class="followBtnPost ${isFollowing?'following':''}" onclick="event.stopPropagation();pixoroToggleFollow('${followName}',this)">${isFollowing?'Following':'Follow'}</button>`}let uname=displayNameFor(ownerKey);html+=`<div class="post" id="post-${p.id}"><div class="postTop"><div style="display:flex;align-items:center;gap:10px"><div class="pfpRing" onclick="location.href='profile.html?u=${ownerKey}'"><div class="pfpInner">${avatarHtmlHome(ownerKey, uname)}</div></div><div style="display:flex;align-items:center;gap:8px"><b onclick="location.href='profile.html?u=${ownerKey}'">${uname}</b><span style="font-size:11px;color:#888">• ${timeAgo(p.created_at)}</span>${followBtnHtml}</div>${p._from==='reels'?'<span style="font-size:10px;background:#ff5ea8;padding:2px 6px;border-radius:10px">REEL</span>':''}</div><span onclick="event.stopPropagation();openPostMenu('${p.id}','${ownerKey}')" style="cursor:pointer;font-size:20px;padding:4px 8px">⋮</span></div><div style="position:relative" onclick="handleTap('${p.id}')">${mediaHtml}<div id="burst-${p.id}" class="heart-burst">❤</div></div><div class="actions"><div class="left"><button id="likeBtn-${p.id}" class="act ${isLiked?'liked':''}" onclick="fastLike('${p.id}')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button><button class="act" onclick="openComment('${p.id}')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button><button class="act" onclick="copyPostLink('${p.id}')"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div><button class="act ${isSaved?'saved':''}" onclick="savePost('${p.id}',this)"><svg viewBox="0 0 24 24"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></button></div><div style="padding:0 14px"><b><span id="likeCount-${p.id}">${lCount}</span> likes</b><br><b onclick="location.href='profile.html?u=${ownerKey}'" style="cursor:pointer">${uname}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:40px;color:#888">No posts da</p>';observeHomeVideos();if(window.pixoroPaintAllFollowBtns) window.pixoroPaintAllFollowBtns();}
let _homeIO=null;
function observeHomeVideos(){let vs=document.querySelectorAll('.post video.main');if(_homeIO) _homeIO.disconnect();_homeIO=new IntersectionObserver(es=>{es.forEach(e=>{let v=e.target;if(e.isIntersecting){if(!v.src && v.dataset.src){v.src=v.dataset.src;v.load();}v.muted=true;v.play().catch(()=>{})}else{v.pause()}})},{threshold:0.4,rootMargin:'200px 0px'});vs.forEach(v=>_homeIO.observe(v))}
function handleTap(id){let now=Date.now();if(now-lastTap<300){doubleLike(id);lastTap=0}else{lastTap=now}}
async function doubleLike(id){
  let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}
  let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));if(liked)return;
  allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});
  let btn=document.getElementById('likeBtn-'+id);if(btn)btn.classList.add('liked');
  let c=document.getElementById('likeCount-'+id);if(c)c.innerText=parseInt(c.innerText||'0')+1;
  supa=getSupa();if(!supa) return;
  let {error}=await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW});
  if(error) console.log('SERVER SAVE FAIL:',error.message);
  else {
    console.log('SERVER SAVE OK - like');
    let p = allPosts.find(x=> String(x.id)===String(id));
    if(p && window.pixoroSendNotification){ await window.pixoroSendNotification(p.user_id, 'like', id, 'liked your post'); }
  }
}
async function fastLike(id){
  let liked=allLikes.some(l=>String(l.post_id)==String(id)&&(l.user_id==ME_ID));
  let btn=document.getElementById('likeBtn-'+id);let c=document.getElementById('likeCount-'+id);
  supa=getSupa();
  if(!liked){
    allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(btn)btn.classList.add('liked');if(c)c.innerText=parseInt(c.innerText||'0')+1;
    let burst=document.getElementById('burst-'+id);if(burst){burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show')}
    if(supa){
      let {error}=await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW});
      if(!error){
        let p = allPosts.find(x=> String(x.id)===String(id));
        if(p && window.pixoroSendNotification){ await window.pixoroSendNotification(p.user_id, 'like', id, 'liked your post'); }
      }
    }
  } else {
    allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&(l.user_id==ME_ID)));if(btn)btn.classList.remove('liked');if(c)c.innerText=Math.max(0,parseInt(c.innerText||'1')-1);
    if(supa){ let {error}=await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID); if(error) console.log('SERVER SAVE FAIL:',error.message); }
  }
}
window.toggleFollow = window.pixoroToggleFollow;
window.toggleF = window.pixoroToggleFollow;
async function savePost(id,btn){
  supa=getSupa(); let s=allSaves.some(x=>String(x.post_id)==String(id)&&(x.user_id==ME_ID));
  if(s){
    allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&(x.user_id==ME_ID))); if(btn) btn.classList.remove('saved');
    if(supa){ let {error}=await supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID); if(error) console.log('SERVER SAVE FAIL:',error.message); else console.log('SERVER SAVE OK - unsave'); }
  } else {
    allSaves.push({post_id:id,user_id:ME_ID,username:ME_RAW}); if(btn) btn.classList.add('saved');
    if(supa){ let {error}=await supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW}); if(error) console.log('SERVER SAVE FAIL:',error.message); else console.log('SERVER SAVE OK - save'); }
  }
}

async function openComment(id){document.getElementById('commentModal').style.display='flex';supa=getSupa();if(!supa)return;let {data}=await supa.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:false});document.getElementById('commentList').innerHTML=(data||[]).map(c=>{let nm=displayNameFor(c.user_id||c.username);return `<div style="display:flex;gap:10px;padding:10px 0"><div style="width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0">${avatarHtmlSmall(c.user_id||c.username, nm)}</div><div><b>${nm}</b><div>${c.text}</div></div></div>`}).join('')||'';window.currentPostId=id}
function closeComment(){document.getElementById('commentModal').style.display='none'}
async function addComment(){
  supa=getSupa();let t=document.getElementById('commentInput').value.trim();if(!t||!window.currentPostId||!supa)return;
  let {error}=await supa.from('comments').insert({post_id:window.currentPostId,user_id:ME_ID,username:ME_RAW,text:t});
  if(error) console.log('SERVER SAVE FAIL:',error.message);
  else {
    console.log('SERVER SAVE OK - comment');
    let p = allPosts.find(x=> String(x.id)===String(window.currentPostId));
    if(p && window.pixoroSendNotification){ await window.pixoroSendNotification(p.user_id, 'comment', window.currentPostId, 'commented: "'+t+'"'); }

  document.getElementById('commentInput').value='';openComment(window.currentPostId)
}
function checkMiniUpload(){
  let up=new URLSearchParams(location.search);
  let uploading=up.get('uploading');
  let media=up.get('media');
  if(!uploading || !media) return;
  let box=document.getElementById('miniBox');
  if(!box) return;
  box.style.display='flex';
  document.getElementById('miniImg').src=media;
  document.getElementById('miniPct').innerText='10%';
  document.getElementById('miniFill').style.width='10%';
  document.getElementById('miniTxt').innerText='Mella Upload Aaguthu da - Feed Paakalam da';
  let tries=0;
  let iv=setInterval(async ()=>{
    tries++;
    let pct=Math.min(90, 10 + tries*15);
    document.getElementById('miniFill').style.width=pct+'%';
    document.getElementById('miniPct').innerText=pct+'%';
    try{
      let s=getSupa();
      if(s){
        let {data}=await s.from('posts').select('id').eq('media_url',media).limit(1);
        if(data && data.length){
          clearInterval(iv);
          document.getElementById('miniFill').style.width='100%';
          document.getElementById('miniPct').innerText='100%';
          document.getElementById('miniTxt').innerText='Done da 🔥 - Reel Feed la Irukku da';
          showToast('Reel Upload Done da 🔥');
          setTimeout(()=>{box.style.display='none';},2500);
          if(typeof loadAll==='function') loadAll();
          return;
        }
      }
    }catch(e){}
    if(tries>10){
      clearInterval(iv);
      document.getElementById('miniFill').style.width='100%';
      document.getElementById('miniPct').innerText='100%';
      document.getElementById('miniTxt').innerText='Done da 🔥';
      setTimeout(()=>{box.style.display='none';},2000);
    }
  },1200);
}
