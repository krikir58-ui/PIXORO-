<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0066">
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;margin:0;padding:20px}
h1{color:#ff0066;text-align:center}
.card{background:#1a1a1a;padding:15px;border-radius:12px;margin:10px 0;border:1px solid #ff006633}
button{background:#ff0066;color:white;border:none;padding:10px 20px;border-radius:8px;width:100%;font-weight:bold}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white;box-sizing:border-box;margin-bottom:10px}
#posts{margin-top:20px}
</style>
</head>
<body>
<h1>PIXORO 🚀</h1>
<div class="card">
<input id="postInput" placeholder="Enna yosikura Giri?">
<button onclick="addPost()">Post Pannu</button>
</div>
<div id="posts"></div>

<script>
let posts = JSON.parse(localStorage.getItem('pixoro_posts') || '[]');

function showPosts(){
  let html = '';
  for(let i=posts.length-1; i>=0; i--){
    html += `<div class="card">${posts[i]}</div>`;
  }
  document.getElementById('posts').innerHTML = html;
}

function addPost(){
  let val = document.getElementById('postInput').value;
  if(!val) return;
  posts.push(val);
  localStorage.setItem('pixoro_posts', JSON.stringify(posts));
  document.getElementById('postInput').value='';
  showPosts();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

showPosts();
</script>
</body>
</html>
