<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXORO</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

body{
    padding-bottom:70px;
}

/* HEADER */
.header{
    height:60px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#168fe8;
}

.header button{
    border:0;
    background:none;
    font-size:24px;
    margin-left:12px;
}

/* MAIN */
.container{
    width:100%;
    max-width:600px;
    margin:auto;
}

/* PAGES */
.page{
    display:none;
}

.page.active{
    display:block;
}

/* CREATE */
.create{
    background:white;
    padding:12px;
    margin-bottom:10px;
}

.create-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#168fe8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.create-input{
    flex:1;
    border:1px solid #ddd;
    border-radius:25px;
    padding:12px 15px;
    outline:none;
}

/* POST */
.post{
    background:white;
    margin-bottom:10px;
}

.post-head{
    display:flex;
    align-items:center;
    padding:12px;
    gap:10px;
}

.user{
    flex:1;
}

.user b{
    font-size:15px;
}

.user small{
    display:block;
    color:#777;
    margin-top:3px;
}

.more{
    border:0;
    background:none;
    font-size:22px;
}

.post-photo{
    width:100%;
    height:380px;
    background:linear-gradient(135deg,#168fe8,#7b4ce2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:18px;
    padding:8px 12px 2px;
}

.actions button{
    border:0;
    background:none;
    font-size:27px;
    cursor:pointer;
}

.like.liked{
    color:red;
}

.likes{
    padding:3px 12px;
    font-weight:bold;
}

.caption{
    padding:5px 12px 12px;
}

.comments{
    padding:0 12px 5px;
}

.comment{
    padding:5px 0;
    font-size:14px;
}

.comment-box{
    display:flex;
    border-top:1px solid #eee;
}

    flex:1;
    min-width:0;
    border:0;
