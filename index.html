<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Story - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;height:100vh;overflow:hidden;font-family:sans-serif}
.bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:10}
.b{height:3px;background:rgba(255,255,255,.3);flex:1;border-radius:2px;overflow:hidden}
.b div{height:100%;background:#fff;width:0%;transition:width.1s}
.top{position:absolute;top:20px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.user{display:flex;align-items:center;gap:8px}
.user img{width:32px;height:32px;border-radius:50%}
.close{font-size:22px;cursor:pointer;padding:8px}
.view{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.view img,.view video{max-width:100%;max-height:100vh;object-fit:contain}
.tap{position:absolute;top:0;bottom:0;width:50%;z-index:5}
.left{left:0}.right{right:0}
</style></head><body>
<div class="bar" id="pBar"></div>
<div class="top"><div class="user"><img id="uPic" src=""><b id="uName"></b><span id="time"></span></div><span class="close" onclick="location.href='./index.html'">✕</span></div>
<div class="view" id="view"></div>
<div class="tap left" onclick="prev()"></div>
<div class="tap right" onclick="next()"></div>
<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const user = new URLSearchParams(location.search).get('user')
document.getElementById('uName').innerText=user
document.getElementById('uPic').src=`https://i.pravatar.cc/100?u=${user}`
let stories=[], cur=0, timer=null, prog=0
async function load(){
 if(!user){ document.getElementById('view').innerHTML='<p>No user</p>'; return }
 let {data, error}=await supa.from('stories').select('*').eq('username',user).gt('expires_at', new Date().toISOString()).order('created_at',{ascending:true})
 if(error){ document.getElementById('view').innerHTML='<p>Error: '+error.message+'</p>'; return }
 stories=data||[]
 if(stories.length==0){ document.getElementById('view').innerHTML=`<div style="text-align:center"><p>No active story for @${user}</p><br><a href="./index.html" style="color:#0095f6">Go Home</a></div>`; return }
 let bar=document.getElementById('pBar'); bar.innerHTML=stories.map((_,i)=>`<div class="b"><div id="b${i}"></div></div>`).join('')
 show(0)
}
function show(i){
 cur=i; if(cur<0) cur=0; if(cur>=stories.length){ location.href='./index.html'; return }
 let s=stories[cur]
 let imgUrl = s.image_url || s.media_url
 let view=document.getElementById('view')
 if((s.media_type||'image')==='video'){
   view.innerHTML=`<video src="${imgUrl}" autoplay playsinline></video>`
 } else {
   view.innerHTML=`<img src="${imgUrl}" style="filter:${s.filter||'none'}">`
 }
 document.getElementById('time').innerText=' • '+new Date(s.created_at).toLocaleTimeString()
 prog=0; clearInterval(timer)
 timer=setInterval(()=>{
   prog+=1
   document.getElementById(`b${cur}`).style.width=prog+'%'
   if(prog>=100){ clearInterval(timer); next() }
 },50)
 for(let j=0;j<stories.length;j++){
   let el=document.getElementById(`b${j}`)
   if(j<cur) el.style.width='100%'
   if(j>cur) el.style.width='0%'
 }
}
function next(){ if(cur < stories.length-1) show(cur+1); else location.href='./index.html' }
function prev(){ if(cur>0) show(cur-1); else show(0) }
load()
</script>
</body></html>
