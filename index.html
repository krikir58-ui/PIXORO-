<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V2 - Like Comment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;text-align:center;margin:0}
h1{color:#FFD700;letter-spacing:5px;margin:12px 0 3px;font-size:26px}
.sub{color:#00ff88;font-size:9px;letter-spacing:2px;margin-bottom:12px}
.box{background:#111;border:1px solid #333;padding:13px;border-radius:14px;margin-bottom:10px;text-align:left}
.box h3{color:#FFD700;margin:0 0 8px;font-size:15px}
input{width:100%;padding:10px;margin-bottom:7px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:11px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.feed{display:none}
.pfp{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle;margin-right:7px}
.big-pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;display:block;margin:0 auto 8px}
.post{background:#111;border:1px solid #333;padding:11px;border-radius:14px;margin:11px 0}
.action{display:flex;gap:8px;margin:8px 0}
.action button{flex:1;padding:8px;font-size:13px;border-radius:20px}
.like-btn{background:#222;color:#fff;border:1px solid #333}
.like-btn.liked{background:#ff0040;color:#fff;border-color:#ff0040}
.comment-box{background:#0a0a0a;border-radius:10px;padding:8px;margin-top:8px}
.comment{font-size:13px;padding:4px 0;border-bottom:1px solid #222}
.comment b{color:#FFD700}
.c-input{display:flex;gap:6px;margin-top:6px}
.c-input input{flex:1;margin:0}
.c-input button{width:auto;padding:8px 14px;border-radius:20px;font-size:12px}
#cropModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:999;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.crop-box{width:300px;height:300px;overflow:hidden;position:relative;border:3px solid #FFD700;border-radius:50%;background:#222;touch-action:none}
.crop-box.post-mode{border-radius:12px;width:300px;height:380px}
.crop-box img{position:absolute;top:0;left:0;cursor:move;max-width:none;user-select:none}
</style>
</head>
<body>
<h1>PIXORO V1</h1><div class="sub">LIKE COMMENT - INSTA MAARI DA GIRI 🔥</div>

<div id="authDiv">
<div class="box"><h3>Signup</h3><input id="su_user" placeholder="giri"><input id="su_pass" type="password" placeholder="Password"><button onclick="signupUser()">Signup</button></div>
<div class="box"><h3>Login</h3><input id="li_user" placeholder="giri"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div>
</div>

<div id="feedDiv" class="feed">
<div class="box" style="text-align:center">
<img id="myPfp" class="big-pfp" src="https://via.placeholder.com/90">
<h3 style="text-align:center">Welcome <span id="uName"></span> 👑</h3>
<input type="file" id="pfpFile" accept="image/*" onchange="openCropper(this,'pfp')" style="display:none">
<button onclick="document.getElementById('pfpFile').click()" style="background:#222;color:#00ff88;border:1px solid #333;font-size:12px">DP Change Pannu 📸</button>
<button onclick="logoutUser()" style="background:#111;color:#ff4444;margin-top:6px;border:1px solid #333;font-size:11px">Logout</button>
</div>
<div class="box">
<h3>Post Pannu Da 📸</h3>
<input type="file" id="imgFile" accept="image/*" onchange="openCropper(this,'post')" style="display:none">
<button onclick="document.getElementById('imgFile').click()" style="background:#222;color:#FFD700;border:1px dashed #FFD700;margin-bottom:8px">📁 Gallery la irunthu Photo Edu Da</button>
<img id="preview" style="width:100%;border-radius:12px;display:none;margin:8px 0;max-height:350px;object-fit:cover">
<input id="cap" placeholder="Caption - Enna matter da?">
<button onclick="createPost()">Post Podu Da 🔥</button>
</div>
<div id="posts">Loading... ⏳</div>
</div>

<div id="cropModal">
<h3 style="color:#FFD700" id="cropTitle">Ajes Pannu Da</h3>
<div id="cropContainer" class="crop-box"><img id="cropImg" src=""></div>
<input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" oninput="applyZoom()" style="width:300px;margin-top:12px">
<div style="margin-top:10px"><button onclick="doCrop()" style="background:#00ff88;width:auto;padding:9px 20px;border-radius:20px">OK ✅</button>
<button onclick="closeCropper()" style="background:#222;color:#fff;width:auto;padding:9px 20px;border-radius:20px;margin-left:6px">Cancel</button></div>
<p style="color:#666;font-size:11px">Drag panni zoom panni set pannu da!</p>
</div>
<canvas id="c" style="display:none"></canvas>

<script>
const SUPABASE_URL = "https://yecpltndhlzfjplzhcpm.supabase.co";
const SUPABASE_KEY = "sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedFile=null,cropMode='pfp',currentScale=1,posX=0,posY=0,isDrag=false,startX,startY,imgOrigW,imgOrigH;
function signupUser(){ let u=su_user.value.trim().toLowerCase(),p=su_pass.value.trim(); if(!u||!p) return alert("Poduda"); sb.from('users').insert([{username:u,password:p}]).then(e=>{ if(e.error&&!e.error.message.includes('duplicate')) return alert(e.error.message); localStorage.setItem('pix_user',u); location.reload();});}
function loginUser(){ let u=li_user.value.trim().toLowerCase(); sb.from('users').select('*').eq('username',u).single().then(e=>{ if(e.error) return alert("User illa"); localStorage.setItem('pix_user',u); location.reload();});}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){ let u=localStorage.getItem('pix_user'); if(!u) return; authDiv.style.display='none'; feedDiv.style.display='flex'; feedDiv.style.flexDirection='column'; uName.innerText=u; loadMyPfp(u); loadPosts();}
async function loadMyPfp(u){ let {data}=await sb.from('users').select('profile_pic').eq('username',u).single(); if(data?.profile_pic) myPfp.src=data.profile_pic; }
function openCropper(input,mode){ cropMode=mode; let file=input.files[0]; if(!file) return; let r=new FileReader(); r.onload=e=>{ cropImg.src=e.target.result; cropContainer.className=mode==='pfp'?'crop-box':'crop-box post-mode'; cropTitle.innerText=mode==='pfp'?'DP Ajes Pannu':'Post Ajes Pannu'; cropModal.style.display='flex'; setTimeout(()=>initCropper(),100); }; r.readAsDataURL(file); }
function initCropper(){ let img=cropImg; imgOrigW=img.naturalWidth; imgOrigH=img.naturalHeight; let box=cropContainer,bw=box.clientWidth,bh=box.clientHeight; let scale=Math.max(bw/imgOrigW,bh/imgOrigH); currentScale=scale; posX=(bw-imgOrigW*scale)/2; posY=(bh-imgOrigH*scale)/2; zoomRange.value=scale; zoomRange.min=scale*0.8; zoomRange.max=scale*3; applyTransform(); setupDrag(); }
function applyTransform(){ cropImg.style.width=(imgOrigW*currentScale)+'px'; cropImg.style.height=(imgOrigH*currentScale)+'px'; cropImg.style.left=posX+'px'; cropImg.style.top=posY+'px'; }
function applyZoom(){ currentScale=parseFloat(zoomRange.value); applyTransform(); }
function setupDrag(){ let img=cropImg; let getPos=e=> e.touches? {x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; img.onmousedown=img.ontouchstart=e=>{isDrag=true; let p=getPos(e); startX=p.x-posX; startY=p.y-posY; e.preventDefault();}; window.onmousemove=window.ontouchmove=e=>{if(!isDrag) return; let p=getPos(e); posX=p.x-startX; posY=p.y-startY; applyTransform();}; window.onmouseup=window.ontouchend=()=>{isDrag=false;}; }
function closeCropper(){ cropModal.style.display='none'; pfpFile.value=""; imgFile.value=""; }
function doCrop(){ let box=cropContainer,img=cropImg,canvas=document.getElementById('c'),ctx=canvas.getContext('2d'); let bw=box.clientWidth,bh=box.clientHeight; if(cropMode==='pfp'){canvas.width=500;canvas.height=500;} else {canvas.width=800;canvas.height=1000;} let sx=(-posX)/currentScale,sy=(-posY)/currentScale,sW=bw/currentScale,sH=bh/currentScale; ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,sx,sy,sW,sH,0,0,canvas.width,canvas.height); canvas.toBlob(blob=>{ if(cropMode==='pfp'){ myPfp.src=URL.createObjectURL(blob); uploadPfpBlob(blob);} else { preview.src=URL.createObjectURL(blob); preview.style.display='block'; selectedFile=blob;} closeCropper();},'image/jpeg',0.92); }
async function uploadPfpBlob(blob){ let u=localStorage.getItem('pix_user'),fname="pfp_"+u+"_"+Date.now()+".jpg"; let {error}=await sb.storage.from('profile-pics').upload(fname,blob,{upsert:true}); if(error) return alert(error.message); let {data}=sb.storage.from('profile-pics').getPublicUrl(fname); await sb.from('users').update({profile_pic:data.publicUrl}).eq('username',u); alert("DP OK da! 👑"); }
async function createPost(){ let cap=document.getElementById('cap').value.trim(),u=localStorage.getItem('pix_user'); if(!selectedFile) return alert("Photo select pannu"); let fname=Date.now()+"_post.jpg"; let f=new File([selectedFile],"post.jpg",{type:"image/jpeg"}); let {error}=await sb.storage.from('post-images').upload(fname,f); if(error) return alert(error.message); let {data}=sb.storage.from('post-images').getPublicUrl(fname); await sb.from('posts').insert([{username:u,image_url:data.publicUrl,caption:cap}]); alert("Post OK da!"); cap.value=""; preview.style.display='none'; selectedFile=null; loadPosts(); }

async function loadPosts(){
 let u=localStorage.getItem('pix_user');
 let {data:posts}=await sb.from('posts').select('*').order('id',{ascending:false});
 if(!posts||posts.length==0){ document.getElementById('posts').innerHTML="<p style='color:#666'>No posts yet da - Nee first post podu da Giri!</p>"; return;}
 let {data:users}=await sb.from('users').select('username,profile_pic');
 let {data:likes}=await sb.from('likes').select('*');
 let {data:comments}=await sb.from('comments').select('*').order('id',{ascending:true});
 let userMap={}; (users||[]).forEach(x=>userMap[x.username]=x.profile_pic);
 let h='';
 posts.forEach(p=>{
  let pfp=userMap[p.username]||'https://via.placeholder.com/40';
  let postLikes=(likes||[]).filter(l=>l.post_id==p.id);
  let postComments=(comments||[]).filter(c=>c.post_id==p.id);
  let iLiked=postLikes.some(l=>l.username==u);
  h+=`<div class="post">
   <img class="pfp" src="${pfp}"><b>@${p.username}</b>
   <br><br><img src="${p.image_url}" style="width:100%;border-radius:10px">
   <p style="margin:8px 0">${p.caption||''}</p>
   <div class="action">
    <button class="like-btn ${iLiked?'liked':''}" onclick="likePost(${p.id})">${iLiked?'❤️':'🤍'} ${postLikes.length} Like</button>
    <button class="like-btn" onclick="document.getElementById('cbox-${p.id}').focus()">💬 ${postComments.length} Comment</button>
   </div>
   <div class="comment-box">
    ${postComments.map(c=>`<div class="comment"><b>@${c.username}</b> ${c.comment}</div>`).join('')}
    <div class="c-input"><input id="cbox-${p.id}" placeholder="Comment pannu da..."><button onclick="addComment(${p.id})" style="background:#FFD700">Send</button></div>
   </div>
  </div>`;
 });
 document.getElementById('posts').innerHTML=h;
}
async function likePost(postId){
 let u=localStorage.getItem('pix_user');
 let {data}=await sb.from('likes').select('*').eq('post_id',postId).eq('username',u).single();
 if(data){ await sb.from('likes').delete().eq('id',data.id); } else { await sb.from('likes').insert([{post_id:postId,username:u}]); }
 loadPosts();
}
async function addComment(postId){
 let inp=document.getElementById('cbox-'+postId); let txt=inp.value.trim(); if(!txt) return;
 let u=localStorage.getItem('pix_user');
 await sb.from('comments').insert([{post_id:postId,username:u,comment:txt}]);
 inp.value=""; loadPosts();
}
checkUser();
</script>
</body>
</html>
