Save

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yecpltndhlzfjplzhcpm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;

let currentProfile = null;

let profileCache = new Map();


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    const {
      data
    } =
    await db.auth.getSession();


    if(data.session){

      currentUser =
        data.session.user;

      await startApp();

    }else{

      showAuth();

    }


    db.auth.onAuthStateChange(
      async function(
        event,
        session
      ){

        if(session){

          currentUser =
            session.user;

          await startApp();

        }else{

          currentUser = null;

          currentProfile = null;

          profileCache.clear();

          showAuth();

        }

      }
    );

  }
);


/* =========================================================
   AUTH
========================================================= */

function showAuth(){

  document
    .getElementById("authPage")
    .classList.remove("hidden");


  document
    .getElementById("app")
    .classList.add("hidden");

}


async function signup(){

  const name =
    document
      .getElementById("authName")
      .value
      .trim();


  const username =
    document
      .getElementById("authUsername")
      .value
      .trim()
      .toLowerCase();


  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("authPassword")
      .value;


  const msg =
    document.getElementById("authMsg");


  if(
    !name ||
    !username ||
    !email ||
    !password
  ){

    msg.textContent =
      "Fill all fields.";

    return;

  }


  if(password.length < 6){

    msg.textContent =
      "Password must be at least 6 characters.";

    return;

  }


  msg.textContent =
    "Creating account...";


  const {
    data,
    error
  } =
  await db.auth.signUp({

    email:email,

    password:password

  });


  if(error){

    msg.textContent =
      error.message;

    return;

  }


  if(!data.user){

    msg.textContent =
      "Signup failed.";

    return;

  }


  const {
    error:profileError
  } =
  await db
    .from("profiles")
    .upsert({

      id:data.user.id,

      name:name,

      username:username,

      avatar_url:"",

      bio:""

    });


  if(profileError){

    msg.textContent =
      profileError.message;

    return;

  }


  msg.textContent =
    "Account created successfully!";


  /*
    If Supabase email confirmation
    is enabled, user must confirm email.
  */

  if(!data.session){

    msg.textContent =
      "Account created. Check your email to confirm.";

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("authPassword")
      .value;


  const msg =
    document.getElementById("authMsg");


  if(!email || !password){

    msg.textContent =
      "Enter email and password.";

    return;

  }


  msg.textContent =
    "Logging in...";


  const {
    error
  } =
  await db.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    msg.textContent =
      error.message;

    return;

  }


  msg.textContent =
    "Login successful!";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await db.auth.signOut();

}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

  document
    .getElementById("authPage")
    .classList.add("hidden");


  document
    .getElementById("app")
    .classList.remove("hidden");


  await loadMyProfile();

  await loadProfileCounts();

  await loadFeed();

}


/* =========================================================
   PROFILE
========================================================= */

async function getProfile(userId){

  if(!userId)
    return {};


  if(profileCache.has(userId)){

    return profileCache.get(userId);

  }


  const {
    data,
    error
  } =
  await db
    .from("profiles")
    .select(
      "id,name,username,avatar_url,bio"
    )
    .eq(
      "id",
      userId
    )
    .maybeSingle();


  if(error){

    console.log(
      "Profile error:",
      error.message
    );

    return {};

  }


  const profile =
    data || {};


  profileCache.set(
    userId,
    profile
  );


  return profile;

}


async function loadMyProfile(){

  if(!currentUser)
    return;


  const {
    data,
    error
  } =
  await db
    .from("profiles")
    .select(
      "id,name,username,avatar_url,bio"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.log(error);

    return;

  }


  currentProfile =
    data;


  if(!currentProfile){

    const emailName =
      currentUser.email
      ? currentUser.email.split("@")[0]
      : "user";


    const fallback = {

      id:currentUser.id,

      name:emailName,

      username:emailName.toLowerCase(),

      avatar_url:"",

      bio:""

    };


    const {
      data:newProfile,
      error:newError
    } =
    await db
      .from("profiles")
      .upsert(fallback)
      .select()
      .single();


    if(newError){

      console.log(
        newError.message
      );

      return;

    }


    currentProfile =
      newProfile;

  }


  profileCache.set(
    currentUser.id,
    currentProfile
  );


  renderMyProfile();

}


function renderMyProfile(){

  if(!currentProfile)
    return;


  const name =
    currentProfile.name ||
    currentProfile.username ||
    "User";


  const username =
    currentProfile.username ||
    "user";


  document
    .getElementById("myName")
    .textContent =
      name;


  document
    .getElementById("myUsername")
    .textContent =
      "@" + username;


  document
    .getElementById("myBio")
    .textContent =
      currentProfile.bio || "";


  const avatar =
    document.getElementById(
      "myAvatar"
    );


  avatar.src =
    currentProfile.avatar_url ||
    "https://via.placeholder.com/100";

}


/* =========================================================
   EDIT PROFILE
========================================================= */

function openEditProfile(){

  if(!currentProfile)
    return;


  document
    .getElementById("editName")
    .value =
      currentProfile.name || "";


  document
    .getElementById("editUsername")
    .value =
      currentProfile.username || "";


  document
    .getElementById("editAvatar")
    .value =
      currentProfile.avatar_url || "";


  document
    .getElementById("editBio")
    .value =
      currentProfile.bio || "";


  document
    .getElementById(
      "editProfileModal"
    )
    .classList.remove("hidden");

}


function closeEditProfile(){

  document
    .getElementById(
      "editProfileModal"
    )
    .classList.add("hidden");

}


async function saveProfile(){

  const name =
    document
      .getElementById("editName")
      .value
      .trim();


  const username =
    document
      .getElementById("editUsername")
      .value
      .trim()
      .toLowerCase();


  const avatar_url =
    document
      .getElementById("editAvatar")
      .value
      .trim();


  const bio =
    document
      .getElementById("editBio")
      .value
      .trim();

const is_private = 
    document
      .getElementById("editPrivate")
      .checked;
  if(!name || !username){

    alert(
      "Name and username are required."
    );

    return;

  }


  const {
    error
  } =
  await db
  .from("profiles")
  .update({
        name:name,
        username:username,
        avatar_url:avatar_url,
        bio:bio,
        is_private:is_private
      })
      .eq(
        "id",
        currentUser.id
      );

  if(error){

    alert(error.message);

    return;

  }


  profileCache.delete(
    currentUser.id
  );


  await loadMyProfile();


  closeEditProfile();


  alert(
    "Profile updated!"
  );

}


/* =========================================================
   CREATE POST
========================================================= */

function openCreate(){

  document
    .getElementById(
      "createModal"
    )
    .classList.remove("hidden");

}


function closeCreate(){

  document
    .getElementById(
      "createModal"
    )
    .classList.add("hidden");


  document
    .getElementById(
      "postMsg"
    )
    .textContent = "";

}


async function createPost(){

  if(!currentUser){

    alert("Please login.");

    return;

  }


  const file =
    document
      .getElementById("postImage")
      .files[0];


  const caption =
    document
      .getElementById("postCaption")
      .value
      .trim();


  const msg =
    document.getElementById(
      "postMsg"
    );


  if(!file){

    msg.textContent =
      "Select an image.";

    return;

  }


  if(!file.type.startsWith("image/")){

    msg.textContent =
      "Please select an image file.";

    return;

  }


  msg.textContent =
    "Uploading...";


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    currentUser.id +
    "_" +
    Date.now() +
    "." +
    extension;


  const {
    error:uploadError
  } =
  await db
    .storage
    .from("Post-images")
    .upload(
      fileName,
      file,
      {
        upsert:false
      }
    );


  if(uploadError){

    msg.textContent =
      uploadError.message;

    return;

  }


  const {
    data:publicData
  } =
  db
    .storage
    .from("Post-images")
    .getPublicUrl(
      fileName
    );


  const image_url =
    publicData.publicUrl;


  const {
    error:postError
  } =
  await db
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      image_url:image_url,

      caption:caption

    });


  if(postError){

    msg.textContent =
      postError.message;

    return;

  }


  msg.textContent =
    "Posted successfully!";


  document
    .getElementById(
      "postImage"
    )
    .value = "";


  document
    .getElementById(
      "postCaption"
    )
    .value = "";


  await loadFeed();


  setTimeout(
    closeCreate,
    700
  );

}


/* =========================================================
   LOAD FEED
   IMPORTANT:
   NO profiles(...) EMBED HERE
========================================================= */

async function loadFeed(){

  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML =
    '<div class="loading">Loading...</div>';


  const {
    data,
    error
  } =
  await db
    .from("posts")
    .select(
      "id,user_id,image_url,caption,created_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    feed.innerHTML =
      `<div class="card">
        Error: ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  if(!data || data.length === 0){

    feed.innerHTML =
      '<div class="empty">No posts yet.</div>';

    return;

  }


  feed.innerHTML = "";


  for(
    const post of data
  ){

    await renderPost(
      post,
      feed
    );

  }

}


/* =========================================================
   RENDER POST
   PROFILE IS LOADED SEPARATELY
   This fixes relationship error.
========================================================= */

async function renderPost(
  post,
  container
){

  const profile =
    await getProfile(
      post.user_id
    );


  const name =
    profile.name ||
    profile.username ||
    "User";


  const username =
    profile.username ||
    "user";


  const avatar =
    profile.avatar_url ||
    "https://via.placeholder.com/100";


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  card.id =
    "post-" +
    post.id;


  const isMine =
    post.user_id ===

  const liked =

    );


  const saved =
    await hasSave(
      post.id
    );


  const following =
    post.user_id ===
    currentUser.id

    : await isFollowing(
        post.user_id
      );


  const likeCount =
    await countRows(
      "likes",
      "post_id",
      post.id
    );


  const commentCount =
    await countRows(
      "comments",
      "post_id",
      post.id
    );


  const viewCount =
    await countRows(
      "views",
      "post_id",
      post.id
    );


  card.innerHTML = `

    <div class="profile-head">

      <img
        class="avatar"
        src="${escapeAttr(avatar)}">

      <div>

        <div class="user-name">
          ${escapeHtml(name)}
        </div>

        <div class="username">
          @${escapeHtml(username)}
        </div>

      </div>

      ${
        !isMine
        ?
        `
        <button
          class="follow-btn ${
            following
            ? "following"
            : ""
          }"
          onclick="toggleFollow(
            '${post.user_id}',
            this
          )">

          ${
            following
            ? "Following"
            : "Follow"
          }

        </button>
        `
        :
        ""
      }

    </div>


    ${
      post.image_url
      ?
      `
      <img
        class="post-image"
        src="${escapeAttr(
          post.image_url
        )}"
        loading="lazy">
      `
      :
      ""
    }


    ${
      post.caption
      ?
      `
      <div class="caption">
        ${escapeHtml(
          post.caption
        )}
      </div>
      `
      :
      ""
    }


    <div
      class="small"
      style="margin-top:8px">

      ${formatDate(
        post.created_at
      )}

    </div>


    <div class="actions">

      <button
        class="${
          liked
          ? "active"
          : ""
        }"
        onclick="toggleLike(
          '${post.id}',
          this
        )">

        ❤️ ${likeCount}

      </button>


      <button
        onclick="toggleComments(
          '${post.id}'
        )">

        💬 ${commentCount}

      </button>


      <button
        class="${
          saved
          ? "active"
          : ""
        }"
        onclick="toggleSave(
          '${post.id}',
          this
        )">

        🔖

      </button>


      <button
        onclick="sharePost(
          '${post.id}'
        )">

        📤 Share

      </button>


      <button>

        👁 ${viewCount}

      </button>


      ${
        isMine
        ?
        `
        <button
          class="danger"
          onclick="deletePost(
            '${post.id}'
          )">

          🗑 Delete

        </button>
        `
        :
        ""
      }

    </div>


    <div
      id="comments-${post.id}"
      class="comment-box hidden">

      <div
        id="commentList-${post.id}">

        Loading comments...

      </div>


      <div
        style="
          display:flex;
          gap:5px;
          margin-top:10px
        ">

        <input
          id="commentInput-${post.id}"
          placeholder="Write a comment..."
          style="margin:0">


        <button
          class="primary"
          style="
            width:auto;
            margin:0;
            padding:10px 15px
          "
          onclick="addComment(
            '${post.id}'
          )">

          Send

        </button>

      </div>

    </div>

  `;


  container.appendChild(
    card
  );


  await addView(
    post.id
  );

}


/* =========================================================
   LIKE
========================================================= */

async function hasLike(
  postId
){

  const {
    data
  } =
  await db
    .from("likes")
    .select("post_id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  return !!data;

}


async function toggleLike(
  postId,
  button
){

  const liked =
    await hasLike(
      postId
    );


  if(liked){

    const {
      error
    } =
    await db
      .from("likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(error){

      alert(error.message);

      return;

    }

  }else{

    const {
      error
    } =
    await db
      .from("likes")
      .insert({

        post_id:postId,

        user_id:
          currentUser.id

      });


    if(error){

      alert(error.message);

      return;

    }

  }


  await loadFeed();

}


/* =========================================================
   COMMENTS
========================================================= */

async function toggleComments(
  postId
){

  const box =
    document.getElementById(
      "comments-" +
      postId
    );


  box.classList.toggle(
    "hidden"
  );


  if(
    !box.classList.contains(
      "hidden"
    )
  ){

    await loadComments(
      postId
    );

  }

}


async function loadComments(
  postId
){

  const list =
    document.getElementById(
      "commentList-" +
      postId
    );


  const {
    data,
    error
  } =
  await db
    .from("comments")
    .select(
      "id,comment,created_at,user_id"
    )
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    list.innerHTML =
      `<div class="small">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      '<div class="small">No comments yet.</div>';

    return;

  }


  let html = "";


  for(
    const c of data
  ){

    const p =
      await getProfile(
        c.user_id
      );


    const n =
      p.name ||
      p.username ||
      "User";


    html += `

      <div class="comment">

        <b>
          ${escapeHtml(n)}
        </b>

        ${escapeHtml(
          c.comment
        )}

      </div>

    `;

  }


  list.innerHTML =
    html;

}


async function addComment(
  postId
){

  const input =
    document.getElementById(
      "commentInput-" +
      postId
    );


  const comment =
    input.value.trim();


  if(!comment)
    return;


  const {
    error
  } =
  await db
    .from("comments")
    .insert({

      post_id:postId,

      user_id:
        currentUser.id,

      comment:comment

    });


  if(error){

    alert(error.message);

    return;

  }


  input.value = "";


  await loadComments(
    postId
  );


  await loadFeed();

}

/* =========================================================
   SHARE
========================================================= */

async function sharePost(
  postId
){

  const url =
    location.href.split("#")[0] +
    "#post-" +
    postId;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:"PIXORO",

        text:
          "Check this PIXORO post",

        url:url

      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied!"
      );

    }catch(e){

      prompt(
        "Copy this link:",
        url
      );

    }

  }

}


/* =========================================================
   DELETE POST
========================================================= */

async function deletePost(
  postId
){

  if(
    !confirm(
      "Delete this post?"
    )
  ){

    return;

  }


  const {
    data:post,
    error:postError
  } =
  await db
    .from("posts")
    .select(
      "image_url"
    )
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();


  if(postError){

    alert(
      postError.message
    );

    return;

  }


  if(post && post.image_url){

    try{

      const marker =
        "/Post-images/";


      const parts =
        post.image_url.split(
          marker
        );


      if(parts.length > 1){

        const path =
          decodeURIComponent(
            parts[1]
          );


        await db
          .storage
          .from("Post-images")
          .remove([
            path
          ]);

      }

    }catch(e){

      console.log(e);

    }

  }


  const {
    error
  } =
  await db
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    alert(
      error.message
    );

    return;

  }


  await loadFeed();


  if(
    !document
      .getElementById(
        "profilePage"
      )
      .classList.contains(
        "hidden"
      )
  ){

    await loadMyPosts();

  }

}

/* =========================================================
   SEARCH
========================================================= */

async function searchPosts(){

  const q =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(!q){

    await loadFeed();

    return;

  }


  const {
    data:profiles,
    error:profileError
  } =
  await db
    .from("profiles")
    .select("id")
    .or(
      "username.ilike.%" +
      q +
      "%,name.ilike.%" +
      q +
      "%"
    );


  if(profileError){

    document
      .getElementById(
        "feed"
      )
      .innerHTML =
      `<div class="card">
        ${escapeHtml(
          profileError.message
        )}
      </div>`;

    return;

  }


  if(
    !profiles ||
    profiles.length === 0
  ){

    document
      .getElementById(
        "feed"
      )
      .innerHTML =
      '<div class="empty">No user found.</div>';

    return;

  }


  const ids =
    profiles.map(
      p => p.id
    );


  const {
    data,
    error
  } =
  await db
    .from("posts")
    .select(
      "id,user_id,image_url,caption,created_at"
    )
    .in(
      "user_id",
      ids
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML = "";


  if(error){

    feed.innerHTML =
      `<div class="card">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    feed.innerHTML =
      '<div class="empty">No posts found.</div>';

    return;

  }


  for(
    const post of data
  ){

    await renderPost(
      post,
      feed
    );

  }

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

async function showPage(
  page
){

  const home =
    document.getElementById(
      "homePage"
    );


  const profile =
    document.getElementById(
      "profilePage"
    );


  const homeNav =
    document.getElementById(
      "homeNav"
    );


  const profileNav =
    document.getElementById(
      "profileNav"
    );


  if(page === "home"){

    home.classList.remove(
      "hidden"
    );

    profile.classList.add(
      "hidden"
    );


    homeNav.classList.add(
      "active"
    );

    profileNav.classList.remove(
      "active"
    );


    await loadFeed();

  }else{

    home.classList.add(
      "hidden"
    );

    profile.classList.remove(
      "hidden"
    );


    homeNav.classList.remove(
      "active"
    );

    profileNav.classList.add(
      "active"
    );


    await loadProfileCounts();

    /*
      IMPORTANT:
      Do NOT call showPage('profile')
      from loadMyPosts().
    */

    await loadMyPosts();

  }

}


/* =========================================================
   COUNT
========================================================= */

async function countRows(
  table,
  column,
  value
){

  const {
    count,
    error
  } =
  await db
    .from(table)
    .select(
      "*",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      column,
      value
    );


  if(error){

    console.log(
      "Count error:",
      error.message
    );

    return 0;

  }


  return count || 0;

}


/* =========================================================
   HELPERS
========================================================= */

function formatDate(
  date
){

  if(!date)
    return "";


  return new Date(date)
    .toLocaleString();

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}
