<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:470px;min-height:100vh;background:#fff;position:relative}
#splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2px;border-radius:50%}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #efefef;display:flex;justify-content:space-between;padding:10px 12px}
.stories{display:flex;gap:12px;padding:10px;overflow-x:auto;border-bottom:1px solid #efefef}
.post{border-bottom:1px solid #efefef}
.icons{display:flex;gap:14px;font-size:22px;padding:10px 12px}
.counts{padding:0 12px 10px;font-size:14px;font-weight:600}
.bottom{position:fixed;bottom:0;width:100%;max-width:470px;background:#000;color:#fff;display:flex;justify-content:space-around;padding:12px 0;font-size:20px;z-index:10}
#noti{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:12px;padding:6px 14px;border-radius:20px;z-index:100;display:none}
.modal{position:fixed;inset:0;z-index:50;display:none}.modal.on{display:flex}
</style>
</head><body>
<div id="splash"><div class="logo">📸</div></div>
<div id="app">
<div class="top"><b>PIXORO 📸</b><div>❤️ ✈️</div></div>
<div class="stories" id="stories"></div>
<div style="display:flex;gap:8px;padding:10px;border-bottom:1px solid #efefef"><img src="https://i.pravatar.cc/80?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="quickCap" placeholder="What's on mind? @mention" style="flex:1;border:0;outline:none;font-size:14px"><button onclick="openUpload()" style="background:#0095f6;color:#fff;border:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700">Post</button></div>
<div id="feed" style="padding-bottom:60px"></div>
<div class="bottom"><span>🏠</span><span>🔍</span><span onclick="openUpload()" style="border:1px solid #fff;padding:2px 10px;border-radius:6px">+</span><span>🎬</span><span>👤</span></div>
<div id="uploadModal" class="modal" style="background:#fff;flex-direction:column"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeUpload()">✕</span><b>New post</b><span onclick="shareNow()" style="color:#0095f6;font-weight:700">Share</span></div><div style="flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative" onclick="document.getElementById('fileInput').click()"><img id="previewImg" style="display:none;width:100%;height:100%;object-fit:contain"><p id="noPhoto" style="color:#fff;opacity:.6;font-size:13px">Tap + to select photo</p></div><textarea id="captionInput" placeholder="Caption @mention #tag" style="padding:10px;border:0;outline:none;font-size:14px;border-top:1px solid #efefef" rows="2"></textarea></div>
<div id="profileModal" class="modal" style="background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:20px" onclick="this.classList.remove('on')"><img id="profileModalImg" style="width:280px;height:280px;border-radius:50%;border:4px solid #fff"></div>
<div id="noti"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>
<script>
let posts=JSON.parse(localStorage.getItem('pixoro_posts')||'[]');
let likes=JSON.parse(localStorage.getItem('pixoro_likes')||'{}');
let follows=JSON.parse(localStorage.getItem('pixoro_follows')||'{}');
let views=JSON.parse(localStorage.getItem('pixoro_views')||'{}');
let storyViews=JSON.parse(localStorage.getItem('pixoro_sviews')||'{}');
if(posts.length==0){posts=[{id:1,img:'https://picsum.photos/400/400?random=1',caption:'PIXORO speed mass da @whitezzz__04 🔥',user:'girikri',likes:128,views:542,time:'now'}];}
function renderFeed(){
 const f=document.getElementById('feed');
 f.innerHTML=posts.map(p=>{
  const v=(views[p.id]||p.views||0)+1; views[p.id]=v; localStorage.setItem('pixoro_views',JSON.stringify(views));
  const isL=likes[p.id]; const isF=follows[p.user];
  return `<div class="post">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px">
   <div style="display:flex;gap:8px;align-items:center" onclick="openProfile('https://i.pravatar.cc/80?u=${p.user}')"><div class="ring"><img loading="eager" src="https://i.pravatar.cc/80?u=${p.user}" style="width:32px;height:32px;border-radius:50%;background:#fff;padding:2px"></div><div><div style="font-size:14px;font-weight:600">${p.user} <span style="color:#0095f6;font-size:11px">${isF?'• Following':'• Follow'}</span></div><div style="font-size:10px;color:#888">${p.time} • ${v} views</div></div></div>
   <span onclick="toggleFollow('${p.user}')">⋯</span>
  </div>
  <img loading="eager" src="${p.img}" style="width:100%;aspect-ratio:1;object-fit:cover" ondblclick="likePost(${p.id})">
  <div class="icons"><span onclick="likePost(${p.id})">${isL?'❤️':'🤍'}</span><span>💬</span><span onclick="sharePost()">✈️</span><span style="margin-left:auto" onclick="savePost(${p.id})">🔖</span></div>
  <div class="counts"><span id="likeCount-${p.id}">${p.likes + (isL?1:0)} likes</span> • <span>${v} views</span> • <span>${(storyViews[p.user]||0)+12} story views</span><br><span style="font-weight:400"><b>${p.user}</b> ${p.caption}</span>
  <div style="margin-top:6px;display:flex;gap:6px"><button onclick="toggleFollow('${p.user}')" style="font-size:11px;border:1px solid #ddd;padding:4px 10px;border-radius:20px;background:${isF?'#000':'#fff'};color:${isF?'#fff':'#000'}">${isF?'Following':'Follow'}</button><button onclick="likePost(${p.id})" style="font-size:11px;border:1px solid #ddd;padding:4px 10px;border-radius:20px">Like ❤️</button><button onclick="sharePost()" style="font-size:11px;border:1px solid #ddd;padding:4px 10px;border-radius:20px">Share</button></div>
  </div></div>`
 }).join('');
 localStorage.setItem('pixoro_views',JSON.stringify(views));
}
function renderStories(){
 const s=document.getElementById('stories');
 const users=['whitezzz__04','don_deepak_k_','sweety_sw'];
 s.innerHTML=users.map(u=>{
  const sv=storyViews[u]||Math.floor(Math.random()*200)+50;
  return `<div style="display:flex;flex-direction:column;align-items:center;min-width:60px" onclick="openStory('${u}')"><div class="ring"><img src="https://i.pravatar.cc/80?u=${u}" style="width:56px;height:56px;border-radius:50%;background:#fff;padding:2px"></div><span style="font-size:10px;margin-top:4px">${u.slice(0,8)}</span><span style="font-size:9px;color:#888">${sv} views</span></div>`
 }).join('');
}
window.likePost=(id)=>{ likes[id]=!likes[id]; localStorage.setItem('pixoro_likes',JSON.stringify(likes)); renderFeed(); showNoti(likes[id]?'❤️ Liked • '+(posts.find(p=>p.id==id).likes+1)+' likes':'Unliked'); };
window.toggleFollow=(u)=>{ follows[u]=!follows[u]; localStorage.setItem('pixoro_follows',JSON.stringify(follows)); renderFeed(); showNoti(follows[u]?'Following '+u:'Unfollowed'); };
window.sharePost=()=>{ navigator.clipboard.writeText(location.href); showNoti('🔗 Link copied • Share count +1'); };
window.savePost=()=>showNoti('Saved 🔖');
window.openProfile=(img)=>{ document.getElementById('profileModalImg').src=img; document.getElementById('profileModal').classList.add('on'); };
window.openStory=(u)=>{ storyViews[u]=(storyViews[u]||50)+1; localStorage.setItem('pixoro_sviews',JSON.stringify(storyViews)); showNoti(`👁️ ${u} story • ${storyViews[u]} views`); renderStories(); };
window.openUpload=()=>document.getElementById('uploadModal').classList.add('on');
window.closeUpload=()=>document.getElementById('uploadModal').classList.remove('on');
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ window._img=ev.target.result; document.getElementById('previewImg').src=ev.target.result; document.getElementById('previewImg').style.display='block'; document.getElementById('noPhoto').style.display='none'; openUpload(); }; r.readAsDataURL(f); });
window.shareNow=()=>{ const cap=document.getElementById('captionInput').value||document.getElementById('quickCap').value||'Mass post'; const img=window._img||document.getElementById('previewImg').src; if(!img || img=='') return alert('Photo select pannu da!'); posts.unshift({id:Date.now(), img, caption:cap, user:'girikri', likes:0, views:1, time:'now'}); localStorage.setItem('pixoro_posts',JSON.stringify(posts)); closeUpload(); renderFeed(); showNoti('Posted 🚀'); window._img=null; };
function showNoti(t){ const n=document.getElementById('noti'); n.textContent=t; n.style.display='block'; setTimeout(()=>n.style.display='none',1800); }
// SPEED - render instantly then hide splash in 300ms
renderFeed(); renderStories();
setTimeout(()=>{ const s=document.getElementById('splash'); s.style.opacity='0'; s.style.transition='opacity.2s'; setTimeout(()=>s.remove(),200); },300);
</script></body></html>
