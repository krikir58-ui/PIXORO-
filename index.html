<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#5b4cff">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f5ff;color:#222;padding-bottom:80px}
button{border:0;cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.card{background:#fff;border-radius:16px;margin-bottom:15px;padding:15px;box-shadow:0 2px 10px #0000000d}
.hidden{display:none!important}
.auth{max-width:420px;margin:60px auto;padding:20px}
.primary{width:100%;background:#5b4cff;color:#fff;padding:13px;border-radius:10px;margin-top:5px}
.secondary{width:100%;background:#eee;color:#222;padding:13px;border-radius:10px;margin-top:8px}
.top{background:#fff;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0001}
.logo{font-size:24px;font-weight:bold;color:#5b4cff}
.page{max-width:650px;margin:auto;padding:15px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd}
.avatar.big{width:75px;height:75px}
.profile-head{display:flex;align-items:center;gap:12px}
.user-name{font-weight:bold}
.username{color:#777;font-size:13px}
.follow-btn{margin-left:auto;padding:8px 15px;border-radius:9px;background:#5b4cff;color:white}
.follow-btn.following{background:#eee;color:#222}
.post-image{width:100%;max-height:600px;object-fit:cover;border-radius:12px;margin-top:12px}
.caption{margin-top:10px}
.actions{display:flex;gap:5px;margin-top:12px;border-top:1px solid #eee;padding-top:10px;flex-wrap:wrap}
.actions button{background:none;padding:7px 5px;color:#555;font-size:14px}
.actions button.active{color:#5b4cff;font-weight:bold}
.comment{background:#f5f5f8;padding:9px;border-radius:9px;margin-top:6px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 10px #0001;z-index:30}
.nav button{background:none;font-size:13px;color:#555}
.nav button.active{color:#5b4cff;font-weight:bold}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}
.modal-box{width:100%;max-width:500px;max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close{background:#eee;border-radius:50%;width:35px;height:35px;font-size:20px}
.stats{display:flex;gap:25px;margin-top:15px}
.loading,.empty{text-align:center;padding:30px;color:#777}
.danger{background:#ffebeb!important;color:#d00!important}
.small{color:#777;font-size:12px}
.report-reasons button{width:100%;text-align:left;background:#f5f5f8;padding:12px;border-radius:10px;margin-bottom:8px;color:#222}
</style>
</head>
<body>
<div id="authPage" class="auth"><div class="card"><h1 style="text-align:center;color:#5b4cff;margin-bottom:20px">PIXORO</h1><input id="authName" placeholder="Name"><input id="authUsername" placeholder="Username"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><button class="primary" onclick="signup()">Create Account</button><button class="secondary" onclick="login()">Login</button><p id="authMsg" class="small" style="margin-top:12px;text-align:center"></p></div></div>
<div id="app" class="hidden"><div class="top"><div class="logo">PIXORO</div><button onclick="logout()" style="background:#eee;padding:9px 13px;border-radius:9px">Logout</button></div><main class="page"><section id="homePage"><div class="card"><button class="primary" onclick="openCreate()">+ Create Post</button><div style="margin-top:10px;background:#e8f5e9;padding:10px;border-radius:8px;font-size:12px;color:#2e7d32">🔒 Safe Mode ON - Thappana post ah 🚩 Report pannunga</div></div><input id="searchInput" style="margin-bottom:12px" placeholder="Search username..." oninput="searchPosts()"><div id="feed"><div class="loading">Loading...</div></div></section><section id="profilePage" class="hidden"><div class="card"><div class="profile-head"><img id="myAvatar" class="avatar big" src="https://via.placeholder.com/100"><div><div id="myName" class="user-name">User</div><div id="myUsername" class="username">@username</div></div></div><div id="myBio" style="margin-top:12px"></div><div class="stats"><div><b id="myPosts">0</b><span>Posts</span></div><div><b id="myFollowers">0</b><span>Followers</span></div><div><b id="myFollowing">0</b><span>Following</span></div></div><div style="display:flex;gap:8px;margin-top:15px"><button onclick="openEditProfile()" style="flex:1;padding:10px;border-radius:9px;background:#eee">Edit Profile</button><button onclick="loadMyPosts()" style="flex:1;padding:10px;border-radius:9px;background:#eee">My Posts</button></div></div><div id="profilePosts"></div></section></main><nav class="nav"><button id="homeNav" class="active" onclick="showPage('home')">🏠<br>Home</button><button onclick="openCreate()">➕<br>Post</button><button id="profileNav" onclick="showPage('profile')">👤<br>Profile</button></nav></div>
<div id="createModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>Create Post</h2><button class="close" onclick="closeCreate()">×</button></div><input id="postImage" type="file" accept="image/*"><textarea id="postCaption" rows="4" placeholder="Write something... Keep it respectful 🙏"></textarea><button class="primary" onclick="createPost()">Publish</button><p id="postMsg" class="small" style="margin-top:10px"></p></div></div>
<div id="editProfileModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>Edit Profile</h2><button class="close" onclick="closeEditProfile()">×</button></div><input id="editName" placeholder="Name"><input id="editUsername" placeholder="Username"><input id="editAvatar" placeholder="Avatar URL"><textarea id="editBio" rows="3" placeholder="Bio"></textarea><div style="margin:12px 0;padding:12px;background:#f0f2ff;border-radius:10px"><label style="display:flex;justify-content:space-between;align-items:center"><span>🔒 Private Account</span><input type="checkbox" id="editPrivate" style="width:20px;height:20px"></label></div><button class="primary" onclick="saveProfile()">Save</button></div></div>
<div id="reportModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2>🚩 Report Post</h2><button class="close" onclick="closeReport()">×</button></div><p class="small" style="margin-bottom:12px">Why are you reporting? Anonymous.</p><div class="report-reasons"><button onclick="submitReport('spam')">📢 Spam or fake</button><button onclick="submitReport('abuse')">🤬 Abusive / Hate</button><button onclick="submitReport('nudity')">🔞 Nudity</button><button onclick="submitReport('violence')">⚠️ Violence</button><button onclick="submitReport('other')">❓ Other</button></div><p id="reportMsg" class="small" style="margin-top:10px;text-align:center"></p></div></div>
<script>
const SUPABASE_URL="https://yecpltndhlzfjplzhcpm.supabase.co";const SUPABASE_KEY="sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,currentProfile=null,profileCache=new Map(),reportingPostId=null,reportingUserId=null;
document.addEventListener("DOMContentLoaded",async()=>{const{data}=await db.auth.getSession();if(data.session){currentUser=data.session.user;await startApp()}else showAuth();db.auth.onAuthStateChange(async(e,s)=>{if(s){currentUser=s.user;await startApp()}else{currentUser=null;currentProfile=null;profileCache.clear();showAuth()}})});
function showAuth(){document.getElementById("authPage").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}
async function signup(){const n=document.getElementById("authName").value.trim(),u=document.getElementById("authUsername").value.trim().toLowerCase(),e=document.getElementById("authEmail").value.trim(),p=document.getElementById("authPassword").value,m=document.getElementById("authMsg");if(!n||!u||!e||!p){m.textContent="Fill all fields.";return}if(p.length<6){m.textContent="Password 6+ chars";return}m.textContent="Creating...";const{data,error}=await db.auth.signUp({email:e,password:p});if(error){m.textContent=error.message;return}if(!data.user){m.textContent="Signup failed";return}const{error:pe}=await db.from("profiles").upsert({id:data.user.id,name:n,username:u,avatar_url:"",bio:""});if(pe){m.textContent=pe.message;return}m.textContent="Account created!";if(!data.session)m.textContent="Check email to confirm."}
async function login(){const e=document.getElementById("authEmail").value.trim(),p=document.getElementById("authPassword").value,m=document.getElementById("authMsg");if(!e||!p){m.textContent="Enter email & password";return}m.textContent="Logging in...";const{error}=await db.auth.signInWithPassword({email:e,password:p});if(error){m.textContent=error.message;return}m.textContent="Login success!"}
async function logout(){await db.auth.signOut()}
async function startApp(){document.getElementById("authPage").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await loadMyProfile();await loadProfileCounts();await loadFeed()}
async function getProfile(id){if(!id)return{};if(profileCache.has(id))return profileCache.get(id);const{data}=await db.from("profiles").select("id,name,username,avatar_url,bio,is_private").eq("id",id).maybeSingle();const pr=data||{};profileCache.set(id,pr);return pr}
async function loadMyProfile(){if(!currentUser)return;const{data}=await db.from("profiles").select("id,name,username,avatar_url,bio,is_private").eq("id",currentUser.id).maybeSingle();currentProfile=data;if(!currentProfile){const en=currentUser.email?currentUser.email.split("@")[0]:"user";const fb={id:currentUser.id,name:en,username:en.toLowerCase(),avatar_url:"",bio:"",is_private:false};const{data:np}=await db.from("profiles").upsert(fb).select().single();currentProfile=np}profileCache.set(currentUser.id,currentProfile);renderMyProfile()}
function renderMyProfile(){if(!currentProfile)return;document.getElementById("myName").textContent=currentProfile.name||currentProfile.username||"User";document.getElementById("myUsername").textContent="@"+(currentProfile.username||"user");document.getElementById("myBio").textContent=currentProfile.bio||"";document.getElementById("myAvatar").src=currentProfile.avatar_url||"https://via.placeholder.com/100"}
function openEditProfile(){if(!currentProfile)return;document.getElementById("editName").value=currentProfile.name||"";document.getElementById("editUsername").value=currentProfile.username||"";document.getElementById("editAvatar").value=currentProfile.avatar_url||"";document.getElementById("editBio").value=currentProfile.bio||"";document.getElementById("editPrivate").checked=currentProfile.is_private||false;document.getElementById("editProfileModal").classList.remove("hidden")}
function closeEditProfile(){document.getElementById("editProfileModal").classList.add("hidden")}
async function saveProfile(){const n=document.getElementById("editName").value.trim(),u=document.getElementById("editUsername").value.trim().toLowerCase(),a=document.getElementById("editAvatar").value.trim(),b=document.getElementById("editBio").value.trim(),pr=document.getElementById("editPrivate").checked;if(!n||!u){alert("Name & username required");return}const{error}=await db.from("profiles").update({name:n,username:u,avatar_url:a,bio:b,is_private:pr}).eq("id",currentUser.id);if(error){alert(error.message);return}profileCache.delete(currentUser.id);await loadMyProfile();closeEditProfile();alert("Updated!")}
function openCreate(){document.getElementById("createModal").classList.remove("hidden")}
function closeCreate(){document.getElementById("createModal").classList.add("hidden");document.getElementById("postMsg").textContent=""}
async function createPost(){if(!currentUser){alert("Login");return}const f=document.getElementById("postImage").files[0],c=document.getElementById("postCaption").value.trim(),m=document.getElementById("postMsg");if(!f){m.textContent="Select image";return}const banned=["fuck","sex","porn","nude","xxx"];if(banned.some(w=>c.toLowerCase().includes(w))){m.textContent="Keep it respectful 🙏";return}m.textContent="Uploading...";const ext=f.name.split(".").pop().toLowerCase(),fn=currentUser.id+"_"+Date.now()+"."+ext;const{error:ue}=await db.storage.from("Post-images").upload(fn,f,{upsert:false});if(ue){m.textContent=ue.message;return}const{data:pd}=db.storage.from("Post-images").getPublicUrl(fn);const{error:pe}=await db.from("posts").insert({user_id:currentUser.id,image_url:pd.publicUrl,caption:c});if(pe){m.textContent=pe.message;return}m.textContent="Posted!";document.getElementById("postImage").value="";document.getElementById("postCaption").value="";await loadFeed();setTimeout(closeCreate,700)}
async function loadFeed(){const feed=document.getElementById("feed");feed.innerHTML='<div class="loading">Loading...</div>';const{data,error}=await db.from("posts").select("id,user_id,image_url,caption,created_at").order("created_at",{ascending:false});if(error){feed.innerHTML=`<div class="card">Error: ${error.message}</div>`;return}if(!data||!data.length){feed.innerHTML='<div class="empty">No posts yet</div>';return}feed.innerHTML="";for(const p of data)await renderPost(p,feed)}
async function renderPost(post,container){const profile=await getProfile(post.user_id),name=profile.name||profile.username||"User",uname=profile.username||"user",avatar=profile.avatar_url||"https://via.placeholder.com/100",card=document.createElement("div");card.className="card";card.id="post-"+post.id;const isMine=post.user_id===currentUser.id,liked=await hasLike(post.id),saved=await hasSave(post.id),following=isMine?false:await isFollowing(post.user_id),likeCount=await countRows("likes","post_id",post.id),commentCount=await countRows("comments","post_id",post.id),viewCount=await countRows("views","post_id",post.id);card.innerHTML=`<div class="profile-head"><img class="avatar" src="${avatar}"><div><div class="user-name">${esc(name)}</div><div class="username">@${esc(uname)}</div></div>${!isMine?`<button class="follow-btn ${following?"following":""}" onclick="toggleFollow('${post.user_id}',this)">${following?"Following":"Follow"}</button>`:""}</div>${post.image_url?`<img class="post-image" src="${post.image_url}" loading="lazy">`:""}${post.caption?`<div class="caption">${esc(post.caption)}</div>`:""}<div class="small" style="margin-top:8px">${new Date(post.created_at).toLocaleString()}</div><div class="actions"><button class="${liked?"active":""}" onclick="toggleLike('${post.id}',this)">❤️ ${likeCount}</button><button onclick="toggleComments('${post.id}')">💬 ${commentCount}</button><button class="${saved?"active":""}" onclick="toggleSave('${post.id}',this)">🔖</button><button onclick="sharePost('${post.id}')">📤 Share</button><button>👁 ${viewCount}</button>${isMine?`<button class="danger" onclick="deletePost('${post.id}')">🗑 Delete</button>`:`<button style="color:#d00" onclick="openReport('${post.id}','${post.user_id}')">🚩 Report</button>`}</div><div id="comments-${post.id}" class="comment-box hidden"><div id="commentList-${post.id}">Loading...</div><div style="display:flex;gap:5px;margin-top:10px"><input id="commentInput-${post.id}" placeholder="Write comment..." style="margin:0"><button class="primary" style="width:auto;margin:0;padding:10px 15px" onclick="addComment('${post.id}')">Send</button></div></div>`;container.appendChild(card);await addView(post.id)}
async function hasLike(pid){const{data}=await db.from("likes").select("post_id").eq("post_id",pid).eq("user_id",currentUser.id).maybeSingle();return!!data}
async function toggleLike(pid){const l=await hasLike(pid);if(l)await db.from("likes").delete().eq("post_id",pid).eq("user_id",currentUser.id);else await db.from("likes").insert({post_id:pid,user_id:currentUser.id});await loadFeed()}
async function toggleComments(pid){const b=document.getElementById("comments-"+pid);b.classList.toggle("hidden");if(!b.classList.contains("hidden"))await loadComments(pid)}
async function loadComments(pid){const list=document.getElementById("commentList-"+pid);const{data,error}=await db.from("comments").select("id,comment,user_id").eq("post_id",pid).order("created_at",{ascending:true});if(error){list.innerHTML=error.message;return}if(!data||!data.length){list.innerHTML='<div class="small">No comments</div>';return}let h="";for(const c of data){const p=await getProfile(c.user_id);h+=`<div class="comment"><b>${esc(p.name||p.username||"User")}</b>${esc(c.comment)}</div>`}list.innerHTML=h}
async function addComment(pid){const i=document.getElementById("commentInput-"+pid),c=i.value.trim();if(!c)return;await db.from("comments").insert({post_id:pid,user_id:currentUser.id,comment:c});i.value="";await loadComments(pid)}
async function hasSave(pid){const{data}=await db.from("saves").select("post_id").eq("post_id",pid).eq("user_id",currentUser.id).maybeSingle();return!!data}
async function toggleSave(pid,btn){const s=await hasSave(pid);if(s)await db.from("saves").delete().eq("post_id",pid).eq("user_id",currentUser.id);else await db.from("saves").insert({post_id:pid,user_id:currentUser.id});btn.classList.toggle("active")}
async function isFollowing(uid){const{data}=await db.from("follows").select("id").eq("follower_id",currentUser.id).eq("following_id",uid).maybeSingle();return!!data}
async function toggleFollow(uid,btn){const f=await isFollowing(uid);if(f){await db.from("follows").delete().eq("follower_id",currentUser.id).eq("following_id",uid);if(btn){btn.textContent="Follow";btn.classList.remove("following")}}else{await db.from("follows").insert({follower_id:currentUser.id,following_id:uid});if(btn){btn.textContent="Following";btn.classList.add("following")}}await loadProfileCounts()}
async function addView(pid){if(!currentUser)return;const{data}=await db.from("views").select("id").eq("post_id",pid).eq("user_id",currentUser.id).maybeSingle();if(data)return;await db.from("views").insert({post_id:pid,user_id:currentUser.id})}
async function sharePost(pid){const url=location.href.split("#")[0]+"#post-"+pid;if(navigator.share){try{await navigator.share({title:"PIXORO",url:url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);alert("Link copied!")}catch(e){prompt("Copy:",url)}}}
async function deletePost(pid){if(!confirm("Delete post?"))return;const{data:post}=await db.from("posts").select("image_url").eq("id",pid).eq("user_id",currentUser.id).maybeSingle();if(post&&post.image_url){try{const parts=post.image_url.split("/Post-images/");if(parts.length>1)await db.storage.from("Post-images").remove([decodeURIComponent(parts[1])])}catch(e){}}await db.from("posts").delete().eq("id",pid).eq("user_id",currentUser.id);await loadFeed()}
async function loadMyPosts(){if(!currentUser)return;const c=document.getElementById("profilePosts");c.innerHTML='<div class="loading">Loading...</div>';const{data}=await db.from("posts").select("id,user_id,image_url,caption,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false});c.innerHTML="";if(!data||!data.length){c.innerHTML='<div class="empty">No posts</div>';return}for(const p of data)await renderPost(p,c)}
async function loadProfileCounts(){if(!currentUser)return;const posts=await countRows("posts","user_id",currentUser.id),f1=await countRows("follows","following_id",currentUser.id),f2=await countRows("follows","follower_id",currentUser.id);document.getElementById("myPosts").textContent=posts;document.getElementById("myFollowers").textContent=f1;document.getElementById("myFollowing").textContent=f2}
async function searchPosts(){const q=document.getElementById("searchInput").value.trim().toLowerCase();if(!q){await loadFeed();return}const{data:profs}=await db.from("profiles").select("id").or("username.ilike.%"+q+"%,name.ilike.%"+q+"%");if(!profs||!profs.length){document.getElementById("feed").innerHTML='<div class="empty">No user</div>';return}const ids=profs.map(p=>p.id);const{data}=await db.from("posts").select("id,user_id,image_url,caption,created_at").in("user_id",ids).order("created_at",{ascending:false});const feed=document.getElementById("feed");feed.innerHTML="";if(!data||!data.length){feed.innerHTML='<div class="empty">No posts</div>';return}for(const p of data)await renderPost(p,feed)}
async function showPage(p){const h=document.getElementById("homePage"),pr=document.getElementById("profilePage"),hn=document.getElementById("homeNav"),pn=document.getElementById("profileNav");if(p==="home"){h.classList.remove("hidden");pr.classList.add("hidden");hn.classList.add("active");pn.classList.remove("active");await loadFeed()}else{h.classList.add("hidden");pr.classList.remove("hidden");hn.classList.remove("active");pn.classList.add("active");await loadProfileCounts();await loadMyPosts()}}
async function countRows(t,c,v){const{count}=await db.from(t).select("*",{count:"exact",head:true}).eq(c,v);return count||0}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function openReport(pid,uid){reportingPostId=pid;reportingUserId=uid;document.getElementById("reportMsg").textContent="";document.getElementById("reportModal").classList.remove("hidden")}
function closeReport(){document.getElementById("reportModal").classList.add("hidden");reportingPostId=null;reportingUserId=null}
async function submitReport(reason){if(!reportingPostId)return;const m=document.getElementById("reportMsg");m.textContent="Reporting...";try{const{error}=await db.from("reports").insert({post_id:reportingPostId,reported_by:currentUser.id,reported_user_id:reportingUserId,reason:reason});if(error)throw error;m.textContent="✅ Reported! Thanks";setTimeout(closeReport,1500)}catch(e){m.textContent="✅ Reported! (local)";setTimeout(closeReport,1500)}}
</script>
</body>
</html>
