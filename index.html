<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO - World No.1 Safe App</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}
.header{background:#111;padding:12px;text-align:center;font-weight:bold;font-size:22px;position:fixed;top:0;width:100%;z-index:100;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;padding-left:15px;padding-right:15px}
.header span{color:#ff0050}.feed{margin-top:60px;margin-bottom:70px;max-width:500px;margin:0 auto}
.post{background:#111;margin-bottom:15px;border:1px solid #222;border-radius:10px;overflow:hidden}
.post-top{padding:10px;display:flex;justify-content:space-between;align-items:center}
.user{font-weight:bold;display:flex;align-items:center;gap:8px}.user img{width:30px;height:30px;border-radius:50%}
.post-img{width:100%;height:500px;object-fit:cover;background:#222}
.post-actions{padding:10px;display:flex;gap:18px;align-items:center;border-top:1px solid #222}
.btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.like-count{font-weight:bold;font-size:14px}.caption{padding:8px 10px;font-size:14px}
.report-btn{background:red;color:#fff;border:none;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
.follow-btn{background:#ff0050;color:#fff;border:none;padding:4px 12px;border-radius:15px;font-size:12px;font-weight:bold;cursor:pointer}
.follow-btn.following{background:#333}
.bottom{position:fixed;bottom:0;width:100%;background:#111;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #333;z-index:100}
.bottom button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.login-box{margin-top:100px;text-align:center;padding:20px}
input{padding:10px;border-radius:8px;border:none;width:250px;margin:5px;background:#222;color:#fff}
#profileBox{margin-top:60px;max-width:500px;margin-left:auto;margin-right:auto;padding:15px;display:none}
.stats{display:flex;justify-content:space-around;text-align:center;margin:15px 0;border:1px solid #222;padding:10px;border-radius:10px;background:#111}
#commentBox{position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#111;border-top:1px solid #333;padding:10px;display:none;z-index:1000;max-height:60%;overflow-y:auto}
</style>
</head>
<body>

<div class="header">
<span onclick="showFeed()" style="cursor:pointer">PIX<span>ORO</span> 🔥</span>
<div>
<button onclick="showProfile()" style="background:none;border:none;color:white;font-size:20px;">👤</button>
</div>
</div>

<div id="loginBox" class="login-box">
<h2>PIXORO Login</h2><br>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()" style="background:#ff0050;color:#fff;padding:10px 30px;border:none;border-radius:8px;margin-top:10px;">Login / Signup</button>
<p style="margin-top:10px;font-size:12px;color:#aaa;">World's First Safe App by GIRI</p>
</div>

<div id="feed" class="feed" style="display:none;"></div>

<div id="profileBox">
<h2 id="pName">krikir58</h2>
<p id="pEmail" style="color:#aaa;font-size:13px;"></p>
<div class="stats">
<div><b id="postCount">0</b><br><small>Posts</small></div>
<div><b id="followerCount">0</b><br><small>Followers</small></div>
<div><b id="followingCount">0</b><br><small>Following</small></div>
</div>
<div id="myPosts"></div>
</div>

<div id="uploadBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;padding:20px;text-align:center;">
<h3 style="margin-top:40px;">Post Podu da Giri! 🔥</h3><br>
<input id="captionInput" placeholder="Caption enna da?" style="width:90%;"><br><br>
<input type="file" id="fileInput" accept="image/*" style="width:90%;color:white;"><br><br>
<img id="preview" style="width:220px;height:300px;object-fit:cover;display:none;border-radius:10px;margin:10px auto;border:2px solid #ff0050;"><br>
<button onclick="uploadRealPost()" style="background:#ff0050;color:white;padding:12px 30px;border:none;border-radius:20px;font-weight:bold;">POST PANNU DA 🚀</button><br><br>
<button onclick="document.getElementById('uploadBox').style.display='none'" style="background:#333;color:white;padding:10px 20px;border:none;border-radius:20px;">Cancel</button>
</div>

<div id="commentBox">
<div style="display:flex;justify-content:space-between;"><b>Comments</b><button onclick="commentBox.style.display='none'" style="background:none;border:none;color:#fff;font-size:18px;">✕</button></div>
<div id="commentList" style="margin:10px 0;"></div>
<div style="display:flex;gap:5px;"><input id="commentInput" placeholder="Comment podu da..." style="flex:1;"><button onclick="addComment()" style="background:#ff0050;color:#fff;border:none;padding:8px 15px;border-radius:10px;">Post</button></div>
</div>

<div class="bottom" id="bottomNav" style="display:none;">
<button onclick="showFeed()">🏠</button>
<button onclick="addPost()">➕</button>
<button onclick="showProfile()">👤</button>
<button onclick="logout()">🚪</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwOxSyjqp2OoT2PoxSyHojksr5r58vQ10",
  authDomain: "pixoro-75927.firebaseapp.com",
  projectId: "pixoro-75927",
  storageBucket: "pixoro-75927.firebasestorage.app",
  messagingSenderId: "814840120295",
  appId: "1:814840120295:web:6c02c613df5a17209bf342"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
let currentUser=null;let currentCommentPostId=null;

auth.onAuthStateChanged(u=>{if(u){currentUser=u;loginBox.style.display="none";feed.style.display="block";bottomNav.style.display="flex";profileBox.style.display="none";loadFeed();}else{loginBox.style.display="block";feed.style.display="none";bottomNav.style.display="none";profileBox.style.display="none";}});

function login(){let e=email.value.trim();let p=pass.value.trim();if(!e||!p)return alert("Email podu da");auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p));}
function logout(){auth.signOut();}
function showFeed(){feed.style.display="block";profileBox.style.display="none";loadFeed();}
function showProfile(){feed.style.display="none";profileBox.style.display="block";loadProfile();}
function addPost(){uploadBox.style.display='block';}

fileInput.addEventListener('change',e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';};r.readAsDataURL(f);}});

async function uploadRealPost(){
let cap=captionInput.value.trim();if(!cap)return alert("Caption podu da");let imgUrl="https://picsum.photos/500/700?random="+Math.random();let f=fileInput.files[0];if(f){imgUrl=await new Promise(res=>{let r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}
await db.collection("reels").add({email:currentUser.email.split("@")[0],uid:currentUser.uid,caption:cap,videoUrl:imgUrl,likes:0,likedBy:[],reports:0,commentsCount:0,createdAt:new Date()});
uploadBox.style.display='none';captionInput.value='';preview.style.display='none';fileInput.value='';loadFeed();
}

async function loadFeed(){
let s=await db.collection("reels").orderBy("createdAt","desc").get();let h="";let follows=await getFollowingList();
s.forEach(d=>{let x=d.data();let isLiked=x.likedBy&&x.likedBy.includes(currentUser.uid);let isFake=(x.reports||0)>=3;let isOwn=x.uid===currentUser.uid;
h+=`<div class="post"><div class="post-top"><span class="user"><img src="https://i.pravatar.cc/100?u=${x.email}"><b>${x.email}</b>${isFake?'<span style="background:red;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px;">FAKE</span>':''}</span><div style="display:flex;gap:6px;">${!isOwn?`<button class="follow-btn ${follows.includes(x.uid)?'following':''}" onclick="toggleFollow('${x.uid}')">${follows.includes(x.uid)?'Following':'Follow'}</button>`:''}<button class="report-btn" onclick="reportFake('${d.id}')">🚨</button></div></div>${isFake?`<div style="background:red;text-align:center;padding:6px;font-weight:bold;">🚨 FAKE ID ALERT! 🚨</div>`:""}<img class="post-img" src="${x.videoUrl}"><div class="post-actions"><button class="btn" onclick="likePost('${d.id}')">${isLiked?'❤️':'🤍'}</button><button class="btn" onclick="openComments('${d.id}')">💬</button><button class="btn" onclick="sharePost('${d.id}')">↗️</button><span class="like-count" style="margin-left:auto;">${x.likes||0} likes • ${x.commentsCount||0} comments</span></div><div class="caption"><b>${x.email}</b> ${x.caption||''}</div></div>`});
if(!h)h="<p style='text-align:center;margin-top:50px;color:#666;'>No posts da! + thottu podu da!</p>";feed.innerHTML=h;
}

async function getFollowingList(){if(!currentUser)return[];let doc=await db.collection("users").doc(currentUser.uid).get();return doc.exists?doc.data().following||[]:[];}

async function toggleFollow(uid){
if(uid===currentUser.uid)return;let ref=db.collection("users").doc(currentUser.uid);let doc=await ref.get();let data=doc.exists?doc.data():{following:[],followers:[]};let following=data.following||[];let isFollowing=following.includes(uid);
if(isFollowing){await ref.update({following:firebase.firestore.FieldValue.arrayRemove(uid)});await db.collection("users").doc(uid).update({followers:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)}).catch(()=>{});}
else{await ref.set({following:firebase.firestore.FieldValue.arrayUnion(uid),email:currentUser.email},{merge:true});await db.collection("users").doc(uid).set({followers:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)},{merge:true});}
loadFeed();if(profileBox.style.display==="block")loadProfile();
}

async function likePost(id){
let ref=db.collection("reels").doc(id);let doc=await ref.get();let x=doc.data();let liked=x.likedBy||[];let isLiked=liked.includes(currentUser.uid);
if(isLiked){await ref.update({likes:firebase.firestore.FieldValue.increment(-1),likedBy:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});}
else{await ref.update({likes:firebase.firestore.FieldValue.increment(1),likedBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});}
loadFeed();
}

function sharePost(id){if(navigator.share){navigator.share({title:"PIXORO",text:"PIXORO la paaru da!",url:window.location.href});}else{navigator.clipboard.writeText(window.location.href);alert("Link copy panniten da Giri! Share pannu da!");}}

async function openComments(id){currentCommentPostId=id;commentBox.style.display="block";loadComments();}
async function loadComments(){let s=await db.collection("reels").doc(currentCommentPostId).collection("comments").orderBy("createdAt","asc").get();let h="";s.forEach(d=>{let c=d.data();h+=`<div style="padding:6px 0;border-bottom:1px solid #222;"><b>${c.email}</b> ${c.text}<br><small style="color:#777;">${c.createdAt?.toDate().toLocaleString()||''}</small></div>`;});commentList.innerHTML=h||"<p style='color:#666;'>First comment neeye podu da Giri!</p>";}
async function addComment(){let t=commentInput.value.trim();if(!t)return;await db.collection("reels").doc(currentCommentPostId).collection("comments").add({email:currentUser.email.split("@")[0],text:t,createdAt:new Date()});await db.collection("reels").doc(currentCommentPostId).update({commentsCount:firebase.firestore.FieldValue.increment(1)});commentInput.value="";loadComments();loadFeed();}

async function reportFake(id){if(!confirm("Fake ID ah da?"))return;await db.collection("reels").doc(id).update({reports:firebase.firestore.FieldValue.increment(1)});alert("Report pannita da!");loadFeed();}

async function loadProfile(){
pName.innerText=currentUser.email.split("@")[0];pEmail.innerText=currentUser.email;
let my=await db.collection("reels").where("uid","==",currentUser.uid).get();postCount.innerText=my.size;
let uDoc=await db.collection("users").doc(currentUser.uid).get();let udata=uDoc.exists?uDoc.data():{};followerCount.innerText=(udata.followers||[]).length;followingCount.innerText=(udata.following||[]).length;
let h="";my.forEach(d=>{let x=d.data();h+=`<div style="display:inline-block;width:32%;margin:1px;"><img src="${x.videoUrl}" style="width:100%;height:120px;object-fit:cover;"></div>`});myPosts.innerHTML=h;
}
</script>
</body>
</html>
