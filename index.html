<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO MASS</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:470px;min-height:100vh;background:#fff;position:relative}
.insta{font-family:'Grand Hotel',cursive;font-size:34px}
#splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2.5px;border-radius:50%;display:inline-block}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #efefef;display:flex;justify-content:space-between;padding:10px 12px;align-items:center}
.stories{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #efefef}
.post{border-bottom:1px solid #efefef;background:#fff}
.bottom{position:fixed;bottom:0;width:100%;max-width:470px;background:#000;color:#fff;display:flex;justify-content:space-around;padding:14px 0;font-size:22px;z-index:20}
.modal{position:fixed;inset:0;z-index:100;display:none;background:#fff;flex-direction:column}.modal.on{display:flex}
#noti{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:12px;padding:7px 16px;border-radius:20px;z-index:200;display:none}
.badge{background:#efefef;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
img{display:block;max-width:100%}
</style>
</head><body>
<div id="splash"><div class="logo">📸</div></div>
<div id="app">
<div class="top"><div class="insta">Pixoro</div><div>❤️ ✈️</div></div>
<div class="stories" id="stories"></div>
<div style="display:flex;gap:8px;padding:12px;border-bottom:1px solid #efefef;align-items:center"><img src="https://i.pravatar.cc/80?u=giri" style="width:32px;height:32px;border-radius:50%"><input id="quickCap" placeholder="What's on mind?" style="flex:1;border:0;outline:none;font-size:14px;font-family:Poppins"><button onclick="openUpload()" style="background:#0095f6;color:#fff;border:0;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700">Post</button></div>
<div id="feed" style="padding-bottom:75px"></div>
<div class="bottom"><span onclick="location.reload()">🏠</span><span>🔍</span><span onclick="openUpload()" style="border:1px solid #fff;padding:2px 14px;border-radius:8px">+</span><span>🎬</span><span onclick="openProfilePage('girikri')">👤</span></div>

<div id="uploadModal" class="modal"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #efefef"><span onclick="closeUpload()">✕</span><b>New post</b><span onclick="shareNow()" style="color:#0095f6;font-weight:700">Share</span></div><div style="flex:1;background:#111;display:flex;align-items:center;justify-content:center" onclick="document.getElementById('fileInput').click()"><div id="previewBox" style="display:none;width:100%;height:100%"><img id="previewImg" style="width:100%;height:100%;object-fit:contain"></div><p id="noPhoto" style="color:#fff">Tap + to select photo</p></div><textarea id="captionInput" placeholder="Caption @mention #tag" style="padding:12px;border:0;outline:none;font-size:14px" rows="2"></textarea></div>

<div id="profilePage" class="modal" style="overflow-y:auto"><div style="padding:12px;border-bottom:1px solid #efefef;display:flex;justify-content:space-between"><span onclick="closeProfilePage()">←</span><b id="pUser" style="font-family:'Grand Hotel';font-size:26px">girikri</b><span>⋯</span></div><div style="padding:16px;display:flex;gap:16px;align-items:center"><div class="ring"><img id="pImg" src="https://i.pravatar.cc/150?u=giri" style="width:86px;height:86px;border-radius:50%;padding:3px;background:#fff"></div><div style="flex:1;display:flex;justify-content:space-around;text-align:center"><div><div id="pPosts" style="font-weight:700">0</div><div style="font-size:12px">Posts</div></div><div><div id="pFollowers" style="font-weight:700">128</div><div style="font-size:12px">Followers</div></div><div><div id="pFollowing" style="font-weight:700">0</div><div style="font-size:12px">Following</div></div></div></div><div style="padding:0 16px"><p id="pName" style="font-weight:700">Giri 🔥</p><p style="font-size:12px;color:#555"><b id="pViews">0</b> Views • <b id="pLikes">0</b> Likes • <b id="pStoryV">0</b> Story views</p><div style="display:flex;gap:8px;margin-top:12px"><button id="followBtn" onclick="toggleFollow(currentP)" style="flex:1;background:#000;color:#fff;border:0;padding:9px;border-radius:8px;font-weight:700">Follow</button><button style="flex:1;background:#efefef;border:0;padding:9px;border-radius:8px;font-weight:700">Message</button></div><div id="followReq" style="display:none;margin-top:10px;background:#ffedf0;padding:8px 12px;border-radius:8px;font-size:12px">🔔 whitezzz__04 requested to follow you <b style="float:right;color:#0095f6">Accept</b></div></div><div id="pGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:16px"></div></div>

<div id="noti"></div><input type="file" id="fileInput" accept="image/*" hidden>
</div>
<script src="js/app.js"></script>
</body></html>
