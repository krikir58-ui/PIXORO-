<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXORO</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #111;
}

body {
  padding-bottom: 70px;
}

/* ================= HEADER ================= */

.header {
  width: 100%;
  height: 70px;
  background: #ffffff;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  white-space: nowrap;
}

.search {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 1px solid #ddd;
  border-radius: 25px;
  padding: 0 15px;
  font-size: 15px;
  outline: none;
  background: #f8f8f8;
}

.search:focus {
  border-color: #aaa;
}

.owner {
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
}

/* ================= APP ================= */

.app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

/* ================= STORIES ================= */

.stories {
  width: 100%;
  background: white;
  margin-top: 10px;
  padding: 16px 10px;
  display: flex;
  gap: 18px;
  overflow-x: auto;
  border-radius: 14px;
}

.story {
  min-width: 70px;
  text-align: center;
  font-size: 14px;
}

.story img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #ff2685;
  padding: 2px;
}

.story p {
  margin: 6px 0 0;
}

/* ================= SEARCH RESULT ================= */

.search-results {
  display: none;
  background: white;
  margin-top: 10px;
  border-radius: 12px;
  overflow: hidden;
}

.search-user {
  padding: 14px;
  border-bottom: 1px solid #eee;
  font-weight: bold;
}

/* ================= CREATE ================= */

.create-box {
  width: 100%;
  background: white;
  margin-top: 10px;
  padding: 22px;
  border-radius: 14px;
}

.create-box h2 {
  margin: 0 0 18px;
}

.file-input {
  width: 100%;
  font-size: 15px;
}

.post-button {
  margin-top: 15px;
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  background: #1296ed;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* ================= POST ================= */

.post {
  width: 100%;
  background: white;
  margin-top: 10px;
  overflow: hidden;
  border-bottom: 1px solid #ddd;
}

.post-header {
  width: 100%;
  height: 60px;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  font-size: 17px;
  font-weight: bold;
}

.post-image {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

/* ================= ACTIONS ================= */

.actions {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 14px 5px;
}

.action-button {
  border: none;
  background: transparent;
  font-size: 28px;
  padding: 0;
  cursor: pointer;
}

.like-button.liked {
  color: red;
}

.like-count {
  padding: 4px 14px 8px;
  font-weight: bold;
}

.caption {
  padding: 0 14px 14px;
  font-size: 15px;
  line-height: 1.5;
}

/* ================= COMMENTS ================= */

.comments {
  padding: 0 14px 10px;
}

.comment {
  margin: 6px 0;
}

.comment-box {
  width: 100%;
  display: flex;
  border-top: 1px solid #eee;
}

.comment-input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 14px;
  font-size: 15px;
}

.comment-button {
  border: none;
  background: white;
  color: #1296ed;
  font-weight: bold;
  padding: 0 15px;
}

/* ================= PROFILE ================= */

.profile-page {
  display: none;
  background: white;
  margin-top: 10px;
  padding: 30px 15px;
  text-align: center;
  border-radius: 14px;
}

.profile-picture {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #ff2685;
}

.profile-page h2 {
  margin: 12px 0 5px;
}

.profile-stats {
  margin: 20px 0;
}

.profile-button {
  border: none;
  background: #1296ed;
  color: white;
  padding: 11px 25px;
  border-radius: 8px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 68px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 2000;
}

.nav-button {
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.nav-label {
  display: block;
  font-size: 10px;
  margin-top: 2px;
}

/
