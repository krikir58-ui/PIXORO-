<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixoro - Tiruchuli to World 🌍</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#111;border:1px solid #333;border-radius:20px;padding:30px;width:90%;max-width:350px;text-align:center}
.logo{font-family:cursive;font-size:42px;margin-bottom:5px}
.sub{color:#888;font-size:14px;margin-bottom:25px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-bottom:12px;outline:none}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#0095f6;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.post{border:1px solid #333;border-radius:12px;margin:15px 0;overflow:hidden;text-align:left}
.post img{width:100%}
.post-top{padding:10px;display:flex;align-items:center;gap:8px}
.feed{display:none;max-width:400px;width:100%;margin:0 auto}
</style>
</head>
<body>

<div id="loginBox" class="box">
  <div class="logo">Pixoro</div>
  <div class="sub">Tiruchuli to World 🌍</div>
  <input id="username" placeholder="Username - Giri nu type pannu da" value="Giri">
  <button onclick="login()">Login</button>
  <p id="msg" style="margin-top:10px;color:#f55;font-size:13px"></p>
</div>

<div id="feedBox" class="feed">
  <h2 style="padding:15px">Pixoro Feed 🔵 <span id="uname"></span></h2>
  <div id="posts"></div>
  <button onclick="logout()" style="margin:20px;background:#333">Logout</button>
</div>

<script>
const SUPA_URL = 'https://yecpltndhlzfjplzhcpm.supabase.co'
const SUPA_KEY = 'sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_'
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY)

async function login(){
  const u = document.getElementById('username').value.trim()
  if(!u){ document.getElementById('msg').innerText='Username podu da!'; return }
  localStorage.setItem('pixoro_user', u)
  document.getElementById('loginBox').style.display='none'
  document.getElementById('feedBox').style.display='block'
  document.getElementById('uname').innerText='@'+u
  loadPosts()
}

async function loadPosts(){
  const { data, error } = await supa.from('posts').select('*').order('created_at',{ascending:false})
  if(error){ document.getElementById('posts').innerHTML='<p style="padding:20px;color:red">'+error.message+'</p>'; return }
  if(!data || data.length===0){
    document.getElementById('posts').innerHTML='<p style="padding:20px;color:#888">Post illa da - Supabase la Table Editor > posts la oru row add pannu da! img, username, cap podu!</p>'
    return
  }
  document.getElementById('posts').innerHTML = data.map(p=>`
    <div class="post">
      <div class="post-top">
        <img src="https://i.pravatar.cc/100?u=${p.username}" style="width:30px;height:30px;border-radius:50%">
        <b>@${p.username} ${p.username.toLowerCase()==='giri' || p.verified ? '<span style="background:#0095f6;color:#fff;border-radius:50%;padding:2px 6px;font-size:11px">✓</span>' : ''}</b>
      </div>
      <img src="${p.img}">
      <div style="padding:10px"><b>@${p.username}</b> ${p.cap || ''}</div>
    </div>
  `).join('')
}

function logout(){
  localStorage.removeItem('pixoro_user')
  location.reload()
}

// Auto login
const saved = localStorage.getItem('pixoro_user')
if(saved){
  document.getElementById('username').value=saved
  login()
}
</script>
</body>
</html>
