let curStories=[],curView=[],timer=null,curProfile=null,allPosts=[],currentFilter='all',verifiedMap={};

async function loadStats(){let u=localStorage.getItem('pix_user');let {data:fer}=await sb.from('follows').select('*').eq('following',u);let {data:fing}=await sb.from('follows').select('*').eq('follower',u);let {data:posts}=await sb.from('posts').select('*').eq('username',u);fCount.innerText=fer?.length||0;fgCount.innerText=fing?.length||0;pCount.innerText=posts?.length||0;}

async function loadStories(){let {data}=await sb.from('stories').select('*').order('created_at',{ascending:false});let {data:views}=await sb.from('story_views').select('*');let {data:users}=await sb.from('users').select('username,profile_pic,is_verified');verifiedMap={};(users||[]).forEach(x=>verifiedMap[x.username]=x.is_verified);let now=Date.now();let valid=(data||[]).filter(s=> now - new Date(s.created_at).getTime() < 86400000);curStories=valid;storyCount.innerText=`(${valid.length})`;if(valid.length==0){storyBar.innerHTML=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div>`;return;}let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);let grouped={};valid.forEach(s=>{if(!grouped[s.username])grouped[s.username]=[];grouped[s.username].push(s);});let h=`<div class="story-item" onclick="document.getElementById('storyFile').click()"><div class="story-add">+</div><b>Your Story</b></div>`;Object.keys(grouped).forEach(un=>{let pfp=map[un]||'https://via.placeholder.com/40';let vCount=(views||[]).filter(v=>grouped[un].some(st=>st.id==v.story_id)).length;h+=`<div class="story-item" onclick="viewStories('${un}')"><div class="story-ring"><img src="${pfp}"><span class="view-badge">👁️ ${vCount}</span></div><b>@${un} ${verifiedMap[un]?'🔵':''}</b></div>`;});storyBar.innerHTML=h;}

function viewStories(un){let list=curStories.filter(s=>s.username==un);openStory(list,0);}async function openStory(list,i){curView=list;storyView.style.display='flex';let s=list[i];svImg.src=s.image_url;svName.innerText='@'+s.username;svTick.innerHTML=verifiedMap[s.username]?'<span class="blue-tick">✓</span>':'';let {data:user}=await sb.from('users').select('profile_pic').eq('username',s.username).single();svPfp.src=user?.profile_pic||'https://via.placeholder.com/40';let u=localStorage.getItem('pix_user');await sb.from('story_views').insert([{story_id:s.id,viewer:u}]).catch(()=>{});let {data:views}=await sb.from('story_views').select('*').eq('story_id',s.id);svViews.innerText=`👁️ ${views?.length||0} views`;svViewers.innerHTML=`Viewed by: ${(views||[]).map(v=>`@${v.viewer} ${verifiedMap[v.viewer]?'🔵':''}`).join(', ')||'No views'}`;let p=0;clearInterval(timer);sprog.style.width='0%';timer=setInterval(()=>{p+=2;sprog.style.width=p+'%';if(p>=100){clearInterval(timer);i++;if(i<list.length)openStory(list,i);else closeStory();}},80);}function closeStory(){storyView.style.display='none';clearInterval(timer);loadStories();}
async function loadPosts(){let {data:posts}=await sb.from('posts').select('*').order('id',{ascending:false});let {data:users}=await sb.from('users').select('username,profile_pic,is_verified');let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:follows}=await sb.from('follows').select('*').eq('follower',localStorage.getItem('pix_user'));let {data:saves}=await sb.from('saves').select('*');let {data:views}=await sb.from('post_views').select('*');verifiedMap={};(users||[]).forEach(x=>verifiedMap[x.username]=x.is_verified);allPosts=posts||[];let following=(follows||[]).map(f=>f.following);let map={};(users||[]).forEach(x=>map[x.username]=x.profile_pic);renderPosts(allPosts,map,likes,comments,following,saves,views);}
function renderPosts(posts,map,likes,comments,following,saves,views){let u=localStorage.getItem('pix_user');let filtered=posts;if(currentFilter=='following')filtered=posts.filter(p=>following.includes(p.username)||p.username==u);if(currentFilter=='saved')filtered=posts.filter(p=>(saves||[]).some(s=>s.post_id==p.id&&s.username==u));let h='';filtered.forEach(p=>{let pfp=map[p.username]||'https://via.placeholder.com/40';let lc=(likes||[]).filter(l=>l.post_id==p.id);let cc=(comments||[]).filter(c=>c.post_id==p.id);let isSaved=(saves||[]).some(s=>s.post_id==p.id&&s.username==u);let vCount=(views||[]).filter(v=>v.post_id==p.id).length;let liked=lc.some(l=>l.username==u);let isFollowing=following.includes(p.username);let tick=verifiedMap[p.username]?'<span class="blue-tick">✓</span>':'';let fb=p.username==u?'':`<button class="follow-btn ${isFollowing?'following':''}" onclick="toggleFollow('${p.username}')">${isFollowing?'✓ Following':'+ Follow'}</button>`;h+=`<div class="post"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center" onclick="openUser('${p.username}')"><img class="pfp" src="${pfp}"><b>@${p.username}</b>${tick}</div>${fb}</div><img src="${p.image_url}" style="width:100%;border-radius:12px;margin:10px 0" onclick="addView(${p.id})"><p style="text-align:left;margin:6px 0">${p.caption||''}</p><div style="font-size:10px;color:#888;text-align:left">👁️ ${vCount} views • 💾 ${(saves||[]).filter(s=>s.post_id==p.id).length} saves</div><div class="action"><button class="like-btn ${liked?'liked':''}" onclick="likePost(${p.id})">${liked?'❤️':'🤍'} ${lc.length}</button><button class="like-btn" onclick="document.getElementById('cbox-${p.id}').focus()">💬 ${cc.length}</button><button class="save-btn ${isSaved?'saved':''}" onclick="savePost(${p.id})">${isSaved?'⭐ Saved':'☆ Save'}</button></div><div style="background:#0a0a0a;border-radius:10px;padding:8px">${cc.map(c=>`<div class="comment"><b>@${c.username} ${verifiedMap[c.username]?'🔵':''}</b> ${c.comment}</div>`).join('')}<div class="c-input"><input id="cbox-${p.id}" placeholder="Comment..."><button onclick="addComment(${p.id})" style="background:#FFD700">Send</button></div></div></div>`;});document.getElementById('posts').innerHTML=h||"<p style='color:#666'>No posts</p>";killBanner();}

async function toggleFollow(t){let u=localStorage.getItem('pix_user');if(u==t)return;let {data:ex}=await sb.from('follows').select('*').eq('follower',u).eq('following',t);if(ex&&ex.length>0){await sb.from('follows').delete().eq('follower',u).eq('following',t);}else{await sb.from('follows').insert([{follower:u,following:t}]);}loadPosts();loadStats();}
async function searchUsers(){let q=searchInput.value.trim().toLowerCase();if(!q){searchRes.style.display='none';return;}let {data:users}=await sb.from('users').select('username,profile_pic,is_verified').ilike('username','%'+q+'%');let me=localStorage.getItem('pix_user');let {data:follows}=await sb.from('follows').select('*').eq('follower',me);let following=(follows||[]).map(f=>f.following);let h='';(users||[]).forEach(u=>{if(u.username==me)return;let pfp=u.profile_pic||'https://via.placeholder.com/40';let isF=following.includes(u.username);let tick=u.is_verified?'<span class="blue-tick">✓</span>':'';h+=`<div class="search-item"><div style="display:flex;align-items:center" onclick="openUser('${u.username}')"><img class="pfp" src="${pfp}"><b>@${u.username}</b>${tick}</div><button class="follow-btn ${isF?'following':''}" onclick="toggleFollow('${u.username}');searchUsers()">${isF?'✓ Following':'+ Follow'}</button></div>`;});searchRes.innerHTML=h||"<p style='color:#666;padding:8px'>No users</p>";searchRes.style.display='block';}
async function openUser(un){curProfile=un;userView.style.display='flex';uvName.innerText='@'+un;uvTitle.innerHTML='@'+un+' '+(verifiedMap[un]?'<span class="blue-tick-big">✓</span>':'');uvPfp.src='https://via.placeholder.com/85';uvGrid.innerHTML='Loading...';let {data:user}=await sb.from('users').select('*').eq('username',un).single();if(user?.profile_pic)uvPfp.src=user.profile_pic;uvTick.innerHTML=user?.is_verified?'<span class="blue-tick-big">✓</span>':'';let {data:fer}=await sb.from('follows').select('*').eq('following',un);let {data:fing}=await sb.from('follows').select('*').eq('follower',un);let {data:posts}=await sb.from('posts').select('*').eq('username',un).order('id',{ascending:false});uvF.innerText=fer?.length||0;uvFg.innerText=fing?.length||0;uvP.innerText=posts?.length||0;let me=localStorage.getItem('pix_user');if(me==un){uvFollowBtn.style.display='none';}else{uvFollowBtn.style.display='block';let {data:ex}=await sb.from('follows').select('*').eq('follower',me).eq('following',un);uvFollowBtn.innerText=ex&&ex.length>0?'✓ Following':'+ Follow';uvFollowBtn.className=ex&&ex.length>0?'follow-btn following':'follow-btn';}uvGrid.innerHTML=!posts||posts.length==0?"<p style='color:#666;grid-column:1/4'>No posts</p>":posts.map(p=>`<img src="${p.image_url}">`).join('');}
function closeUser(){userView.style.display='none';}async function toggleFollowView(){let u=localStorage.getItem('pix_user');let {data:ex}=await sb.from('follows').select('*').eq('follower',u).eq('following',curProfile);if(ex&&ex.length>0){await sb.from('follows').delete().eq('follower',u).eq('following',curProfile);}else{await sb.from('follows').insert([{follower:u,following:curProfile}]);}openUser(curProfile);loadStats();loadPosts();}
function openPfpView(src){pfpView.style.display='flex';pfpBig.src=src;pfpName.innerHTML='@'+document.getElementById('uName').innerText+' '+(verifiedMap[document.getElementById('uName').innerText]?'🔵':'');}
function closePfpView(){pfpView.style.display='none';}
checkUser();
</script>
