<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO V1 - Thani Thani File</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH PAGE - Login/Signup thani page da -->
<div id="authPage" class="view" style="padding:20px">
  <h1 style="color:#FFD600;letter-spacing:8px;text-align:center;margin-top:40px">PIXORO V1</h1>
  <p style="text-align:center;color:#00ff88;font-size:10px;letter-spacing:3px">THANI THANI FILE - CHATGPT MARI</p>
  
  <div class="card" style="margin-top:30px">
    <h3 style="color:#FFD600">Signup - Puthusa</h3>
    <input id="su_user" placeholder="Username">
    <input id="su_pass" placeholder="Password" type="password">
    <button class="btn" onclick="signupUser()">Signup - Create Account</button>
  </div>

  <div class="card">
    <h3 style="color:#FFD600">Login - Irukka User</h3>
    <input id="li_user" placeholder="Username">
    <button class="btn" style="background:#111;color:#fff;border:1px solid #333" onclick="loginUser()">Login</button>
  </div>
</div>

<!-- MAIN APP - Login panna aprom varum da -->
<div id="mainApp" class="hidden">
  <div class="header"><div class="logo">PIXORO V1</div><button onclick="logoutUser()" style="background:#222;color:#fff;border:none;padding:6px 10px;border-radius:10px;font-size:10px">Logout</button></div>
  
  <div id="v-feed" class="view">
    <div class="card">
      <input id="new_post_img" placeholder="Image URL - https://picsum.photos/500/600">
      <input id="new_post_cap" placeholder="Caption">
      <button class="btn" onclick="createPost()">Post Create + Feed la varum</button>
    </div>
    <div id="feedList"></div>
  </div>

  <div id="v-profile" class="view hidden">
    <div class="card" style="text-align:center">
      <img id="p_pic" src="https://picsum.photos/80/80?1" style="width:72px;height:72px;border-radius:50%;border:3px solid #FFD600">
      <h3 id="p_username" style="color:#FFD600;margin-top:8px">Username</h3>
      <p id="p_bio" style="color:#888;font-size:11px">Bio</p>
      <input id="edit_bio" placeholder="New Bio">
      <button class="btn" onclick="updateProfile()">Update Profile</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tb a" onclick="document.getElementById('v-feed').classList.remove('hidden');document.getElementById('v-profile').classList.add('hidden')">🏠<br>Feed</div>
    <div class="tb" onclick="document.getElementById('v-feed').classList.add('hidden');document.getElementById('v-profile').classList.remove('hidden');loadProfile()">👤<br>Profile</div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
<script src="feed.js"></script>
<script>
// Check login
let u = localStorage.getItem('pix_user');
if(u){ document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); loadProfile(); loadFeed(); }
</script>
</body>
</html>
