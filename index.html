<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
#splash{position:fixed;top:0;left:0;width:100%;height:100vh;background:#000;z-index:99999;display:flex;justify-content:center;align-items:center;flex-direction:column}
.tabs{display:flex;justify-content:space-around;background:#111;padding:12px;position:sticky;top:0;z-index:99}
.tabs span{padding:6px 15px;border-radius:20px;cursor:pointer}
.tabs.active{background:#FFD600;color:#000;font-weight:bold}
.post-card{background:#111;margin:10px;border-radius:12px;padding:10px}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976)}
video,img{width:100%;border-radius:10px;margin-top:10px;max-height:500px;object-fit:cover}
#plus{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#FFD600;font-size:35px;border:none;z-index:9999}
#uploadBox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:100000;display:none;justify-content:center;align-items:center}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filter-bar button{padding:6px 12px;border-radius:15px;border:1px solid #FFD600;background:#000;color:#fff}
</style>
</head>
<body>

<!-- SPLASH DA -->
<div id="splash">
<h1 style="font-size:50px;font-weight:900;letter-spacing:5px">PIXORO</h1>
<p style="color:#FFD600">WORLD NO.1 SAFE APP</p>
</div>

<!-- TABS DA -->
<div class="tabs">
<span class="active" data-filter="All">All</span>
<span data-filter="Reels">Reels</span>
<span data-filter="Photo">Photo</span>
</div>

<!-- FEED DA -->
<div id="feed">
<!-- Default posts -->
<div class="post-card" data-type="Reels">
<div class="post-head"><div class="avatar"></div><b>pixoro_official</b></div>
<p>Welcome to PIXORO Reels! 🔥</p>
<video controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<audio controls style="width:100%;margin-top:5px" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1c0c0f0e4f.mp3"></audio>
</div>

<div class="post-card" data-type="Photo">
<div class="post-head"><div class="avatar"></div><b>pixoro_official</b></div>
<p>100% Safe for Girls & Kids! ❤️</p>
<img src="https://picsum.photos/500/500">
</div>
</div>

<!-- PLUS BUTTON DA -->
<button id="plus">+</button>

<!-- UPLOAD BOX DA - ITHU THAAN MUKKIYAM DA -->
<div id="uploadBox">
<div style="background:#222;padding:20px;border-radius:15px;width:90%;max-width:400px">
<h3>Upload to PIXORO</h3>
<input type="file" id="fileInput" accept="image/*,video/*" style="width:100%;margin:10px 0">
<select id="typeSelect" style="width:100%;padding:8px;border-radius:8px">
<option value="Photo">Photo</option>
<option value="Reels">Reels</option>
</select>
<select id="songSelect" style="width:100%;padding:8px;border-radius:8px;margin-top:10px">
<option value="">No Song</option>
<option value="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1c0c0f0e4f.mp3">Trending 1 - Happy</option>
<option value="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3">Trending 2 - Love</option>
<option value="https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3">Trending 3 - Mass</option>
</select>
<div class="filter-bar">
<button onclick="applyFilter('none')">Normal</button>
<button onclick="applyFilter('grayscale(100%)')">Retro</button>
<button onclick="applyFilter('sepia(100%)')">Vintage</button>
<button onclick="applyFilter('contrast(200%)')">High</button>
<button onclick="applyFilter('saturate(200%)')">Color Pop</button>
</div>
<input type="text" id="caption" placeholder="Caption..." style="width:100%;padding:8px;border-radius:8px;margin-top:10px">
<button onclick="uploadNow()" style="width:100%;background:#FFD600;border:none;padding:10px;border-radius:20px;margin-top:15px;font-weight:bold">POST NOW</button>
<button onclick="document.getElementById('uploadBox').style.display='none'" style="width:100%;background:#444;color:#fff;border:none;padding:8px;border-radius:20px;margin-top:10px">Cancel</button>
</div>
</div>

<script>
// SPLASH MARAIYA DA
setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);

// TABS FILTER 100% WORKING DA
document.querySelectorAll('.tabs span').forEach(tab=>{
tab.onclick=()=>{
document.querySelector('.tabs.active').classList.remove('active');
tab.classList.add('active');
let f=tab.dataset.filter;
document.querySelectorAll('.post-card').forEach(p=>{
if(f==='All') p.style.display='block';
else p.style.display=p.dataset.type===f?'block':'none';
});
}
});

// UPLOAD SYSTEM DA
let currentFilter='none';
let previewUrl='';

document.getElementById('plus').onclick=()=>{
document.getElementById('uploadBox').style.display='flex';
}

document.getElementById('fileInput').onchange=(e)=>{
let file=e.target.files[0];
if(file) previewUrl=URL.createObjectURL(file);
}

function applyFilter(f){
currentFilter=f;
}

function uploadNow(){
let file=document.getElementById('fileInput').files[0];
let type=document.getElementById('typeSelect').value;
let song=document.getElementById('songSelect').value;
let cap=document.getElementById('caption').value;
if(!file) {alert('Photo/Video select pannu da!'); return;}

let feed=document.getElementById('feed');
let div=document.createElement('div');
div.className='post-card';
div.dataset.type=type;

let media='';
if(type==='Photo'){
media=`<img style="filter:${currentFilter}" src="${previewUrl}">`;
} else {
media=`<video controls style="filter:${currentFilter}" src="${previewUrl}"></video>`;
}
let songHtml=song?`<audio controls style="width:100%;margin-top:5px" src="${song}"></audio>`:'';

div.innerHTML=`
<div class="post-head"><div class="avatar"></div><b>you</b></div>
<p>${cap}</p>
${media}
${songHtml}
<p style="font-size:10px;color:gray">Just now • ${type}</p>
`;
feed.prepend(div);
document.getElementById('uploadBox').style.display='none';
document.getElementById('caption').value='';
alert('Posted da Giri! 🔥');
}
</script>
</body>
</html>
