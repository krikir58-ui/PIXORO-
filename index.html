<!-- OneSignal Push - Pixoro -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "f69281e7-d3a7-450f-bd95-55002fd1613b",
      notifyButton: { enable: false },
    });
  });
  
  function enableNotif(){
    OneSignalDeferred.push(async function(OneSignal) {
      if(OneSignal.Notifications.permission){
        alert('Already ON da Giri! 🔥 Notification enabled da!');
        location.href='notifications.html';
        return;
      }
      await OneSignal.Notifications.requestPermission();
      if(OneSignal.Notifications.permission){
        alert('Super da Giri! Notification ON aayiduchu da! 🔥');
        await OneSignal.User.addTag("username", window.ME || "user");
      } else {
        alert('Block pannita da! Chrome settings la Allow pannu da!');
      }
    });
  }

  // Auto prompt after 4 sec
  setTimeout(() => {
    OneSignalDeferred.push(async function(OneSignal) {
      if(!OneSignal.Notifications.permission){
        OneSignal.Slidedown.promptPush();
      }
    });
  }, 4000);
</script>
<style>
