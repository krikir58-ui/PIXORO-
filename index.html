<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO 🚀</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#ff6a2b;color:#fff;min-height:100vh}
.top{background:#000;text-align:center;padding:14px;font-size:26px;font-weight:900;letter-spacing:2px;position:sticky;top:0;z-index:10}
.wrap{max-width:500px;margin:auto;padding:12px}
.card{background:#2b1212;border-radius:26px;padding:16px;border:1px solid #4a2a2a}
.btn{width:100%;background:#ff1a75;border:none;color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:17px}
#preview{width:100%;border-radius:18px;margin-top:12px;display:none;max-height:420px;object-fit:cover}
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:6px}
.filters button{white-space:nowrap;background:#1a1a1a;border:1px solid #333;color:#fff;padding:7px 14px;border-radius:20px}
.filters button.active{background:#ff1a75;border-color:#ff1a75}
.cap{width:100%;padding:14px;border-radius:12px;border:none;outline:none;margin-top:10px}
.post{background:#3a1a12;border-radius:28px;padding:12px;margin-top:18px;border:2px solid #5a2a1a}
.post img{width:100%;border-radius:20px;display:block}
.act{display:flex;gap:10px;margin-top:12px}
.act div{flex:1;padding:10px;border-radius:20px;text-align:center;font-weight:700;background:#222;cursor:pointer}
.act div.like{background:#ff1a75}
.act div.liked{background:#fff;color:#ff1a75}
.cmt-view{background:#111;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:14px}
.cmt-box{display:flex;gap:8px;margin-top:10px}
.cmt-box input{flex:1;padding:12px 16px;border-radius:22px;border:none;outline:none}
.cmt-box button{background:#ff1a75;border:none;color:#fff;padding:0 18px;border-radius:22px;font-weight:800}
/* Share Sheet */
#shareSheet{position:fixed;bottom:0;left:0;right:0;background:#111;border-radius:22px 22px 0 0;padding:18px;display:none;z-index:99}
#shareSheet a{display:block;background:#222;color:#fff;text-decoration:none;padding:12px;border-radius:12px;margin-top:8px;text-align:center;font-weight:600}
</style>
</head>
<body>
<div class="top">PIXORO 🚀</div>
<div class="wrap">
  <div class="card">
    <label for="fileIn" class="btn">📁 Choose File</label>
    <input type="file" id="fileIn" accept="image/*" style="display:none">
    <img id="preview">
    <div class="filters" id="filterBox"></div>
    <input id="capIn" class="cap" placeholder="Caption...">
    <div style="height:10px"></div>
    <button class="btn" onclick="doPost()">🚀 Post</button>
  </div>
  <div id="feed"></div>
</div>

<div id="shareSheet">
  <b>Share via</b>
  <a id="s_whatsapp" target="_blank">WhatsApp</a>
  <a id="s_telegram" target="_blank">Telegram</a>
  <a id="s_fb" target="_blank">Facebook</a>
  <a id="s_mail" target="_blank">Gmail / Mail</a>
  <a onclick="copyLink()">Copy Link</a>
  <a onclick="closeShare()" style="background:#ff1a75">Close</a>
</div>
