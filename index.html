<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO - WORLD NO 1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
#splash{position:fixed;top:0;left:0;width:100%;height:100vh;background:#000;z-index:999999;display:flex;justify-content:center;align-items:center;flex-direction:column}
.tabs{display:flex;justify-content:space-around;background:#111;padding:14px;position:sticky;top:0;z-index:100}
.tabs span{padding:7px 20px;border-radius:20px;cursor:pointer;border:1px solid #333}
.tabs span.active{background:#FFD600;color:#000;font-weight:900;border-color:#FFD600}
.story-bar{display:flex;gap:12px;padding:12px;overflow-x:auto;background:#0a0a0a;border-bottom:1px solid #222}
.story{width:65px;text-align:center;flex-shrink:0}
.story-ring{width:65px;height:65px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
.story-ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover}
.post-card{background:#111;margin:10px;border-radius:15px;padding:12px;border:1px solid #222}
.post-head{display:flex;align-items:center;justify-content:space-between}
.post-head-left{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(45deg,#FFD600,#FF9500)}
.post-card img,.post-card video{width:100%;border-radius:12px;margin-top:10px;max-height:600px;object-fit:cover}
.actions{display:flex;justify-content:space-between;margin-top:12px}
.actions-left{display:flex;gap:15px}
.icon{font-size:22px;cursor:pointer;user-select:none}
.icon.liked{color:#ff3040;transform:scale(1.2)}
.count{font-size:12px;color:#aaa;margin-top:3px}
.comment-box{display:flex;gap:8px;margin-top:10px}
.comment-box input{flex:1;background:#222;border:none;padding:8px 12px;border-radius:20px;color:#fff;outline:none}
.save-active{color:#FFD600}
#plus{position:fixed;bottom:25px;right:25px;width:62px;height:62px;border-radius:50%;background:#FFD600;font-size:40px;border:none;color:#000;font-weight:bold;z-index:9999;box-shadow:0 4px 15px #FFD600}
#uploadBox{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.96);z-index:100000;display:none;justify-content:center;align-items:center;padding:15px}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filter-bar button{padding:6px 14px;border-radius:20px;border:1px solid #FFD600;background:#111;color:#fff;white-space:nowrap}
.clarendon{filter:contrast(1.2) saturate(1.35)}
.juno{filter:sepia(0.15) saturate(1.5) brightness(1.1)}
.lark{filter:brightness(1.1) saturate(0.9)}
.gingham{filter:grayscale(0.2) sepia(0.1)}
.moon{filter:grayscale(1)}
</style></head><body>

<div id="splash"><h1 style="font-size:55px;letter-spacing:6px;font-weight:900">PIXORO</h1><p style="color:#FFD600;margin-top:10px;font-weight:bold;letter-spacing:2px">WORLD NO.1 SAFE APP</p><p style="font-size:12px;color:#666;margin-top:20px">Loading Mass Features...</p></div>

<div class="tabs"><span class="active" data-f="All">All</span><span data-f="Reels">Reels</span><span data-f="Photo">Photo</span><span data-f="Saved">Saved ❤️</span></div>

<div class="story-bar">
<div class="story"><div class="story-ring"><img src="https://picsum.photos/100/100?1"></div><p style="font-size:10px;margin-top:4px">you</p></div>
<div class="story"><div class="story-ring"><img src="https://picsum.photos/100/100?2"></div><p style="font-size:10px;margin-top:4px">girl_safe</p></div>
<div class="story"><div class="story-ring"><img src="https://picsum.photos/100/100?3"></div><p style="font-size:10px;margin-top:4px">kids_fun</p></div>
</div>

<div id="feed"></div>
<button id="plus">+</button>

<div id="uploadBox">
<div style="background:#1a1a1a;width:100%;max-width:420px;border-radius:20px;padding:20px;border:1px solid #333">
<h3 style="color:#FFD600">Create PIXORO Post 🔥</h3>
<input type="file" id="fileInput" accept="image/*,video/*" style="width:100%;margin:12px 0;color:#fff">
<select id="typeSelect" style="width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #333"><option value="Photo">Photo</option><option value="Reels">Reels</option></select>
<select id="songSelect" style="width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #333;margin-top:10px">
<option value="">No Music</option><option value="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1c0c0f0e4f.mp3">Trending - Happy</option><option value="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3">Trending - Love</option><option value="https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3">Trending - Mass Beat</option>
</select>
<div class="filter-bar"><button onclick="setF('')">Normal</button><button onclick="setF('clarendon')">Clarendon</button><button onclick="setF('juno')">Juno</button><button onclick="setF('lark')">Lark</button><button onclick="setF('moon')">Moon</button><button onclick="setF('gingham')">Gingham</button></div>
<input type="text" id="capInput" placeholder="Write a caption..." style="width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #333;margin-top:8px">
<button onclick="postNow()" style="width:100%;background:#FFD600;color:#000;border:none;padding:12px;border-radius:25px;margin-top:15px;font-weight:900;font-size:16px">POST NOW 🚀</button>
<button onclick="document.getElementById('uploadBox').style.display='none'" style="width:100%;background:#222;color:#fff;border:none;padding:10px;border-radius:25px;margin-top:10px">Cancel</button>
</div>
</div>

<script>
let curFilter='';
let curUrl='';
let posts=JSON.parse(localStorage.getItem('pixoro_posts'))||[
{id:1,type:'Reels',user:'pixoro_official',cap:'Welcome to PIXORO Reels! World Safe App 🔥',media:'https://www.w3schools.com/html/mov_bbb.mp4',isVideo:true,likes:1250,liked:false,saved:false,views:5420,filter:'',song:'https://cdn.pixabay.com/download/audio/2022/03/10/audio_1c0c0f0e4f.mp3',comments:[{u:'girl_safe',t:'Super da!'}],followed:false},
{id:2,type:'Photo',user:'girl_safe',cap:'100% Safe for Girls & Kids ❤️',media:'https://picsum.photos/500/600?random=5',isVideo:false,likes:890,liked:false,saved:false,views:1200,filter:'clarendon',song:'',comments:[],followed:false}
];
function setF(f){curFilter=f;}
document.getElementById('plus').onclick=()=>document.getElementById('uploadBox').style.display='flex';
document.getElementById('fileInput').onchange=e=>{let f=e.target.files[0]; if(f) curUrl=URL.createObjectURL(f); document.getElementById('typeSelect').value=f.type.includes('video')?'Reels':'Photo';}

function savePosts(){localStorage.setItem('pixoro_posts',JSON.stringify(posts));}
function render(){
let feed=document.getElementById('feed'); feed.innerHTML='';
let activeTab=document.querySelector('.tabs span.active').dataset.f;
posts.forEach(p=>{
if(activeTab!=='All' && activeTab!=='Saved' && p.type!==activeTab) return;
if(activeTab==='Saved' &&!p.saved) return;
let media=p.isVideo?`<video class="${p.filter}" onplay="addView(${p.id})" controls playsinline src="${p.media}"></video>`:`<img class="${p.filter}" src="${p.media}">`;
let song=p.song?`<audio controls style="width:100%;margin-top:8px" src="${p.song}"></audio>`:'';
let comments=p.comments.map(c=>`<p style="font-size:13px;margin-top:4px"><b>${c.u}</b> ${c.t}</p>`).join('');
feed.innerHTML+=`
<div class="post-card" data-type="${p.type}">
<div class="post-head"><div class="post-head-left"><div class="avatar"></div><div><b>${p.user}</b><p style="font-size:10px;color:#aaa">Coimbatore • ${p.views} Views</p></div></div><button onclick="follow(${p.id})" style="background:${p.followed?'#333':'#FFD600'};color:${p.followed?'#fff':'#000'};border:none;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold">${p.followed?'Following':'Follow'}</button></div>
<p style="margin-top:10px;font-size:14px">${p.cap}</p>
${media}${song}
<div class="actions"><div class="actions-left"><div><span class="icon ${p.liked?'liked':''}" onclick="like(${p.id})">${p.liked?'❤️':'🤍'}</span><div class="count">${p.likes} Likes</div></div><div><span class="icon" onclick="document.getElementById('c${p.id}').focus()">💬</span><div class="count">${p.comments.length} Comments</div></div></div><span class="icon ${p.saved?'save-active':''}" onclick="saveP(${p.id})">${p.saved?'🔖':'📑'}</span></div>
<div style="margin-top:10px">${comments}</div>
<div class="comment-box"><input id="c${p.id}" placeholder="Add a comment..."><button onclick="comment(${p.id})" style="background:#FFD600;border:none;padding:8px 14px;border-radius:20px;font-weight:bold">Post</button></div>
</div>`;
});
}
function like(id){let p=posts.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; savePosts(); render();}
function saveP(id){let p=posts.find(x=>x.id===id); p.saved=!p.saved; savePosts(); render();}
function follow(id){let p=posts.find(x=>x.id===id); p.followed=!p.followed; savePosts(); render();}
function comment(id){let inp=document.getElementById('c'+id); if(!inp.value.trim()) return; let p=posts.find(x=>x.id===id); p.comments.push({u:'you',t:inp.value}); inp.value=''; savePosts(); render();}
function addView(id){let p=posts.find(x=>x.id===id); p.views++; savePosts(); render();}
function postNow(){
let file=document.getElementById('fileInput').files[0];
if(!file||!curUrl){alert('Photo/Video select pannu da Giri!');return;}
let type=document.getElementById('typeSelect').value;
let song=document.getElementById('songSelect').value;
let cap=document.getElementById('capInput').value||'My PIXORO Post 🔥';
let newPost={id:Date.now(),type:type,user:'you',cap:cap,media:curUrl,isVideo:type==='Reels',likes:0,liked:false,saved:false,views:1,filter:curFilter,song:song,comments:[],followed:false};
posts.unshift(newPost); savePosts(); render();
document.getElementById('uploadBox').style.display='none'; document.getElementById('capInput').value=''; document.getElementById('fileInput').value=''; curUrl=''; curFilter='';
alert('POSTED DA GIRI! MASS DA 🔥');
}
document.querySelectorAll('.tabs span').forEach(t=>{
t.onclick=()=>{document.querySelector('.tabs span.active').classList.remove('active'); t.classList.add('active'); render();}
});
setTimeout(()=>{document.getElementById('splash').style.display='none'; render();},2500);
render();
</script></body></html>
