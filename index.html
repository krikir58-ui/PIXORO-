<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIXORO - Tiruchuli to World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
::-webkit-scrollbar{display:none}
.ig-header{height:60px;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#000;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:100}
.ig-logo{font-family:'Grand Hotel',cursive;font-size:32px;cursor:pointer}
.page{max-width:500px;margin:0 auto;padding-top:60px;padding-bottom:60px;min-height:100vh;display:none}
.page.active{display:block}
.stories-wrap{display:flex;gap:12px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #121212;background:#000}
.story-item{flex:0 0 66px;text-align:center;cursor:pointer;position:relative}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.story-ring.no-story{background:#333}
.story-ring-inner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.story-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.story-name{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;width:66px;text-overflow:ellipsis}
.story-add{position:absolute;bottom:14px;right:0;width:20px;height:20px;background:#0095f6;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.ig-post{border-bottom:1px solid #262626;background:#000}
.ig-post-header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.ig-post-user{display:flex;align-items:center;gap:10px;cursor:pointer}
.ig-post-user img{width:32px;height:32px;border-radius:50%;background:#222;object-fit:cover}
.ig-post-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;cursor:pointer}
.post-action-bar{display:flex;justify-content:space-between;align-items:center;padding:12px}
.post-action-left{display:flex;gap:18px}
.action-item{display:flex;align-items:center;gap:6px;cursor:pointer}
.action-item svg{width:22px;height:22px;stroke:#fff;stroke-width:1.6;fill:none}
.action-item.liked svg{fill:#ff3040;stroke:#ff3040}
.action-item span{font-size:14px;font-weight:500}
.mass-profile-top{height:110px;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);border-radius:0 0 20px 20px}
.mass-profile-avatar-wrap{margin-top:-48px;padding:0 16px;display:flex;gap:14px;align-items:flex-end}
.mass-avatar{width:92px;height:92px;border-radius:50%;border:4px solid #000;object-fit:cover;box-shadow:0 0 0 3px #262626,0 0 20px rgba(214,41,118,.5)}
.mass-stat{flex:1;background:#111;border:1px solid #262626;border-radius:12px;padding:10px;text-align:center}
.mass-stat b{display:block;font-size:18px}
.mass-stat span{font-size:11px;color:#8e8e8e;text-transform:uppercase}
.mass-bio-box{padding:16px}
.mass-bio{font-size:14px;color:#e0e0e0;margin-top:6px;line-height:18px}
.mass-action-row{display:flex;gap:8px;margin-top:12px}
.mass-btn{flex:1;padding:8px;border-radius:8px;border:none;font-weight:600;cursor:pointer}
.mass-btn-secondary{background:#262626;color:#fff}
.mass-btn-follow{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976);color:#fff}
.explore-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.explore-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;cursor:pointer}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:350px;border:1px solid #262626;padding:30px 20px;text-align:center;background:#000}
.login-logo{font-family:'Grand Hotel',cursive;font-size:52px;margin-bottom:12px}
.login-input{width:100%;padding:10px;background:#121212;border:1px solid #333;border-radius:3px;color:#fff;margin:5px 0;font-size:12px;outline:none}
.ig-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:50px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.ig-bottom button{background:none;border:none;font-size:24px;color:#fff;cursor:pointer}
.ig-bottom button.active{color:#fff}
.reels-container{height:calc(100vh - 110px);overflow-y:scroll;scroll-snap-type:y mandatory}
.reel-item{height:calc(100vh - 110px);position:relative;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
.reel-item img{width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.reel-actions{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:20px;align-items:center}
.reel-action{cursor:pointer;text-align:center}
.reel-action svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.6}
.reel-action.liked svg{fill:#ff3040;stroke:#ff3040}
.reel-action span{font-size:12px;font-weight:600;margin-top:4px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:none;flex-direction:column}
.modal.active{display:flex}
.tag-chip{background:#111;border:1px solid #262626;padding:4px 10px;border-radius:16px;font-size:12px;display:inline-block;margin:2px;cursor:pointer}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap"><div class="login-box"><div class="login-logo">Pixoro</div><p style="color:#8e8e8e;font-size:12px;margin-bottom:20px;">Tiruchuli to World 🌍</p><input id="email" class="login-input" placeholder="Email"><input id="pass" class="login-input" type="password" placeholder="Password"><button onclick="login()" style="width:100%;background:#0095f6;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:600;margin-top:10px;">Log in</button><p style="margin-top:20px;font-size:12px;color:#8e8e8e;">Don't have account? <span style="color:#0095f6;font-weight:600;cursor:pointer;" onclick="signup()">Sign up</span></p></div></div>
<div id="app" style="display:none;">
<div class="ig-header"><div class="ig-logo" onclick="showPage('home')">Pixoro</div><div style="display:flex;gap:14px;align-items:center;"><span onclick="openUpload('post')" style="border:1px solid #fff;padding:3px 10px;border-radius:8px;font-size:14px;cursor:pointer;">+ Post</span><span onclick="openUpload('reel')" style="border:1px solid #262626;background:#111;padding:3px 10px;border-radius:8px;font-size:14px;cursor:pointer;">+ Reel</span><span onclick="showPage('notifications')" style="cursor:pointer;">🔔</span></div></div>
<div id="homePage" class="page active"><div class="stories-wrap" id="storiesWrap"><div class="story-item" onclick="openUpload('story')"><div class="story-ring no-story"><div class="story-ring-inner" style="font-size:28px;">+</div></div><div class="story-name">Your story</div><div class="story-add">+</div></div></div><div id="feedList"></div></div>
<div id="searchPage" class="page"><div style="padding:8px 12px;position:sticky;top:60px;background:#000;z-index:10;"><input id="searchInput" class="login-input" placeholder="Search user, tag, location..." oninput="searchAll()" style="margin:0;"></div><div id="searchResults"></div><div id="searchTags" style="padding:10px;display:flex;flex-wrap:wrap;gap:6px;"></div><div class="explore-grid" id="exploreGrid"></div></div>
<div id="reelsPage" class="page" style="padding:0;"><div class="reels-container" id="reelsList"></div></div>
<div id="notificationsPage" class="page"><div style="padding:16px;font-weight:600;border-bottom:1px solid #262626;display:flex;justify-content:space-between;"><span>Notifications</span><span style="color:#0095f6;cursor:pointer;" onclick="loadRequests()">Follow Requests</span></div><div id="notifList" style="padding:12px;"></div></div>
<div id="chatPage" class="page"><div style="padding:16px;font-weight:600;border-bottom:1px solid #262626;">Messages</div><div style="padding:12px;color:#8e8e8e;">No messages yet</div></div>
<div id="profilePage" class="page"><div class="mass-profile-top"></div><div class="mass-profile-avatar-wrap"><img id="pAvatar" class="mass-avatar"><div style="flex:1;padding-bottom:6px;"><div style="display:flex;gap:6px;align-items:center;"><b id="pName">Pixoro User</b><div style="width:18px;height:18px;background:#0095f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;">✓</div></div><div style="font-size:12px;color:#8e8e8e;">@<span id="pHandle">user</span> • 👁️ <span id="pViews">0</span> views • 📍 <span id="pLoc">Tiruchuli</span></div></div></div><div class="mass-profile-stats" style="padding:0 16px;margin-top:12px;"><div class="mass-stat"><b id="pPosts">0</b><span>Posts</span></div><div class="mass-stat"><b id="pFollowers">0</b><span>Followers</span></div><div class="mass-stat"><b id="pFollowing">0</b><span>Following</span></div></div><div class="mass-bio-box"><b id="pFullName"></b><div id="pBio" class="mass-bio">Tiruchuli to World 🌍</div><div id="pWebsite" style="color:#0095f6;font-size:13px;margin-top:4px;"></div><div class="mass-action-row"><button id="editBtn" class="mass-btn mass-btn-secondary" onclick="openEdit()">Edit profile</button><button id="followBtn" class="mass-btn mass-btn-follow" style="display:none;" onclick="sendFollowRequest()">Follow</button><button class="mass-btn mass-btn-secondary" onclick="sharePost(window.location.href)">Share</button><button onclick="logout()" style="padding:8px 12px;background:#111;border:1px solid #262626;color:#fff;border-radius:8px;">⎋</button></div></div><div style="display:flex;justify-content:space-around;border-top:1px solid #262626;border-bottom:1px solid #262626;margin-top:8px;"><button style="flex:1;padding:12px;background:none;border:none;color:#fff;">⊞</button><button style="flex:1;padding:12px;background:none;border:none;color:#8e8e8e;" onclick="showPage('reels')">▶️</button><button style="flex:1;padding:12px;background:none;border:none;color:#8e8e8e;">🔖</button></div><div class="explore-grid" id="profilePosts"></div></div>
<div class="ig-bottom"><button id="bHome" class="active" onclick="showPage('home')">⌂</button><button id="bSearch" onclick="showPage('search')">⌕</button><button id="bReels" onclick="showPage('reels')">▶</button><button id="bChat" onclick="showPage('chat')">♡</button><button id="bProfile" onclick="openMyProfile()">◯</button></div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none;">
<div id="uploadBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;">
<div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #262626;"><button onclick="document.getElementById('uploadBox').style.display='none'" style="background:none;border:none;color:#fff;font-size:18px;">✕</button><b id="uploadTitle">New post</b><button onclick="uploadPost()" style="background:none;border:none;color:#0095f6;font-weight:700;">Share</button></div>
<div style="width:100%;aspect-ratio:1/1;background:#111;display:flex;align-items:center;justify-content:center;"><img id="uploadPreview" style="max-width:100%;max-height:100%;display:none;"></div>
<div style="padding:12px;max-height:50vh;overflow-y:auto;">
<textarea id="captionInput" placeholder="Write a caption... Tiruchuli to World 🌍" style="width:100%;background:none;border:none;color:#fff;outline:none;resize:none;font-size:15px;margin-bottom:12px;"></textarea>
<input id="tagInput" class="login-input" placeholder="#Tags - Ex: coimbatore, photography, tiruchuli">
<input id="locInput" class="login-input" placeholder="📍 Location - Ex: Coimbatore, Tiruchuli">
<div style="display:flex;gap:8px;margin-top:8px;">
<button onclick="document.getElementById('postType').value='post'" style="flex:1;padding:8px;background:#fff;color:#000;border:none;border-radius:6px;font-weight:600;">📷 Post</button>
<button onclick="document.getElementById('postType').value='reel'" style="flex:1;padding:8px;background:#262626;color:#fff;border:none;border-radius:6px;font-weight:600;">▶️ Reel</button>
<button onclick="document.getElementById('postType').value='story'" style="flex:1;padding:8px;background:#262626;color:#fff;border:none;border-radius:6px;font-weight:600;">⭕ Story</button>
</div>
<input type="hidden" id="postType" value="post">
</div>
</div>
<div id="commentModal" class="modal"><div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #262626;background:#000;"><button onclick="closeComments()" style="background:none;border:none;color:#fff;">✕</button><b>Comments</b><span style="color:#0095f6;" onclick="closeComments()">Done</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:12px;"></div><div style="padding:10px;border-top:1px solid #262626;display:flex;gap:8px;background:#000;"><input id="commentInput" placeholder="Add a comment..." style="flex:1;background:#121212;border:1px solid #333;border-radius:20px;padding:8px 12px;color:#fff;outline:none;"><button onclick="postComment()" style="background:none;border:none;color:#0095f6;font-weight:600;">Post</button></div></div>
<div id="photoModal" class="modal" onclick="this.classList.remove('active')"><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;"><img id="photoFull" style="max-width:100%;max-height:90vh;object-fit:contain;"></div><div style="padding:12px;text-align:center;background:#000;"><b id="photoUser"></b> <span id="photoCaption" style="color:#ccc;"></span><br><small id="photoMeta" style="color:#8e8e8e;"></small></div></div>
<div id="storyModal" class="modal" onclick="this.classList.remove('active')" style="background:#000;"><div style="flex:1;display:flex;flex-direction:column;"><div style="padding:14px;display:flex;justify-content:space-between;align-items:center;"><div style="display:flex;gap:10px;align-items:center;"><img id="storyUserImg" style="width:32px;height:32px;border-radius:50%;"><b id="storyUserName"></b></div><button onclick="document.getElementById('storyModal').classList.remove('active')" style="background:none;border:none;color:#fff;font-size:20px;">✕</button></div><div style="flex:1;display:flex;align-items:center;justify-content:center;"><img id="storyFullImg" style="max-width:100%;max-height:80vh;object-fit:contain;"></div><div style="padding:12px;text-align:center;"><small id="storyTime" style="color:#8e8e8e;"></small></div></div></div>
<script>
const SUPABASE_URL='https://yecpltndhlzfjplzhcpm.supabase.co';
const SUPABASE_KEY='sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, currentProfile=null, viewingUserId=null, currentPostId=null, likedPosts=new Set(), uploadMode='post';
async function checkSession(){let {data}=await supabase.auth.getSession();if(data.session){currentUser=data.session.user;document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';await loadProfileData();loadFeed();loadStories();loadExplore();loadLikes();}}checkSession();
async function login(){let e=document.getElementById('email').value.trim();let p=document.getElementById('pass').value.trim();if(!e||!p)return alert("Email & Pass podu da!");let {data,error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error)return alert(error.message);currentUser=data.user;document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';await loadProfileData();loadFeed();loadStories();loadExplore();loadLikes();}
async function signup(){let e=document.getElementById('email').value.trim();let p=document.getElementById('pass').value.trim();if(!e||!p)return alert("Email & Pass podu!");let {data,error}=await supabase.auth.signUp({email:e,password:p});if(error)return alert(error.message);if(data.user){await supabase.from('profiles').insert({id:data.user.id,username:e.split('@')[0],bio:'Tiruchuli to World 🌍',full_name:e.split('@')[0]});alert("Account created da! Login pannu!");}}
async function logout(){await supabase.auth.signOut();location.reload();}
function showPage(p){document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));document.getElementById(p+'Page').classList.add('active');document.querySelectorAll('.ig-bottom button').forEach(b=>b.classList.remove('active'));let btn=document.getElementById('b'+p.charAt(0).toUpperCase()+p.slice(1));if(btn)btn.classList.add('active');if(p==='home'){loadFeed();loadStories();}if(p==='profile')loadProfile();if(p==='reels')loadReels();if(p==='search')loadExplore();}
function openMyProfile(){viewingUserId=currentUser.id;showPage('profile');loadProfile();}
function openUpload(mode){uploadMode=mode;document.getElementById('postType').value=mode;document.getElementById('uploadTitle').innerText=mode==='story'?'New Story':mode==='reel'?'New Reel':'New Post';document.getElementById('fileInput').click();}
async function loadProfileData(){if(!currentUser)return;try{let {data:profile,error}=await supabase.from('profiles').select('*').eq('id',currentUser.id).single();if(error||!profile){let uname=currentUser.email.split('@')[0];profile={username:uname,bio:'Tiruchuli to World 🌍',full_name:uname,avatar_url:`https://i.pravatar.cc/150?u=${uname}`};await supabase.from('profiles').insert({id:currentUser.id,username:uname,bio:'Tiruchuli to World 🌍',full_name:uname}).select();}currentProfile=profile;viewingUserId=currentUser.id;document.getElementById('pName').innerText=profile.username||'Pixoro User';document.getElementById('pHandle').innerText=profile.username||'user';document.getElementById('pAvatar').src=profile.avatar_url||`https://i.pravatar.cc/150?u=${profile.username}`;document.getElementById('pBio').innerText=profile.bio||'Tiruchuli to World 🌍';document.getElementById('pFullName').innerText=profile.full_name||profile.username;document.getElementById('pWebsite').innerText=profile.website||'';document.getElementById('pLoc').innerText=profile.website||'Tiruchuli';}catch(e){console.log('profile error',e);document.getElementById('pName').innerText=currentUser.email.split('@')[0];}}
async function loadLikes(){if(!currentUser)return;let {data}=await supabase.from('likes').select('post_id').eq('user_id',currentUser.id);if(data)likedPosts=new Set(data.map(l=>l.post_id));}
function formatCount(n){if(!n)return '0';if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(1)+'K';return n.toString();}
async function loadStories(){
 let {data:stories}=await supabase.from('stories').select('*,profiles(username,avatar_url)').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(20);
 let wrap=document.getElementById('storiesWrap');
 let yourStory=`<div class="story-item" onclick="openUpload('story')"><div class="story-ring no-story"><div class="story-ring-inner" style="font-size:28px;">+</div></div><div class="story-name">Your story</div><div class="story-add">+</div></div>`;
 if(!stories||stories.length===0){wrap.innerHTML=yourStory;return;}
 let grouped={};
 stories.forEach(s=>{if(!grouped[s.user_id]) grouped[s.user_id]=s;});
 let html=yourStory;
 Object.values(grouped).forEach(s=>{
   html+=`<div class="story-item" onclick="openStory('${s.image_url}','${s.profiles?.username||'user'}','${s.user_id}')"><div class="story-ring"><div class="story-ring-inner"><img src="${s.image_url}"></div></div><div class="story-name">${s.profiles?.username||'user'}</div></div>`;
 });
 wrap.innerHTML=html;
}
function openStory(img,username,userId){document.getElementById('storyFullImg').src=img;document.getElementById('storyUserName').innerText=username;document.getElementById('storyUserImg').src=`https://i.pravatar.cc/100?u=${userId}`;document.getElementById('storyTime').innerText='Today';document.getElementById('storyModal').classList.add('active');}
async function loadFeed(){
 let {data:posts,error}=await supabase.from('posts').select('*').eq('post_type','post').order('created_at',{ascending:false}).limit(30);
 let feed=document.getElementById('feedList');
 if(error){feed.innerHTML=`<div style="padding:20px;color:#f55;">${error.message}</div>`;return;}
 if(!posts||posts.length===0){feed.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#8e8e8e;"><h3 style="color:#fff;">Welcome to Pixoro</h3><p style="margin-top:8px;">First post podu da Giri 🚀</p><br><button onclick="openUpload('post')" style="background:#0095f6;color:#fff;padding:8px 16px;border:none;border-radius:8px;">Share first photo</button></div>`;return;}
 let featured=[...posts].sort((a,b)=>(b.likes_count||0)-(a.likes_count||0)).slice(0,3);
 let featuredHTML='';
 if(featured.length>0 && (featured[0].likes_count||0)>=1){
   featuredHTML=`<div style="padding:12px;border-bottom:1px solid #262626;background:#0a0a0a;"><div style="font-weight:700;font-size:12px;margin-bottom:10px;">🔥 FEATURED • TRENDING</div><div style="display:flex;gap:10px;overflow-x:auto;">${featured.map(p=>`<div style="min-width:240px;background:#111;border:1px solid #262626;border-radius:12px;overflow:hidden;"><img src="${p.image_url}" style="width:100%;aspect-ratio:1/1;object-fit:cover;"><div style="padding:8px;display:flex;gap:10px;font-size:12px;background:#000;"><span>❤️ ${formatCount(p.likes_count)}</span><span>👁️ ${formatCount(p.views_count||0)}</span></div></div>`).join('')}</div></div>`;
 }
 feed.innerHTML=featuredHTML+posts.map(p=>{
   let isLiked=likedPosts.has(p.id);
   let likes=p.likes_count||0; if(likes===0) likes=Math.floor(Math.random()*80)+2;
   return `<div class="ig-post">
     <div class="ig-post-header"><div class="ig-post-user" onclick="openUserProfile('${p.user_id}')"><img src="https://i.pravatar.cc/100?u=${p.user_id}"><div><b style="font-size:14px;">${p.username||'user'}</b>${p.location?`<br><small style="font-size:11px;color:#8e8e8e;">📍 ${p.location}</small>`:''}</div></div><span>⋯</span></div>
     <img class="ig-post-img" src="${p.image_url}" onclick="viewPost('${p.id}','${p.image_url}','${p.username||'user'}','${p.caption||''}','${p.location||''}','${p.tags||''}')">
     <div class="post-action-bar"><div class="post-action-left">
       <div class="action-item ${isLiked?'liked':''}" onclick="likePost('${p.id}')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.35-9-8.5S4.5 3 9 5.5 12 10 12 10s1.5-4.5 6-4.5 7.5 5 4 9.5-9 8.5-9 8.5z"/></svg><span>${formatCount(likes)}</span></div>
       <div class="action-item" onclick="openComments('${p.id}')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 0 1 21 11.5z"/></svg><span>${formatCount(p.comments_count||0)}</span></div>
       <div class="action-item" onclick="sharePost('${p.image_url}')"><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>${formatCount(Math.floor(likes/3))}</span></div>
       <div class="action-item" onclick="sharePost('${p.image_url}')"><svg viewBox="0 0 24 24"><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg><span>${formatCount(p.views_count||0)}</span></div>
     </div><div class="action-item bookmark"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div></div>
     ${p.tags?`<div style="padding:0 12px 4px;">${p.tags.split(',').map(t=>`<span class='tag-chip'>#${t.trim()}</span>`).join('')}</div>`:''}
     <div style="padding:0 12px 2px;font-size:12px;color:#8e8e8e;">👁️ ${formatCount(p.views_count||0)} views ${p.location?'• 📍 '+p.location:''}</div>
     <div style="padding:4px 12px 12px;font-size:14px;"><b>${p.username||'user'}</b> ${p.caption||''}</div>
   </div>`
 }).join('');
}
async function viewPost(id,url,user,caption,location,tags){
 try{let {data:p}=await supabase.from('posts').select('views_count').eq('id',id).single();await supabase.from('posts').update({views_count:(p.views_count||0)+1}).eq('id',id);}catch(e){}
 document.getElementById('photoFull').src=url;
 document.getElementById('photoUser').innerText=user?'@'+user:'';
 document.getElementById('photoCaption').innerText=caption||'';
 document.getElementById('photoMeta').innerText=(location?'📍 '+location+' ':'')+(tags?'#'+tags:'');
 document.getElementById('photoModal').classList.add('active');
}
async function loadReels(){
 let {data:reels}=await supabase.from('posts').select('*').eq('post_type','reel').order('created_at',{ascending:false}).limit(20);
 let el=document.getElementById('reelsList');
 if(!reels||reels.length===0){
   let {data:all}=await supabase.from('posts').select('*').order('created_at',{ascending:false}).limit(10);
   reels=all;
 }
 if(!reels||reels.length===0){el.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#8e8e8e;">No reels yet - Reel upload pannu da!</div>`;return;}
 el.innerHTML=reels.map(r=>{
   let isLiked=likedPosts.has(r.id);
   return `<div class="reel-item">
     <img src="${r.image_url}" onclick="viewPost('${r.id}','${r.image_url}')">
     <div class="reel-actions">
       <div class="reel-action ${isLiked?'liked':''}" onclick="likePost('${r.id}')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.35-9-8.5S4.5 3 9 5.5 12 10 12 10s1.5-4.5 6-4.5 7.5 5 4 9.5-9 8.5-9 8.5z"/></svg><span>${formatCount(r.likes_count||0)}</span></div>
       <div class="reel-action" onclick="openComments('${r.id}')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 0 1 21 11.5z"/></svg><span>${formatCount(r.comments_count||0)}</span></div>
       <div class="reel-action" onclick="sharePost('${r.image_url}')"><svg viewBox="0 0 24 24"><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg><span>Share</span></div>
       <div class="reel-action"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span>${formatCount(r.views_count||0)}</span></div>
     </div>
     <div class="reel-overlay"><b>@${r.username||'user'}</b>${r.location?` • 📍 ${r.location}`:''}<br><small>${r.caption||''}</small><br>${r.tags?`<small style="color:#0095f6;">#${r.tags}</small><br>`:''}<small style="color:#8e8e8e;">👁️ ${formatCount(r.views_count||0)} views</small></div>
   </div>`
 }).join('');
}
async function loadExplore(){let {data:posts}=await supabase.from('posts').select('*').order('created_at',{ascending:false}).limit(18);if(posts){document.getElementById('exploreGrid').innerHTML=posts.map(p=>`<img src="${p.image_url}" onclick="viewPost('${p.id}','${p.image_url}','${p.username||'user'}','${p.caption||''}','${p.location||''}','${p.tags||''}')">`).join('');let allTags=[...new Set(posts.flatMap(p=>p.tags? p.tags.split(',').map(t=>t.trim()):[]))].slice(0,10);document.getElementById('searchTags').innerHTML=allTags.map(t=>`<span class='tag-chip' onclick="document.getElementById('searchInput').value='${t}';searchAll()">#${t}</span>`).join('');}}
async function loadProfile(){
 let uid=viewingUserId||currentUser.id;
 let {data:profile}=await supabase.from('profiles').select('*').eq('id',uid).single();
 if(!profile){document.getElementById('pName').innerText='Pixoro User';return;}
 document.getElementById('pName').innerText=profile.username||'Pixoro User';
 document.getElementById('pHandle').innerText=profile.username||'user';
 document.getElementById('pAvatar').src=profile.avatar_url||`https://i.pravatar.cc/150?u=${profile.username}`;
 document.getElementById('pBio').innerText=profile.bio||'Tiruchuli to World 🌍';
 document.getElementById('pFullName').innerText=profile.full_name||profile.username||'';
 document.getElementById('pWebsite').innerText=profile.website||'';
 let {data:myPosts}=await supabase.from('posts').select('*').eq('user_id',uid).order('created_at',{ascending:false});
 document.getElementById('pPosts').innerText=myPosts?.length||0;
 let {data:followers}=await supabase.from('follows').select('*').eq('following_id',uid);
 document.getElementById('pFollowers').innerText=followers?.length||0;
 let {data:following}=await supabase.from('follows').select('*').eq('follower_id',uid);
 document.getElementById('pFollowing').innerText=following?.length||0;
 document.getElementById('profilePosts').innerHTML=myPosts?.map(p=>`<img src="${p.image_url}" onclick="viewPost('${p.id}','${p.image_url}')">`).join('')||'<div style="padding:20px;color:#8e8e8e;text-align:center;grid-column:1/4;">No posts yet</div>';
 if(uid===currentUser.id){document.getElementById('editBtn').style.display='block';document.getElementById('followBtn').style.display='none';}
 else{document.getElementById('editBtn').style.display='none';document.getElementById('followBtn').style.display='block';let {data:isF}=await supabase.from('follows').select('*').eq('follower_id',currentUser.id).eq('following_id',uid).single();document.getElementById('followBtn').innerText=isF?'Following':'Follow';}
}
function openUserProfile(uid){viewingUserId=uid;showPage('profile');loadProfile();}
document.getElementById('fileInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{document.getElementById('uploadPreview').src=ev.target.result;document.getElementById('uploadPreview').style.display='block';document.getElementById('uploadBox').style.display='block';};r.readAsDataURL(f);});
async function uploadPost(){
 let cap=document.getElementById('captionInput').value;
 let tags=document.getElementById('tagInput').value;
 let loc=document.getElementById('locInput').value;
 let type=document.getElementById('postType').value;
 let url=document.getElementById('uploadPreview').src;
 if(!url||url.length<10)return alert("Photo select pannu da!");
 try{
  let file=document.getElementById('fileInput').files[0];
  if(file){
   try{let name=`${currentUser.id}_${Date.now()}_${type}.jpg`;let {error:upErr}=await supabase.storage.from('posts').upload(name,file);if(!upErr){let {data}=supabase.storage.from('posts').getPublicUrl(name);url=data.publicUrl;}}catch(e){}
  }
  if(type==='story'){
    let {error}=await supabase.from('stories').insert({user_id:currentUser.id,image_url:url}).select();
    if(error)throw error;
    alert("Story added da! 24hrs irukkum da! ⭕");
  }else{
    let {error}=await supabase.from('posts').insert({user_id:currentUser.id,image_url:url,caption:cap,tags:tags,location:loc,post_type:type,likes_count:0,views_count:0,comments_count:0,username:currentProfile?.username||currentUser.email.split('@')[0]}).select();
    if(error)throw error;
    alert((type==='reel'?'Reel':'Post')+" uploaded da Giri! 🚀");
  }
  document.getElementById('uploadBox').style.display='none';document.getElementById('captionInput').value='';document.getElementById('tagInput').value='';document.getElementById('locInput').value='';document.getElementById('fileInput').value='';document.getElementById('uploadPreview').style.display='none';
  showPage(type==='reel'?'reels':'home');loadFeed();loadReels();loadStories();
 }catch(e){alert("Error: "+e.message);}
}
async function likePost(postId){let isLiked=likedPosts.has(postId);if(isLiked){await supabase.from('likes').delete().eq('post_id',postId).eq('user_id',currentUser.id);likedPosts.delete(postId);let {data:p}=await supabase.from('posts').select('likes_count').eq('id',postId).single();await supabase.from('posts').update({likes_count:Math.max(0,(p.likes_count||1)-1)}).eq('id',postId);}else{await supabase.from('likes').insert({post_id:postId,user_id:currentUser.id});likedPosts.add(postId);let {data:p}=await supabase.from('posts').select('likes_count').eq('id',postId).single();await supabase.from('posts').update({likes_count:(p.likes_count||0)+1}).eq('id',postId);}loadFeed();loadReels();}
function openComments(postId){currentPostId=postId;document.getElementById('commentModal').classList.add('active');loadComments();}
function closeComments(){document.getElementById('commentModal').classList.remove('active');}
async function loadComments(){let {data:comments}=await supabase.from('comments').select('*').eq('post_id',currentPostId).order('created_at',{ascending:true});document.getElementById('commentList').innerHTML=comments?.map(c=>`<div style="padding:8px 0;display:flex;gap:8px;"><b>${c.username||'user'}</b><span>${c.text}</span></div>`).join('')||'<div style="color:#8e8e8e;text-align:center;padding:20px;">No comments yet. Be first da!</div>';}
async function postComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;await supabase.from('comments').insert({post_id:currentPostId,user_id:currentUser.id,username:currentProfile?.username,text:txt});let {data:p}=await supabase.from('posts').select('comments_count').eq('id',currentPostId).single();await supabase.from('posts').update({comments_count:(p.comments_count||0)+1}).eq('id',currentPostId);document.getElementById('commentInput').value='';loadComments();loadFeed();}
async function sendFollowRequest(){let uid=viewingUserId;let {data:isF}=await supabase.from('follows').select('*').eq('follower_id',currentUser.id).eq('following_id',uid).single();if(isF){await supabase.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',uid);loadProfile();return;}await supabase.from('follows').insert({follower_id:currentUser.id,following_id:uid});document.getElementById('followBtn').innerText='Following';loadProfile();}
async function loadRequests(){let {data:reqs}=await supabase.from('follow_requests').select('*').eq('receiver_id',currentUser.id);document.getElementById('notifList').innerHTML=reqs?.length?reqs.map(r=>`<div style="padding:12px;border-bottom:1px solid #121212;">Follow request from ${r.sender_id}</div>`).join(''):'<div style="padding:20px;text-align:center;color:#8e8e8e;">No requests</div>';}
async function searchAll(){
 let q=document.getElementById('searchInput').value.toLowerCase().trim();
 let {data:profiles}=await supabase.from('profiles').select('*').limit(30);
 let {data:posts}=await supabase.from('posts').select('*').order('created_at',{ascending:false}).limit(30);
 if(!q){document.getElementById('searchResults').innerHTML='';loadExplore();return;}
 let filteredProfiles=profiles.filter(p=>p.username.toLowerCase().includes(q)||(p.bio&&p.bio.toLowerCase().includes(q))||(p.full_name&&p.full_name.toLowerCase().includes(q)));
 let filteredPosts=posts.filter(p=>(p.tags&&p.tags.toLowerCase().includes(q))||(p.location&&p.location.toLowerCase().includes(q))||(p.caption&&p.caption.toLowerCase().includes(q)));
 document.getElementById('searchResults').innerHTML=`
   ${filteredProfiles.map(p=>`<div style="padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #121212;"><div style="display:flex;gap:10px;align-items:center;cursor:pointer;" onclick="openUserProfile('${p.id}')"><img src="${p.avatar_url||`https://i.pravatar.cc/100?u=${p.username}`}" style="width:44px;height:44px;border-radius:50%;"><div><b>${p.username}</b><br><small style="color:#8e8e8e;">${p.bio||''}</small></div></div><button onclick="openUserProfile('${p.id}')" style="background:#0095f6;border:none;color:#fff;padding:6px 12px;border-radius:6px;">View</button></div>`).join('')}
   ${filteredPosts.length>0?`<div style="padding:10px;font-weight:600;">Posts for "${q}"</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;">${filteredPosts.map(p=>`<img src="${p.image_url}" style="width:100%;aspect-ratio:1/1;object-fit:cover;" onclick="viewPost('${p.id}','${p.image_url}')">`).join('')}</div>`:''}
 `;
 document.getElementById('exploreGrid').innerHTML='';
}
function sharePost(url){if(navigator.share){navigator.share({title:'Pixoro',text:'Check this post da!',url:url});}else{navigator.clipboard.writeText(url);alert("Link copied da Giri! 📋");}}
function openEdit(){let name=prompt("Full name enna da?",currentProfile.full_name||currentProfile.username);let bio=prompt("Bio enna da?",currentProfile.bio||'Tiruchuli to World 🌍');let web=prompt("Website / Location enna da?",currentProfile.website||'');if(bio!==null){supabase.from('profiles').update({bio,full_name:name||currentProfile.username,website:web}).eq('id',currentUser.id).then(()=>loadProfileData());}}
</script>
</body>
