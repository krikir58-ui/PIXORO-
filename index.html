<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🌹</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
/* FULL BLOCK - TOP */
.top{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:50;border-bottom:1px solid #222}
.post{background:#0f0f0f;border:1px solid #222;border-radius:20px;margin:12px 10px;padding-bottom:12px;overflow:hidden}.postTop{padding:12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.actions{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.actions .left{display:flex;gap:22px;align-items:center}
/* FULL BLOCK ICONS - WHITE OUTLINE LIKE YOUR PHOTO */
.act{width:28px;height:28px;cursor:pointer;background:none;border:0;display:flex}
.act svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.act.liked svg{fill:#ff3040;stroke:#ff3040}
.act.saved svg{fill:#fff;stroke:#fff}
/* NAV - FULL BLOCK ORANGE */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#1a0f0f;border:1px solid #2a1a1a;border-radius:26px;display:flex;justify-content:space-around;align-items:center;padding:10px 6px;z-index:100}
.nav a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;text-decoration:none;color:#6a4a4a}
.nav a.active{background:linear-gradient(135deg,#FFD600,#ff6b35);color:#fff;box-shadow:0 4px 12px rgba(255,107,0,.4)}
.navPlus{width:48px;height:48px;background:linear-gradient(135deg,#FFD600,#ff6b35);color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,0,.4)}
.pfpRing{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFD600,#ff8c00,#ff3040);padding:2.5px;cursor:pointer}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
/* STORY - FULL BLOCK GRADIENT LIKE YOUR SCREENSHOT */
.storyBar{display:flex;gap:16px;padding:14px 12px;overflow-x:auto;background:#000;border-bottom:1px solid #1a1a1a}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:72px;cursor:pointer}.sRing{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#FFD600,#ff8c00,#ff3040,#ff6b9d)}.sRing.close{background:linear-gradient(135deg,#00ff66,#00cc44)}.sRing.seen{background:#333}.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2.5px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}.sAdd{width:68px;height:68px;border-radius:50%;background:#1a0a0a;border:2px dashed #4a1a1a;display:flex;align-items:center;justify-content:center;font-size:32px;color:#ff6b9d}.sName{font-size:12px;margin-top:6px;color:#ff9a9a}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}30%{transform:translate(-50%,-50%) scale(0.95)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.sosBtn{position:fixed;bottom:90px;right:15px;background:linear-gradient(135deg,#FFD600,#ff3040);color:#fff;border:0;width:60px;height:60px;border-radius:50%;font-weight:900;font-size:14px;z-index:999;cursor:pointer}
</style></head><body>
<div class="top"><b style="font-size:26px;background:linear-gradient(90deg,#FFD600,#ff6b35,#ff3040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900">Pixoro 🌹</b><div style="display:flex;gap:18px;font-size:22px"><span onclick="location.href='dm.html'" style="cursor:pointer">✈️</span><span onclick="location.href='notifications.html'" style="cursor:pointer">🔔</span></div></div>
<div class="storyBar" id="storyBar"></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#555">Loading...</p></div>
<div style="height:90px"></div>
<button id="sosBtn" class="sosBtn" onclick="sendSOS()" style="display:none">🆘<br>SOS</button>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><div class="navPlus" onclick="openCreate()">+</div><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#1a0f0f;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:slideUp .25s;border:1px solid #2a1a1a"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px;background:linear-gradient(90deg,#FFD600,#ff3040);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Create New 🌹</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div onclick="goCreate('post')" style="background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">📸</div><div style="margin-top:6px;font-weight:700">Post</div></div>
<div onclick="goCreate('reel')" style="background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">🎞️</div><div style="margin-top:6px;font-weight:700">Reels</div></div>
<div onclick="goCreate('story')" style="background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">⭕</div><div style="margin-top:6px;font-weight:700">Story</div></div>
<div onclick="goCreate('live')" style="background:#0f0f0f;border:1px solid #ff304033;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">🔴</div><div style="margin-top:6px;font-weight:700;color:#ff3040">Live</div></div>
</div><div onclick="closeCreate()" style="margin-top:16px;text-align:center;background:#0f0f0f;padding:12px;border-radius:12px;color:#888;border:1px solid #222">Cancel</div></div></div>

<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#111;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;border:1px solid #222"><div style="padding:14px;text-align:center;border-bottom:1px solid #222"><b>Comments</b><span onclick="closeComment()" style="float:right;cursor:pointer">✕</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div><div style="padding:10px;border-top:1px solid #222;display:flex;gap:10px"><input id="commentInput" placeholder="Add comment..." style="flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff"><button onclick="addComment()" style="background:none;border:0;color:#ff6b35;font-weight:700">Post</button></div></div></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allFollows=[],allSaves=[],allStories=[],currentPostId=null
function openCreate(){document.getElementById('createSheet').style.display='flex'}function closeCreate(){document.getElementById('createSheet').style.display='none'}
function goCreate(t){closeCreate();if(t==='post')location.href='upload.html';if(t==='reel')location.href='reels-upload.html';if(t==='story')location.href='story-add.html';if(t==='live')location.href='live.html'}
function pfpHtml(u){return `<div class="pfpRing"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}
async function loadAll(){let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let {data:likes}=await supa.from('likes').select('*');let {data:follows}=await supa.from('follows').select('*');let {data:saves}=await supa.from('saves').select('*').eq('username',ME);let {data:stories}=await supa.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});allPosts=(posts||[]).filter(p=>!p.is_archived);allLikes=likes||[];allFollows=follows||[];allSaves=saves||[];allStories=stories||[];renderStories();renderFeed();}
function renderStories(){let bar=document.getElementById('storyBar');let users=[...new Set(allStories.map(s=>s.username))];let html=`<div class="sItem" onclick="location.href='story-add.html'"><div class="sAdd">+</div><div class="sName">Your Story</div></div>`;html+=users.map(u=>{let s=allStories.find(x=>x.username===u);let img=s.image_url||`https://i.pravatar.cc/100?u=${u}`;return `<div class="sItem" onclick="location.href='story-view.html?user=${u}'"><div class="sRing ${s.audience==='close_friends'?'close':''}"><div class="sRingInner"><img src="${img}"></div></div><div class="sName">${u}</div></div>`}).join('');bar.innerHTML=html}
function heartAnim(id){let h=document.getElementById('heart-'+id);if(!h)return;h.style.animation='none';h.offsetHeight;h.style.animation='heartPop 0.9s forwards';}
function renderFeed(){let html='';for(let p of allPosts){let lCount=allLikes.filter(l=>l.post_id==p.id).length;let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME);let isSaved=allSaves.some(s=>s.post_id==p.id);html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<b>@${p.username}</b></div><span style="font-size:20px">⋮</span></div><div style="position:relative" ondblclick="heartAnim(${p.id});likePost(${p.id})"><img class="main" src="${p.image_url}"><div id="heart-${p.id}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;opacity:0;pointer-events:none">❤️</div></div>
<div class="actions"><div class="left">
<button class="act ${isLiked?'liked':''}" onclick="likePost(${p.id})"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button>
<button class="act" onclick="openComment(${p.id})"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
<button class="act"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
</div>
<button class="act ${isSaved?'saved':''}" onclick="savePost(${p.id})"><svg viewBox="0 0 24 24"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></button>
</div><div style="padding:0 14px"><b style="color:#fff">${lCount} likes</b><br><b>@${p.username}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px;color:#555">No posts da!</p>'}
async function likePost(id){let liked=allLikes.some(l=>l.post_id==id&&l.username==ME);if(liked)await supa.from('likes').delete().eq('post_id',id).eq('username',ME);else await supa.from('likes').insert({post_id:id,username:ME});let {data}=await supa.from('likes').select('*');allLikes=data||[];renderFeed()}
async function savePost(id){let saved=allSaves.some(s=>s.post_id==id);if(saved)await supa.from('saves').delete().eq('post_id',id).eq('username',ME);else await supa.from('saves').insert({post_id:id,username:ME});let {data}=await supa.from('saves').select('*').eq('username',ME);allSaves=data||[];renderFeed()}
async function openComment(id){currentPostId=id;document.getElementById('commentModal').style.display='flex';let {data}=await supa.from('comments').select('*').eq('post_id',id);document.getElementById('commentList').innerHTML=(data||[]).map(c=>`<div style="padding:8px 0"><b>@${c.username}</b> ${c.text}</div>`).join('')||'No comments'}
function closeComment(){document.getElementById('commentModal').style.display='none'}async function addComment(){let t=document.getElementById('commentInput').value.trim();if(!t)return;await supa.from('comments').insert({post_id:currentPostId,username:ME,text:t});document.getElementById('commentInput').value='';openComment(currentPostId)}
function checkSOSBtn(){let btn=document.getElementById('sosBtn');if(localStorage.getItem('pixoro_sos_on')==='true')btn.style.display='block';}
async function sendSOS(){if(!confirm('SOS anupava?'))return;navigator.geolocation.getCurrentPosition(async p=>{let link=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;let {data}=await supa.from('close_friends').select('*').eq('owner',ME);if(!data||!data.length)return alert('Trusted illa!');window.open(`https://api.whatsapp.com/send?phone=${data[0].phone}&text=${encodeURIComponent('🆘 HELP! '+ME+' '+link)}`,'_blank')})}
loadAll()
</script></body></html>
