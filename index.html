<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V5 - Real Insta Clone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding-bottom:80px}
.header{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:15px;text-align:center;font-size:24px;font-weight:bold;position:sticky;top:0;z-index:10}
.card{background:#111;margin:12px;border-radius:15px;border:1px solid #222;overflow:hidden}
.card-pad{padding:12px}
input,textarea{width:100%;padding:12px;background:#222;color:#fff;border:1px solid #333;border-radius:10px;margin:6px 0;outline:none}
button{padding:12px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.btn-yellow{background:#ffeb3b;color:#000;width:100%}
.btn-white{background:#fff;color:#000;width:100%}
.btn-dark{background:#222;color:#fff;border:1px solid #444}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#111;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #333;z-index:20}
.nav-item{text-align:center;cursor:pointer;font-size:22px}
.nav-item small{display:block;font-size:11px;margin-top:2px}
img.post-img{width:100%;height:auto;max-height:500px;object-fit:cover;cursor:pointer}
.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #ff0055}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:10px}
.grid img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.badge{padding:3px 8px;background:#222;border-radius:20px;font-size:12px}
</style>
</head>
<body>

<div class="header">PIXORO 🔥</div>

<!-- AUTH PAGE - SIGNUP / LOGIN -->
<div id="authPage" class="card card-pad" style="max-width:400px;margin:30px auto;text-align:center;">
  <h2 style="margin-bottom:15px;">Signup / Login</h2>
  <p style="color:#aaa;font-size:13px;margin-bottom:10px;">Supabase Auth - Email + Password</p>
  <input id="email" type="email" placeholder="Email - ex: giri@gmail.com">
  <input id="password" type="password" placeholder="Password - min 6 chars">
  <input id="username" type="text" placeholder="Username Unique - ex: giri_58 (Signup ku mattum)">
  <div style="display:flex;gap:10px;margin-top:12px;">
    <button onclick="signup()" class="btn-yellow">SIGNUP DA 🔥</button>
    <button onclick="login()" class="btn-white">LOGIN DA 🔑</button>
  </div>
  <p id="authMsg" style="color:#ffeb3b;margin-top:12px;font-size:13px;"></p>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
  <div id="page-home"></div>
  <div id="page-search" style="display:none;" class="card card-pad">
    <h3>Search Users 🔍</h3>
    <input id="searchInput" placeholder="Username type pannu da..." oninput="searchUsers(this.value)">
    <div id="searchResult" style="margin-top:10px;"></div>
  </div>
  <div id="page-profile" style="display:none;"></div>

  <!-- POST UPLOAD -->
  <div class="card card-pad">
    <h4 style="margin-bottom:8px;">Create Post 📸</h4>
    <input type="file" id="fileInput" accept="image/*">
    <input id="capInput" placeholder="Caption da Giri...">
    <button onclick="uploadPost()" class="btn-yellow" style="margin-top:8px;">POST PANNU DA 🚀</button>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="showPage('home')">🏠<br><small>Home</small></div>
    <div class="nav-item" onclick="showPage('search')">🔍<br><small>Search</small></div>
    <div class="nav-item" onclick="showPage('profile')">👤<br><small>Profile</small></div>
    <div class="nav-item" onclick="logout()" style="color:#ff4444;">🚪<br><small>Logout</small></div>
  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div id="editBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:100;padding:20px;">
  <div class="card card-pad" style="max-width:400px;margin:40px auto;">
    <h3>✏️ Edit Profile</h3>
    <p style="color:#aaa;font-size:12px;margin:5px 0;">Photo, Bio, Private/Public maathalam da</p>
    <input type="file" id="editAvatar" accept="image/*">
    <textarea id="editBio" rows="3" placeholder="Bio da Giri..."></textarea>
    <label style="display:flex;align-items:center;gap:10px;margin:12px 0;cursor:pointer;">
      <input type="checkbox" id="editPrivate" style="width:18px;"> <span>🔒 Private Account</span>
    </label>
    <button onclick="saveProfile()" class="btn-yellow">SAVE DA GIRI 💾</button>
    <button onclick="document.getElementById('editBox').style.display='none'" class="btn-dark" style="width:100%;margin-top:8px;">CLOSE</button>
  </div>
</div>

<!-- ZOOM -->
<div id="zoomBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:200;display:none;align-items:center;justify-content:center;" onclick="this.style.display='none'">
  <img id="zoomImg" style="max-width:95%;max-height:95%;border-radius:10px;">
</div>

<script>
// CONFIG DA GIRI - UN SUPABASE DETAILS DA
const SB_URL = "https://yecpltndhlzfjplzhcpm.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllY3BsdG5kaGx6ZmpwbHpoY3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg3ODQzMTUsImV4cCI6MjA3NDM2MDMxNX0.rU0Y1FZC2C5-8iV-Bx..."; // FULL ANON KEY INGATHAN PODU DA GIRI
const sb = supabase.createClient(SB_URL, SB_KEY);

let currentUser = null;
let currentProfile = null;

async function checkAuth(){
  let {data} = await sb.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    await loadMyProfile();
    document.getElementById("authPage").style.display='none';
    document.getElementById("mainApp").style.display='block';
    loadHome();
  }
}
checkAuth();

// 1. SIGNUP - Email + Password + Unique Username
async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const username = document.getElementById("username").value.trim().toLowerCase().replace(/\s/g,'');
  if(!email ||!password ||!username) return alert("Email, Password, Username ellam venum da Giri!");
  if(username.length < 3) return alert("Username 3 letters ku mela venum da!");

  document.getElementById("authMsg").innerText = "Checking da Giri...";

  // Username unique check da
  let {data: exists} = await sb.from('profiles').select('username').eq('username', username).single();
  if(exists) return document.getElementById("authMsg").innerText = "Username already irukku da Giri! Vera name try pannu da!";

  let {data, error} = await sb.auth.signUp({email, password});
  if(error) return document.getElementById("authMsg").innerText = error.message;

  // Profile create da
  let userId = data.user? data.user.id : data.session?.user?.id;
  if(userId){
    await sb.from('profiles').insert([{id: userId, username: username, bio: 'PIXORO User da 🔥'}]);
    document.getElementById("authMsg").innerText = "Signup Success da Giri! Email verify panni Login pannu da! 🔥";
  } else {
    document.getElementById("authMsg").innerText = "Signup email sent da! Verify pannitu Login pannu da!";
  }
}

// 1. LOGIN
async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  if(!email ||!password) return alert("Email Password podu da Giri!");

  let {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error) return document.getElementById("authMsg").innerText = error.message;

  currentUser = data.user;
  await loadMyProfile();
  document.getElementById("authPage").style.display='none';
  document.getElementById("mainApp").style.display='block';
  loadHome();
}

async function loadMyProfile(){
  let {data} = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
  if(!data){
    // Old user ku profile illa na create pannu da
    const uname = currentUser.email.split('@')[0] + Math.floor(Math.random()*100);
    await sb.from('profiles').insert([{id: currentUser.id, username: uname, bio: 'PIXORO User da 🔥'}]);
    let {data: d2} = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = d2;
  }
}

function logout(){ sb.auth.signOut(); location.reload(); }

function showPage(p){
  document.getElementById("page-home").style.display = p=='home'? 'block' : 'none';
  document.getElementById("page-search").style.display = p=='search'? 'block' : 'none';
  document.getElementById("page-profile").style.display = p=='profile'? 'block' : 'none';
  if(p=='home') loadHome();
  if(p=='profile') loadProfilePage(currentUser.id);
}

async function uploadPost(){
  const file = document.getElementById("fileInput").files[0];
  const cap = document.getElementById("capInput").value;
  if(!file) return alert("Photo select pannu da Giri!");
  const fileName = currentUser.id + "/" + Date.now() + "-" + file.name;
  let {error} = await sb.storage.from('post-images').upload(fileName, file);
  if(error) return alert(error.message);
  let {data} = sb.storage.from('post-images').getPublicUrl(fileName);
  await sb.from('posts').insert([{image_url: data.publicUrl, caption: cap, username: currentProfile.username, user_id: currentUser.id}]);
  alert("Posted da Giri! 🔥");
  document.getElementById("capInput").value=""; document.getElementById("fileInput").value="";
  loadHome();
}

async function loadHome(){
  let {data: posts} = await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(30);
  let html = "";
  for(let p of posts||[]){
    html += `<div class="card" style="padding:0;">
      <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;">
        <b style="cursor:pointer;" onclick="viewUserProfile('${p.user_id}')">👤 ${p.username}</b>
        <span class="badge">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
      <img src="${p.image_url}" class="post-img" onclick="zoomImage('${p.image_url}')">
      <div class="card-pad"><p><b>${p.username}</b> ${p.caption||''}</p></div>
    </div>`;
  }
  document.getElementById("page-home").innerHTML = html || "<div class='card card-pad'>No posts da Giri! First post neeye podu da!</div>";
}

// PROFILE - Username Unique, Photo, Bio + Followers/Following + Private/Public
async function loadProfilePage(userId){
  let {data: prof} = await sb.from('profiles').select('*').eq('id', userId).single();
  if(!prof) return;
  let {data: followers} = await sb.from('follows').select('*').eq('following_id', userId);
  let {data: following} = await sb.from('follows').select('*').eq('follower_id', userId);
  let {data: myPosts} = await sb.from('posts').select('*').eq('user_id', userId).order('created_at',{ascending:false});

  let isMe = userId === currentUser.id;
  let {data: amIFollowing} = isMe? {data:null} : await sb.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_id', userId).single();

  document.getElementById("page-profile").innerHTML = `
    <div class="card card-pad" style="text-align:center;">
      <img src="${prof.avatar_url || 'https://via.placeholder.com/150/111/fff?text='+prof.username}" class="avatar">
      <h2 style="margin-top:10px;">@${prof.username} ${prof.is_private?'🔒':''}</h2>
      <p style="color:#aaa;margin:6px 0;">${prof.bio || 'Bio illa da Giri'}</p>
      <div style="display:flex;justify-content:center;gap:20px;margin:15px 0;">
        <div><b>${myPosts?.length||0}</b><br><small>Posts</small></div>
        <div><b>${followers?.length||0}</b><br><small>Followers</small></div>
        <div><b>${following?.length||0}</b><br><small>Following</small></div>
      </div>
      ${isMe?
        `<button onclick="openEdit()" class="btn-white">✏️ Edit Profile - Photo, Bio, Private/Public</button>` :
        `<button onclick="toggleFollow('${userId}')" class="btn-yellow" style="background:${amIFollowing?'#222':'#ffeb3b'};color:${amIFollowing?'#fff':'#000'}">${amIFollowing?'Following ✅':'Follow Da Giri 🔥'}</button>
         <button onclick="loadProfilePage('${currentUser.id}'); showPage('profile')" class="btn-dark" style="width:100%;margin-top:8px;">My Profile ku po da</button>`
      }
      <div class="grid">${(myPosts||[]).map(p=>`<img src="${p.image_url}" onclick="zoomImage('${p.image_url}')">`).join('')}</div>
    </div>
  `;
  document.getElementById("page-profile").style.display='block';
  // Edit box ku values set pannu da
  document.getElementById("editBio").value = prof.bio || '';
  document.getElementById("editPrivate").checked = prof.is_private || false;
}

function openEdit(){ document.getElementById("editBox").style.display='block'; }

async function saveProfile(){
  const bio = document.getElementById("editBio").value;
  const is_private = document.getElementById("editPrivate").checked;
  let avatar_url = currentProfile.avatar_url;

  const file = document.getElementById("editAvatar").files[0];
  if(file){
    const fileName = currentUser.id + "/avatar-" + Date.now() + "-" + file.name;
    let {error} = await sb.storage.from('post-images').upload(fileName, file);
    if(!error){
      let {data} = sb.storage.from('post-images').getPublicUrl(fileName);
      avatar_url = data.publicUrl;
    }
  }

  await sb.from('profiles').update({bio, is_private, avatar_url}).eq('id', currentUser.id);
  alert("Profile Update Aayiduchi da Giri! 🔥");
  document.getElementById("editBox").style.display='none';
  await loadMyProfile();
  loadProfilePage(currentUser.id);
}

async function toggleFollow(userId){
  let {data} = await sb.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_id', userId).single();
  if(data){
    await sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId);
  } else {
    await sb.from('follows').insert([{follower_id: currentUser.id, following_id: userId}]);
  }
  loadProfilePage(userId);
}

async function viewUserProfile(userId){
  showPage('profile');
  loadProfilePage(userId);
}

async function searchUsers(q){
  if(!q || q.length < 1) { document.getElementById("searchResult").innerHTML=""; return; }
  let {data} = await sb.from('profiles').select('*').ilike('username', `%${q}%`).limit(10);
  document.getElementById("searchResult").innerHTML = (data||[]).map(u=>`
    <div onclick="viewUserProfile('${u.id}')" style="display:flex;align-items:center;gap:10px;background:#222;padding:10px;border-radius:10px;margin:5px 0;cursor:pointer;">
      <img src="${u.avatar_url||'https://via.placeholder.com/40'}" style="width:40px;height:40px;border-radius:50%;">
      <div><b>@${u.username}</b> ${u.is_private?'🔒':''}<br><small style="color:#aaa;">${u.bio||''}</small></div>
    </div>
  `).join('') || '<p style="color:#666;">User illa da Giri</p>';
}

function zoomImage(url){
  document.getElementById("zoomImg").src = url;
  document.getElementById("zoomBox").style.display='flex';
}
</script>
</body>
</html>
