<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO - World No.1 Safe App</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }
body { background:#000; color:white; }
.header { background:#111; padding:12px; text-align:center; font-weight:bold; font-size:22px; position:fixed; top:0; width:100%; z-index:100; border-bottom:1px solid #333; }
.header span { color:#ff0050; }
.feed { margin-top:60px; margin-bottom:70px; max-width:500px; margin-left:auto; margin-right:auto; }
.post { background:#111; margin-bottom:15px; border:1px solid #222; border-radius:10px; overflow:hidden; }
.post-top { padding:10px; display:flex; align-items:center; justify-content:space-between; }
.user { font-weight:bold; }
.fake-tag { background:red; color:white; padding:2px 8px; border-radius:10px; font-size:10px; display:none; }
.post-img { width:100%; height:500px; object-fit:cover; background:#222; }
.post-actions { padding:10px; display:flex; gap:15px; align-items:center; }
.btn { background:none; border:none; color:white; font-size:20px; cursor:pointer; }
.like-count { font-weight:bold; font-size:14px; }
.caption { padding:0 10px 10px 10px; font-size:14px; }
.report-btn { background:red; color:white; border:none; padding:5px 10px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; margin-left:auto; }
.bottom { position:fixed; bottom:0; width:100%; background:#111; display:flex; justify-content:space-around; padding:12px; border-top:1px solid #333; }
.bottom button { background:none; border:none; color:white; font-size:22px; }
#fake-alert { animation: blink 0.8s infinite; }
@keyframes blink { 0%{opacity:1} 50%{opacity:0.7} 100%{opacity:1} }
input, button.add { padding:10px; margin:5px; border-radius:5px; border:none; }
.login-box { margin-top:100px; text-align:center; padding:20px; }
</style>
</head>
<body>

<div class="header">PIX<span>ORO</span> 🔥</div>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>PIXORO Login</h2><br>
  <input id="email" placeholder="Email"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button class="add" onclick="login()" style="background:#ff0050; color:white; width:200px;">Login / Signup</button>
  <p style="margin-top:10px; font-size:12px; color:#aaa;">World's First Safe App by GIRI</p>
</div>

<!-- FEED -->
<div id="feed" class="feed" style="display:none;"></div>

<!-- BOTTOM -->
<div class="bottom" id="bottomNav" style="display:none;">
  <button onclick="loadFeed()">🏠</button>
  <button onclick="addPost()">➕</button>
  <button onclick="logout()">🚪</button>
</div>

<script>
// === FIREBASE CONFIG - UN CONFIG ITHU THAN ===
const firebaseConfig = {
  apiKey: "AIzaSyC... ", // sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_
  authDomain: "pixoro-75927.firebaseapp.com",
  projectId: "pixoro-75927",
  storageBucket: "pixoro-75927.appspot.com",
  appId: "1:..."
};
// Neenga already connect pannitenga na itha maatha vendaam da - appadive irukkattum

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

auth.onAuthStateChanged(user => {
  if(user){
    currentUser=user;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("feed").style.display="block";
    document.getElementById("bottomNav").style.display="flex";
    loadFeed();
  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("feed").style.display="none";
    document.getElementById("bottomNav").style.display="none";
  }
});

function login(){
  let e=document.getElementById("email").value;
  let p=document.getElementById("pass").value;
  auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p));
}

function logout(){ auth.signOut(); }

async function loadFeed(){
  let snap = await db.collection("reels").orderBy("createdAt","desc").get();
  let html="";
  snap.forEach(doc=>{
    let d=doc.data();
    let isFake = d.reports >= 3;
    html+=`
      <div class="post">
        <div class="post-top">
          <span class="user">${d.email || 'user'} ${isFake? '<span class="fake-tag" style="display:inline-block;">FAKE ID</span>' : ''}</span>
          <button class="report-btn" onclick="reportFake('${doc.id}')">🚨 Report</button>
        </div>
        ${isFake? `<div style="background:red; text-align:center; padding:8px; font-weight:bold;">🚨 ALERT! Idhu FAKE ID da! Nambaatha da! 🚨<br><small>${d.fakeReason || '3 per report pannanga'}</small></div>` : ''}
        <img class="post-img" src="${d.videoUrl}" onerror="this.src='https://picsum.photos/500/700?random=${Math.random()}'">
        <div class="post-actions">
          <button class="btn" onclick="likePost('${doc.id}', ${d.likes || 0})">❤️</button>
          <span class="like-count">${d.likes || 0} likes</span>
          <button class="btn" style="margin-left:10px;">💬</button>
        </div>
        <div class="caption"><b>${d.email}</b> ${d.caption || ''}</div>
      </div>
    `;
  });
  if(html=="") html="<p style='text-align:center; margin-top:50px; color:#666;'>No posts da Giri! + button thottu first post podu da!</p>";
  document.getElementById("feed").innerHTML=html;
}

async function likePost(id, likes){
  await db.collection("reels").doc(id).update({ likes: likes+1 });
  loadFeed();
}

// FAKE ID REPORT - UN HERO FEATURE DA GIRI!
async function reportFake(id){
  if(!confirm("Idhu Fake ID ah da Giri? Report pannava?")) return;
  await db.collection("reels").doc(id).update({
    reports: firebase.firestore.FieldValue.increment(1),
    fakeReason: "3 per report pannanga - Photo Google check fail"
  });
  alert("Super da! Report pannita - 3 vantha Red Alert varum da!");
  loadFeed();
  if(navigator.vibrate) navigator.vibrate([300,100,300]);
}

async function addPost(){
  let caption = prompt("Caption enna da Giri? Ennoda first post da 🔥 nu podu da:");
  if(!caption) return;
  let url = prompt("Photo URL podu da (illa na ok thottu da - auto photo varum):", "https://picsum.photos/500/700?random="+Math.random());
  await db.collection("reels").add({
    email: currentUser.email.split("@")[0] || "giri_official",
    caption: caption,
    videoUrl: url || `https://picsum.photos/500/700?random=${Math.random()}`,
    likes: 1,
    comments: 0,
    views: 1,
    reports: 0,
    isFake: false,
    createdAt: new Date()
  });
  alert("Post add aaiduchu da Giri! 🔥");
  loadFeed();
}
</script>
</body>
</html>
