<head>

<!-- ✅ V1054 FIX - feed-fix.css ah Kadasiya Podu da - Ithu Thaan Jeyikkum da - Avatar 42px + Bottom Nav Flex + Post Photo Rectangle -->
<link rel="stylesheet" href="css/feed-fix.css?v=1054">
<!-- ✅ V88 FIX DA - like.css v88 Tha da - Home Pink Heart Illa da - Reels Heart Athe Design Tha Home kum da - Chinna 52px da - Like Button Thotta Odane Heart Varum da -->
<link rel="stylesheet" href="css/like.css?v=89">
<!-- ❌ V1054 FIX - like-heart.css ah Delete Panniten da - Athula 110px Heart Irukku da - Like.js 46px ah Kolla Pannuthu da -->
<style>
/* ✅ V1054 - Trend Bar + Top Banner + Loading Text Full Hide da */
#trendBar, .trendBar, #pixoroTopNote{ display:none!important; }
#feedError{ display:none!important; }
/* ✅ V88 FIX DA - Inline Heart CSS Illa da - like.css v88 Tha Jeyikkum da */
/* ✅ Pazhaya Pink / Gradient Heart ah Inga Podatha da */
</style>
<script>
  try{
    var _myPfp = localStorage.getItem("pixoro_avatar") || localStorage.getItem("pixoro_pfp") || localStorage.getItem("my_avatar") || "";
    if(_myPfp){ window.MY_PFP = _myPfp; }
  }catch(e){}
</script>
</head>
<body>
<div class="top"><b>Pixoro</b><div class="topRight"><div class="topPlus" onclick="location.href='./create.html'">+</div><div class="bellWhite" onclick="location.href='./notification.html'"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="pixoroBellDot"></span></div></div></div>

<div id="singleBanner" class="singleBanner" style="display:none">Single Post View - <span onclick="location.href='./index.html'">Back to Feed</span></div>

<div class="storyBar" id="storyBar"><div id="storyBox"><div id="storyRow" class="story-row">
  <div class="sItem" onclick="location.href='./story-upload.html'">
    <div class="sAddWrap">
      <img id="myStoryImg" class="sAddImg myPfp" src="" alt="" onerror="this.style.display='none';document.getElementById('myStoryLetter').style.display='grid'">
      <div class="sLetter" id="myStoryLetter">G</div>
      <div class="sAddPlus">+</div>
    </div>
    <div class="sName">My Story</div>
  </div>
</div></div></div>

<div class="feedTabs"><div class="feedTab active" id="tabForYou" onclick="setFeedMode('foryou')">For You</div><div class="feedTab" id="tabFollowing" onclick="setFeedMode('following')">Following</div><div class="feedTab" id="tabLatest" onclick="setFeedMode('latest')">Latest</div></div>
<div id="trendBar" class="trendBar" style="display:none"></div>
<!-- ✅ V1054 FIX - feedList Id ah Add Panniten da - Feed.js Itha Thaan Theduthu da - #feed Mattum Irundha Feed Load Aagaathu da -->
<div id="feed"><div id="feedList"><div class="skel"></div><div class="skel"></div></div></div>
<div id="feedError" style="display:none"></div>
<div id="toast" class="toast"></div>

<div id="miniBox" style="display:none">
<img id="miniImg">
<div><div>Uploading Reel... <span id="miniPct">0%</span></div><div id="miniTxt">Mella Upload Aaguthu da - Feed Paakalam da</div><div><div id="miniFill"></div></div></div>
<span onclick="if(window.pixoroCancelUpload) window.pixoroCancelUpload(); else document.getElementById('miniBox').style.display='none'">X</span>
</div>

<div class="bottom-nav">
<a class="active" href="./index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1 1V9.5z"/></svg><span>Home</span></a>
<a href="./search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
<a href="./reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z"/></svg><span>Reels</span></a>
<a href="./dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 22 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
<a href="./profile.html"><img class="navPfp myPfp" id="navPfp" src=""><span>Profile</span></a>
</div>

<div id="commentModal"><div><div><b>Comments</b><span onclick="closeComment()">X</span></div><div id="commentList"></div><div><div id="myCommentPfpWrap"></div><input id="commentInput" placeholder="Add comment..."><button onclick="addComment()">Post</button></div></div></div>
<div id="postMenu" class="postMenuSheet" onclick="if(event.target==this)closePostMenu()"><div class="postMenuBox" id="postMenuBox"></div></div>

<div id="storyViewer">
  <div id="storyViewerMedia">
    <img id="storyViewerImg">
    <video id="storyViewerVid" playsinline loop></video>
    <div id="storyStickerLayer"></div>
    <div id="storyViewerTop">
      <img id="storyViewerPfp" src="">
      <div><b id="storyViewerName">User</b><div id="storyViewerTime">Now</div></div>
      <div id="storyViewerClose" onclick="closeStoryViewer()">×</div>
    </div>
  </div>
  <div><input id="storyReplyInput" placeholder="Reply..."><button onclick="sendStoryReply()">Send</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<!-- ✅ CORRECT ORDER + VERSION DA -->
<script src="js/supabase.js?v=1054"></script>

<script src="js/share.js?v=1054"></script>

<!-- ✅ V88 FIX - like.js V88 Tha da - Home Pink Heart Illa da - Reels Heart Athe Design Tha Home kum da - Chinna 52px da - Feed ku Munnaadi Podu da - Like Button Thotta Odane Heart Varum da - pointerdown la Pudikkuren da -->
<script src="js/like.js?v=89"></script>
<!-- ✅ CORRECT - feed.js V1044 da - Double Tap ah Feed la Vekka Koodathu da - like.js Thaan Like Pannum da -->
<script src="js/feed.js?v=1044"></script>
<script>
window.PIXORO_FEED_MODE = 'foryou';
(function(){
  try{
    var p = window.MY_PFP || localStorage.getItem("pixoro_avatar") || "";
    if(!p) return;
    var nav = document.getElementById("navPfp"); if(nav){ nav.src = p; nav.style.display = "block"; }
    var story = document.getElementById("myStoryImg"); if(story){ story.src = p; story.style.display = "block"; }
    var letter = document.getElementById("myStoryLetter"); if(letter) letter.style.display = "none";
  }catch(e){}
})();
</script>
</body>
</html>
