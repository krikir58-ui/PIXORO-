<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXORO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#fafafa}
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbdbdb;padding:12px;display:flex;justify-content:space-between;z-index:100}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.authBox{background:#fff;border:1px solid #dbdbdb;padding:30px 20px;border-radius:8px;width:350px;text-align:center}
.authBox input{width:100%;padding:10px;margin:6px 0;border:1px solid #dbdbdb;border-radius:4px}
.authBox button{width:100%;padding:10px;background:#0095f6;color:#fff;border:none;border-radius:8px;margin-top:8px}
.post{background:#fff;border:1px solid #dbdbdb;max-width:470px;margin:12px auto;border-radius:8px;overflow:hidden}
.post img{width:100%}
.actions{display:flex;gap:16px;padding:10px;font-size:20px}
#splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:60px 0 40px;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.splash-from{text-align:center;color:#666;font-size:14px}
.splash-from b{color:#ff004f;font-weight:800;font-size:18px}
</style>
</head>
<body>
<div id="splash">
  <div></div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center">
    <div><div style="font-size:90px">📸</div><div style="font-weight:900;font-size:32px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</div></div>
  </div>
  <div class="splash-from">from<br><b>∞ GIRI</b></div>
</div>
<!-- LOGIN PAGE -->
<div id="authPage" style="display:flex;justify-content:center;align-items:center;min-height:100vh">
  <div class="authBox">
    <h1 style="font-weight:900;font-size:28px;margin-bottom:20px;background:linear-gradient(90deg,#5b4cff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PIXORO</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log In</button>
    <button onclick="signup()" style="background:#fff;color:#000;border:1px solid #dbdbdb">Sign Up</button>
  </div>
</div>

<!-- MAIN PAGE -->
<div id="mainPage" style="display:none">
  <div class="header">
    <div class="logo">PIXORO</div>
    <button onclick="logout()" style="padding:6px 12px;border:1px solid #dbdbdb;background:#fff;border-radius:6px">Logout</button>
  </div>
  <div id="posts" style="padding-bottom:20px"></div>
</div>

<script>
const SUPABASE_URL = "https://rrjrmvdvyqvtjdwdhmsd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyanJtdmR2eXF2dGpkd2RobXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgyODk3OTYsImV4cCI6MjA3Mzg2NTc5Nn0.8x3d6ry3N5XhKj7pE9g0Qz6JkL2mN4bV7cX1yZ3aB9dE";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const supa = supabaseClient;
let currentUser = null;

// Splash 2.5 sec la maraiyum
setTimeout(()=>{document.getElementById('splash').classList.add('hide')},2500);

async function signup(){
  const {data,error}=await supa.auth.signUp({email:email.value,password:password.value});
  if(error) alert(error.message); else alert("Email check pannu da Giri!");
}
async function login(){
  const {data,error}=await supa.auth.signInWithPassword({email:email.value,password:password.value});
  if(error) alert(error.message); else {currentUser=data.user; showMain();}
}
function showMain(){
  document.getElementById('authPage').style.display='none';
  document.getElementById('mainPage').style.display='block';
  loadPosts();
}
  async function loadPosts(){
  const {data}=await supa.from('posts').select('*').order('id',{ascending:false});
  if(!data || data.length==0){
    posts.innerHTML='<p style="text-align:center;margin-top:30px;color:#999">No posts da Giri! First post podu!</p>';
    return;
  }
  posts.innerHTML=data.map(p=>`
    <div class="post">
      <div style="padding:10px;font-weight:600">📸 ${p.username||'giri'}</div>
      <img src="${p.image_url}" loading="lazy">
      <div class="actions">
        <span onclick="likePost('${p.id}',${p.likes||0})">❤️ ${p.likes||0}</span>
        <span>💬</span>
        <span onclick="navigator.clipboard.writeText('${p.image_url}')">↗️</span>
      </div>
      <div style="padding:0 12px 12px;font-size:14px"><b>${p.username||'giri'}</b> ${p.caption||''}</div>
    </div>
  `).join('');
}

async function likePost(id,likes){
  await supa.from('posts').update({likes:likes+1}).eq('id',id);
  loadPosts();
}

async function logout(){
  await supa.auth.signOut();
  location.reload();
}

// Auto login check
(async()=>{
  const {data}=await supa.auth.getSession();
  if(data.session){ currentUser=data.session.user; showMain(); }
})();

</script>
</body>
</html>
