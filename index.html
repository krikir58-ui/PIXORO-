<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.post{border-bottom:1px solid #222;background:#000;padding-bottom:12px}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.actions{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.actions .left{display:flex;gap:18px;align-items:center}
.actions button{background:none;border:0;cursor:pointer;display:flex}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding:12px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}.nav a{color:#777;text-decoration:none;font-size:24px}.nav a.active{color:#fff}
.navPlus{width:36px;height:36px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:pointer}
/* PIXORO ORIGINAL GRADIENT - NOT INSTAGRAM */
.pfpRing{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 0deg,#00D9FF,#00FF88,#0095FF,#00D9FF);padding:2px;cursor:pointer}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.followBtn{border:1.5px solid #fff;border-radius:20px;background:#000;color:#fff;padding:5px 18px;font-size:13px;font-weight:600}.followBtn.following{background:#fff;color:#000}
.storyBar{display:flex;gap:12px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #222;background:#000}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:68px;cursor:pointer}.sRing{width:64px;height:64px;border-radius:50%;padding:3px;display:flex;align-items:center;justify-content:center}.sRing.public{background:conic-gradient(from 45deg,#00D9FF,#00FF88,#FFD600,#00D9FF)}.sRing.close{background:conic-gradient(from 45deg,#00ff66,#00cc44,#00ff66)}.sRing.seen{background:#333}.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2.5px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.sAdd{width:64px;height:64px;border-radius:50%;background:#111;border:2px dashed #333;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}.sAdd::after{content:'+';position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:#00D9FF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #000;color:#fff}.sName{font-size:11px;margin-top:4px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.menuItem{padding:14px 20px;border-bottom:1px solid #1a1a1a;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:14px}
.sosBtn{position:fixed;bottom:90px;right:15px;background:#ff3040;color:#fff;border:0;width:68px;height:68px;border-radius:50%;font-weight:900;font-size:16px;z-index:999;box-shadow:0 4px 25px rgba(255,48,64,.7);cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,48,64,.7)}70%{box-shadow:0 0 0 12px rgba(255,48,64,0)}100%{box-shadow:0 0 0 0 rgba(255,48,64,0)}}
.toggle{position:relative;display:inline-block;width:50px;height:28px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#333;border-radius:20px;transition:.3s}.slider:before{content:'';position:absolute;width:20px;height:20px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.3s}.toggle input:checked + .slider{background:#ff3040}.toggle input:checked + .slider:before{transform:translateX(22px)}
</style></head><body>
<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro</b><div style="display:flex;gap:15px"><span onclick="openSettings()" style="cursor:pointer">⚙️</span><span onclick="openCloseFriend()" style="cursor:pointer">💚</span><span onclick="location.href='notifications.html'" style="font-size:22px">🔔</span></div></div>
<div class="storyBar" id="storyBar"></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#666">Loading Pixoro...</p></div>
<div style="height:80px"></div>
<button id="sosBtn" class="sosBtn" onclick="sendSOS()" style="display:none">🆘<br>SOS</button>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><div class="navPlus" onclick="openCreate()">+</div><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>
<div id="settingsModal" style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;padding:20px"><div style="background:#111;border-radius:16px;padding:16px;max-width:400px;margin:15% auto;animation:slideUp .25s"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding-bottom:10px"><b>⚙️ Settings</b><span onclick="closeSettings()" style="font-size:22px;cursor:pointer">✕</span></div>
<div style="margin-top:15px;padding:14px;background:#1a0a0a;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #ff304033"><div><b style="color:#ff3040">🆘 Girls Safety SOS</b><br><small style="color:#888">ON pannina red button varum</small></div><label class="toggle"><input type="checkbox" id="sosToggle" onchange="toggleSOS()"><span class="slider"></span></label></div>
<div style="margin-top:12px;padding:14px;background:#1a1a1a;border-radius:12px"><b style="font-size:13px">💚 Trusted Contacts</b><div id="cfListMini" style="margin-top:8px;font-size:12px;color:#888"></div><button onclick="closeSettings();openCloseFriend()" style="margin-top:8px;padding:6px 12px;background:#00ff66;border:0;border-radius:8px;font-size:12px;font-weight:700">Manage + Phone</button></div>
</div></div>
<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#161616;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px">Create New</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div onclick="goCreate('post')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">📸</div><div style="margin-top:6px;font-weight:700">Post</div></div><div onclick="goCreate('reel')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🎞️</div><div style="margin-top:6px;font-weight:700">Reels</div></div><div onclick="goCreate('story')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">⭕</div><div style="margin-top:6px;font-weight:700">Story</div></div><div onclick="goCreate('live')" style="background:#1e1e1e;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🔴</div><div style="margin-top:6px;font-weight:700">Live</div></div></div><div onclick="closeCreate()" style="margin-top:16px;text-align:center;background:#222;padding:12px;border-radius:12px;color:#aaa">Cancel</div></div></div>
<div id="postMenu" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:flex-end;justify-content:center"><div style="background:#111;width:100%;max-width:450px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:10px auto 5px"></div><div id="postMenuTop"></div><div id="postMenuOptions"></div><div onclick="closePostMenu()" style="margin:12px 15px;text-align:center;background:#222;padding:13px;border-radius:12px;color:#aaa;cursor:pointer">Cancel</div></div></div>
<div id="profileMenu" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:flex-end;justify-content:center"><div style="background:#111;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:10px 0 20px;animation:slideUp .25s"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:8px auto 15px"></div><div id="profileMenuOptions"></div><div onclick="closeProfileMenu()" style="margin:10px 15px;text-align:center;background:#222;padding:12px;border-radius:12px;color:#aaa">Cancel</div></div></div>
<div id="cfModal" style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;padding:20px"><div style="background:#111;border-radius:15px;padding:15px;max-width:400px;margin:10% auto;max-height:85vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center"><b>💚 Trusted - SOS Numbers</b><span onclick="closeCF()" style="cursor:pointer;font-size:22px">✕</span></div>
<div style="margin-top:12px;background:#000;padding:12px;border-radius:10px;border:1px solid #222">
<input id="cfName" placeholder="Name - Amma..." style="width:100%;padding:11px;border-radius:8px;border:0;background:#222;color:#fff;margin-bottom:8px">
<input id="cfPhone" placeholder="Phone - 9876543210..." type="tel" style="width:100%;padding:11px;border-radius:8px;border:0;background:#222;color:#fff">
<button onclick="addCF()" style="width:100%;margin-top:10px;padding:12px;background:#00ff66;border:0;border-radius:10px;font-weight:900">💾 Save Number</button>
</div>
<div id="cfList" style="margin-top:14px;font-size:13px;color:#888"></div>
</div></div>
<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column"><div style="padding:14px;display:flex;justify-content:center;border-bottom:1px solid #222;position:relative"><div style="width:40px;height:4px;background:#333;border-radius:10px"></div><b style="position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:14px">Comments</b><span onclick="closeComment()" style="position:absolute;right:15px;top:10px;font-size:22px">✕</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div><div style="padding:10px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;background:#000"><img src="https://i.pravatar.cc/100?u=Giri" style="width:32px;height:32px;border-radius:50%"><input id="commentInput" placeholder="Add a comment..." style="flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff"><button onclick="addComment()" style="background:none;border:0;color:#0095f6;font-weight:700">Post</button></div></div></div>
<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allFollows=[],allSaves=[],allStories=[],allComments=[],allCommentLikes=[],currentPostId=null,curMenuPost=null,curMenuUser=null
async function sendSOS(){
  if(!confirm('🆘 REAL SOS da? Trusted ku location pogum!')) return;
  if(!navigator.geolocation){ alert('Location off da!'); return; }
  let {data:trusted} = await supa.from('close_friends').select('*').eq('owner',ME);
  if(!trusted || !trusted.length){ alert('❌ Trusted illa da! Add pannu!'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    let lat=pos.coords.latitude, lon=pos.coords.longitude;
    let mapLink=`https://maps.google.com/?q=${lat},${lon}`;
    await supa.from('sos_alerts').insert({username:ME,lat:lat,lon:lon,map_link:mapLink});
    let msg=`🆘 EMERGENCY HELP! ${ME} ku help venum!\n📍 Location: ${mapLink}\n⏰ ${new Date().toLocaleString()}\nPixoro SOS`;
    let first = trusted[0];
    let phone = (first.phone||'').replace(/[^0-9]/g,'');
    if(phone.length==10) phone='91'+phone;
    let waUrl = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`;
    window.open(waUrl, '_blank');
    alert(`✅ SOS SENT da! ${first.friend} ku pochu!\n${mapLink}`);
  },()=>alert('GPS allow pannu da!'));
}
function openSettings(){ document.getElementById('settingsModal').style.display='block'; document.getElementById('sosToggle').checked = localStorage.getItem('pixoro_sos_on')==='true'; loadCFMini(); }
function closeSettings(){ document.getElementById('settingsModal').style.display='none'; }
function toggleSOS(){ let on=document.getElementById('sosToggle').checked; localStorage.setItem('pixoro_sos_on', on); checkSOSBtn(); alert(on?'✅ SOS ON!':'❌ OFF!'); }
function checkSOSBtn(){ document.getElementById('sosBtn').style.display = localStorage.getItem('pixoro_sos_on')==='true'?'block':'none'; }
async function loadCFMini(){ let {data}=await supa.from('close_friends').select('*').eq('owner',ME); let el=document.getElementById('cfListMini'); if(!el) return; el.innerHTML = (!data||!data.length)?'No trusted!':data.map(c=>`💚 ${c.friend} - ${c.phone}`).join('<br>'); }
function pfpHtml(u){return `<div class="pfpRing" onclick="openProfileMenu('${u}')"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}
async function loadAll(){let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let {data:likes}=await supa.from('likes').select('*');let {data:follows}=await supa.from('follows').select('*');let {data:saves}=await supa.from('saves').select('*').eq('username',ME);let {data:stories}=await supa.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});allPosts=(posts||[]).filter(p=>!p.is_archived);allLikes=likes||[];allFollows=follows||[];allSaves=saves||[];allStories=stories||[];renderStories();renderFeed();loadCF();checkSOSBtn();loadCFMini();}
function renderStories(){let bar=document.getElementById('storyBar');let users=[...new Set(allStories.map(s=>s.username))];let html=`<div class="sItem" onclick="location.href='./story-add.html'"><div class="sAdd">👤</div><div class="sName">Your Story</div></div>`;html+=users.map(u=>{let s=allStories.find(x=>x.username===u);let img=s.image_url||s.media_url||`https://i.pravatar.cc/100?u=${u}`;return `<div class="sItem" onclick="location.href='./story-view.html?user=${encodeURIComponent(u)}'"><div class="sRing ${s.audience==='close_friends'?'close':'public'}"><div class="sRingInner"><img src="${img}"></div></div><div class="sName">${u}</div></div>`}).join('');bar.innerHTML=html}
function renderFeed(){let sorted=[...allPosts].sort((a,b)=>(b.is_pinned?1:0)-(a.is_pinned?1:0));let html='';for(let p of sorted){let lCount=allLikes.filter(l=>l.post_id==p.id).length;let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME);let isSaved=allSaves.some(s=>s.post_id==p.id);let isMe=p.username===ME;let followBtn=isMe?`<span style="font-size:11px;color:#555">YOU</span>`:`<button class="followBtn ${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'following':''}" onclick="toggleFollow('${p.username}')">${allFollows.some(f=>f.follower==ME&&f.following==p.username)?'Following':'Follow'}</button>`;let likeText=p.hide_likes?(isMe?`${lCount} likes`:`Liked by others`):`${lCount} likes`;let commentBtn=p.comments_off?``:`<button onclick="openComment(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>`;html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<div><b>@${p.username}</b><div style="font-size:11px;color:#777">${allFollows.filter(f=>f.following==p.username).length} followers</div></div></div><div style="display:flex;align-items:center">${followBtn}<span onclick="openPostMenu(${p.id},'${p.username}')" style="font-size:22px;margin-left:12px;cursor:pointer">⋮</span></div></div><img class="main" src="${p.image_url}" ondblclick="likePost(${p.id})"><div class="actions"><div class="left"><button onclick="likePost(${p.id})"><svg viewBox="0 0 24 24" width="28" height="28" fill="${isLiked?'#ff3040':'none'}" stroke="${isLiked?'#ff3040':'#fff'}" stroke-width="2"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button>${commentBtn}<button onclick="sharePost()"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div><button onclick="savePost(${p.id})"><svg viewBox="0 0 24 24" width="27" height="27" fill="${isSaved?'#fff':'none'}" stroke="#fff" stroke-width="2"><path d="M19 21L12 16L5 21V5C5 3.89543 5.89543 3 7 3H17C18.1046 3 19 3.89543 19 5V21Z"/></svg></button></div><div style="padding:0 12px"><b>${likeText}</b><br><b>@${p.username}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px">No posts</p>'}
async function likePost(id){let liked=allLikes.some(l=>l.post_id==id&&l.username==ME);if(liked)await supa.from('likes').delete().eq('post_id',id).eq('username',ME);else await supa.from('likes').insert({post_id:id,username:ME});let {data}=await supa.from('likes').select('*');allLikes=data||[];renderFeed()}
async function savePost(id){let saved=allSaves.some(s=>s.post_id==id);if(saved)await supa.from('saves').delete().eq('post_id',id).eq('username',ME);else await supa.from('saves').insert({post_id:id,username:ME});let {data}=await supa.from('saves').select('*').eq('username',ME);allSaves=data||[];renderFeed()}
function sharePost(){if(navigator.share)navigator.share({url:location.href});else prompt('Copy:',location.href)}
async function toggleFollow(u){let a=allFollows.some(f=>f.follower==ME&&f.following==u);if(a)await supa.from('follows').delete().eq('follower',ME).eq('following',u);else await supa.from('follows').insert({follower:ME,following:u});let {data}=await supa.from('follows').select('*');allFollows=data||[];renderFeed()}
function openCreate(){document.getElementById('createSheet').style.display='flex'}function closeCreate(){document.getElementById('createSheet').style.display='none'}function goCreate(t){closeCreate();if(t==='post')location.href='upload.html';if(t==='reel')location.href='reels-upload.html';if(t==='story')location.href='story-add.html';if(t==='live')location.href='live.html'}
function openPostMenu(id,user){curMenuPost=id;curMenuUser=user;let p=allPosts.find(x=>x.id==id)||{};document.getElementById('postMenu').style.display='flex';}
function closePostMenu(){document.getElementById('postMenu').style.display='none'}
async function deletePost(){await supa.from('posts').delete().eq('id',curMenuPost);closePostMenu();loadAll()}
function openProfileMenu(u){curMenuUser=u;document.getElementById('profileMenu').style.display='flex'}function closeProfileMenu(){document.getElementById('profileMenu').style.display='none'}
async function openComment(id){currentPostId=id;document.getElementById('commentModal').style.display='flex';await loadComments()}function closeComment(){document.getElementById('commentModal').style.display='none';currentPostId=null}
async function loadComments(){let {data:comments}=await supa.from('comments').select('*').eq('post_id',currentPostId).order('created_at',{ascending:true});allComments=comments||[];document.getElementById('commentList').innerHTML = allComments.length?allComments.map(c=>`<div style="padding:8px 0"><b>@${c.username}</b> ${c.text}</div>`).join(''):`<p style="text-align:center;color:#666;padding:40px">No comments</p>`}
async function addComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;await supa.from('comments').insert({post_id:currentPostId,username:ME,text:txt});document.getElementById('commentInput').value='';await loadComments()}
function openCloseFriend(){document.getElementById('cfModal').style.display='block';loadCF()}function closeCF(){document.getElementById('cfModal').style.display='none';loadCFMini();}
async function addCF(){let name=document.getElementById('cfName').value.trim();let phone=document.getElementById('cfPhone').value.trim().replace(/[^0-9]/g,'');if(!name||!phone){alert('Name & Phone podu!');return;}if(phone.length==10) phone='91'+phone;let {error}=await supa.from('close_friends').insert({owner:ME,friend:name,phone:phone});if(error){alert('Error: '+error.message);return;}document.getElementById('cfName').value='';document.getElementById('cfPhone').value='';alert('✅ Saved! '+name);loadCF();loadCFMini();}
async function loadCF(){let {data}=await supa.from('close_friends').select('*').eq('owner',ME).order('created_at',{ascending:false});let list=document.getElementById('cfList');if(!list)return;list.innerHTML = (!data||!data.length)?'<p style="text-align:center;padding:20px">No trusted!</p>':data.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222"><div>💚 ${c.friend}<br><small style="color:#fff">📞 ${c.phone}</small></div><span onclick="removeCF('${c.id}')" style="color:#f44;background:#222;padding:6px 10px;border-radius:8px;cursor:pointer">Delete</span></div>`).join('')}
async function removeCF(id){await supa.from('close_friends').delete().eq('id',id);loadCF();loadCFMini();}
loadAll()
</script>
</body></html>
