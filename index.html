<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO - World Safe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI}
body{background:#000;color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;border:1px solid #262626;padding:24px;text-align:center;background:#000}
.logo{font-family:'Grand Hotel',cursive;font-size:54px}
input{width:100%;padding:12px;background:#121212;border:1px solid #333;border-radius:3px;color:#fff;margin:6px 0;outline:none}
.btn{width:100%;background:#0095f6;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
.btn2{background:none;border:1px solid #333;color:#fff}
.link{color:#0095f6;font-size:13px;font-weight:600;cursor:pointer}
.err{background:#2a0a0a;border:1px solid #ff3040;color:#ff8a8a;padding:10px;border-radius:6px;margin:8px 0;font-size:12px;display:none;text-align:left;word-break:break-word}
.ok{background:#0a2a0a;border:1px solid #00ff88;color:#88ffaa;padding:10px;border-radius:6px;margin:8px 0;font-size:12px;display:none}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#555;font-size:12px}.divider div{flex:1;height:1px;background:#333}
.header{height:60px;padding:0 14px;position:fixed;top:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);z-index:100;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.feed{margin:auto;max-width:500px;padding-top:60px;padding-bottom:70px}
.post{border-bottom:1px solid #1a1a1a}
.post-top{padding:10px 12px;display:flex;gap:10px;align-items:center}
.post-top img{width:32px;height:32px;border-radius:50%}
.post-img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#111;display:block}
.post-actions{padding:10px 14px;display:flex;gap:16px;font-size:22px}
.bottom{position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#000;height:56px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222}
.acc-list{max-height:200px;overflow:auto;text-align:left;margin-top:10px}
.acc-item{padding:10px;border:1px solid #222;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div id="authBox" class="login-wrap">
<div class="login-card">
<div class="logo">Pixoro</div>
<p style="color:#666;font-size:12px;margin:0 0 18px 0;">TIRUCHULI TO WORLD 🌍 - 100% SAFE</p>
<div id="errBox" class="err"></div>
<div id="okBox" class="ok"></div>

<div id="loginForm">
<input id="email" type="email" placeholder="Email - safe da">
<input id="pass" type="password" placeholder="Password (safe encrypted)">
<button class="btn" id="mainBtn" onclick="handleAuth()">Log in - Safe</button>
<div class="divider"><div></div>OR<div></div></div>
<p style="font-size:13px;color:#888;">New here? <span class="link" onclick="toggle()">Create Account - World Safe 🌍</span></p>
</div>

<div id="signupForm" style="display:none;">
<input id="semail" type="email" placeholder="New Email">
<input id="spass" type="password" placeholder="Password 6+ chars - safe">
<input id="sname" type="text" placeholder="Username">
<button class="btn" onclick="handleSignup()">Sign Up - Safe & Real</button>
<p style="font-size:13px;color:#888;margin-top:12px;">Have account? <span class="link" onclick="toggle()">Log in - Instagram maari</span></p>
</div>

<div id="accountList" style="display:none;">
<p style="font-size:13px;margin:14px 0 6px 0;font-weight:700;text-align:left;">👤 Saved Accounts (Add Account):</p>
<div id="accItems" class="acc-list"></div>
<button class="btn btn2" onclick="document.getElementById('accountList').style.display='none'">Close</button>
</div>

<p style="font-size:11px;color:#444;margin-top:16px;">🔒 Supabase Encrypted - Instagram mari safe da!</p>
<p style="font-size:11px;color:#666;margin-top:8px;"><span class="link" onclick="showAccounts()">Add Account / Switch ↻</span></p>
</div>
</div>

<div id="mainBox" style="display:none;">
<div class="header"><div class="logo" style="font-size:32px;">Pixoro</div><div style="display:flex;gap:14px;"><span onclick="showAccounts()" style="font-size:22px;cursor:pointer;">👤+</span><span onclick="logout()" style="cursor:pointer;">Logout</span></div></div>
<div id="feed" class="feed"></div>
<div class="bottom">
<button style="color:#fff">⌂</button>
<button onclick="addPost()" style="color:#fff;font-size:30px;cursor:pointer;">+</button>
<button onclick="logout()">◯</button>
</div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">
<div id="uploadBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;">
<div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #222;">
<button onclick="uploadBox.style.display='none'" style="background:none;border:none;color:#fff;font-size:20px;">✕</button><b>New post</b><button onclick="doPost()" style="background:none;border:none;color:#0095f6;font-weight:700;">Share</button>
</div>
<div style="width:100%;aspect-ratio:4/5;background:#111;"><img id="preview" style="width:100%;height:100%;object-fit:cover;display:none;"></div>
<div style="padding:14px;"><input id="caption" placeholder="Caption..."></div>
</div>

<script>
// UN KEY DA GIRI - 100% CORRECT DA!
const SUPABASE_URL = 'https://yecpltndhlzfjplzhcpm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isLogin = true;
function toggle(){ isLogin=!isLogin; document.getElementById('loginForm').style.display=isLogin?'block':'none'; document.getElementById('signupForm').style.display=isLogin?'none':'block'; hideMsg(); }
function showMsg(t,ok=false){ let e=document.getElementById('errBox'), o=document.getElementById('okBox'); if(ok){o.style.display='block';o.innerText=t;e.style.display='none';}else{e.style.display='block';e.innerText=t;o.style.display='none';} }
function hideMsg(){ document.getElementById('errBox').style.display='none'; document.getElementById('okBox').style.display='none'; }

async function handleSignup(){
 let email=document.getElementById('semail').value.trim();
 let pass=document.getElementById('spass').value.trim();
 let name=document.getElementById('sname').value.trim() || email.split('@')[0];
 if(!email||!pass){showMsg('Email + Password kudu da');return;}
 if(pass.length<6){showMsg('Password 6+ chars da - safe ku');return;}
 showMsg('Creating safe account...',true);
 try{
  const {data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{data:{username:name}}});
  if(error) throw error;
  // auto confirm ku SQL already pannitom la
  showMsg('✅ Account Created da! Login pannu da - Safe da! 🔒',true);
  setTimeout(()=>{toggle();document.getElementById('email').value=email;},1200);
 }catch(e){showMsg('❌ '+e.message);}
}

async function handleAuth(){
 let email=document.getElementById('email').value.trim();
 let pass=document.getElementById('pass').value.trim();
 if(!email||!pass){showMsg('Email + Pass kudu da');return;}
 document.getElementById('mainBtn').innerText='Safe Checking...';
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(error) throw error;
  let accs=JSON.parse(localStorage.getItem('pixoro_accounts')||'[]');
  if(!accs.find(a=>a.email===email)) accs.push({email,username:data.user.user_metadata?.username||email.split('@')[0]});
  localStorage.setItem('pixoro_accounts',JSON.stringify(accs));
  localStorage.setItem('pixoro_user',JSON.stringify(data.user));
  showMsg('✅ Safe Login Success da Giri!',true);
  setTimeout(()=>{ document.getElementById('authBox').style.display='none'; document.getElementById('mainBox').style.display='block'; loadFeed(); },500);
 }catch(e){
   if(e.message.includes('Email not confirmed')) showMsg('❌ Email confirm pannala da - Supabase SQL run pannu da: UPDATE auth.users SET email_confirmed_at=NOW()');
   else showMsg('❌ '+e.message);
   document.getElementById('mainBtn').innerText='Log in - Safe';
 }
}

function showAccounts(){ let accs=JSON.parse(localStorage.getItem('pixoro_accounts')||'[]'); let box=document.getElementById('accountList'); let items=document.getElementById('accItems'); if(accs.length==0){items.innerHTML='<p style=color:#666;font-size:12px>No saved accounts da - login pannu da</p>';}else{items.innerHTML=accs.map(a=>`<div class=acc-item><div><b style=font-size:13px>${a.username}</b><br><small style=color:#888>${a.email}</small></div><span class=link onclick="quickLogin('${a.email}')">Switch</span></div>`).join('');} box.style.display='block'; }
function quickLogin(email){ document.getElementById('email').value=email; document.getElementById('accountList').style.display='none'; showMsg('Password kudu da - '+email,true); }
function logout(){ supabaseClient.auth.signOut(); localStorage.removeItem('pixoro_user'); location.reload(); }

let posts=JSON.parse(localStorage.getItem('pixoro_posts')||'[]');
function loadFeed(){ let f=document.getElementById('feed'); if(posts.length==0){ f.innerHTML="<p style=text-align:center;color:#666;margin-top:80px;>Welcome da Giri! 🔒 Safe Login Work Aachu da!<br><br>World la yaarum account create pannalam da 🌍<br><br>+ thottu post podu da!</p>"; return; } f.innerHTML=posts.map(p=>`<div class=post><div class=post-top><img src=https://i.pravatar.cc/100?u=${p.user}><b style=font-size:13px>${p.user}</b></div><img class=post-img src=${p.img}><div class=post-actions><span>🤍</span><span>💬</span></div><div style=padding:0 14px 12px 14px;font-size:13px><b>${p.user}</b> ${p.cap}</div></div>`).join(''); }
function addPost(){ document.getElementById('fileInput').click(); }
document.getElementById('fileInput').addEventListener('change',e=>{ let f=e.target.files[0];if(!f)return; let r=new FileReader();r.onload=ev=>{document.getElementById('preview').src=ev.target.result;document.getElementById('preview').style.display='block';document.getElementById('uploadBox').style.display='block';};r.readAsDataURL(f); });
function doPost(){ let img=document.getElementById('preview').src; let cap=document.getElementById('caption').value||'Tiruchuli to World 🌍'; let u=JSON.parse(localStorage.getItem('pixoro_user')||'{}').email||'giri'; posts.unshift({img,cap,user:u}); localStorage.setItem('pixoro_posts',JSON.stringify(posts)); document.getElementById('uploadBox').style.display='none'; loadFeed(); }

supabaseClient.auth.getSession().then(({data})=>{ if(data.session){ document.getElementById('authBox').style.display='none'; document.getElementById('mainBox').style.display='block'; loadFeed(); } });
</script>
</body>
</html>
