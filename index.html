<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://yecpltndhlzfjplzhcpm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
VARIABLES
========================================= */

let currentUser = null;
let currentProfile = null;
let currentFilter = "none";


/* =========================================
ELEMENTS
========================================= */

const authPage =
document.getElementById("authPage");

const app =
document.getElementById("app");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");

const authMessage =
document.getElementById("authMessage");


/* =========================================
AUTH SWITCH
========================================= */

document
.getElementById("openSignup")
.addEventListener("click",()=>{

loginBox.classList.add("hidden");

signupBox.classList.remove("hidden");

authMessage.innerText="";

});


document
.getElementById("openLogin")
.addEventListener("click",()=>{

signupBox.classList.add("hidden");

loginBox.classList.remove("hidden");

authMessage.innerText="";

});


/* =========================================
SIGNUP
========================================= */

document
.getElementById("signupBtn")
.addEventListener("click",async()=>{

const name =
document.getElementById("signupName")
.value.trim();

const username =
document.getElementById("signupUsername")
.value
.trim()
.toLowerCase()
.replace(/[^a-z0-9_]/g,"");

const email =
document.getElementById("signupEmail")
.value.trim();

const password =
document.getElementById("signupPassword")
.value;


if(!name || !username || !email || !password){

authMessage.innerText =
"Please fill all fields.";

return;
}


if(username.length<3){

authMessage.innerText =
"Username needs 3+ characters.";

return;
}


if(password.length<6){

authMessage.innerText =
"Password needs 6+ characters.";

return;
}


try{

authMessage.innerText =
"Checking username...";


const {
data:existing,
error:existingError
} =
await supabase
.from("profiles")
.select("id")
.eq("username",username)
.limit(1);


if(existingError)
throw existingError;


if(existing && existing.length){

authMessage.innerText =
"Username already taken.";

return;
}


authMessage.innerText =
"Creating account...";


const {
data,
error
} =
await supabase.auth.signUp({

email,
password,

options:{
data:{
username,
display_name:name
}
}

});


if(error)
throw error;


if(!data.user){

authMessage.innerText =
"Account created. Check your email.";

return;
}


/* PROFILE */

const {
error:profileError
} =
await supabase
.from("profiles")
.upsert({

id:data.user.id,
username,
display_name:name

},{
onConflict:"id"
});


if(profileError){

console.log(profileError);

}


authMessage.innerText =
"Account created successfully!";


}catch(error){

console.error(error);

authMessage.innerText =
supabaseError(error);

}

});


/* =========================================
LOGIN
========================================= */

document
.getElementById("loginBtn")
.addEventListener("click",async()=>{

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;


if(!email || !password){

authMessage.innerText =
"Enter email and password.";

return;
}


try{

authMessage.innerText =
"Logging in...";


const {
error
} =
await supabase.auth.signInWithPassword({

email,
password

});


if(error)
throw error;


}catch(error){

console.error(error);

authMessage.innerText =
supabaseError(error);

}

});


/* =========================================
AUTH STATE
========================================= */

supabase.auth.onAuthStateChange(
async(event,session)=>{

if(session){

currentUser =
session.user;

await loadCurrentProfile();

showApp();

}else{

currentUser=null;

currentProfile=null;

showAuth();

}

});


/* =========================================
INITIAL SESSION
========================================= */

const {
data:sessionData
} =
await supabase.auth.getSession();


if(sessionData.session){

currentUser =
sessionData.session.user;

await loadCurrentProfile();

showApp();

}else{

showAuth();

}


/* =========================================
SHOW APP
========================================= */

function showApp(){

authPage.classList.add("hidden");

app.classList.remove("hidden");

loadPublicPosts();

loadProfile();

}


/* =========================================
SHOW AUTH
========================================= */

function showAuth(){

authPage.classList.remove("hidden");

app.classList.add("hidden");

}


/* =========================================
CURRENT PROFILE
========================================= */

async function loadCurrentProfile(){

if(!currentUser)
return;


const {
data,
error
} =
await supabase
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();


if(error || !data){

currentProfile={

id:currentUser.id,

username:
currentUser.email?.split("@")[0] || "user",

display_name:"PIXORO User"

};

return;
}


currentProfile=data;

}


/* =========================================
PHOTO PREVIEW
========================================= */

document
.getElementById("photoInput")
.addEventListener("change",event=>{

const file =
event.target.files[0];

if(!file)
return;


const reader =
new FileReader();


reader.onload=e=>{

const preview =
document.getElementById("preview");

preview.src=e.target.result;

preview.style.filter=currentFilter;

preview.classList.remove("hidden");

};


reader.readAsDataURL(file);

});


/* =========================================
FILTERS
========================================= */

document
.querySelectorAll(".filter")
.forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".filter")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

currentFilter =
button.dataset.filter;

document
.getElementById("preview")
.style.filter=currentFilter;

});

});


/* =========================================
IMAGE PROCESSING
========================================= */

function processImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const maxWidth=1200;

let width=img.width;
let height=img.height;


if(width>maxWidth){

height=
Math.round(height*maxWidth/width);

width=maxWidth;

}


const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;


const ctx=
canvas.getContext("2d");


ctx.filter=
currentFilter==="none"
?
"none"
:
currentFilter;


ctx.drawImage(
img,
0,
0,
width,
height
);


canvas.toBlob(blob=>{

if(blob){

resolve(blob);

}else{

reject(
new Error("Image processing failed")
);

}

},"image/jpeg",0.82);

};


img.onerror=()=>
reject(
new Error("Could not read image")
);

img.src=e.target.result;

};


reader.onerror=()=>
reject(
new Error("Could not read file")
);

reader.readAsDataURL(file);

});

}


/* =========================================
PUBLISH
========================================= */

document
.getElementById("publishBtn")
.addEventListener("click",async()=>{

if(!currentUser){

alert("Please login.");

return;
}


const file =
document.getElementById("photoInput")
.files[0];

const caption =
document.getElementById("caption")
.value.trim();


if(!file){

alert("Please choose a photo.");

return;
}


const message =
document.getElementById("postMessage");


try{

message.innerText="Processing photo...";


const blob =
await processImage(file);


message.innerText="Uploading photo...";


const fileName =
Date.now()+"_"+
Math.random()
.toString(36)
.substring(2)+
".jpg";


const storagePath =
currentUser.id+"/"+fileName;


const {
error:uploadError
} =
await supabase
.storage
.from("Post-images")
.upload(
storagePath,
blob,
{
contentType:"image/jpeg",
upsert:false
}
);


if(uploadError)
throw uploadError;


const {
data:publicData
} =
supabase
.storage
.from("Post-images")
.getPublicUrl(storagePath);


message.innerText="Publishing...";


const {
error:postError
} =
await supabase
.from("posts")
.insert({

user_id:currentUser.id,
image_url:publicData.publicUrl,
caption

});


if(postError)
throw postError;


document.getElementById("caption").value="";
document.getElementById("photoInput").value="";

document
.getElementById("preview")
.classList.add("hidden");

currentFilter="none";


document
.querySelectorAll(".filter")
.forEach((x,i)=>
x.classList.toggle("active",i===0)
);


message.innerText="✅ Post published!";


await loadPublicPosts();

await loadProfile();

showPage("home");


}catch(error){

console.error(error);

message.innerText=
supabaseError(error);

}

});


/* =========================================
LOAD FEED
========================================= */

async function loadPublicPosts(){

const feed =
document.getElementById("feed");


feed.innerHTML=
`
<div class="loading">
Loading posts...
</div>
`;


try{

const {
data:posts,
error
} =
await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false});


if(error)
throw error;


if(!posts || !posts.length){

feed.innerHTML=
`
<div class="card empty">
No public posts yet 📷
</div>
`;

return;
}


feed.innerHTML="";


for(const post of posts){

const html =
await createPostHTML(post);

feed.insertAdjacentHTML(
"beforeend",
html
);

}


}catch(error){

console.error(error);

feed.innerHTML=
`
<div class="card empty">
Could not load posts.<br>
${escapeHTML(supabaseError(error))}
</div>
`;

}

}


/* =========================================
CREATE POST
========================================= */

async function createPostHTML(post){

let profile={};


const {
data:profileData
} =
await supabase
.from("profiles")
.select("*")
.eq("id",post.user_id)
.maybeSingle();


profile=profileData || {};


/* LIKE */

const {
data:likesData
} =
await supabase
.from("likes")
.select("user_id")
.eq("post_id",post.id);


const likes=likesData || [];


const liked=
!!currentUser &&
likes.some(x=>
String(x.user_id)===String(currentUser.id)
);


/* SAVE */

const {
data:savesData
} =
await supabase
.from("saves")
.select("user_id")
.eq("post_id",post.id);


const saves=savesData || [];


const saved=
!!currentUser &&
saves.some(x=>
String(x.user_id)===String(currentUser.id)
);


/* COMMENTS */

const {
data:commentsData
} =
await supabase
.from("comments")
.select("*")
.eq("post_id",post.id)
.order("created_at",{ascending:true});


const comments=commentsData || [];


/* VIEWS */

const {
count:viewCount
} =
await supabase
.from("views")
.select("id",{count:"exact",head:true})
.eq("post_id",post.id);


/* FOLLOW */

let isFollowing=false;


if(currentUser &&
String(post.user_id)!==
String(currentUser.id)){

const {
data:followData
} =
await supabase
.from("follows")
.select("id")
.eq("follower_id",currentUser.id)
.eq("following_id",post.user_id)
.limit(1);


isFollowing=
!!followData &&
followData.length>0;

}


const username=
profile.username || "user";

const name=
profile.display_name || "PIXORO User";

const letter=
name.charAt(0).toUpperCase();


const own=
!!currentUser &&
String(post.user_id)===
String(currentUser.id);


const date=
post.created_at
?
new Date(post.created_at).toLocaleString()
:
"Just now";


let commentsHTML="";


comments.slice(-5).forEach(comment=>{

commentsHTML+=
`
<div class="comment">

<b>
@${escapeHTML(comment.username || "user")}
</b>

${escapeHTML(comment.comment || "")}

</div>

/* =========================================
SHARE
========================================= */

async function sharePost(postId){

const url=
location.origin+
location.pathname+
"?post="+
encodeURIComponent(postId);


try{

if(navigator.share){

await navigator.share({

title:"PIXORO",
text:"Check this PIXORO post!",
url

});

return;

}


if(
navigator.clipboard &&
navigator.clipboard.writeText
){

await navigator.clipboard.writeText(url);

alert("Post link copied!");

return;

}


const temp=
document.createElement("input");

temp.value=url;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

alert("Post link copied!");


}catch(error){

console.log("Share cancelled:",error);

}

}

/* =========================================
DELETE
========================================= */

async function deletePost(postId){

if(!currentUser)
return;


if(!confirm("Are you sure you want to delete this post?"))
return;


try{

const {
data:post,
error:getError
} =
await supabase
.from("posts")
.select("*")
.eq("id",postId)
.maybeSingle();


if(getError)
throw getError;


if(!post){

alert("Post not found.");

return;
}


if(
String(post.user_id)!==
String(currentUser.id)
){

alert("You can delete only your own post.");

return;
}


/* DELETE POST */

const {
error:deleteError
} =
await supabase
.from("posts")
.delete()
.eq("id",postId)
.eq("user_id",currentUser.id);


if(deleteError)
throw deleteError;


/* STORAGE CLEANUP */

if(post.image_url){

try{

const url=
new URL(post.image_url);

const marker=
"/storage/v1/object/public/Post-images/";

const index=
url.pathname.indexOf(marker);


if(index!==-1){

const path=
decodeURIComponent(
url.pathname.substring(
index+marker.length
)
);


await supabase
.storage
.from("Post-images")
.remove([path]);

}

}catch(storageError){

console.log(
"Storage cleanup:",
storageError
);

}

}


await loadPublicPosts();

await loadProfile();


alert("Post deleted successfully!");

}catch(error){

console.error(error);

alert(
"Delete error: "+
supabaseError(error)
);

}

}

.select("*")
.or(
`username.ilike.%${text}%,display_name.ilike.%${text}%`
)
.limit(30);

throw error;


let html="";


for(const u of users || []){

currentUser &&
String(u.id)===
String(currentUser.id)
){

let isFollowing=false;


if(currentUser){

const {
data:followData
} =
await supabase
.from("follows")
.select("id")
.eq("follower_id",currentUser.id)
.eq("following_id",u.id)
.limit(1);

!!followData &&
followData.length>0;

}


const {
count
} =
await supabase
.from("follows")
.select("id",{count:"exact",head:true})
.eq("following_id",u.id);


html+=
`

.charAt(0)
.toUpperCase()
)}

u.display_name||
"PIXORO User"
)}
</b>

<div>
@${escapeHTML(
u.username||
"user"
)}
</div>

<small>
${count||0} followers
</small>

</div>


<button
class="followbtn follow-action ${isFollowing?"following":""}"
data-user-id="${escapeHTML(u.id)}"
data-following="${isFollowing}">

${isFollowing?"Following":"Follow"}

</button>

</div>

`;

}


box.innerHTML=
html || "No users found.";


}catch(error){

console.error(error);

box.innerText=
supabaseError(error);

}

}

/* =========================================
ESCAPE
========================================= */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
ERROR
========================================= */

function supabaseError(error){

const message=
error?.message||"";

const code=
error?.code||"";

const lower=
message.toLowerCase();


if(
lower.includes("invalid login")||
lower.includes("invalid credentials")
){

return "Wrong email or password.";

}


if(
lower.includes("email not confirmed")
){

return "Please confirm your email first.";

}


if(
lower.includes("already registered")
){

return "This email is already registered.";

}


if(
lower.includes("duplicate")||
code==="23505"
){

return "This item already exists.";

}


if(
code==="42501"||
lower.includes("row-level security")
){

return "Permission denied. Check Supabase RLS policies.";

}


if(
lower.includes("bucket")||
lower.includes("storage")
){

return "Storage error. Check Post-images bucket and Storage policies.";

}


if(
lower.includes("relation")&&
lower.includes("does not exist")
){

return "Database table is missing.";

}


return message||
"Something went wrong.";

}
