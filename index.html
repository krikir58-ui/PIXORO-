<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;text-align:center}
h1{color:#FFD700;letter-spacing:5px;margin:20px 0 5px}
.sub{color:#00ff88;font-size:10px;letter-spacing:2px;margin-bottom:30px}
.box{background:#111;border:1px solid #333;padding:20px;border-radius:15px;margin-bottom:20px;text-align:left}
.box h3{color:#FFD700;margin:0 0 15px}
input{width:100%;padding:12px;margin-bottom:10px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:13px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.feed{display:none}
.post{background:#111;border:1px solid #333;padding:15px;border-radius:10px;margin:15px 0}
</style>
</head>
<body>

<h1>PIXORO V1</h1>
<div class="sub">THANI THANI FILE - CHATGPT MARI</div>

<div id="authDiv">
  <div class="box"><h3>Signup</h3><input id="su_user" placeholder="giri"><input id="su_pass" type="password" placeholder="Password"><button onclick="signupUser()">Signup</button></div>
  <div class="box"><h3>Login</h3><input id="li_user" placeholder="giri"><button onclick="loginUser()" style="background:#222;color:#fff">Login</button></div>
</div>

<div id="feedDiv" class="feed">
  <div class="box"><h3>Welcome <span id="uName"></span> 👑 <button onclick="logoutUser()" style="width:auto;padding:5px 15px;float:right;background:#ff3333;color:#fff">Logout</button></h3></div>
  <div class="box">
    <h3>Photo Upload - Gallery la irunthu da! 📸</h3>
    <input type="file" id="imgFile" accept="image/*" onchange="previewImage()">
    <img id="preview" style="width:100%;border-radius:10px;display:none;margin:10px 0;max-height:300px;object-fit:cover">
    <input id="cap" placeholder="Caption - Enna da matter?">
    <button onclick="createPost()">Post Podu Da 🔥</button>
  </div>
  <div id="posts"></div>
</div>

<script>
const SUPABASE_URL = "https://yecpltndhlzfjplzhcpm.supabase.co";
// IDA MAATHU DA GIRI! eyJ... KEY AH INGA PODU DA!
const SUPABASE_KEY = "sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_";
// MELA IRUKKURA KEY THAPPU DA! Supabase -> Settings -> API -> anon public key ah copy panni inga paste pannu da!

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedFile = null;
function previewImage(){
  let file = document.getElementById('imgFile').files[0];
  if(!file) return;
  selectedFile = file;
  let r = new FileReader();
  r.onload = e => {
    document.getElementById('preview').src = e.target.result;
    document.getElementById('preview').style.display = 'block';
  };
  r.readAsDataURL(file);
}

async function signupUser(){
  let u = document.getElementById('su_user').value.trim().toLowerCase();
  let p = document.getElementById('su_pass').value.trim();
  if(!u||!p) return alert("Username Password podu da");
  let {error} = await sb.from('users').insert([{username:u,password:p}]);
  if(error &&!error.message.includes('duplicate')) return alert(error.message);
  localStorage.setItem('pix_user', u); location.reload();
}
async function loginUser(){
  let u = document.getElementById('li_user').value.trim().toLowerCase();
  if(!u) return alert("Username podu");
  let {error} = await sb.from('users').select('*').eq('username',u).single();
  if(error) return alert("User illa - Signup pannu da");
  localStorage.setItem('pix_user', u); location.reload();
}
function logoutUser(){localStorage.removeItem('pix_user');location.reload();}
async function checkUser(){
  let u = localStorage.getItem('pix_user');
  if(!u) return;
  document.getElementById('authDiv').style.display='none';
  document.getElementById('feedDiv').style.display='block';
  document.getElementById('uName').innerText=u;
  loadPosts();
}
async function createPost(){
  let cap = document.getElementById('cap').value.trim();
  let u = localStorage.getItem('pix_user');
  if(!selectedFile) return alert("Gallery la irunthu photo select pannu da!");
  alert("Uploading da... ⏳");
  let fileName = Date.now()+"_"+selectedFile.name;
  let {error} = await sb.storage.from('post-images').upload(fileName, selectedFile);
  if(error) return alert("Upload error: "+error.message+" - Bucket create panniya da?");
  let {data} = sb.storage.from('post-images').getPublicUrl(fileName);
  await sb.from('posts').insert([{username:u, image_url:data.publicUrl, caption:cap}]);
  alert("Vera Level Post da Giri! 👑");
  document.getElementById('cap').value=""; document.getElementById('imgFile').value=""; document.getElementById('preview').style.display='none'; selectedFile=null;
  loadPosts();
}
async function loadPosts(){
  let {data} = await sb.from('posts').select('*').order('id',{ascending:false});
  let h=''; (data||[]).forEach(p=>{ h+=`<div class="post"><b>@${p.username}</b><br><br><img src="${p.image_url}" style="width:100%;border-radius:8px"><p>${p.caption||''}</p></div>`; });
  document.getElementById('posts').innerHTML=h;
}
checkUser();
</script>
</body>
</html>
