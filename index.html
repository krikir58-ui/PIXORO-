<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXORO V14 - REELS + CASH</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-3940256099942544" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.reel{height:100vh;position:relative;scroll-snap-align:start}
.reel video{width:100%;height:100%;object-fit:cover}
.cash-badge{position:absolute;top:10px;left:10px;background:gold;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold}
.actions{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:20px}
.actions span{font-size:28px;text-align:center}
.actions b{font-size:12px;display:block}
</style>
</head>
<body>

<!-- REELS CONTAINER -->
<div id="reels" style="height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory">

<!-- REEL 1 -->
<div class="reel">
<video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay muted loop></video>
<div class="cash-badge" id="cash1">👁️ 0 Views | 💰 ₹0.00</div>
<div class="actions">
<span>❤️<b id="like1">0</b></span>
<span>💬<b>12</b></span>
<span>↗️<b>Share</b></span>
</div>
</div>

<!-- TEST AD AFTER 3 REELS -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-app-pub-3940256099942544"
     data-ad-slot="1033173712"
     data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

</div>

<script>
// PIXORO V14 CASH LOGIC - 4000 Views = ₹30
let views = 1240; // demo ku
let rate = 30/4000; // ₹0.0075 per view
let earned = views * rate;
let watchTime = 0;

setInterval(()=>{
  watchTime++;
  if(watchTime>=3){
    views++;
    earned = views * rate;
    document.getElementById('cash1').innerHTML = `👁️ ${views} Views | 💰 ₹${earned.toFixed(2)} | 4K=₹30`;
    watchTime=0;
  }
},1000);

// Like logic
let likes=0;
document.getElementById('like1').parentElement.onclick=()=>{
  likes++;
  document.getElementById('like1').innerText=likes;
}
</script>

<!-- BLUE TICK VERIFIED - NO BANNER -->
<script>
if(window.location.hostname.includes("github.io")){
  console.log("PIXORO V14 BLUE TICK VERIFIED ✅");
}
</script>

</body>
</html>
