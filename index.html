<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro 🌹</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0f14;color:#fff;max-width:450px;margin:0 auto}
/* TOP - Yellow Red Rose Glow - Battery Save */
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #331a1a;position:sticky;top:0;background:#120f0f;z-index:50}
.post{border-bottom:1px solid #2a1a1a;background:#120f0f;padding-bottom:12px;border-radius:16px;margin:10px;border:1px solid #331a1a}.postTop{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.post img.main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:12px}
.actions{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.actions .left{display:flex;gap:12px;align-items:center}
.actions button{background:#1a1212;border:1px solid #331a1a;border-radius:12px;padding:7px 10px;cursor:pointer;display:flex;color:#ff9aa8}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:88%;max-width:340px;background:#1a1212;border:1px solid #331a1a;border-radius:20px;display:flex;justify-content:space-around;align-items:center;padding:10px 0;z-index:100}
.nav a{color:#6a4a4a;text-decoration:none;font-size:22px}.nav a.active{color:#fff;background:linear-gradient(135deg,#FFD600,#ff3040);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;box-shadow:0 0 12px rgba(255,48,64,.5)}
.navPlus{width:44px;height:44px;background:linear-gradient(135deg,#FFD600,#ff3040);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 0 12px rgba(255,48,64,.4)}
.pfpRing{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FFD600,#ff3040,#ff6b9d);padding:2px;cursor:pointer}.pfpInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.pfpInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.followBtn{border:1px solid #ff6b9d;border-radius:20px;background:#1a1212;color:#ff9aa8;padding:5px 14px;font-size:12px;font-weight:700}
.followBtn.following{background:linear-gradient(135deg,#FFD600,#ff3040);color:#fff;border-color:#FFD600}
.storyBar{display:flex;gap:12px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #2a1a1a}.storyBar::-webkit-scrollbar{display:none}
.sItem{text-align:center;min-width:68px;cursor:pointer}.sRing{width:64px;height:64px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,#FFD600,#ff3040,#ff6b9d)}.sRing.close{background:linear-gradient(135deg,#00ff66,#00cc44)}.sRing.seen{background:#333}.sRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.sRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}.sAdd{width:64px;height:64px;border-radius:50%;background:#1a1212;border:2px dashed #331a1a;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ff6b9d}.sName{font-size:11px;margin-top:4px;color:#ff9aa8}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}30%{transform:translate(-50%,-50%) scale(0.95)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.sosBtn{position:fixed;bottom:90px;right:15px;background:linear-gradient(135deg,#FFD600,#ff3040);color:#fff;border:0;width:60px;height:60px;border-radius:50%;font-weight:900;font-size:14px;z-index:999;cursor:pointer;box-shadow:0 0 15px rgba(255,48,64,.6)}
</style></head><body>
<div class="top"><b style="font-size:22px;background:linear-gradient(135deg,#FFD600,#ff3040,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900">Pixoro 🌹</b><div style="display:flex;gap:18px"><span onclick="location.href='dm.html'" style="cursor:pointer">✈️</span><span onclick="location.href='notifications.html'" style="cursor:pointer">🔔</span></div></div>
<div class="storyBar" id="storyBar"></div>
<div id="feed"><p style="text-align:center;padding:60px;color:#6a4a4a">Loading Pixoro Rose...</p></div>
<div style="height:90px"></div>
<button id="sosBtn" class="sosBtn" onclick="sendSOS()" style="display:none">🆘<br>SOS</button>
<div class="nav"><a class="active" href="index.html">🏠</a><a href="search.html">🔎</a><div class="navPlus" onclick="openCreate()">+</div><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<!-- CREATE SHEET - YELLOW RED ROSE THEME -->
<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#1a1212;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:slideUp .25s;border:1px solid #331a1a"><div style="width:40px;height:4px;background:#331a1a;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px;background:linear-gradient(135deg,#FFD600,#ff3040);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Create New 🌹</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div onclick="goCreate('post')" style="background:#120f0f;border:1px solid #331a1a;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">📸</div><div style="margin-top:6px;font-weight:700;color:#ff9aa8">Post</div><small style="color:#6a4a4a">Photo share</small></div>
<div onclick="goCreate('reel')" style="background:#120f0f;border:1px solid #331a1a;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🎞️</div><div style="margin-top:6px;font-weight:700;color:#ff9aa8">Reels</div><small style="color:#6a4a4a">Short video</small></div>
<div onclick="goCreate('story')" style="background:#120f0f;border:1px solid #331a1a;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">⭕</div><div style="margin-top:6px;font-weight:700;color:#ff9aa8">Story</div><small style="color:#6a4a4a">24h only</small></div>
<div onclick="goCreate('live')" style="background:#120f0f;border:1px solid #ff304033;border-radius:16px;padding:18px;text-align:center;cursor:pointer"><div style="font-size:32px">🔴</div><div style="margin-top:6px;font-weight:700;color:#ff3040">Live</div><small style="color:#6a4a4a">Go live now</small></div>
</div><div onclick="closeCreate()" style="margin-top:16px;text-align:center;background:#120f0f;padding:12px;border-radius:12px;color:#6a4a4a;border:1px solid #331a1a">Cancel</div></div></div>

<div id="commentModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#1a1212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;border:1px solid #331a1a"><div style="padding:14px;text-align:center;border-bottom:1px solid #331a1a"><b style="color:#ff9aa8">Comments 🌹</b><span onclick="closeComment()" style="float:right;cursor:pointer">✕</span></div><div id="commentList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div><div style="padding:10px;border-top:1px solid #331a1a;display:flex;gap:10px"><input id="commentInput" placeholder="Add comment..." style="flex:1;background:#120f0f;border:1px solid #331a1a;padding:10px 14px;border-radius:20px;color:#fff"><button onclick="addComment()" style="background:linear-gradient(135deg,#FFD600,#ff3040);border:0;color:#fff;font-weight:700;padding:8px 14px;border-radius:20px">Post</button></div></div></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allFollows=[],allSaves=[],allStories=[],allComments=[],currentPostId=null
function openCreate(){document.getElementById('createSheet').style.display='flex'}function closeCreate(){document.getElementById('createSheet').style.display='none'}
function goCreate(t){closeCreate();if(t==='post')location.href='upload.html';if(t==='reel')location.href='reels-upload.html';if(t==='story')location.href='story-add.html';if(t==='live')location.href='live.html'}
function pfpHtml(u){return `<div class="pfpRing"><div class="pfpInner"><img src="https://i.pravatar.cc/100?u=${u}"></div></div>`}
async function loadAll(){let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let {data:likes}=await supa.from('likes').select('*');let {data:follows}=await supa.from('follows').select('*');let {data:saves}=await supa.from('saves').select('*').eq('username',ME);let {data:stories}=await supa.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});allPosts=(posts||[]).filter(p=>!p.is_archived);allLikes=likes||[];allFollows=follows||[];allSaves=saves||[];allStories=stories||[];renderStories();renderFeed();checkSOSBtn();}
function renderStories(){let bar=document.getElementById('storyBar');let users=[...new Set(allStories.map(s=>s.username))];let html=`<div class="sItem" onclick="location.href='story-add.html'"><div class="sAdd">+</div><div class="sName">Your Story</div></div>`;html+=users.map(u=>{let s=allStories.find(x=>x.username===u);let img=s.image_url||`https://i.pravatar.cc/100?u=${u}`;return `<div class="sItem" onclick="location.href='story-view.html?user=${u}'"><div class="sRing ${s.audience==='close_friends'?'close':''}"><div class="sRingInner"><img src="${img}"></div></div><div class="sName">${u}</div></div>`}).join('');bar.innerHTML=html}
function heartAnim(id){let h=document.getElementById('heart-'+id);if(!h)return;h.style.animation='none';h.offsetHeight;h.style.animation='heartPop 0.9s forwards';}
function renderFeed(){let html='';for(let p of allPosts){let lCount=allLikes.filter(l=>l.post_id==p.id).length;let isLiked=allLikes.some(l=>l.post_id==p.id&&l.username==ME);html+=`<div class="post"><div class="postTop"><div style="display:flex;align-items:center;gap:10px">${pfpHtml(p.username)}<b>@${p.username}</b></div><span style="font-size:20px">⋮</span></div><div style="position:relative" ondblclick="heartAnim(${p.id});likePost(${p.id})"><img class="main" src="${p.image_url}"><div id="heart-${p.id}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;opacity:0;pointer-events:none">❤️</div></div><div class="actions"><div class="left"><button onclick="likePost(${p.id})"><svg viewBox="0 0 24 24" width="26" height="26" fill="${isLiked?'#ff3040':'none'}" stroke="${isLiked?'#ff3040':'#ff9aa8'}" stroke-width="2"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg></button><button onclick="openComment(${p.id})">💬</button><button>✈️</button></div><button onclick="savePost(${p.id})">🔖</button></div><div style="padding:0 12px"><b style="color:#ff6b9d">${lCount} likes</b><br><b>@${p.username}</b> ${p.caption||''}</div></div>`}document.getElementById('feed').innerHTML=html||'<p style="text-align:center;padding:60px;color:#6a4a4a">No posts da!</p>'}
async function likePost(id){let liked=allLikes.some(l=>l.post_id==id&&l.username==ME);if(liked)await supa.from('likes').delete().eq('post_id',id).eq('username',ME);else await supa.from('likes').insert({post_id:id,username:ME});let {data}=await supa.from('likes').select('*');allLikes=data||[];renderFeed()}
async function savePost(id){let saved=allSaves.some(s=>s.post_id==id);if(saved)await supa.from('saves').delete().eq('post_id',id).eq('username',ME);else await supa.from('saves').insert({post_id:id,username:ME});let {data}=await supa.from('saves').select('*').eq('username',ME);allSaves=data||[];renderFeed()}
async function openComment(id){currentPostId=id;document.getElementById('commentModal').style.display='flex';let {data}=await supa.from('comments').select('*').eq('post_id',id);document.getElementById('commentList').innerHTML=(data||[]).map(c=>`<div style="padding:8px 0"><b>@${c.username}</b> ${c.text}</div>`).join('')||'No comments'}
function closeComment(){document.getElementById('commentModal').style.display='none'}async function addComment(){let t=document.getElementById('commentInput').value.trim();if(!t)return;await supa.from('comments').insert({post_id:currentPostId,username:ME,text:t});document.getElementById('commentInput').value='';openComment(currentPostId)}
function checkSOSBtn(){let btn=document.getElementById('sosBtn');if(localStorage.getItem('pixoro_sos_on')==='true')btn.style.display='block';}
async function sendSOS(){if(!confirm('SOS anupava?'))return;navigator.geolocation.getCurrentPosition(async p=>{let link=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;let {data}=await supa.from('close_friends').select('*').eq('owner',ME);if(!data||!data.length)return alert('Trusted illa!');window.open(`https://api.whatsapp.com/send?phone=${data[0].phone}&text=${encodeURIComponent('🆘 HELP! '+ME+' '+link)}`,'_blank')})}
loadAll()
</script></body></html>
