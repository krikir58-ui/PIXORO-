<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PIXORO - Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js?v=128"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#0b141a!important;color:#e9edef;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{background:#202c33;padding:12px 14px 10px;position:sticky;top:0;z-index:50}
.topRow{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:700;color:#e9edef}
.logo span{color:#00a884}
.topIco{font-size:22px;margin-left:16px;cursor:pointer;color:#aebac1}
.subTop{display:flex;gap:6px;margin-top:12px}
.chip{padding:6px 12px;border-radius:16px;background:#2a3942;color:#8696a0;font-size:13px;cursor:pointer}
.chip.on{background:#00a884;color:#0b141a;font-weight:700}
.searchBar{margin:10px;background:#202c33;border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.searchBar input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:14px}
.notes{display:flex;gap:12px;overflow-x:auto;padding:10px;scrollbar-width:none}.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 66px;text-align:center;cursor:pointer;position:relative}
.nRing{width:60px;height:60px;border-radius:50%;padding:2.5px;background:#00a884;position:relative}
.nRingInner{width:100%;height:100%;border-radius:50%;background:#0b141a;padding:2px}.nRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.noteBubble{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-size:9px;padding:4px 7px;border-radius:12px;white-space:nowrap;font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.noteInput{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#233138;border:1px solid #333;padding:20px;border-radius:18px;z-index:999;display:none;width:85%;max-width:360px}.noteInput input{width:100%;padding:12px;border-radius:10px;border:0;background:#2a3942;color:#fff;outline:none;margin:10px 0}
.chatRow{display:flex;gap:12px;padding:11px 12px;align-items:center;cursor:pointer}
.chatRow:active{background:#202c33}
.chatRow img{width:50px;height:50px;border-radius:50%;object-fit:cover;flex-shrink:0}
.dot{width:13px;height:13px;background:#00a884;border-radius:50%;border:2.5px solid #0b141a;position:absolute;bottom:2px;right:2px}
.unreadBadge{background:#00a884;color:#0b141a;font-size:12px;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0 6px;font-weight:700}
.tick{letter-spacing:-1px}
.tick.blue{color:#53bdeb}
.tick.grey{color:#8696a0}
.actionSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#233138;border-radius:20px 20px 0 0;padding:16px;z-index:1000;display:none}.actionSheet button{width:100%;padding:13px;border:0;background:#2a3942;color:#fff;border-radius:12px;margin:4px 0;text-align:left}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:62px;background:#202c33;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8696a0}.bottom-nav a.active{color:#00a884}.bottom-nav span{font-size:11px}.bottom-nav a.active span{color:#00a884;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover}
.fab{position:fixed;bottom:78px;right:16px;width:52px;height:52px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-size:22px;z-index:90;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style></head><body>
<div class="top"><div class="topRow"><div class="logo">PIXOR<span>O</span></div><div><span class="topIco">📷</span><span class="topIco" onclick="document.getElementById('searchInp').focus()">🔍</span><span class="topIco">⋮</span></div></div><div class="subTop"><div class="chip on" onclick="setTab('all',this)">All <span id="cAll"></span></div><div class="chip" onclick="setTab('requests',this)">Requests</div><div class="chip" onclick="setTab('hidden',this)">Hidden 🔒</div></div></div>
<div class="searchBar">🔍 <input id="searchInp" placeholder="Search..." oninput="onSearch(this.value)"></div>
<div class="notes" id="notes"></div>
<div id="list" style="text-align:center;color:#8696a0;padding:10px">Loading...</div>
<div class="fab" onclick="location.href='search.html'">💬</div>
<div class="noteInput" id="notePop"><h3>✏️ Add Note</h3><input id="noteText" placeholder="Yedhachum Yosichiya da...?" maxlength="60"><div style="display:flex;gap:10px"><button onclick="saveNote()" style="flex:1;background:#00a884;color:#000;border:0;padding:11px;border-radius:20px;font-weight:700">Share</button><button onclick="document.getElementById('notePop').style.display='none'" style="flex:1;background:#2a3942;color:#fff;border:0;padding:11px;border-radius:20px">Cancel</button></div></div>
<div class="actionSheet" id="sheet"><b id="sheetName">Chat</b><button onclick="doPin()">📌 Pin / Unpin</button><button onclick="doMute()">🔕 Mute / Unmute</button><button onclick="doArchive()">🗄️ Archive</button><button onclick="doDelete()" style="color:#ff5555">🗑️ Delete Chat</button><button onclick="document.getElementById('sheet').style.display='none'" style="text-align:center;background:#333">Cancel</button></div>
<div class="bottom-nav"><a href="index.html"><span style="font-size:22px">⌂</span><span>Home</span></a><a href="search.html"><span style="font-size:22px">🔍</span><span>Search</span></a><a href="reels.html"><span style="font-size:22px">▶️</span><span>Reels</span></a><a href="dm.html" class="active"><span style="font-size:22px">💬</span><span>Chats</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa, ME_RAW='', ME_ID='', profileMap={}, profileById={}, CUR_TAB='all', ALL_CHATS=[], NOTES_MAP={}, SEARCH_Q='', UNREAD_MAP={}, SHEET_USER='', PINNED=[], MUTED=[], ARCHIVED=[];
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
function letterFor(u){ let l=(cleanUser(u||'P').charAt(0).toUpperCase()||'P'); return /[A-Z]/.test(l)?l:'P'; }
function getPfp(u){ let p=profileMap[cleanUser(u)]||profileById[u]; if(p?.avatar_url||p?.profile_pic) return p.avatar_url||p.profile_pic; return 'https://ui-avatars.com/api/?name='+letterFor(u||'P')+'&background=00a884&color=fff&size=200&bold=true' }
function fmtTime(t){ let d=new Date(t); let now=new Date(); if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); let y=new Date(); y.setDate(now.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], {day:'numeric',month:'short'}); }
async function updatePresence(o){ if(!ME_ID) return; await supa.from('profiles').update({is_online:o,last_seen:new Date().toISOString()}).eq('id',ME_ID); }
function isMineMsg(m){ return String(m.sender_id)===ME_ID || cleanUser(m.sender)===ME_RAW; }
function otherIdOf(m){
  // FIX - UUID mattum return pannu da - username mix panna koodathu da
  if(isMineMsg(m) && m.receiver_id) return String(m.receiver_id);
  if(!isMineMsg(m) && m.sender_id) return String(m.sender_id);
  // Old message ku sender / receiver name la iruntha - profile la thedu da
  let name = isMineMsg(m) ? cleanUser(m.receiver) : cleanUser(m.sender);
  let p = profileMap[name]; return p ? String(p.id) : name;
}
function onSearch(v){ SEARCH_Q=v.toLowerCase().trim(); render(); }
let pressTimer=null;
function openSheet(user,uname){ SHEET_USER=user; document.getElementById('sheetName').innerText='@'+uname; document.getElementById('sheet').style.display='block'; }
function doPin(){ let i=PINNED.indexOf(SHEET_USER); if(i>=0) PINNED.splice(i,1); else PINNED.unshift(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doMute(){ let i=MUTED.indexOf(SHEET_USER); if(i>=0) MUTED.splice(i,1); else MUTED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doArchive(){ if(!ARCHIVED.includes(SHEET_USER)) ARCHIVED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doDelete(){ if(confirm('Delete this chat da?')){ ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; render(); } }
async function loadNotes(){
  let {data}=await supa.from('notes').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false});
  NOTES_MAP={}; (data||[]).forEach(n=>{ NOTES_MAP[cleanUser(n.username)]=n.text; });
  // FIX - Fake note kaata koodathu da - Real note irukkuravanga mattum da
  let usersWithNote = Object.keys(NOTES_MAP).filter(u=>u!==ME_RAW);
  let myNote = NOTES_MAP[ME_RAW];
  let html='';
  html+=`<div class="nItem" onclick="document.getElementById('notePop').style.display='block'"><div class="nRing" style="background:#8696a0"><div class="nRingInner"><img src="${getPfp(ME_RAW)}"></div>${myNote?`<div class="noteBubble">${myNote}</div>`:''}</div><div style="font-size:10px;margin-top:4px">Your note</div></div>`;
  html+=usersWithNote.slice(0,10).map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="nRing"><div class="nRingInner"><img src="${getPfp(u)}"></div><div class="noteBubble">${NOTES_MAP[u]}</div></div><div style="font-size:10px;margin-top:4px">${u}</div></div>`).join('');
  // Note yaarum illana - Notes row ah maraichidu da - WhatsApp la apdithaan da
  document.getElementById('notes').style.display = (myNote || usersWithNote.length) ? 'flex' : 'none';
  document.getElementById('notes').innerHTML=html;
}
async function saveNote(){ let t=document.getElementById('noteText').value.trim(); if(!t) return; await supa.from('notes').delete().eq('username',ME_RAW); await supa.from('notes').insert({user_id:ME_ID,username:ME_RAW,text:t}); document.getElementById('notePop').style.display='none'; loadNotes(); }
function setTab(t,el){ CUR_TAB=t; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); el.classList.add('on'); render(); }
function render(){
  let list=ALL_CHATS.filter(c=>!ARCHIVED.includes(c.other));
  if(CUR_TAB==='hidden') list=ALL_CHATS.filter(c=>ARCHIVED.includes(c.other));
  if(CUR_TAB==='requests') list=list.filter(c=>c.threadType==='requests');
  if(SEARCH_Q) list=list.filter(c=>{ let n=(profileById[c.other]?.username||c.other||'').toLowerCase(); return n.includes(SEARCH_Q)||c.preview.toLowerCase().includes(SEARCH_Q); });
  list.sort((a,b)=>{ let pa=PINNED.includes(a.other)?1:0, pb=PINNED.includes(b.other)?1:0; if(pa!==pb) return pb-pa; return new Date(b.msg.created_at)-new Date(a.msg.created_at); });
  if(!list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#8696a0">No chats da<br><button onclick="location.href='search.html'" style="margin-top:12px;background:#00a884;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`; return; }
  document.getElementById('list').innerHTML=list.map(c=>{
    let uname=profileById[c.other]?.username||c.other; let prof=profileById[c.other]; let dot=prof?.is_online?`<span class="dot"></span>`:``; let uc=UNREAD_MAP[c.other]||0; let badge=uc?`<span class="unreadBadge">${uc}</span>`:``; let isPin=PINNED.includes(c.other); let isMute=MUTED.includes(c.other);
    let isMine=isMineMsg(c.msg);
    let tick=isMine?`<span class="tick ${c.msg.seen?'blue':'grey'}">${c.msg.seen?'✓✓':'✓'}</span> `:'';
    // FIX - WhatsApp la Status line illa da - Name + Preview + Time mattum da
    return `<div class="chatRow" onmousedown="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" onmouseup="clearTimeout(pressTimer)" ontouchstart="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" ontouchend="clearTimeout(pressTimer)"><div style="position:relative"><img src="${getPfp(c.other)}" onerror="this.src='https://ui-avatars.com/api/?name='+letterFor('${cleanUser(uname)}')+'&background=00a884&color=fff'">${dot}</div><div style="flex:1;min-width:0" onclick="location.href='chat.html?user=${encodeURIComponent(cleanUser(uname))}'"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px;font-weight:400">${isPin?'📌 ':''}${cleanUser(uname)} ${isMute?'🔕':''}</b><span style="font-size:12px;color:${uc?'#00a884':'#8696a0'};flex-shrink:0">${fmtTime(c.msg.created_at)}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px"><div style="font-size:14px;color:${uc?'#e9edef':'#8696a0'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${tick}${c.preview}</div>${badge}</div></div></div>`
  }).join('');
}
async function init(){
  if(!window.supa){setTimeout(init,300);return} supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id; let {data:my}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME_RAW=cleanUser(my?.username||session.user.email.split('@')[0]); let navPfp=document.getElementById('navPfp'); if(navPfp) navPfp.src=my?.avatar_url||getPfp(ME_RAW);
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileById[p.id]=p});
  let qp=new URLSearchParams(location.search); let qU=qp.get('u')||qp.get('user')||qp.get('id')||'';
  if(qU){ let target=null; if(qU.includes('-')&&qU.length>20) target=profileById[qU]; if(!target) target=profileMap[cleanUser(qU)]; if(target){ location.href='chat.html?user='+encodeURIComponent(cleanUser(target.username)); return; } }
  updatePresence(true); setInterval(()=>updatePresence(true),30000); loadNotes(); load();
  supa.channel('dm-list').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe();
  supa.channel('presence-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},()=>load()).subscribe();
  supa.channel('notes-live').on('postgres_changes',{event:'*',schema:'public',table:'notes'},()=>loadNotes()).subscribe();
}
async function load(){
  let {data}=await supa.from('messages').select('*').order('created_at',{ascending:false}).limit(300); if(!data) data=[];
  // FIX - Unread - UUID la key pannu da
  UNREAD_MAP={}; data.forEach(m=>{ if(!isMineMsg(m) && !m.seen){ let oid=otherIdOf(m); UNREAD_MAP[oid]=(UNREAD_MAP[oid]||0)+1; } });
  let map={};
  data.forEach(m=>{
    let oid=otherIdOf(m);
    if(!oid || cleanUser(oid)===ME_RAW) return;
    if(!profileMap[cleanUser(oid)] && !profileById[oid]) return;
    if(!map[oid] || new Date(m.created_at)>new Date(map[oid].created_at)) map[oid]=m;
  });
  ALL_CHATS=Object.values(map).map(c=>{
    let oid=otherIdOf(c);
    // FIX - Preview - Real text thaan da - pixoroPreviewText ah text ku use panna koodathu da
    let raw=(c.text||c.message||c.content||'');
    let preview='';
    if(c.type==='voice'||c.media_type==='voice') preview='🎙️ Voice';
    else if(c.type==='image'||c.media_type==='image'||c.media_path) preview='📷 Photo';
    else if(c.type==='video'||c.media_type==='video') preview='🎬 Video';
    else if(raw.startsWith('{"e2e"')) preview='💬 Message';
    else if(raw.trim()) preview=raw.slice(0,40);
    else preview='💬 Message';
    let isFirstFromThem=!isMineMsg(c); let threadType='primary'; if(isFirstFromThem && !c.seen) threadType='requests';
    return {other:oid,msg:c,preview,threadType};
  });
  document.getElementById('cAll').innerText=ALL_CHATS.length||''; render();
}
init();
</script></body></html>
