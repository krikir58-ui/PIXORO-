<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:80px}
.top{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#000;z-index:50;border-bottom:1px solid #1e1e1e}
.search{margin:10px 12px;background:#1a1a1a;border-radius:12px;padding:10px 14px;color:#888;display:flex;gap:8px}
.notes{display:flex;gap:14px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid #111}
.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 72px;text-align:center}
.nRing{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#FF6A00,#FF0A33,#FFD600);position:relative}
.nRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2.5px}.nRingInner img{width:100%;height:100%;border-radius:50%}
.noteBubble{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;font-size:10px;padding:4px 8px;border-radius:12px;white-space:nowrap;border:1px solid #333}
.tabs{display:flex;gap:8px;padding:10px 12px}
.tab{padding:6px 14px;border-radius:18px;background:#222;color:#999;font-size:13px}
.tab.active{background:#fff;color:#000;font-weight:700}
.chatRow{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #111;cursor:pointer}
.chatRow img{width:52px;height:52px;border-radius:50%}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0 20px;z-index:100}
</style>
</head><body>
<div class="top"><b style="font-size:20px">comedy_gi... ▾</b><div style="display:flex;gap:16px;font-size:20px"><span>☰</span><span onclick="newChat()">✏️</span></div></div>
<div class="search">🔍 Search or ask Meta AI</div>
<div class="notes" id="notes"></div>
<div class="tabs"><div class="tab active">All 3</div><div class="tab">Primary 3</div><div class="tab">General</div><div class="tab">Requests</div></div>
<div id="list" style="text-align:center;color:#555;padding:30px">Loading real chats da...</div>
<div class="bottom">
  <span onclick="location.href='index.html'">🏠</span><span onclick="location.href='search.html'">🔍</span><span onclick="location.href='index.html'">➕</span><span onclick="location.href='reels.html'">🎬</span><span>👤</span>
</div>
<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME=localStorage.getItem('pixoro_current_user')||'Giri'
function newChat(){let u=prompt('Yaaruku msg da?'); if(u) location.href=`chat.html?user=${u}`}
async function load(){
  let {data} = await supa.from('messages').select('*').or(`sender.eq.${ME},receiver.eq.${ME}`).order('created_at',{ascending:false}).limit(100)
  let notesUsers = data? [...new Set(data.map(m=>m.sender===ME?m.receiver:m.sender))].slice(0,6) : []
  document.getElementById('notes').innerHTML = `<div class="nItem"><div class="nRing" style="background:#222"><div class="nRingInner"><img src="https://i.pravatar.cc/100?u=${ME}"></div><div class="noteBubble">Your note<br><small style="color:#888">Location off</small></div></div></div>` + notesUsers.map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${u}'"><div class="nRing"><div class="nRingInner"><img src="https://i.pravatar.cc/100?u=${u}"></div><div class="noteBubble">Hi da ${u} ❤️</div></div></div>`).join('') || '<div class="nItem"><div class="nRing"><div class="nRingInner"><img src="https://i.pravatar.cc/100?u=test"></div></div><div style="font-size:11px;margin-top:4px">No notes</div></div>'
  if(!data||!data.length){document.getElementById('list').innerHTML=`<div style="padding:40px;color:#666">No chats da!<br><button onclick="newChat()" style="margin-top:12px;background:#fff;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`;return}
  let map={}; data.forEach(m=>{let o=m.sender===ME?m.receiver:m.sender; if(!map[o]||new Date(m.created_at)>new Date(map[o].created_at)) map[o]=m})
  let chats=Object.values(map)
  document.getElementById('list').innerHTML = chats.map(c=>{let o=c.sender===ME?c.receiver:c.sender; return `<div class="chatRow" onclick="location.href='chat.html?user=${o}'"><img src="https://i.pravatar.cc/100?u=${o}"><div style="flex:1;text-align:left"><b style="font-size:14px">${o} 🎀</b><div style="font-size:12px;color:#999">${c.sender===ME?'Sent':'4+ new messages'} • ${new Date(c.created_at).toLocaleTimeString()}</div></div><div style="font-size:18px">📷</div></div>`}).join('')
}
load()
</script>
</body></html>
