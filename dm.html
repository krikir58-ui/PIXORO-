<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DM - Pixoro Safe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.top{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e1e;background:#000}
.tabs{display:flex;background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;font-weight:700}
.tab.active{color:#fff;border-bottom:2px solid #fff}
.badgeNum{background:#FF0A33;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:6px}
.searchBar{margin:10px 12px;background:#1a1a1a;border:1px solid #222;padding:10px 14px;border-radius:12px;display:flex;gap:10px}
.searchBar input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.chatItem{padding:12px 14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #0f0f0f;cursor:pointer}
.chatItem:hover{background:#101010}
.chatItem.request{background:linear-gradient(90deg,#1a0a15,#000);border-left:3px solid #FF5AA8}
.pfpWrap{width:54px;height:54px;border-radius:50%;position:relative;flex-shrink:0}
.pfpWrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #222}
.pfpWrap.requestRing img{border:2px solid #FF5AA8;box-shadow:0 0 10px rgba(255,90,168,.5)}
.onlineDot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#0f0;border:2px solid #000;border-radius:50%}
.girlTag{position:absolute;top:-4px;right:-4px;background:linear-gradient(135deg,#FF5AA8,#FF0A80);font-size:8px;padding:2px 5px;border-radius:10px;font-weight:900;color:#fff}
.msgPreview{flex:1;overflow:hidden}
.reqActions{display:flex;gap:8px;margin-top:6px}
.reqBtn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:0}
.accept{background:#fff;color:#000}.decline{background:#222;color:#fff}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0 20px;z-index:100}
.nav a{width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:20px}.nav a.active{color:#fff}
#chatBox{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;max-width:450px;margin:0 auto}
.chatHeader{padding:12px 14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #222;background:#000}
.chatMsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:72%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:18px;position:relative}
.bubble.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px;font-weight:600}
.bubble.them{align-self:flex-start;background:#1a1a1a;border-bottom-left-radius:4px}
.lockText{font-size:10px;opacity:.5;display:block;margin-top:4px}
.inputRow{padding:10px 12px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;background:#000}
.inputRow input{flex:1;background:#1a1a1a;border:1px solid #222;padding:12px 16px;border-radius:22px;color:#fff;outline:none}
.encBar{padding:8px 14px;background:#0a0a0a;border-bottom:1px solid #222;font-size:11px;color:#0f0;display:flex;gap:6px;align-items:center}
#sosFloat{position:fixed;bottom:80px;right:16px;width:56px;height:56px;background:#FF0A33;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:24px;z-index:999;animation:sosPulse 1.5s infinite;border:2px solid #fff}
#sosFloat.show{display:flex}
@keyframes sosPulse{0%{box-shadow:0 0 0 0 rgba(255,10,51,.7)}70%{box-shadow:0 0 0 12px rgba(255,10,51,0)}100%{box-shadow:0 0 0 0 rgba(255,10,51,0)}}
</style></head><body>
<div class="top"><b style="font-size:20px">pixoro • Messages 🔒</b><span style="font-size:11px;color:#0f0">E2E Encrypted</span></div>
<div class="tabs">
  <div class="tab active" id="tabPrimary" onclick="switchTab('primary')">Primary</div>
  <div class="tab" id="tabRequest" onclick="switchTab('request')">Requests <span class="badgeNum" id="reqCount">3</span></div>
  <div class="tab" id="tabGirls" onclick="switchTab('girls')">Girls Only ♀</div>
</div>
<div class="searchBar">🔍<input id="searchUser" placeholder="Search..." oninput="filterChats()"></div>
<div id="chatList" style="flex:1;overflow-y:auto;padding-bottom:90px"></div>
<div id="sosFloat" onclick="alert('🆘 SOS Sent to trusted!')">🆘</div>
<div class="nav"><a href="index.html">🏠</a><a href="search.html">🔍</a><div style="background:#fff;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900" onclick="location.href='upload.html'">+</div><a href="reels.html">🎬</a><a href="profile.html">👤</a></div>

<div id="chatBox">
  <div class="chatHeader">
    <span onclick="closeChat()" style="font-size:22px;cursor:pointer">←</span>
    <div class="pfpWrap" style="width:36px;height:36px"><img id="chatPfp" src=""></div>
    <div style="flex:1"><b id="chatName" style="font-size:15px"></b><br><small style="color:#0f0;font-size:11px">🔒 Only you 2 can see • Encrypted</small></div>
    <span onclick="blockUser()" style="font-size:18px;cursor:pointer">🚫</span>
  </div>
  <div class="encBar">🔒 End-to-end encrypted • Only you and <span id="encName">her</span> can read • No one else can see • Screenshot alert ON 🛡️</div>
  <div class="chatMsgs" id="chatMsgs"></div>
  <div class="inputRow"><span>😊</span><input id="msgInput" placeholder="Message... 🔒 private" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()" style="background:#fff;color:#000;border:0;width:38px;height:38px;border-radius:50%;font-weight:900">↑</button></div>
</div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let currentTab='primary', currentChat=null
let primaryChats=[
  {username:'Anu_Sweetie', name:'Anu ♀', img:'https://i.pravatar.cc/100?img=5', last:'Only we can see this da 🔒', time:'2m', girl:true, online:true, type:'primary'},
  {username:'Priya_2007', name:'Priya ♀', img:'https://i.pravatar.cc/100?img=6', last:'Thanks da safe ah irukku 💖', time:'10m', girl:true, online:true, type:'primary'},
]
let requestChats=[
  {username:'Rahul_Boy', name:'Rahul', img:'https://i.pravatar.cc/100?img=15', last:'Hi da, follow pannalama? 🙏', time:'5m', girl:false, online:false, type:'request'},
  {username:'Arjun_99', name:'Arjun', img:'https://i.pravatar.cc/100?img=20', last:'Hey! Your posts semma! 🔥', time:'1h', girl:false, online:true, type:'request'},
  {username:'Vijay_King', name:'Vijay', img:'https://i.pravatar.cc/100?img=30', last:'Hi, can we chat?', time:'2h', girl:false, online:false, type:'request'},
]
let girlsOnly=[
  {username:'Anu_Sweetie', name:'Anu ♀', img:'https://i.pravatar.cc/100?img=5', last:'Girl to girl chat 💅', time:'2m', girl:true, online:true, type:'girls'},
  {username:'Priya_2007', name:'Priya ♀', img:'https://i.pravatar.cc/100?img=6', last:'Safe space da 💖', time:'10m', girl:true, online:true, type:'girls'},
]
function getList(){ if(currentTab==='primary') return primaryChats; if(currentTab==='request') return requestChats; return girlsOnly; }
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  renderChats(getList());
}
function renderChats(list){
  document.getElementById('chatList').innerHTML=list.map(c=>`
  <div class="chatItem ${c.type==='request'?'request':''}" onclick="openChat('${c.username}','${c.name}','${c.img}','${c.type}')">
    <div class="pfpWrap ${c.type==='request'?'requestRing':''}"><img src="${c.img}">${c.online?'<div class="onlineDot"></div>':''}${c.girl?'<div class="girlTag">♀</div>':''}</div>
    <div class="msgPreview" style="flex:1">
      <b style="font-size:14px">${c.name} ${c.type==='request'?'<span style="color:#FF5AA8;font-size:10px">• WANTS TO MESSAGE</span>':''}</b>
      <p style="font-size:13px;color:#777;margin-top:2px">${c.type==='request'?'🔒 Private request: ':''}${c.last}</p>
      ${c.type==='request'?`<div class="reqActions"><button class="reqBtn accept" onclick="event.stopPropagation();acceptReq('${c.username}')">Accept ✅</button><button class="reqBtn decline" onclick="event.stopPropagation();declineReq('${c.username}')">Decline ❌</button></div>`:''}
    </div>
    <div style="font-size:11px;color:#555">${c.time}</div>
  </div>`).join('') || '<p style="text-align:center;padding:40px;color:#555">No messages da!</p>';
  document.getElementById('reqCount').innerText=requestChats.length;
}
function filterChats(){ let q=document.getElementById('searchUser').value.toLowerCase(); renderChats(getList().filter(c=>c.name.toLowerCase().includes(q))); }
function openChat(username,name,img,type){
  if(type==='request'){ if(!confirm(name+' wants to message you da! Accept pannava? Rendu perum mattum paarkalam 🔒')) return; }
  currentChat=username; document.getElementById('chatBox').style.display='flex'; document.getElementById('chatName').innerText=name; document.getElementById('chatPfp').src=img; document.getElementById('encName').innerText=name; loadMessages();
}
function closeChat(){document.getElementById('chatBox').style.display='none'; currentChat=null;}
function loadMessages(){
  let key='pixoro_dm_'+ME+'_'+currentChat;
  let msgs=JSON.parse(localStorage.getItem(key)||'[]');
  if(msgs.length===0) msgs=[{me:false,text:'Hi da! 🔒 This chat is private - only you and me can see da! 🛡️'}];
  document.getElementById('chatMsgs').innerHTML=msgs.map(m=>`<div class="bubble ${m.me?'me':'them'}">${m.text}<span class="lockText">🔒 only 2 can see • ${new Date().toLocaleTimeString().slice(0,5)} ${m.me?'✓✓':''}</span></div>`).join('');
  document.getElementById('chatMsgs').scrollTop=99999;
}
function sendMsg(){
  let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t||!currentChat) return;
  let key='pixoro_dm_'+ME+'_'+currentChat;
  let arr=JSON.parse(localStorage.getItem(key)||'[]'); arr.push({me:true,text:t}); localStorage.setItem(key,JSON.stringify(arr)); inp.value=''; loadMessages();
}
function acceptReq(username){
  let idx=requestChats.findIndex(c=>c.username===username);
  if(idx>-1){ primaryChats.unshift({...requestChats[idx], type:'primary'}); requestChats.splice(idx,1); alert('✅ Accepted da! Ipo rendu perum mattum chat pannalam 🔒'); renderChats(getList()); }
}
function declineReq(username){ requestChats=requestChats.filter(c=>c.username!==username); renderChats(getList()); }
function blockUser(){ if(confirm('Block pannava?')){ if(currentChat){ requestChats=requestChats.filter(c=>c.username!==currentChat); primaryChats=primaryChats.filter(c=>c.username!==currentChat); closeChat(); renderChats(getList()); } alert('✅ Blocked! Safe da! 🛡️'); } }
renderChats(primaryChats);
if(localStorage.getItem('pixoro_sos_on')==='true') document.getElementById('sosFloat').classList.add('show');
</script>
</body></html>
