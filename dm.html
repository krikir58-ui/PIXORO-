<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro Private DM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
.top{padding:12px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a;background:#000;position:sticky;top:0;z-index:10}
.top img{width:36px;height:36px;border-radius:50%;border:2px solid #00ff66}
.list{flex:1;overflow-y:auto}.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:12px 16px;border-radius:20px;font-size:14px;word-break:break-word;position:relative}
.me{align-self:flex-end;background:linear-gradient(135deg,#00ff66,#00ccff);color:#000;font-weight:600;border-bottom-right-radius:6px;cursor:pointer}
.other{align-self:flex-start;background:#1e1e1e;color:#fff;border-bottom-left-radius:6px;cursor:pointer}
.bottom{padding:10px;display:flex;gap:8px;border-top:1px solid #1a1a1a;background:#000}
.bottom input{flex:1;background:#111;border:1px solid #222;padding:13px 18px;border-radius:25px;color:#fff;outline:none}
.bottom button{width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer;background:linear-gradient(135deg,#00ff66,#00ccff)}
.userRow{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid #0f0f0f;cursor:pointer}
.callBox{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.callBox.active{display:flex}
.vid{width:100%;height:50%;background:#0a0a0a;object-fit:cover}
.delBox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.delBox.active{display:flex}.box{background:#111;border:1px solid #222;border-radius:20px;padding:20px;width:100%;max-width:320px;text-align:center}
</style></head><body>
<div class="top">
<i class="fa fa-arrow-left" onclick="goBack()" style="cursor:pointer"></i>
<img id="topPic" src="https://i.pravatar.cc/100?u=chat"><div style="flex:1"><b id="topName">Private Chats</b><div style="font-size:10px;color:#00ff66"><i class="fa fa-lock"></i> Real • Private • Only your chats</div></div>
<div style="display:flex;gap:8px" id="chatActions" >
<i class="fa fa-phone" onclick="startCall(false)" style="background:#1a1a1a;padding:10px;border-radius:50%;cursor:pointer;color:#00ff66"></i>
<i class="fa fa-video" onclick="startCall(true)" style="background:linear-gradient(135deg,#00ff66,#00ccff);padding:10px;border-radius:50%;cursor:pointer;color:#000"></i>
</div>
</div>

<div class="list" id="userList"></div>
<div class="chat" id="chatBox" style="display:none"></div>

<div class="bottom" id="sendBar" style="display:none">
<input id="msgInput" placeholder="Private message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()"><i class="fa fa-paper-plane"></i></button>
</div>

<div class="delBox" id="delBox"><div class="box">
<i class="fa fa-trash" style="font-size:40px;color:#ff3b30;margin-bottom:12px"></i>
<h3>Delete for Everyone?</h3>
<p style="font-size:12px;color:#888;margin:10px 0">Un message mattum than delete pannalam!<br>Rendu perukkum poayidum!</p>
<div style="display:flex;gap:10px;margin-top:16px">
<button onclick="closeDel()" style="flex:1;padding:12px;background:#222;border:none;border-radius:12px;color:#fff">Cancel</button>
<button onclick="confirmDel()" style="flex:1;padding:12px;background:#ff3b30;border:none;border-radius:12px;color:#fff;font-weight:700">Delete</button>
</div>
</div></div>

<div class="callBox" id="callBox">
<video id="remoteVid" class="vid" autoplay playsinline></video>
<video id="localVid" class="vid" autoplay muted playsinline style="height:28%;width:36%;position:absolute;top:18px;right:18px;border-radius:18px;border:2px solid #00ff66;z-index:5"></video>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h2 id="callName">@User</h2><p id="callStatus" style="color:#00ff66;margin-top:6px">🔒 Pixoro Private Call - Encrypted</p>
<div style="margin-top:8px;background:#111;padding:6px 12px;border-radius:20px;font-size:11px;color:#888"><i class="fa fa-lock"></i> Only you two can hear</div>
</div>
<div style="display:flex;gap:20px;justify-content:center;padding:30px">
<button onclick="endCall()" style="background:#ff3b30;width:64px;height:64px;border-radius:50%;border:none;color:#fff;font-size:24px"><i class="fa fa-phone" style="transform:rotate(135deg)"></i></button>
<button onclick="toggleMute()" id="muteBtn" style="background:#222;width:56px;height:56px;border-radius:50%;border:none;color:#fff"><i class="fa fa-microphone"></i></button>
<button onclick="toggleCam()" id="camBtn" style="background:#222;width:56px;height:56px;border-radius:50%;border:none;color:#fff"><i class="fa fa-video"></i></button>
</div>
</div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let CHAT_USER=new URLSearchParams(location.search).get('user')
let pendingDelId=null, localStream=null, isMute=false, isCamOff=false

// ONLY REAL CHATS - yarukku msg panniyo avanga mattum varuvanga
async function loadUsers(){
 let {data:msgs}=await supa.from('messages').select('sender,receiver').or(`sender.eq.${ME},receiver.eq.${ME}`).eq('is_deleted',false)
 let partners=new Set()
 if(msgs){ msgs.forEach(m=>{ if(m.sender!==ME) partners.add(m.sender); if(m.receiver!==ME) partners.add(m.receiver) }) }
 let list=[...partners]
 // If URL la user iruntha avanayum add pannu
 if(CHAT_USER) list=[...new Set([...list,CHAT_USER])]

 let userListEl=document.getElementById('userList')
 if(list.length==0){
   userListEl.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#555"><i class="fa fa-lock" style="font-size:50px;color:#00ff66;margin-bottom:15px"></i><h3 style="color:#fff">No Private Chats Yet</h3><p style="font-size:12px;margin-top:8px;line-height:1.5">Nee yaarukku msg pannalai da!<br>Search la poi yaarukkum msg pannu,<br>aprom inga varum - 100% private!</p><button onclick="location.href='search.html'" style="margin-top:16px;padding:10px 18px;background:linear-gradient(135deg,#00ff66,#00ccff);border:none;border-radius:20px;font-weight:700;color:#000">Search People</button></div>`
   return
 }
 // Get last message for each partner
 let html=''
 for(let u of list){
   let {data:last}=await supa.from('messages').select('message,created_at').or(`and(sender.eq.${ME},receiver.eq.${u}),and(sender.eq.${u},receiver.eq.${ME})`).eq('is_deleted',false).order('created_at',{ascending:false}).limit(1)
   let lastMsg=last&&last[0]?last[0].message.substring(0,28):'Tap to open private chat'
   let time=last&&last[0]?new Date(last[0].created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''
   html+=`<div class="userRow" onclick="openChat('${u}')"><img src="https://i.pravatar.cc/100?u=${u}" style="width:50px;height:50px;border-radius:50%;border:2px solid #111"><div style="flex:1"><b>@${u}</b><div style="font-size:12px;color:#888">${lastMsg} 🔒</div></div><div style="text-align:right"><div style="font-size:10px;color:#666">${time}</div><div style="width:10px;height:10px;background:#00ff66;border-radius:50%;margin-top:6px;margin-left:auto"></div></div></div>`
 }
 userListEl.innerHTML=html
 if(CHAT_USER) openChat(CHAT_USER)
}
function openChat(u){CHAT_USER=u;document.getElementById('topName').innerText='@'+u;document.getElementById('topPic').src=`https://i.pravatar.cc/100?u=${u}`;document.getElementById('userList').style.display='none';document.getElementById('chatBox').style.display='flex';document.getElementById('sendBar').style.display='flex';loadMsgs();setInterval(loadMsgs,2000)}
function goBack(){if(document.getElementById('chatBox').style.display!=='none'){document.getElementById('userList').style.display='block';document.getElementById('chatBox').style.display='none';document.getElementById('sendBar').style.display='none';CHAT_USER=null;document.getElementById('topName').innerText='Private Chats';loadUsers()}else location.href='./index.html'}
async function loadMsgs(){
 if(!CHAT_USER) return
 let {data}=await supa.from('messages').select('*').or(`and(sender.eq.${ME},receiver.eq.${CHAT_USER}),and(sender.eq.${CHAT_USER},receiver.eq.${ME})`).eq('is_deleted',false).order('created_at',{ascending:true})
 let box=document.getElementById('chatBox')
 if(!data||!data.length){box.innerHTML=`<div style="text-align:center;padding:50px 20px;color:#555"><i class="fa fa-lock" style="font-size:44px;color:#00ff66"></i><p style="margin-top:12px;font-weight:700;color:#fff">Private Chat with @${CHAT_USER}</p><p style="font-size:11px;margin-top:8px">🔒 Real private<br>• Un msg ah nee mattum delete pannalam<br>• Avanga msg ah avanga mattum<br>• Rendu perukkum delete aagum</p></div>`;return}
 box.innerHTML=data.map(m=>`<div class="msg ${m.sender===ME?'me':'other'}" onclick="tryDelete(${m.id},'${m.sender}')"><div>${m.message}</div><div style="font-size:8px;opacity:.6;margin-top:4px">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${m.sender===ME?'✓✓':''}</div></div>`).join('')
 box.scrollTop=box.scrollHeight
}
async function send(){let t=document.getElementById('msgInput').value.trim();if(!t||!CHAT_USER) return;document.getElementById('msgInput').value='';await supa.from('messages').insert({sender:ME,receiver:CHAT_USER,message:t});loadMsgs();loadUsers()}
function tryDelete(id,sender){
 if(sender!==ME){ alert('🚫 Ithu un message illa da!\nAvanga message ah avanga mattum delete pannalam 🔒'); return }
 pendingDelId=id; document.getElementById('delBox').classList.add('active')
}
function closeDel(){document.getElementById('delBox').classList.remove('active');pendingDelId=null}
async function confirmDel(){ if(!pendingDelId) return; await supa.from('messages').update({is_deleted:true}).eq('id',pendingDelId); closeDel(); loadMsgs(); loadUsers() }

// REAL CALL - Camera Mic real ah work aagum
async function startCall(video){
 document.getElementById('callBox').classList.add('active')
 document.getElementById('callName').innerText='@'+CHAT_USER
 document.getElementById('callStatus').innerText=video?'📹 Calling...':'📞 Calling...'
 try{
   localStream=await navigator.mediaDevices.getUserMedia({video:video,audio:true})
   document.getElementById('localVid').srcObject=localStream
   document.getElementById('remoteVid').srcObject=localStream
   document.getElementById('callStatus').innerText=video?'📹 Private Video Call - Connected 🔒':'📞 Private Voice Call - Connected 🔒'
   // Save call log
   await supa.from('calls').insert({caller:ME,receiver:CHAT_USER,type:video?'video':'audio',status:'connected'})
 }catch(e){ document.getElementById('callStatus').innerText='Permission kudu da: '+e.message }
}
function endCall(){document.getElementById('callBox').classList.remove('active');if(localStream) localStream.getTracks().forEach(t=>t.stop())}
function toggleMute(){isMute=!isMute;if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!isMute);document.getElementById('muteBtn').innerHTML=isMute?'<i class="fa fa-microphone-slash"></i>':'<i class="fa fa-microphone"></i>'}
function toggleCam(){isCamOff=!isCamOff;if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=!isCamOff);document.getElementById('camBtn').style.background=isCamOff?'#ff3b30':'#222'}

loadUsers()
</script></body></html>
