<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PIXORO - Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js?v=greenfix"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:76px}
.logo{font-size:26px;font-weight:900;letter-spacing:.5px;color:#fff}
.logo span{background:linear-gradient(90deg,#FF4D8D,#FF8A00,#8A7CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{background:#000;padding:14px 14px 8px;position:sticky;top:0;z-index:50}
.topRow{display:flex;justify-content:space-between;align-items:center}
.topIco{font-size:22px;margin-left:14px;cursor:pointer;color:#fff}
.searchBar{margin:10px 12px;background:#1F1F1F;border:1px solid #2A2A2A;border-radius:24px;padding:12px 14px;display:flex;gap:8px;align-items:center}
.searchBar input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:15px}
.searchBar input::placeholder{color:#888}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:20px;background:#1F1F1F;color:#aaa;font-size:13px;font-weight:700;border:0;cursor:pointer}
.tab.on{background:#FF4D8D;color:#fff}
.tab small{background:#fff;color:#FF4D8D;border-radius:10px;padding:0 5px;margin-left:4px;font-size:11px}
.onlineRow{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}.onlineRow::-webkit-scrollbar{display:none}
.onItem{flex:0 0 58px;text-align:center;cursor:pointer}
.onAva{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF4D8D,#8A7CFF);padding:2.5px;position:relative;margin:0 auto}
.onAva.off{background:#333!important}
.onAvaIn{width:100%;height:100%;border-radius:50%;background:#000;display:grid;place-items:center;border:2px solid #000;overflow:hidden}
.onAvaIn img{width:100%;height:100%;object-fit:cover}
.onDot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;background:#22C55E;border:2.5px solid #000;border-radius:50%}
.notes{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 62px;text-align:center;cursor:pointer;position:relative}
.nRing{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FF4D8D,#8A7CFF,#FF8A00);padding:2.5px;position:relative}
.nRingInner{width:100%;height:100%;border-radius:50%;background:#000;overflow:visible;display:grid;place-items:center;border:2px solid #000}
.noteBubble{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-size:9px;padding:3px 6px;border-radius:12px;white-space:nowrap;font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.noteInput{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;border:1px solid #FF4D8D;padding:20px;border-radius:20px;z-index:999;display:none;width:85%;max-width:360px}.noteInput input{width:100%;padding:12px;border-radius:12px;border:0;background:#1F1F1F;color:#fff;outline:none;margin:10px 0}
.chatRow{display:flex;gap:12px;padding:12px;align-items:center;cursor:pointer;width:calc(100% - 20px)!important;margin:0 10px 8px!important;background:#141414!important;border:1px solid #222!important;border-radius:18px!important;box-shadow:0 4px 14px rgba(255,77,141,.08)}
.chatRow:active{background:#1F1F1F!important;transform:scale(.98)}
.avaWrap{width:52px;height:52px;flex:0 0 52px;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#FF4D8D,#8A7CFF);border-radius:50%;padding:2.5px}
.avaWrap.off{background:#333!important}
.ava{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#222;border:2px solid #000}
.avaLetter{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#FF4D8D,#8A7CFF)!important;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;border:2px solid #000}
.avaLetter.off{background:#333!important}
.avaSmall{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;background:#222;border:2px solid #000}
.avaLetterSmall{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF4D8D,#8A7CFF)!important;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;border:2px solid #000}
.onlineDot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;background:#22C55E;border:2.5px solid #000;border-radius:50%;z-index:2}
.chatMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chatTopRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatName{font-size:16px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.chatTime{font-size:11px;color:#888;flex-shrink:0}
.chatPrevRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatPrev{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.chatPrev b{color:#fff}
.unreadBadge{background:linear-gradient(135deg,#FF4D8D,#FF2E63);color:#fff;font-size:11px;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px;font-weight:800;flex-shrink:0;box-shadow:0 2px 8px rgba(255,77,141,.5)}
.unreadBadge.grey{background:#444;box-shadow:none}
.tick{letter-spacing:-1px}.tick.blue{color:#FF4D8D}.tick.grey{color:#888}
.actionSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#111;border:1px solid #FF4D8D;border-radius:22px 22px 0 0;padding:18px;z-index:1000;display:none}.actionSheet button{width:100%;padding:13px;border:0;background:#1F1F1F;color:#fff;border-radius:14px;margin:5px 0;text-align:left;font-size:15px;font-weight:600}
.bottom-nav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;max-width:450px!important;margin:0 auto!important;width:100%!important;height:64px!important;background:#000!important;border-top:1px solid #222!important;display:flex!important;justify-content:space-around!important;align-items:center!important;z-index:100!important}
.bottom-nav a{display:flex!important;flex-direction:column!important;align-items:center!important;gap:2px!important;text-decoration:none!important;color:#888!important;position:relative!important}
.bottom-nav a.active{color:#fff!important}
.bottom-nav a.active span{color:#fff!important;font-weight:800!important}
.bottom-nav span{font-size:11px!important;color:#888!important}
.bottom-nav a img.navPfp{width:26px!important;height:26px!important;border-radius:50%!important;object-fit:cover!important;background:#222;border:2px solid #FF4D8D!important}
.navBadge{position:absolute;top:-4px;right:8px;background:#FF4D8D;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:78px;right:14px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF4D8D,#FF2E63);display:grid;place-items:center;font-size:22px;z-index:90;cursor:pointer;color:#fff;box-shadow:0 6px 18px rgba(255,77,141,.5)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#FF4D8D;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none;white-space:nowrap}
#dmSettingSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#111;border:1px solid #FF4D8D;border-radius:22px 22px 0 0;padding:18px;z-index:1001;display:none;max-height:85vh;overflow-y:auto;color:#fff}
.setRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;background:#1F1F1F;border-radius:14px;margin-top:10px;font-size:14px;font-weight:600;color:#fff}
.setRow input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:48px!important;height:28px!important;min-width:48px;border-radius:20px;background:#333!important;position:relative;cursor:pointer;flex-shrink:0;margin:0}
.setRow input[type="checkbox"]:checked{background:linear-gradient(90deg,#FF4D8D,#8A7CFF)!important}
.setRow input[type="checkbox"]::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.setRow input[type="checkbox"]:checked::after{left:23px}
.setRow select{border:0;background:#222;padding:8px;border-radius:8px;font-weight:700;color:#fff}
.blockRow{display:flex;gap:12px;padding:12px;align-items:center;width:calc(100% - 20px);margin:0 10px 8px;background:#141414;border:1px solid #222;border-radius:18px}
</style></head><body>
<div class="top"><div class="topRow"><div class="logo">PIXOR<span>O</span></div><div><span class="topIco" onclick="document.getElementById('searchInp').focus()">🔍</span><span class="topIco" onclick="document.getElementById('dmSettingSheet').style.display='block'">⋮</span></div></div></div>
<div class="searchBar">🔍 <input id="searchInp" placeholder="Search name / message..." oninput="onSearch(this.value)"></div>
<div class="tabs" id="tabs"><button class="tab on" onclick="setTab('all',this)">All</button><button class="tab" onclick="setTab('unread',this)">Unread</button><button class="tab" onclick="setTab('requests',this)">Requests <small id="reqCount" style="display:none">0</small></button><button class="tab" onclick="setTab('archived',this)">Archived</button><button class="tab" onclick="setTab('blocked',this)">Blocked <small id="blkCount" style="display:none">0</small></button></div>
<div id="onlineBox"><div style="padding:4px 12px;font-size:13px;font-weight:800;color:#22C55E">● Online Now</div><div class="onlineRow" id="onlineRow"></div></div>
<div class="notes" id="notes"></div>
<div id="list" style="text-align:center;color:#888;padding:10px">Loading...</div>
<div class="fab" onclick="location.href='search.html'">✏️</div>
<div class="toast" id="toast"></div>
<div class="noteInput" id="notePop"><h3 style="color:#fff">✏️ Add Note</h3><input id="noteText" placeholder="Yedhachum Yosichiya da...?" maxlength="60"><div style="display:flex;gap:10px"><button onclick="saveNote()" style="flex:1;background:#FF4D8D;color:#fff;border:0;padding:11px;border-radius:20px;font-weight:700">Share</button><button onclick="document.getElementById('notePop').style.display='none'" style="flex:1;background:#1F1F1F;color:#fff;border:0;padding:11px;border-radius:20px">Cancel</button></div></div>
<div class="actionSheet" id="sheet"><b id="sheetName" style="color:#fff;font-size:17px">Chat</b><div id="sheetStatus" style="font-size:12px;color:#22C55E;margin:4px 0 8px"></div><button onclick="doPin()">📌 Pin / Unpin</button><button onclick="doMute()">🔕 Mute / Unmute</button><button onclick="doArchive()">🗄️ Archive</button><button onclick="doBlockFromSheet()" style="color:#FF6B6B;background:#2A1215">🚫 Block User</button><button onclick="doDeleteChatOnly()">🗑️ Delete Chat Mattum - List la Poidum</button><button onclick="doDeleteAll()" style="color:#FF6B6B;background:#2A1215">🗑️ Delete Ella Message um</button><button onclick="document.getElementById('sheet').style.display='none'" style="text-align:center">Cancel</button></div>
<div id="dmSettingSheet"><b style="font-size:17px">DM Settings - MASS</b><p style="font-size:12px;color:#888;margin:6px 0 12px">DM Chat Nitta Iruka Num Pakka - Ellam Inga thaan da</p><b>Privacy</b><label class="setRow">Active Now - Online Kaatu - Online na Mattum 🟢 <input type="checkbox" id="setActive" checked onchange="saveDMSetting('active',this.checked)"></label><label class="setRow">Typing... - Type Panna Kaatu <input type="checkbox" id="setTyping" checked onchange="saveDMSetting('typing',this.checked)"></label><label class="setRow">Seen - Paathen nu Kaatu - ✓✓ <input type="checkbox" id="setSeen" checked onchange="saveDMSetting('seen',this.checked)"></label><label class="setRow">Show Last Seen <input type="checkbox" id="setShowLastSeen" checked onchange="saveDMSetting('showLastSeen',this.checked)"></label><label class="setRow">Allow Messages <select id="setAllow" onchange="saveDMSetting('allow',this.value)"><option value="everyone">Everyone - Allow</option><option value="following">Following Only</option><option value="none">No One - Not Allow</option></select></label><button onclick="document.getElementById('dmSettingSheet').style.display='none'" style="width:100%;margin-top:14px;padding:12px;background:#FF4D8D;border:0;border-radius:14px;color:#fff;font-weight:800">Close</button></div>
<div class="bottom-nav"><a href="index.html"><span style="font-size:22px">⌂</span><span>Home</span></a><a href="search.html"><span style="font-size:21px">🔍</span><span>Search</span></a><a href="reels.html"><span style="font-size:21px">▶️</span><span>Reels</span></a><a href="dm.html" class="active"><span style="font-size:21px">💬</span><span>DM</span><span class="navBadge" id="navTotal" style="display:none">0</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa, ME_RAW='', ME_ID='', profileMap={}, profileById={}, CUR_TAB='all', ALL_CHATS=[], NOTES_MAP={}, SEARCH_Q='', UNREAD_MAP={}, SHEET_USER='', SHEET_UNAME='', PINNED=[], MUTED=[], ARCHIVED=[], BLOCKED=[];
let DM_ACTIVE=true, DM_TYPING=true, DM_SEEN=true, DM_ALLOW='everyone', SHOW_LASTSEEN=true;
function setTab(t,btn){ CUR_TAB=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on'); render(); }
function saveDMSetting(k,v){ if(k==='active') DM_ACTIVE=v; if(k==='typing') DM_TYPING=v; if(k==='seen') DM_SEEN=v; if(k==='allow') DM_ALLOW=v; if(k==='showLastSeen') SHOW_LASTSEEN=v; showToast('Setting Saved da ✨'); setTimeout(()=>{ document.getElementById('dmSettingSheet').style.display='none'; },400); render(); }
function loadDMSettings(){ let a=document.getElementById('setActive'); if(a) a.checked = DM_ACTIVE; let ty=document.getElementById('setTyping'); if(ty) ty.checked = DM_TYPING; let s=document.getElementById('setSeen'); if(s) s.checked = DM_SEEN; let al=document.getElementById('setAllow'); if(al) al.value = DM_ALLOW; let ls=document.getElementById('setShowLastSeen'); if(ls) ls.checked=SHOW_LASTSEEN; }
loadDMSettings();
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
function letterFor(u){ let l=(cleanUser(u||'P').charAt(0).toUpperCase()||'P'); return /[A-Z]/.test(l)?l:'P'; }
function showToast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
function realPfp(u){ let p=profileMap[cleanUser(u)]||profileById[u]; let url=p?.avatar_url||p?.profile_pic||''; if(url && !url.includes('ui-avatars')) return url; return ''; }
function avatarHtml(u, size, isOnline){ let url=realPfp(u); let L=letterFor(u); let cls = size==='small' ? 'avaSmall' : 'ava'; let lcls = size==='small' ? 'avaLetterSmall' : 'avaLetter'; if(isOnline===false) lcls+=' off'; if(url) return `<img class="${cls}" src="${url}" onerror="this.outerHTML='<div class=&quot;${lcls}&quot;>${L}</div>'">`; return `<div class="${lcls}">${L}</div>`; }
function fmtTime(t){ let d=new Date(t); let now=new Date(); if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); let y=new Date(); y.setDate(now.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], {day:'numeric',month:'short'}); }
function lastSeenText(p){ if(!p) return 'Offline'; if(p.is_online) return '● Online'; if(!SHOW_LASTSEEN) return 'Offline'; if(!p.last_seen) return 'Offline'; let d=new Date(p.last_seen); let now=new Date(); let diff=Math.floor((now-d)/1000); if(diff<60) return 'Active just now'; if(diff<3600) return 'Active '+Math.floor(diff/60)+'m ago'; if(d.toDateString()===now.toDateString()) return 'Active today '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); let y=new Date(); y.setDate(now.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Active Yesterday '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); return 'Active '+d.toLocaleDateString([], {day:'numeric',month:'short'}); }
async function updatePresence(o){ if(!ME_ID) return; if(!DM_ACTIVE){ o=false; } await supa.from('profiles').update({is_online:o,last_seen:new Date().toISOString()}).eq('id',ME_ID); }
function isMineMsg(m){ return String(m.sender_id)===ME_ID || cleanUser(m.sender)===ME_RAW; }
function otherIdOf(m){ if(isMineMsg(m) && m.receiver_id) return String(m.receiver_id); if(!isMineMsg(m) && m.sender_id) return String(m.sender_id); let name = isMineMsg(m) ? cleanUser(m.receiver) : cleanUser(m.sender); let p = profileMap[name]; return p ? String(p.id) : name; }
function onSearch(v){ SEARCH_Q=v.toLowerCase().trim(); render(); }
let pressTimer=null;
function openSheet(user,uname){ SHEET_USER=user; SHEET_UNAME=uname; document.getElementById('sheetName').innerText='@'+uname; let p=profileById[user]; let st=document.getElementById('sheetStatus'); st.innerText=lastSeenText(p); st.style.color=p?.is_online?'#22C55E':'#888'; document.getElementById('sheet').style.display='block'; }
function doPin(){ let i=PINNED.indexOf(SHEET_USER); if(i>=0) PINNED.splice(i,1); else PINNED.unshift(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doMute(){ let i=MUTED.indexOf(SHEET_USER); if(i>=0) MUTED.splice(i,1); else MUTED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doArchive(){ if(!ARCHIVED.includes(SHEET_USER)) ARCHIVED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doBlockFromSheet(){ if(!confirm(SHEET_UNAME+' ah Block Pannanuma?')) return; if(!confirm('Confirm ah? Inime Message Varaathu da')) return; if(!BLOCKED.includes(SHEET_USER)) BLOCKED.push(SHEET_USER); if(window.pixoroBlockUser) pixoroBlockUser(SHEET_UNAME); ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; showToast('Blocked da'); render(); }
function doUnblock(id,uname){ if(!confirm(uname+' ah Unblock Pannanuma?')) return; BLOCKED=BLOCKED.filter(x=>x!==id); if(window.pixoroUnblockUser) pixoroUnblockUser(uname); showToast('Unblocked da'); render(); }
function doDeleteChatOnly(){ ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; showToast('Chat List la irunthu Delete Panniten - Message Safe da'); render(); }
async function doDeleteAll(){ if(!confirm('Ella Message um Delete Pannanuma?')) return; if(!confirm('Confirm ah? Thirumba Varaathu da')) return; ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; showToast('Ella Message Delete Panniten'); render(); }
async function loadNotes(){ let {data}=await supa.from('notes').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false}); NOTES_MAP={}; (data||[]).forEach(n=>{ NOTES_MAP[cleanUser(n.username)]=n.text; }); let usersWithNote = Object.keys(NOTES_MAP).filter(u=>u!==ME_RAW); let myNote = NOTES_MAP[ME_RAW]; let html=''; html+=`<div class="nItem" onclick="document.getElementById('notePop').style.display='block'"><div class="nRing"><div class="nRingInner">${avatarHtml(ME_RAW,'small',true)}${myNote?`<div class="noteBubble">${myNote}</div>`:''}</div></div><div style="font-size:10px;margin-top:4px;color:#aaa">Your note</div></div>`; html+=usersWithNote.slice(0,10).map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="nRing"><div class="nRingInner">${avatarHtml(u,'small',true)}<div class="noteBubble">${NOTES_MAP[u]}</div></div></div><div style="font-size:10px;margin-top:4px;color:#aaa">${u}</div></div>`).join(''); document.getElementById('notes').style.display = (myNote || usersWithNote.length) ? 'flex' : 'none'; document.getElementById('notes').innerHTML=html; }
async function saveNote(){ let t=document.getElementById('noteText').value.trim(); if(!t) return; let exp=new Date(); exp.setHours(exp.getHours()+24); await supa.from('notes').delete().eq('username',ME_RAW); await supa.from('notes').insert({user_id:ME_ID,username:ME_RAW,text:t,expires_at:exp.toISOString()}); document.getElementById('notePop').style.display='none'; loadNotes(); }
function renderOnline(){ let online = Object.values(profileMap).filter(p=>p.is_online && cleanUser(p.username)!==ME_RAW).slice(0,12); let box=document.getElementById('onlineBox'); if(!online.length){ box.style.display='none'; return; } box.style.display='block'; document.getElementById('onlineRow').innerHTML=online.map(p=>{ let u=cleanUser(p.username); return `<div class="onItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="onAva"><div class="onAvaIn">${avatarHtml(u,'small',true)}</div><span class="onDot"></span></div><div style="font-size:11px;margin-top:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u}</div><div style="font-size:10px;color:#22C55E;font-weight:700">Online</div></div>` }).join(''); }
function render(){
  renderOnline();
  let reqs = ALL_CHATS.filter(c=>c.threadType==='requests' && !BLOCKED.includes(c.other));
  let rc=document.getElementById('reqCount'); if(reqs.length){ rc.style.display='inline'; rc.textContent=reqs.length; } else rc.style.display='none';
  let bc=document.getElementById('blkCount'); if(BLOCKED.length){ bc.style.display='inline'; bc.textContent=BLOCKED.length; } else bc.style.display='none';
  if(CUR_TAB==='blocked'){
    if(!BLOCKED.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#888">No Blocked Users da<br>Yaarayum Block Pannala da ✨</div>`; return; }
    document.getElementById('list').innerHTML=BLOCKED.map(id=>{ let uname=profileById[id]?.username||id; let cu=cleanUser(uname); let isOn=!!profileById[id]?.is_online; return `<div class="blockRow"><div class="avaWrap ${isOn?'':'off'}">${avatarHtml(cu,'',isOn)}${isOn?`<span class="onlineDot"></span>`:``}</div><div style="flex:1"><b style="color:#fff">${cu}</b><div style="font-size:12px;color:#888">Blocked - Message Varaathu</div></div><button onclick="doUnblock('${id}','${cu}')" style="background:#FF4D8D;color:#fff;border:0;padding:8px 16px;border-radius:20px;font-weight:700">Unblock</button></div>` }).join(''); return;
  }
  let list=ALL_CHATS.filter(c=>!ARCHIVED.includes(c.other) && !BLOCKED.includes(c.other));
  if(CUR_TAB==='unread') list=list.filter(c=>(UNREAD_MAP[c.other]||0)>0);
  if(CUR_TAB==='requests') list=reqs;
  if(CUR_TAB==='archived') list=ALL_CHATS.filter(c=>ARCHIVED.includes(c.other));
  if(SEARCH_Q) list=list.filter(c=>{ let n=(profileById[c.other]?.username||c.other||'').toLowerCase(); return n.includes(SEARCH_Q)||c.preview.toLowerCase().includes(SEARCH_Q); });
  list.sort((a,b)=>{ let pa=PINNED.includes(a.other)?1:0, pb=PINNED.includes(b.other)?1:0; if(pa!==pb) return pb-pa; return new Date(b.msg.created_at)-new Date(a.msg.created_at); });
  if(CUR_TAB==='requests' && !list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#888">No Requests da ✨<br>Puthu Yarum Message Pannala da</div>`; return; }
  if(CUR_TAB==='archived' && !list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#888">No Archived Chats da</div>`; return; }
  if(!list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#888">No chats da<br><button onclick="location.href='search.html'" style="margin-top:12px;background:#FF4D8D;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`; return; }
  let totalUnread = Object.values(UNREAD_MAP).reduce((a,b)=>a+b,0);
  let nav=document.getElementById('navTotal'); if(totalUnread){ nav.style.display='grid'; nav.textContent=totalUnread>99?'99+':totalUnread; } else nav.style.display='none';
  let seenOff = !DM_SEEN;
  document.getElementById('list').innerHTML=list.map(c=>{
    let uname=profileById[c.other]?.username||c.other; let uc=UNREAD_MAP[c.other]||0; let badge=uc?`<span class="unreadBadge ${MUTED.includes(c.other)?'grey':''}">${uc>99?'99+':uc}</span>`:``; let isPin=PINNED.includes(c.other); let isMute=MUTED.includes(c.other);
    let isMine=isMineMsg(c.msg);
    let tick = seenOff ? '' : (isMine?`<span class="tick ${c.msg.seen?'blue':'grey'}">${c.msg.seen?'✓✓':'✓'}</span> `:'');
    let p=profileById[c.other]; let isOn=!!p?.is_online;
    let statusTxt = isOn ? `<span style="color:#22C55E;font-size:11px">● Online</span>` : ``;
    let reqBtn = CUR_TAB==='requests' ? `<div style="display:flex;gap:8px;margin-top:6px"><button onclick="event.stopPropagation();location.href='chat.html?user=${encodeURIComponent(cleanUser(uname))}'" style="flex:1;background:#FF4D8D;color:#fff;border:0;padding:7px;border-radius:16px;font-weight:700">Accept</button><button onclick="event.stopPropagation();doBlockFromSheet2('${c.other}','${cleanUser(uname)}')" style="flex:1;background:#1F1F1F;color:#fff;border:0;padding:7px;border-radius:16px">Decline</button></div>` : '';
    return `<div class="chatRow" onmousedown="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" onmouseup="clearTimeout(pressTimer)" ontouchstart="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" ontouchend="clearTimeout(pressTimer)"><div class="avaWrap ${isOn?'':'off'}">${avatarHtml(cleanUser(uname),'',isOn)}${isOn?`<span class="onlineDot"></span>`:``}</div><div class="chatMain" onclick="location.href='chat.html?user=${encodeURIComponent(cleanUser(uname))}'"><div class="chatTopRow"><span class="chatName">${isPin?'📌 ':''}${cleanUser(uname)} ${isMute?'🔕':''}</span><span class="chatTime">${fmtTime(c.msg.created_at)}</span></div><div class="chatPrevRow"><span class="chatPrev">${tick}${c.preview}</span>${badge}</div>${statusTxt}${reqBtn}</div></div>`
  }).join('');
}
function doBlockFromSheet2(id,uname){ if(!BLOCKED.includes(id)) BLOCKED.push(id); ALL_CHATS=ALL_CHATS.filter(c=>c.other!==id); showToast('Declined + Blocked'); render(); }
async function init(){
  if(!window.supa){setTimeout(init,300);return} supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id; let {data:my}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME_RAW=cleanUser(my?.username||session.user.email.split('@')[0]); let navPfp=document.getElementById('navPfp'); if(navPfp && my?.avatar_url) navPfp.src=my.avatar_url; else if(navPfp) navPfp.style.display='none';
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileById[p.id]=p});
  updatePresence(true); setInterval(()=>updatePresence(true),30000); loadNotes(); load();
  supa.channel('dm-list').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe();
  supa.channel('presence-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},()=>{ load(); }).subscribe();
  supa.channel('notes-live').on('postgres_changes',{event:'*',schema:'public',table:'notes'},()=>loadNotes()).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) updatePresence(false); else updatePresence(true); });
}
async function load(){
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileById[p.id]=p});
  let {data}=await supa.from('messages').select('*').order('created_at',{ascending:false}).limit(300); if(!data) data=[];
  UNREAD_MAP={}; data.forEach(m=>{ if(!isMineMsg(m) && !m.seen){ let oid=otherIdOf(m); UNREAD_MAP[oid]=(UNREAD_MAP[oid]||0)+1; } });
  let map={}; data.forEach(m=>{ let oid=otherIdOf(m); if(!oid || cleanUser(oid)===ME_RAW) return; if(!profileMap[cleanUser(oid)] && !profileById[oid]) return; if(!map[oid] || new Date(m.created_at)>new Date(map[oid].created_at)) map[oid]=m; });
  ALL_CHATS=Object.values(map).map(c=>{ let oid=otherIdOf(c); let raw=(c.text||c.message||c.content||''); let preview=''; if(c.type==='voice'||c.media_type==='voice') preview='🎙️ Voice'; else if(c.type==='image'||c.media_type==='image'||c.media_path) preview='📷 Photo'; else if(c.type==='video'||c.media_type==='video') preview='🎬 Video'; else if(raw.startsWith('{"e2e"')) preview='💬 Message'; else if(raw.trim()) preview=raw.slice(0,40); else preview='💬 Message'; let isFirstFromThem=!isMineMsg(c); let threadType='primary'; if(isFirstFromThem && !c.seen) threadType='requests'; return {other:oid,msg:c,preview,threadType}; });
  render();
}
init();
</script></body></html>
