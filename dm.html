<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PIXORO - Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js?v=130"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#F6F6F8!important;color:#111;max-width:450px;margin:0 auto;padding-bottom:76px}
/* LIGHT THEME da - Green Illa da - All Light da */
.top{background:#fff;padding:12px 14px 8px;position:sticky;top:0;z-index:50}
.topRow{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800;color:#111;letter-spacing:.3px}
.logo span{color:#FF4D8D}
.topIco{font-size:20px;margin-left:14px;cursor:pointer;color:#666}
.searchBar{margin:10px 12px;background:#EDEDF2;border-radius:18px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.searchBar input{flex:1;background:transparent;border:0;color:#111;outline:none;font-size:14px}
.notes{display:flex;gap:10px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 58px;text-align:center;cursor:pointer;position:relative}
.nRing{width:52px;height:52px;border-radius:50%;padding:2px;background:#FFD6E8;position:relative}
.nRingInner{width:100%;height:100%;border-radius:50%;background:#fff;padding:2px;overflow:hidden;display:grid;place-items:center}
.noteBubble{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-size:9px;padding:3px 6px;border-radius:12px;white-space:nowrap;font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis;border:1px solid #eee}
.noteInput{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #eee;padding:20px;border-radius:18px;z-index:999;display:none;width:85%;max-width:360px}.noteInput input{width:100%;padding:12px;border-radius:10px;border:0;background:#F1F1F5;color:#111;outline:none;margin:10px 0}
/* FIX - ID / Name / Photo - Chinnatha Correct Size da */
.chatRow{display:flex;gap:10px;padding:10px 12px;align-items:center;cursor:pointer;width:100%}
.chatRow:active{background:#EFEFF3}
.avaWrap{width:44px;height:44px;flex:0 0 44px;position:relative;display:grid;place-items:center;overflow:hidden}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;background:#EDEDF2}
.avaLetter{width:44px;height:44px;border-radius:50%;background:#E8E0FF!important;color:#6C5CE7;display:grid;place-items:center;font-size:17px;font-weight:700;line-height:1}
.avaSmall{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;background:#EDEDF2}
.avaLetterSmall{width:44px;height:44px;border-radius:50%;background:#E8E0FF!important;color:#6C5CE7;display:grid;place-items:center;font-size:17px;font-weight:700;line-height:1}
.chatMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chatTopRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatName{font-size:15px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.chatTime{font-size:11px;color:#999;flex-shrink:0}
.chatPrevRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatPrev{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.dot{display:none}
.unreadBadge{background:#FF4D8D;color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-weight:700;flex-shrink:0}
.unreadBadge.grey{background:#BBB}
.tick{letter-spacing:-1px}
.tick.blue{color:#FF4D8D}
.tick.grey{color:#999}
.actionSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#fff;border-radius:20px 20px 0 0;padding:16px;z-index:1000;display:none;box-shadow:0 -2px 20px rgba(0,0,0,.1)}.actionSheet button{width:100%;padding:12px;border:0;background:#F1F1F5;color:#111;border-radius:12px;margin:4px 0;text-align:left}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:64px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#999;position:relative}.bottom-nav a.active{color:#FF4D8D}.bottom-nav span{font-size:11px}.bottom-nav a.active span{color:#FF4D8D;font-weight:700}
.bottom-nav a img.navPfp{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#EDEDF2}
.navBadge{position:absolute;top:-4px;right:8px;background:#FF4D8D;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:78px;right:14px;width:48px;height:48px;border-radius:50%;background:#FF4D8D;display:grid;place-items:center;font-size:20px;z-index:90;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none;white-space:nowrap}
</style></head><body>
<div class="top"><div class="topRow"><div class="logo">PIXOR<span>O</span></div><div><span class="topIco" onclick="document.getElementById('searchInp').focus()">🔍</span><span class="topIco">⋮</span></div></div></div>
<div class="searchBar">🔍 <input id="searchInp" placeholder="Search..." oninput="onSearch(this.value)"></div>
<div class="notes" id="notes"></div>
<div id="archivedRow" style="display:none"></div>
<div id="list" style="text-align:center;color:#999;padding:10px">Loading...</div>
<div class="fab" onclick="location.href='search.html'">✏️</div>
<div class="toast" id="toast"></div>
<div class="noteInput" id="notePop"><h3 style="color:#111">✏️ Add Note</h3><input id="noteText" placeholder="Yedhachum Yosichiya da...?" maxlength="60"><div style="display:flex;gap:10px"><button onclick="saveNote()" style="flex:1;background:#FF4D8D;color:#fff;border:0;padding:11px;border-radius:20px;font-weight:700">Share</button><button onclick="document.getElementById('notePop').style.display='none'" style="flex:1;background:#F1F1F5;color:#111;border:0;padding:11px;border-radius:20px">Cancel</button></div></div>
<div class="actionSheet" id="sheet"><b id="sheetName" style="color:#111">Chat</b><button onclick="doPin()">📌 Pin / Unpin</button><button onclick="doMute()">🔕 Mute / Unmute</button><button onclick="doArchive()">🗄️ Archive</button><button onclick="doDelete()" style="color:#FF4D4D">🗑️ Delete Chat</button><button onclick="document.getElementById('sheet').style.display='none'" style="text-align:center;background:#EDEDF2">Cancel</button></div>
<div class="bottom-nav"><a href="dm.html" class="active"><span style="font-size:21px">💬</span><span>Chats</span><span class="navBadge" id="navTotal" style="display:none">0</span></a><a href="search.html"><span style="font-size:21px">👥</span><span>Contacts</span></a><a href="settings.html"><span style="font-size:21px">⚙️</span><span>Settings</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa, ME_RAW='', ME_ID='', profileMap={}, profileById={}, CUR_TAB='all', ALL_CHATS=[], NOTES_MAP={}, SEARCH_Q='', UNREAD_MAP={}, SHEET_USER='', PINNED=[], MUTED=[], ARCHIVED=[];
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
function letterFor(u){ let l=(cleanUser(u||'P').charAt(0).toUpperCase()||'P'); return /[A-Z]/.test(l)?l:'P'; }
function showToast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
function realPfp(u){ let p=profileMap[cleanUser(u)]||profileById[u]; let url=p?.avatar_url||p?.profile_pic||''; if(url && !url.includes('ui-avatars')) return url; return ''; }
// FIX - Photo 44px da - Keela Chinna P Varaathu da
function avatarHtml(u, size){
  let url=realPfp(u); let L=letterFor(u);
  let cls = size==='small' ? 'avaSmall' : 'ava';
  let lcls = size==='small' ? 'avaLetterSmall' : 'avaLetter';
  if(url) return `<span style="position:relative;width:44px;height:44px;display:grid;place-items:center"><img class="${cls}" src="${url}" onerror="this.style.display='none'"><span class="${lcls}" style="position:absolute;inset:0">${L}</span></span>`;
  return `<div class="${lcls}">${L}</div>`;
}
function fmtTime(t){ let d=new Date(t); let now=new Date(); if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); let y=new Date(); y.setDate(now.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], {day:'numeric',month:'short'}); }
async function updatePresence(o){ if(!ME_ID) return; await supa.from('profiles').update({is_online:o,last_seen:new Date().toISOString()}).eq('id',ME_ID); }
function isMineMsg(m){ return String(m.sender_id)===ME_ID || cleanUser(m.sender)===ME_RAW; }
function otherIdOf(m){
  if(isMineMsg(m) && m.receiver_id) return String(m.receiver_id);
  if(!isMineMsg(m) && m.sender_id) return String(m.sender_id);
  let name = isMineMsg(m) ? cleanUser(m.receiver) : cleanUser(m.sender);
  let p = profileMap[name]; return p ? String(p.id) : name;
}
function onSearch(v){ SEARCH_Q=v.toLowerCase().trim(); render(); }
let pressTimer=null;
function openSheet(user,uname){ SHEET_USER=user; document.getElementById('sheetName').innerText='@'+uname; document.getElementById('sheet').style.display='block'; }
function doPin(){ let i=PINNED.indexOf(SHEET_USER); if(i>=0) PINNED.splice(i,1); else PINNED.unshift(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doMute(){ let i=MUTED.indexOf(SHEET_USER); if(i>=0) MUTED.splice(i,1); else MUTED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doArchive(){ if(!ARCHIVED.includes(SHEET_USER)) ARCHIVED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doDelete(){ ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; showToast('Chat deleted'); render(); }
async function loadNotes(){
  let {data}=await supa.from('notes').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false});
  NOTES_MAP={}; (data||[]).forEach(n=>{ NOTES_MAP[cleanUser(n.username)]=n.text; });
  let usersWithNote = Object.keys(NOTES_MAP).filter(u=>u!==ME_RAW);
  let myNote = NOTES_MAP[ME_RAW];
  let html='';
  html+=`<div class="nItem" onclick="document.getElementById('notePop').style.display='block'"><div class="nRing"><div class="nRingInner">${avatarHtml(ME_RAW,'small')}${myNote?`<div class="noteBubble">${myNote}</div>`:''}</div></div><div style="font-size:10px;margin-top:4px;color:#111">Your note</div></div>`;
  html+=usersWithNote.slice(0,10).map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="nRing"><div class="nRingInner">${avatarHtml(u,'small')}<div class="noteBubble">${NOTES_MAP[u]}</div></div></div><div style="font-size:10px;margin-top:4px;color:#111">${u}</div></div>`).join('');
  document.getElementById('notes').style.display = (myNote || usersWithNote.length) ? 'flex' : 'none';
  document.getElementById('notes').innerHTML=html;
}
async function saveNote(){ let t=document.getElementById('noteText').value.trim(); if(!t) return; await supa.from('notes').delete().eq('username',ME_RAW); await supa.from('notes').insert({user_id:ME_ID,username:ME_RAW,text:t}); document.getElementById('notePop').style.display='none'; loadNotes(); }
function render(){
  let archived = ALL_CHATS.filter(c=>ARCHIVED.includes(c.other));
  let list=ALL_CHATS.filter(c=>!ARCHIVED.includes(c.other));
  if(CUR_TAB==='hidden') list=archived;
  if(CUR_TAB==='requests') list=list.filter(c=>c.threadType==='requests');
  if(SEARCH_Q) list=list.filter(c=>{ let n=(profileById[c.other]?.username||c.other||'').toLowerCase(); return n.includes(SEARCH_Q)||c.preview.toLowerCase().includes(SEARCH_Q); });
  list.sort((a,b)=>{ let pa=PINNED.includes(a.other)?1:0, pb=PINNED.includes(b.other)?1:0; if(pa!==pb) return pb-pa; return new Date(b.msg.created_at)-new Date(a.msg.created_at); });
  let archEl=document.getElementById('archivedRow');
  if(archived.length && CUR_TAB==='all' && !SEARCH_Q){
    archEl.style.display='block';
    archEl.innerHTML=`<div class="chatRow" onclick="CUR_TAB='hidden';render()"><div class="avaWrap"><div class="avaLetter" style="background:#EDEDF2!important;color:#666!important">🗄️</div></div><div class="chatMain"><div class="chatTopRow"><span class="chatName">Archived Chats</span><span class="chatTime">${archived.length}</span></div><div class="chatPrevRow"><span class="chatPrev">${archived.map(c=>profileById[c.other]?.username||c.other).join(', ')}</span></div></div></div>`;
  } else archEl.style.display='none';
  if(CUR_TAB==='hidden' && !list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#999">No archived chats<br><button onclick="CUR_TAB='all';render()" style="margin-top:12px;background:#FF4D8D;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700">Back</button></div>`; return; }
  if(!list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#999">No chats da<br><button onclick="location.href='search.html'" style="margin-top:12px;background:#FF4D8D;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`; return; }
  let totalUnread = Object.values(UNREAD_MAP).reduce((a,b)=>a+b,0);
  let nav=document.getElementById('navTotal'); if(totalUnread){ nav.style.display='grid'; nav.textContent=totalUnread>99?'99+':totalUnread; } else nav.style.display='none';
  document.getElementById('list').innerHTML=list.map(c=>{
    let uname=profileById[c.other]?.username||c.other; let uc=UNREAD_MAP[c.other]||0; let badge=uc?`<span class="unreadBadge ${MUTED.includes(c.other)?'grey':''}">${uc>99?'99+':uc}</span>`:``; let isPin=PINNED.includes(c.other); let isMute=MUTED.includes(c.other);
    let isMine=isMineMsg(c.msg);
    let tick=isMine?`<span class="tick ${c.msg.seen?'blue':'grey'}">${c.msg.seen?'✓✓':'✓'}</span> `:'';
    return `<div class="chatRow" onmousedown="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" onmouseup="clearTimeout(pressTimer)" ontouchstart="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" ontouchend="clearTimeout(pressTimer)"><div class="avaWrap">${avatarHtml(c.other)}</div><div class="chatMain" onclick="location.href='chat.html?user=${encodeURIComponent(cleanUser(uname))}'"><div class="chatTopRow"><span class="chatName">${isPin?'📌 ':''}${cleanUser(uname)} ${isMute?'🔕':''}</span><span class="chatTime" style="color:${uc?'#FF4D8D':'#999'}">${fmtTime(c.msg.created_at)}</span></div><div class="chatPrevRow"><span class="chatPrev" style="color:${uc?'#111':'#888'}">${tick}${c.preview}</span>${badge}</div></div></div>`
  }).join('');
}
async function init(){
  if(!window.supa){setTimeout(init,300);return} supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id; let {data:my}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME_RAW=cleanUser(my?.username||session.user.email.split('@')[0]); let navPfp=document.getElementById('navPfp'); if(navPfp && my?.avatar_url) navPfp.src=my.avatar_url; else if(navPfp) navPfp.style.display='none';
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileById[p.id]=p});
  let qp=new URLSearchParams(location.search); let qU=qp.get('u')||qp.get('user')||qp.get('id')||'';
  if(qU){ let target=null; if(qU.includes('-')&&qU.length>20) target=profileById[qU]; if(!target) target=profileMap[cleanUser(qU)]; if(target){ location.href='chat.html?user='+encodeURIComponent(cleanUser(target.username)); return; } }
  updatePresence(true); setInterval(()=>updatePresence(true),30000); loadNotes(); load();
  supa.channel('dm-list').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe();
  supa.channel('presence-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},()=>load()).subscribe();
  supa.channel('notes-live').on('postgres_changes',{event:'*',schema:'public',table:'notes'},()=>loadNotes()).subscribe();
}
async function load(){
  let {data}=await supa.from('messages').select('*').order('created_at',{ascending:false}).limit(300); if(!data) data=[];
  UNREAD_MAP={}; data.forEach(m=>{ if(!isMineMsg(m) && !m.seen){ let oid=otherIdOf(m); UNREAD_MAP[oid]=(UNREAD_MAP[oid]||0)+1; } });
  let map={};
  data.forEach(m=>{
    let oid=otherIdOf(m);
    if(!oid || cleanUser(oid)===ME_RAW) return;
    if(!profileMap[cleanUser(oid)] && !profileById[oid]) return;
    if(!map[oid] || new Date(m.created_at)>new Date(map[oid].created_at)) map[oid]=m;
  });
  ALL_CHATS=Object.values(map).map(c=>{
    let oid=otherIdOf(c);
    let raw=(c.text||c.message||c.content||'');
    let preview='';
    if(c.type==='voice'||c.media_type==='voice') preview='🎙️ Voice';
    else if(c.type==='image'||c.media_type==='image'||c.media_path) preview='📷 Photo';
    else if(c.type==='video'||c.media_type==='video') preview='🎬 Video';
    else if(raw.startsWith('{"e2e"')) preview='💬 Message';
    else if(raw.trim()) preview=raw.slice(0,40);
    else preview='💬 Message';
    let isFirstFromThem=!isMineMsg(c); let threadType='primary'; if(isFirstFromThem && !c.seen) threadType='requests';
    return {other:oid,msg:c,preview,threadType};
  });
  render();
}
init();
</script></body></html>
