<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PIXORO - Chats</title>
<link rel="stylesheet" href="css/dm.css">
</head><body>
<div class="top"><div class="topRow"><div class="logo">PIXOR<span>O</span></div><div><span class="topIco" onclick="document.getElementById('searchInp').focus()">🔍</span><span class="topIco" onclick="openDMSettings()">⋮</span></div></div></div>
<div class="searchBar">🔍 <input id="searchInp" placeholder="Search..." oninput="onSearch(this.value)"></div>
<div class="tabs" id="tabs"><button class="tab on" onclick="setTab('all',this)">All</button><button class="tab" onclick="setTab('unread',this)">Unread</button><button class="tab" onclick="setTab('requests',this)">Requests <small id="reqCount" style="display:none">0</small></button><button class="tab" onclick="setTab('archived',this)">Archived</button><button class="tab" onclick="setTab('blocked',this)">Blocked <small id="blkCount" style="display:none">0</small></button></div>
<div id="onlineBox"><div style="padding:4px 12px;font-size:13px;font-weight:800;color:#22C55E">● Online Now</div><div class="onlineRow" id="onlineRow"></div></div>
<div class="notes" id="notes"></div>
<div id="list" style="text-align:center;color:#888;padding:10px">Loading...</div>
<div class="fab" onclick="goSearch()">✏️</div>
<div class="toast" id="toast"></div>
<div id="sheetBackdrop" onclick="closeAllSheets()"></div>
<div class="noteInput" id="notePop"><h3 style="color:#fff">Add Note</h3><input id="noteText" placeholder="..." maxlength="60"><div style="display:flex;gap:10px"><button onclick="saveNote()" style="flex:1;background:#FF4D8D;color:#fff;border:0;padding:11px;border-radius:20px;font-weight:700">Share</button><button onclick="document.getElementById('notePop').style.display='none'" style="flex:1;background:#1F1F1F;color:#fff;border:0;padding:11px;border-radius:20px">Cancel</button></div></div>
<div class="actionSheet" id="sheet"><b id="sheetName" style="color:#fff;font-size:17px">Chat</b><div id="sheetStatus" style="font-size:12px;color:#22C55E;margin:4px 0 8px"></div><button onclick="doPin()">Pin / Unpin</button><button onclick="doMute()">Mute / Unmute</button><button onclick="doArchive()">Archive</button><button onclick="doBlockFromSheet()" style="color:#FF6B6B;background:#2A1215">Block</button><button onclick="doDeleteChatOnly()">Delete Chat</button><button onclick="doDeleteAll()" style="color:#FF6B6B;background:#2A1215">Delete All Messages</button><button onclick="closeAllSheets()" style="text-align:center">Cancel</button></div>
<div id="dmSettingSheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px" id="dmSettingsTitle">Settings</b><span onclick="closeDMSettingsSlow()" style="background:#1F1F1F;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer">✕</span></div>
  <div id="dmStack"><div id="dmPage1"></div><div id="dmPage2" style="display:none"></div><div id="dmPage3" style="display:none"></div></div>
</div>
<div class="bottom-nav"><a href="index.html"><span style="font-size:22px">⌂</span><span>Home</span></a><a href="search.html"><span style="font-size:21px">🔍</span><span>Search</span></a><a href="reels.html"><span style="font-size:21px">▶️</span><span>Reels</span></a><a href="dm.html" class="active"><span style="font-size:21px">💬</span><span>DM</span><span class="navBadge" id="navTotal" style="display:none">0</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src="https://ui-avatars.com/api/?name=P&background=FF4D8D&color=fff&size=200&bold=true" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true'"><span>Profile</span></a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js?v=1009"></script>
<script src="js/dm.js?v=1009"></script>
</body></html>
