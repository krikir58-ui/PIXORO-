<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#000;z-index:20;border-bottom:1px solid #111}
.notesBar{display:flex;gap:14px;padding:12px;overflow-x:auto;border-bottom:1px solid #111}.notesBar::-webkit-scrollbar{display:none}
.noteItem{min-width:72px;text-align:center}
.noteRing{width:64px;height:64px;border-radius:50%;padding:2.5px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.noteInner{background:#000;padding:2px;border-radius:50%}.noteInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.noteBubble{background:#222;border-radius:14px;padding:4px 8px;font-size:10px;margin-bottom:4px;white-space:nowrap;position:relative}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #111}.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;background:#111;color:#888;font-size:13px;white-space:nowrap;cursor:pointer}.tab.active{background:#fff;color:#000;font-weight:700}
.chatItem{padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.chatRing{width:54px;height:54px;border-radius:50%;padding:2.5px}.chatRing.unread{background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}.chatRing.seen{background:#333}
.chatInner{background:#000;padding:2px;border-radius:50%}.chatInner img{width:100%;height:100%;border-radius:50%}
</style></head><body>
<div class="top"><b style="font-size:22px;font-weight:900">Pixoro</b><div style="display:flex;gap:14px;font-size:18px">📝 ↗️</div></div>

<!-- NOTES BAR - Video la mela irukura maari -->
<div class="notesBar" id="notesBar">
  <div class="noteItem"><div class="noteBubble">Just curious 👀</div><div class="noteRing"><div class="noteInner"><img src="https://i.pravatar.cc/100?u=Giri"></div></div><small style="font-size:11px;color:#888">Your note<br><span style="color:#FF0A33;font-size:10px">● Location off</span></small></div>
  <div class="noteItem"><div class="noteBubble">Yaarrruu... 😎</div><div class="noteRing"><div class="noteInner"><img src="https://i.pravatar.cc/100?u=Leon"></div></div><small style="font-size:11px">Leon James</small></div>
  <div class="noteItem"><div class="noteRing" style="background:#333"><div class="noteInner"><img src="https://i.pravatar.cc/100?u=Vishnu"></div></div><small style="font-size:11px">Vishnu</small></div>
</div>

<!-- TABS - All Primary General Requests -->
<div class="tabs"><div class="tab active" onclick="setTab(this,'all')">All 3</div><div class="tab" onclick="setTab(this,'primary')">Primary 3</div><div class="tab" onclick="setTab(this,'general')">General</div><div class="tab" onclick="setTab(this,'requests')">Requests</div></div>

<div id="chatList"></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
function setTab(el,type){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');loadChats(type)}
async function loadChats(filter='all'){
  let {data}=await supa.from('messages').select('*').order('created_at',{ascending:false}).limit(100)
  let map={};(data||[]).forEach(m=>{let o=m.sender===ME?m.receiver:m.sender;if(o&&o!==ME&&!map[o]) map[o]=m})
  let defaults=['Namba_Family','MALESAN','Giri','dhivin__dhivin','Anna','vavachi']
  defaults.forEach(d=>{if(!map[d]) map[d]={sender:d,receiver:ME,text:d.includes('MALE')?'Sent a reel by survive_with_..':d.includes('Giri')?'Sent a reel by remoo__z':'Active now',created_at:new Date().toISOString(),seen:Math.random()>0.5,reel:Math.random()>0.5}})
  let html=Object.keys(map).map(other=>{
    let last=map[other];let unread=!last.seen&&last.receiver===ME;let isActive=last.text.includes('Active')
    let ringClass=unread?'unread':'seen'
    let subText=isActive?`<span style="color:#888">${last.text}</span>`:last.reel?`🎞️ Sent a reel by ${other} • ${Math.floor(Math.random()*6)+1}h`:last.text
    return `<div class="chatItem" onclick="location.href='chat.html?user=${other}'"><div class="chatRing ${ringClass}"><div class="chatInner"><img src="https://i.pravatar.cc/100?u=${other}"></div></div><div style="flex:1"><b style="font-size:14px">${other} ${unread?'🎀':''}</b><div style="color:${isActive?'#888':'#aaa'};font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">${subText}</div></div>${isActive?'<div style="width:8px;height:8px;background:#00FF00;border-radius:50%"></div>':unread?'<div style="width:8px;height:8px;background:#0095f6;border-radius:50%"></div>':''}</div>`
  }).join('')
  document.getElementById('chatList').innerHTML=html
}
loadChats()
</script></body></html>
