<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DM - Pixoro</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/chat-settings.css">
<link rel="stylesheet" href="css/pixoro-verified.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#000;z-index:50;border-bottom:1px solid #1e1e1e;height:56px}
.topPlus{width:32px;height:32px;background:#fff!important;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;cursor:pointer}
.bellWhite{width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bellWhite svg{width:18px;height:18px}
.search{margin:8px 10px;background:#262626;border-radius:12px;padding:10px 12px;color:#888;display:flex;gap:8px;font-size:13px}
.notes{display:flex;gap:12px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;border-bottom:1px solid #151515}
.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 66px;text-align:center}
.nRing{width:60px;height:60px;border-radius:50%;padding:2.5px;background:#fff;position:relative}
.nRingInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px}.nRingInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.noteBubble{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-size:9px;padding:3px 6px;border-radius:10px;white-space:nowrap;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px 10px}
.tab{padding:5px 12px;border-radius:16px;background:#262626;color:#999;font-size:12px}
.tab.active{background:#fff;color:#000;font-weight:700}
.chatRow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #111;cursor:pointer}
.chatRow img{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;height:60px;z-index:100;padding-bottom:4px;padding-top:4px}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}
.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}
.bottom-nav a.active{color:#fff}
.bottom-nav a.active svg{stroke:#fff}
.bottom-nav span{font-size:10px;color:#8e8e8e}
.bottom-nav a.active span{color:#fff;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555;background:#111}
.bottom-nav a.active img.navPfp{border-color:#fff}
.createRow{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid #2a2a2a;cursor:pointer}
.createRow:active{background:#222}
.createIco{width:44px;height:44px;border-radius:50%;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
</style>
</head><body>
<div class="top">
<b style="font-size:19px;display:flex;align-items:center" id="topName" class="my-name">giri_office ▾</b>
<div style="display:flex;gap:8px;align-items:center">
<div class="topPlus" onclick="document.getElementById('createSheet').style.display='flex'">+</div>
<div class="bellWhite" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 9 6 9H0s6-2 6-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></div>
<span onclick="newChat()" style="font-size:18px;cursor:pointer">✏️</span>
</div>
</div>
<div class="search" onclick="location.href='search.html'">🔍 Search on Pixoro</div>
<div class="notes" id="notes"></div>
<div class="tabs"><div class="tab active">All</div><div class="tab">Primary</div><div class="tab">General</div><div class="tab">Requests</div></div>
<div id="list" style="text-align:center;color:#555;padding:30px">Loading real chats da...</div>
<div id="toast" class="toast"></div>
<div class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a>
  <a href="dm.html" class="active"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
  <a href="profile.html"><img class="navPfp my-pfp" id="navPfp" src=""><span>Profile</span></a>
</div>
<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center" onclick="if(event.target.id=='createSheet')this.style.display='none'"><div style="background:#1a1a1a;border-radius:28px 28px 0 0;padding:20px 0 30px;width:100%;max-width:450px">
<div style="width:50px;height:5px;background:#333;border-radius:10px;margin:0 auto 16px"></div>
<div style="text-align:center;font-size:22px;font-weight:900;margin-bottom:10px">Create</div>
<div class="createRow" onclick="location.href='post-create.html'"><div class="createIco">+</div><div style="flex:1"><b>Post</b><div style="font-size:12px;color:#888">Share a photo or update</div></div><span>›</span></div>
<div class="createRow" onclick="location.href='reel-create.html'"><div class="createIco">▶</div><div style="flex:1"><b>Reels</b><div style="font-size:12px;color:#888">Create a short reel video</div></div><span>›</span></div>
<div class="createRow" onclick="location.href='story-create.html'"><div class="createIco" style="border-style:dashed">◯</div><div style="flex:1"><b>Story</b><div style="font-size:12px;color:#888">Share a 24-hour story</div></div><span>›</span></div>
<div class="createRow" style="border-bottom:none" onclick="location.href='live.html'"><div class="createIco">((•))</div><div style="flex:1"><b>Live</b><div style="font-size:12px;color:#888">Go live now</div></div><span>›</span></div>
<div onclick="document.getElementById('createSheet').style.display='none'" style="margin-top:12px;text-align:center;padding:12px;color:#777">Cancel</div>
</div></div>
<script src="pixoro-core.js"></script>
<script>
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
window.prompt = function(){ showToast('Search la name type pannu da'); location.href='search.html'; return null; };
window.onerror = function(){ showToast('Adutha side la problem da - Try again'); return true; };
window.addEventListener('unhandledrejection', ()=>{ showToast('Net slow da - Try again'); });
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME_RAW=localStorage.getItem('pixoro_current_user')||'Giri'
const ME=localStorage.getItem('pixoro_display_name')||cleanUser(ME_RAW)
function cleanUser(u){ if(!u) return 'giri'; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase(); return u||'giri'; }
// TICK - CORE LA IRUNTHU VARUM DA - ONE LINK SYSTEM
document.getElementById('topName').innerHTML = cleanUser(ME_RAW) + ' ' + getTick(ME_RAW) + ' ▾';
function getPfp(u){
  if(!u) return '';
  let clean = cleanUser(u);
  let keys = ['pixoro_pfp_'+u,'pixoro_pfp_'+clean,'pixoro_gilli_pfp_'+u,'pixoro_gilli_pfp_'+clean,'pixoro_pfp_'+ME_RAW,'pixoro_pfp_'+ME,'pixoro_profile_pic','pixoro_current_pfp','profile_pic'];
  for(let k of keys){ let p=localStorage.getItem(k); if(p && (p.startsWith('data:')||p.startsWith('http')||p.startsWith('blob:'))) return p; }
  return 'data:image/svg+xml;utf8,[STRIPPED]'+clean.charAt(0).toUpperCase()+'</text></svg>';
}
function updateNavPfp(){ let el=document.getElementById('navPfp'); if(el) el.src=getPfp(ME_RAW); }
updateNavPfp(); setInterval(updateNavPfp,1000);
function newChat(){ showToast('Search la name type pannu da'); setTimeout(()=>location.href='search.html',500); }
async function load(){
  try{
  let {data} = await supa.from('messages').select('*').or(`sender.eq.${ME_RAW},receiver.eq.${ME_RAW}`).order('created_at',{ascending:false}).limit(100)
  let notesUsers = data? [...new Set(data.map(m=>m.sender===ME_RAW?m.receiver:m.sender))].slice(0,6) : []
  document.getElementById('notes').innerHTML = `<div class="nItem"><div class="nRing" style="background:#222"><div class="nRingInner"><img class="my-pfp" src="${getPfp(ME_RAW)}"></div><div class="noteBubble">Your note</div></div><div style="font-size:10px;margin-top:4px;display:flex;justify-content:center;align-items:center">${cleanUser(ME_RAW)} ${getTick(ME_RAW)}</div></div>` + notesUsers.map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="nRing"><div class="nRingInner"><img src="${getPfp(u)}"></div><div class="noteBubble">Hi da ❤️</div></div><div style="font-size:10px;margin-top:4px;display:flex;justify-content:center;align-items:center">${cleanUser(u)} ${getTick(u)}</div></div>`).join('') || ''
  if(!data||!data.length){document.getElementById('list').innerHTML=`<div style="padding:40px;color:#666">No chats da!<br><button onclick="newChat()" style="margin-top:12px;background:#fff;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`;return}
  let map={}; data.forEach(m=>{let o=m.sender===ME_RAW?m.receiver:m.sender; if(!map[o]||new Date(m.created_at)>new Date(map[o].created_at)) map[o]=m})
  let chats=Object.values(map)
  document.getElementById('list').innerHTML = chats.map(c=>{let o=c.sender===ME_RAW?c.receiver:c.sender; return `<div class="chatRow" onclick="location.href='chat.html?user=${encodeURIComponent(o)}'"><img src="${getPfp(o)}"><div style="flex:1;text-align:left"><b style="font-size:13px;display:flex;align-items:center">${cleanUser(o)} ${getTick(o)}</b><div style="font-size:11px;color:#999">${c.sender===ME_RAW?'Sent':'New message'} • ${new Date(c.created_at).toLocaleTimeString()}</div></div><div style="font-size:16px">📷</div></div>`}).join('')
  }catch(e){ showToast('Adutha side la problem da'); }
  updateNavPfp();
}
load()
</script></body></html>
