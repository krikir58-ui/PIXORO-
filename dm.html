<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PIXORO - Chats</title>

<script src="js/pixoro-core.js?v=139"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:76px}
body[data-photo="nature"]{background:url('https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800') center/cover fixed!important}
body[data-photo="beach"]{background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800') center/cover fixed!important}
body[data-photo="city"]{background:url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800') center/cover fixed!important}
body[data-photo="galaxy"]{background:url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=800') center/cover fixed!important}
body[data-photo="flower"]{background:url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800') center/cover fixed!important}
body[data-photo="mountain"]{background:url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800') center/cover fixed!important}
body[data-photo="love"]{background:url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800') center/cover fixed!important}
body[data-photo="dark"]{background:#111!important}
body[data-photo="pink"]{background:#FFF2F7!important}
body[data-photo="lavender"]{background:#F3F0FF!important}
body[data-photo="blue"]{background:#F0F5FF!important}
.logo{font-size:19px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.top{background:transparent!important;padding:12px 14px 4px;position:sticky;top:0;z-index:50}
.topRow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topIco{font-size:20px;cursor:pointer;color:#fff}
/* Instagram Search - Search or ask Meta AI + Filter */
.searchBar{margin:10px 12px;background:rgba(255,255,255,.12)!important;border:none!important;border-radius:22px;padding:11px 14px;display:flex;gap:8px;align-items:center}
.searchBar input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:14px}
.searchBar input::placeholder{color:rgba(255,255,255,.55)!important}
.filterBtn{color:#4DA6FF;font-weight:600;font-size:15px;cursor:pointer;flex-shrink:0}
/* Instagram Tabs */
.tabs{display:flex;gap:10px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabBtn{border:0;padding:8px 16px;border-radius:18px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
.tabBtn.on{background:#fff!important;color:#000!important;font-weight:700}
/* Instagram Notes - Real Mattum - Demo Name Illa */
.notes{display:flex;gap:14px;overflow-x:auto;padding:18px 12px 6px;scrollbar-width:none}.notes::-webkit-scrollbar{display:none}
.nItem{flex:0 0 78px;text-align:center;cursor:pointer;position:relative;overflow:visible!important}
.nRing{width:68px;height:68px;border-radius:50%;padding:0!important;background:transparent!important;border:none!important;position:relative;margin:0 auto}
.nRingInner{width:100%;height:100%;border-radius:50%;background:transparent!important;padding:0!important;overflow:visible!important;display:grid;place-items:center;border:none!important}
.noteBubble{position:absolute;top:-48px;left:50%;transform:translateX(-50%);background:#2A2A2E;color:#fff;font-size:10px;line-height:1.35;padding:7px 9px;border-radius:14px;white-space:normal;font-weight:600;width:92px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:5}
.noteBubble::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #2A2A2E}
.noteBubble.pink{background:#FF9EBB!important;color:#111!important}
.noteBubble.pink::after{border-top-color:#FF9EBB!important}
.noteBubble img{width:16px;height:16px;border-radius:50%;object-fit:cover}
.nName{font-size:12px;color:#fff;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nSub{font-size:11px;color:#FF4D4D;font-weight:700}
.onlineDot{width:12px;height:12px;background:#2ECC71;border:2px solid #000;border-radius:50%;position:absolute;bottom:2px;right:2px;z-index:3}
.noteSticker{width:26px;height:26px;border-radius:50%;object-fit:cover;position:absolute;top:-18px;right:-4px;border:none!important}
.noteInput{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,10,40,.95);border:none;padding:20px;border-radius:18px;z-index:999;display:none;width:85%;max-width:360px;color:#fff}.noteInput input{width:100%;padding:12px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:#fff;outline:none;margin:10px 0}
.chatRow{display:flex;gap:12px;padding:12px 12px;align-items:center;cursor:pointer;width:100%!important;margin:0!important;background:transparent!important;border:none!important}
.chatRow:active{background:rgba(255,255,255,.08)!important}
.avaWrap{width:52px;height:52px;flex:0 0 52px;position:relative;display:grid;place-items:center;overflow:visible!important;background:transparent!important;border:none!important}
.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;background:transparent!important;border:none!important}
.avaLetter{width:52px;height:52px;border-radius:50%;background:#E8E0FF!important;color:#6C5CE7;display:grid;place-items:center;font-size:18px;font-weight:700;border:none!important}
.avaSmall{width:68px;height:68px;border-radius:50%;object-fit:cover;display:block;background:transparent!important;border:none!important}
.avaLetterSmall{width:68px;height:68px;border-radius:50%;background:#E8E0FF!important;color:#6C5CE7;display:grid;place-items:center;font-size:18px;font-weight:700;border:none!important}
.chatMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chatTopRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatName{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.chatTime{font-size:12px;color:rgba(255,255,255,.55);flex-shrink:0}
.chatPrevRow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.chatPrev{font-size:13px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.unreadBadge{background:#FF4D8D;color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-weight:700;flex-shrink:0}
.unreadBadge.grey{background:#BBB}
.tick{letter-spacing:-1px}.tick.blue{color:#FF4D8D}.tick.grey{color:#999}
.actionSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:rgba(20,10,40,.95);color:#fff;border-radius:20px 20px 0 0;padding:16px;z-index:1000;display:none}.actionSheet button{width:100%;padding:12px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;margin:4px 0;text-align:left}
.bottom-nav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;max-width:450px!important;margin:0 auto!important;width:100%!important;height:58px!important;background:#000!important;border-top:1px solid #222!important;display:flex!important;justify-content:space-around!important;align-items:center!important;z-index:100!important}
.bottom-nav a{display:flex!important;align-items:center!important;justify-content:center!important;text-decoration:none!important;color:#fff!important;font-size:24px!important;width:56px!important;height:38px!important;border-radius:20px!important}
.bottom-nav a.active{background:rgba(255,255,255,.18)!important}
.bottom-nav a img.navPfp{width:28px!important;height:28px!important;border-radius:50%!important;object-fit:cover!important;border:none!important}
.navBadge{position:absolute;top:-4px;right:8px;background:#FF4D8D;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:78px;right:14px;width:48px;height:48px;border-radius:50%;background:#FF4D8D;display:grid;place-items:center;font-size:20px;z-index:90;cursor:pointer;color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none;white-space:nowrap}
#dmSettingSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:rgba(20,10,40,.95);color:#fff;border-radius:20px 20px 0 0;padding:16px;z-index:1001;display:none;max-height:85vh;overflow-y:auto}
.themePhoto{height:70px;border-radius:14px;border:2px solid transparent;cursor:pointer;color:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.themePhoto.on{border-color:#FF4D8D!important}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,.12);border-radius:12px;margin-top:10px;font-size:14px;font-weight:600;color:#fff}
.setRow input{width:22px;height:22px;accent-color:#FF4D8D}
.setRow select{border:0;background:#fff;padding:6px 8px;border-radius:8px;font-weight:700}
</style></head><body>
<div class="top"><div class="topRow"><span class="topIco">💼</span><span class="topIco">📈</span><div class="logo" id="topName">PIXORO</div><span class="topIco">⌄</span><div style="flex:1"></div><span class="topIco" onclick="document.getElementById('dmSettingSheet').style.display='block'">⋯</span><span class="topIco" onclick="location.href='search.html'">✏️</span></div></div>
<div style="display:flex;gap:10px;align-items:center;padding:0 12px"><div class="searchBar" style="flex:1;margin:0">🔍 <input id="searchInp" placeholder="Search or ask Meta AI" oninput="onSearch(this.value)"></div><span class="filterBtn" onclick="showToast('Filter')">Filter</span></div>
<div class="notes" id="notes"></div>
<div class="tabs"><button class="tabBtn on" onclick="setTab('all',this)">All</button><button class="tabBtn" onclick="setTab('primary',this)">Primary</button><button class="tabBtn" onclick="setTab('general',this)">General</button><button class="tabBtn" onclick="setTab('requests',this)">Requests ›</button></div>
<div id="archivedRow" style="display:none"></div>
<div id="list" style="text-align:center;color:#999;padding:10px">Loading...</div>
<div class="fab" onclick="location.href='search.html'">✏️</div>
<div class="toast" id="toast"></div>
<div class="noteInput" id="notePop"><h3>✏️ Add Note</h3><input id="noteText" placeholder="Your thoughts go here..." maxlength="60"><label style="display:block;padding:10px;background:rgba(255,255,255,.12);border-radius:10px;text-align:center;cursor:pointer;margin:10px 0">🎵 Music + 🖼️ Image Sticker<input type="file" id="noteImgInput" accept="image/*" hidden></label><div style="display:flex;gap:10px"><button onclick="saveNoteWithImage()" style="flex:1;background:#FF4D8D;color:#fff;border:0;padding:11px;border-radius:20px;font-weight:700">Share</button><button onclick="document.getElementById('notePop').style.display='none'" style="flex:1;background:rgba(255,255,255,.15);color:#fff;border:0;padding:11px;border-radius:20px">Cancel</button></div></div>
<div class="actionSheet" id="sheet"><b id="sheetName">Chat</b><button onclick="doPin()">📌 Pin / Unpin</button><button onclick="doMute()">🔕 Mute / Unmute</button><button onclick="doArchive()">🗄️ Archive</button><button onclick="doDelete()" style="color:#FF4D4D">🗑️ Delete Chat</button><button onclick="document.getElementById('sheet').style.display='none'" style="text-align:center">Cancel</button></div>
<div id="dmSettingSheet"><b style="font-size:17px">⚙️ DM Settings</b><p style="font-size:12px;color:rgba(255,255,255,.7);margin:6px 0 12px">DM Chat Nitta Iruka Num Pakka - Ellam Inga thaan da</p><b>🖼️ Photo Theme - Active Now</b><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"><div class="themePhoto" data-t="light" onclick="setPhotoTheme('light')" style="background:#F6F6F8;color:#111;text-shadow:none">🤍<span>Light</span></div><div class="themePhoto" data-t="nature" onclick="setPhotoTheme('nature')" style="background:url('https://images.unsplash.com/photo-1501854140801-50d01698950b?w=400') center/cover">🌿<span>Nature</span></div><div class="themePhoto" data-t="beach" onclick="setPhotoTheme('beach')" style="background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400') center/cover">🏖️<span>Beach</span></div><div class="themePhoto" data-t="city" onclick="setPhotoTheme('city')" style="background:url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=400') center/cover">🌃<span>City</span></div><div class="themePhoto" data-t="galaxy" onclick="setPhotoTheme('galaxy')" style="background:url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=400') center/cover">🌌<span>Galaxy</span></div><div class="themePhoto" data-t="flower" onclick="setPhotoTheme('flower')" style="background:url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400') center/cover">🌸<span>Flower</span></div><div class="themePhoto" data-t="mountain" onclick="setPhotoTheme('mountain')" style="background:url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400') center/cover">⛰️<span>Mountain</span></div><div class="themePhoto" data-t="love" onclick="setPhotoTheme('love')" style="background:url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400') center/cover">💗<span>Love</span></div><div class="themePhoto" data-t="dark" onclick="setPhotoTheme('dark')" style="background:#111">🖤<span>Dark</span></div></div><label style="display:block;margin-top:12px;padding:12px;background:rgba(255,255,255,.12);border-radius:12px;text-align:center;cursor:pointer;font-weight:700">📷 Pudicha Photo Upload Pannu da<input type="file" accept="image/*" hidden onchange="setCustomTheme(this)"></label><b style="display:block;margin-top:16px">👀 Privacy</b><label class="setRow">🟢 Active Now <input type="checkbox" id="setActive" checked onchange="saveDMSetting('active',this.checked)"></label><label class="setRow">✍️ Typing... <input type="checkbox" id="setTyping" checked onchange="saveDMSetting('typing',this.checked)"></label><label class="setRow">👁️ Seen <input type="checkbox" id="setSeen" checked onchange="saveDMSetting('seen',this.checked)"></label><label class="setRow">✅ Allow Messages <select id="setAllow" onchange="saveDMSetting('allow',this.value)"><option value="everyone">Everyone - Allow</option><option value="following">Following Only</option><option value="none">No One - Not Allow</option></select></label><button onclick="document.getElementById('dmSettingSheet').style.display='none'" style="width:100%;margin-top:14px;padding:12px;background:rgba(255,255,255,.15);border:0;border-radius:12px;color:#fff;font-weight:700">Close</button></div>
<div class="bottom-nav"><a href="index.html">⌂</a><a href="reels.html">▶️</a><a href="dm.html" class="active">✈️<span class="navBadge" id="navTotal" style="display:none">0</span></a><a href="search.html">🔍</a><a href="profile.html"><img class="navPfp" id="navPfp" src=""></a></div>
<script>
let supa=window.supa, ME_RAW='', ME_ID='', profileMap={}, profileById={}, CUR_TAB='all', ALL_CHATS=[], NOTES_MAP={}, NOTES_IMG={}, NOTES_MUSIC={}, SEARCH_Q='', UNREAD_MAP={}, SHEET_USER='', PINNED=[], MUTED=[], ARCHIVED=[];
const PHOTO_THEMES={light:'',pink:'',lavender:'',blue:'',nature:'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800',beach:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800',city:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800',galaxy:'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=800',flower:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800',mountain:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800',love:'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=800',dark:''};
function setPhotoTheme(t){ localStorage.setItem('pixoro_photo_theme',t); localStorage.setItem('pixoro_theme',t); localStorage.removeItem('pixoro_custom_bg'); applyPhotoTheme(); document.getElementById('dmSettingSheet').style.display='none'; showToast('Photo Theme Changed da ✨'); }
function setCustomTheme(input){ let f=input.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ localStorage.setItem('pixoro_custom_bg',e.target.result); localStorage.setItem('pixoro_photo_theme','custom'); applyPhotoTheme(); document.getElementById('dmSettingSheet').style.display='none'; showToast('Pudicha Photo Set Aayiduchu da ✨'); }; r.readAsDataURL(f); }
function applyPhotoTheme(){ let t=localStorage.getItem('pixoro_photo_theme')||localStorage.getItem('pixoro_theme')||'light'; let custom=localStorage.getItem('pixoro_custom_bg')||''; document.body.dataset.photo=t; document.body.dataset.theme=t; if(t==='custom' && custom){ document.body.style.background=`url('${custom}') center/cover fixed`; } else if(PHOTO_THEMES[t]){ document.body.style.background=`url('${PHOTO_THEMES[t]}') center/cover fixed`; } else { document.body.style.background=''; } document.querySelectorAll('.themePhoto').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); }
applyPhotoTheme();
function saveDMSetting(k,v){ localStorage.setItem('pixoro_dm_'+k, v); showToast('Setting Saved da ✨'); }
function loadDMSettings(){ let a=document.getElementById('setActive'); if(a) a.checked = localStorage.getItem('pixoro_dm_active')!=='false'; let ty=document.getElementById('setTyping'); if(ty) ty.checked = localStorage.getItem('pixoro_dm_typing')!=='false'; let s=document.getElementById('setSeen'); if(s) s.checked = localStorage.getItem('pixoro_dm_seen')!=='false'; let al=document.getElementById('setAllow'); if(al) al.value = localStorage.getItem('pixoro_dm_allow')||'everyone'; }
loadDMSettings();
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
function letterFor(u){ let l=(cleanUser(u||'P').charAt(0).toUpperCase()||'P'); return /[A-Z]/.test(l)?l:'P'; }
function showToast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }
function realPfp(u){ let p=profileMap[cleanUser(u)]||profileById[u]; let url=p?.avatar_url||p?.profile_pic||''; if(url && !url.includes('ui-avatars')) return url; return ''; }
function avatarHtml(u, size){ let url=realPfp(u); let L=letterFor(u); let cls = size==='small' ? 'avaSmall' : 'ava'; let lcls = size==='small' ? 'avaLetterSmall' : 'avaLetter'; if(url) return `<span style="position:relative;width:${size==='small'?'68px':'52px'};height:${size==='small'?'68px':'52px'};display:grid;place-items:center"><img class="${cls}" src="${url}" onerror="this.style.display='none'"><span class="${lcls}" style="position:absolute;inset:0">${L}</span></span>`; return `<div class="${lcls}">${L}</div>`; }
function fmtTime(t){ let d=new Date(t); let now=new Date(); if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); let y=new Date(); y.setDate(now.getDate()-1); if(d.toDateString()===y.toDateString()) return 'Yesterday'; return d.toLocaleDateString([], {day:'numeric',month:'short'}); }
function fmtAgo(t){ let diff=(Date.now()-new Date(t))/1000; if(diff<60) return 'now'; if(diff<3600) return Math.floor(diff/60)+'m'; if(diff<86400) return Math.floor(diff/3600)+'h'; return Math.floor(diff/86400)+'d'; }
async function updatePresence(o){ if(!ME_ID) return; if(localStorage.getItem('pixoro_dm_active')==='false'){ o=false; } await supa.from('profiles').update({is_online:o,last_seen:new Date().toISOString()}).eq('id',ME_ID); }
function isMineMsg(m){ return String(m.sender_id)===ME_ID || cleanUser(m.sender)===ME_RAW; }
function otherIdOf(m){ if(isMineMsg(m) && m.receiver_id) return String(m.receiver_id); if(!isMineMsg(m) && m.sender_id) return String(m.sender_id); let name = isMineMsg(m) ? cleanUser(m.receiver) : cleanUser(m.sender); let p = profileMap[name]; return p ? String(p.id) : name; }
function onSearch(v){ SEARCH_Q=v.toLowerCase().trim(); render(); }
function setTab(t,btn){ document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on'); CUR_TAB=t; render(); }
let pressTimer=null;
function openSheet(user,uname){ SHEET_USER=user; document.getElementById('sheetName').innerText='@'+uname; document.getElementById('sheet').style.display='block'; }
function doPin(){ let i=PINNED.indexOf(SHEET_USER); if(i>=0) PINNED.splice(i,1); else PINNED.unshift(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doMute(){ let i=MUTED.indexOf(SHEET_USER); if(i>=0) MUTED.splice(i,1); else MUTED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doArchive(){ if(!ARCHIVED.includes(SHEET_USER)) ARCHIVED.push(SHEET_USER); document.getElementById('sheet').style.display='none'; render(); }
function doDelete(){ ALL_CHATS=ALL_CHATS.filter(c=>c.other!==SHEET_USER); document.getElementById('sheet').style.display='none'; showToast('Chat deleted'); render(); }
// Notes - Real Mattum da - Demo Name Illa da - Note la Varakudathu da
function noteHtml(u){
  let note = NOTES_MAP[u] || '';
  let img = NOTES_IMG[u] || localStorage.getItem('pixoro_note_img_'+u) || '';
  let mus = NOTES_MUSIC[u] || '';
  if(!note && !img && !mus) return '';
  let inner = mus ? `🎵 ${mus}<br>${note}` : note;
  if(img) inner = `<img src="${img}"> ${inner}`;
  return `<div class="noteBubble">${inner}</div>${img?`<img class="noteSticker" src="${img}">`:''}`;
}
async function loadNotes(){
  let {data}=await supa.from('notes').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false});
  NOTES_MAP={}; NOTES_IMG={}; NOTES_MUSIC={}; (data||[]).forEach(n=>{ NOTES_MAP[cleanUser(n.username)]=n.text; if(n.image_url) NOTES_IMG[cleanUser(n.username)]=n.image_url; if(n.music) NOTES_MUSIC[cleanUser(n.username)]=n.music; });
  let usersWithNote = Object.keys(NOTES_MAP).filter(u=>u!==ME_RAW);
  let myNote = NOTES_MAP[ME_RAW] || 'Your thoughts go here...';
  let html='';
  html+=`<div class="nItem" onclick="document.getElementById('notePop').style.display='block'"><div class="nRing"><div class="nRingInner">${avatarHtml(ME_RAW,'small')}<div class="noteBubble">${myNote}</div></div></div><div class="nName">Your note</div><div class="nSub">📌 Location off</div></div>`;
  html+=usersWithNote.map(u=>`<div class="nItem" onclick="location.href='chat.html?user=${encodeURIComponent(u)}'"><div class="nRing"><div class="nRingInner">${avatarHtml(u,'small')}${noteHtml(u)}</div></div><div class="nName">${u}</div></div>`).join('');
  document.getElementById('notes').innerHTML=html;
}
async function saveNote(){ let t=document.getElementById('noteText').value.trim(); if(!t) return; await supa.from('notes').delete().eq('username',ME_RAW); await supa.from('notes').insert({user_id:ME_ID,username:ME_RAW,text:t}); document.getElementById('notePop').style.display='none'; loadNotes(); }
function saveNoteWithImage(){ let t=document.getElementById('noteText').value.trim(); let f=document.getElementById('noteImgInput')?.files[0]; if(f){ let r=new FileReader(); r.onload=e=>{ localStorage.setItem('pixoro_note_img_'+ME_RAW, e.target.result); NOTES_IMG[ME_RAW]=e.target.result; saveNote(); }; r.readAsDataURL(f); } else saveNote(); }
function render(){
  let archived = ALL_CHATS.filter(c=>ARCHIVED.includes(c.other));
  let list=ALL_CHATS.filter(c=>!ARCHIVED.includes(c.other));
  if(CUR_TAB==='hidden') list=archived;
  if(CUR_TAB==='primary') list=list.filter(c=>c.threadType!=='requests');
  if(CUR_TAB==='general') list=list.filter(c=>MUTED.includes(c.other));
  if(CUR_TAB==='requests') list=list.filter(c=>c.threadType==='requests');
  if(SEARCH_Q) list=list.filter(c=>{ let n=(profileById[c.other]?.username||c.other||'').toLowerCase(); return n.includes(SEARCH_Q)||c.preview.toLowerCase().includes(SEARCH_Q); });
  list.sort((a,b)=>{ let pa=PINNED.includes(a.other)?1:0, pb=PINNED.includes(b.other)?1:0; if(pa!==pb) return pb-pa; return new Date(b.msg.created_at)-new Date(a.msg.created_at); });
  let archEl=document.getElementById('archivedRow');
  if(archived.length && CUR_TAB==='all' && !SEARCH_Q){ archEl.style.display='block'; archEl.innerHTML=`<div class="chatRow" onclick="CUR_TAB='hidden';render()"><div class="avaWrap"><div class="avaLetter">🗄️</div></div><div class="chatMain"><div class="chatTopRow"><span class="chatName">Archived Chats</span><span class="chatTime">${archived.length}</span></div><div class="chatPrevRow"><span class="chatPrev">${archived.map(c=>profileById[c.other]?.username||c.other).join(', ')}</span></div></div></div>`; } else archEl.style.display='none';
  if(CUR_TAB==='hidden' && !list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#fff">No archived chats<br><button onclick="CUR_TAB='all';render()" style="margin-top:12px;background:#FF4D8D;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700">Back</button></div>`; return; }
  if(!list.length){ document.getElementById('list').innerHTML=`<div style="padding:40px;color:#fff">No chats da<br><button onclick="location.href='search.html'" style="margin-top:12px;background:#FF4D8D;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700">+ New Chat</button></div>`; return; }
  let totalUnread = Object.values(UNREAD_MAP).reduce((a,b)=>a+b,0);
  let nav=document.getElementById('navTotal'); if(totalUnread){ nav.style.display='grid'; nav.textContent=totalUnread>99?'99+':totalUnread; } else nav.style.display='none';
  let seenOff = localStorage.getItem('pixoro_dm_seen')==='false';
  document.getElementById('list').innerHTML=list.map(c=>{
    let uname=profileById[c.other]?.username||c.other; let uc=UNREAD_MAP[c.other]||0; let badge=uc?`<span class="unreadBadge ${MUTED.includes(c.other)?'grey':''}">${uc>99?'99+':uc}</span>`:``; let isPin=PINNED.includes(c.other); let isMute=MUTED.includes(c.other);
    let isMine=isMineMsg(c.msg);
    let tick = seenOff ? '' : (isMine?`<span class="tick ${c.msg.seen?'blue':'grey'}">${c.msg.seen?'✓✓':'✓'}</span> `:'');
    let ago = fmtAgo(c.msg.created_at);
    let prevText = isMine ? `Sent · ${ago}` : `${c.preview} · ${ago}`;
    return `<div class="chatRow" onmousedown="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" onmouseup="clearTimeout(pressTimer)" ontouchstart="pressTimer=setTimeout(()=>openSheet('${c.other}','${cleanUser(uname)}'),600)" ontouchend="clearTimeout(pressTimer)"><div class="avaWrap">${avatarHtml(c.other)}</div><div class="chatMain" onclick="location.href='chat.html?user=${encodeURIComponent(cleanUser(uname))}'"><div class="chatTopRow"><span class="chatName">${isPin?'📌 ':''}${cleanUser(uname)} ${isMute?'🔕':''}</span></div><div class="chatPrevRow"><span class="chatPrev">${tick}${prevText}</span>${badge}</div></div></div>`
  }).join('');
}
async function init(){
  if(!window.supa){setTimeout(init,300);return} supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id; let {data:my}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME_RAW=cleanUser(my?.username||session.user.email.split('@')[0]); document.getElementById('topName').innerText = ME_RAW.length>12?ME_RAW.slice(0,12)+'...':ME_RAW; let navPfp=document.getElementById('navPfp'); if(navPfp && my?.avatar_url) navPfp.src=my.avatar_url; else if(navPfp) navPfp.style.display='none';
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileById[p.id]=p});
  let qp=new URLSearchParams(location.search); let qU=qp.get('u')||qp.get('user')||qp.get('id')||'';
  if(qU){ let target=null; if(qU.includes('-')&&qU.length>20) target=profileById[qU]; if(!target) target=profileMap[cleanUser(qU)]; if(target){ location.href='chat.html?user='+encodeURIComponent(cleanUser(target.username)); return; } }
  updatePresence(true); setInterval(()=>updatePresence(true),30000); loadNotes(); load();
  supa.channel('dm-list').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe();
  supa.channel('presence-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},()=>load()).subscribe();
  supa.channel('notes-live').on('postgres_changes',{event:'*',schema:'public',table:'notes'},()=>loadNotes()).subscribe();
}
async function load(){
  let {data}=await supa.from('messages').select('*').order('created_at',{ascending:false}).limit(300); if(!data) data=[];
  UNREAD_MAP={}; data.forEach(m=>{ if(!isMineMsg(m) && !m.seen){ let oid=otherIdOf(m); UNREAD_MAP[oid]=(UNREAD_MAP[oid]||0)+1; } });
  let map={};
  data.forEach(m=>{ let oid=otherIdOf(m); if(!oid || cleanUser(oid)===ME_RAW) return; if(!profileMap[cleanUser(oid)] && !profileById[oid]) return; if(!map[oid] || new Date(m.created_at)>new Date(map[oid].created_at)) map[oid]=m; });
  ALL_CHATS=Object.values(map).map(c=>{ let oid=otherIdOf(c); let raw=(c.text||c.message||c.content||''); let preview=''; if(c.type==='voice'||c.media_type==='voice') preview='🎙️ Voice'; else if(c.type==='image'||c.media_type==='image'||c.media_path) preview='📷 Photo'; else if(c.type==='video'||c.media_type==='video') preview='🎬 Video'; else if(raw.startsWith('{"e2e"')) preview='💬 Message'; else if(raw.trim()) preview=raw.slice(0,40); else preview='💬 Message'; let isFirstFromThem=!isMineMsg(c); let threadType='primary'; if(isFirstFromThem && !c.seen) threadType='requests'; return {other:oid,msg:c,preview,threadType}; });
  render();
}
init();
</script></body></html>
