<script>
// ✅ CORRECTED - Reels Full
let supa=null;
function getSupa(){
  if(window.supa) supa=window.supa;
  if(!supa && window.supabase && window.PIXORO_URL && window.PIXORO_KEY){
    try{ window.supa=window.supabase.createClient(window.PIXORO_URL, window.PIXORO_KEY); supa=window.supa; }catch(e){}
  }
  return window.supa||supa;
}
window.getSupa=getSupa;
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
function showToast(m){let t=document.getElementById('toast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function fmtViews(n){if(n>=1000000)return (n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return (n/1000).toFixed(1).replace('.0','')+'K';return String(n)}
function pixoroIsUuidLocal(s){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||'')); }
let ME_RAW='',ME_ID='',ME_PFP='',profileMap={},profileByIdMap={},allPosts=[],allLikes=[],allSaves=[],allFollows=[],allComments=[],allViews=[],curCommentPost=null,globalMuted=true,lastTap=0,tapTimer=null,curShareId=null,currentVideo=null,viewedPosts=new Set(),curSheetId=null,curSheetUser=null,curSheetUsername='',hiddenPosts=[],mutedUsers=[],blockedUsers=[],hiddenMeta={},lastAction=null,savingIds=new Set(),_INIT_DONE=false
async function waitSupa(){for(let i=0;i<30;i++){let s=getSupa();if(s)return s;await new Promise(r=>setTimeout(r,100))}return getSupa()}
window.toggleFollow = window.pixoroToggleFollow;
window.toggleF = window.pixoroToggleFollow;
async function pixoroSendNotification(toUserId, type, postId, msg){ return; }
window.pixoroSendNotification = pixoroSendNotification;
function getCleanAvatar(url){
  if(!url || !String(url).includes('http')) return '';
  if(String(url).includes('ui-avatars.com')) return '';
  return String(url).trim();
}
function withCacheBust(url){
  if(!url) return url;
  return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
}
function getPfp(u){
  if(!u) return 'https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true';
  if(String(u)===String(ME_ID) && ME_PFP) return withCacheBust(getCleanAvatar(ME_PFP));
  let p = profileByIdMap[String(u)] || profileMap[cleanUser(u)];
  let url = p ? getCleanAvatar(p.avatar_url||p.profile_pic||p.photo_url||'') : '';
  if(url) return withCacheBust(url);
  return 'https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true';
}
function pfpErr(el,uname){
  el.onerror=null;
  el.src='https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true';
}
window.pfpErr=pfpErr;
function displayNameFor(u){
  if(!u) return ME_RAW||'user';
  let p=profileByIdMap[String(u)]||profileMap[cleanUser(u)];
  if(p&&p.username) return cleanUser(p.username);
  let pp=allPosts.find(x=>String(x.user_id)===String(u));
  if(pp&&pp.username) return cleanUser(pp.username);
  if(String(u)===String(ME_ID)) return ME_RAW||'user';
  let cu=cleanUser(u);
  if(cu.length>20) return ME_RAW||'user';
  return cu||ME_RAW||'user';
}
function isMyPostObj(p){if(!p)return false;if(p.user_id&&String(p.user_id)===String(ME_ID))return true;return cleanUser(p.username)===cleanUser(ME_RAW)}

async function init(){
  if(_INIT_DONE) return; _INIT_DONE=true;
  supa=await waitSupa();
  if(!supa){
    _INIT_DONE=false;
    let w=document.getElementById('reelWrap');
    if(w) w.innerHTML='<div style="color:#fff;text-align:center;padding:120px 20px">Supabase Connect Aagala da<br><span style="color:#888;font-size:13px">pixoro-core.js la URL / KEY check pannu da</span><br><br><button onclick="location.reload()" style="background:#FF4D8D;color:#fff;border:0;padding:10px 20px;border-radius:20px;font-weight:800">Refresh</button></div>';
    return;
  }
  let {data:{session}}=await supa.auth.getSession();
  if(!session){ await new Promise(r=>setTimeout(r,800)); let s2=await supa.auth.getSession(); session=s2.data.session; }
  if(!session){location.href='login.html';return}
  ME_ID=session.user.id;window.ME_ID=ME_ID;
  let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);window.ME_RAW=ME_RAW;
  ME_PFP=getCleanAvatar(myProf?.avatar_url||myProf?.profile_pic||myProf?.photo_url||'');
  window.ME_PFP=ME_PFP;
  let {data:profs}=await supa.from('profiles').select('id,username,avatar_url,profile_pic,photo_url').limit(200);(profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileByIdMap[String(p.id)]=p});
  if(ME_ID && ME_PFP){
    profileByIdMap[String(ME_ID)]={...(profileByIdMap[String(ME_ID)]||{}),id:ME_ID,username:ME_RAW,avatar_url:ME_PFP};
    profileMap[cleanUser(ME_RAW)]=profileByIdMap[String(ME_ID)];
  }

  if(window.pixoroRefreshPhotos) await window.pixoroRefreshPhotos();

window.addEventListener('storage',(e)=>{
  if(e.key==='pixoro_pfp_updated' && e.newValue){
    ME_PFP=e.newValue; window.ME_PFP=e.newValue;
    if(profileByIdMap[String(ME_ID)]) profileByIdMap[String(ME_ID)].avatar_url=e.newValue;
    let el=document.getElementById('navPfp'); if(el) el.src=withCacheBust(e.newValue);
    if(typeof render==='function') render();
  }
});
window.addEventListener('focus', async ()=>{
  supa=getSupa();
  if(!supa || !ME_ID) return;
  try{
    let {data}=await supa.from('profiles').select('avatar_url').eq('id',ME_ID).maybeSingle();
    if(data && data.avatar_url && data.avatar_url!==ME_PFP){
      ME_PFP=data.avatar_url; window.ME_PFP=data.avatar_url;
      if(profileByIdMap[String(ME_ID)]) profileByIdMap[String(ME_ID)].avatar_url=data.avatar_url;
      let el=document.getElementById('navPfp'); if(el) el.src=withCacheBust(data.avatar_url);
      if(typeof render==='function') render();
    }
  }catch(e){}
});

async function load(){try{
supa=getSupa(); if(!supa) return;
let [r1,r2] = await Promise.all([
  supa.from('posts').select('*').order('created_at',{ascending:false}).limit(20).then(r=>r).catch(()=>({data:[]})),
  supa.from('reels').select('*').order('created_at',{ascending:false}).limit(20).then(r=>r).catch(()=>({data:[]})),
]);
let all=[]; if(r1.data) all=all.concat(r1.data.map(p=>({...p,_from:'posts'}))); if(r2.data) all=all.concat(r2.data.map(p=>({...p,_from:'reels'})));
let seenUrl=new Set(); let deduped=[];
for(let p of all){
  let raw=(p.media_url||p.image_url||p.video_url||'').trim();
  if(!raw) continue;
  if(p.is_archived === true) continue;
  let url=raw.split('?')[0].split('#')[0].toLowerCase().trim();
  let fileKey=url.includes('/storage/')?url.split('/storage/')[1]:url;
  if(seenUrl.has(url)||seenUrl.has(fileKey)) continue;
  seenUrl.add(url); seenUrl.add(fileKey); deduped.push(p);
}
all=deduped;
all.forEach(p=>{
  if(!p.user_id && p.username){
    let pr2 = profileByIdMap[String(p.username)] || profileMap[cleanUser(p.username)];
    if(pr2) p.user_id = pr2.id;
  }
  let prof=profileByIdMap[String(p.user_id)];
  if(prof&&prof.username) p.username=cleanUser(prof.username);
  else if(p.username) p.username=cleanUser(p.username);
});
allPosts=all;
let postIds = allPosts.map(p=>String(p.id)).filter(id=>pixoroIsUuidLocal(id));
let likes={data:[]}, saves={data:[]}, follows={data:[]}, comments={data:[]}, views={data:[]};
if(postIds.length){
  likes = await supa.from('likes').select('post_id,user_id').in('post_id', postIds).then(r=>r).catch(()=>({data:[]}));
  saves = await supa.from('saves').select('*').eq('user_id',ME_ID).in('post_id', postIds).then(r=>r).catch(()=>({data:[]}));
  comments = await supa.from('comments').select('*').in('post_id', postIds).order('created_at',{ascending:false}).then(r=>r).catch(()=>({data:[]}));
  views = await supa.from('views').select('post_id,user_id').in('post_id', postIds).then(r=>r).catch(()=>({data:[]}));
}
follows = await supa.from('follows').select('follower_id,following_id,status').eq('follower_id',ME_ID).eq('status','accepted').then(r=>r).catch(()=>({data:[]}));
allLikes=likes.data||[];allSaves=saves.data||[];allFollows=follows.data||[];allComments=comments.data||[];allViews=views.data||[];
window.PIXORO_FOLLOWING=new Set((allFollows||[]).map(f=>String(f.following_id)));
window.PIXORO_ID_TO_NAME=window.PIXORO_ID_TO_NAME||{};
window.PIXORO_NAME_TO_ID=window.PIXORO_NAME_TO_ID||{};
(Object.values(profileMap)||[]).forEach(pp=>{ window.PIXORO_ID_TO_NAME[String(pp.id)]=cleanUser(pp.username); window.PIXORO_NAME_TO_ID[cleanUser(pp.username)]=String(pp.id); });
window.PIXORO_FOLLOWING_NAMES=new Set([...window.PIXORO_FOLLOWING].map(id=>cleanUser(window.PIXORO_ID_TO_NAME[id]||'')));
render();}catch(err){console.log(err)}}
async function addRealView(postId){
  postId=String(postId);
  if(!pixoroIsUuidLocal(postId) || !pixoroIsUuidLocal(ME_ID)) return;
  if(viewedPosts.has(postId)) return;
  viewedPosts.add(postId);
  let already = allViews.some(v=>String(v.post_id)==String(postId) && String(v.user_id)==String(ME_ID));
  if(already) return;
  allViews.push({post_id:postId, user_id:ME_ID});
  let cnt = allViews.filter(v=>String(v.post_id)==String(postId)).length;
  let el = document.querySelector(`[data-viewcount="${postId}"]`);
  if(el) el.innerText = fmtViews(cnt);
  supa=getSupa(); if(!supa) return;
  let {error} = await supa.from('views').insert({post_id:postId, user_id:ME_ID});
  if(error){ allViews = allViews.filter(v=>!(String(v.post_id)==String(postId) && String(v.user_id)==String(ME_ID))); }
}
function nextReel(currentVideo){
  let reels=[...document.querySelectorAll('.reel')];
  let cur=currentVideo.closest('.reel');
  let idx=reels.indexOf(cur);
  let next=reels[idx+1] || reels[0];
  if(next){ next.scrollIntoView({behavior:'auto',block:'start'}); }
}
function parseHashtags(text){return (text||'').replace(/#(\w+)/g,'<span class="hashtag" onclick="event.stopPropagation();openHashtag(\'$1\')">#$1</span>')}
function showCenter(reel,isPaused){let c=reel.querySelector('.centerCtrl');if(!c) return;c.innerHTML='<div class="centerIcon">'+(isPaused?'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="#fff"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z" fill="#fff"/></svg>')+'</div>';c.classList.add('show'); setTimeout(()=>c.classList.remove('show'),700);}
function getBestMedia(p){
  if(p._from==='reels'){ return {url: p.video_url||p.media_url||'', isVid:true}; }
  let m=(p.media_url||p.video_url||'').toLowerCase().split('?')[0];
  if(m.endsWith('.mp4')||m.endsWith('.mov')||m.endsWith('.webm')||m.endsWith('.m4v')){ return {url: p.media_url||p.video_url, isVid:true}; }
  return {url: p.media_url||p.video_url||p.image_url||'', isVid:false};
}
function render(){
let wrap=document.getElementById('reelWrap');
if(!wrap) return;
let visiblePosts=allPosts.filter(p=>!hiddenPosts.includes(String(p.id)) && !mutedUsers.includes(String(p.user_id)) && !blockedUsers.includes(String(p.user_id)) && !p.is_archived);
if(visiblePosts.length===0){ wrap.innerHTML=`<div style="color:#fff;text-align:center;padding:120px 20px">No Reels da<br><span style="color:#888;font-size:13px">Plus button la poi oru Reel podu da</span><br><br><button onclick="location.href='index.html'" style="background:#FF4D8D;color:#fff;border:0;padding:10px 20px;border-radius:20px;font-weight:800">Go Home</button></div>`; return; }
wrap.innerHTML=visiblePosts.map((p,idx)=>{
let lc=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;
let liked=allLikes.some(l=>String(l.post_id)==String(p.id)&&String(l.user_id)==String(ME_ID));
let saved=allSaves.some(s=>String(s.post_id)==String(p.id)&&String(s.user_id)==String(ME_ID));
let followName=displayNameFor(p.user_id||p.username);
let tick = window.goldTickHTML ? window.goldTickHTML(profileByIdMap[String(p.user_id)]||{username:followName}) : '';
let isFollow = window.PIXORO_FOLLOWING_NAMES ? window.PIXORO_FOLLOWING_NAMES.has(followName) : (window.PIXORO_FOLLOWING ? window.PIXORO_FOLLOWING.has(String(p.user_id)) : allFollows.some(f=>String(f.follower_id)===String(ME_ID)&&String(f.following_id)==String(p.user_id)));
let isMine=isMyPostObj(p);
let best=getBestMedia(p);
let vCount=allViews.filter(v=>String(v.post_id)==String(p.id)).length;
let media='';
if(best.isVid){
  if(idx===0) media=`<video class="reel-main" src="${best.url}" playsinline preload="metadata" muted loop onended="nextReel(this)"></video>`;
  else media=`<video class="reel-main" data-src="${best.url}" playsinline preload="none" muted loop onended="nextReel(this)"></video>`;
} else {
  media=`<img class="reel-main" src="${best.url}" crossorigin="anonymous" loading="${idx===0?'eager':'lazy'}" decoding="async" fetchpriority="${idx===0?'high':'low'}">`;
}
let followBtn=isMine||!followName||followName==='null'||followName==='user'?'':`<button data-follow-user="${followName}" data-follow-username="${followName}" id="followBtn-${p.id}" class="followBtnPerusa ${isFollow?'following':''}" onclick="event.stopPropagation();pixoroToggleFollow('${followName}',this)">${isFollow?'Following':'Follow'}</button>`;
let likeCount = lc>0?lc:''; let commentCount = allComments.filter(c=>String(c.post_id)==String(p.id)).length;
let parsedCaption=parseHashtags(p.caption||'');
let captionHtml = parsedCaption ? `<div class="reel-caption"><span>${parsedCaption}</span></div>` : '';
return `<div class="reel" data-id="${p.id}" onclick="handleReelTap(this)"><div class="progress"></div>${media}<div class="heartBurst"></div><div class="centerCtrl"></div>
<div class="vBar">
<div class="vBtn ${liked?'liked':''}" id="likeBtn-${p.id}" onclick="event.stopPropagation();toggleLike('${p.id}')"><svg id="likeSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${liked?'#ff3040':'none'}" stroke="${liked?'#ff3040':'#fff'}" stroke-width="1.8"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg><span id="likeCnt-${p.id}">${likeCount}</span></div>
<div class="vBtn" onclick="event.stopPropagation();openCommentSheet('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>${commentCount||''}</span></div>
<div class="vBtn" onclick="event.stopPropagation();openShareSheet('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
<div class="vBtn ${saved?'saved':''}" id="saveBtn-${p.id}" onclick="event.stopPropagation();saveR('${p.id}')"><svg id="saveSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${saved?'#fff':'none'}" stroke="#fff" stroke-width="1.8"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></div>
<div class="vBtn tildeBtn" onclick="event.stopPropagation();openPixoroSheet('${p.id}','${p.user_id}','${followName}')"><span>~</span></div>
<div class="audioWrap" onclick="event.stopPropagation();toggleMuteAll()"><div class="audioDiscInBar">🎵</div></div>
</div>
<div class="btm"><div style="display:flex;align-items:center;gap:10px"><div class="reel-pfp-wrap" onclick="event.stopPropagation();location.href='profile.html?u=${p.user_id}'"><img src="${getPfp(p.user_id)}" onerror="pfpErr(this,'${followName}')" loading="lazy"></div><b class="reel-username" onclick="event.stopPropagation();location.href='profile.html?u=${p.user_id}'">${followName}${tick}</b>${followBtn}</div>${captionHtml}<div style="font-size:12px;color:#ddd;margin-top:6px;font-weight:700">▶ <span data-viewcount="${p.id}">${fmtViews(vCount)}</span> views</div></div>
</div>`
}).join('');observe(); if(window.pixoroPaintAllFollowBtns) window.pixoroPaintAllFollowBtns();}
let _reelIO=null;
function observe(){
  let reels=document.querySelectorAll('video.reel-main');
  if(_reelIO) _reelIO.disconnect();
  _reelIO=new IntersectionObserver(entries=>{entries.forEach(e=>{let v=e.target;if(v.tagName!='VIDEO')return;let reel=v.closest('.reel');let prog=reel?reel.querySelector('.progress'):null;if(e.isIntersecting){if(!v.src && v.dataset.src){ v.src=v.dataset.src; v.load(); }document.querySelectorAll('video.reel-main').forEach(o=>{if(o!==v){o.pause();}});v.muted=globalMuted;currentVideo=v;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});if(prog){v.ontimeupdate=()=>{if(v.duration)prog.style.width=(v.currentTime/v.duration*100)+'%'}}addRealView(reel.dataset.id);}else{v.pause()}})}, {threshold:0.6, rootMargin:'0px 0px'});
  reels.forEach(v=>_reelIO.observe(v));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) document.querySelectorAll('video').forEach(v=>v.pause()); },{once:true});
}
function handleReelTap(el){let now=Date.now();if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;dblLike(el.dataset.id);return}lastTap=now;tapTimer=setTimeout(()=>{let v=el.querySelector('video.reel-main');if(v){if(!v.src && v.dataset.src){v.src=v.dataset.src;v.load();}if(v.paused){v.muted=false;globalMuted=false;currentVideo=v;v.play();showCenter(el,false)}else{v.pause();showCenter(el,true)}}lastTap=0},300)}
async function dblLike(id){
  if(!pixoroIsUuidLocal(ME_ID) || !pixoroIsUuidLocal(id)) return;
  let reel=document.querySelector(`.reel[data-id="${id}"]`);let b=reel?reel.querySelector('.heartBurst'):null;
  if(b){b.classList.remove('show');void b.offsetWidth;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),900)}
  let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));
  if(!liked){
    allLikes.push({post_id:id,user_id:ME_ID});updateLikeUI(id,true);
    supa=getSupa(); if(!supa) return;
    let {error} = await supa.from('likes').upsert({post_id:id,user_id:ME_ID},{onConflict:'post_id,user_id'});
    if(error){ allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID))); updateLikeUI(id,false); showToast('Like Save Aagala da'); }
  }
}
async function toggleLike(id){
  if(!pixoroIsUuidLocal(ME_ID) || !pixoroIsUuidLocal(id)) return;
  let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));
  supa=getSupa(); if(!supa) return;
  if(!liked){
    allLikes.push({post_id:id,user_id:ME_ID});updateLikeUI(id,true);
    let {error} = await supa.from('likes').upsert({post_id:id,user_id:ME_ID},{onConflict:'post_id,user_id'});
    if(error){ allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID))); updateLikeUI(id,false); showToast('Like Save Aagala da: '+error.message); }
  } else {
    allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID)));updateLikeUI(id,false);
    let {error} = await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID);
    if(error){ allLikes.push({post_id:id,user_id:ME_ID}); updateLikeUI(id,true); }
  }
}
function updateLikeUI(id,liked){let btn=document.getElementById('likeBtn-'+id);let svg=document.getElementById('likeSvg-'+id);let cnt=document.getElementById('likeCnt-'+id);if(btn){if(liked)btn.classList.add('liked');else btn.classList.remove('liked')}if(svg){svg.setAttribute('fill',liked?'#ff3040':'none');svg.setAttribute('stroke',liked?'#ff3040':'#fff');}if(cnt){let n=allLikes.filter(l=>String(l.post_id)==String(id)).length;cnt.innerText=n>0?n:''}}
function openPixoroSheet(postId, userId, username){ curSheetId=postId; curSheetUser=userId; curSheetUsername=username; let isMine = String(userId)===String(ME_ID) || cleanUser(username)===cleanUser(ME_RAW); if(isMine){ document.getElementById('ownerSheet').classList.add('show'); } else { document.getElementById('viewerSheet').classList.add('show'); } }
function openFriendProfile(){ if(curSheetUser) location.href='profile.html?u='+curSheetUser; }
window.openFriendProfile=openFriendProfile;
function editReel(){ if(curSheetId) location.href='edit.html?id='+curSheetId; }

async function deleteSafe(){

  let p = allPosts.find(x=>String(x.id)===String(curSheetId));
  if(p && !isMyPostObj(p)){ showToast('Un reel mattum delete panna mudiyum da'); closeSheet('ownerSheet'); return; }
  if(hiddenPosts.includes(String(curSheetId))) return;
  hiddenPosts.push(String(curSheetId));
  supa=getSupa();
  if(supa){
    if(p && p._from==='posts') supa.from('posts').update({is_archived:true}).eq('id',curSheetId).then(()=>{});
    if(p && p._from==='reels') supa.from('posts').update({is_archived:true}).eq('id',curSheetId).then(()=>{});
  }
  setTimeout(()=>render(),200); closeSheet('ownerSheet'); showToast('Deleted da');
}

async function postComment(){
  let inp=document.getElementById('commentInput');let t=inp.value.trim();if(!t||!curCommentPost)return;
  if(!pixoroIsUuidLocal(ME_ID) || !pixoroIsUuidLocal(curCommentPost)) return;
  let tmp={id:'tmp_'+Date.now(),post_id:curCommentPost,user_id:ME_ID,text:t};
  allComments.unshift(tmp);inp.value='';openCommentSheet(curCommentPost);
  supa=getSupa(); if(!supa) return;
  let {error} = await supa.from('comments').insert({post_id:curCommentPost,user_id:ME_ID,text:t});
  if(error){ allComments = allComments.filter(c=>c.id!==tmp.id); openCommentSheet(curCommentPost); showToast('Comment Save Aagala da'); }
}

function updateSaveUI(id,saved){
  let btn=document.getElementById('saveBtn-'+id); let svg=document.getElementById('saveSvg-'+id);
  if(btn) btn.classList.toggle('saved',saved);
  if(svg) svg.setAttribute('fill',saved?'#fff':'none');
}
async function saveR(id){
  id=String(id);
  if(!pixoroIsUuidLocal(ME_ID) || !pixoroIsUuidLocal(id)) return;
  if(savingIds.has(id)) return; savingIds.add(id);
  try{
    let isSaved=allSaves.some(x=>String(x.post_id)===id && String(x.user_id)===String(ME_ID));
    supa=getSupa(); if(!supa) return;
    if(isSaved){
      allSaves=allSaves.filter(x=>!(String(x.post_id)===id && String(x.user_id)===String(ME_ID))); updateSaveUI(id,false);
      let {error} = await supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID);
      if(error){ allSaves.push({post_id:id,user_id:ME_ID}); updateSaveUI(id,true); }
    } else {
      allSaves.push({post_id:id,user_id:ME_ID}); updateSaveUI(id,true);
      let {data,error} = await supa.from('saves').upsert({post_id:id,user_id:ME_ID},{onConflict:'post_id,user_id'}).select().single();
      if(error){ allSaves=allSaves.filter(x=>!(String(x.post_id)===id && String(x.user_id)===String(ME_ID))); updateSaveUI(id,false); showToast('Save Aagala da'); }
      else if(data) allSaves[allSaves.length-1]=data;
    }
  } finally { savingIds.delete(id); }
}
function checkMiniUpload(){
  let up=new URLSearchParams(location.search);
  let uploading=up.get('uploading');
  let media=up.get('media');
  if(!uploading || !media) return;
  let box=document.getElementById('miniBox');
  if(!box) return;
  box.style.display='flex';
  let mi=document.getElementById('miniImg'); if(mi) mi.src=media;
  let mp=document.getElementById('miniPct'); if(mp) mp.innerText='10%';
  let mf=document.getElementById('miniFill'); if(mf) mf.style.width='10%';
  let mt=document.getElementById('miniTxt'); if(mt) mt.innerText='Mella Upload Aaguthu da - Reels Paakalam da';
  let tries=0;
  let iv=setInterval(async ()=>{
    tries++;
    let pct=Math.min(90, 10 + tries*15);
    let mf2=document.getElementById('miniFill'); if(mf2) mf2.style.width=pct+'%';
    let mp2=document.getElementById('miniPct'); if(mp2) mp2.innerText=pct+'%';
    try{
      let s=getSupa();
      if(s){
        let {data}=await s.from('posts').select('id').eq('media_url',media).limit(1);
        if(data && data.length){
          clearInterval(iv);
          let mf3=document.getElementById('miniFill'); if(mf3) mf3.style.width='100%';
          let mp3=document.getElementById('miniPct'); if(mp3) mp3.innerText='100%';
          let mt3=document.getElementById('miniTxt'); if(mt3) mt3.innerText='Done da 🔥 - Reel Reels la Irukku da';
          showToast('Reel Upload Done da 🔥');
          setTimeout(()=>{box.style.display='none';},2500);
          if(typeof load==='function') load();
          return;
        }
      }
    }catch(e){}
    if(tries>10){
      clearInterval(iv);
      let mf4=document.getElementById('miniFill'); if(mf4) mf4.style.width='100%';
      let mp4=document.getElementById('miniPct'); if(mp4) mp4.innerText='100%';
      let mt4=document.getElementById('miniTxt'); if(mt4) mt4.innerText='Done da 🔥';
      setTimeout(()=>{box.style.display='none';},2000);
    }
  },1200);
}
checkMiniUpload();
