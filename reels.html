<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Pixoro Reels - Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;width:100vw;height:100dvh;overflow:hidden}
.reelWrap{width:100vw;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;display:flex;flex-direction:column;background:#000}
.reelWrap::-webkit-scrollbar{display:none}
.reel{width:100vw!important;height:100dvh!important;flex-shrink:0;position:relative;scroll-snap-align:start;scroll-snap-stop:always!important;background:#000;overflow:hidden}
.reel video,.reel img{width:100%;height:100%;object-fit:contain!important;background:#000}
.progress{position:absolute;top:0;left:0;height:2px;background:#FFD700;width:0%;z-index:20}
.vBar{position:absolute;right:10px;bottom:95px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:10}
.vBtn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.vBtn span{font-size:11px;font-weight:600}
.centerCtrl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;z-index:40;pointer-events:none}
.centerCtrl.show{display:flex;flex-direction:column;gap:16px;align-items:center}
.btm{position:absolute;left:12px;right:70px;bottom:75px;z-index:10;text-shadow:0 1px 4px #000}
.detailsBtn{background:#fff!important;color:#000!important;border:0!important;padding:8px 18px!important;border-radius:20px!important;font-size:13px!important;font-weight:800!important;margin-left:8px;cursor:pointer}
.followBtnRBig{background:#0095f6;color:#fff;border:0;padding:9px 22px;border-radius:20px;font-weight:800;font-size:14px;margin-left:8px}
.heartBurst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:90px;pointer-events:none;z-index:30;opacity:0}
.heartBurst.show{animation:burst .9s forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.reelsTop{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;justify-content:space-between;padding:10px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);height:56px;align-items:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}
.bottom-nav a.active{color:#fff}
.bottom-nav span{font-size:10px}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover}
.menuSheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:flex-end;justify-content:center}
.menuSheet.show{display:flex}
.menuBox{background:#1a1a1a;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:12px 14px 30px;max-height:85vh;overflow-y:auto}
.menuItem{padding:14px 12px;border-bottom:1px solid #222;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.reel-pfp-wrap{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid #fff;cursor:pointer;background:#222}
.reel-pfp-wrap img{width:100%!important;height:100%!important;object-fit:cover}
.reel-username{font-size:17px;font-weight:700;cursor:pointer}
.audioDisc{width:36px;height:36px;border-radius:50%;border:2.5px solid #fff;overflow:hidden;animation:spin 5s linear infinite;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{padding:7px 12px;border-radius:20px;background:#222;color:#fff;font-size:12px;font-weight:700;cursor:pointer;border:1px solid #333}
.chip.on{background:#FFD700;color:#000}
.tog{width:46px;height:26px;background:#333;border-radius:20px;position:relative;cursor:pointer}
.tog.on{background:#FFD700}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%}
.tog.on:after{left:23px}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid #222}
.setSel{background:#222;color:#fff;border:0;padding:8px 10px;border-radius:10px;font-weight:700}
.secTitle{font-size:11px;letter-spacing:1px;color:#FFD700;font-weight:800;padding:14px 4px 4px}
</style></head><body>
<div class="reelsTop"><b style="font-size:20px">Reels</b><div style="display:flex;gap:8px"><div onclick="location.href='reel-create.html'" style="width:32px;height:32px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer">+</div><div onclick="location.href='notifications.html'" style="width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer">🔔</div></div></div>
<div class="reelWrap" id="reelWrap"><p style="text-align:center;padding-top:50vh;color:#666">Loading Reels... 🎬</p></div>
<div class="bottom-nav"><a href="index.html">🏠<span>Home</span></a><a href="search.html">🔍<span>Search</span></a><a href="reels.html" class="active">▶<span>Reels</span></a><a href="dm.html">✉️<span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<div id="cModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center"><div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column"><div style="padding:14px;text-align:center;border-bottom:1px solid #222"><b>Comments</b><span onclick="closeC()" style="float:right;cursor:pointer">✕</span></div><div id="cList" style="flex:1;overflow-y:auto;padding:10px"></div><div style="padding:10px;display:flex;gap:10px"><input id="cInput" placeholder="Add a comment..." style="flex:1;background:#222;border:0;padding:10px;border-radius:20px;color:#fff;outline:none"><button onclick="addC()" style="background:none;border:0;color:#FFD700;font-weight:700">Post</button></div></div></div>
<div id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none"></div>
<script>
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
let supa=window.supa;
function cleanUser(u){if(!u) return '';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME='',ME_ID='',profileMap={},allPosts=[],allLikes=[],allSaves=[],allFollows=[],allViews=[],curPost=null,allAds=[],blocked=[],curCat='all';
let globalMuted=true,lastTap=0,tapTimer=null,isScrolling=false;
let SET={skipSeen:false,onlyFollow:false,remember:false,sub:true,noAds:true};
let MEM={seen:[],hidden:[],history:[],watchlater:[],speed:'1',sleep:'0',q:'HD',lastReel:''};
let watchTimers={};

// ✅ FIXED 1 - 9 SECRET TRACKING - 1 AALU 1 VIEW + WATCH TIME + SKIP
async function trackView(postId, ownerId){
  if(!ME_ID||!postId) return;
  if(String(ownerId)===String(ME_ID)) return;
  if(allViews.some(v=>String(v.post_id)==String(postId)&&String(v.user_id)===String(ME_ID))) return;
  // SECRET 1 - 3 Sec Rule
  setTimeout(async()=>{
    let {error}=await supa.from('views').insert({post_id:postId,user_id:ME_ID,username:ME_RAW});
    if(!error) allViews.push({post_id:postId,user_id:ME_ID,username:ME_RAW});
  },3000);
}
async function trackEvent(postId, event, seconds){
  if(!ME_ID||!postId) return;
  try{ await supa.from('reel_events').insert({post_id:postId,user_id:ME_ID,event:event,watch_seconds:seconds||0}); }catch(e){}
}
function fmtViews(n){if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K';return String(n||0)}
async function waitSupa(){for(let i=0;i<20;i++){if(window.supa) return window.supa;await new Promise(r=>setTimeout(r,200))}return null}
async function init(){
  supa=await waitSupa(); if(!supa) return;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id; let {data:myProf}=await supa.from('profiles').select('*').eq('id',ME_ID).single();
  ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]); ME=ME_RAW;
  let {data:profs}=await supa.from('profiles').select('*'); (profs||[]).forEach(p=>profileMap[cleanUser(p.username)]=p);
  document.getElementById('navPfp').src=getPfp(ME_RAW); load();
}
function getPfp(u){let p=profileMap[cleanUser(u)]; if(p?.avatar_url) return p.avatar_url; let c=cleanUser(u)||'P'; return 'https://ui-avatars.com/api/?name='+c.charAt(0).toUpperCase()+'&background=333&color=fff&size=200&bold=true'}
function isMyPostObj(p){if(!p) return false; if(p.user_id&&String(p.user_id)===String(ME_ID)) return true; return cleanUser(p.username)===cleanUser(ME_RAW)}
async function load(){
  try{
    let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});
    let likes=(await supa.from('likes').select('*')).data||[];
    let saves=(await supa.from('saves').select('*').eq('user_id',ME_ID)).data||[];
    let follows=(await supa.from('follows').select('*')).data||[];
    let views=(await supa.from('views').select('*')).data||[];
    allPosts=(posts||[]).filter(p=>{let url=(p.media_url||p.image_url||'').toLowerCase(); let isReel=(p.media_type=='reel'||p.media_type=='video'||url.includes('.mp4')||url.includes('.mov')||url.includes('.webm')); if(!isReel) return false; if(MEM.hidden.includes(String(p.id))) return false; if(SET.skipSeen&&MEM.seen.includes(String(p.id))) return false; return true;});
    allLikes=likes; allSaves=saves; allFollows=follows; allViews=views; render();
  }catch(e){document.getElementById('reelWrap').innerHTML='<p style="text-align:center;padding-top:50vh">Error - Refresh pannu</p>'}
}
function render(){
  let wrap=document.getElementById('reelWrap'); if(!allPosts.length){wrap.innerHTML='<p style="text-align:center;padding-top:50vh;color:#666">No Reels da - + click pannu!</p>';return}
  wrap.innerHTML=allPosts.map(p=>{
    let lc=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;
    let liked=allLikes.some(l=>String(l.post_id)==String(p.id)&&l.user_id==ME_ID);
    let saved=allSaves.some(s=>String(s.post_id)==String(p.id)&&s.user_id==ME_ID);
    let isMine=isMyPostObj(p); let views=allViews.filter(v=>String(v.post_id)==String(p.id)).length;
    let badge=views>=1000?'👑 VIRAL':views>=100?'🔥 TRENDING':'';
    return `<div class="reel" data-id="${p.id}" onclick="handleReelTap(this)"><div class="progress"></div><video src="${p.media_url||p.image_url}" loop playsinline preload="none" muted></video><div class="heartBurst">❤️</div><div class="centerCtrl"></div>
    <div class="vBar">
      <div class="vBtn" onclick="event.stopPropagation();toggleLike('${p.id}')"><span style="font-size:28px">${liked?'❤️':'🤍'}</span><span id="likeCnt-${p.id}">${lc||''}</span></div>
      <div class="vBtn" onclick="event.stopPropagation();openC('${p.id}')"><span style="font-size:26px">💬</span></div>
      <div class="vBtn" onclick="event.stopPropagation();shareR('${p.id}')"><span style="font-size:26px">↗️</span></div>
      <div class="vBtn" onclick="event.stopPropagation();saveR('${p.id}')"><span style="font-size:24px">${saved?'🔖':'📑'}</span></div>
      <div class="vBtn" onclick="event.stopPropagation();openAudio('${p.id}')"><img src="${getPfp(p.username)}" style="width:36px;height:36px;border-radius:50%;border:2px solid #fff"></div>
    </div>
    <div class="btm"><div style="display:flex;align-items:center;gap:8px"><div class="reel-pfp-wrap" onclick="event.stopPropagation();location.href='profile.html?u='+encodeURIComponent(cleanUser('${p.username}'))"><img src="${getPfp(p.username)}"></div><b>${cleanUser(p.username)}</b><span style="background:#FFD700;color:#000;font-size:10px;padding:2px 6px;border-radius:6px">${badge}</span></div><div style="margin-top:8px;font-size:13px">${p.caption||''}</div><div style="font-size:11px;color:#FFD700;margin-top:4px">📍 Coimbatore • 👁️ ${fmtViews(views)} • #pixoro</div></div></div>`
  }).join(''); observe();
}
// ✅ FIXED 2 - OBSERVE with WatchTime
function observe(){
  let io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      let v=e.target, reel=v.closest('.reel'), rid=reel.dataset.id;
      if(e.isIntersecting){
        document.querySelectorAll('.reel video').forEach(o=>{if(o!==v)o.pause()});
        v.muted=globalMuted; v.play().catch(()=>{v.muted=true;v.play()});
        watchTimers[rid]=Date.now();
        if(!MEM.seen.includes(String(rid))) MEM.seen.push(String(rid));
        let p=allPosts.find(x=>String(x.id)==String(rid)); if(p) trackView(rid,p.user_id);
      } else {
        // Skip / Watch Event Save
        if(watchTimers[rid]){ let secs=Math.floor((Date.now()-watchTimers[rid])/1000); trackEvent(rid, secs<3?'skip':'watch', secs); delete watchTimers[rid]; }
        v.pause();
      }
    })
  },{threshold:0.7});
  document.querySelectorAll('.reel video').forEach(v=>io.observe(v));
}
function handleReelTap(el){let now=Date.now(); if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;dblLike(el.dataset.id);return} lastTap=now; tapTimer=setTimeout(()=>{let v=el.querySelector('video'); if(v){if(v.paused){v.muted=false;globalMuted=false;v.play()}else v.pause()} lastTap=0},300)}
async function dblLike(id){let b=document.querySelector(`.reel[data-id="${id}"] .heartBurst`); if(b){b.classList.remove('show');void b.offsetWidth;b.classList.add('show')} if(allLikes.some(l=>String(l.post_id)==String(id)&&l.user_id==ME_ID)) return; allLikes.push({post_id:id,user_id:ME_ID}); updateLikeUI(id,true); await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}
async function toggleLike(id){let liked=allLikes.some(l=>String(l.post_id)==String(id)&&l.user_id==ME_ID); if(!liked){allLikes.push({post_id:id,user_id:ME_ID});updateLikeUI(id,true);await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}else{allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&l.user_id==ME_ID));updateLikeUI(id,false);await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID)}}
function updateLikeUI(id,liked){let c=document.getElementById('likeCnt-'+id); if(c){let n=parseInt(c.innerText||'0')||0; c.innerText=liked?n+1:Math.max(0,n-1)}}
async function saveR(id){let s=allSaves.some(x=>String(x.post_id)==String(id)&&x.user_id==ME_ID); if(s){allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&x.user_id==ME_ID)); await supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID); showToast('Unsaved da')}else{allSaves.push({post_id:id,user_id:ME_ID}); await supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW}); trackEvent(id,'save',0); showToast('Saved da ✅ - Algorithm ku Pudikkum da!')}}
// ✅ FIXED 3 - Share Boost
async function shareR(id){await trackEvent(id,'share',0); let link=location.origin+'/reels.html?id='+id; if(navigator.share) navigator.share({url:link}); else {navigator.clipboard.writeText(link); showToast('Link copied da! Share = 10x Power 🔥')}}
function openAudio(id){showToast('Audio Use Panna reel-create ku Po da 🎵'); location.href='reel-create.html'}
async function openC(pid){curPost=pid;document.getElementById('cModal').style.display='flex'; let {data:cs}=await supa.from('comments').select('*').eq('post_id',pid).order('created_at',{ascending:true}); document.getElementById('cList').innerHTML=(cs||[]).map(c=>`<div style="padding:8px 0;border-bottom:1px solid #222"><b>${cleanUser(c.username)}</b> ${c.text}</div>`).join('')||'<p style="text-align:center;color:#888">No comments</p>'}
function closeC(){document.getElementById('cModal').style.display='none'}
async function addC(){let t=document.getElementById('cInput').value.trim(); if(!t||!curPost) return; await supa.from('comments').insert({post_id:curPost,user_id:ME_ID,username:ME_RAW,text:t}); document.getElementById('cInput').value=''; openC(curPost)}
init()
</script></body></html>
