<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Pixoro Reels - Perusa Audio KILLA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#000;color:#fff;width:100vw;height:100dvh;overflow:hidden}
.reelWrap{width:100vw;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.reelWrap::-webkit-scrollbar{display:none}
.reel{width:100vw!important;height:100dvh!important;flex-shrink:0;position:relative;scroll-snap-align:start;overflow:hidden;background:#000!important}
.reel-bg{display:none!important}
.reel-main{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;z-index:2!important;display:block!important}
.progress{position:absolute;top:0;left:0;height:3px;background:#fff;width:0%;z-index:20}
.vBar{position:absolute!important;right:12px!important;bottom:145px!important;display:flex!important;flex-direction:column!important;gap:20px!important;align-items:center!important;z-index:10!important}
.vBtn{display:flex!important;flex-direction:column!important;align-items:center!important;gap:4px!important;width:50px!important;cursor:pointer!important}
.vBtn span{font-size:12.5px!important;font-weight:600!important;color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.8)!important}
.vBtn svg{width:28px!important;height:28px!important;stroke:#fff!important;stroke-width:1.7!important;fill:none!important;filter:drop-shadow(0 1px 4px rgba(0,0,0,0.6))!important}

/* AUDIO PERUSA KILLA - 38px */
.audioDiscKilla{
  position:absolute!important;
  right:14px!important;
  bottom:78px!important;
  width:38px!important;
  height:38px!important;
  border-radius:50%!important;
  border:2.5px solid #fff!important;
  overflow:hidden!important;
  animation:spin 3s linear infinite!important;
  z-index:11!important;
  background:#111!important;
  box-shadow:0 3px 12px rgba(0,0,0,0.8)!important;
}
.audioDiscKilla img{width:100%!important;height:100%!important;object-fit:cover!important}
@keyframes spin{to{transform:rotate(360deg)}}

.btm{position:absolute;left:14px!important;right:70px!important;bottom:78px!important;z-index:10!important}
.reel-pfp-wrap{width:38px!important;height:38px!important;border-radius:50%!important;overflow:hidden!important;border:2.5px solid #fff!important}
.reel-pfp-wrap img{width:100%!important;height:100%!important;object-fit:cover}
.reel-username{font-size:14px!important;font-weight:600!important;margin-left:6px!important}
.followBtnRBig{background:transparent!important;color:#fff!important;border:1.2px solid #fff!important;padding:4px 14px!important;border-radius:8px!important;font-size:12px!important;height:28px!important;margin-left:10px!important}
.reelsTop{position:fixed;top:0;left:0;right:0;width:100vw;z-index:90;display:flex;justify-content:center!important;height:54px;align-items:center;background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent)}
.reelsTop b{color:#fff!important;font-size:18px!important;font-weight:600!important}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;width:100vw;height:49px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{color:#8e8e8e;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav a svg{width:24px;height:24px;stroke:#8e8e8e;stroke-width:1.8;fill:none}
.bottom-nav a.active{color:#fff!important}.bottom-nav a.active svg{stroke:#fff!important;fill:#fff!important}
.bottom-nav span{font-size:10px}.bottom-nav a.active span{color:#fff!important;font-weight:700}
.bottom-nav a img.navPfp{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff}
.heartBurst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:50;opacity:0;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.heartBurst::before{content:'❤';font-size:86px!important;background:linear-gradient(180deg,#ff7a00 0%,#ff3040 50%,#ed4956 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.heartBurst.show{animation:igHeartPop 1.1s cubic-bezier(0.17,0.89,0.32,1.28) forwards}
@keyframes igHeartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(0.92)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.centerCtrl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .25s;z-index:25;background:rgba(0,0,0,0.45);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.centerCtrl.show{opacity:1}
</style></head><body>
<div class="reelsTop"><b>Reels</b></div>
<div class="reelWrap" id="reelWrap"></div>
<div class="bottom-nav">
<a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
<a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
<a href="reels.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg><span>Reels</span></a>
<a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
<a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a>
</div>
<script>
let supa=window.supa;function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME_ID='',profileMap={},allPosts=[],allLikes=[],allSaves=[],allFollows=[],allViews=[],curPost=null,curMenuId=null,globalMuted=true,lastTap=0,tapTimer=null
async function waitSupa(){for(let i=0;i<50;i++){if(window.supa)return window.supa;await new Promise(r=>setTimeout(r,200))}return window.supa}
async function init(){supa=await waitSupa();let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}ME_ID=session.user.id;let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).single();ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);let {data:profs}=await supa.from('profiles').select('*');(profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p});let el=document.getElementById('navPfp');if(el)el.src=getPfp(ME_RAW);load()}
function getPfp(u){let p=profileMap[cleanUser(u)];if(p?.avatar_url)return p.avatar_url;return 'https://ui-avatars.com/api/?name='+(cleanUser(u).charAt(0).toUpperCase()||'P')+'&background=fff&color=000&size=200&bold=true'}
function isMyPostObj(p){if(!p)return false;if(p.user_id&&String(p.user_id)===String(ME_ID))return true;return cleanUser(p.username)===cleanUser(ME_RAW)}
let MEM={hidden:[],watchlater:[]}
async function load(){let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let likes=[],saves=[],follows=[],views=[];try{likes=(await supa.from('likes').select('*')).data||[]}catch(e){}try{saves=(await supa.from('saves').select('*').eq('user_id',ME_ID)).data||[]}catch(e){}try{follows=(await supa.from('follows').select('*')).data||[]}catch(e){}try{views=(await supa.from('views').select('*')).data||[]}catch(e){}allPosts=posts||[];allLikes=likes;allSaves=saves;allFollows=follows;allViews=views;render()}
function render(){
let wrap=document.getElementById('reelWrap');
wrap.innerHTML=allPosts.map(p=>{
let lc=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;let liked=allLikes.some(l=>String(l.post_id)==String(p.id)&&String(l.user_id)==String(ME_ID));let saved=allSaves.some(s=>String(s.post_id)==String(p.id)&&String(s.user_id)==String(ME_ID));let isFollow=allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(p.user_id));let isMine=isMyPostObj(p);let mUrl=p.media_url||p.image_url||p.video_url||'';let isVid=mUrl.toLowerCase().includes('.mp4')||p.media_type=='video';
let media=isVid?`<video class="reel-main" src="${mUrl}" playsinline preload="auto" loop muted poster="${p.thumbnail_url||''}"></video>`:`<img class="reel-main" src="${mUrl}">`;
let followBtn=isMine?`<span class="detailsBtn">Details</span>`:`<button class="followBtnRBig">${isFollow?'Following':'Follow'}</button>`;
let likeCount = lc>0 ? lc : '1';
return `<div class="reel" data-id="${p.id}"><div class="progress"></div>${media}<div class="heartBurst"></div><div class="centerCtrl"></div><div class="vBar"><div class="vBtn"><svg viewBox="0 0 24 24" width="28" height="28" fill="${liked?'#ed4956':'none'}" stroke="#fff" stroke-width="1.7"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg><span>${likeCount}</span></div><div class="vBtn"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.7"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div class="vBtn"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.7"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div><div class="vBtn"><svg viewBox="0 0 24 24" width="28" height="28" fill="${saved?'#fff':'none'}" stroke="#fff" stroke-width="1.7"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></div><div class="vBtn"><span style="font-size:20px;font-weight:700">⋮</span></div></div><div class="audioDiscKilla"><img src="${getPfp(p.username)}"></div><div class="btm"><div style="display:flex;align-items:center;gap:8px"><div class="reel-pfp-wrap"><img src="${getPfp(p.username)}"></div><b class="reel-username">${cleanUser(p.username)}</b>${followBtn}</div><div style="margin-top:6px;font-size:13px">${p.caption||''}</div></div></div>`
}).join('')}
init()
</script></body></html>
