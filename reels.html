<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro Reels 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto;height:100vh;overflow:hidden}
.reelWrap{width:100%;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reelWrap::-webkit-scrollbar{display:none}
.reel{width:100%;height:100vh;position:relative;scroll-snap-align:start;background:#000;overflow:hidden}
.reel video,.reel img{width:100%;height:100%;object-fit:cover}
.progress{position:absolute;top:0;left:0;height:2px;background:#fff;width:0%;z-index:20;transition:width.1s linear}
.topBar{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:10}
.muteBtn{background:rgba(0,0,0,.5);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.vBar{position:absolute;right:10px;bottom:75px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:10}
.vBtn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.vBtn span{font-size:11px;font-weight:600}
.btm{position:absolute;left:12px;right:70px;bottom:70px;z-index:10;text-shadow:0 1px 4px #000}
.followBtnR{border:1.5px solid #fff;border-radius:15px;padding:3px 10px;font-size:11px;font-weight:700;background:transparent;color:#fff;margin-left:8px}
.followBtnR.following{background:#fff;color:#000}
.heartBurst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;pointer-events:none;z-index:30;transition:transform.3s cubic-bezier(.17,.89,.32,1.49)}
.heartBurst.show{transform:translate(-50%,-50%) scale(1)}

/* BOTTOM CHINNA DA - 58px */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:58px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#666}
.bottom-nav a svg{width:20px;height:20px;fill:none;stroke:#666;stroke-width:1.5}
.bottom-nav a.active{color:#fff}
.bottom-nav a.active svg{stroke:#fff}
.bottom-nav span{font-size:9px;color:#666}
.bottom-nav a.active span{color:#fff;font-weight:700}

.adBadge{position:absolute;top:50px;left:12px;background:#ffcc00;color:#000;font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px;z-index:15}
.topPlus{width:32px;height:32px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer}
.bellWhite{width:32px;height:32px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style></head><body>

<div style="position:fixed;top:0;left:0;right:0;max-width:450px;margin:0 auto;z-index:90;display:flex;justify-content:space-between;padding:8px 10px;background:linear-gradient(to bottom, rgba(0,0,0,.8), transparent);height:52px;align-items:center">
  <b style="font-size:18px">Reels</b>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="topPlus" onclick="document.getElementById('createSheet').style.display='flex'">+</div>
    <div class="bellWhite" onclick="location.href='notifications.html'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 9 6 9H0s6-2 6-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
    </div>
  </div>
</div>

<div class="reelWrap" id="reelWrap"><p style="text-align:center;padding-top:50vh;color:#666">Loading Reels... 🎬</p></div>

<div class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
  <a href="reels.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg><span>Reels</span></a>
  <a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg><span>Profile</span></a>
</div>

<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#1a1a1a;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;border:1px solid #333"><div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px">Create New</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div onclick="location.href='upload.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:28px">📸</div><div style="margin-top:6px;font-weight:700">Post</div></div>
<div onclick="location.href='reels-upload.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:28px">🎞️</div><div style="margin-top:6px;font-weight:700">Reels</div></div>
<div onclick="location.href='story-add.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:28px">⭕</div><div style="margin-top:6px;font-weight:700">Story</div></div>
<div onclick="location.href='live.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:28px">🔴</div><div style="margin-top:6px;font-weight:700">Live</div></div>
</div><div onclick="document.getElementById('createSheet').style.display='none'" style="margin-top:16px;text-align:center;background:#000;padding:12px;border-radius:12px;color:#888;border:1px solid #333">Cancel</div></div></div>

<div id="cModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center">
<div style="background:#121212;width:100%;max-width:450px;border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column">
<div style="padding:14px;display:flex;justify-content:center;border-bottom:1px solid #222;position:relative"><div style="width:40px;height:4px;background:#333;border-radius:10px"></div><b style="position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:14px">Comments</b><span onclick="closeC()" style="position:absolute;right:15px;top:10px;font-size:22px;cursor:pointer">✕</span></div>
<div id="cList" style="flex:1;overflow-y:auto;padding:10px 12px;min-height:200px"></div>
<div style="padding:10px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;background:#000"><input id="cInput" placeholder="Add a comment..." style="flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff;outline:none"><button onclick="addC()" style="background:none;border:0;color:#0095f6;font-weight:700">Post</button></div>
</div>
</div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME=localStorage.getItem('pixoro_current_user')||'Giri'
let allPosts=[],allLikes=[],allSaves=[],allFollows=[],allComments=[],allCLikes=[],curPost=null, allAds=[]
async function load(){
 try{
  let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false})
  let {data:likes}=await supa.from('likes').select('*')
  let {data:saves}=await supa.from('saves').select('*').eq('username',ME)
  let {data:follows}=await supa.from('follows').select('*')
  let {data:ads}=await supa.from('pixoro_ads').select('*').eq('is_active',true)
  allPosts=posts||[]; allLikes=likes||[]; allSaves=saves||[]; allFollows=follows||[]; allAds=ads||[]
  if(!allPosts.length) throw new Error('empty')
 }catch(e){
  allPosts=[{id:1,username:'Giri',caption:'Pixoro Reels 🔥',image_url:'https://picsum.photos/400/800?random=10'}]
 }
 render()
}
function render(){
 let wrap=document.getElementById('reelWrap')
 let merged=[]; let adIdx=0
 for(let i=0;i<allPosts.length;i++){ merged.push({type:'post', data:allPosts[i]}); if((i+1)%3===0 && allAds.length>0){ merged.push({type:'ad', data:allAds[adIdx%allAds.length]}); adIdx++ } }
 wrap.innerHTML=merged.map(item=>{
  if(item.type==='ad'){
    let ad=item.data; let mediaUrl=ad.video_url||ad.image_url; let isVideo=mediaUrl&&mediaUrl.includes('.mp4')
    let media=isVideo?`<video src="${mediaUrl}" loop muted playsinline></video>`:`<img src="${mediaUrl}">`
    return `<div class="reel"><div class="progress"></div>${media}<div class="adBadge">Sponsored</div><div class="topBar"><b>Sponsored</b></div><div class="btm"><b>@${ad.business_name||'Shop'}</b><div>${ad.caption||''}</div><a href="${ad.link||'#'}" target="_blank" style="display:inline-block;margin-top:8px;background:#ffcc00;color:#000;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none">Order Now 🛒</a></div></div>`
  } else {
    let p=item.data; let lc=allLikes.filter(l=>l.post_id==p.id).length; let liked=allLikes.some(l=>l.post_id==p.id&&l.username==ME); let saved=allSaves.some(s=>s.post_id==p.id); let isFollow=allFollows.some(f=>f.follower==ME&&f.following==p.username)
    let media=p.image_url.includes('.mp4')?`<video src="${p.image_url}" loop muted playsinline></video>`:`<img src="${p.image_url}">`
    return `<div class="reel" data-id="${p.id}" ondblclick="like(${p.id},true)" onclick="togglePlay(this)"><div class="progress"></div>${media}<div class="heartBurst">❤️</div><div class="topBar" style="top:55px"><b>Reels</b><div class="muteBtn" onclick="event.stopPropagation();toggleMute(this)">🔇</div></div><div class="vBar"><div class="vBtn" onclick="event.stopPropagation();like(${p.id})"><svg viewBox="0 0 24 24" width="30" height="30" fill="${liked?'#ff3040':'none'}" stroke="${liked?'#ff3040':'#fff'}" stroke-width="1.8"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg><span>${lc>0?lc:''}</span></div><div class="vBtn" onclick="event.stopPropagation();openC(${p.id})"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div class="vBtn" onclick="event.stopPropagation();shareR()"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div><div class="vBtn" onclick="event.stopPropagation();saveR(${p.id})"><svg viewBox="0 0 24 24" width="26" height="26" fill="${saved?'#fff':'none'}" stroke="#fff" stroke-width="1.8"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></div><div style="width:32px;height:32px;border-radius:50%;border:2px solid #fff;overflow:hidden"><img src="https://i.pravatar.cc/100?u=${p.username}" style="width:100%;height:100%"></div></div><div class="btm"><b style="display:flex;align-items:center">@${p.username} <button class="followBtnR ${isFollow?'following':''}" onclick="event.stopPropagation();toggleF('${p.username}')">${isFollow?'Following':'Follow'}</button></b><div style="margin-top:6px;font-size:13px">${p.caption||''}</div></div></div>`
  }
 }).join('')
 observe()
}
function observe(){ let reels=document.querySelectorAll('.reel video'); let io=new IntersectionObserver(entries=>{ entries.forEach(e=>{ let v=e.target; let prog=e.target.closest('.reel').querySelector('.progress'); if(!prog) return; if(e.isIntersecting){ v.play().catch(()=>{}); v.addEventListener('timeupdate',()=>{ if(v.duration) prog.style.width=(v.currentTime/v.duration*100)+'%' } ) } else { v.pause() } }) },{threshold:0.7}); reels.forEach(v=>io.observe(v)) }
function togglePlay(el){ let v=el.querySelector('video'); if(!v) return; if(v.paused) v.play(); else v.pause() }
function toggleMute(btn){ let v=btn.closest('.reel').querySelector('video'); if(!v) return; v.muted=!v.muted; btn.textContent=v.muted?'🔇':'🔊' }
async function like(id,burst=false){ if(burst){ let b=document.querySelector(`.reel[data-id="${id}"].heartBurst`); if(b){ b.classList.add('show'); setTimeout(()=>b.classList.remove('show'),800) } } let liked=allLikes.some(l=>l.post_id==id&&l.username==ME); if(liked) await supa.from('likes').delete().eq('post_id',id).eq('username',ME); else await supa.from('likes').insert({post_id:id,username:ME}); let {data}=await supa.from('likes').select('*'); allLikes=data||[]; render() }
async function saveR(id){ let s=allSaves.some(x=>x.post_id==id); if(s) await supa.from('saves').delete().eq('post_id',id).eq('username',ME); else await supa.from('saves').insert({post_id:id,username:ME}); let {data}=await supa.from('saves').select('*').eq('username',ME); allSaves=data||[]; render() }
async function toggleF(u){ let a=allFollows.some(f=>f.follower==ME&&f.following==u); if(a) await supa.from('follows').delete().eq('follower',ME).eq('following',u); else await supa.from('follows').insert({follower:ME,following:u}); let {data}=await supa.from('follows').select('*'); allFollows=data||[]; render() }
function shareR(){ if(navigator.share) navigator.share({url:location.href}); else prompt('Copy:',location.href) }
async function openC(pid){ curPost=pid; document.getElementById('cModal').style.display='flex'; await loadC() }
function closeC(){ document.getElementById('cModal').style.display='none'; curPost=null }
async function loadC(){ let {data:cs}=await supa.from('comments').select('*').eq('post_id',curPost).order('created_at',{ascending:true}); let {data:ls}=await supa.from('comment_likes').select('*'); allComments=cs||[]; allCLikes=ls||[]; let list=document.getElementById('cList'); if(!allComments.length){ list.innerHTML=`<p style="text-align:center;color:#666;padding:30px">No comments yet!</p>`; return } list.innerHTML=allComments.map(c=>{ let cnt=allCLikes.filter(l=>l.comment_id==c.id).length; let liked=allCLikes.some(l=>l.comment_id==c.id&&l.username==ME); let isMe=c.username===ME; return `<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #111"><img src="https://i.pravatar.cc/100?u=${c.username}" style="width:28px;height:28px;border-radius:50%"><div style="flex:1"><b style="font-size:13px">@${c.username}</b> <span style="font-size:13px">${c.text}</span><div style="font-size:11px;color:#777;margin-top:3px;display:flex;gap:10px"><span onclick="likeC(${c.id})" style="font-weight:700;color:${liked?'#ff3040':'#777'};cursor:pointer">${cnt>0?cnt+' likes':'Like'}</span>${isMe?`<span onclick="delC(${c.id})" style="color:#ff3040;cursor:pointer">Delete</span>`:''}</div></div><span onclick="likeC(${c.id})" style="cursor:pointer">${liked?'❤️':'🤍'}</span></div>` }).join('') }
async function addC(){ let t=document.getElementById('cInput').value.trim(); if(!t||!curPost) return; await supa.from('comments').insert({post_id:curPost,username:ME,text:t}); document.getElementById('cInput').value=''; await loadC() }
async function likeC(cid){ let liked=allCLikes.some(l=>l.comment_id==cid&&l.username==ME); if(liked) await supa.from('comment_likes').delete().eq('comment_id',cid).eq('username',ME); else await supa.from('comment_likes').insert({comment_id:cid,username:ME}); await loadC() }
async function delC(cid){ if(!confirm('Delete?')) return; let c=allComments.find(x=>x.id==cid); if(c.username!==ME) return alert('Your comment only!'); await supa.from('comments').delete().eq('id',cid); await loadC() }
load()
</script>
</body></html>
