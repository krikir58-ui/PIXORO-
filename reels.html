<script>
let supa=window.supa;function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME_ID='',profileMap={},allPosts=[],allLikes=[],allSaves=[],allFollows=[],allViews=[],curPost=null,curMenuId=null,globalMuted=true,lastTap=0,tapTimer=null
function showCenter(reel,isPaused){let c=reel.querySelector('.centerCtrl');if(!c) return;c.innerHTML='<div class="centerIcon">'+(isPaused?'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="#fff"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z" fill="#fff"/></svg>')+'</div>';c.classList.add('show'); setTimeout(()=>c.classList.remove('show'),900);}
async function trackView(pid,oid){if(!ME_ID||!pid)return;if(String(oid)===String(ME_ID))return;if(allViews.some(v=>String(v.post_id)==String(pid)&&String(v.user_id)===String(ME_ID)))return;setTimeout(async()=>{let {error}=await supa.from('views').insert({post_id:pid,user_id:ME_ID,username:ME_RAW});if(!error)allViews.push({post_id:pid,user_id:ME_ID})},3000)}
function openAudio(id){let p=allPosts.find(x=>String(x.id)==String(id))||{};document.getElementById('audioInfo').innerHTML=`<img src="${getPfp(p.username)}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #fff"><div style="font-weight:800;margin-top:10px">${cleanUser(p.username)} • Original audio</div>`;document.getElementById('audioSheet').classList.add('show')}
async function openDetails(id){let v=allViews.filter(x=>String(x.post_id)==String(id)).length;let l=allLikes.filter(x=>String(x.post_id)==String(id)).length;document.getElementById('insightBody').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center"><div style="background:#222;padding:14px;border-radius:12px">👁️<br><b>${v}</b></div><div style="background:#222;padding:14px;border-radius:12px">❤️<br><b>${l}</b></div></div>`;document.getElementById('insightSheet').classList.add('show')}
function closeAllMenu(){document.getElementById('allMenu').classList.remove('show')}
function downloadCurrent(){if(curMenuId)downloadReel(curMenuId)}function toggleWLCurrent(){if(curMenuId)toggleWL(curMenuId)}function notInterestedCurrent(){if(curMenuId)notInterested(curMenuId)}
function toggleWL(id){if(MEM.watchlater.includes(String(id)))MEM.watchlater=MEM.watchlater.filter(x=>x!=String(id));else MEM.watchlater.push(String(id))}
function notInterested(id){allPosts=allPosts.filter(p=>String(p.id)!=String(id));MEM.hidden.push(String(id));render()}
async function downloadReel(id){let p=allPosts.find(x=>String(x.id)==String(id));if(!p)return;window.open(p.media_url||p.image_url,'_blank')}
async function waitSupa(){for(let i=0;i<50;i++){if(window.supa)return window.supa;await new Promise(r=>setTimeout(r,200))}return window.supa}
async function init(){supa=await waitSupa();if(!supa)return;let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}ME_ID=session.user.id;let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).single();ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);let {data:profs}=await supa.from('profiles').select('*');(profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p});let el=document.getElementById('navPfp');if(el)el.src=getPfp(ME_RAW);let m=document.getElementById('myCPfp');if(m)m.src=getPfp(ME_RAW);load()}
function getPfp(u){let p=profileMap[cleanUser(u)];if(p?.avatar_url)return p.avatar_url;return 'https://ui-avatars.com/api/?name='+(cleanUser(u).charAt(0).toUpperCase()||'P')+'&background=fff&color=000&size=200&bold=true'}
function openProfileFast(u){location.href='profile.html?u='+encodeURIComponent(cleanUser(u))}
function isMyPostObj(p){if(!p)return false;if(p.user_id&&String(p.user_id)===String(ME_ID))return true;return cleanUser(p.username)===cleanUser(ME_RAW)}
let curCat='all';let SET={skipSeen:false,onlyFollow:false,noAds:true};let MEM={seen:[],hidden:[],history:[],watchlater:[]}
function openAllMenu(id,isMine){curMenuId=id;let oa=document.getElementById('ownerActions');if(isMine){oa.innerHTML=`<div class="menuItem" onclick="closeAllMenu();openDetails('${id}')">📊 Details</div><div class="menuItem" style="color:#ff3040" onclick="closeAllMenu();deletePost('${id}')">🗑️ Delete Reel</div>`}else{oa.innerHTML=`<div class="menuItem" onclick="closeAllMenu()">⚠️ Report</div>`}document.getElementById('allMenu').classList.add('show')}
async function load(){try{let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let likes=[],saves=[],follows=[],views=[];try{likes=(await supa.from('likes').select('*')).data||[]}catch(e){}try{saves=(await supa.from('saves').select('*').eq('user_id',ME_ID)).data||[]}catch(e){}try{follows=(await supa.from('follows').select('*')).data||[]}catch(e){}try{views=(await supa.from('views').select('*')).data||[]}catch(e){}allPosts=(posts||[]).filter(p=>{let url=(p.media_url||p.image_url||p.video_url||'').toLowerCase();if(!url)return false;if(MEM.hidden.includes(String(p.id)))return false;return true});allLikes=likes;allSaves=saves;allFollows=follows;allViews=views;render()}catch(err){console.log(err)}}
function render(){
let wrap=document.getElementById('reelWrap');
if(!allPosts.length){wrap.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;text-align:center;padding:20px"><div style="font-size:60px">🎬</div><div style="font-size:19px;font-weight:800;margin-top:12px">No Reels Yet!</div></div>';return}
wrap.innerHTML=allPosts.map(p=>{
let lc=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;
let liked=allLikes.some(l=>String(l.post_id)==String(p.id)&&String(l.user_id)==String(ME_ID));
let saved=allSaves.some(s=>String(s.post_id)==String(p.id)&&String(s.user_id)==String(ME_ID));
let isFollow=allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(p.user_id));
let isMine=isMyPostObj(p);
let mUrl=p.media_url||p.image_url||p.video_url||'';
let isVid=mUrl.toLowerCase().includes('.mp4')||p.media_type=='video';
let media=isVid?`<video class="reel-main" src="${mUrl}" playsinline preload="auto" loop muted poster="${p.thumbnail_url||''}"></video>`:`<img class="reel-main" src="${mUrl}">`;
let followBtn=isMine?`<span class="detailsBtn" onclick="event.stopPropagation();openDetails('${p.id}')" style="background:transparent!important;color:#fff!important;border:0!important;padding:2px 6px!important;font-size:12px!important;font-weight:700!important;margin-left:10px!important">Details</span>`:`<button id="followBtn-${p.id}" class="followBtnRBig" onclick="event.stopPropagation();toggleF('${p.user_id}','${p.id}')">${isFollow?'Following':'Follow'}</button>`;
let likeCount = lc>0 ? (lc>=1000 ? (lc/1000).toFixed(1).replace('.0','')+'K' : lc) : '3680';
return `<div class="reel" data-id="${p.id}" onclick="handleReelTap(this)"><div class="progress"></div>${media}<div class="heartBurst"></div><div class="centerCtrl"></div><div class="vBar"><div class="vBtn" id="likeBtn-${p.id}" onclick="event.stopPropagation();toggleLike('${p.id}')"><svg id="likeSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${liked?'#ed4956':'none'}" stroke="${liked?'#ed4956':'#fff'}" stroke-width="1.7"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg><span id="likeCnt-${p.id}">${likeCount}</span></div><div class="vBtn" onclick="event.stopPropagation();openC('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.7"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>8</span></div><div class="vBtn" onclick="event.stopPropagation();shareR('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.7"><path d="M17 1l4 4-14 14-4 1 1-4 13-15z"/><path d="M14 5l6 6"/></svg><span>43</span></div><div class="vBtn" onclick="event.stopPropagation();shareR('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.7"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>148</span></div><div class="vBtn" onclick="event.stopPropagation();saveR('${p.id}')"><svg id="saveSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${saved?'#fff':'none'}" stroke="#fff" stroke-width="1.7"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg><span>161</span></div><div class="vBtn" onclick="event.stopPropagation();openAllMenu('${p.id}',${isMine})"><span style="font-size:20px;font-weight:700;color:#fff">⋮</span></div><div class="audioDiscKilla" onclick="event.stopPropagation();openAudio('${p.id}')"><img src="${getPfp(p.username)}"></div></div><div class="btm"><div style="display:flex;align-items:center;gap:8px"><div class="reel-pfp-wrap" onclick="event.stopPropagation();openProfileFast('${p.username}')"><img src="${getPfp(p.username)}"></div><b class="reel-username" onclick="event.stopPropagation();openProfileFast('${p.username}')">${cleanUser(p.username)}</b>${followBtn}</div><div style="margin-top:6px;font-size:13px;line-height:1.3">${p.caption||'2008 to 2026'}</div></div></div>`
}).join('');observe()}
function observe(){let reels=document.querySelectorAll('.reel-main');let io=new IntersectionObserver(entries=>{entries.forEach(e=>{let v=e.target;if(v.tagName!='VIDEO')return;let reel=v.closest('.reel');let prog=reel?reel.querySelector('.progress'):null;if(e.isIntersecting){document.querySelectorAll('.reel-main').forEach(o=>{if(o!==v&&o.tagName=='VIDEO')o.pause()});v.muted=globalMuted;v.play().catch(()=>{v.muted=true;v.play()});let rid=reel.dataset.id;if(rid){let p=allPosts.find(x=>String(x.id)==String(rid));if(p)trackView(rid,p.user_id)}if(prog)v.addEventListener('timeupdate',()=>{if(v.duration)prog.style.width=(v.currentTime/v.duration*100)+'%'} )}else{v.pause()}})},{threshold:0.6});reels.forEach(v=>{if(v.tagName=='VIDEO')io.observe(v)})}
function handleReelTap(el){let now=Date.now();if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;dblLike(el.dataset.id);return}lastTap=now;tapTimer=setTimeout(()=>{let v=el.querySelector('.reel-main');if(v&&v.tagName=='VIDEO'){if(v.paused){v.muted=false;globalMuted=false;v.play();showCenter(el,false)}else{v.pause();showCenter(el,true)}}lastTap=0},300)}
async function dblLike(id){let reel=document.querySelector(`.reel[data-id="${id}"]`);let b=reel?reel.querySelector('.heartBurst'):null;if(b){b.classList.remove('show');void b.offsetWidth;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1150)}let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));if(liked)return;allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});updateLikeUI(id,true);try{await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}catch(e){}}
async function toggleLike(id){let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));if(!liked){allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});updateLikeUI(id,true);let r=await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW});if(r.error){allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID)));updateLikeUI(id,false)}}else{allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID)));updateLikeUI(id,false);await supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID)}}
function updateLikeUI(id,liked){let svg=document.getElementById('likeSvg-'+id);let cnt=document.getElementById('likeCnt-'+id);if(svg){svg.setAttribute('fill',liked?'#ed4956':'none');svg.setAttribute('stroke',liked?'#ed4956':'#fff');svg.style.transform= liked ? 'scale(1.15)' : 'scale(1)';setTimeout(()=>{svg.style.transform='scale(1)'},180);}if(cnt){let n=allLikes.filter(l=>String(l.post_id)==String(id)).length;cnt.innerText = n>0 ? (n>=1000 ? (n/1000).toFixed(1).replace('.0','')+'K' : n) : '3680';}}
async function saveR(id){let s=allSaves.some(x=>String(x.post_id)==String(id)&&String(x.user_id)==String(ME_ID));let svg=document.getElementById('saveSvg-'+id);if(s){allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&String(x.user_id)==String(ME_ID)));if(svg)svg.setAttribute('fill','none');supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID)}else{allSaves.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(svg)svg.setAttribute('fill','#fff');await supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}}
async function toggleF(uid,pid){if(!uid||String(uid)==String(ME_ID))return;let isF=allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(uid));document.querySelectorAll('[id^="followBtn-"]').forEach(b=>{let bid=b.id.replace('followBtn-','');let pp=allPosts.find(x=>String(x.id)==String(bid));if(pp&&String(pp.user_id)==String(uid))b.innerText=isF?'Follow':'Following'});if(isF){allFollows=allFollows.filter(f=>!(String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(uid)));await supa.from('follows').delete().eq('follower_id',ME_ID).eq('following_id',uid)}else{allFollows.push({follower_id:ME_ID,following_id:uid});await supa.from('follows').insert({follower_id:ME_ID,following_id:uid})}}
async function shareR(id){let link=location.origin+'/reels.html?id='+id;if(navigator.share)navigator.share({url:link});else{navigator.clipboard.writeText(link)}}
async function deletePost(pid){await supa.from('posts').delete().eq('id',pid);allPosts=allPosts.filter(p=>String(p.id)!=String(pid));render()}
async function openC(pid){curPost=pid;document.getElementById('cModal').style.display='flex';await loadC()}
function closeC(){document.getElementById('cModal').style.display='none';curPost=null}
async function loadC(){let {data:cs}=await supa.from('comments').select('*').eq('post_id',curPost).order('created_at',{ascending:true});let list=document.getElementById('cList');if(!cs||!cs.length){list.innerHTML='<p style="text-align:center;color:#666;padding:30px">No comments yet!</p>';return}list.innerHTML=cs.map(c=>`<div style="display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #111"><img src="${getPfp(c.username)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover"><div style="flex:1"><b style="font-size:13px">${cleanUser(c.username)}</b> <span style="font-size:13px">${c.text}</span></div></div>`).join('')}
async function addC(){let t=document.getElementById('cInput').value.trim();if(!t||!curPost)return;await supa.from('comments').insert({post_id:curPost,user_id:ME_ID,username:ME_RAW,text:t});document.getElementById('cInput').value='';await loadC()}
init()
</script></body></html>
