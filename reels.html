<!DOCTYPE html>
<html><head><meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#000;color:#fff;width:100vw;height:100dvh;overflow:hidden}
.reelWrap{width:100vw;height:100dvh;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;background:#000}
.reelWrap::-webkit-scrollbar{display:none}
.reel{width:100vw!important;height:100dvh!important;flex-shrink:0;position:relative;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000!important}
.reel-main{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;z-index:2!important;display:block!important;background:#000}
.progress{position:absolute;top:0;left:0;height:2px;background:#fff;width:0%;z-index:20}
.vBar{position:absolute!important;right:10px!important;bottom:110px!important;display:flex!important;flex-direction:column!important;gap:18px!important;align-items:center!important;z-index:15!important}
.vBtn{display:flex!important;flex-direction:column!important;align-items:center!important;gap:4px!important;width:48px!important;cursor:pointer!important}
.vBtn span{font-size:11px!important;font-weight:700!important;color:#fff!important;text-shadow:0 1px 4px rgba(0,0,0,0.9)!important}
.vBtn svg{width:28px!important;height:28px!important;stroke:#fff!important;fill:none!important;stroke-width:1.8!important;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.8))!important}
.vBtn:active{transform:scale(0.85)}
.vBtn.liked svg{fill:#ff3040!important;stroke:#ff3040!important}
.vBtn.saved svg{fill:#fff!important;stroke:#fff!important}
.vBtn.tildeBtn{background:transparent!important;border:none!important;backdrop-filter:none!important;box-shadow:none!important;width:36px!important;height:36px!important;margin-top:5px!important;display:flex!important;align-items:center!important;justify-content:center!important}
.vBtn.tildeBtn span{font-size:20px!important;font-weight:900!important;color:#fff!important;text-shadow:0 2px 6px rgba(0,0,0,0.9)!important}
.audioDiscPerusa{position:absolute!important;right:12px!important;bottom:68px!important;width:32px!important;height:32px!important;border-radius:50%!important;border:2px solid #fff!important;overflow:hidden!important;animation:spin 3.5s linear infinite!important;z-index:12!important;background:#111!important}
.audioDiscPerusa img{width:100%!important;height:100%!important;object-fit:cover!important}
@keyframes spin{to{transform:rotate(360deg)}}
.btm{position:absolute!important;left:10px!important;right:82px!important;bottom:68px!important;z-index:10!important;text-shadow:0 2px 8px rgba(0,0,0,0.9)!important;display:block!important}
.reel-pfp-wrap{width:32px!important;height:32px!important;min-width:32px!important;border-radius:50%!important;overflow:hidden!important;border:1.8px solid #fff!important}
.reel-pfp-wrap img{width:100%!important;height:100%!important;object-fit:cover}
.reel-username{font-size:13.5px!important;font-weight:600!important;margin-left:6px!important}
.reel-caption{margin-top:6px!important;font-size:12.5px!important;color:#ddd!important;line-height:1.3;display:block!important;max-height:46px!important;overflow:hidden!important}
.followBtnPerusa{background:rgba(255,255,255,0.22)!important;color:#fff!important;border:1.2px solid #fff!important;padding:7px 16px!important;border-radius:8px!important;font-weight:700!important;font-size:13px!important;margin-left:8px!important;height:32px!important;backdrop-filter:blur(8px)}
.reelsTop{position:fixed;top:0;left:0;right:0;width:100vw;z-index:90;display:flex!important;justify-content:space-between!important;align-items:center!important;height:56px;padding:0 16px;background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent)}
.reelsTop b{color:#fff!important;font-size:24px!important;font-weight:800!important}
/* Audio + Search mella - Killa visible */
.musicBar{position:absolute!important;left:10px!important;right:82px!important;bottom:18px!important;z-index:11!important;display:flex!important;align-items:center!important;gap:8px!important;background:rgba(0,0,0,0.5)!important;padding:6px 12px!important;border-radius:16px!important;backdrop-filter:blur(8px)!important;border:1px solid rgba(255,255,255,0.18)!important}
.musicBar .searchBtnMella{width:28px!important;height:28px!important;background:rgba(255,255,255,0.15)!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;border:1px solid rgba(255,255,255,0.2)!important;flex-shrink:0!important}
.realInfo{display:none!important}
.aiBadge{display:none!important}
.hashtag{color:#00bfff!important;font-weight:700!important;cursor:pointer!important}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;width:100vw;height:52px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{color:#8e8e8e;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom-nav a svg{width:24px;height:24px;stroke:#8e8e8e;stroke-width:1.8;fill:none}
.bottom-nav a.active{color:#fff!important}.bottom-nav a.active svg{stroke:#fff!important;fill:#fff!important}
.bottom-nav span{font-size:10px}.bottom-nav a.active span{color:#fff!important;font-weight:700}
.bottom-nav a img.navPfp{width:24px;height:24px;border-radius:50%;border:1.5px solid #fff}
.centerCtrl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .25s;z-index:25;background:rgba(0,0,0,0.6);width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.centerCtrl.show{opacity:1}
.centerIcon svg{width:36px!important;height:36px!important;fill:#fff!important}
.heartBurst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:50;opacity:0;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.heartBurst::before{content:'❤';font-size:90px!important;background:linear-gradient(180deg,#ff7a00 0%,#ff3040 50%,#ed4956 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.heartBurst.show{animation:igHeartPop 1.1s cubic-bezier(0.17,0.89,0.32,1.28) forwards}
@keyframes igHeartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheetBox{background:#121212;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:12px 16px 30px;max-height:85vh;display:flex;flex-direction:column;overflow-y:auto}
.sheetHandle{width:38px;height:4px;background:#444;border-radius:10px;margin:0 auto 14px}
.sheetItem{padding:14px 12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer;justify-content:space-between}
.toggle{width:44px;height:26px;background:#333;border-radius:13px;position:relative;transition:0.3s;cursor:pointer;flex-shrink:0}
.toggle.on{background:#0095f6}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.3s}
.toggle.on::after{left:21px}
.cRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #252525}
.cRow .del{color:#ff3040;font-size:12px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="reelsTop"><b>Reels</b><div class="topRight"><div class="volBtn" id="volIcon" onclick="toggleMuteAll()" style="width:28px;height:28px;background:rgba(0,0,0,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.3)">🔊</div></div></div>
<div class="reelWrap" id="reelWrap"></div>
<div class="bottom-nav">
<a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
<a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
<a href="reels.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg><span>Reels</span></a>
<a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
<a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a>
</div>

<div class="sheet" id="tildeSheet" onclick="if(event.target==this)closeSheet('tildeSheet')"><div class="sheetBox">
<div class="sheetHandle"></div>
<div style="font-weight:800;text-align:center;font-size:18px">~ Controls ~</div>
<div style="font-size:11px;color:#888;text-align:center;margin-bottom:14px">Killa visible + Audio + Search near audio</div>
<div id="settingsList"></div>
<div style="display:flex;gap:10px;margin-top:16px"><button onclick="resetSettings()" style="flex:1;padding:12px;background:#222;color:#fff;border:0;border-radius:12px;font-weight:700">Reset</button><button onclick="closeSheet('tildeSheet')" style="flex:1;padding:12px;background:#fff;color:#000;border:0;border-radius:12px;font-weight:800">Done</button></div>
</div></div>

<div class="sheet" id="commentSheet" onclick="if(event.target==this)closeSheet('commentSheet')"><div class="sheetBox"><div class="sheetHandle"></div><div style="font-weight:700;text-align:center;margin-bottom:12px">Comments</div><div id="commentList" style="overflow-y:auto;flex:1;max-height:45vh"></div><div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #222;margin-top:10px"><input id="commentInput" style="flex:1;background:#1e1e1e;border:1px solid #333;border-radius:20px;padding:10px 14px;color:#fff;outline:none" placeholder="Add a comment..."><button onclick="postComment()" style="background:#fff;color:#000;border:0;border-radius:20px;padding:10px 18px;font-weight:800">Post</button></div></div></div>
<div class="sheet" id="shareSheet" onclick="if(event.target==this)closeSheet('shareSheet')"><div class="sheetBox"><div class="sheetHandle"></div><div style="font-weight:700;text-align:center;margin-bottom:12px">Share</div><div class="sheetItem" onclick="copyLink()">📋 Copy Link</div><div class="sheetItem" onclick="shareWhatsApp()">💚 WhatsApp</div></div></div>
<div class="sheet" id="hashtagSheet" onclick="if(event.target==this)closeSheet('hashtagSheet')"><div class="sheetBox"><div class="sheetHandle"></div><div style="font-weight:700;text-align:center;margin-bottom:12px" id="hashtagTitle">#hashtag</div><div id="hashtagList" style="overflow-y:auto;max-height:50vh"></div><div class="sheetItem" onclick="closeSheet('hashtagSheet')">❌ Close</div></div></div>

<script>
let supa=window.supa;
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME_ID='',profileMap={},allPosts=[],allLikes=[],allSaves=[],allFollows=[],allComments=[],allViews=[],curCommentPost=null,globalMuted=true,lastTap=0,tapTimer=null,curShareId=null,currentVideo=null,viewedPosts=new Set()
let defaultSettings={caption:true, likeBurst:true, followBtn:true, disc:true, progress:true, musicBar:true};
let settings=JSON.parse(localStorage.getItem('pixoro_killa_visible')||JSON.stringify(defaultSettings));
function saveSettings(){localStorage.setItem('pixoro_killa_visible',JSON.stringify(settings)); renderSettingsList(); applySettings();}
function resetSettings(){settings={...defaultSettings}; saveSettings(); render();}
function toggleSetting(k){settings[k]=!settings[k]; saveSettings();}
function renderSettingsList(){
 let items=[
  ['musicBar','🎵 Audio + Search','Mella audio pakkathula search'],
  ['caption','💬 Caption','POV #fyp - Killa visible - Cut aagathu'],
  ['followBtn','👤 Follow','Follow btn'],
  ['disc','💿 Disc','Disc - audio nera'],
  ['progress','⏩ Progress','White bar'],
  ['likeBurst','❤️ Heart','Double tap'],
 ];
 document.getElementById('settingsList').innerHTML=items.map(([k,l,d])=>`<div class="sheetItem"><div><div style="font-weight:600;font-size:13px">${l}</div><div style="font-size:11px;color:#777">${d}</div></div><div class="toggle ${settings[k]?'on':''}" onclick="toggleSetting('${k}')"></div></div>`).join('');
}
function applySettings(){
 document.querySelectorAll('.reel').forEach(reel=>{
  let music=reel.querySelector('.musicBar'); if(music) music.style.display=settings.musicBar?'flex':'none';
  let disc=reel.querySelector('.audioDiscPerusa'); if(disc) disc.style.display=settings.disc?'block':'none';
  let prog=reel.querySelector('.progress'); if(prog) prog.style.display=settings.progress?'block':'none';
  let follow=reel.querySelector('.followBtnPerusa'); if(follow) follow.style.display=settings.followBtn?'inline-flex':'none';
  let cap=reel.querySelector('.reel-caption'); if(cap) cap.style.display=settings.caption?'block':'none';
 });
}
renderSettingsList();
function getAICaption(p){let base=cleanUser(p.username);let caps=[`POV: ${base} on another level ✨`];let idx=Math.abs(String(p.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0))%caps.length;return caps[idx]+` #fyp #viral #pixoro #${base}`;}
function isAIcaption(txt){return !txt||txt==='Just Reels'||txt.length<5}
function parseHashtags(text){return (text||'').replace(/#(\w+)/g,'<span class="hashtag" onclick="event.stopPropagation();openHashtag(\'$1\')\">#$1</span>')}
function openHashtag(tag){document.getElementById('hashtagTitle').innerText='#'+tag;let filtered=allPosts.filter(p=>{let c=(p.caption||'')+' '+getAICaption(p);return c.toLowerCase().includes('#'+tag.toLowerCase())});document.getElementById('hashtagList').innerHTML=filtered.length?filtered.map(p=>`<div style="padding:10px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center;cursor:pointer" onclick="location.href='reels.html?id=${p.id}'"><img src="${getPfp(p.username)}" style="width:40px;height:40px;border-radius:8px;object-fit:cover"><div><b>${cleanUser(p.username)}</b></div></div>`).join(''):'<div style="text-align:center;padding:20px;color:#888">No reels for #'+tag+'</div>';document.getElementById('hashtagSheet').classList.add('show')}
function showCenter(reel,isPaused){let c=reel.querySelector('.centerCtrl');if(!c) return;c.innerHTML='<div class="centerIcon">'+(isPaused?'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="#fff"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z" fill="#fff"/></svg>')+'</div>';c.classList.add('show'); setTimeout(()=>c.classList.remove('show'),900);}
async function waitSupa(){for(let i=0;i<50;i++){if(window.supa)return window.supa;await new Promise(r=>setTimeout(r,200))}return window.supa}
async function init(){supa=await waitSupa();if(!supa)return;let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}ME_ID=session.user.id;let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).single();ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);let {data:profs}=await supa.from('profiles').select('*');(profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p});let el=document.getElementById('navPfp');if(el)el.src=getPfp(ME_RAW);load()}
function getPfp(u){let p=profileMap[cleanUser(u)];if(p?.avatar_url)return p.avatar_url;return 'https://ui-avatars.com/api/?name='+(cleanUser(u).charAt(0).toUpperCase()||'P')+'&background=fff&color=000&size=200&bold=true'}
function isMyPostObj(p){if(!p)return false;if(p.user_id&&String(p.user_id)===String(ME_ID))return true;return cleanUser(p.username)===cleanUser(ME_RAW)}
async function load(){try{let {data:posts}=await supa.from('posts').select('*').order('created_at',{ascending:false});let likes=[],saves=[],follows=[],comments=[],views=[];try{likes=(await supa.from('likes').select('*')).data||[]}catch(e){}try{saves=(await supa.from('saves').select('*')).data||[]}catch(e){}try{follows=(await supa.from('follows').select('*')).data||[]}catch(e){}try{comments=(await supa.from('comments').select('*').order('created_at',{ascending:false})).data||[]}catch(e){}try{views=(await supa.from('views').select('*')).data||[]}catch(e){}allPosts=posts||[];allLikes=likes;allSaves=saves;allFollows=follows;allComments=comments;allViews=views;render()}catch(err){console.log(err)}}
function getRealViewCount(postId){return allViews.filter(v=>String(v.post_id)==String(postId)).length}
async function addRealView(postId){ if(viewedPosts.has(postId)) return; viewedPosts.add(postId); let already = allViews.some(v=>String(v.post_id)==String(postId) && String(v.user_id)==String(ME_ID)); if(already) return; allViews.push({post_id:postId, user_id:ME_ID}); try{await supa.from('views').insert({post_id:postId, user_id:ME_ID})}catch(e){} }
function render(){
let wrap=document.getElementById('reelWrap');
wrap.innerHTML=allPosts.map(p=>{
let lc=allLikes.filter(l=>String(l.post_id)==String(p.id)).length;
let liked=allLikes.some(l=>String(l.post_id)==String(p.id)&&String(l.user_id)==String(ME_ID));
let saved=allSaves.some(s=>String(s.post_id)==String(p.id)&&String(s.user_id)==String(ME_ID));
let isFollow=allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(p.user_id));
let isMine=isMyPostObj(p);
let mUrl=p.media_url||p.image_url||p.video_url||'';
let isVid=mUrl.toLowerCase().includes('.mp4')||p.media_type=='video';
let media=isVid?`<video class="reel-main" src="${mUrl}" playsinline preload="auto" loop muted autoplay></video>`:`<img class="reel-main" src="${mUrl}">`;
let followBtn=isMine?`<span class="followBtnPerusa" style="border:0;background:rgba(255,255,255,0.2)!important">You</span>`:`<button id="followBtn-${p.id}" class="followBtnPerusa" onclick="event.stopPropagation();toggleF('${p.user_id}','${p.id}')">${isFollow?'Following':'Follow'}</button>`;
let likeCount = lc>0?lc:'';
let commentCount = allComments.filter(c=>String(c.post_id)==String(p.id)).length;
let aiCap=isAIcaption(p.caption);
let finalCaption=aiCap?getAICaption(p):(p.caption||'Just Reels');
let parsedCaption=parseHashtags(finalCaption);
return `<div class="reel" data-id="${p.id}" onclick="handleReelTap(this)"><div class="progress"></div>${media}<div class="heartBurst"></div><div class="centerCtrl"></div>
<div class="vBar">
<div class="vBtn ${liked?'liked':''}" id="likeBtn-${p.id}" onclick="event.stopPropagation();toggleLike('${p.id}')"><svg id="likeSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${liked?'#ff3040':'none'}" stroke="${liked?'#ff3040':'#fff'}" stroke-width="1.8"><path d="M12 21s-6.7-4.35-9.2-8.4C1.2 9.2 2.5 4 8.1 4c2.2 0 3.3 1.2 3.9 2.2C12.6 5.2 13.7 4 15.9 4 21.5 4 22.8 9.2 21.2 12.6 19 16.65 12 21 12 21z"/></svg><span id="likeCnt-${p.id}">${likeCount}</span></div>
<div class="vBtn" onclick="event.stopPropagation();openCommentSheet('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>${commentCount||''}</span></div>
<div class="vBtn" onclick="event.stopPropagation();openShareSheet('${p.id}')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
<div class="vBtn ${saved?'saved':''}" id="saveBtn-${p.id}" onclick="event.stopPropagation();saveR('${p.id}')"><svg id="saveSvg-${p.id}" viewBox="0 0 24 24" width="28" height="28" fill="${saved?'#fff':'none'}" stroke="#fff" stroke-width="1.8"><path d="M19 21L12 16L5 21V5C5 3.9 5.9 3 7 3H17C18.1 3 19 3.9 19 5V21Z"/></svg></div>
<div class="vBtn tildeBtn" onclick="event.stopPropagation();openTildeSheet()"><span>~</span></div>
</div>
<div class="audioDiscPerusa"><img src="${getPfp(p.username)}"></div>
<div class="btm"><div style="display:flex;align-items:center;gap:8px"><div class="reel-pfp-wrap"><img src="${getPfp(p.username)}"></div><b class="reel-username">${cleanUser(p.username)}</b>${followBtn}</div><div class="reel-caption"><span>${parsedCaption}</span></div></div>
<div class="musicBar"><div class="searchBtnMella" onclick="event.stopPropagation();location.href='search.html'"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg></div><div style="overflow:hidden;flex:1"><span style="font-size:11px;color:#fff;white-space:nowrap">🔍 Search • 🎵 ${cleanUser(p.username)}</span></div></div>
</div>`
}).join('');observe(); setTimeout(applySettings,100)}
function observe(){
let reels=document.querySelectorAll('.reel-main');
let io=new IntersectionObserver(entries=>{
entries.forEach(e=>{
let v=e.target;if(v.tagName!='VIDEO')return;
let reel=v.closest('.reel');let prog=reel?reel.querySelector('.progress'):null;
if(e.isIntersecting){

v.muted=globalMuted;currentVideo=v;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});

function handleReelTap(el){let now=Date.now();if(now-lastTap<300){clearTimeout(tapTimer);lastTap=0;dblLike(el.dataset.id);return}lastTap=now;tapTimer=setTimeout(()=>{let v=el.querySelector('.reel-main');if(v&&v.tagName=='VIDEO'){if(v.paused){v.muted=false;globalMuted=false;currentVideo=v;v.play();showCenter(el,false)}else{v.pause();showCenter(el,true)}}lastTap=0},300)}
async function dblLike(id){let reel=document.querySelector(`.reel[data-id="${id}"]`);let b=reel?reel.querySelector('.heartBurst'):null;if(b && settings.likeBurst){b.classList.remove('show');void b.offsetWidth;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1150)}let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));if(!liked){allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});updateLikeUI(id,true);try{await supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW})}catch(e){}}}
async function toggleLike(id){let liked=allLikes.some(l=>String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID));if(!liked){allLikes.push({post_id:id,user_id:ME_ID,username:ME_RAW});updateLikeUI(id,true);supa.from('likes').insert({post_id:id,user_id:ME_ID,username:ME_RAW}).then(()=>{}).catch(()=>{});}else{allLikes=allLikes.filter(l=>!(String(l.post_id)==String(id)&&String(l.user_id)==String(ME_ID)));updateLikeUI(id,false);supa.from('likes').delete().eq('post_id',id).eq('user_id',ME_ID).then(()=>{}).catch(()=>{});}}
function updateLikeUI(id,liked){let btn=document.getElementById('likeBtn-'+id);let svg=document.getElementById('likeSvg-'+id);let cnt=document.getElementById('likeCnt-'+id);if(btn){if(liked)btn.classList.add('liked');else btn.classList.remove('liked')}if(svg){svg.setAttribute('fill',liked?'#ff3040':'none');svg.setAttribute('stroke',liked?'#ff3040':'#fff');}if(cnt){let n=allLikes.filter(l=>String(l.post_id)==String(id)).length;cnt.innerText=n>0?n:''}}
function openTildeSheet(){renderSettingsList(); document.getElementById('tildeSheet').classList.add('show');}
async function saveR(id){let isSaved=allSaves.some(x=>String(x.post_id)==String(id)&&String(x.user_id)==String(ME_ID));let btn=document.getElementById('saveBtn-'+id);let svg=document.getElementById('saveSvg-'+id);if(isSaved){allSaves=allSaves.filter(x=>!(String(x.post_id)==String(id)&&String(x.user_id)==String(ME_ID)));if(btn)btn.classList.remove('saved');if(svg)svg.setAttribute('fill','none');supa.from('saves').delete().eq('post_id',id).eq('user_id',ME_ID).then(()=>{}).catch(()=>{});}else{allSaves.push({post_id:id,user_id:ME_ID,username:ME_RAW});if(btn)btn.classList.add('saved');if(svg)svg.setAttribute('fill','#fff');supa.from('saves').insert({post_id:id,user_id:ME_ID,username:ME_RAW}).then(()=>{}).catch(()=>{});}}
async function toggleF(uid,pid){if(!uid||String(uid)==String(ME_ID))return;let isF=allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(uid));document.querySelectorAll('[id^="followBtn-"]').forEach(b=>{let bid=b.id.replace('followBtn-','');let pp=allPosts.find(x=>String(x.id)==String(bid));if(pp&&String(pp.user_id)==String(uid))b.innerText=isF?'Follow':'Following'});if(isF){allFollows=allFollows.filter(f=>!(String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(uid)));try{await supa.from('follows').delete().eq('follower_id',ME_ID).eq('following_id',uid)}catch(e){}}else{allFollows.push({follower_id:ME_ID,following_id:uid});try{await supa.from('follows').insert({follower_id:ME_ID,following_id:uid})}catch(e){}}}
function openCommentSheet(pid){curCommentPost=pid;let list=allComments.filter(c=>String(c.post_id)==String(pid));document.getElementById('commentList').innerHTML=list.length?list.map(c=>{let isMyC=String(c.user_id)==String(ME_ID)||cleanUser(c.username)==cleanUser(ME_RAW);return `<div class="cRow"><div><b>${cleanUser(c.username)}</b> <span style="font-size:13px;color:#ddd"> ${c.text||''}</span></div>${isMyC?`<span class="del" onclick="deleteComment('${c.id}','${pid}')">Delete</span>`:''}</div>`}).join(''):'<div style="text-align:center;color:#888;padding:20px">No comments yet</div>';document.getElementById('commentSheet').classList.add('show');}
function closeSheet(id){document.getElementById(id).classList.remove('show')}
async function postComment(){let inp=document.getElementById('commentInput');let t=inp.value.trim();if(!t||!curCommentPost)return;let tmp={id:'tmp_'+Date.now(),post_id:curCommentPost,user_id:ME_ID,username:ME_RAW,text:t};allComments.unshift(tmp);inp.value='';openCommentSheet(curCommentPost);try{await supa.from('comments').insert({post_id:curCommentPost,user_id:ME_ID,username:ME_RAW,text:t})}catch(e){}}
async function deleteComment(cid,pid){allComments=allComments.filter(c=>String(c.id)!=String(cid));openCommentSheet(pid);try{await supa.from('comments').delete().eq('id',cid)}catch(e){}}
function openShareSheet(pid){curShareId=pid;document.getElementById('shareSheet').classList.add('show')}
function copyLink(){let link=location.origin+'/reels.html?id='+curShareId;navigator.clipboard.writeText(link);alert('Link copied!');closeSheet('shareSheet')}
function shareWhatsApp(){let link=location.origin+'/reels.html?id='+curShareId;window.open('https://wa.me/?text='+encodeURIComponent(link),'_blank');closeSheet('shareSheet')}
function toggleMuteAll(){globalMuted=!globalMuted;document.querySelectorAll('video').forEach(v=>v.muted=globalMuted);document.getElementById('volIcon').innerText=globalMuted?'🔇':'🔊'}
