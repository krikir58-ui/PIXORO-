<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin - Pixoro 👑</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script><style>body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:0 auto;padding:16px;padding-bottom:80px}.card{background:#121212;padding:14px;border-radius:14px;margin:12px 0;border:1px solid #333}.card img{width:100%;border-radius:10px;margin-top:8px;border:1px solid #FFD700}</style></head><body>
<h2>👑 Pixoro Admin - Gold Tick Requests</h2><p style="font-size:12px;color:#aaa">Pixoro Waitlist Requests - Pixoro Gold Tick</p><p id="count" style="font-size:12px;color:#FFD700"></p><div id="list">Loading...</div>
<button onclick="load()" style="width:100%;background:#fff;color:#000;padding:12px;border-radius:10px;font-weight:900;margin-top:10px;border:0">🔄 Refresh Pannu</button>
<button onclick="alert('LOCAL: '+localStorage.getItem('pixoro_all_verify'))" style="width:100%;background:#222;color:#fff;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #555">🔍 Local Request Check</button>
<script>
const supa=supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
async function load(){
  let local=JSON.parse(localStorage.getItem('pixoro_all_verify')||'[]');
  let db=[];
  try{ let {data,error}=await supa.from('verification_requests').select('*').eq('status','pending').order('created_at',{ascending:false}); if(error){ document.getElementById('list').innerHTML='❌ Supabase Error: '+error.message+'<br><br>SQL Run Pannalaya da? Table Create Pannu da'; } else db=data||[]; }catch(e){}
  let all=[...local, ...db.filter(d=>!local.find(l=>l.username==d.username))];
  document.getElementById('count').innerText=all.length+' Requests Irukku da - Local: '+local.length+' | Supabase: '+db.length;
  if(!all.length){document.getElementById('list').innerHTML='No requests - All safe! 🛡️<br><br>Local Check Button Click Pannu da';return}
  let h=''; all.forEach((r,i)=>{
    let idPhoto=r.id_photo||r.proof_url||'';
    let facePhoto=r.face_photo||'';
    let phoneOk = r.phone_verified ? '✅ Phone OTP Verified da' : '⚠️ OTP Verify Aagala da';
    let phoneColor = r.phone_verified ? '#00c853' : '#ff3040';
    h+=`<div class="card"><b>@${r.username}</b> <span style="color:#FFD700">● Waitlist</span><br>
    <small style="color:#aaa">Aadhar: <b style="color:#FFD700">${r.aadhar_masked||'XXXX XXXX '+(r.aadhar_last4||'')}</b> | ${r.created_at||''}</small><br>
    <small style="color:${phoneColor};font-weight:800">${phoneOk}</small><br>
    <small style="color:#aaa">Phone: ${r.phone||r.v_phone||'Hidden - OTP Verified'}</small><br>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button onclick="verifyUIDAI('${r.aadhar_last4||''}')" style="flex:1;background:#0095f6;color:#fff;border:0;padding:8px;border-radius:8px;font-weight:800;font-size:12px">🔍 UIDAI Real Check</button>
      <button onclick="showFull('${r.aadhar_last4||''}')" style="flex:1;background:#222;color:#fff;border:1px solid #555;padding:8px;border-radius:8px;font-weight:800;font-size:12px">👁️ Full Aadhar</button>
    </div>
    <p style="font-size:12px;color:#FFD700;margin-top:10px">1. ID PHOTO:</p>${idPhoto?`<img src="${idPhoto}">`:'<p style="font-size:12px">Photo Illa da</p>'}
    <p style="font-size:12px;color:#FFD700;margin-top:10px">2. FACE PHOTO:</p>${facePhoto?`<img src="${facePhoto}">`:'<p style="font-size:12px">Photo Illa da</p>'}
    <p style="font-size:11px;color:#aaa;margin-top:8px">✅ Check Pannu da: ID Face vs Selfie Face - Same Aalu va? | Aadhar Last4 vs ID Card Last4 Same va?</p>
    <div style="display:flex;gap:8px;margin-top:12px"><button onclick="approve('${r.username}','${r.id||''}')" style="flex:1;background:#FFD700;border:0;padding:12px;border-radius:8px;font-weight:900">✅ Approve 👑</button><button onclick="reject('${r.username}','${r.id||''}')" style="flex:1;background:#ff3040;border:0;color:#fff;padding:12px;border-radius:8px;font-weight:900">❌ Reject</button></div></div>`
  }); document.getElementById('list').innerHTML=h;
}
function verifyUIDAI(last4){
  // UIDAI Official Site Open Aagum da - Last4 Mattum Copy Aagum da
  window.open('https://myaadhaar.uidai.gov.in/verify-aadhaar','_blank');
  alert('UIDAI Site Open Aayiduchu da - Aadhar Full Number Anga Pottu Check Pannu da - Real ah Illaya nu Theriyum da');
}
function showFull(last4){
  let pass=prompt('Admin Password Podu da Giri');
  if(pass!=='giri123') return alert('Wrong Password da');
  alert('Aadhar Last 4: '+last4+' - Full Number - ID Photo la Irukku da - Athula Paathu Match Pannu da');
}
async function approve(u,reqId){
  let clean=u.toLowerCase().trim();
  if(reqId) await supa.from('verification_requests').update({status:'approved'}).eq('id',reqId);
  try{ await supa.from('profiles').upsert({username:clean,is_gold_verified:true,is_verified:true,gold_tick:true}); }catch(e){}
  let ids=JSON.parse(localStorage.getItem('pixoro_gold_ids')||'["giri_office"]');
  if(!ids.includes(clean)) ids.push(clean);
  localStorage.setItem('pixoro_gold_ids', JSON.stringify(ids));
  localStorage.removeItem('pixoro_verify_'+clean);
  let all=JSON.parse(localStorage.getItem('pixoro_all_verify')||'[]'); all=all.filter(x=>x.username!==clean); localStorage.setItem('pixoro_all_verify', JSON.stringify(all));
  alert('@'+clean+' approved da! 👑 Gold Tick!');
  load();
}
async function reject(u,reqId){
  if(reqId) await supa.from('verification_requests').update({status:'rejected'}).eq('id',reqId);
  localStorage.removeItem('pixoro_verify_'+u);
  let all=JSON.parse(localStorage.getItem('pixoro_all_verify')||'[]'); all=all.filter(x=>x.username!==u); localStorage.setItem('pixoro_all_verify', JSON.stringify(all));
  alert('Rejected da'); load();
}
load();
</script></body></html>
