<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New Post - Pixoro</title><link rel="stylesheet" href="css/pixoro-style.css"></head><body>
<div class="top"><b onclick="history.back()">✕</b><b>New Post</b><b style="color:#ff5ea8" onclick="goNext()">Next</b></div>
<div class="preview"><img id="pImg" src="https://picsum.photos/450/450?random=10"></div>
<input type="file" accept="image/*" id="file">
<button class="share" onclick="goNext()">Next →</button>
<script>let f=document.getElementById('file');f.onchange=()=>{let u=URL.createObjectURL(f.files[0]);document.getElementById('pImg').src=u;localStorage.setItem('pixoro_temp_post',u)};function goNext(){location.href='./create-post-edit.html'}</script>
</body></html>
