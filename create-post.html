<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New post - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}.top{display:flex;justify-content:space-between;padding:12px 16px;font-size:20px}.top b{font-size:20px}.top span:last-child{color:#4d7cff;font-weight:800}.preview{width:100%;aspect-ratio:1/1;background:#111}.preview img{width:100%;height:100%;object-fit:cover}.head{display:flex;justify-content:space-between;padding:12px 16px}.head button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding-bottom:80px}.grid img{width:100%;aspect-ratio:1/1;object-fit:cover}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;padding:12px;display:flex;gap:10px}.bottom button{flex:1;padding:12px;border:0;border-radius:20px;background:#222;color:#fff;font-weight:700}.bottom button.on{background:#fff;color:#000}</style></head><body>
<div class="top"><span onclick="location.href='./index.html'">✕</span><b>New post</b><span onclick="goNext()">Next</span></div>
<div class="preview"><img id="prev" src="https://picsum.photos/500/500?random=20"></div>
<div class="head"><b>Recents ⌄</b><button onclick="document.getElementById('file').click()">☑️ Select</button></div>
<div class="grid" id="grid">
<img src="https://picsum.photos/300/300?random=21" onclick="sel(this.src)">
<img src="https://picsum.photos/300/300?random=22" onclick="sel(this.src)">
<img src="https://picsum.photos/300/300?random=23" onclick="sel(this.src)">
<img src="https://picsum.photos/300/300?random=24" onclick="sel(this.src)">
<img src="https://picsum.photos/300/300?random=25" onclick="sel(this.src)">
<img src="https://picsum.photos/300/300?random=26" onclick="sel(this.src)">
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="bottom"><button class="on">POST</button><button onclick="location.href='./create-reels.html'">REELS</button><button onclick="location.href='./create-story.html'">STORY</button></div>
<script>function sel(u){document.getElementById('prev').src=u;localStorage.setItem('pixoro_post_media',u);}document.getElementById('file').onchange=(e)=>{let u=URL.createObjectURL(e.target.files[0]);document.getElementById('prev').src=u;localStorage.setItem('pixoro_post_media',u);};function goNext(){if(!localStorage.getItem('pixoro_post_media'))localStorage.setItem('pixoro_post_media',document.getElementById('prev').src);location.href='./create-post-edit.html';}</script>
</body></html>
