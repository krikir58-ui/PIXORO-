<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New post - Pixoro - v1050</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:22px}
.top b{font-size:22px}
.top span{font-size:28px;cursor:pointer}
.top .next{color:#4d7cff;font-weight:700;font-size:18px}
.pills{display:flex;gap:10px;padding:0 14px 14px;overflow-x:auto}
.pills button{background:#222;color:#fff;border:0;padding:12px 16px;border-radius:30px;font-size:16px;white-space:nowrap}
/* ✅ POST - 4:5 PREVIEW DA - REELS MARI - 9:16 - ILLA DA */
.preview{width:100%;height:52vh;background:#000;display:grid;place-items:center;overflow:hidden}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.preview .empty{font-size:50px;text-align:center;opacity:.6}
.preview .empty small{display:block;font-size:13px;color:#888;margin-top:8px}
.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.head b{font-size:22px}
.head button{background:#222;color:#fff;border:0;padding:10px 18px;border-radius:30px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px}
.grid .tile{aspect-ratio:1;background:#111;overflow:hidden}
.grid .tile img,.grid .tile video{width:100%;height:100%;object-fit:cover}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:14px;border-top:1px solid #222}
.bottomNav span{color:#888;font-size:16px;letter-spacing:2px;cursor:pointer}
.bottomNav span.on{color:#fff;font-weight:900}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='./index.html'">✕</span><b>New post</b><span id="nextBtn" style="display:none" onclick="goEdit()">Next</span><span>⚙️</span></div>
<div class="pills">
  <button onclick="alert('Edits - Coming Soon da')">🎬 Edits</button>
  <button onclick="alert('Drafts - Coming Soon da')">📁 Drafts · 2</button>
  <button onclick="alert('Templates - Coming Soon da')">📋 Templates</button>
</div>
<!-- ✅ POST PREVIEW - FULLSCREEN DA -->
<div class="preview" id="previewBox">
  <img id="prevImg" src="" style="display:none">
  <video id="prevVid" src="" style="display:none" muted loop playsinline></video>
  <div class="empty" id="emptyBox">📷<small>Photo Select Pannu da<br>POST ku - Photo Mattum da</small></div>
</div>
<div class="head"><b>Recents ⌄</b><button onclick="document.getElementById('file').click()">🗂️ Select</button></div>
<div class="grid" id="grid"><div id="noPhotoMsg" style="grid-column:1/-1;text-align:center;color:#777;font-size:13px;padding:20px">Innum File Select Pannala da<br>Select Button ah Thodu da - Gallery Open Aagum da</div></div>
<div class="bottomNav">
  <span onclick="location.href='./create-story.html?v=1050'">STORY</span>
  <span class="on">INSTANTS</span>
  <span onclick="location.href='./create.html?v=1050'">REEL</span>
  <span onclick="alert('Live - Coming Soon da')">LIVE</span>
</div>
<!-- ✅ POST ku - PHOTO MATTUM DA - VIDEO ILLA DA -->
<input type="file" id="file" accept="image/*" hidden>
<script>
// ✅ POST PAGE 1 DA - SELECT + SAVE + NEXT DA - UPLOAD ILLA DA
let selectedFile=null, selectedUrl='';
function openDB(){ return new Promise((res,rej)=>{ let req=indexedDB.open('pixoro-db',1); req.onupgradeneeded=()=>{ req.result.createObjectStore('media'); }; req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
async function saveDB(k,v){ let db=await openDB(); return new Promise((res,rej)=>{ let tx=db.transaction('media','readwrite'); tx.objectStore('media').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function handleFile(f){
  if(!f) return;
  if(!f.type.startsWith('image/')){ alert('POST ku - Photo Mattum da - Video ku - REEL ku Po da'); return; }
  // ✅ POST - 1080x1350 - 4:5 - ku - CONVERT PANNI - SAVE PANNU DA - REELS SIZE KU - POGAATHU DA
  let reader=new FileReader();
  reader.onload=function(){
    let img=new Image();
    img.onload=async function(){
      let canvas=document.createElement('canvas');
      // Original size - Keep Pannu da - Edit Page la - Zoom Panna - Quality Pogaathu da
      canvas.width=img.width; canvas.height=img.height;
      let ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
      canvas.toBlob(async (blob)=>{
        if(selectedUrl) URL.revokeObjectURL(selectedUrl);
        selectedFile=new File([blob],'post.jpg',{type:'image/jpeg'});
        selectedUrl=URL.createObjectURL(blob);
        let p=document.getElementById('prevImg'); p.src=selectedUrl; p.style.display='block';
        document.getElementById('prevVid').style.display='none'; document.getElementById('emptyBox').style.display='none';
        document.getElementById('noPhotoMsg').style.display='none';
        document.getElementById('grid').innerHTML='<div class="tile"><img src="'+selectedUrl+'"></div>';
        await saveDB('pixoro_create_media', selectedFile);
        await saveDB('pixoro_create_kind', 'image');
        await saveDB('pixoro_create_type', 'post');
        await saveDB('pixoro_create_bg', 'black');
        document.getElementById('nextBtn').style.display='block';
      },'image/jpeg',0.92);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}
document.getElementById('file').onchange=(e)=>handleFile(e.target.files[0]);
async function goEdit(){
  if(!selectedFile){ alert('Photo Select Pannu da'); document.getElementById('file').click(); return; }
  await saveDB('pixoro_create_media', selectedFile);
  await saveDB('pixoro_create_kind', 'image');
  await saveDB('pixoro_create_type', 'post');
  location.href='./create-edit.html?v=1050';
}
</script>
</body>
</html>
