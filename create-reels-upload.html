<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New reel - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:system-ui}.top{display:flex;gap:14px;align-items:center;padding:14px;font-size:20px}.cover{width:150px;height:220px;object-fit:cover;border-radius:20px;display:block;margin:14px auto;position:relative}.editCover{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px;font-size:13px}textarea{width:100%;background:transparent;border:0;color:#fff;padding:14px;font-size:16px;outline:none;resize:none}.chips{display:flex;gap:8px;padding:0 14px}.chips button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #222;cursor:pointer}.row small{color:#888}.btns{display:flex;gap:10px;padding:14px;position:fixed;bottom:0;left:0;right:0;background:#111}.btns button{flex:1;padding:14px;border:0;border-radius:30px;font-weight:800;font-size:15px}.save{background:#333;color:#fff}.share{background:#4d7cff;color:#fff}</style></head><body>
<div class="top"><span onclick="history.back()">←</span><b>New reel</b></div>
<div style="position:relative;text-align:center"><img class="cover" id="coverImg" src=""><div class="editCover" onclick="document.getElementById('coverFile').click()">Edit cover</div></div>
<input type="file" id="coverFile" accept="image/*" hidden>
<textarea id="caption" rows="2" placeholder="Write a caption and add hashtags..."></textarea>
<div class="chips"><button onclick="addHash()"># Hashtags</button><button onclick="addPoll()">☰ Poll</button><button onclick="addPrompt()">⌕ Prompt</button></div>
<div class="row" onclick="tagPeople()"><span>👤 Tag people</span><span>›</span></div>
<div class="row" onclick="addLocation()"><span>📍 Add location</span><span>›</span></div>
<small style="color:#888;padding:0 16px;display:block">People you share this content with can see the location you tag and view this content on the map.</small>
<div class="row" onclick="renameAudio()"><span>🎵 Rename audio</span><span id="audioName">Original Audio ›</span></div>
<div class="row" onclick="togglePrivate()"><span>🔒 Audience</span><span id="audTxt">Public ›</span></div>
<div style="height:80px"></div>
<div class="btns"><button class="save" onclick="saveDraft()">Save draft</button><button class="share" id="shareBtn" onclick="shareReel()">Share</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script><script src="js/pixoro-core.js"></script><script src="js/reels-visibility.js"></script>
<script>let media=localStorage.getItem('pixoro_reel_media')||'https://picsum.photos/400/700?random=10';document.getElementById('coverImg').src=media;let isPrivate=false,tagged='',loc='';document.getElementById('coverFile').onchange=(e)=>{let u=URL.createObjectURL(e.target.files[0]);document.getElementById('coverImg').src=u;localStorage.setItem('pixoro_reel_cover',u);};function addHash(){let c=document.getElementById('caption');c.value+=' #pixoro #trending ';c.focus();}function addPoll(){let q=prompt('Poll Question?');if(q){let c=document.getElementById('caption');c.value+='\n📊 Poll: '+q+' | Yes / No';}}function addPrompt(){let p=prompt('Prompt ezhuthu da:');if(p){let c=document.getElementById('caption');c.value+='\n💬 '+p;}}function tagPeople(){let t=prompt('Yaara Tag Panna da? username:');if(t){tagged=t;alert('Tagged da: @'+t);}}function addLocation(){let l=prompt('Location - Dharmapuri / Chennai?');if(l){loc=l;alert('Location Add Aachu da: '+l);}}function renameAudio(){let a=prompt('Audio Name:',document.getElementById('audioName').innerText);if(a){document.getElementById('audioName').innerText=a+' ›';localStorage.setItem('pixoro_reel_audio',a);}}function togglePrivate(){isPrivate=!isPrivate;document.getElementById('audTxt').innerText=isPrivate?'Private Share ›':'Public ›';}function saveDraft(){localStorage.setItem('pixoro_reel_draft',document.getElementById('caption').value);alert('Draft Save Aachu da ✅');}async function shareReel(){let btn=document.getElementById('shareBtn');btn.innerText='Sharing...';btn.disabled=true;let cap=document.getElementById('caption').value||'Just Pixoro 🔥';if(tagged)cap+=' @'+tagged;if(loc)cap+=' 📍 '+loc;try{let s=window.supa;let {data:{session}}=await s.auth.getSession();if(!session){alert('Login Pannu da');location.href='./login.html';return;}let r=await window.uploadReelPixoro(session.user.id,media,isPrivate,null,cap);if(r.error){alert('Share Fail da: '+r.error);btn.innerText='Share';btn.disabled=false;return;}localStorage.removeItem('pixoro_reel_media');alert('Reels Share Aachu da 🔥');location.href='./reels.html';}catch(e){alert('Error da: '+e.message);btn.innerText='Share';btn.disabled=false;}}</script>
</body></html>
