<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New reel - Pixoro - v1048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:system-ui;padding-bottom:90px}
.top{display:flex;gap:14px;align-items:center;padding:14px;font-size:20px}
.top span{cursor:pointer}
.coverWrap{width:160px;height:230px;margin:14px auto;position:relative;background:#fff;border-radius:20px;overflow:hidden;display:grid;place-items:center;border:2px solid #fff;padding:10px;box-sizing:border-box}
.coverWrap img,.coverWrap video{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:14px}
.coverWrap .empty{color:#000;font-size:40px;text-align:center}
.coverWrap .empty small{display:block;font-size:11px;color:#888;margin-top:4px}
.editCover{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;color:#fff;z-index:3}
.bgRow{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}
.bgRow button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.bgRow button.on{background:#fff;color:#000}
textarea{width:100%;background:transparent;border:0;color:#fff;padding:14px;font-size:16px;outline:none;resize:none}
.chips{display:flex;gap:8px;padding:0 14px;flex-wrap:wrap}
.chips button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #222;cursor:pointer}
.row small{color:#888}
.btns{display:flex;gap:10px;padding:14px;position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222}
.btns button{flex:1;padding:14px;border:0;border-radius:30px;font-weight:800;font-size:15px;cursor:pointer}
.save{background:#333;color:#fff}
.share{background:#4d7cff;color:#fff}
.share:disabled{opacity:.5}
.previewInfo{padding:0 16px 6px;color:#888;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="top"><span onclick="history.back()">←</span><b>New reel</b></div>
<div style="position:relative;text-align:center">
  <div class="coverWrap" id="coverWrap">
    <img id="coverImg" src="" style="display:none">
    <video id="coverVid" src="" style="display:none" muted loop playsinline autoplay></video>
    <div class="empty" id="coverEmpty">📷<small>Cover Illa da</small><br><button onclick="location.href='./create.html?v=1048'" style="margin-top:10px;background:#000;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:800">📁 Select Photo</button></div>
    <div class="editCover" id="editCoverBtn" onclick="document.getElementById('coverFile').click()">Edit cover</div>
  </div>
</div>
<div class="bgRow" id="bgRow">
  <button class="on" onclick="setCoverBg('white',this)">⬜ White Block</button>
  <button onclick="setCoverBg('black',this)">⬛ Black Block</button>
  <button onclick="setCoverBg('transparent',this)">🔲 BG Remove</button>
  <button onclick="setCoverBg('blur',this)">🌀 Blur BG</button>
</div>
<input type="file" id="coverFile" accept="image/*" hidden>
<textarea id="caption" rows="2" placeholder="Write a caption and add hashtags..."></textarea>
<div class="previewInfo" id="previewInfo"></div>
<div class="chips">
  <button onclick="addHash()"># Hashtags</button>
  <button onclick="addPoll()">☰ Poll</button>
  <button onclick="addPrompt()">⌕ Prompt</button>
  <button onclick="removeBgFinal()">✨ BG Remove</button>
</div>
<div class="row" onclick="tagPeople()"><span>👤 Tag people</span><span id="tagTxt">›</span></div>
<div class="row" onclick="addLocation()"><span>📍 Add location</span><span id="locTxt">›</span></div>
<small style="color:#888;padding:0 16px;display:block">People you share this content with can see the location you tag and view this content on the map.</small>
<div class="row" onclick="renameAudio()"><span>🎵 Rename audio</span><span id="audioName">Original Audio ›</span></div>
<div class="row" onclick="togglePrivate()"><span>🔒 Audience</span><span id="audTxt">Public ›</span></div>
<div class="row" onclick="toggleHideFace()"><span>🙈 Face Photo - Home la Vara Koodathu</span><span id="hideFaceTxt">OFF ›</span></div>
<div style="height:90px"></div>
<div class="btns"><button class="save" onclick="saveDraft()">Save draft</button><button class="share" id="shareBtn" onclick="shareReel()">Share</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=1048"></script>
<script src="js/pixoro-core.js?v=1048"></script>
<script>
// ✅ LOCALSTORAGE BLOB ILLA DA - INDEXEDDB REAL FILE DA
let mediaBlob=null, mediaKind='image', mediaType='reels', filter='none', bgMode='white', hideFace=false, isPrivate=false, tagged='', loc='', audioName='Original Audio', coverBlob=null;
function openDB(){ return new Promise((res,rej)=>{ let req=indexedDB.open('pixoro-db',1); req.onupgradeneeded=()=>{ req.result.createObjectStore('media'); }; req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
async function getDB(k){ let db=await openDB(); return new Promise((res,rej)=>{ let r=db.transaction('media','readonly').objectStore('media').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function saveDB(k,v){ let db=await openDB(); return new Promise((res,rej)=>{ let tx=db.transaction('media','readwrite'); tx.objectStore('media').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function delDB(k){ let db=await openDB(); let tx=db.transaction('media','readwrite'); tx.objectStore('media').delete(k); }
async function load(){
  try{
    mediaBlob=await getDB('pixoro_create_media');
    mediaKind=await getDB('pixoro_create_kind') || 'image';
    mediaType=await getDB('pixoro_create_type') || 'reels';
    filter=await getDB('pixoro_create_filter') || 'none';
    bgMode=await getDB('pixoro_create_bg') || 'white';
    let txt=await getDB('pixoro_create_text') || '';
    let draft=await getDB('pixoro_create_draft') || '';
    audioName=await getDB('pixoro_create_audio') || 'Original Audio';
    if(txt) document.getElementById('caption').value=txt; else if(draft) document.getElementById('caption').value=draft;
    document.getElementById('audioName').innerText=audioName+' ›';
    // ✅ LOOP ILLA DA - ALERT ILLA - COVER LA YE SELECT BUTTON DA
    if(!mediaBlob){ document.getElementById('coverEmpty').style.display='block'; document.getElementById('editCoverBtn').style.display='none'; document.getElementById('previewInfo').innerText='Photo Select Pannu da - Mela Button ah Thodu da'; return; }
    let url=URL.createObjectURL(mediaBlob);
    if(mediaKind==='video'){ let v=document.getElementById('coverVid'); v.src=url; v.style.display='block'; v.style.filter=filter; }
    else { let p=document.getElementById('coverImg'); p.src=url; p.style.display='block'; p.style.filter=filter; }
    document.getElementById('coverEmpty').style.display='none';
    document.getElementById('previewInfo').innerText='Filter: '+filter+' | BG: '+bgMode+' | Type: '+mediaType;
    document.querySelector('.top b').innerText = mediaType==='story' ? 'New story' : mediaType==='reels' ? 'New reel' : 'New post';
    applyCoverBg(bgMode);
    document.querySelectorAll('#bgRow button').forEach(b=>b.classList.remove('on'));
    let idx=bgMode==='white'?0:bgMode==='black'?1:bgMode==='transparent'?2:3;
    document.querySelectorAll('#bgRow button')[idx].classList.add('on');
  }catch(e){ document.getElementById('previewInfo').innerText='Photo Load Aagala da - Thirumba Select Pannu da'; }
}
load();
function applyCoverBg(mode){
  let wrap=document.getElementById('coverWrap');
  let cImg=document.getElementById('coverImg'), cVid=document.getElementById('coverVid');
  if(mode==='white'){ wrap.style.background='#fff'; wrap.style.borderColor='#fff'; wrap.style.padding='10px'; cImg.style.background='#fff'; cImg.style.objectFit='contain'; cVid.style.objectFit='contain'; cVid.style.background='#fff'; }
  if(mode==='black'){ wrap.style.background='#000'; wrap.style.borderColor='#333'; wrap.style.padding='0px'; cImg.style.background='#000'; cImg.style.objectFit='cover'; cVid.style.objectFit='cover'; }
  if(mode==='transparent'){ wrap.style.background='repeating-conic-gradient(#222 0% 25%, #000 0% 50%) 50% / 20px 20px'; wrap.style.borderColor='#333'; wrap.style.padding='0px'; cImg.style.background='transparent'; cImg.style.objectFit='contain'; cVid.style.objectFit='contain'; }
  if(mode==='blur'){ wrap.style.background='#000'; wrap.style.borderColor='#333'; wrap.style.padding='0px'; cImg.style.background='#000'; cImg.style.objectFit='cover'; cVid.style.objectFit='cover'; }
}
function setCoverBg(mode, btn){
  document.querySelectorAll('#bgRow button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  bgMode=mode; saveDB('pixoro_create_bg', mode); applyCoverBg(mode);
  if(mode==='transparent') alert('BG Remove On da ✨ - White Block Remove Aachu da - Photo Mattum Theriyum da');
  if(mode==='white') alert('White Block On da ⬜ - Photo Suthi - White Theriyum da');
}
function removeBgFinal(){ setCoverBg('transparent', document.querySelectorAll('#bgRow button')[2]); }
document.getElementById('coverFile').onchange=(e)=>{
  let f=e.target.files[0]; if(!f) return;
  coverBlob=f;
  let url=URL.createObjectURL(f);
  let cImg=document.getElementById('coverImg'); cImg.src=url; cImg.style.display='block';
  document.getElementById('coverVid').style.display='none'; document.getElementById('coverEmpty').style.display='none';
};
function addHash(){ let c=document.getElementById('caption'); c.value+=' #pixoro #trending '; c.focus(); }
function addPoll(){ let q=prompt('Poll Question?'); if(q) document.getElementById('caption').value+='\n📊 Poll: '+q+' | Yes / No'; }
function addPrompt(){ let p=prompt('Prompt ezhuthu da:'); if(p) document.getElementById('caption').value+='\n💬 '+p; }
function tagPeople(){ let t=prompt('Yaara Tag Panna da? username:'); if(t){ tagged=t; document.getElementById('tagTxt').innerText='@'+t+' ›'; } }
function addLocation(){ let l=prompt('Location - Dharmapuri / Chennai?'); if(l){ loc=l; document.getElementById('locTxt').innerText=l+' ›'; } }
function renameAudio(){ let a=prompt('Audio Name:', audioName); if(a){ audioName=a; document.getElementById('audioName').innerText=a+' ›'; saveDB('pixoro_create_audio', a); } }
function togglePrivate(){ isPrivate=!isPrivate; document.getElementById('audTxt').innerText=isPrivate?'Private Share ›':'Public ›'; }
function toggleHideFace(){ hideFace=!hideFace; document.getElementById('hideFaceTxt').innerText=hideFace?'ON - Home la Varaathu ›':'OFF ›'; }
function saveDraft(){ saveDB('pixoro_create_draft', document.getElementById('caption').value); alert('Draft Save Aachu da ✅'); }
function applyFilter(blob, f){
  return new Promise((res)=>{
    if(!f || f==='none' || mediaKind==='video'){ res(blob); return; }
    let url=URL.createObjectURL(blob);
    let img=new Image();
    img.onload=()=>{ let c=document.createElement('canvas'); c.width=img.width; c.height=img.height; let ctx=c.getContext('2d'); ctx.filter=f; ctx.drawImage(img,0,0); URL.revokeObjectURL(url); c.toBlob(b=>res(b||blob),'image/jpeg',0.85); };
    img.src=url;
  });
}
function applyWhiteBlock(blob){
  return new Promise((res)=>{
    if(bgMode!=='white' || mediaKind==='video'){ res(blob); return; }
    let url=URL.createObjectURL(blob);
    let img=new Image();
    img.onload=()=>{ let pad=20; let c=document.createElement('canvas'); c.width=img.width+pad*2; c.height=img.height+pad*2; let ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,pad,pad); URL.revokeObjectURL(url); c.toBlob(b=>res(b||blob),'image/jpeg',0.85); };
    img.src=url;
  });
}
async function shareReel(){
  if(!mediaBlob){ alert('Photo Illa da - Mela Select Photo Button ah Thodu da'); location.href='./create.html?v=1048'; return; }
  let btn=document.getElementById('shareBtn'); btn.innerText='Sharing...'; btn.disabled=true;
  let cap=document.getElementById('caption').value || 'Just Pixoro 🔥';
  if(tagged) cap+=' @'+tagged;
  if(loc) cap+=' 📍 '+loc;
  if(hideFace) cap+=' #FACE_HIDE';
  try{
    let s=window.supabaseClient || window.supa;
    if(!s) throw new Error('Supabase connect aagala da');
    let {data:{session}}=await s.auth.getSession();
    if(!session){ alert('Login Pannu da'); location.href='./login.html'; return; }
    let finalBlob=await applyFilter(mediaBlob, filter);
    finalBlob=await applyWhiteBlock(finalBlob);
    let folder=mediaType==='story'?'stories':mediaType==='reels'?'reels':'posts';
    let ext=mediaKind==='video'?'mp4':'jpg';
    let fileName=folder+'/'+session.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
    let {error:upErr}=await s.storage.from(folder).upload(fileName, finalBlob, {contentType: mediaKind==='video'?'video/mp4':'image/jpeg', upsert:false});
    if(upErr) throw upErr;
    let {data:urlData}=s.storage.from(folder).getPublicUrl(fileName);
    let publicUrl=urlData.publicUrl;
    let {error}=await s.from('posts').insert({
      user_id: session.user.id,
      username: window.ME_RAW || session.user.email.split('@')[0],
      media_url: publicUrl,
      image_url: mediaKind==='image'?publicUrl:null,
      video_url: mediaKind==='video'?publicUrl:null,
      media_type: mediaType,
      caption: cap,
      visibility: isPrivate?'private_share':'public',
      is_archived: hideFace?true:false
    });
    if(error) throw error;
    await delDB('pixoro_create_media'); await delDB('pixoro_create_filter');
    await delDB('pixoro_create_bg'); await delDB('pixoro_create_text');
    await delDB('pixoro_create_draft'); await delDB('pixoro_create_type');
    await delDB('pixoro_create_kind'); await delDB('pixoro_create_audio');
    alert(hideFace?'Reels Share Aachu da 🔥 - Home la Varaathu da':'Reels Share Aachu da 🔥');
    location.href='./index.html';
  }catch(e){ alert('Error da: '+e.message); btn.innerText='Share'; btn.disabled=false; }
}
</script>
</body>
</html>
