<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCw0Xsjqp20oT2PoxSyHojk5r5r58vQ1o",
  authDomain: "pixoro-75927.firebaseapp.com",
  projectId: "pixoro-75927",
  storageBucket: "pixoro-75927.firebasestorage.app",
  messagingSenderId: "814840120295",
  appId: "1:814840120295:web:6c02c613df5a17209bf342",
  measurementId: "G-H3NR8P270D"
};
firebase.initializeApp(firebaseConfig);
const messaging = firebase.messaging();

// FIX 1: SW ah correct path la register pannu da
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('firebase-messaging-sw.js')
    .then(reg => { swReg = reg; console.log('SW OK da'); })
    .catch(e => console.log('SW Fail', e));
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#000;z-index:50}
.logoBox{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#ff5ea8,#a259ff,#ff7a00);display:grid;place-items:center;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.logoTxt{font-size:17px;font-weight:800;background:linear-gradient(90deg,#ff8ac2,#c39bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;white-space:nowrap}
.top b{font-size:17px;flex:1}
.top .bellBtn{background:none;border:0;cursor:pointer;position:relative;padding:4px}
.top .bellBtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8}
.top .bellBtn .dot{position:absolute;top:2px;right:2px;width:8px;height:8px;background:#FF3040;border-radius:50%;border:2px solid #000;display:none}
.safeBar{margin:6px 12px 10px;padding:10px 12px;background:#111;border:1px solid #222;border-radius:12px;font-size:12px;line-height:1.4;color:#aaa}
.safeBar b{color:#fff}
.tabBar{display:flex;gap:8px;padding:4px 12px 10px;overflow-x:auto;background:#000}
.tabBar::-webkit-scrollbar{display:none}
.tabBar div{padding:7px 12px;font-size:13px;font-weight:700;color:#888;background:transparent;border:1px solid #222;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tabBar div.active{color:#fff;background:transparent;border-color:#ff5ea8}
.sec{padding:14px 12px 6px;font-size:13px;color:#888;font-weight:700;background:#000}
.row{display:flex;gap:10px;padding:12px 12px;align-items:center;cursor:pointer;background:#000;border-bottom:1px solid #111}
.row:active{background:#111}
.row .txt{flex:1;font-size:13.5px;line-height:1.35;min-width:0}
.row .txt b{font-weight:800}
.row .txt span{color:#aaa;font-weight:400}
.row .txt small{display:block;color:#888;font-size:11px;margin-top:2px;font-weight:400}
.row .txt .warn{color:#ff9a00;font-size:11px}
.tagMini{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;border:1px solid #333;color:#ff8ac2;flex-shrink:0;letter-spacing:.5px}
.btnRow{display:flex;gap:6px;flex-shrink:0;align-items:center}
.acceptBtn{background:#00c853;color:#fff;border:0;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.rejectBtn{background:transparent;color:#ff5a5a;border:1px solid #333;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.blockBtn{background:transparent;color:#888;border:1px solid #333;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}
.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}
.bottom-nav a.active{color:#ff5ea8}
.bottom-nav a.active svg{stroke:#ff5ea8}
.bottom-nav span{font-size:10px;color:#8e8e8e}
.bottom-nav a.active span{color:#ff5ea8;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555;background:#111}
.liveToast{position:fixed;top:-90px;left:12px;right:12px;max-width:426px;margin:auto;background:#000;border:1px solid #333;color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.8);transition:top .7s ease,opacity .7s ease;opacity:0}
.liveToast.show{top:14px;opacity:1}
.liveToast small{display:block;font-size:11px;color:#999;font-weight:400;margin-top:2px}
</style>
</head>
<body>
<div class="top"><div class="logoBox" onclick="location.href='./index.html'">P</div><div class="logoTxt" onclick="location.href='./index.html'">Pixoro</div><b>Notifications</b><button class="bellBtn" onclick="markAllRead()"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot" id="bellDot"></span></button></div>
<div class="safeBar"><b>Pixoro Safety ON</b> • Follow Request - Nee Accept Panna Thaan Follow Aagum • Stranger Comment - Hidden • Block - 1 Click la<br><span id="pushStatus" style="color:#ff9a00">Push: Checking...</span></div>
<div class="tabBar"><div class="active" onclick="filterNot('all',this)">All</div><div onclick="filterNot('like',this)">Likes</div><div onclick="filterNot('follow',this)">Requests</div><div onclick="filterNot('comment',this)">Comments</div></div>
<div id="liveToast" class="liveToast" onclick="hideLiveToast()"><div style="flex:1"><div id="liveToastTxt"></div><small>Pixoro • Just now</small></div><span style="color:#888;font-size:14px">✕</span></div>
<div id="notList"><p style="text-align:center;padding:60px;color:#888">Loading...</p></div>
<div class="bottom-nav">
<a href="./index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
<a href="./search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
<a href="./reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a>
<a href="./dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
<a href="./profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a>
</div>
<script>
let supa = window.supa;
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase() || ''; }
let ME='', ME_ID='', allNots=[], profileMap={}, profileById={}, followerIds=new Set(), blockedIds=new Set(), acceptedIds=new Set();
let curFilter='all', _liveStarted=false, _toastTimer=null;
function isToday(t){ if(!t) return false; let d=new Date(t), n=new Date(); return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
function timeAgo(t){ if(!t) return ''; let d=Math.floor((new Date()-new Date(t))/1000); if(d<60) return 'now'; if(d<3600) return Math.floor(d/60)+'m'; if(d<86400) return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d'; }
function setPushStatus(t){ let el=document.getElementById('pushStatus'); if(el) el.innerText='Push: '+t; }
async function savePushToken(){
  try{
    setPushStatus('Permission kekuren da...');
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ setPushStatus('Permission DENIED da - Allow kudunga da'); return; }
    setPushStatus('Token edukkuren da...');
    let tries=0; while(!swReg && tries<20){ await new Promise(r=>setTimeout(r,300)); tries++; }
    const token = await messaging.getToken({ vapidKey: "BNiep_ITMRi7e9gX4mRukcyoIHhATY6RvfLW5uWG1FZeFzpoxO57xSTz5YOLkrczx11xVD1UO9wixj1Ca1G6uQ4", serviceWorkerRegistration: swReg });
    if(token){
      localStorage.setItem('pixoro_fcm_token', token);
      setPushStatus('Token kedaichiduchu da ✅ - Saving...');
      if(ME_ID){
        const {error} = await supa.from('profiles').update({ fcm_token: token }).eq('id', ME_ID);
        if(error){ setPushStatus('Supabase Error: '+error.message); console.log('Supabase Error', error); }
        else { setPushStatus('Push ON ✅ - Token Saved da 🎉'); console.log('FCM Token Saved da'); }
      }
    } else { setPushStatus('Token kedaikala da'); }
  }catch(e){ setPushStatus('Push Error: '+e.message); console.log('Push Error', e); }
}
async function loadNots(){
  try{
    let tries=0; while(!window.supa && tries<30){ await new Promise(r=>setTimeout(r,200)); tries++; }
    supa=window.supa||supa; if(!supa) return;
    let {data:{session}} = await supa.auth.getSession(); if(!session){ location.href='./login.html'; return; }
    ME_ID=session.user.id; window.ME_ID=ME_ID;
    let {data:myProf} = await supa.from('profiles').select('*').eq('id',ME_ID).maybeSingle();
    ME=cleanUser(myProf?.username||session.user.email.split('@')[0]);
    let nav=document.getElementById('navPfp'); if(nav && myProf?.avatar_url) nav.src=myProf.avatar_url;
    let {data:profs} = await supa.from('profiles').select('*'); (profs||[]).forEach(p=>{ profileMap[cleanUser(p.username)]=p; profileById[String(p.id)]=p; });
    try{ let {data:fl}=await supa.from('follows').select('follower_id').eq('following_id',ME_ID); (fl||[]).forEach(r=>followerIds.add(String(r.follower_id))); }catch(e){}
    try{ let {data:fl2}=await supa.from('followers').select('follower_id').eq('following_id',ME_ID); (fl2||[]).forEach(r=>followerIds.add(String(r.follower_id))); }catch(e){}
    try{ blockedIds = new Set(JSON.parse(localStorage.getItem('pixoro_blocked')||'[]')); }catch(e){}
    let {data:nots} = await supa.from('notifications').select('*').eq('to_user_id',ME_ID).order('created_at',{ascending:false}).limit(100);
    allNots=(nots||[]).filter(n=>String(n.from_user_id)!==String(ME_ID)&&['like','follow','comment'].includes(n.type)).filter(n=>!blockedIds.has(String(n.from_user_id))).map(n=>{
      let pr=profileById[String(n.from_user_id)]||{}; let uname=n.from_username||pr.username||'pixoro';
      return {...n, from_username:uname, message:n.message||(n.type==='follow'?'sent you a follow request':n.type==='like'?'liked your post':'commented on your post')};
    });
    renderNots(curFilter); startLive(); savePushToken();
  }catch(e){ document.getElementById('notList').innerHTML='<p style="text-align:center;padding:40px;color:#ff5ea8">Error: '+e.message+'</p>'; }
}
function groupNots(list){
  let groups=[], map={};
  for(let n of list){
    let key = n.type+'_'+(n.post_id||n.from_user_id);
    if(n.type==='follow') key='follow_'+n.from_user_id;
    if(!map[key]){ let g={key, type:n.type, post_id:n.post_id, users:[], latest:n.created_at, ids:[], is_read:n.is_read}; map[key]=g; groups.push(g); }
    let g=map[key];
    if(!g.users.find(u=>String(u.id)===String(n.from_user_id))) g.users.push({id:n.from_user_id, username:n.from_username});
    g.ids.push(n.id);
    if(new Date(n.created_at)>new Date(g.latest)) g.latest=n.created_at;
    if(!n.is_read) g.is_read=false;
  }
  return groups;
}
function oneGroupRow(g){
  let first = g.users[0]||{username:'user'};
  let second = g.users[1];
  let others = g.users.length-2;
  let names = '<b>'+cleanUser(first.username)+'</b>';
  if(second) names += ', <b>'+cleanUser(second.username)+'</b>';
  if(others>0) names += ' and others';
  let isFollower = followerIds.has(String(first.id)) || acceptedIds.has(String(first.id));
  let action = g.type==='like' ? ' liked your post.' : g.type==='comment' ? ' commented on your post.' : ' sent you a follow request.';
  let extra=''; let warn='';
  if(g.type==='comment'){
    if(!isFollower){ extra = ' <span>Stranger comment hidden - Followers mattum paakka mudiyum</span>'; warn = '<div class="warn">Hidden • Follow Accept Panna Thaan Theriyum</div>'; }
    else { let c = allNots.find(n=>String(n.post_id)===String(g.post_id)&&n.type==='comment'); if(c && c.message) extra = ' <span>"'+c.message.replace('commented: ','').replace(/^"|"$/g,'')+'"</span>'; }
  }
  let tag = g.type==='like' ? 'LIKE' : g.type==='follow' ? 'REQUEST' : 'COMMENT';
  let right='';
  if(g.type==='follow' && !acceptedIds.has(String(first.id))){
    right = `<div class="btnRow"><button class="acceptBtn" onclick="event.stopPropagation();acceptFollow('${first.id}','${g.key}')">Accept</button><button class="rejectBtn" onclick="event.stopPropagation();rejectFollow('${first.id}','${g.key}')">Reject</button><button class="blockBtn" onclick="event.stopPropagation();blockUser('${first.id}','${g.key}')">Block</button></div>`;
  } else {
    right = `<div class="btnRow">${g.type!=='follow' ? `<span class="tagMini">${tag}</span>` : `<span class="tagMini">ACCEPTED</span>`}<button class="blockBtn" onclick="event.stopPropagation();blockUser('${first.id}','${g.key}')">Block</button></div>`;
  }
  let click = g.type==='follow' ? `./profile.html?u=${first.id}` : g.post_id ? `./index.html?id=${g.post_id}` : `./profile.html?u=${first.id}`;
  return `<div class="row" onclick="openGroup('${g.key}','${click}')"><div class="txt">${names}<span>${action}${extra}</span>${warn}<small>${timeAgo(g.latest)}</small></div>${right}</div>`;
}
function renderNots(filter){
  curFilter=filter;
  let list = filter==='all' ? allNots : allNots.filter(n=>n.type===filter);
  let todayGroups = groupNots(list.filter(n=>isToday(n.created_at)));
  let earlierGroups = groupNots(list.filter(n=>!isToday(n.created_at)));
  let html='';
  if(todayGroups.length) html+=`<div class="sec">Today</div>`+todayGroups.map(oneGroupRow).join('');
  if(earlierGroups.length) html+=`<div class="sec">Earlier</div>`+earlierGroups.map(oneGroupRow).join('');
  if(!todayGroups.length && !earlierGroups.length){
    html+=`<div style="text-align:center;padding:60px"><svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:none;stroke:#333;stroke-width:1.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><p style="color:#888;margin-top:14px">No notifications yet da<br><span style="font-size:12px">Like, comment, follow panna inga varum da!</span></p></div>`;
  }
  document.getElementById('notList').innerHTML=html;
  let hasUnread = allNots.some(n=>!n.is_read);
  let dot=document.getElementById('bellDot'); if(dot) dot.style.display=hasUnread?'block':'none';
}
async function openGroup(key, url){
  let g = groupNots(allNots).find(x=>x.key===key);
  if(g && g.ids.length){ try{ await supa.from('notifications').update({is_read:true}).in('id', g.ids); }catch(e){} g.ids.forEach(id=>{ let n=allNots.find(x=>String(x.id)===String(id)); if(n) n.is_read=true; }); }
  location.href=url;
}
async function acceptFollow(userId, key){
  acceptedIds.add(String(userId)); followerIds.add(String(userId));
  try{ await supa.from('follows').insert([{follower_id:userId, following_id:ME_ID, status:'accepted'}]); }catch(e){}
  try{ await supa.from('follows').update({status:'accepted'}).eq('follower_id',userId).eq('following_id',ME_ID); }catch(e){}
  try{ await supa.from('notifications').update({is_read:true}).eq('from_user_id',userId).eq('to_user_id',ME_ID).eq('type','follow'); }catch(e){}
  renderNots(curFilter);
  showLiveToast({from_username:'Pixoro', message:'Follow request accepted da'});
}
async function rejectFollow(userId, key){
  allNots = allNots.filter(n=>!(n.type==='follow' && String(n.from_user_id)===String(userId)));
  try{ await supa.from('notifications').delete().eq('from_user_id',userId).eq('to_user_id',ME_ID).eq('type','follow'); }catch(e){}
  try{ await supa.from('follows').delete().eq('follower_id',userId).eq('following_id',ME_ID); }catch(e){}
  renderNots(curFilter);
}
async function blockUser(userId, key){
  if(!confirm('Block panna vaa? Inime ivanga notification varaathu da')) return;
  blockedIds.add(String(userId));
  localStorage.setItem('pixoro_blocked', JSON.stringify([...blockedIds]));
  allNots = allNots.filter(n=>String(n.from_user_id)!==String(userId));
  try{ await supa.from('blocked_users').insert([{blocker_id:ME_ID, blocked_id:userId}]); }catch(e){}
  try{ await supa.from('notifications').delete().eq('from_user_id',userId).eq('to_user_id',ME_ID); }catch(e){}
  renderNots(curFilter);
  showLiveToast({from_username:'Pixoro', message:'Blocked da - Safe ah iru da'});
}
function startLive(){
  if(_liveStarted) return; _liveStarted=true;
  try{
    let s=window.supa||supa; if(!s||!ME_ID){ _liveStarted=false; return; }
    s.channel('pixoro-live-noti-'+ME_ID)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'to_user_id=eq.'+ME_ID},(payload)=>{
        let n=payload.new; if(String(n.from_user_id)===String(ME_ID)) return;
        if(blockedIds.has(String(n.from_user_id))) return;
        if(!profileById[String(n.from_user_id)]){
          s.from('profiles').select('*').eq('id',n.from_user_id).maybeSingle().then(({data})=>{ if(data){ profileById[String(data.id)]=data; profileMap[cleanUser(data.username)]=data; renderNots(curFilter); } });
        }
        let pr=profileById[String(n.from_user_id)]||{}; let uname=n.from_username||pr.username||'pixoro';
        let formatted={...n, from_username:uname, message:n.message||(n.type==='follow'?'sent you a follow request':n.type==='like'?'liked your post':'commented on your post')};
        allNots.unshift(formatted); renderNots(curFilter); showLiveToast(formatted);
        try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
      }).subscribe();
  }catch(e){}
}
function showLiveToast(n){
  document.getElementById('liveToastTxt').innerText='@'+cleanUser(n.from_username||'user')+' '+n.message;
  let t=document.getElementById('liveToast'); t.style.display='flex';
  requestAnimationFrame(()=>{ t.classList.add('show'); });
  clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>hideLiveToast(),5000);
}
function hideLiveToast(){ let t=document.getElementById('liveToast'); t.classList.remove('show'); setTimeout(()=>{ t.style.display='none'; },700); }
async function markAllRead(){ if(!supa) return; await supa.from('notifications').update({is_read:true}).eq('to_user_id',ME_ID).eq('is_read',false); allNots.forEach(n=>n.is_read=true); renderNots(curFilter); }
function filterNot(type, el){
  document.querySelectorAll('.tabBar div').forEach(d=>d.classList.remove('active')); el.classList.add('active');
  renderNots(type);
}
loadNots();
</script>
</body>
</html>
