<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#000;z-index:50}
.logoBox{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#ff5ea8,#a259ff,#ff7a00);display:grid;place-items:center;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.logoTxt{font-size:17px;font-weight:800;background:linear-gradient(90deg,#ff8ac2,#c39bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;white-space:nowrap}
.top b{font-size:17px}
.mark{margin-left:auto;font-size:12px;color:#ff5ea8;cursor:pointer;white-space:nowrap}
/* ✅ BLOCK MASS LOOK DA */
.block{display:flex;gap:10px;padding:12px;margin:0 12px 10px;background:#151515;border:1px solid #222;border-radius:14px;align-items:center;cursor:pointer}
.block.unread{background:#1a1a1a;border-color:#2a2a2a}
.block img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.block .txt{flex:1;font-size:13px;line-height:1.35;min-width:0}
.block .txt b{font-weight:800}
.block .sub{font-size:11.5px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.followBtn{border:1px solid #ff5ea8;color:#ff8ac2;background:transparent;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer}
.iconBadge{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff5ea8,#a259ff);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.sec{padding:14px 14px 6px;font-size:12px;color:#888;font-weight:700}
.tabBar{display:flex;gap:8px;padding:0 14px 10px}
.tabBar div{padding:7px 13px;font-size:12px;font-weight:700;color:#888;background:#151515;border-radius:20px;cursor:pointer;border:1px solid #222}
.tabBar div.active{color:#fff;background:#ff5ea8;border-color:#ff5ea8}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}
.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}
.bottom-nav a.active{color:#ff5ea8}
.bottom-nav a.active svg{stroke:#ff5ea8}
.bottom-nav span{font-size:10px;color:#8e8e8e}
.bottom-nav a.active span{color:#ff5ea8;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555;background:#111}
</style>
</head>
<body>
<div class="top"><div class="logoBox" onclick="location.href='./index.html'">P</div><div class="logoTxt" onclick="location.href='./index.html'">Pixoro</div><b>Notifications</b><span class="mark" onclick="markAllRead()">Mark all read</span></div>
<div class="tabBar"><div class="active" onclick="filterNot('all',this)">All</div><div onclick="filterNot('like',this)">Likes</div><div onclick="filterNot('follow',this)">Follows</div><div onclick="filterNot('comment',this)">Comments</div></div>
<div id="notList"><p style="text-align:center;padding:60px;color:#666">Loading...</p></div>
<div class="bottom-nav">
<a href="./index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
<a href="./search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a>
<a href="./reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a>
<a href="./dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
<a href="./profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a>
</div>
<script>
// ===== CORRECTED v216 - SAME v215 LOGIC - STYLE MATTUM BLOCK MASS DA =====
let supa = window.supa;
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase() || ''; }
let ME='', ME_ID='', allNots=[], profileMap={}, profileById={};
let curFilter = 'all';
function getPfpById(id, uname){
  let p = profileById[String(id)] || profileMap[cleanUser(uname)];
  if(p && (p.avatar_url || p.profile_pic)) return p.avatar_url || p.profile_pic;
  let c = cleanUser(uname) || 'P';
  return 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.charAt(0).toUpperCase())+'&background=ff5ea8&color=fff&size=200&bold=true';
}
function isToday(t){ if(!t) return false; let d=new Date(t), n=new Date(); return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
async function loadNots(){
  try{
    let tries = 0;
    while(!window.supa && tries < 30){ await new Promise(r=>setTimeout(r,200)); tries++; }
    supa = window.supa || supa;
    if(!supa){ document.getElementById('notList').innerHTML = `<p style="text-align:center;padding:40px;color:#666">Supabase connect aagala da - pixoro-core.js ah check pannu da</p>`; return; }
    let {data:{session}} = await supa.auth.getSession();
    if(!session){ location.href='./login.html'; return; }
    ME_ID = session.user.id; window.ME_ID = ME_ID;
    let {data:myProf} = await supa.from('profiles').select('*').eq('id',ME_ID).maybeSingle();
    ME = cleanUser(myProf?.username || session.user.email.split('@')[0]);
    let nav = document.getElementById('navPfp');
    if(nav && myProf?.avatar_url) nav.src = myProf.avatar_url;
    let {data:profs} = await supa.from('profiles').select('*');
    (profs||[]).forEach(p=>{ profileMap[cleanUser(p.username)] = p; profileById[String(p.id)] = p; });
    let {data:nots, error} = await supa.from('notifications').select('*').eq('to_user_id', ME_ID).order('created_at',{ascending:false}).limit(100);
    if(error) throw new Error(error.message);
    let seen = new Set();
    allNots = (nots||[]).filter(n=>{
      if(String(n.from_user_id)===String(ME_ID)) return false;
      if(!['like','follow','comment'].includes(n.type)) return false;
      let key = n.type + '_' + String(n.from_user_id) + '_' + (n.post_id||'');
      if(n.type==='follow') key = 'follow_' + String(n.from_user_id);
      if(seen.has(key)) return false;
      seen.add(key); return true;
    }).map(n=>{
      let fromProf = profileById[String(n.from_user_id)] || {};
      let uname = n.from_username || fromProf.username || 'pixoro';
      return { ...n, from_username: uname, message: n.message || (n.type==='follow' ? 'started following you' : n.type==='like' ? 'liked your post' : n.type==='comment' ? 'commented on your post' : 'sent you a notification') };
    });
    if(!allNots.length){
      document.getElementById('notList').innerHTML = `<div style="text-align:center;padding:60px"><div style="font-size:50px">🔔</div><p style="color:#666;margin-top:10px">No notifications yet da<br><span style="font-size:12px">Like, comment, follow panna inga varum da!</span></p></div>`;
      return;
    }
    renderNots('all');
  }catch(e){
    document.getElementById('notList').innerHTML = `<p style="text-align:center;padding:40px;color:#ff5ea8">Error: ${e.message}</p><p style="text-align:center;color:#666;font-size:12px">Supabase la notifications table irukka nu paaru da</p>`;
  }
}
function oneBlock(n){
  let uname = cleanUser(n.from_username);
  let pfp = getPfpById(n.from_user_id, uname);
  let icon = n.type=='like' ? '❤️' : n.type=='follow' ? '👤' : n.type=='comment' ? '💬' : '🔔';
  let sub = n.type==='follow' ? 'Follow back • '+timeAgo(n.created_at) : (n.message||'')+' • '+timeAgo(n.created_at);
  let right = n.type==='follow' ? `<button class="followBtn" onclick="event.stopPropagation();openNot('','${encodeURIComponent(uname)}','${n.from_user_id||''}','${n.id||''}','follow')">Follow</button>` : `<div class="iconBadge">${icon}</div>`;
  return `<div class="block ${!n.is_read?'unread':''}" onclick="openNot('${n.post_id||''}','${encodeURIComponent(uname)}','${n.from_user_id||''}','${n.id||''}','${n.type||''}')"><img src="${pfp}" onerror="this.src='https://ui-avatars.com/api/?name=P&background=333&color=fff'"><div class="txt"><b>@${uname}</b> ${n.message||''}<div class="sub">${sub}</div></div>${right}</div>`;
}
function renderNots(filter){
  curFilter = filter;
  let list = document.getElementById('notList');
  let filtered = filter=='all' ? allNots : allNots.filter(n=> n.type==filter);
  if(!filtered.length){ list.innerHTML = `<p style="text-align:center;padding:40px;color:#666">No ${filter} notifications da</p>`; return; }
  let today = filtered.filter(n=>isToday(n.created_at));
  let earlier = filtered.filter(n=>!isToday(n.created_at));
  let html='';
  if(today.length) html+=`<div class="sec">Today</div>`+today.map(oneBlock).join('');
  if(earlier.length) html+=`<div class="sec">Earlier</div>`+earlier.map(oneBlock).join('');
  if(!today.length && !earlier.length) html=filtered.map(oneBlock).join('');
  list.innerHTML=html;
}
async function openNot(pid, unameEnc, fromId, notId, type){
  let uname = decodeURIComponent(unameEnc || '');
  try{ if(notId && supa) await supa.from('notifications').update({is_read:true}).eq('id', notId); }catch(e){}
  if(type==='follow'){
    if(fromId) location.href = './profile.html?u=' + encodeURIComponent(fromId);
    else if(uname) location.href = './profile.html?u=' + encodeURIComponent(uname);
    else location.href = './index.html';
  } else if(pid){
    location.href = './index.html?id=' + encodeURIComponent(pid);
  } else if(uname){
    location.href = './profile.html?u=' + encodeURIComponent(uname);
  } else {
    location.href = './index.html';
  }
}
async function markAllRead(){
  if(!supa) return;
  await supa.from('notifications').update({is_read:true}).eq('to_user_id', ME_ID).eq('is_read', false);
  allNots.forEach(n=> n.is_read = true);
  renderNots(curFilter);
}
function filterNot(type, el){
  document.querySelectorAll('.tabBar div').forEach(d=> d.classList.remove('active'));
  el.classList.add('active');
  renderNots(type);
}
function timeAgo(t){
  if(!t) return 'now';
  let d = Math.floor((new Date() - new Date(t))/1000);
  if(d<60) return d+'s ago';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}
loadNots();
</script>
</body>
</html>
