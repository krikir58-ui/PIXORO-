<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifications - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{background:#000!important;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #111;position:sticky;top:0;background:#000;z-index:50;height:56px}
.notItem{display:flex;gap:12px;padding:14px;border-bottom:1px solid #111;align-items:center;cursor:pointer}
.notItem.unread{background:#111}
.notItem img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.notText{flex:1;font-size:14px;line-height:1.4}.notTime{font-size:11px;color:#888;margin-top:2px}
.tabBar{display:flex;border-bottom:1px solid #222}
.tabBar div{flex:1;text-align:center;padding:12px;font-size:13px;font-weight:700;color:#666;border-bottom:2px solid transparent;cursor:pointer}
.tabBar div.active{color:#fff;border-bottom:2px solid #fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #111;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#ff5ea8}.bottom-nav a.active svg{stroke:#ff5ea8}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#ff5ea8;font-weight:700}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #555;background:#111}
</style></head><body>
<div class="top"><span onclick="location.href='index.html'" style="font-size:22px;cursor:pointer">←</span><b style="font-size:19px">Notifications</b><span onclick="markAllRead()" style="margin-left:auto;font-size:12px;color:#ff5ea8;cursor:pointer">Mark all read</span></div>
<div class="tabBar"><div class="active" onclick="filterNot('all',this)">All</div><div onclick="filterNot('like',this)">Likes</div><div onclick="filterNot('follow',this)">Follows</div><div onclick="filterNot('comment',this)">Comments</div></div>
<div id="notList"><p style="text-align:center;padding:60px;color:#666">Loading...</p></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa = window.supa;
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase() || ''; }
let ME='', ME_ID='', allNots=[], profileMap={}, profileById={};
let curFilter = 'all';

function getPfpById(id, uname){
  let p = profileById[id] || profileMap[cleanUser(uname)];
  if(p?.avatar_url) return p.avatar_url;
  if(p?.profile_pic) return p.profile_pic;
  let c = cleanUser(uname) || 'P';
  return 'https://ui-avatars.com/api/?name='+c.charAt(0).toUpperCase()+'&background=333&color=fff&size=200&bold=true';
}

async function loadNots(){
  try{
    if(!window.supa){ setTimeout(loadNots,300); return; }
    supa = window.supa;
    let {data:{session}} = await supa.auth.getSession();
    if(!session){ location.href='login.html'; return; }
    ME_ID = session.user.id;
    let {data:myProf} = await supa.from('profiles').select('*').eq('id',ME_ID).single();
    ME = cleanUser(myProf?.username || session.user.email.split('@')[0]);
    let nav = document.getElementById('navPfp');
    if(nav) nav.src = myProf?.avatar_url || '';

    let {data:profs} = await supa.from('profiles').select('*');
    (profs||[]).forEach(p=>{ profileMap[cleanUser(p.username)] = p; profileById[String(p.id)] = p; });

    // SERVER ONLY DA - notifications table la irundhu mattum da - NO LOCALSTORAGE DA
    let {data:nots, error} = await supa.from('notifications').select('*').eq('to_user_id', ME_ID).order('created_at',{ascending:false}).limit(100);
    if(error){ throw new Error(error.message); }

    // FIX DA: from_user_id la irundhu username ah eduthu da
    allNots = (nots||[]).map(n=>{
      let fromProf = profileById[String(n.from_user_id)] || {};
      let uname = n.from_username || fromProf.username || '';
      return {
        ...n,
        from_username: uname,
        from_user_id: n.from_user_id,
        message: n.message || (n.type==='follow' ? 'started following you 👤' : n.type==='like' ? 'liked your post ❤️' : 'commented 💬')
      };
    });

    if(!allNots.length){
      document.getElementById('notList').innerHTML = `<div style="text-align:center;padding:60px"><div style="font-size:50px">🔔</div><p style="color:#666;margin-top:10px">No notifications yet da<br><span style="font-size:12px">Like, comment, follow panna inga varum da!</span></p></div>`;
      return;
    }
    renderNots('all');
  }catch(e){
    document.getElementById('notList').innerHTML = `<p style="text-align:center;padding:40px;color:#666">${e.message}</p>`;
  }
}

function renderNots(filter){
  curFilter = filter;
  let list = document.getElementById('notList');
  let filtered = filter=='all' ? allNots : allNots.filter(n=> n.type==filter);
  if(!filtered.length){ list.innerHTML = `<p style="text-align:center;padding:40px;color:#666">No ${filter} notifications da</p>`; return; }
  list.innerHTML = filtered.map(n=>{
    let uname = cleanUser(n.from_username);
    let pfp = getPfpById(n.from_user_id, uname);
    let icon = n.type=='like' ? '❤️' : n.type=='follow' ? '👤' : '💬';
    let safeUname = uname.replace(/'/g,"");
    return `<div class="notItem ${!n.is_read?'unread':''}" onclick="openNot('${n.post_id||''}','${safeUname}','${n.from_user_id||''}','${n.id||''}')"><img src="${pfp}"><div class="notText"><b>@${uname}</b> ${n.message||''}<div class="notTime">${timeAgo(n.created_at)}</div></div><div style="font-size:20px">${icon}</div></div>`;
  }).join('');
}

async function openNot(pid, uname, fromId, notId){
  // Click panna - Server la Read ah Maathu da
  if(notId){
    await supa.from('notifications').update({is_read:true}).eq('id', notId);
  }
  if(pid) location.href='reels.html?id='+pid;
  else if(fromId) location.href='profile.html?u='+encodeURIComponent(fromId);
  else location.href='profile.html?u='+encodeURIComponent(uname);
}

async function markAllRead(){
  // SERVER ONLY DA - Supabase la Update pannu da
  await supa.from('notifications').update({is_read:true}).eq('to_user_id', ME_ID).eq('is_read', false);
  allNots.forEach(n=> n.is_read = true);
  renderNots(curFilter);
}

function filterNot(type, el){
  document.querySelectorAll('.tabBar div').forEach(d=> d.classList.remove('active'));
  el.classList.add('active');
  renderNots(type);
}

function timeAgo(t){
  if(!t) return 'now';
  let d = Math.floor((new Date() - new Date(t))/1000);
  if(d<60) return d+'s ago';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}

loadNots();
</script></body></html>
