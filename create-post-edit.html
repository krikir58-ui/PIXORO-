<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:20px}
.top span{cursor:pointer}
.top .next{color:#4d7cff;font-weight:700}
.wrap{position:relative;width:100%;height:62vh;background:#000;overflow:hidden;display:grid;place-items:center}
.wrap img,.wrap video{width:100%;height:100%;object-fit:cover}
.editTools{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-around}
.editTools div{text-align:center;font-size:12px}
.editTools span{display:grid;place-items:center;width:60px;height:60px;background:#222;border-radius:18px;font-size:26px;margin-bottom:4px}
.sourceRow{display:flex;gap:10px;padding:12px}
.sourceRow button{flex:1;padding:14px;border-radius:16px;border:1px solid #333;background:#111;color:#fff;font-weight:700}
.toolRow{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto}
.toolRow button{background:#111;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:30px;white-space:nowrap}
.filterRow{display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto}
.filterRow button{background:#111;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:30px;white-space:nowrap}
.filterRow button.on{background:#fff;color:#000}
.bottom{display:flex;gap:10px;padding:0 16px 16px}
.bottom button{flex:1;padding:14px;border-radius:20px;border:0;font-weight:800}
.editBtn{background:#222;color:#fff}
.nextBtn{background:linear-gradient(90deg,#ff5ea8,#ff7a00);color:#fff}
</style>
</head>
<body>
<div class="top"><span onclick="history.back()">←</span><b>Edit</b><span class="next" onclick="goShare()">Next</span></div>
<div class="wrap">
  <img id="editImg" src="" style="display:none">
  <video id="editVid" src="" style="display:none" muted loop playsinline autoplay></video>
  <div id="textOver" style="position:absolute;top:35%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none"></div>
  <div style="position:absolute;bottom:100px;left:0;right:0;text-align:center;font-size:13px">Swipe up to edit</div>
  <div class="editTools">
    <div onclick="addText()"><span>Aa</span>Text</div>
    <div onclick="addSticker()"><span>😊</span>Stickers</div>
    <div onclick="document.getElementById('filterRow').scrollIntoView({behavior:'smooth'})"><span>✨</span>Filter</div>
    <div onclick="alert('Crop - Coming Soon da')"><span>✂️</span>Crop</div>
  </div>
</div>
<div class="sourceRow"><button onclick="location.href='./create.html'">📁 Gallery</button><button onclick="document.getElementById('file').click()">📷 Camera</button></div>
<div class="toolRow"><button onclick="alert('Crop - Coming Soon da')">✂️ Crop</button><button>🎨 Filter</button><button onclick="adjust('brightness')">☀️ Bright</button><button onclick="addText()">🔤 Text</button></div>
<div class="filterRow" id="filterRow">
  <button class="on" onclick="setFilter('none',this)">Original</button>
  <button onclick="setFilter('grayscale(1)',this)">B&W</button>
  <button onclick="setFilter('sepia(.8)',this)">Sepia</button>
  <button onclick="setFilter('contrast(1.4) saturate(1.6)',this)">Vivid</button>
  <button onclick="setFilter('brightness(1.2)',this)">Fade</button>
</div>
<div class="bottom"><button class="editBtn" onclick="alert('Edit - Coming Soon da')">Edit</button><button class="nextBtn" onclick="goShare()">Next →</button></div>
<input type="file" id="file" accept="image/*,video/*" capture="environment" hidden>
<script>
let currentFilter='none', currentText='';
function openDB(){
  return new Promise((res,rej)=>{
    let req=indexedDB.open('pixoro-db',1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore('media'); };
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function getDB(k){ let db=await openDB(); return new Promise((res,rej)=>{ let r=db.transaction('media','readonly').objectStore('media').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function saveDB(k,v){ let db=await openDB(); let tx=db.transaction('media','readwrite'); tx.objectStore('media').put(v,k); }
async function load(){
  let blob=await getDB('pixoro_create_media');
  let kind=await getDB('pixoro_create_kind') || 'image';
  if(!blob){ alert('Photo Illa da - Thirumba Select Pannu da'); location.href='./create.html'; return; }
  let url=URL.createObjectURL(blob);
  if(kind==='video'){ let v=document.getElementById('editVid'); v.src=url; v.style.display='block'; v.play(); }
  else { let p=document.getElementById('editImg'); p.src=url; p.style.display='block'; }
  currentFilter=await getDB('pixoro_create_filter') || 'none';
  document.getElementById('editImg').style.filter=currentFilter;
  document.getElementById('editVid').style.filter=currentFilter;
  currentText=await getDB('pixoro_create_text') || '';
  if(currentText){ let o=document.getElementById('textOver'); o.textContent=currentText; o.style.display='block'; }
}
load();
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('#filterRow button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  document.getElementById('editImg').style.filter=f;
  document.getElementById('editVid').style.filter=f;
  saveDB('pixoro_create_filter', f);
}
function adjust(t){ let v=prompt(t+' - 0.5 to 2:','1.2'); if(v){ currentFilter=t+'('+v+')'; setFilter(currentFilter,null); } }
function addText(){ let t=prompt('Text ezhuthu da'); if(!t) return; currentText=t; let o=document.getElementById('textOver'); o.textContent=t; o.style.display='block'; saveDB('pixoro_create_text',t); }
function addSticker(){ let s=prompt('Sticker - 😍 🔥 ❤️'); if(!s) return; currentText=currentText+' '+s; let o=document.getElementById('textOver'); o.textContent=currentText; o.style.display='block'; saveDB('pixoro_create_text',currentText); }
document.getElementById('file').onchange=(e)=>{ let f=e.target.files[0]; if(!f) return; saveDB('pixoro_create_media', f); saveDB('pixoro_create_kind', f.type.includes('video')?'video':'image'); location.reload(); };
async function goShare(){ await saveDB('pixoro_create_filter', currentFilter); await saveDB('pixoro_create_text', currentText); location.href='./create-share.html'; }
</script>
</body>
</html>
