<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Post - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}.top{display:flex;justify-content:space-between;padding:14px;font-size:20px}.wrap{height:60vh;background:#111}.wrap img{width:100%;height:100%;object-fit:contain}.tabs{display:flex;gap:10px;padding:12px;justify-content:center}.tabs b{padding:8px 16px;background:#222;border-radius:20px}.tabs b.on{background:#fff;color:#000}.filters{display:flex;gap:10px;overflow-x:auto;padding:12px}.filters div{text-align:center}.filters img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid transparent}.filters div.on img{border-color:#fff}.filters small{font-size:11px}.bottom{display:flex;justify-content:space-between;padding:14px}.bottom button{border:0;padding:14px 22px;border-radius:30px;font-weight:800}.next{background:#4d7cff;color:#fff}</style></head><body>
<div class="top"><span onclick="history.back()">←</span><b>Edit</b><span onclick="location.href='./create-post-upload.html'" style="color:#4d7cff">Next</span></div>
<div class="wrap"><img id="img" src=""><div id="textOver" style="position:absolute;top:35%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none"></div></div>
<div class="tabs"><b class="on" onclick="showTab('filter',this)">Filter</b><b onclick="showTab('edit',this)">Edit</b><b onclick="addText()">Aa Text</b><b onclick="addSticker()">😊 Sticker</b></div>
<div class="filters" id="filterRow">
<div class="on" onclick="setF('none',this)"><img src="https://picsum.photos/100/100?random=31"><br><small>Original</small></div>
<div onclick="setF('grayscale(1)',this)"><img src="https://picsum.photos/100/100?random=31" style="filter:grayscale(1)"><br><small>B&W</small></div>
<div onclick="setF('sepia(.8)',this)"><img src="https://picsum.photos/100/100?random=31" style="filter:sepia(.8)"><br><small>Sepia</small></div>
<div onclick="setF('contrast(1.4) saturate(1.6)',this)"><img src="https://picsum.photos/100/100?random=31" style="filter:contrast(1.4) saturate(1.6)"><br><small>Vivid</small></div>
<div onclick="setF('brightness(1.2)',this)"><img src="https://picsum.photos/100/100?random=31" style="filter:brightness(1.2)"><br><small>Fade</small></div>
</div>
<div class="filters" id="editRow" style="display:none"><button onclick="adjust('brightness')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Brightness</button><button onclick="adjust('contrast')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Contrast</button><button onclick="adjust('saturate')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Saturation</button></div>
<div class="bottom"><button onclick="history.back()" style="background:#222;color:#fff">Edit photo</button><button class="next" onclick="location.href='./create-post-upload.html'">Next →</button></div>
<script>let url=localStorage.getItem('pixoro_post_media')||'https://picsum.photos/500/500?random=20';document.getElementById('img').src=url;function setF(f,el){let im=document.getElementById('img');im.style.filter=f;localStorage.setItem('pixoro_post_filter',f);document.querySelectorAll('#filterRow div').forEach(d=>d.classList.remove('on'));el.classList.add('on');}function showTab(t,el){document.querySelectorAll('.tabs b').forEach(b=>b.classList.remove('on'));el.classList.add('on');document.getElementById('filterRow').style.display=t==='filter'?'flex':'none';document.getElementById('editRow').style.display=t==='edit'?'flex':'none';}function adjust(type){let v=prompt(type+' - 0.5 to 2 - Value Podu da:', '1.2');if(v){let im=document.getElementById('img');im.style.filter=type+'('+v+')';localStorage.setItem('pixoro_post_filter',type+'('+v+')');}}function addText(){let t=prompt('Text ezhuthu da:');if(t){let o=document.getElementById('textOver');o.innerText=t;o.style.display='block';localStorage.setItem('pixoro_post_text',t);}}function addSticker(){let s=prompt('Sticker - 😍 🔥 ❤️');if(s){let o=document.getElementById('textOver');o.innerText+=' '+s;o.style.display='block';}}</script>
</body></html>
