<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Post - Pixoro</title><link rel="stylesheet" href="css/pixoro-style.css"></head><body>
<div class="top"><b onclick="history.back()">←</b><b>Edit Post</b><b style="color:#ff5ea8" onclick="location.href='./create-post-upload.html'">Next</b></div>
<div class="preview"><img id="eImg"></div>
<div class="filters"><button onclick="setF('none',this)" class="on">Normal</button><button onclick="setF('grayscale(1)',this)">Black</button><button onclick="setF('sepia(0.8)',this)">Sepia</button><button onclick="setF('contrast(1.4) saturate(1.5)',this)">Vivid</button><button onclick="setF('brightness(1.2)',this)">Bright</button></div>
<button class="share" onclick="location.href='./create-post-upload.html'">Next →</button>
<script>let img=document.getElementById('eImg');img.src=localStorage.getItem('pixoro_temp_post')||'https://picsum.photos/450/450?random=10';function setF(f,btn){img.style.filter=f;localStorage.setItem('pixoro_temp_filter',f);document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}</script>
</body></html>
