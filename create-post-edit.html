<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Edit - Pixoro - v1051</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:20px;background:#000}
.top span{cursor:pointer}
.top .next{color:#4d7cff;font-weight:700}
/* ✅ FULLSCREEN REELS SIZE DA */
.wrap{position:relative;width:100%;height:calc(100vh - 190px);background:#000;overflow:hidden;display:grid;place-items:center;touch-action:none}
.wrap img,.wrap video{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform;touch-action:none}
/* ✅ DRAWING CANVAS - PHOTO MELA DA - ITHU THAAN DA GIRI */
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:7;touch-action:none;display:none}
#drawCanvas.on{display:block}
.tools{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-around;padding:0 8px;z-index:8}
.tools div{text-align:center;font-size:13px}
.tools span{display:grid;place-items:center;width:56px;height:56px;background:rgba(0,0,0,.6);border-radius:14px;font-size:24px;margin-bottom:4px}
.tools div.active span{background:#4d7cff}
/* ✅ DRAWING BAR DA - COLOR + BRUSH + ERASER DA */
.drawBar{display:none;gap:8px;padding:10px 12px;background:#111;overflow-x:auto;align-items:center}
.drawBar.show{display:flex}
.drawBar button{border:0;padding:10px 12px;border-radius:20px;white-space:nowrap;color:#fff;background:#222}
.drawBar button.on{background:#fff;color:#000}
.colorBtn{width:32px!important;height:32px!important;border-radius:50%!important;padding:0!important;border:2px solid #fff!important}
.zoomBar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#000}
.zoomBar input{flex:1;accent-color:#4d7cff}
.zoomBar button{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:20px;white-space:nowrap}
.bottomBar{background:#000;padding:0 14px 14px;display:flex;justify-content:space-between;align-items:center}
.bottomBar button{border:0;border-radius:30px;padding:14px 22px;font-weight:800;font-size:16px}
.editBtn{background:#222;color:#fff}
.nextBtn{background:#5b5bff;color:#fff}
.filterRow{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:#000}
.filterRow button{background:#111;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:30px;white-space:nowrap}
.filterRow button.on{background:#fff;color:#000}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='./create.html?v=1051'">✕</span><b></b><span class="next" onclick="goShare()">Next</span></div>
<div class="wrap" id="wrapBox">
  <img id="editImg" src="" style="display:none">
  <video id="editVid" src="" style="display:none" muted loop playsinline autoplay></video>
  <div id="emptyBox" style="text-align:center;display:none;position:relative;z-index:5">
    <div style="font-size:50px">📷</div>
    <div style="color:#888;font-size:13px;margin-top:8px">Photo Illa da - Ingaye Select Pannidu da</div>
    <button onclick="document.getElementById('file').click()" style="margin-top:14px;background:#fff;color:#000;border:0;padding:12px 22px;border-radius:20px;font-weight:800">📁 Select Photo</button>
  </div>
  <div id="textOver" style="position:absolute;top:35%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none;z-index:5"></div>
  <div id="swipeTxt" style="position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:15px;display:none;z-index:5">^<br>Swipe up to edit</div>
  <!-- ✅ DRAWING CANVAS DA -->
  <canvas id="drawCanvas"></canvas>
  <div class="tools">
    <div onclick="alert('Audio - Coming Soon da')"><span>🎵</span>Audio</div>
    <div onclick="addText()"><span>Aa</span>Text</div>
    <!-- ✅ PUTHUSU DA - DRAWING BUTTON DA -->
    <div id="drawBtn" onclick="toggleDraw()"><span>✏️</span>Draw</div>
    <div onclick="alert('Voice - Coming Soon da')"><span>🎙️</span>Voice</div>
    <div onclick="addSticker()"><span>😊</span>Stickers</div>
  </div>
</div>
<!-- ✅ DRAWING BAR DA - COLOR / BRUSH / ERASER / UNDO DA -->
<div class="drawBar" id="drawBar">
  <button class="colorBtn on" style="background:#ff2d55" onclick="setColor('#ff2d55',this)"></button>
  <button class="colorBtn" style="background:#fff" onclick="setColor('#ffffff',this)"></button>
  <button class="colorBtn" style="background:#ffcc00" onclick="setColor('#ffcc00',this)"></button>
  <button class="colorBtn" style="background:#00ff88" onclick="setColor('#00ff88',this)"></button>
  <button class="colorBtn" style="background:#4d7cff" onclick="setColor('#4d7cff',this)"></button>
  <button class="colorBtn" style="background:#ff7a00" onclick="setColor('#ff7a00',this)"></button>
  <button onclick="setBrush(4,this)">Thin</button>
  <button class="on" onclick="setBrush(8,this)">Medium</button>
  <button onclick="setBrush(16,this)">Thick</button>
  <button onclick="setEraser()">🧹 Eraser</button>
  <button onclick="undoDraw()">↩ Undo</button>
  <button onclick="clearDraw()">🗑 Clear</button>
  <button onclick="toggleDraw()" style="background:#4d7cff">✅ Done</button>
</div>
<div class="zoomBar">
  <button onclick="setZoom(1)">↩ Reset</button>
  <span>➖</span><input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1" oninput="setZoom(parseFloat(this.value))"><span>➕</span>
  <button onclick="toggleFit()">Fit / Fill</button>
</div>
<div class="filterRow" id="filterRow">
  <button class="on" onclick="setFilter('none',this)">Original</button>
  <button onclick="setFilter('grayscale(1)',this)">B&W</button>
  <button onclick="setFilter('sepia(.8)',this)">Sepia</button>
  <button onclick="setFilter('contrast(1.4) saturate(1.6)',this)">Vivid</button>
  <button onclick="setFilter('brightness(1.2)',this)">Fade</button>
</div>
<div class="bottomBar">
  <button class="editBtn" onclick="alert('Edit video - Coming Soon da')">Edit video</button>
  <button class="nextBtn" onclick="goShare()">Next →</button>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<input type="file" id="cameraFile" accept="image/*,video/*" capture="environment" hidden>
<script>
let currentFilter='none', currentText='', currentBlob=null, currentKind='image', currentUrl='', currentType='reels';
let zoom=1, panX=0, panY=0, fitMode='cover';
let startDist=0, startZoom=1, startX=0, startY=0, startPanX=0, startPanY=0, dragging=false;
// ✅ DRAWING VARIABLES DA
let drawing=false, drawMode=false, drawColor='#ff2d55', brushSize=8, isEraser=false;
let drawCanvas=document.getElementById('drawCanvas'), dctx=drawCanvas.getContext('2d');
let history=[];
function openDB(){ return new Promise((res,rej)=>{ let req=indexedDB.open('pixoro-db',1); req.onupgradeneeded=()=>{ req.result.createObjectStore('media'); }; req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
async function getDB(k){ let db=await openDB(); return new Promise((res,rej)=>{ let r=db.transaction('media','readonly').objectStore('media').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function saveDB(k,v){ let db=await openDB(); return new Promise((res,rej)=>{ let tx=db.transaction('media','readwrite'); tx.objectStore('media').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function resizeCanvas(){
  let w=document.getElementById('wrapBox');
  let old=drawCanvas.toDataURL();
  drawCanvas.width=w.clientWidth; drawCanvas.height=w.clientHeight;
  let img=new Image(); img.onload=()=>dctx.drawImage(img,0,0); img.src=old;
}
function applyTransform(){
  let el=currentKind==='video' ? document.getElementById('editVid') : document.getElementById('editImg');
  el.style.transform=`translate(-50%,-50%) translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoomSlider').value=zoom;
}
function setZoom(z){ if(drawMode) return; zoom=Math.max(1,Math.min(3,z)); if(zoom===1){ panX=0; panY=0; } applyTransform(); saveDB('pixoro_create_zoom', zoom); }
function toggleFit(){ fitMode=fitMode==='cover'?'contain':'cover'; document.getElementById('editImg').style.objectFit=fitMode; document.getElementById('editVid').style.objectFit=fitMode; }
// ✅ DRAWING - TOGGLE DA
function toggleDraw(){
  if(!currentBlob){ alert('Mudalla Photo Select Pannu da'); document.getElementById('file').click(); return; }
  drawMode=!drawMode;
  document.getElementById('drawCanvas').classList.toggle('on', drawMode);
  document.getElementById('drawBar').classList.toggle('show', drawMode);
  document.getElementById('drawBtn').classList.toggle('active', drawMode);
  if(drawMode){ resizeCanvas(); alert('Drawing On da ✏️ - Photo mela - Kaiyaala - Drawing Pannu da'); }
}
function setColor(c,btn){ isEraser=false; drawColor=c; document.querySelectorAll('.colorBtn').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on'); }
function setBrush(s,btn){ isEraser=false; brushSize=s; document.querySelectorAll('#drawBar button').forEach(b=>{ if(b.innerText.includes('Thin')||b.innerText.includes('Medium')||b.innerText.includes('Thick')) b.classList.remove('on'); }); if(btn) btn.classList.add('on'); }
function setEraser(){ isEraser=true; brushSize=20; alert('Eraser On da 🧹 - Drawing ah - Azhikalam da'); }
function saveHistory(){ try{ history.push(drawCanvas.toDataURL()); if(history.length>20) history.shift(); }catch(e){} }
function undoDraw(){ if(!history.length){ alert('Undo Panna - Onnum Illa da'); return; } let last=history.pop(); let img=new Image(); img.onload=()=>{ dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height); dctx.drawImage(img,0,0); }; img.src=last; }
function clearDraw(){ saveHistory(); dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height); }
// ✅ DRAWING - TOUCH + MOUSE DA
function getPos(e){
  let r=drawCanvas.getBoundingClientRect();
  let x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x,y};
}
let lastPos=null;
drawCanvas.addEventListener('touchstart', e=>{ e.preventDefault(); saveHistory(); drawing=true; lastPos=getPos(e); },{passive:false});
drawCanvas.addEventListener('touchmove', e=>{ e.preventDefault(); if(!drawing) return; let p=getPos(e); dctx.lineCap='round'; dctx.lineJoin='round'; if(isEraser){ dctx.globalCompositeOperation='destination-out'; } else { dctx.globalCompositeOperation='source-over'; dctx.strokeStyle=drawColor; } dctx.lineWidth=brushSize; dctx.beginPath(); dctx.moveTo(lastPos.x,lastPos.y); dctx.lineTo(p.x,p.y); dctx.stroke(); lastPos=p; },{passive:false});
drawCanvas.addEventListener('touchend', ()=>{ drawing=false; dctx.globalCompositeOperation='source-over'; });
drawCanvas.addEventListener('mousedown', e=>{ saveHistory(); drawing=true; lastPos=getPos(e); });
drawCanvas.addEventListener('mousemove', e=>{ if(!drawing) return; let p=getPos(e); dctx.lineCap='round'; dctx.lineJoin='round'; if(isEraser){ dctx.globalCompositeOperation='destination-out'; } else { dctx.globalCompositeOperation='source-over'; dctx.strokeStyle=drawColor; } dctx.lineWidth=brushSize; dctx.beginPath(); dctx.moveTo(lastPos.x,lastPos.y); dctx.lineTo(p.x,p.y); dctx.stroke(); lastPos=p; });
window.addEventListener('mouseup', ()=>{ drawing=false; dctx.globalCompositeOperation='source-over'; });
// ✅ PINCH + DRAG - DRAWING ON NA - ZOOM OFF DA
let stage=document.getElementById('wrapBox');
stage.addEventListener('touchstart', e=>{
  if(drawMode) return;
  if(e.touches.length===2){ startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); startZoom=zoom; }
  else if(e.touches.length===1){ dragging=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; startPanX=panX; startPanY=panY; }
},{passive:true});
stage.addEventListener('touchmove', e=>{
  if(drawMode) return;
  if(e.touches.length===2 && startDist>0){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); setZoom(startZoom * (d/startDist)); }
  else if(e.touches.length===1 && dragging && zoom>1){ panX=startPanX + (e.touches[0].clientX-startX); panY=startPanY + (e.touches[0].clientY-startY); panX=Math.max(-200,Math.min(200,panX)); panY=Math.max(-300,Math.min(300,panY)); applyTransform(); }
},{passive:true});
stage.addEventListener('touchend', ()=>{ dragging=false; startDist=0; });
stage.addEventListener('dblclick', ()=>{ if(!drawMode) setZoom(zoom===1?2:1); });
function showPhoto(blob, kind){
  currentBlob=blob; currentKind=kind;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl=URL.createObjectURL(blob);
  document.getElementById('emptyBox').style.display='none';
  document.getElementById('swipeTxt').style.display='block';
  zoom=1; panX=0; panY=0; applyTransform();
  if(kind==='video'){ let v=document.getElementById('editVid'); v.src=currentUrl; v.style.display='block'; v.play(); document.getElementById('editImg').style.display='none'; }
  else { let p=document.getElementById('editImg'); p.src=currentUrl; p.style.display='block'; p.style.filter=currentFilter; document.getElementById('editVid').style.display='none'; }
  setTimeout(resizeCanvas,200);
}
function showEmpty(){ document.getElementById('emptyBox').style.display='block'; document.getElementById('editImg').style.display='none'; document.getElementById('editVid').style.display='none'; document.getElementById('swipeTxt').style.display='none'; }
async function load(){
  try{
    let blob=await getDB('pixoro_create_media');
    let kind=await getDB('pixoro_create_kind') || 'image';
    currentType=await getDB('pixoro_create_type') || 'reels';
    if(!blob){ showEmpty(); return; }
    showPhoto(blob, kind);
    currentFilter=await getDB('pixoro_create_filter') || 'none';
    document.getElementById('editImg').style.filter=currentFilter; document.getElementById('editVid').style.filter=currentFilter;
    currentText=await getDB('pixoro_create_text') || '';
    if(currentText){ let o=document.getElementById('textOver'); o.textContent=currentText; o.style.display='block'; }
    zoom=await getDB('pixoro_create_zoom') || 1; applyTransform();
  }catch(e){ showEmpty(); }
}
load();
function setFilter(f,btn){ currentFilter=f; document.querySelectorAll('#filterRow button').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on'); document.getElementById('editImg').style.filter=f; document.getElementById('editVid').style.filter=f; saveDB('pixoro_create_filter', f); }
function addText(){ if(!currentBlob){ alert('Mudalla Photo Select Pannu da'); document.getElementById('file').click(); return; } let t=prompt('Text ezhuthu da'); if(!t) return; currentText=t; let o=document.getElementById('textOver'); o.textContent=t; o.style.display='block'; saveDB('pixoro_create_text',t); }
function addSticker(){ if(!currentBlob){ alert('Mudalla Photo Select Pannu da'); document.getElementById('file').click(); return; } let s=prompt('Sticker - 😍 🔥 ❤️'); if(!s) return; currentText=currentText+' '+s; let o=document.getElementById('textOver'); o.textContent=currentText; o.style.display='block'; saveDB('pixoro_create_text',currentText); }
async function handleNewFile(f){ if(!f) return; let kind=f.type.includes('video')?'video':'image'; await saveDB('pixoro_create_media', f); await saveDB('pixoro_create_kind', kind); showPhoto(f, kind); }
document.getElementById('file').onchange=(e)=>handleNewFile(e.target.files[0]);
document.getElementById('cameraFile').onchange=(e)=>handleNewFile(e.target.files[0]);
// ✅ NEXT - PHOTO + ZOOM + FILTER + TEXT + DRAWING - ELLAM - BAKE PANNI - SHARE KU POGUM DA
async function bakeCrop(){
  if(currentKind==='video' || !currentBlob) return currentBlob;
  return new Promise((res)=>{
    let url=URL.createObjectURL(currentBlob);
    let img=new Image();
    img.onload=()=>{
      let W=1080, H = currentType==='post' ? 1350 : 1920;
      let c=document.createElement('canvas'); c.width=W; c.height=H;
      let ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
      ctx.filter=currentFilter==='none' ? 'none' : currentFilter;
      let scale=Math.max(W/img.width, H/img.height) * zoom;
      let dw=img.width*scale, dh=img.height*scale;
      let dx=(W-dw)/2 + panX * (W/400);
      let dy=(H-dh)/2 + panY * (H/600);
      ctx.drawImage(img, dx, dy, dw, dh);
      if(currentText){ ctx.filter='none'; ctx.font='900 60px system-ui'; ctx.textAlign='center'; ctx.shadowColor='#000'; ctx.shadowBlur=10; ctx.fillStyle='#fff'; ctx.fillText(currentText, W/2, H*0.35); }
      // ✅ DRAWING AH - MELLA - DRAW PANNU DA - PHOTO MELA - DRAWING - SAVE AAGUM DA
      if(drawCanvas.width>0){ ctx.filter='none'; ctx.drawImage(drawCanvas, 0, 0, W, H); }
      URL.revokeObjectURL(url);
      c.toBlob(b=>res(b||currentBlob), 'image/jpeg', 0.92);
    };
    img.src=url;
  });
}
async function goShare(){
  if(!currentBlob){ alert('Photo Select Pannu da - Gallery ah Thodu da'); document.getElementById('file').click(); return; }
  let btn=document.querySelector('.nextBtn'); btn.innerText='Saving...';
  try{
    let baked=await bakeCrop();
    await saveDB('pixoro_create_media', baked);
    await saveDB('pixoro_create_kind', currentKind);
    await saveDB('pixoro_create_filter', 'none');
    await saveDB('pixoro_create_text', '');
    await saveDB('pixoro_create_zoom', zoom);
    location.href='./create-share.html?v=1051';
  }catch(e){ alert('Save Fail da: '+e.message); btn.innerText='Next →'; }
}
</script>
</body>
</html>
