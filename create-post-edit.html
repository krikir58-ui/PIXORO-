<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Post - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:20px}
.top span{cursor:pointer}
.wrap{height:60vh;background:#000;position:relative;overflow:hidden;display:grid;place-items:center}
.wrap img{width:100%;height:100%;object-fit:contain;background:transparent}
.wrap .empty{font-size:50px;text-align:center;opacity:.6}
.wrap .empty small{display:block;font-size:13px;color:#888;margin-top:8px}
.tabs{display:flex;gap:10px;padding:12px;justify-content:center;overflow-x:auto}
.tabs b{padding:8px 16px;background:#222;border-radius:20px;white-space:nowrap;cursor:pointer}
.tabs b.on{background:#fff;color:#000}
.filters{display:flex;gap:10px;overflow-x:auto;padding:12px}
.filters div{text-align:center;flex-shrink:0;cursor:pointer}
.filters img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid transparent;background:#111}
.filters div.on img{border-color:#fff}
.filters small{font-size:11px}
.bottom{display:flex;justify-content:space-between;padding:14px}
.bottom button{border:0;padding:14px 22px;border-radius:30px;font-weight:800;cursor:pointer}
.next{background:#4d7cff;color:#fff}
.bgRow{display:flex;gap:10px;padding:0 12px 12px;overflow-x:auto}
.bgRow button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;white-space:nowrap}
.bgRow button.on{background:#fff;color:#000}
</style>
</head>
<body>
<div class="top"><span onclick="history.back()">←</span><b>Edit</b><span onclick="goNext()" style="color:#4d7cff">Next</span></div>

<div class="wrap" id="wrapBox">
  <img id="img" src="" style="display:none">
  <div class="empty" id="emptyBox">📷<small>Photo Illa da<br>Back Poyi Select Pannu da</small></div>
  <div id="textOver" style="position:absolute;top:35%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none;z-index:5"></div>
</div>

<!-- ✅ BACKGROUND REMOVE - ITHU THAAN DA GIRI - BACKGROUND MAATHU DA -->
<div class="bgRow">
  <button class="on" onclick="setBg('black',this)">⬛ Black BG</button>
  <button onclick="setBg('white',this)">⬜ White BG</button>
  <button onclick="setBg('transparent',this)">🔲 No BG</button>
  <button onclick="setBg('blur',this)">🌀 Blur BG</button>
</div>

<div class="tabs"><b class="on" onclick="showTab('filter',this)">Filter</b><b onclick="showTab('edit',this)">Edit</b><b onclick="addText()">Aa Text</b><b onclick="addSticker()">😊 Sticker</b></div>

<!-- ✅ PICSUM DELETE DA - UN PHOTO THAAN - FILTER PREVIEW LA VARUM DA -->
<div class="filters" id="filterRow">
  <div class="on" onclick="setF('none',this)"><img id="f0" src=""><br><small>Original</small></div>
  <div onclick="setF('grayscale(1)',this)"><img id="f1" src="" style="filter:grayscale(1)"><br><small>B&W</small></div>
  <div onclick="setF('sepia(.8)',this)"><img id="f2" src="" style="filter:sepia(.8)"><br><small>Sepia</small></div>
  <div onclick="setF('contrast(1.4) saturate(1.6)',this)"><img id="f3" src="" style="filter:contrast(1.4) saturate(1.6)"><br><small>Vivid</small></div>
  <div onclick="setF('brightness(1.2)',this)"><img id="f4" src="" style="filter:brightness(1.2)"><br><small>Fade</small></div>
  <div onclick="setF('contrast(1.2) brightness(1.1) saturate(1.3)',this)"><img id="f5" src="" style="filter:contrast(1.2) brightness(1.1) saturate(1.3)"><br><small>Mass</small></div>
</div>

<div class="filters" id="editRow" style="display:none">
  <button onclick="adjust('brightness')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Brightness</button>
  <button onclick="adjust('contrast')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Contrast</button>
  <button onclick="adjust('saturate')" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:20px">Saturation</button>
  <button onclick="removeBg()" style="background:#ff2d55;color:#fff;border:0;padding:10px 16px;border-radius:20px">✨ BG Remove</button>
</div>

<div class="bottom"><button onclick="history.back()" style="background:#222;color:#fff">Edit photo</button><button class="next" onclick="goNext()">Next →</button></div>

<script>
// ✅ PICSUM ILLA DA - UN PHOTO MATTUM DA - LOCALSTORAGE LA IRUNDHU DA
let url = localStorage.getItem('pixoro_post_media') || '';
let imgEl = document.getElementById('img');
if(!url || url.startsWith('blob:') || url.includes('picsum')){
  alert('Photo Load Aagala da - Thirumba Select Pannu da');
  location.href = './create-post.html';
} else {
  imgEl.src = url;
  imgEl.style.display = 'block';
  document.getElementById('emptyBox').style.display = 'none';
  // ✅ Filter Preview la - Un Photo Thaan Varum da - Vera Photo Varaathu da
  ['f0','f1','f2','f3','f4','f5'].forEach(id => { document.getElementById(id).src = url; });
}

function setF(f, el){
  imgEl.style.filter = f;
  localStorage.setItem('pixoro_post_filter', f);
  document.querySelectorAll('#filterRow div').forEach(d => d.classList.remove('on'));
  el.classList.add('on');
}

function showTab(t, el){
  document.querySelectorAll('.tabs b').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('filterRow').style.display = t === 'filter' ? 'flex' : 'none';
  document.getElementById('editRow').style.display = t === 'edit' ? 'flex' : 'none';
}

function adjust(type){
  let v = prompt(type + ' - 0.5 to 2 - Value Podu da:', '1.2');
  if(v){ imgEl.style.filter = type + '(' + v + ')'; localStorage.setItem('pixoro_post_filter', type + '(' + v + ')'); }
}

function addText(){
  let t = prompt('Text ezhuthu da:');
  if(t){ let o = document.getElementById('textOver'); o.innerText = t; o.style.display = 'block'; localStorage.setItem('pixoro_post_text', t); }
}

function addSticker(){
  let s = prompt('Sticker - 😍 🔥 ❤️');
  if(s){ let o = document.getElementById('textOver'); o.innerText += ' ' + s; o.style.display = 'block'; }
}

// ✅ BACKGROUND REMOVE - SIMPLE FIX DA - PHOTO AH - CLEAN AH KAAMIKKUM DA
function setBg(mode, btn){
  document.querySelectorAll('.bgRow button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  let wrap = document.getElementById('wrapBox');
  if(mode === 'black'){ wrap.style.background = '#000'; imgEl.style.background = '#000'; }
  if(mode === 'white'){ wrap.style.background = '#fff'; imgEl.style.background = '#fff'; }
  if(mode === 'transparent'){ wrap.style.background = 'repeating-conic-gradient(#222 0% 25%, #000 0% 50%) 50% / 20px 20px'; imgEl.style.background = 'transparent'; }
  if(mode === 'blur'){ wrap.style.background = '#000'; imgEl.style.filter = 'blur(0px)'; }
  localStorage.setItem('pixoro_post_bg', mode);
}

function removeBg(){
  alert('BG Remove - On Panniten da ✨\nPhoto va - Black Background la - Clean ah Kaamikkum da\nFull Auto BG Remove ku - remove.bg Website la - Photo ah - Remove Pannitu - Upload Pannu da');
  setBg('transparent', document.querySelectorAll('.bgRow button')[2]);
}

function goNext(){
  if(!localStorage.getItem('pixoro_post_media')){ alert('Photo Illa da'); location.href='./create-post.html'; return; }
  location.href = './create-post-upload.html';
}
</script>
</body>
</html>
