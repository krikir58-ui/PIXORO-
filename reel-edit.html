<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto;min-height:100vh;padding-bottom:10px}
.top{display:flex;align-items:center;gap:10px;padding:12px}.top b{font-size:17px}.top b span{color:#FF2DCC}.top .try{background:#1a1a1a;border:1px solid #222;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}
.prev{margin:0 12px;height:360px;background:#111;border-radius:16px;overflow:hidden;position:relative}.prev video{width:100%;height:100%;object-fit:contain;background:#000}
#txtOverlay{position:absolute;top:18%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.8);pointer-events:none;z-index:5;color:#fff}
#stickerOverlay{position:absolute;bottom:20%;left:0;right:0;text-align:center;font-size:36px;pointer-events:none;z-index:5}
.timeline{margin:12px;padding:12px;background:#0a0a0a;border-radius:14px}.tinfo{display:flex;justify-content:space-between;font-size:12px;color:#aaa}.track{display:flex;gap:2px;overflow-x:auto;height:48px;margin-top:8px}.frame{flex:0 0 42px;height:48px;background:#222;border-radius:6px;overflow:hidden}.frame video{width:100%;height:100%;object-fit:cover}
.trim{margin:0 12px 12px;padding:14px;border-radius:14px;background:#111}input[type=range]{width:100%;accent-color:#FF2DCC;margin:8px 0}
.tools{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}.tool{flex:0 0 auto;background:#1a1a1a;border:1px solid #222;padding:10px 12px;border-radius:12px;text-align:center;font-size:11px;min-width:62px;cursor:pointer;color:#fff}.tool span{font-size:18px;display:block}.tool.active{background:linear-gradient(90deg,#7B2FFF,#FF2DCC);border:0}
.panel{margin:0 12px 12px;padding:14px;border-radius:14px;background:#111;display:none}
.btn{margin:12px;background:linear-gradient(90deg,#7B2FFF,#FF2DCC);border:0;width:calc(100% - 24px);padding:15px;border-radius:16px;font-weight:900;color:#fff;font-size:16px;cursor:pointer}
.btn2{margin:0 12px 12px;background:#1a1a1a;border:1px solid #222;color:#fff;width:calc(100% - 24px);padding:14px;border-radius:16px;font-weight:900;cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:800;display:none;z-index:999;white-space:nowrap}
#bgBar{position:fixed;top:0;left:0;right:0;max-width:450px;margin:auto;background:#111;padding:12px;display:none;z-index:1000;color:#fff}#bgBar .bar{height:5px;background:#222;border-radius:20px;overflow:hidden;margin-top:6px}#bgBar .bar div{height:100%;width:0%;background:linear-gradient(90deg,#7B2FFF,#FF2DCC);transition:.3s}
</style></head><body>
<div class="top"><span onclick="location.href='reel-create.html'" style="font-size:26px;cursor:pointer">✕</span><b>PIX<span>O</span>RO Edit</b><span class="try">✨ Try Edits</span><span onclick="goNext()" style="margin-left:auto;font-size:22px;cursor:pointer">→</span></div>
<div class="prev"><video id="v" controls playsinline></video><div id="txtOverlay"></div><div id="stickerOverlay"></div></div>

<div class="timeline">
<div class="tinfo"><span>⏸ <span id="tInfo">0.0s - 30.0s</span></span><span>↩ ↪</span></div>
<div class="track" id="track"></div>
<div style="padding:10px 0 2px;font-size:13px;color:#aaa;line-height:1.9">+ Add audio<br>+ Add text</div>
</div>

<div class="trim">
<div style="display:flex;justify-content:space-between;font-weight:800"><span>TRIM</span><span style="color:#FF2DCC;font-size:12px">PIXORO TRIM</span></div>
<label style="font-size:12px;color:#888">START</label><input type="range" id="sR" min="0" max="60" step="0.1" value="0">
<label style="font-size:12px;color:#888">END</label><input type="range" id="eR" min="0" max="60" step="0.1" value="30">
<div style="display:flex;gap:8px;margin-top:10px"><button onclick="previewTrim()" style="flex:1;background:#fff;border:0;padding:11px;border-radius:12px;font-weight:800;cursor:pointer">Preview Trim</button><button onclick="resetTrim()" style="flex:1;background:#1a1a1a;border:1px solid #222;color:#fff;padding:11px;border-radius:12px;cursor:pointer">Reset</button></div>
</div>

<div class="tools">
<button class="tool active" onclick="setTool(this,'trim')"><span>✂️</span>Trim</button>
<button class="tool" onclick="setTool(this,'text')"><span>Aa</span>Text</button>
<button class="tool" onclick="setTool(this,'audio')"><span>🎵</span>Audio</button>
<button class="tool" onclick="setTool(this,'speed')"><span>⏱️</span>Speed</button>
<button class="tool" onclick="setTool(this,'filter')"><span>✨</span>Filter</button>
<button class="tool" onclick="setTool(this,'sticker')"><span>😍</span>Sticker</button>
<button class="tool" onclick="splitVideo()"><span>✂️</span>Split</button>
<button class="tool" onclick="setTool(this,'text')"><span>CC</span>Captions</button>
<button class="tool" onclick="setTool(this,'filter')"><span>🌟</span>Effects</button>
<button class="tool" onclick="uploadTrim()"><span>⬇️</span>Save</button>
</div>

<div class="panel" id="panelText"><input id="txtInput" placeholder="Type text..." style="width:100%;background:#000;border:1px solid #222;padding:12px;border-radius:10px;color:#fff;outline:none" oninput="edit.text=this.value;document.getElementById('txtOverlay').innerText=this.value"></div>
<div class="panel" id="panelAudio"><input type="file" id="aud" accept="audio/*" onchange="setAudio(this)"><div style="font-size:12px;color:#888;margin-top:6px">Add music - Video kooda play aagum</div><audio id="audPlay" loop></audio></div>
<div class="panel" id="panelSpeed"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tool" onclick="setSpeed(0.5,this)">0.5x</button><button class="tool active" onclick="setSpeed(1,this)">1x</button><button class="tool" onclick="setSpeed(1.5,this)">1.5x</button><button class="tool" onclick="setSpeed(2,this)">2x</button></div></div>
<div class="panel" id="panelFilter"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tool" onclick="setFilter('none',this)">Normal</button><button class="tool" onclick="setFilter('grayscale(1)',this)">B&W</button><button class="tool" onclick="setFilter('contrast(1.3) saturate(1.5)',this)">Pixoro 💜</button><button class="tool" onclick="setFilter('sepia(0.6)',this)">Warm</button><button class="tool" onclick="setFilter('hue-rotate(280deg) saturate(2)',this)">Neon</button></div></div>
<div class="panel" id="panelSticker"><div style="font-size:28px;display:flex;gap:14px"><span onclick="addSticker('🔥')">🔥</span><span onclick="addSticker('❤️')">❤️</span><span onclick="addSticker('⭐')">⭐</span><span onclick="addSticker('😎')">😎</span><span onclick="addSticker('👑')">👑</span><span onclick="addSticker('💜')">💜</span></div></div>

<button class="btn" onclick="goNext()">Next → Upload Page</button>
<button class="btn btn2" onclick="uploadTrim()">Share Reel - Direct Save</button>
<div id="bgBar"><div style="font-weight:700">Uploading... <span id="bgPct">0%</span></div><div class="bar"><div id="bgFill"></div></div></div>
<div id="toast" class="toast"></div>
<script>
let supa=window.supa, ME_RAW='', ME_ID='', start=0, end=30, dur=0, vidUrl='';
let v=document.getElementById('v');
let edit={text:'',speed:1,filter:'none',stickers:'',audio:'',splitAt:0};
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
async function init(){
 let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
 ME_ID=session.user.id; let {data:p}=await supa.from('profiles').select('*').eq('id',ME_ID).single(); ME_RAW=(p?.username||session.user.email.split('@')[0]).toLowerCase();
 let pr=new URLSearchParams(location.search); vidUrl=pr.get('media')||'';
 if(!vidUrl){showToast('No video - Choose again');return}
 // REAL GALLERY DA - blob: URL um REAL VIDEO THAAN DA - BLOCK PANNA KUDATHU DA
 v.src=vidUrl; v.onloadedmetadata=()=>{dur=v.duration;document.getElementById('sR').max=dur;document.getElementById('eR').max=dur;end=Math.min(30,dur);document.getElementById('eR').value=end;update();makeTrack();};
 let oldText=pr.get('text'); if(oldText){edit.text=oldText;document.getElementById('txtOverlay').innerText=oldText;document.getElementById('txtInput').value=oldText;}
 let oldStk=pr.get('stickers'); if(oldStk){edit.stickers=oldStk;document.getElementById('stickerOverlay').innerText=oldStk;}
}
init();
function makeTrack(){let t=document.getElementById('track');t.innerHTML='';for(let i=0;i<12;i++)t.innerHTML+=`<div class="frame"><video src="${vidUrl}#t=${i}" muted preload="metadata"></video></div>`}
function setTool(el,n){
 document.querySelectorAll('.tools .tool').forEach(b=>b.classList.remove('active'));el.classList.add('active');
 ['Text','Audio','Speed','Filter','Sticker'].forEach(x=>document.getElementById('panel'+x).style.display='none');
 if(n!='trim')document.getElementById('panel'+n.charAt(0).toUpperCase()+n.slice(1)).style.display='block';
}
function setSpeed(s,el){edit.speed=s;v.playbackRate=s;document.getElementById('audPlay').playbackRate=s;document.querySelectorAll('#panelSpeed .tool').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');showToast('Speed: '+s+'x');}
function setFilter(f,el){edit.filter=f;v.style.filter=f;document.querySelectorAll('#panelFilter .tool').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');showToast('Filter Applied');}
function addSticker(em){edit.stickers+=em+' ';document.getElementById('stickerOverlay').innerText=edit.stickers;showToast('Sticker Added '+em);}
function setAudio(inp){let f=inp.files[0];if(!f)return;edit.audio=f.name;let a=document.getElementById('audPlay');a.src=URL.createObjectURL(f);a.play();v.muted=true;showToast('Audio Added - '+f.name);}
function splitVideo(){let mid=(start+end)/2;edit.splitAt=mid;document.getElementById('sR').value=mid;update();showToast('Split done - '+mid.toFixed(1)+'s');}
function update(){start=parseFloat(document.getElementById('sR').value);end=parseFloat(document.getElementById('eR').value);if(end<=start)end=start+1;if(end-start>30)end=start+30;document.getElementById('eR').value=end;document.getElementById('tInfo').innerText=start.toFixed(1)+'s - '+end.toFixed(1)+'s';v.currentTime=start;}
document.getElementById('sR').oninput=update;document.getElementById('eR').oninput=update;
function previewTrim(){v.currentTime=start;v.play();setTimeout(()=>v.pause(),(end-start)*1000);}
function resetTrim(){document.getElementById('sR').value=0;document.getElementById('eR').value=Math.min(30,dur);edit={text:'',speed:1,filter:'none',stickers:'',audio:'',splitAt:0};v.style.filter='none';v.playbackRate=1;document.getElementById('txtOverlay').innerText='';document.getElementById('stickerOverlay').innerText='';update();}
function goNext(){
 let q=new URLSearchParams({media:vidUrl,type:'video',trim_start:String(start),trim_end:String(end),filter:edit.filter,speed:String(edit.speed),text:edit.text,stickers:edit.stickers,audio:edit.audio,split_at:String(edit.splitAt)});
 location.href='reels-upload.html?'+q.toString();
}
async function uploadTrim(){
 if(!vidUrl){showToast('No media - Upload again');return}
 document.getElementById('bgBar').style.display='block';document.getElementById('bgFill').style.width='70%';document.getElementById('bgPct').innerText='70%';
 try{
  // BLOB NA - DIRECT SAVE Panna Mudiyadhu da - Upload Page ku Poo da - Athula Supabase Upload Aagum da
  if(vidUrl.startsWith('blob:')){showToast('Next ku poo da - Upload anga aagum');setTimeout(()=>goNext(),800);return;}
  let {error}=await supa.from('posts').insert({user_id:ME_ID,username:ME_RAW,media_url:vidUrl,media_type:'reel',caption:edit.text||'Pixoro Reel',video_url:vidUrl,trim_start:start,trim_end:end,filter_name:edit.filter,speed:edit.speed,stickers:edit.stickers,audio_name:edit.audio,split_at:edit.splitAt});
  if(error){ let {error:e2}=await supa.from('posts').insert({user_id:ME_ID,username:ME_RAW,media_url:vidUrl,media_type:'reel',caption:edit.text||'Pixoro Reel',video_url:vidUrl}); if(e2) throw e2; }
  document.getElementById('bgFill').style.width='100%';document.getElementById('bgPct').innerText='100%';showToast('Saved');setTimeout(()=>location.href='reels.html',800);
 }catch(e){showToast('Try again');}
}
</script></body></html>
