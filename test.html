<body style="background:#000;color:#fff">
<div id="emergency" style="text-align:center;padding:40px">
  <h1 style="font-size:26px">Pixoro 🔥</h1>
  <p id="status" style="color:#888">Loading da...</p>
  <button onclick="location.reload()" style="background:#FFD700;color:#000;border:0;padding:12px 24px;border-radius:12px;font-weight:900">Refresh</button>
</div>
<div id="feed"></div>
<script>
window.onerror = function(m){
  document.getElementById('status').innerText = 'Error: ' + m + ' - Screenshot eduthu enaku anuppu da';
  document.getElementById('status').style.color = 'red';
}
setTimeout(()=>{
  let f = document.getElementById('feed');
  if(f && !f.innerHTML) document.getElementById('status').innerText = 'JS load aagala da - pixoro-core.js check pannu da';
}, 5000);
</script>
