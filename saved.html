<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saved - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:8px}.grid img,.grid video{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;height:60px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#ff5ea8}.bottom-nav a.active svg{stroke:#ff5ea8}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#ff5ea8;font-weight:700}.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #ff5ea8}
</style></head><body>
<div class="top"><span onclick="location.href='profile.html'" style="font-size:22px;cursor:pointer">←</span><b style="font-size:18px">🔖 Saved</b></div>
<div id="grid" class="grid"></div>
<div id="empty" style="text-align:center;padding:60px;color:#666;display:none"><div style="font-size:50px">🔖</div><p style="margin-top:10px">No saved posts da<br><span style="font-size:12px">Post la Save Button Click Panna Inga Varum da</span></p><button onclick="location.href='index.html'" style="margin-top:14px;background:#fff;color:#000;border:0;padding:10px 20px;border-radius:20px;font-weight:900">Explore Posts</button></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html" class="active"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa;
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
let ME_RAW='', ME_ID='';
async function init(){
  if(!window.supa){ setTimeout(init,300); return }
  supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){ location.href='login.html'; return }
  ME_ID=session.user.id;
  let {data:myProf}=await supa.from('profiles').select('*').eq('id',ME_ID).single();
  ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);
  if(myProf?.avatar_url) document.getElementById('navPfp').src=myProf.avatar_url;
  let {data:saves1}=await supa.from('saves').select('*').eq('user_id',ME_ID).order('created_at',{ascending:false});
  let {data:saves2}=await supa.from('saves').select('*').eq('username',ME_RAW).order('created_at',{ascending:false});
  let saves=[...(saves1||[]),...(saves2||[])];
  let seen=new Set(), uniq=[]; saves.forEach(s=>{ if(!seen.has(s.post_id)){ seen.add(s.post_id); uniq.push(s); } }); saves=uniq;
  if(!saves.length){ document.getElementById('empty').style.display='block'; return }
  let ids=saves.map(s=>s.post_id);
  let {data:posts}=await supa.from('posts').select('*').in('id',ids);
  let postMap={}; (posts||[]).forEach(p=>postMap[p.id]=p);
  let ordered=ids.map(id=>postMap[id]).filter(Boolean);
  if(!ordered.length){ document.getElementById('empty').style.display='block'; return }
  document.getElementById('grid').innerHTML=ordered.map(p=>{
    let mUrl=p.media_url||p.image_url||p.video_url||'';
    let isVid=p.media_type=='reel'||mUrl.includes('.mp4');
    if(isVid) return `<div style="position:relative" onclick="location.href='reels.html?id=${p.id}'"><video src="${mUrl}" muted playsinline style="width:100%;aspect-ratio:1/1;object-fit:cover"></video><span style="position:absolute;top:6px;right:6px">🎬</span></div>`;
    return `<img src="${mUrl}" onclick="location.href='index.html?id=${p.id}'">`;
  }).join('');
}
init();
</script></body></html>
