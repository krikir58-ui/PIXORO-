<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #FFD700}.top b{color:#FFD700}
.prev{margin:12px;height:400px;background:#111;border:2px dashed #FFD700;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev img,.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}.cell{aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer}
.btn{margin:12px;background:#FFD700;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900;color:#000}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.progress{margin:0 12px;background:#111;border:1px solid #222;border-radius:12px;padding:10px;display:none}
.bar{height:6px;background:#333;border-radius:10px;overflow:hidden;margin-top:6px}
.barFill{height:100%;background:#FFD700;width:0%}
</style></head><body>
<div class="top"><b>New Story ⭐</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">⭐ Photo / Video Select Pannu</div>
<div class="grid"><div class="cell" onclick="location.href='camera.html?type=story'">📷 Camera</div><div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div><div class="cell" onclick="document.getElementById('f').click()">➕ Add</div></div>
<div class="progress" id="prog"><div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa"><span id="progText">Compressing... 💾</span><span id="progSize"></span></div><div class="bar"><div class="barFill" id="progFill"></div></div></div>
<button class="btn" onclick="go()">Next →</button>
<div id="toast" class="toast"></div>
<input type="file" id="f" hidden accept="image/*,video/*" onchange="h(event)">
<script>
// === PIXORO NO FULL ALERT LOCK ===
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
window.onerror = function(){ showToast('Adutha side la problem da - Try again'); return true; };
function formatSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
let m='';
function h(e){
let f=e.target.files[0];if(!f)return;
document.getElementById('prog').style.display='block';
document.getElementById('progText').innerText='Compressing... 💾';
document.getElementById('progSize').innerText='Original: '+formatSize(f.size);
document.getElementById('progFill').style.width='30%';
if(f.type.startsWith('video/')){
  if(f.size > 10*1024*1024){ showToast('Story Video perusu da! 10MB kulla eduthuko'); document.getElementById('prog').style.display='none'; e.target.value=''; return; }
  let u=URL.createObjectURL(f);
  let vid=document.createElement('video'); vid.preload='metadata'; vid.onloadedmetadata=()=>{
    if(vid.duration>20){ showToast('Story 15 sec kulla irukanum da!'); e.target.value=''; return; }
    m=u; document.getElementById('prev').innerHTML=`<video src="${u}" autoplay loop controls></video>`;
    document.getElementById('progFill').style.width='100%'; document.getElementById('progText').innerText='Story Ready ✅ - 24h la Delete aagidum';
    localStorage.setItem('pix_media',u); sessionStorage.setItem('pixoro_pending_media',u); sessionStorage.setItem('pixoro_pending_type','video');
    sessionStorage.setItem('pixoro_story_expires', Date.now()+24*60*60*1000);
    showToast('Story Ready da! ⭐ Next ku po');
  }; vid.src=u;
}else{
let img=new Image();img.onload=()=>{
let MAX=720,w=img.width,h=img.height;if(w>MAX){h=h*MAX/w;w=MAX}
let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
let url=cv.toDataURL('image/jpeg',0.72);m=url;document.getElementById('prev').innerHTML=`<img src="${url}">`;
document.getElementById('progFill').style.width='100%'; document.getElementById('progText').innerText='Compressed ✅ '+formatSize(f.size)+' → ~'+formatSize(url.length*0.75);
localStorage.setItem('pix_media',url);sessionStorage.setItem('pixoro_pending_media',url);sessionStorage.setItem('pixoro_pending_type','image');
sessionStorage.setItem('pixoro_story_expires', Date.now()+24*60*60*1000);
showToast('Story Compressed da! ⭐');
};img.src=URL.createObjectURL(f);
}
}
function go(){if(!m){showToast('Story select pannu da Giri!');return}location.href='story-add.html'}
</script></body></html>
