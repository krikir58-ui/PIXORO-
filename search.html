<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Search - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:8px 12px;display:flex;gap:8px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#000;z-index:10;height:56px;align-items:center}
input{flex:1;background:#181818;border:1px solid #fff;padding:10px 12px;border-radius:10px;color:#fff;outline:none;font-size:14px}
.userRow{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-bottom:1px solid #151515}
.msgBtn{background:transparent!important;color:#fff!important;border:1.2px solid #fff!important;padding:6px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.viewBtn{background:transparent!important;color:#fff!important;border:1.2px solid #fff!important;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;margin-right:6px}
.followBtnSearch{background:#fff!important;color:#000!important;border:0!important;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.followBtnSearch.following{background:#333!important;color:#fff!important;border:1px solid #444!important}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:8px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;background:#111}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#fff}.bottom-nav a.active svg{stroke:#fff}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#fff;font-weight:700}.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}.viewer img{max-width:100%;max-height:68vh;border-radius:12px;object-fit:contain}
</style></head><body>
<div class="top"><input id="searchInput" placeholder="Search name or ID... @name" oninput="doSearch()" autofocus><span onclick="location.href='index.html'" style="cursor:pointer;font-size:18px">✕</span></div>
<div id="results"></div>
<div id="hint" style="text-align:center;padding:30px 20px;color:#555"><div style="font-size:36px">🔒</div><b style="color:#fff">Private Search</b><p style="font-size:11px;margin-top:8px">Name / ID type pannu da - Appo mattum Kaamikkum<br>Open panna yaaroda ID um varaathu da - 100% private</p></div>
<div id="explore" style="margin-top:10px"><div style="padding:8px 12px;font-size:11px;color:#888;font-weight:700">EXPLORE • TRENDING PHOTOS - ID Illa da</div><div class="grid" id="grid"></div></div>
<div id="toast" class="toast"></div>
<div id="viewer" class="viewer" onclick="if(event.target.id=='viewer')this.style.display='none'"><img id="viewerImg" src=""><div id="viewerCredit" style="margin-top:12px;font-size:12px;color:#aaa"></div><div style="display:flex;margin-top:18px;background:#fff;border-radius:18px;overflow:hidden;width:92%;max-width:380px"><div id="likeBtn" onclick="likePhoto()" style="flex:1;text-align:center;padding:14px 0;cursor:pointer;border-right:1px solid #eee"><div style="font-size:24px">🤍</div><div style="font-size:11px;font-weight:900;color:#000">LIKE</div></div><div onclick="commentPhoto()" style="flex:1;text-align:center;padding:14px 0;cursor:pointer;border-right:1px solid #eee"><div style="font-size:24px">💬</div><div style="font-size:11px;font-weight:900;color:#000">COMMENT</div></div><div onclick="sharePhoto()" style="flex:1;text-align:center;padding:14px 0;cursor:pointer;border-right:1px solid #eee"><div style="font-size:24px">↗️</div><div style="font-size:11px;font-weight:900;color:#000">SHARE</div></div><div id="saveBtn" onclick="savePhoto()" style="flex:1;text-align:center;padding:14px 0;cursor:pointer"><div style="font-size:24px">🔖</div><div style="font-size:11px;font-weight:900;color:#000">SAVE</div></div></div><div style="margin-top:10px;font-size:12px;color:#777">Tap outside to close • Pixoro</div></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html" class="active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
function showToast(m){let t=document.getElementById('toast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
let supa=window.supa; window.getTick=()=>'';
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME_ID='',profileMap={},profileByIdMap={},currentPhotoUrl='',currentPhotoId='',isLiked=false,isSaved=false,allViews=[],allPosts=[],allFollows=[],allProfilesCache=[]
function getPfp(u){let p=profileMap[cleanUser(u)];if(p?.avatar_url)return p.avatar_url;let c=cleanUser(u)||'P';return 'https://ui-avatars.com/api/?name='+c.charAt(0).toUpperCase()+'&background=fff&color=000&size=200&bold=true'}
function fmtViews(n){return n>=1000?(n/1000).toFixed(1)+'K':n}
function getBestMedia(p){ if(p._from==='reels') return {url:p.video_url||p.media_url||'',isVid:true}; let m=(p.media_url||p.video_url||'').toLowerCase().split('?')[0]; if(m.endsWith('.mp4')||m.endsWith('.mov')||m.endsWith('.webm')||m.endsWith('.m4v')) return {url:p.media_url||p.video_url,isVid:true}; return {url:p.media_url||p.video_url||p.image_url||'',isVid:false}; }
function openPhoto(url,credit,postId){currentPhotoUrl=url;currentPhotoId=postId||'';isLiked=false;isSaved=false;document.getElementById('viewerImg').src=url;document.getElementById('viewerCredit').innerText='Pixoro • '+credit;document.getElementById('viewer').style.display='flex'}
async function likePhoto(){ if(!currentPhotoId) return; isLiked=!isLiked; document.getElementById('likeBtn').innerHTML=isLiked?'<div style="font-size:24px">❤️</div><div style="font-size:11px;font-weight:900;color:#ff0044">LIKED</div>':'<div style="font-size:24px">🤍</div><div style="font-size:11px;font-weight:900;color:#000">LIKE</div>'; if(isLiked){ try{ await supa.from('likes').insert({post_id:currentPhotoId,user_id:ME_ID,username:ME_RAW}); }catch(e){} showToast('Liked ❤️'); } }
function commentPhoto(){ if(!currentPhotoId) return; location.href='index.html?id='+currentPhotoId; }
function sharePhoto(){ navigator.clipboard.writeText(currentPhotoUrl); showToast('Link copied!'); }
async function savePhoto(){ if(!currentPhotoId) return; isSaved=!isSaved; if(isSaved){ try{ await supa.from('saves').insert({post_id:currentPhotoId,user_id:ME_ID,username:ME_RAW}); }catch(e){} } else { try{ await supa.from('saves').delete().eq('post_id',currentPhotoId).eq('user_id',ME_ID); }catch(e){} } showToast(isSaved?'Saved! ✅':'Unsaved'); }
async function toggleFollow(otherId, btn){
  if(!otherId || String(otherId)===String(ME_ID)) return;
  if(btn) btn.disabled = true;
  let already = allFollows.some(f=>String(f.follower_id)===String(ME_ID) && String(f.following_id)===String(otherId));
  if(already){
    let {error} = await supa.from('follows').delete().eq('follower_id', ME_ID).eq('following_id', otherId);
    if(!error){ allFollows = allFollows.filter(f=>!(String(f.follower_id)===String(ME_ID) && String(f.following_id)===String(otherId))); if(btn){ btn.innerText="Follow"; btn.classList.remove('following'); } showToast('Unfollowed da 😴'); }
  } else {
    let {error} = await supa.from('follows').insert({follower_id: ME_ID, following_id: otherId});
    if(!error){ allFollows.push({follower_id: ME_ID, following_id: otherId}); if(btn){ btn.innerText="Following ✓"; btn.classList.add('following'); } showToast('Followed da 🔥'); }
    else { showToast('Follow Mudiyala da - Table Paaru da'); console.log(error); }
  }
  if(btn) btn.disabled = false;
}
window.toggleFollow = toggleFollow;
async function init(){if(!window.supa){setTimeout(init,300);return}supa=window.supa;let {data:{session}}=await supa.auth.getSession();if(!session){location.href='login.html';return}ME_ID=session.user.id;let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).single();ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);let {data:profs}=await supa.from('profiles').select('*');allProfilesCache=profs||[];(profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileByIdMap[p.id]=p});let el=document.getElementById('navPfp');if(el)el.src=getPfp(ME_RAW);let {data:views}=await supa.from('views').select('*');allViews=views||[];let {data:follows}=await supa.from('follows').select('*');allFollows=follows||[];loadExplore()}
async function doSearch(){
  let qRaw=document.getElementById('searchInput').value.trim();
  let q=qRaw;
  let hint=document.getElementById('hint'),exp=document.getElementById('explore');
  if(!q || q.length<2){ document.getElementById('results').innerHTML=''; hint.style.display='block'; exp.style.display='block'; return; }
  hint.style.display='none'; exp.style.display='none';
  let cleanQ=cleanUser(q);
  let lowerQ=q.toLowerCase();
  // ID + Username - Local Cache la irundhu Thedu da - Supabase Query Fail Aagathu da - 100% Varum da
  let list = allProfilesCache.filter(p=>{
    if(String(p.id)===String(ME_ID)) return false;
    let uname = cleanUser(p.username||'');
    let idLower = String(p.id||'').toLowerCase();
    // Username match OR Full ID match OR Half ID match da
    return uname.includes(cleanQ) || idLower.includes(lowerQ) || idLower.replace(/-/g,'').includes(lowerQ.replace(/-/g,''));
  });
  // Cache la Illana - Supabase la yum Thedu da
  if(list.length===0){
    let {data:profs}=await supa.from('profiles').select('*').ilike('username','%'+cleanQ+'%');
    if(profs) list = profs.filter(p=>String(p.id)!==String(ME_ID));
  }
  let html='';
  if(list.length){
    html+=`<div style="padding:12px;font-size:11px;color:#888;font-weight:700">PEOPLE • ${list.length} FOUND</div>`;
    html+=list.slice(0,20).map(p=>{let u=cleanUser(p.username);let isFollowing=allFollows.some(f=>String(f.follower_id)===String(ME_ID)&&String(f.following_id)===String(p.id));let followHtml=isFollowing?`<button class="followBtnSearch following" onclick="toggleFollow('${p.id}',this)">Following ✓</button>`:`<button class="followBtnSearch" onclick="toggleFollow('${p.id}',this)">Follow</button>`;return `<div class="userRow"><div style="display:flex;align-items:center;gap:10px" onclick="location.href='profile.html?u=${p.id}'"><img src="${getPfp(u)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover"><div><b>@${u}</b><div style="font-size:10px;color:#888">ID: ${String(p.id).slice(0,8)}... • Tap to View</div><div style="font-size:10px;color:#00ff66">🔒 Real private</div></div></div><div style="display:flex;gap:6px;align-items:center">${followHtml}<button class="viewBtn" onclick="location.href='profile.html?u=${p.id}'">View</button><button class="msgBtn" onclick="goMsg('${u}')">Message</button></div></div>`}).join('');
  }
  let matched=allPosts.filter(p=> cleanUser(p.username).includes(cleanQ) || (p.caption||'').toLowerCase().includes(lowerQ));
  if(matched.length){
    html+=`<div style="padding:12px;font-size:11px;color:#888;font-weight:700">PHOTOS • PIXORO</div><div class="grid">${matched.slice(0,30).map(p=>{let best=getBestMedia(p);let link=best.isVid?`reels.html?id=${p.id}`:`index.html?id=${p.id}`;return best.isVid?`<video src="${best.url}" muted playsinline preload="metadata" style="width:100%;aspect-ratio:1;object-fit:cover" onclick="location.href='${link}'"></video>`:`<img src="${best.url}" onerror="this.style.display='none'" onclick="openPhoto('${best.url}','${cleanUser(p.username)}','${p.id}')" loading="lazy">`}).join('')}</div>`;
  }
  document.getElementById('results').innerHTML=html||`<p style="padding:20px;color:#777">No users found da<br><br>Try: Username <b style="color:#fff">sanjai</b> or ID <b style="color:#fff">${ME_ID.slice(0,8)}...</b><br><br>Full ID Paste Pannalum Varum da</p>`;
}
function goMsg(u){location.href='chat.html?user='+encodeURIComponent(u)}
async function loadExplore(){
  let all=[];
  try{ let r=await supa.from('posts').select('*').order('created_at',{ascending:false}).limit(30); if(r.data) all=all.concat(r.data.map(p=>({...p,_from:'posts'}))); }catch(e){}
  try{ let r=await supa.from('reels').select('*').order('created_at',{ascending:false}).limit(30); if(r.data) all=all.concat(r.data.map(p=>({...p,_from:'reels'}))); }catch(e){}
  let seenUrl=new Set(),seenId=new Set(),deduped=[];
  for(let p of all){ let raw=(p.media_url||p.video_url||'').trim(); if(!raw) continue; if(p.is_archived) continue; let u=raw.split('?')[0].toLowerCase(); if(seenUrl.has(u)) continue; if(seenId.has(String(p.id))) continue; seenUrl.add(u); seenId.add(String(p.id)); deduped.push(p); }
  allPosts=deduped;
  document.getElementById('results').innerHTML='';
  document.getElementById('grid').innerHTML=deduped.map(p=>{let best=getBestMedia(p);if(!best.url) return '';let link=best.isVid?`reels.html?id=${p.id}`:`index.html?id=${p.id}`;let vCount=allViews.filter(v=>String(v.post_id)==String(p.id)).length;let tag=best.isVid?`<video src="${best.url}" muted playsinline preload="metadata" style="width:100%;aspect-ratio:1;object-fit:cover" onclick="location.href='${link}'"></video>`:`<img src="${best.url}" onerror="this.parentElement.style.display='none'" onclick="openPhoto('${best.url}','Pixoro','${p.id}')" loading="lazy">`;return `<div style="position:relative">${tag}<span style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);padding:3px 7px;border-radius:10px;font-size:11px">👁️ ${fmtViews(vCount)}</span></div>`}).join('');
}
init()
</script></body></html>
