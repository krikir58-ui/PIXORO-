<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Search - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}.top{padding:12px;display:flex;gap:10px;border-bottom:1px solid #222;position:sticky;top:0;background:#000}input{flex:1;background:#222;border:0;padding:10px 14px;border-radius:10px;color:#fff}.userRow{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #1a1a1a}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script></head><body>
<div class="top"><input id="searchInput" placeholder="Search users..." oninput="doSearch()"><span onclick="location.href='index.html'" style="cursor:pointer">✕</span></div>
<div id="results"></div>
<script>
const supa=supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
async function doSearch(){let q=document.getElementById('searchInput').value;if(!q){document.getElementById('results').innerHTML='';return}let {data}=await supa.from('posts').select('username').ilike('username','%'+q+'%');let uniq=[...new Set((data||[]).map(d=>d.username))];let html='';for(let u of uniq){html+=`<div class="userRow"><div style="display:flex;align-items:center;gap:10px"><img src="https://i.pravatar.cc/40?u=${u}" style="width:36px;height:36px;border-radius:50%"><b>@${u}</b></div><button onclick="location.href='profile.html?u=${u}'" style="background:#0095f6;border:0;color:#fff;padding:6px 14px;border-radius:8px">View</button></div>`}document.getElementById('results').innerHTML=html||'<p style="padding:20px;color:#777">No users found</p>'}
</script></body></html>
