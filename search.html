<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Search - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:8px 12px;display:flex;gap:8px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#000;z-index:10;height:56px;align-items:center}
input{flex:1;background:#181818;border:1px solid #fff;padding:10px 12px;border-radius:10px;color:#fff;outline:none;font-size:14px}
.userRow{display:flex;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid #151515;cursor:pointer}
.userRow:active{background:#111}
.uAva{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#222}
.uAva img{width:100%;height:100%;object-fit:cover}
.avaL{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ff5ea8,#ff7a00);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active{color:#fff}.bottom-nav a.active svg{stroke:#fff}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#fff;font-weight:700}.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
</style></head><body>
<div class="top"><input id="searchInput" placeholder="Search name or ID... @name" oninput="doSearch()" autofocus><span onclick="location.href='index.html'" style="cursor:pointer;font-size:18px">✕</span></div>
<div id="results"></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html" class="active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<script>
let supa=window.supa;
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||''}
let ME_RAW='',ME_ID='',profileMap={},profileByIdMap={},allProfilesCache=[]
function getRealPfp(u){
  let p=profileMap[cleanUser(u)];
  let url=p?(p.avatar_url||p.profile_pic||p.photo_url||''):''; 
  if(url && url.includes('http') && url.length>10) return url; return '';
}
function letterFor(u){
  let n=cleanUser(u||'');
  let l=n.replace(/[^a-zA-Z]/g,'').charAt(0).toUpperCase(); return l||'P';
}
function avatarHtml(u){
  let url=getRealPfp(u); let L=letterFor(u);
  if(url) return `<img src="${url}" onerror="this.outerHTML='<div class=&quot;avaL&quot;>${L}</div>'">`;
  return `<div class="avaL">${L}</div>`;
}
function getPfp(u){ let r=getRealPfp(u); if(r) return r; return 'https://ui-avatars.com/api/?name='+letterFor(u)+'&background=ff5ea8&color=fff&size=200&bold=true'; }
async function init(){
  if(!window.supa){setTimeout(init,300);return}
  supa=window.supa;
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  ME_ID=session.user.id;
  let {data:myProf}=await supa.from('profiles').select('*').eq('id',session.user.id).single();
  ME_RAW=cleanUser(myProf?.username||session.user.email.split('@')[0]);
  // SERVER ONLY DA - PROFILE LIST SERVER LA IRUNTHU MATTUM DA
  let {data:profs}=await supa.from('profiles').select('*').limit(500);
  allProfilesCache=profs||[];
  (profs||[]).forEach(p=>{profileMap[cleanUser(p.username)]=p;profileByIdMap[p.id]=p});
  let el=document.getElementById('navPfp'); if(el) el.src=getPfp(ME_RAW);
  showEmpty();
}
function showEmpty(){
  document.getElementById('results').innerHTML=`<div style="text-align:center;padding:60px 20px;color:#777"><div style="font-size:32px">🔍</div><b style="color:#fff;font-size:16px;display:block;margin-top:10px">Search Pixoro</b><p style="font-size:13px;margin-top:8px;line-height:1.5">Yaaroda ID / Name Type Pannu da<br>Appo mattum avanga ID Varum da</p></div>`;
}
async function doSearch(){
  let qRaw=document.getElementById('searchInput').value.trim();
  if(!qRaw || qRaw.length<1){ showEmpty(); return; }
  let cleanQ=cleanUser(qRaw);
  let lowerQ=qRaw.toLowerCase();
  // ID + USERNAME - SERVER CACHE LA IRUNTHU THEDU DA
  let list = allProfilesCache.filter(p=>{
    if(String(p.id)===String(ME_ID)) return false;
    let uname = cleanUser(p.username||'');
    let idLower = String(p.id||'').toLowerCase();
    return uname.includes(cleanQ) || idLower.includes(lowerQ) || idLower.replace(/-/g,'').includes(lowerQ.replace(/-/g,''));
  });
  // CACHE LA ILLANA - SERVER LA THE DU DA
  if(list.length===0){
    let {data:profs}=await supa.from('profiles').select('*').ilike('username','%'+cleanQ+'%');
    if(profs) list = profs.filter(p=>String(p.id)!==String(ME_ID));
  }
  if(!list.length){
    document.getElementById('results').innerHTML=`<p style="padding:30px 20px;color:#777;text-align:center">No users found da<br><br>Try: Username <b style="color:#fff">sanjay</b><br>Full ID Paste Pannalum Varum da</p>`;
    return;
  }
  // SEARCH LA FOLLOW / VIEW / MESSAGE BUTTON ILLA DA - ID THOTTA PROFILE KU POGUM DA - ANGA THAAN FOLLOW + MESSAGE IRUKKUM DA
  let html=list.slice(0,30).map(p=>{
    let u=cleanUser(p.username);
    return `<div class="userRow" onclick="location.href='profile.html?u=${p.id}'"><div class="uAva">${avatarHtml(u)}</div><div style="flex:1;min-width:0"><b>@${u}</b><div style="font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.bio||'Pixoro User'}</div></div><span style="color:#666;font-size:20px">›</span></div>`;
  }).join('');
  document.getElementById('results').innerHTML=html;
}
init()
</script></body></html>
