<!DOCTYPE html>
<html>
<head>
<title>Pixoro - Free Blue Tick</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#fafafa;margin:0;padding:20px}
.box{max-width:400px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #ddd}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
button{background:#0095f6;color:white;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
h2{margin-top:0}
</style>
</head>
<body>
<div class="box">
  <h2>💙 FREE Blue Tick - Pixoro</h2>
  <p>🔥 1 ID ku 1 Free Tick! ID Proof must da!</p>
  <input id="fullName" placeholder="Full Name">
  <textarea id="reason" placeholder="Yen blue tick venum?"></textarea>
  <input id="instaLink" placeholder="Instagram Link / ID Proof Link (Must)">
  <button id="submitVerify">Request Free Blue Tick 💙</button>
  <p id="status"></p>
  <a href="index.html">Back to Pixoro</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://yecpltndhlzfjpjlzchcpm.supabase.co';
const SUPA_KEY = 'sb_publishable_byUfZPczrxfKYKTMuNco5w_oqabYQJ_';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

document.getElementById('submitVerify').onclick = async () => {
  const { data: { user } } = await supa.auth.getUser();
  if(!user){ alert('Login pannu da!'); return; }
  const fullName = document.getElementById('fullName').value;
  const reason = document.getElementById('reason').value;
  const proof = document.getElementById('instaLink').value;
  if(!fullName || !reason || !proof){ alert('Ellam fill pannu da! ID Proof must!'); return; }
  const { data: existing } = await supa.from('verification_requests').select('*').eq('user_id', user.id).maybeSingle();
  if(existing){ document.getElementById('status').innerText = 'Nee already request pannita da! Status: '+existing.status; return; }
  const { error } = await supa.from('verification_requests').insert({ user_id: user.id, username: user.email, full_name: fullName, reason: reason, id_proof_url: proof, status: 'pending' });
  if(error) document.getElementById('status').innerText = 'Error: '+error.message;
  else document.getElementById('status').innerText = '✅ Request sent da! Admin confirm panni FREE blue tick tharuvom!';
};
</script>
</body>
</html>
