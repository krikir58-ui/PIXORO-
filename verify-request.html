<!DOCTYPE html>
<html>
<head>
<title>Pixoro - Gold Tick ₹49</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#000;margin:0;padding:20px;color:#fff}
.box{max-width:400px;margin:auto;background:#111;padding:25px;border-radius:15px;box-shadow:0 0 15px gold}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #444;border-radius:10px;box-sizing:border-box;background:#222;color:#fff}
button{background:linear-gradient(45deg,#FFD700,#B8860B);color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.gold{color:#FFD700}
h2{margin-top:0}
.paybox{background:#1a1a1a;padding:12px;border-radius:10px;border:1px solid gold;margin:10px 0;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h2><span class="gold">✨ GOLD Tick - Pixoro</span></h2>
  <p>🔥 <b>Owner Giri ku FREE da!</b> Vera Makkalukku <b>₹49 Lifetime da!</b></p>
  
  <div class="paybox">
    <b>₹49 - Gold Tick Lifetime</b><br>
    <small>UPI: pixoro@upi | GPay / PhonePe</small>
  </div>

  <input id="fullName" placeholder="Full Name">
  <textarea id="reason" placeholder="Yen Gold Tick venum?"></textarea>
  <input id="instaLink" placeholder="Instagram Link / ID Proof Link (Must)">
  <input id="upiRef" placeholder="₹49 Paid UTR / Transaction ID (Owner ku vendaam)">
  
  <button id="submitVerify">Request Gold Tick ✨</button>
  <p id="status"></p>
  <a href="index.html" style="color:gold">Back to Pixoro</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://yecpltndhlzfjpjlzchcpm.supabase.co';
const SUPA_KEY = 'sb_publishable_byUfZPczrxfKYKTMuNco5w_oqabYQJ_';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// OWNER EMAIL - Itha Un Email ah maathu da Giri
const OWNER_EMAIL = 'giri@pixoro.com'; 

document.getElementById('submitVerify').onclick = async () => {
  const { data: { user } } = await supa.auth.getUser();
  if(!user){ alert('Login pannu da!'); return; }
  const fullName = document.getElementById('fullName').value;
  const reason = document.getElementById('reason').value;
  const proof = document.getElementById('instaLink').value;
  const upiRef = document.getElementById('upiRef').value;
  
  if(!fullName || !reason || !proof){ alert('Ellam fill pannu da! ID Proof must!'); return; }
  
  const isOwner = (user.email === OWNER_EMAIL);
  let price = isOwner ? 0 : 49;
  let status = isOwner ? 'approved' : 'pending';

  if(!isOwner && !upiRef){ alert('₹49 Pay pannitu UTR Number podu da! Illana Tick kedaikathu da!'); return; }

  const { data: existing } = await supa.from('verification_requests').select('*').eq('user_id', user.id).maybeSingle();
  if(existing){ document.getElementById('status').innerText = 'Nee already request pannita da! Status: '+existing.status; return; }

  const { error } = await supa.from('verification_requests').insert({ 
    user_id: user.id, username: user.email, full_name: fullName, reason: reason, 
    id_proof_url: proof, status: status, amount: price, payment_ref: upiRef 
  });
  if(error) document.getElementById('status').innerText = 'Error: '+error.message;
  else {
    if(isOwner) document.getElementById('status').innerText = '✅ OWNER da! FREE Gold Tick Approved da Giri!';
    else document.getElementById('status').innerText = '✅ ₹49 Request sent da! Admin check panni Gold Tick tharuvom!';
  }
};
</script>
</body>
</html>
