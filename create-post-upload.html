<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New post - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:system-ui}.top{display:flex;gap:14px;padding:14px;font-size:20px}.flex{display:flex;gap:12px;padding:12px}.flex img{width:80px;height:80px;object-fit:cover;border-radius:12px}.flex textarea{flex:1;background:transparent;border:0;color:#fff;font-size:15px;outline:none;resize:none}.chips{display:flex;gap:8px;padding:0 12px}.chips button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}.row{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #222;cursor:pointer}.btns{display:flex;gap:10px;padding:14px;position:fixed;bottom:0;left:0;right:0;background:#111}.btns button{flex:1;padding:14px;border:0;border-radius:30px;font-weight:800}.save{background:#333;color:#fff}.share{background:#4d7cff;color:#fff}</style></head><body>
<div class="top"><span onclick="history.back()">←</span><b>New post</b></div>
<div class="flex"><img id="thumb" src=""><textarea id="caption" rows="3" placeholder="Write a caption and add hashtags..."></textarea></div>
<div class="chips"><button onclick="addHash()"># Hashtags</button><button onclick="addPoll()">☰ Poll</button><button onclick="addPrompt()">⌕ Prompt</button></div>
<div class="row" onclick="tagPeople()"><span>👤 Tag people</span><span>›</span></div>
<div class="row" onclick="addLocation()"><span>📍 Add location</span><span>›</span></div>
<small style="color:#888;padding:0 16px;display:block">People you share this content with can see the location you tag and view this content on the map.</small>
<div class="row" onclick="togglePrivate()"><span>🔒 Audience</span><span id="audTxt">Public ›</span></div>
<div style="height:80px"></div>
<div class="btns"><button class="save" onclick="saveDraft()">Save draft</button><button class="share" id="shareBtn" onclick="sharePost()">Share</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script><script src="js/pixoro-core.js"></script>
<script>let media=localStorage.getItem('pixoro_post_media')||'https://picsum.photos/500/500?random=20';document.getElementById('thumb').src=media;let isPrivate=false,tagged='',loc='';function addHash(){let c=document.getElementById('caption');c.value+=' #pixoro #trending ';c.focus();}function addPoll(){let q=prompt('Poll Question?');if(q){document.getElementById('caption').value+='\n📊 Poll: '+q;}}function addPrompt(){let p=prompt('Prompt:');if(p){document.getElementById('caption').value+='\n💬 '+p;}}function tagPeople(){let t=prompt('Username:');if(t){tagged=t;alert('Tagged da: @'+t);}}function addLocation(){let l=prompt('Location:');if(l){loc=l;alert('Location: '+l);}}function togglePrivate(){isPrivate=!isPrivate;document.getElementById('audTxt').innerText=isPrivate?'Private Share ›':'Public ›';}function saveDraft(){localStorage.setItem('pixoro_post_draft',document.getElementById('caption').value);alert('Draft Save Aachu da ✅');}async function sharePost(){let btn=document.getElementById('shareBtn');btn.innerText='Sharing...';btn.disabled=true;let cap=document.getElementById('caption').value||'Just Pixoro 🔥';if(tagged)cap+=' @'+tagged;if(loc)cap+=' 📍 '+loc;try{let s=window.supa;let {data:{session}}=await s.auth.getSession();if(!session){alert('Login Pannu da');location.href='./login.html';return;}let {data,error}=await s.from('posts').insert({user_id:session.user.id,username:window.ME_RAW||session.user.email.split('@')[0],media_url:media,image_url:media,media_type:'post',caption:cap,visibility:isPrivate?'private_share':'public',is_archived:false}).select().single();if(error) throw error;localStorage.removeItem('pixoro_post_media');alert('Post Share Aachu da 🔥');location.href='./index.html';}catch(e){alert('Error da: '+e.message);btn.innerText='Share';btn.disabled=false;}}</script>
</body></html>
