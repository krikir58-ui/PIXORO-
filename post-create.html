<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px} .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:10px} .skeleton{background:#222;height:120px;position:relative;overflow:hidden} .skeleton::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);animation:sh 1.2s infinite} @keyframes sh{to{left:100%}} .next{background:#ff5ea8;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px}</style></head>
<body><div style="display:flex;justify-content:space-between"><span onclick="history.back()">X</span><b>New Post</b><span>Next</span></div>
<div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
<button class="next" onclick="location.href='./post-filter.html'">Next - Filter</button></body></html>
