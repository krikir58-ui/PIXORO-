<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #111}
.prev{margin:12px;height:350px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prev img,.prev video{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.cell{padding:16px;background:#1a1a1a;border-radius:14px;text-align:center;cursor:pointer}
.btn{margin:12px;background:#fff;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
</style></head><body>
<div class="top"><b>New Post 📸</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">📸 Photo / Video Select Pannu</div>
<div class="grid"><div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div><div class="cell" onclick="document.getElementById('f').click()">➕ Add Photo</div></div>
<button class="btn" onclick="go()">Next →</button>
<div id="toast" class="toast"></div>
<input type="file" id="f" hidden accept="image/*,video/*" onchange="h(event)">
<script>
const supa=supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_');
// === PIXORO NO FULL ALERT LOCK ===
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
window.onerror = function(){ showToast('Adutha side la problem da - Try again'); return true; };
let m=''; let mType='image';
async function h(e){
  let f=e.target.files[0]; if(!f) return;
  let isVideo=f.type.startsWith('video');
  mType=isVideo?'video':'image';
  let url=URL.createObjectURL(f);
  document.getElementById('prev').innerHTML=isVideo?`<video src="${url}" autoplay muted loop></video>`:`<img src="${url}">`;
  showToast('Uploading... ⏳');
  let bucket=isVideo?'reels':'posts';
  let fileName=Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'_');
  let {error}=await supa.storage.from(bucket).upload(fileName,f);
  if(error){ showToast('Adutha side la problem da - Try again'); return; }
  let {data}=supa.storage.from(bucket).getPublicUrl(fileName);
  m=data.publicUrl;
  localStorage.setItem('pix_media',m);
  sessionStorage.setItem('pixoro_pending_media',m);
  localStorage.setItem('pix_media_type',mType);
  localStorage.setItem('pix_media_is_reel',isVideo?'true':'false');
  showToast('Upload Done da Giri! 🔥 Next ku po da');
}
function go(){ if(!m){showToast('Photo select pannu da Giri!');return} location.href='post-upload.html' }
</script></body></html>
