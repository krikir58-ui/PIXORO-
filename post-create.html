<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto}
.top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #111}
.prev{margin:12px;height:350px;background:#111;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.prev img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.cell{padding:16px;background:#1a1a1a;border-radius:14px;text-align:center;cursor:pointer}
.btn{margin:12px;background:#fff;border:0;width:calc(100% - 24px);padding:14px;border-radius:20px;font-weight:900}
</style></head><body>
<div class="top"><b>New Post 📸</b><span onclick="location.href='index.html'">✕</span></div>
<div class="prev" id="prev">📸 Photo Select Pannu</div>
<div class="grid">
<div class="cell" onclick="document.getElementById('f').click()">🖼️ Gallery</div>
<div class="cell" onclick="document.getElementById('f').click()">➕ Add Photo</div>
</div>
<button class="btn" onclick="go()">Next →</button>
<input type="file" id="f" hidden accept="image/*" onchange="h(event)">
<script>
let m='';
function h(e){
let f=e.target.files[0];if(!f)return;
let url=URL.createObjectURL(f);
m=url;
document.getElementById('prev').innerHTML=`<img src="${url}">`;
// FIX: Direct save - compress vendam, fast ah load aagum da
let reader=new FileReader();
reader.onload=function(){
  let base64=reader.result;
  localStorage.setItem('pix_media',base64);
  sessionStorage.setItem('pixoro_pending_media',base64);
  localStorage.setItem('pix_media_type','image');
  localStorage.setItem('pix_media_is_reel','false');
};
reader.readAsDataURL(f);
}
function go(){
  if(!m){alert('Photo select pannu da Giri!');return}
  location.href='post-upload.html'
}
</script></body></html>
