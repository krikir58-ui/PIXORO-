<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px} .top{display:flex;justify-content:space-between;align-items:center} .preview{background:#222;height:280px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:10px} .preview img{width:100%;height:100%;object-fit:cover;display:none} .preview.has img{display:block} .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:10px} .skeleton{background:#222;height:120px;position:relative;overflow:hidden;cursor:pointer} .skeleton::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);animation:sh 1.2s infinite} @keyframes sh{to{left:100%}} .skeleton.sel{outline:3px solid #ff5ea8;outline-offset:-3px} .next{background:#ff5ea8;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700;margin-top:10px} .next:disabled{background:#333;color:#888}</style></head>
<body>
<div class="top"><span onclick="history.back()">X</span><b>New Post</b><span onclick="document.getElementById('file').click()" style="color:#ff5ea8">Gallery</span></div>

<!-- Periya Preview da - Photo Select Panna Inga Varum da -->
<div class="preview" id="preview"><span id="previewTxt" style="color:#888">Photo Select Pannu da</span><img id="previewImg"></div>

<input type="file" id="file" accept="image/*" hidden onchange="pickPhoto(event)">
<div class="grid">
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
<div class="skeleton" onclick="document.getElementById('file').click()"></div>
</div>

<button class="next" id="nextBtn" disabled onclick="goNext()">Next - Filter</button>

<script>
let myPhoto = "";
function pickPhoto(e){
  let f = e.target.files[0];
  if(!f) return;
  let url = URL.createObjectURL(f);
  myPhoto = url;
  let img = document.getElementById('previewImg');
  img.src = url;
  document.getElementById('preview').classList.add('has');
  document.getElementById('previewTxt').style.display='none';
  document.getElementById('nextBtn').disabled = false;
  // First Skeleton la Photo Kaattu da
  let first = document.querySelector('.skeleton');
  first.style.backgroundImage = 'url('+url+')';
  first.style.backgroundSize = 'cover';
  first.style.backgroundPosition = 'center';
  first.classList.add('sel');
  // Next Page ku Photo Anuppu da
  localStorage.setItem('pixoro_post_photo', url);
}
function goNext(){
  if(!myPhoto){ alert('First Photo Select Pannu da Giri!'); return; }
  location.href='./post-filter.html';
}
</script>
</body></html>
