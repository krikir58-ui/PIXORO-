
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PIXORO Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#000;color:white;max-width:450px;height:100dvh;margin:auto;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #292929}
.top img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.top b{font-size:14px}
.small{font-size:20px;background:#191919;border:0;color:white;border-radius:50%;width:34px;height:34px}
#box{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.bub{max-width:82%;padding:10px 13px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;line-height:1.4}
.me{align-self:flex-end;background:linear-gradient(135deg,#8b00ff,#ff1493,#ff7a00);border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#252525;border:1px solid #7040a0;border-bottom-left-radius:4px}
.bub img,.bub video{max-width:100%;border-radius:12px;display:block}
.bub audio{max-width:100%}
.time{font-size:10px;text-align:right;opacity:.8;margin-top:5px}
.reply{font-size:11px;border-left:3px solid #ff8bc8;padding:5px;margin-bottom:6px;background:#0003}
#typing{height:20px;font-size:12px;color:#aaa;padding-left:15px}
#inputBar{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #292929}
#inp{flex:1;min-width:0;border:1px solid #7540b0;border-radius:25px;padding:12px;background:#222;color:white;outline:none}
.action{border:0;background:transparent;color:white;font-size:22px}
#send{background:linear-gradient(135deg,#ff5ea8,#ff7a00);border:0;border-radius:50%;width:42px;height:42px;color:white;font-size:20px}
#status{font-size:12px;text-align:center;color:#aaa;padding:5px}
#replyBar{display:none;padding:7px 12px;background:#171717;color:#ff9acb;font-size:12px}
#menu{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);width:min(94%,420px);background:#202020;padding:12px;border-radius:16px;z-index:20}
#menu button{width:100%;padding:12px;background:#303030;color:white;border:0;border-radius:9px;margin:3px 0;text-align:left}
</style>
</head>
<body>

<header class="top">
<button class="small" onclick="location.href='dm.html'">←</button>
<img id="pfp" alt="Profile">
<div style="flex:1;min-width:0">
<b id="uname">PIXORO User</b>
<div id="online" style="font-size:11px;color:#aaa">PIXORO Chat</div>
</div>
<button class="small" onclick="openMenu()">⋮</button>
</header>

<div id="status">Connecting...</div>
<div id="box"></div>
<div id="typing"></div>
<div id="replyBar"></div>

<div id="inputBar">
<button class="action" onclick="document.getElementById('file').click()">📎</button>
<input type="file" id="file" hidden accept="image/*,video/*" onchange="sendMedia(this)">
<input id="inp" maxlength="3000" placeholder="Message...">
<button class="action" onclick="startVoice()">🎙️</button>
<button id="send" onclick="sendMessage()">➤</button>
</div>

<div id="menu">
<button onclick="replySelected()">↩️ Reply</button>
<button onclick="reactSelected()">❤️ React</button>
<button onclick="unsendSelected()">🗑️ Unsend my message</button>
<button onclick="document.getElementById('menu').style.display='none'">Cancel</button>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
let supa=window.supa;
let ME_ID='',OTHER_ID='',ME='',OTHER='',CHAT_ID='';
let channel=null,selectedMessage=null,replyText='';
let busy=false,recorder=null,recordChunks=[];

function cleanName(v){
 return String(v||'').trim().replace(/^@/,'').toLowerCase();
}
function status(t){$('status').textContent=t;}
function scrollBottom(){
 $('box').scrollTop=$('box').scrollHeight;
}

function addText(parent,tag,text,className){
 const el=document.createElement(tag);
 if(className)el.className=className;
 el.textContent=text;
 parent.appendChild(el);
 return el;
}

function openMenu(){
 $('menu').style.display='block';
}
function selectMessage(id){
 selectedMessage=id;
 openMenu();
}

function renderMessage(m){
 if(!m || !m.id)return;
 if($('box').querySelector('[data-id="'+CSS.escape(String(m.id))+'"]'))return;

 const mine=String(m.sender_id)===ME_ID;
 const el=document.createElement('div');
 el.className='bub '+(mine?'me':'other');
 el.dataset.id=m.id;

 if(m.reply_to){
  addText(el,'div',m.reply_to,'reply');
 }

 const url=m.media_url||'';
 if(url){
  if(m.media_type==='video'||m.type==='video'){
   const v=document.createElement('video');
   v.src=url;v.controls=true;v.playsInline=true;
   el.appendChild(v);
  }else if(m.media_type==='voice'||m.type==='voice'){
   const a=document.createElement('audio');
   a.src=url;a.controls=true;
   el.appendChild(a);
  }else{
   const img=document.createElement('img');
   img.src=url;img.alt='Shared media';img.loading='lazy';
   el.appendChild(img);
  }
 }else{
  addText(el,'div',m.text||m.message||'');
 }

 if(m.reaction)addText(el,'div',m.reaction);
 const time=addText(el,'div',
  (m.created_at?new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'')+
  (mine?(m.seen?'  ✓✓':'  ✓'):''),
  'time'
 );

 el.addEventListener('contextmenu',e=>{
  e.preventDefault();selectMessage(m.id);
 });
 el.addEventListener('click',()=>{
  if(window._lastTap && Date.now()-window._lastTap<350){
   selectMessage(m.id);
  }
  window._lastTap=Date.now();
 });

 $('box').appendChild(el);
}

async function loadMessages(){
 if(busy||!ME_ID||!OTHER_ID)return;
 busy=true;
 try{
  const {data,error}=await supa.from('messages')
   .select('*')
   .eq('chat_id',CHAT_ID)
   .order('created_at',{ascending:true})
   .limit(200);

  if(error)throw error;

  const box=$('box');
  const wasBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;

  box.replaceChildren();
  (data||[]).forEach(renderMessage);

  const unseen=(data||[]).filter(m=>
   String(m.receiver_id)===ME_ID&&!m.seen
  );

  for(const m of unseen){
   await supa.from('messages')
    .update({seen:true})
    .eq('id',m.id)
    .eq('receiver_id',ME_ID);
  }

  if(wasBottom||unseen.length)scrollBottom();
  if(!data||!data.length){
   addText(box,'div','Say hello to @'+OTHER+' 👋');
  }
  status('');
 }catch(e){
  console.error(e);status('Chat loading error: '+e.message);
 }finally{
  busy=false;
 }
}

async function sendMessage(){
 const input=$('inp');
 const value=input.value.trim();
 if(!value||!ME_ID||!OTHER_ID)return;

 $('send').disabled=true;
 try{
  const {error}=await supa.from('messages').insert({
   chat_id:CHAT_ID,
   sender_id:ME_ID,
   receiver_id:OTHER_ID,
   sender:ME,
   receiver:OTHER,
   text:value,
   message:value,
   type:'text',
   seen:false,
   reply_to:replyText||null,
   vanish:false
  });
  if(error)throw error;

  input.value='';
  replyText='';
  $('replyBar').style.display='none';
  $('box').scrollTop=$('box').scrollHeight;
  await loadMessages();
 }catch(e){
  status('Message send failed: '+e.message);
 }finally{
  $('send').disabled=false;
  input.focus();
 }
}

async function sendMedia(input){
 const file=input.files?.[0];
 if(!file)return;
 if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){
  status('Image or video only');return;
 }
 if(file.size>25*1024*1024){
  status('Maximum file size is 25 MB');input.value='';return;
 }

 status('Uploading...');
 try{
  const ext=file.name.split('.').pop().replace(/[^a-zA-Z0-9]/g,'');
  const path=ME_ID+'/'+Date.now()+'.'+ext;
  const {error}=await supa.storage.from('dms').upload(path,file,{
   upsert:false,contentType:file.type
  });
  if(error)throw error;

  // Private bucket: create a temporary signed URL.
  const {data:link,error:linkError}=await supa.storage
   .from('dms').createSignedUrl(path,3600);
  if(linkError)throw linkError;

  const kind=file.type.startsWith('video/')?'video':'image';
  const {error:insertError}=await supa.from('messages').insert({
   chat_id:CHAT_ID,sender_id:ME_ID,receiver_id:OTHER_ID,
   sender:ME,receiver:OTHER,
   text:kind==='video'?'Video':'Photo',
   message:kind==='video'?'Video':'Photo',
   media_url:link.signedUrl,media_type:kind,type:kind,seen:false
  });
  if(insertError)throw insertError;
  await loadMessages();
  status('');
 }catch(e){
  status('Upload failed: '+e.message);
 }finally{
  input.value='';
 }
}

async function startVoice(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  status('Voice recording not supported');return;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream);
  recordChunks=[];
  recorder.ondataavailable=e=>{
   if(e.data.size)recordChunks.push(e.data);
  };
  recorder.onstop=async()=>{
   try{
    const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});
    const path=ME_ID+'/'+Date.now()+'_voice.webm';
    const {error}=await supa.storage.from('dms').upload(path,blob);
    if(error)throw error;
    const {data,error:e2}=await supa.storage.from('dms').createSignedUrl(path,3600);
    if(e2)throw e2;
    const {error:e3}=await supa.from('messages').insert({
     chat_id:CHAT_ID,sender_id:ME_ID,receiver_id:OTHER_ID,
     sender:ME,receiver:OTHER,text:'Voice message',
     message:'Voice message',media_url:data.signedUrl,
     media_type:'voice',type:'voice',seen:false
    });
    if(e3)throw e3;
    await loadMessages();
   }catch(e){status('Voice upload failed: '+e.message);}
   stream.getTracks().forEach(t=>t.stop());
  };
  recorder.start();
  status('Recording... Tap 🎙️ again to stop');
  $('voiceStop').style.display='block';
 }catch(e){status('Microphone permission unavailable');}
}

function stopVoice(){
 if(recorder&&recorder.state==='recording'){
  recorder.stop();$('voiceStop').style.display='none';
  status('Sending voice...');
 }
}

function replySelected(){
 const el=$('box').querySelector('[data-id="'+CSS.escape(String(selectedMessage))+'"]');
 if(!el)return;
 replyText=el.innerText.slice(0,150);
 $('replyBar').textContent='Replying to: '+replyText;
 $('replyBar').style.display='block';
 $('inp').focus();
 $('menu').style.display='none';
}

async function reactSelected(){
 const reaction=prompt('Enter a reaction: ❤️ 😂 👍');
 if(!reaction)return;
 const {error}=await supa.from('messages')
  .update({reaction:reaction})
  .eq('id',selectedMessage)
  .eq('receiver_id',ME_ID);
 if(error)status('Reaction failed: '+error.message);
 $('menu').style.display='none';
 await loadMessages();
}

async function unsendSelected(){
 const {error}=await supa.from('messages')
  .delete()
  .eq('id',selectedMessage)
  .eq('sender_id',ME_ID);
 if(error)status('Unsend failed: '+error.message);
 $('menu').style.display='none';
 await loadMessages();
}

async function init(){
 try{
  if(!supa)throw new Error('PIXORO Supabase connection missing');

  const {data:{session},error}=await supa.auth.getSession();
  if(error)throw error;
  if(!session){location.href='login.html';return;}
  ME_ID=session.user.id;

  const target=cleanName(new URLSearchParams(location.search).get('user'));
  if(!target){location.href='dm.html';return;}

  const {data:mine,error:e1}=await supa.from('profiles')
   .select('id,username,name,avatar_url')
   .eq('id',ME_ID).single();
  if(e1)throw e1;

  const {data:other,error:e2}=await supa.from('profiles')
   .select('id,username,name,avatar_url')
   .ilike('username',target).maybeSingle();
  if(e2)throw e2;
  if(!other)throw new Error('User not found');
  if(other.id===ME_ID)throw new Error('Cannot chat with yourself');

  ME_ID=mine.id;
  OTHER_ID=other.id;
  ME=cleanName(mine.username);
  OTHER=cleanName(other.username);
  CHAT_ID=[ME_ID,OTHER_ID].sort().join('_');

  $('uname').textContent='@'+OTHER;
  $('pfp').src=other.avatar_url||
   'https://ui-avatars.com/api/?name=P&background=222&color=fff';

  await loadMessages();

  channel=supa.channel('pixoro-chat-'+CHAT_ID)
   .on('postgres_changes',{
    event:'*',schema:'public',table:'messages',
    filter:'chat_id=eq.'+CHAT_ID
   },()=>loadMessages())
   .subscribe();

  status('PIXORO Chat connected');
 }catch(e){
  console.error(e);status(e.message);
 }
}

$('inp').addEventListener('keydown',e=>{
 if(e.key==='Enter')sendMessage();
});

const stopButton=document.createElement('button');
stopButton.id='voiceStop';
stopButton.textContent='⏹ Stop voice';
stopButton.style.cssText='display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#e22;color:white;border:0;border-radius:20px;z-index:30';
stopButton.onclick=stopVoice;
document.body.appendChild(stopButton);

init();

window.addEventListener('beforeunload',()=>{
 if(channel&&supa)supa.removeChannel(channel);
 if(recorder&&recorder.state==='recording')recorder.stop();
});
</script>
</body>
</html>
