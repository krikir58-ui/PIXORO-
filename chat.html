<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pixoro Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.top{padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #262626;background:#000;position:sticky;top:0;z-index:50;height:56px}
.top img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid #333;cursor:pointer}
.top b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;cursor:pointer}
.smallBtn{font-size:16px;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#1a1a1a;flex-shrink:0}
.box{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:10px 14px;border-radius:22px;font-size:14px;line-height:1.4;word-break:break-word;position:relative;cursor:pointer}
.me{align-self:flex-end;background:linear-gradient(135deg,#8b00ff,#ff1493,#ff7a00);border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#262626;border-bottom-left-radius:4px;border:1px solid #a259ff}
.bub img,.bub video{width:100%;border-radius:14px;margin:6px 0;display:block}.bub audio{width:200px;margin-top:6px}
.time{font-size:9px;opacity:.7;margin-top:3px;text-align:right}
.replyBox{font-size:11px;background:rgba(0,0,0,.3);padding:6px;border-radius:8px;margin-bottom:5px;border-left:2px solid #fff}
.react{position:absolute;bottom:-10px;right:8px;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:2px 6px;font-size:12px}
.typing{font-size:12px;color:#00ff66;padding:2px 14px;height:18px}
.vanishBar{background:#111;padding:8px;text-align:center;font-size:12px;color:#ff5ea8;border-bottom:1px solid #222;display:none}
.input{display:flex;gap:8px;padding:12px;background:#000;border-top:1px solid #262626;align-items:center}
.input input{flex:1;background:#262626;border:1px solid #a259ff;padding:12px 16px;border-radius:24px;color:#fff;outline:none;font-size:14px}
.sendBtn{background:linear-gradient(135deg,#ff5ea8,#ff7a00);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.voiceBar{background:#111;padding:10px;display:none;align-items:center;gap:10px;border-top:1px solid #ff5ea8}
.callBox{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
.callBox video{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff5ea8,#ff7a00);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:1000;display:none}
.longSheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;background:#1a1a1a;border-radius:20px 20px 0 0;padding:16px;z-index:999;display:none}
.longSheet button{width:100%;padding:12px;border:0;background:#262626;color:#fff;border-radius:10px;margin:4px 0;text-align:left}
</style></head><body>
<div class="top"><span onclick="location.href='dm.html'" style="font-size:22px;cursor:pointer">←</span><img id="pfp" onclick="goProfile()"><div style="flex:1" onclick="goProfile()"><b id="uname">...</b><div id="status" style="font-size:11px;color:#00ff66">Offline</div></div><span style="cursor:pointer;font-size:15px" onclick="toggleVanish()">👻</span><span class="smallBtn" onclick="startCall(false)">📞</span><span class="smallBtn" onclick="startCall(true)">🎥</span><span class="smallBtn" onclick="document.getElementById('setSheet').style.display='block'">⋮</span></div>
<div class="vanishBar" id="vanishBar">👻 Vanish Mode ON</div>
<div class="box" id="box"></div>
<div class="typing" id="typing"></div>
<div class="voiceBar" id="voiceBar"><span id="recTime">🔴 0s</span><button onclick="stopVoice()" style="background:#ff0000;color:#fff;border:0;padding:8px 16px;border-radius:20px">⏹️ STOP & SEND</button></div>
<div class="input"><span onclick="document.getElementById('fileUp').click()" style="font-size:22px;cursor:pointer">📸</span><input id="inp" placeholder="Message..." oninput="onTyping()" onkeydown="if(event.key==='Enter')send()"><input type="file" id="fileUp" hidden accept="image/*,video/*" onchange="sendPhoto(this)"><span onclick="startVoice()" style="font-size:22px;cursor:pointer">🎙️</span><span onclick="send()" class="sendBtn">➤</span></div>
<div class="longSheet" id="sheet"><div style="text-align:center;font-size:22px">❤️ 😂 😮 😢 🔥 👍</div><button onclick="doReact('❤️')">❤️ React</button><button onclick="doReply()">↩️ Reply</button><button onclick="doUnsend()">🗑️ Unsend</button><button onclick="document.getElementById('sheet').style.display='none'" style="text-align:center">Cancel</button></div>
<div class="longSheet" id="setSheet"><b id="setName">Settings</b><button onclick="doBlock()">🚫 Block User</button><button onclick="doUnblock()">✅ Unblock User</button><button onclick="doReport()">⚠️ Report</button><button onclick="doMuteChat()">🔕 Mute Chat</button><button onclick="goProfile()">👤 View Profile</button><button onclick="doClear()">🗑️ Clear Chat</button><button onclick="document.getElementById('setSheet').style.display='none'" style="text-align:center">Cancel</button></div>
<div class="callBox" id="callBox"><div style="position:relative;flex:1"><video id="remoteV" autoplay playsinline></video><video id="localV" autoplay muted playsinline style="width:110px;height:150px;position:absolute;bottom:20px;right:10px;border:2px solid #fff;border-radius:12px;object-fit:cover"></video><div style="position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center"><b id="callName" style="font-size:18px"></b><p id="callStatus" style="font-size:12px;color:#00ff88">Calling...</p></div></div><div style="display:flex;gap:14px;justify-content:center;padding:20px"><button onclick="toggleMic()" id="micBtn" style="width:52px;height:52px;border-radius:50%;border:0;font-size:20px">🎙️</button><button onclick="toggleCam()" id="camBtn" style="width:52px;height:52px;border-radius:50%;border:0;font-size:20px">📸</button><button onclick="endCall()" style="width:52px;height:52px;border-radius:50%;border:0;background:#ff0000;font-size:20px">📵</button></div></div>
<div id="toast" class="toast"></div>
<script>
function showToast(m){let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
let supa = window.supa
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; return u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase()||'' }
let ME='', ME_ID='', OTHER=cleanUser(new URLSearchParams(location.search).get('user')||''), OTHER_ID='', chatId='', mediaRec=null, vChunks=[], vTimer=null, vSec=0, peer=null, callObj=null, stream=null, micOn=true, camOn=true, VANISH=false, SEL_MSG=null, SEL_TXT='', REPLY_TXT='', BLOCKED=JSON.parse(localStorage.getItem('pixoro_blocked')||'[]');
function goProfile(){ location.href='profile.html?user='+encodeURIComponent(OTHER); }
function toggleVanish(){ VANISH=!VANISH; document.getElementById('vanishBar').style.display=VANISH?'block':'none'; showToast(VANISH?'Vanish ON da 👻':'Vanish OFF da') }
function doBlock(){ if(!BLOCKED.includes(OTHER)) BLOCKED.push(OTHER); localStorage.setItem('pixoro_blocked',JSON.stringify(BLOCKED)); showToast('Blocked da 🚫'); document.getElementById('setSheet').style.display='none'; }
function doUnblock(){ BLOCKED=BLOCKED.filter(x=>x!==OTHER); localStorage.setItem('pixoro_blocked',JSON.stringify(BLOCKED)); showToast('Unblocked da ✅'); document.getElementById('setSheet').style.display='none'; load(); }
function doReport(){ showToast('Reported da ⚠️'); document.getElementById('setSheet').style.display='none'; }
function doMuteChat(){ let m=JSON.parse(localStorage.getItem('pixoro_mute')||'[]'); if(!m.includes(OTHER)) m.push(OTHER); localStorage.setItem('pixoro_mute',JSON.stringify(m)); showToast('Muted da 🔕'); document.getElementById('setSheet').style.display='none'; }
function doClear(){ document.getElementById('box').innerHTML=''; showToast('Cleared da 🗑️'); document.getElementById('setSheet').style.display='none'; }
async function onTyping(){ await supa.from('typing').upsert({chat_id:chatId,username:ME,is_typing:true},{onConflict:'chat_id,username'}); clearTimeout(window._tt); window._tt=setTimeout(async()=>{ await supa.from('typing').upsert({chat_id:chatId,username:ME,is_typing:false},{onConflict:'chat_id,username'}); },2000); }
let pressT=null;
function pressMsg(id,txt){ pressT=setTimeout(()=>{ SEL_MSG=id; SEL_TXT=txt; document.getElementById('sheet').style.display='block'; },600); }
document.addEventListener('mouseup',()=>clearTimeout(pressT)); document.addEventListener('touchend',()=>clearTimeout(pressT));
async function doReact(e){ await supa.from('messages').update({reaction:e}).eq('id',SEL_MSG); document.getElementById('sheet').style.display='none'; load(); }
async function doReply(){ REPLY_TXT=SEL_TXT; document.getElementById('inp').placeholder='Replying: '+SEL_TXT.slice(0,20); document.getElementById('inp').focus(); document.getElementById('sheet').style.display='none'; }
async function doUnsend(){ await supa.from('messages').delete().eq('id',SEL_MSG); document.getElementById('sheet').style.display='none'; load(); }
async function init(){
  if(!window.supa){ setTimeout(init,300); return }
  supa = window.supa
  if(!OTHER){ location.href='dm.html'; return }
  let { data:{session} } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return }
  ME_ID = session.user.id
  let { data: myProf } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  ME = cleanUser(myProf?.username || session.user.email.split('@')[0])
  if(OTHER===ME){ showToast('Unakku nee chat panna mudiyathu da 😅'); setTimeout(()=>location.href='dm.html',800); return }
  let { data: otherProf } = await supa.from('profiles').select('*').eq('username', OTHER).maybeSingle()
  if(!otherProf){ let {data:all}=await supa.from('profiles').select('*'); otherProf=(all||[]).find(p=>cleanUser(p.username)===OTHER) }
  if(!otherProf){ showToast('Real user illa da ❌'); setTimeout(()=>location.href='dm.html',1000); return }
  OTHER_ID = otherProf.id
  document.getElementById('uname').innerText = '@'+cleanUser(otherProf.username)
  document.getElementById('setName').innerText = '@'+cleanUser(otherProf.username)+' Settings'
  document.getElementById('pfp').src = otherProf.avatar_url || 'https://ui-avatars.com/api/?name='+OTHER.charAt(0).toUpperCase()+'&background=ff1493&color=fff&size=200&bold=true'
  if(otherProf.is_online) document.getElementById('status').innerText='Active now'; else document.getElementById('status').innerText='Offline'
  chatId=[ME,cleanUser(otherProf.username)].sort().join('_')
  OTHER = cleanUser(otherProf.username)
  try{ supa.channel('chat-'+chatId).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:`chat_id=eq.${chatId}`},load).subscribe() }catch(e){}
  try{ supa.channel('typing-'+chatId).on('postgres_changes',{event:'*',schema:'public',table:'typing'},(p)=>{ let r=p.new; if(r&&r.username!==ME&&r.chat_id===chatId){ document.getElementById('typing').innerText=r.is_typing?'Typing...':''; } }).subscribe() }catch(e){}
  load()
}
async function load(){
  let {data} = await supa.from('messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true})
  if(!data || !data.length){
    let {data:d2} = await supa.from('messages').select('*').or(`and(sender.eq.${ME},receiver.eq.${OTHER}),and(sender.eq.${OTHER},receiver.eq.${ME})`).order('created_at',{ascending:true})
    if(d2 && d2.length) data = d2
  }
  await supa.from('messages').update({seen:true}).eq('chat_id',chatId).eq('seen',false).catch(()=>{});
  let b=document.getElementById('box')
  if(!data||!data.length){ b.innerHTML=`<div style="text-align:center;color:#666;margin-top:80px"><b>Say hi to @${OTHER} 👋</b></div>`; return }
  b.innerHTML=data.map(m=>{ let isMe = m.sender===ME || m.sender_id===ME_ID; let txt = m.text||m.message||''; let media=''; let url=m.media_url||m.image_url||''; if(m.type==='voice'||m.media_type==='voice') media=`<audio src="${url}" controls></audio>`; else if(m.type==='video'||m.media_type==='video') media=`<video src="${url}" controls></video>`; else if(url) media=`<img src="${url}">`; else if(txt.startsWith('data:image')||(txt.startsWith('http')&&txt.includes('.jpg'))) media=`<img src="${txt}">`; let tick=isMe? (m.seen?`<span style="color:#00bfff">✓✓ Seen</span>`:`<span style="color:#888">✓ Sent</span>`):''; let reply=m.reply_to?`<div class="replyBox">${m.reply_to}</div>`:''; let react=m.reaction?`<span class="react">${m.reaction}</span>`:''; let safe=(txt||'').replace(/'/g,'').slice(0,30); return `<div class="${isMe?'me':'other'} bub" onmousedown="pressMsg('${m.id}','${safe}')" ontouchstart="pressMsg('${m.id}','${safe}')">${reply}${media}${media?'':txt}${react}<div class="time">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${tick}</div></div>` }).join('')
  b.scrollTop=b.scrollHeight
}
async function send(){
  let i=document.getElementById('inp'); let t=i.value.trim(); if(!t) return; if(BLOCKED.includes(OTHER)){ showToast('Blocked da 🚫 Unblock Pannu da'); return; } i.value=''
  document.getElementById('box').innerHTML+=`<div class="me bub">${t}<div class="time">now ✓</div></div>`; document.getElementById('box').scrollTop=document.getElementById('box').scrollHeight
  let {error} = await supa.from('messages').insert({chat_id:chatId,sender:ME,receiver:OTHER,text:t,message:t,sender_id:ME_ID,receiver_id:OTHER_ID,seen:false,type:'text',reply_to:REPLY_TXT||null,vanish:VANISH})
  if(error){ await supa.from('messages').insert({chat_id:chatId,sender:ME,receiver:OTHER,text:t}); }
  REPLY_TXT=''; document.getElementById('inp').placeholder='Message...'; load()
}
async function sendPhoto(input){
  if(!input.files[0]) return; let file=input.files[0]; let isVid=file.type.startsWith('video'); let fileName=Date.now()+'_'+ME+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'_'); let {error}=await supa.storage.from('dms').upload(fileName,file); let url=''; if(!error){ let {data}=supa.storage.from('dms').getPublicUrl(fileName); url=data.publicUrl; } else { let r=new FileReader(); r.onload=async e=>{ await supa.from('messages').insert({chat_id:chatId,sender:ME,receiver:OTHER,text:e.target.result,message:'📷 Photo',sender_id:ME_ID,receiver_id:OTHER_ID,seen:false}); load(); }; r.readAsDataURL(file); return; }
  await supa.from('messages').insert({chat_id:chatId,sender:ME,receiver:OTHER,text:isVid?'🎬 Video':'📸 Photo',message:isVid?'🎬 Video':'📸 Photo',sender_id:ME_ID,receiver_id:OTHER_ID,seen:false,type:isVid?'video':'image',media_url:url,media_type:isVid?'video':'image'}); showToast(isVid?'Video Sent da 🎬':'Photo Sent da 🔥'); load();
}
async function startVoice(){
  if(!window.isSecureContext){ showToast('HTTPS la mattum Voice da'); return; }
  try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRec=new MediaRecorder(s); vChunks=[]; vSec=0; mediaRec.ondataavailable=e=>{if(e.data.size>0) vChunks.push(e.data)}; mediaRec.start(); document.getElementById('voiceBar').style.display='flex'; vTimer=setInterval(()=>{ vSec++; document.getElementById('recTime').innerText='🔴 '+vSec+'s' },1000); showToast('Recording da 🎙️'); }catch(e){ showToast(e.name==='NotAllowedError'?'Mic Block da! 🔒 Lock la Allow Pannu da':'Mic Error: '+e.message) }
}
async function stopVoice(){
  clearInterval(vTimer); document.getElementById('voiceBar').style.display='none';
  mediaRec.onstop=async()=>{ let blob=new Blob(vChunks,{type:'audio/webm'}); let fileName=Date.now()+'_'+ME+'_voice.webm'; await supa.storage.from('dms').upload(fileName,blob); let {data}=supa.storage.from('dms').getPublicUrl(fileName); await supa.from('messages').insert({chat_id:chatId,sender:ME,receiver:OTHER,text:'🎙️ Voice',message:'🎙️ Voice',sender_id:ME_ID,receiver_id:OTHER_ID,seen:false,type:'voice',media_url:data.publicUrl,media_type:'voice'}); showToast('Voice Sent da 🎙️'); load(); };
  mediaRec.stop();
}
async function startCall(isVideo){
  document.getElementById('callBox').style.display='flex'; document.getElementById('callName').innerText='@'+OTHER; document.getElementById('callStatus').innerText=isVideo?'Video Calling...':'Audio Calling...';
  peer=new Peer(ME);
  peer.on('open', async()=>{
    stream=await navigator.mediaDevices.getUserMedia({audio:true,video:isVideo});
    document.getElementById('localV').srcObject=stream;
    if(!isVideo) document.getElementById('localV').style.display='none'; else document.getElementById('localV').style.display='block';
    callObj=peer.call(OTHER, stream); callObj.on('stream', s=>{ document.getElementById('remoteV').srcObject=s; document.getElementById('callStatus').innerText='Connected ✅'; });
  });
  peer.on('call', async c=>{ stream=await navigator.mediaDevices.getUserMedia({audio:true,video:isVideo}); document.getElementById('localV').srcObject=stream; c.answer(stream); c.on('stream', s=>{ document.getElementById('remoteV').srcObject=s; }); callObj=c; });
}
function toggleMic(){ micOn=!micOn; stream.getAudioTracks()[0].enabled=micOn; document.getElementById('micBtn').innerText=micOn?'🎙️':'🔇'; }
function toggleCam(){ camOn=!camOn; stream.getVideoTracks()[0].enabled=camOn; document.getElementById('camBtn').innerText=camOn?'📸':'📷'; }
function endCall(){ if(callObj) callObj.close(); if(peer) peer.destroy(); if(stream) stream.getTracks().forEach(t=>t.stop()); document.getElementById('callBox').style.display='none'; }
init()
</script></body></html>
