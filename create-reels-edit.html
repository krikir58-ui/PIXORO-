<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Reels - Pixoro</title><link rel="stylesheet" href="css/pixoro-style.css"></head><body>
<div class="top"><b onclick="history.back()">←</b><b>Edit Reels</b><b style="color:#ff5ea8" onclick="location.href='./create-reels-upload.html'">Next</b></div>
<div class="preview"><video id="eVid" autoplay loop muted playsinline></video></div>
<div class="filters"><button onclick="setF('none',this)" class="on">Normal</button><button onclick="setF('grayscale(1)',this)">Black</button><button onclick="setF('sepia(0.8)',this)">Sepia</button><button onclick="setF('contrast(1.4) saturate(1.6)',this)">Vivid</button></div>
<button class="share" onclick="location.href='./create-reels-upload.html'">Next →</button>
<script>let v=document.getElementById('eVid');v.src=localStorage.getItem('pixoro_temp_reel')||'https://cdn.pixabay.com/video/2020/05/25/40130-424930032_large.mp4';function setF(f,btn){v.style.filter=f;localStorage.setItem('pixoro_temp_reel_filter',f);document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}</script>
</body></html>
