<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Reel - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
/* ✅ IMAGE LA - BLOCK WHITE VENUM DA - WRAP - WHITE DA */
.wrap{position:relative;height:calc(100vh - 140px);overflow:hidden;background:#fff;display:grid;place-items:center}
.wrap img,.wrap video{width:100%;height:100%;object-fit:cover;background:#fff}
.wrap .empty{font-size:50px;text-align:center;color:#000}
.wrap .empty small{display:block;font-size:12px;color:#888;margin-top:6px}
.close{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.5);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;z-index:5;color:#fff}
.swipe{position:absolute;bottom:90px;left:0;right:0;text-align:center;opacity:.9;color:#fff;text-shadow:0 2px 8px #000;z-index:3}
.tools{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-around;padding:0 10px;z-index:4}
.tools div{background:rgba(0,0,0,.6);padding:10px 14px;border-radius:14px;text-align:center;font-size:12px;cursor:pointer}
.tools div b{display:block;font-size:22px}
/* ✅ BG TOGGLE - WHITE BLOCK / BG REMOVE DA */
.bgRow{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#000}
.bgRow button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.bgRow button.on{background:#fff;color:#000}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#000}
.filters button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.filters button.on{background:#fff;color:#000}
.bottom{display:flex;justify-content:space-between;padding:12px;background:#000}
.bottom button{border:0;padding:14px 22px;border-radius:30px;font-weight:800;cursor:pointer}
.next{background:#4d7cff;color:#fff}
</style>
</head>
<body>
<div class="wrap" id="wrapBox">
  <div class="close" onclick="history.back()">✕</div>
  <img id="media" src="" style="display:none">
  <video id="vid" autoplay loop muted playsinline style="display:none"></video>
  <div class="empty" id="emptyBox" style="display:none">📷<small>Photo Illa da<br>Back Poyi Select Pannu da</small></div>
  <div id="textOverlay" style="position:absolute;top:40%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none;z-index:5"></div>
  <div class="swipe">^<br>Swipe up to edit</div>
  <div class="tools">
    <div onclick="addAudio()"><b>🎵</b>Audio</div>
    <div onclick="addText()"><b>Aa</b>Text</div>
    <div onclick="addVoice()"><b>🎤</b>Voice</div>
    <div onclick="addCaption()"><b>CC</b>Captions</div>
    <div onclick="addSticker()"><b>😊</b>Stickers</div>
  </div>
</div>

<!-- ✅ WHITE BLOCK + BG REMOVE - ITHU THAAN DA GIRI -->
<div class="bgRow">
  <button class="on" onclick="setBg('white',this)">⬜ White Block</button>
  <button onclick="setBg('black',this)">⬛ Black Block</button>
  <button onclick="setBg('transparent',this)">🔲 BG Remove</button>
  <button onclick="setBg('blur',this)">🌀 Blur BG</button>
</div>

<div class="filters">
  <button onclick="setF('none',this)" class="on">Original</button>
  <button onclick="setF('grayscale(1)',this)">B&W</button>
  <button onclick="setF('sepia(.8)',this)">Sepia</button>
  <button onclick="setF('contrast(1.4) saturate(1.6)',this)">Vivid</button>
  <button onclick="setF('brightness(1.2)',this)">Fade</button>
  <button onclick="setF('contrast(1.2) brightness(1.1) saturate(1.3)',this)">Mass</button>
</div>

<div class="bottom"><button onclick="history.back()" style="background:#222;color:#fff">Edit video</button><button class="next" onclick="location.href='./create-reels-upload.html'">Next →</button></div>

<script>
// ✅ PICSUM ILLA DA - UN PHOTO MATTUM DA
let url = localStorage.getItem('pixoro_reel_media') || '';
let type = localStorage.getItem('pixoro_reel_type') || 'image';
let img = document.getElementById('media'), vid = document.getElementById('vid');

if(!url || url.startsWith('blob:') || url.includes('picsum')){
  alert('Photo Load Aagala da - Thirumba Select Pannu da');
  location.href = './create-reels.html';
} else if(type === 'video'){
  img.style.display = 'none';
  vid.style.display = 'block';
  vid.src = url;
} else {
  img.src = url;
  img.style.display = 'block';
}

// ✅ BG - LAST PAGE LA - SELECT PANNA - ATHU THAAN - INGA VARUM DA
let savedBg = localStorage.getItem('pixoro_reel_bg') || 'white';
applyBg(savedBg);
document.querySelectorAll('.bgRow button').forEach(b => {
  if((savedBg==='white' && b.innerText.includes('White')) || (savedBg==='black' && b.innerText.includes('Black')) || (savedBg==='transparent' && b.innerText.includes('Remove'))) b.classList.add('on');
  else b.classList.remove('on');
});

function applyBg(mode){
  let wrap = document.getElementById('wrapBox');
  if(mode === 'white'){ wrap.style.background = '#fff'; img.style.background = '#fff'; vid.style.background = '#fff'; img.style.objectFit = 'contain'; vid.style.objectFit = 'contain'; }
  if(mode === 'black'){ wrap.style.background = '#000'; img.style.background = '#000'; vid.style.background = '#000'; img.style.objectFit = 'cover'; vid.style.objectFit = 'cover'; }
  if(mode === 'transparent'){ wrap.style.background = 'repeating-conic-gradient(#222 0% 25%, #000 0% 50%) 50% / 20px 20px'; img.style.background = 'transparent'; img.style.objectFit = 'contain'; }
  if(mode === 'blur'){ wrap.style.background = '#000'; img.style.objectFit = 'cover'; }
}

function setBg(mode, btn){
  document.querySelectorAll('.bgRow button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  localStorage.setItem('pixoro_reel_bg', mode);
  applyBg(mode);
  if(mode === 'transparent') alert('BG Remove On da ✨ - White Block Remove Aachu da - Photo Mattum Theriyum da');
}

function setF(f, btn){
  img.style.filter = f; vid.style.filter = f;
  localStorage.setItem('pixoro_reel_filter', f);
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
function addText(){ let t=prompt('Text ezhuthu da:'); if(!t) return; let o=document.getElementById('textOverlay'); o.innerText=t; o.style.display='block'; localStorage.setItem('pixoro_reel_text', t); }
function addAudio(){ let a=prompt('Audio name? Original Audio / Trending Song'); if(a) localStorage.setItem('pixoro_reel_audio', a); alert('Audio Add Aachu da: ' + (a||'Original Audio')); }
function addVoice(){ alert('Voice Over - Record Pannu da 🎤 - Next Version la Varum da'); }
function addCaption(){ let c=prompt('Captions ezhuthu da:'); if(c) localStorage.setItem('pixoro_reel_caption_text', c); }
function addSticker(){ let s=prompt('Sticker - 😍 🔥 ❤️ - Edhu Venum da?'); if(s){ let o=document.getElementById('textOverlay'); o.innerText += ' ' + s; o.style.display='block'; } }
</script>
</body>
</html>
