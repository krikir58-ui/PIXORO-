<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Reel - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}.wrap{position:relative;height:calc(100vh - 90px);overflow:hidden;background:#111}.wrap img,.wrap video{width:100%;height:100%;object-fit:cover}.close{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.5);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;z-index:5}.swipe{position:absolute;bottom:90px;left:0;right:0;text-align:center;opacity:.9}.tools{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-around;padding:0 10px}.tools div{background:rgba(0,0,0,.6);padding:10px 14px;border-radius:14px;text-align:center;font-size:12px}.tools div b{display:block;font-size:22px}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px}.filters button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}.filters button.on{background:#fff;color:#000}.bottom{display:flex;justify-content:space-between;padding:12px}.bottom button{border:0;padding:14px 22px;border-radius:30px;font-weight:800}.next{background:#4d7cff;color:#fff}</style></head><body>
<div class="wrap">
<div class="close" onclick="history.back()">✕</div>
<img id="media" src="">
<video id="vid" autoplay loop muted playsinline style="display:none"></video>
<div id="textOverlay" style="position:absolute;top:40%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 10px #000;display:none"></div>
<div class="swipe">^<br>Swipe up to edit</div>
<div class="tools">
<div onclick="addAudio()"><b>🎵</b>Audio</div>
<div onclick="addText()"><b>Aa</b>Text</div>
<div onclick="addVoice()"><b>🎤</b>Voice</div>
<div onclick="addCaption()"><b>CC</b>Captions</div>
<div onclick="addSticker()"><b>😊</b>Stickers</div>
</div>
</div>
<div class="filters"><button onclick="setF('none',this)" class="on">Original</button><button onclick="setF('grayscale(1)',this)">B&W</button><button onclick="setF('sepia(.8)',this)">Sepia</button><button onclick="setF('contrast(1.4) saturate(1.6)',this)">Vivid</button><button onclick="setF('brightness(1.2)',this)">Fade</button></div>
<div class="bottom"><button onclick="history.back()" style="background:#222;color:#fff">Edit video</button><button class="next" onclick="location.href='./create-reels-upload.html'">Next →</button></div>
<script>let url=localStorage.getItem('pixoro_reel_media')||'https://picsum.photos/400/700?random=10';let type=localStorage.getItem('pixoro_reel_type')||'image';let img=document.getElementById('media'),vid=document.getElementById('vid');if(type==='video'){img.style.display='none';vid.style.display='block';vid.src=url;}else{img.src=url;}function setF(f,btn){img.style.filter=f;vid.style.filter=f;localStorage.setItem('pixoro_reel_filter',f);document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}function addText(){let t=prompt('Text ezhuthu da:');if(!t)return;let o=document.getElementById('textOverlay');o.innerText=t;o.style.display='block';localStorage.setItem('pixoro_reel_text',t);}function addAudio(){let a=prompt('Audio name? Original Audio / Trending Song');if(a)localStorage.setItem('pixoro_reel_audio',a);alert('Audio Add Aachu da: '+(a||'Original Audio'));}function addVoice(){alert('Voice Over - Record Pannu da 🎤 - Next Version la Varum da');}function addCaption(){let c=prompt('Captions ezhuthu da:');if(c)localStorage.setItem('pixoro_reel_caption_text',c);}function addSticker(){let s=prompt('Sticker - 😍 🔥 ❤️ - Edhu Venum da?');if(s){let o=document.getElementById('textOverlay');o.innerText+= ' '+s;o.style.display='block';}}</script>
</body></html>
