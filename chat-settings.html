<!DOCTYPE html>
<html>
<head>
  <title>Pixoro - Chat Safety</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/chat-settings.css">
</head>
<body>
  <div class="chat-settings-page">
    <h2>🛡️ Chat settings - Pixoro</h2>
    <p>Your conversations, protected & private</p>

    <h3>Safety</h3>
    <div class="setting-item">
      <span>✅ Safety Check<br><small>Suspicious message ku alert</small></span>
      <label class="switch"><input type="checkbox" id="safetyCheck" checked><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <span>🚫 Filter Offensive Language</span>
      <label class="switch"><input type="checkbox" id="filterOffensive" checked><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <span>👁️ Blur Sensitive Photos</span>
      <label class="switch"><input type="checkbox" id="blurSensitive"><span class="slider"></span></label>
    </div>

    <h3>Privacy Controls</h3>
    <div class="setting-item">
      <span>👁️ Read Receipts</span>
      <label class="switch"><input type="checkbox" id="readReceipts" checked><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <span>🟢 Show Online Status</span>
      <label class="switch"><input type="checkbox" id="showOnlineStatus"><span class="slider"></span></label>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/chat-settings.js"></script>
</body>
</html>
