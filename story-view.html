<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Story - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;height:100vh;overflow:hidden;font-family:sans-serif}
.bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:10}
.b{height:3px;background:rgba(255,255,255,.3);flex:1;border-radius:2px;overflow:hidden}
.b div{height:100%;background:#fff;width:0%;transition:width.1s}
.top{position:absolute;top:20px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.user{display:flex;align-items:center;gap:8px}
.user img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.user b{font-size:14px}
.close{font-size:22px;cursor:pointer;padding:8px}
.view{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
.view img,.view video{width:100%;height:100%;object-fit:contain;background:#000}
.tap{position:absolute;top:60px;bottom:130px;width:50%;z-index:5}
.left{left:0}.right{right:0}
.bottomBar{position:absolute;bottom:15px;left:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:8px}
.deleteBtn{background:rgba(255,0,0,.85);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;display:none}
.audBadge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.audBadge.close{background:#00ff66;color:#000}
.audBadge.public{background:rgba(255,255,255,.2);color:#fff}
.menu{position:absolute;top:60px;right:10px;background:#111;border-radius:12px;padding:8px;z-index:20;display:none;min-width:180px}
.menu div{padding:10px 12px;font-size:14px;cursor:pointer;border-radius:8px}
.menu div:hover{background:#222}
.viewerBar{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:20px 20px 0 0;max-height:45vh;z-index:15;transform:translateY(100%);transition:.3s;overflow:hidden;display:flex;flex-direction:column}
.viewerBar.open{transform:translateY(0)}
.replyArea{display:flex;gap:8px;align-items:center;margin-top:2px}
.replyArea input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:12px 16px;border-radius:25px;color:#fff;outline:none}
.emojiRow{display:flex;gap:12px;overflow-x:auto;padding:4px 0}.emojiRow span{font-size:24px;cursor:pointer}.emojiRow::-webkit-scrollbar{display:none}
.captionBox{position:absolute;bottom:130px;left:12px;right:12px;z-index:8;font-size:14px;text-shadow:0 1px 6px #000;pointer-events:none}
.hlSheet{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:20px 20px 0 0;padding:16px;z-index:30;display:none}
.hlSheet button{width:100%;background:#222;color:#fff;border:0;padding:12px;margin-top:8px;border-radius:12px;text-align:left}
.hlSheet input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;outline:none}
</style></head><body>
<div class="bar" id="pBar"></div>
<div class="top"><div class="user"><img id="uPic" src=""><b id="uName"></b><span id="time" style="font-size:12px;color:#aaa"></span><span id="audLabel"></span></div><div style="display:flex;gap:10px;align-items:center"><i class="fa fa-ellipsis-h" id="moreBtn" onclick="toggleMenu()" style="display:none;cursor:pointer"></i><span class="close" onclick="goHome()">✕</span></div></div>
<div class="menu" id="menu"><div onclick="deleteCurrent()"><i class="fa fa-trash" style="color:#f44"></i> Delete Story</div><div onclick="openHighlight()"><i class="fa fa-star" style="color:#ffcc00"></i> Add to Highlight</div><div onclick="saveStory()"><i class="fa fa-download"></i> Save to Gallery</div><div onclick="toggleMenu()"><i class="fa fa-times"></i> Cancel</div></div>
<div class="view" id="view"></div>
<div class="captionBox" id="captionBox"></div>
<div class="tap left" onclick="prev()"></div><div class="tap right" onclick="next()"></div>
<div class="bottomBar"><div style="display:flex;justify-content:space-between;align-items:center"><span id="delBottom" class="deleteBtn" onclick="deleteCurrent()">🗑️ Delete</span><span id="viewEye" onclick="openViewers()" style="background:rgba(255,255,255,.15);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px"><i class="fa fa-eye"></i> <span id="viewCount">0</span> Views</span></div><div id="replySection" style="display:none"><div class="emojiRow"><span onclick="react('❤️')">❤️</span><span onclick="react('🔥')">🔥</span><span onclick="react('😂')">😂</span><span onclick="react('😍')">😍</span><span onclick="react('👏')">👏</span><span onclick="react('💚')">💚</span><span onclick="react('💯')">💯</span></div><div class="replyArea"><input id="replyInput" placeholder="Reply to story..."><span onclick="sendReply()" style="background:#fff;color:#000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer"><i class="fa fa-paper-plane"></i></span></div></div><span id="replyHint" style="font-size:12px;color:#888">Tap left/right to navigate</span></div>
<div class="viewerBar" id="viewerBar"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:10px auto"></div><div style="padding:0 15px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222"><b style="font-size:14px">👁️ Viewed by <span id="vCount2">0</span> people</b><span onclick="closeViewers()" style="font-size:20px;cursor:pointer">✕</span></div><div id="viewerList" style="overflow-y:auto;padding:10px 15px;flex:1"></div></div>

<div class="hlSheet" id="hlSheet"><b>⭐ Add to Highlight</b><div id="hlList" style="margin:10px 0"></div><input id="hlName" placeholder="New Highlight name - Ex: Travel, Fav"><button onclick="createHighlight()" style="background:#fff;color:#000;font-weight:800;text-align:center">+ Create Highlight</button><button onclick="closeHighlight()" style="text-align:center">Cancel</button></div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME = localStorage.getItem('pixoro_current_user') || 'Giri'
const user = new URLSearchParams(location.search).get('user')
document.getElementById('uName').innerText=user || 'Unknown'
document.getElementById('uPic').src=`https://i.pravatar.cc/100?u=${user}`
let stories=[], cur=0, timer=null, prog=0
let viewedStories=JSON.parse(localStorage.getItem('pixoro_viewed_stories')||'[]')
function safeTime(ts){ if(!ts) return 'Just now'; let d=new Date(ts); if(isNaN(d.getTime())) return 'Just now'; return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) }
async function load(){
 if(!user){ document.getElementById('view').innerHTML='<p>No user</p>'; return }
 let now = new Date()
 let localStories = JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]').filter(s=> s.username && s.username.toLowerCase()===user.toLowerCase() && new Date(s.expires_at) > now)
 let {data, error}=await supa.from('stories').select('*').ilike('username',user).gt('expires_at', new Date().toISOString()).order('created_at',{ascending:true})
 let supaStories = data||[]
 stories=[...localStories,...supaStories]
 if(stories.length==0){ document.getElementById('view').innerHTML=`<div style="text-align:center;padding:100px 20px"><p style="font-size:20px">😴</p><p style="margin-top:10px">No active story for @${user}</p><p style="color:#666;font-size:12px;margin-top:8px">Story 24hrs ku aprom expire aayidum da!</p><br><a href="./index.html" style="background:#fff;color:#000;padding:10px 22px;border-radius:20px;text-decoration:none;font-weight:900">Go Home</a></div>`; return }
 let bar=document.getElementById('pBar'); bar.innerHTML=stories.map((_,i)=>`<div class="b"><div id="b${i}"></div></div>`).join('')
 show(0)
 if(user.toLowerCase()===ME.toLowerCase()){ document.getElementById('delBottom').style.display='block'; document.getElementById('moreBtn').style.display='block'; document.getElementById('replyHint').innerText='Your story • Eye click panni viewers paaru 👁️'; document.getElementById('replySection').style.display='none' } else { document.getElementById('replySection').style.display='block'; document.getElementById('viewEye').style.display='none'; document.getElementById('delBottom').style.display='none'; document.getElementById('moreBtn').style.display='none'; document.getElementById('replyHint').style.display='none' }
 addViewer(); loadViewers(); markAsViewed(stories[0].id)
}
function markAsViewed(id){ if(!viewedStories.includes(id)){ viewedStories.push(id); localStorage.setItem('pixoro_viewed_stories',JSON.stringify(viewedStories)) } }
function goHome(){ location.href='./index.html' }
function show(i){
 cur=i; if(cur<0) cur=0; if(cur>=stories.length){ goHome(); return }
 let s=stories[cur]; markAsViewed(s.id)
 let imgUrl = s.image_url || s.media_url || s.image
 let view=document.getElementById('view')
 let filt = s.filter || 'none'
 if((s.media_type||'image')==='video'){ view.innerHTML=`<video src="${imgUrl}" autoplay playsinline style="width:100%;height:100%;object-fit:contain;filter:${filt}"></video>` } else { view.innerHTML=`<img src="${imgUrl}" style="width:100%;height:100%;object-fit:contain;background:#000;filter:${filt}">` }
 document.getElementById('time').innerText=' • '+safeTime(s.created_at)
 document.getElementById('captionBox').innerText = s.caption || ''
 let aud = s.audience||'everyone'
 document.getElementById('audLabel').innerHTML = (aud==='close_friends' || s.is_close_friends)? '<span class="audBadge close">💚 Close</span>' : '<span class="audBadge public">🌍</span>'
 prog=0; clearInterval(timer)
 timer=setInterval(()=>{ prog+=1; let bEl=document.getElementById(`b${cur}`); if(bEl) bEl.style.width=prog+'%'; if(prog>=100){ clearInterval(timer); next() } },50)
 for(let j=0;j<stories.length;j++){ let el=document.getElementById(`b${j}`); if(el){ if(j<cur) el.style.width='100%'; if(j>cur) el.style.width='0%' } }
}
function next(){ if(cur < stories.length-1) show(cur+1); else goHome() }
function prev(){ if(cur>0) show(cur-1); else show(0) }
function toggleMenu(){ let m=document.getElementById('menu'); m.style.display = m.style.display==='block'?'none':'block' }
async function deleteCurrent(){
 if(!confirm('Delete panava da Giri? 🗑️')) return
 let s=stories[cur]
 if(s.username.toLowerCase()!==ME.toLowerCase()){ alert('Un story mattum delete pannalam da!'); return }
 clearInterval(timer)
 if(s.id.toString().startsWith('local_')){ let allLocal = JSON.parse(localStorage.getItem('pixoro_local_stories')||'[]'); allLocal = allLocal.filter(x=> x.id!== s.id); localStorage.setItem('pixoro_local_stories', JSON.stringify(allLocal)) } else { let {error} = await supa.from('stories').delete().eq('id', s.id); if(error){ alert('Error: '+error.message); return } }
 stories.splice(cur,1)
 if(stories.length===0){ alert('Deleted! ✅'); goHome(); return }
 if(cur>=stories.length) cur=stories.length-1
 let bar=document.getElementById('pBar'); bar.innerHTML=stories.map((_,i)=>`<div class="b"><div id="b${i}"></div></div>`).join('')
 show(cur); document.getElementById('menu').style.display='none'
}
function saveStory(){ let s=stories[cur]; let link=s.image_url||s.media_url||s.image; let a=document.createElement('a'); a.href=link; a.target='_blank'; a.download=`pixoro-story-${Date.now()}.jpg`; fetch(link).then(r=>r.blob()).then(b=>{ let url=URL.createObjectURL(b); a.href=url; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000) }).catch(()=>{ window.open(link,'_blank') }) }

// === HIGHLIGHT FEATURE - NEW ===
function openHighlight(){
  toggleMenu(); clearInterval(timer);
  let hls = JSON.parse(localStorage.getItem('pixoro_highlights')||'[]');
  let list = document.getElementById('hlList');
  if(hls.length==0){ list.innerHTML='<p style="color:#888;font-size:13px">Innum Highlight illa da - Pudusa create pannu da</p>' }
  else{ list.innerHTML = hls.map((h,i)=>`<button onclick="addToExisting(${i})">⭐ ${h.name} - ${h.items.length} stories</button>`).join('') }
  document.getElementById('hlSheet').style.display='block';
}
function closeHighlight(){ document.getElementById('hlSheet').style.display='none'; prog=0; timer=setInterval(()=>{ prog+=1; let bEl=document.getElementById(`b${cur}`); if(bEl) bEl.style.width=prog+'%'; if(prog>=100){ clearInterval(timer); next() } },50) }
function createHighlight(){
  let name = document.getElementById('hlName').value.trim();
  if(!name){ alert('Name type pannu da!'); return }
  let s = stories[cur];
  let hls = JSON.parse(localStorage.getItem('pixoro_highlights')||'[]');
  hls.push({name:name, user: ME, items:[{img: s.image_url||s.media_url||s.image, caption: s.caption||'', created_at: s.created_at}]});
  localStorage.setItem('pixoro_highlights', JSON.stringify(hls));
  alert(name+' Highlight la save aayiduchu da ⭐');
  document.getElementById('hlName').value='';
  closeHighlight();
}
function addToExisting(i){
  let s = stories[cur];
  let hls = JSON.parse(localStorage.getItem('pixoro_highlights')||'[]');
  hls[i].items.push({img: s.image_url||s.media_url||s.image, caption: s.caption||'', created_at: s.created_at});
  localStorage.setItem('pixoro_highlights', JSON.stringify(hls));
  alert(hls[i].name+' la add aayiduchu da ⭐');
  closeHighlight();
}

async function addViewer(){ try{ let {data:exist}=await supa.from('story_views').select('*').eq('story_owner',user).eq('viewer',ME).limit(1); if(!exist || exist.length==0){ await supa.from('story_views').insert({story_owner:user, viewer:ME}) } loadViewers() }catch(e){} }
async function loadViewers(){ try{ let {data}=await supa.from('story_views').select('*').eq('story_owner',user).order('created_at',{ascending:false}); let count=data?data.length:0; document.getElementById('viewCount').innerText=count; document.getElementById('vCount2').innerText=count; let list=document.getElementById('viewerList'); if(!data || data.length==0){ list.innerHTML='<p style="text-align:center;color:#666;padding:20px">No views yet 👀</p>' } else { list.innerHTML=data.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1a1a1a"><div style="display:flex;align-items:center;gap:10px"><img src="https://i.pravatar.cc/100?u=${v.viewer}" style="width:36px;height:36px;border-radius:50%"><div><b style="font-size:13px">@${v.viewer}</b><div style="font-size:11px;color:#777">${safeTime(v.created_at)}</div></div></div><span style="color:#00ff66;font-size:12px">👁️</span></div>`).join('') } }catch(e){ document.getElementById('viewerList').innerHTML='<p style="color:#666;text-align:center">Supabase la story_views table create pannu da!</p>' } }
function openViewers(){ document.getElementById('viewerBar').classList.add('open'); clearInterval(timer) }
function closeViewers(){ document.getElementById('viewerBar').classList.remove('open'); prog=0; timer=setInterval(()=>{ prog+=1; let bEl=document.getElementById(`b${cur}`); if(bEl) bEl.style.width=prog+'%'; if(prog>=100){ clearInterval(timer); next() } },50) }
async function react(emoji){ try{ await supa.from('dms').insert({sender:ME,receiver:user,text:`Reacted ${emoji} to your story 🔥`,type:'story_react'}) }catch(e){} if(navigator.vibrate) navigator.vibrate(40); let el=document.createElement('div'); el.innerText=emoji; el.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:80px;z-index:100;pointer-events:none;animation:pop.8s forwards'; document.body.appendChild(el); let s=document.createElement('style'); s.innerHTML='@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}'; document.head.appendChild(s); setTimeout(()=>el.remove(),800) }
async function sendReply(){ let t=document.getElementById('replyInput').value.trim(); if(!t) return; try{ await supa.from('dms').insert({sender:ME,receiver:user,text:`Story Reply: ${t}`,type:'story_reply'}) }catch(e){} document.getElementById('replyInput').value=''; alert(`DM sent da! "${t}" → @${user}`) }
load()
</script>
</body></html>
