<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#000;color:#fff;font-family:sans-serif;max-width:400px;margin:auto;padding:20px;background:radial-gradient(circle at 50% 0%,#ff149333,transparent 60%),#000}input,textarea{width:100%;background:#111;border:1px solid #ff5ea866;padding:12px;border-radius:12px;color:#fff;margin:10px 0;box-sizing:border-box}button{background:linear-gradient(90deg,#ff5ea8,#a259ff,#ff7a00);border:0;color:#fff;padding:12px;width:100%;border-radius:25px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px #ff149344}.filterBar{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.fbtn{padding:6px 12px;background:#222;border:1px solid #333;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}.fbtn.active{border-color:#ff5ea8;background:linear-gradient(90deg,#ff5ea8,#ff7a00);color:#fff;font-weight:700} #preview{width:100%;height:400px;background:#111;border-radius:15px;object-fit:cover;display:none;margin:10px 0;border:2px solid #ff5ea8}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff5ea8,#ff7a00);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
#ringWrap{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;justify-content:center;align-items:center;flex-direction:column}
.ring{width:70px;height:70px;border:6px solid #222;border-top:6px solid #ff0066;border-right:6px solid #ff7a00;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2{background:linear-gradient(90deg,#ff5ea8,#a259ff,#ff7a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head><body>
<h2>📕 PIXORO Add Story</h2>
<input type="file" id="file" accept="image/*,video/*" onchange="preview(this)">
<img id="preview" />
<video id="previewVideo" style="width:100%;height:400px;background:#111;border-radius:15px;display:none;margin:10px 0;border:2px solid #ff5ea8" autoplay muted loop></video>
<div class="filterBar">
  <div class="fbtn active" onclick="setF('none',this)">Normal</div>
  <div class="fbtn" onclick="setF('grayscale(1)',this)">B&W</div>
  <div class="fbtn" onclick="setF('sepia(1)',this)">Sepia</div>
  <div class="fbtn" onclick="setF('contrast(1.5) saturate(1.5)',this)">Vivid</div>
  <div class="fbtn" onclick="setF('blur(0.5px) brightness(1.2)',this)">Soft</div>
</div>
<textarea id="caption" placeholder="Caption + Font + @Mention + Poll... type pannu da!"></textarea>
<div style="display:flex;gap:8px;margin:10px 0">
  <button onclick="addPoll()" style="background:#222;color:#fff;flex:1;border:1px solid #a259ff">📊 Poll</button>
  <button onclick="aiGen()" style="background:linear-gradient(90deg,#a259ff,#00d4ff);color:#fff;flex:1">🤖 AI Image</button>
</div>
<button onclick="up()">Share to Your Story ⭐</button>
<button onclick="upClose()" style="background:linear-gradient(90deg,#00ff66,#00d4ff);border:none;color:#000;margin-top:8px">Share to Close Friends 💚</button>
<p id="st" style="text-align:center;color:#aaa;margin-top:10px"></p>
<button onclick="location.href='index.html'" style="background:#222;color:#fff;margin-top:10px;box-shadow:none">Back</button>
<div id="toast" class="toast"></div>
<div id="ringWrap"><div class="ring"></div><p style="margin-top:15px;font-weight:700">Uploading Story... ⏳</p></div>
<script>
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500)}
const supa = supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME = localStorage.getItem('pixoro_current_user') || 'Giri'
let ME_ID = null
async function initUser(){
  let {data:{session}} = await supa.auth.getSession()
  if(session){
    ME_ID = session.user.id
    let {data:prof} = await supa.from('profiles').select('username').eq('id', ME_ID).single()
    if(prof && prof.username) ME = prof.username
  }
}
initUser()
let curFilter='none', mediaType='image', fileData=null
function preview(input){
  if(input.files && input.files[0]){
    let f=input.files[0]
    mediaType = f.type.startsWith('video')?'video':'image'
    let url=URL.createObjectURL(f)
    fileData=f
    window.aiImageUrl=null
    if(mediaType==='video'){
      document.getElementById('previewVideo').src=url
      document.getElementById('previewVideo').style.display='block'
      document.getElementById('preview').style.display='none'
    }else{
      document.getElementById('preview').src=url
      document.getElementById('preview').style.display='block'
      document.getElementById('previewVideo').style.display='none'
    }
  }
}
function setF(f, el){
  curFilter=f
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'))
  el.classList.add('active')
  document.getElementById('preview').style.filter=f
  document.getElementById('previewVideo').style.filter=f
}
function addPoll(){
  let cap=document.getElementById('caption');
  cap.value += `\n📊 POLL: Enna da? (Yes / No)`;
  showToast('Poll added da');
}
function aiGen(){
  let p=document.getElementById('caption').value.trim();
  if(!p){ showToast('Caption la prompt eluthu da'); return; }
  let aiUrl=`https://picsum.photos/seed/${encodeURIComponent(p)}/400/700`
  document.getElementById('preview').src=aiUrl
  document.getElementById('preview').style.display='block'
  document.getElementById('previewVideo').style.display='none'
  fileData=null
  window.aiImageUrl=aiUrl
  showToast('AI Image Ready da 🔥');
}
async function uploadFile(){
  if(window.aiImageUrl) return window.aiImageUrl
  let f=fileData
  if(!f) return null
  let name=Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'')
  let {error} = await supa.storage.from('stories').upload(name, f, {upsert:true})
  if(error){ showToast('Storage Error: '+error.message); return null }
  let {data}=supa.storage.from('stories').getPublicUrl(name)
  return data.publicUrl
}
async function up(){ share('public') }
async function upClose(){ share('close_friends') }
async function share(audience){
  let fileInput=document.getElementById('file')
  if(!fileInput.files[0] &&!window.aiImageUrl){ showToast('File select pannu da Giri!'); return; }
  document.getElementById('ringWrap').style.display='flex'
  document.getElementById('st').innerText='Uploading... ⏳'
  if(!ME_ID){ await initUser() }
  let mediaUrl = await uploadFile()
  if(!mediaUrl){ document.getElementById('ringWrap').style.display='none'; return }
  let {error}=await supa.from('stories').insert({
    user_id: ME_ID, username: ME, media_url: mediaUrl, media_type: mediaType, caption: document.getElementById('caption').value, filter: curFilter, audience: audience, stickers: [], expires_at: new Date(Date.now()+24*60*60*1000).toISOString()
  })
  document.getElementById('ringWrap').style.display='none'
  if(error){ showToast('DB Error: '+error.message); document.getElementById('st').innerText='DB Error: '+error.message; return }
  showToast(audience==='close_friends'?'💚 Close Friends ku poyiduchu!':'✅ Story Added da Giri!');
  setTimeout(()=>location.href='index.html',1000)
}
</script></body></html>
