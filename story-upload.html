<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Add Pannu - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.pTop{display:flex;align-items:center;justify-content:space-between;padding:14px}
.pTop b{font-size:22px;background:linear-gradient(90deg,#ff5ea8,#a259ff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pTop span{font-size:28px;cursor:pointer}
.pTop .cam{font-size:28px}
.tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto}
.tabs button{padding:10px 18px;border:0;border-radius:25px;background:#1a1a1a;color:#fff;font-weight:800;white-space:nowrap}
.tabs button.on{background:linear-gradient(90deg,#a259ff,#ff2dcc)}
.recHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.recHead b{font-size:16px;background:#1a1a1a;padding:8px 12px;border-radius:20px}
.recHead button{background:#1a1a1a;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:800}
.pickBtn{margin:0 14px 10px;background:linear-gradient(90deg,#ff5ea8,#a259ff,#ff7a00);border:0;color:#fff;padding:14px;width:calc(100% - 28px);border-radius:25px;font-weight:900;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:4px;padding-bottom:80px;background:#000}
.g{aspect-ratio:1/1;background:#111 !important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:34px;cursor:pointer;overflow:hidden;border-radius:10px;color:#fff}
.g small{font-size:13px;color:#aaa}
.g img{width:100%;height:100%;object-fit:cover;display:block;background:#111 !important;border-radius:10px}
.bottomTabs{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;background:#000;border-top:1px solid #222;display:flex;justify-content:center;gap:28px;padding:14px;z-index:10}
.bottomTabs button{background:transparent;border:0;color:#888;font-weight:800;font-size:14px;letter-spacing:1px;padding-bottom:6px}
.bottomTabs button.on{color:#fff;border-bottom:3px solid #ff2dcc}
</style></head><body>
<div class="pTop"><span onclick="location.href='./index.html'">✕</span><b>PIXORO - New Story</b><span class="cam">📷</span></div>
<div class="tabs"><button class="on">✨ Edits</button><button>📝 Drafts</button><button>🎬 Templates</button></div>
<button class="pickBtn" onclick="document.getElementById('fileInp').click()">📷 Photo / Video Edu Da</button>
<input type="file" id="fileInp" accept="image/*,video/*" hidden>
<div class="recHead"><b>Recents ∨</b><button onclick="document.getElementById('fileInp').click()">☑ Select</button></div>
<div class="grid" id="grid">
<div class="g" onclick="location.href='./story-camera.html'">📷<small>Camera</small></div>
<div class="g" onclick="document.getElementById('fileInp').click()">🖼️<small>Gallery</small></div>
<div class="g" onclick="document.getElementById('fileInp').click()">🎬<small>Video</small></div>
</div>
<p style="text-align:center;color:#888;font-size:13px;padding:0 20px">Un Gallery la irunthu Photo select pannu da 📷<br>Select / Camera Click pannu da</p>
<div class="bottomTabs">
<button class="on" onclick="location.href='./story-upload.html'">STORY</button>
<button onclick="location.href='./post-create.html'">POST</button>
<button onclick="location.href='./reel-create.html'">REEL</button>
<button onclick="location.href='./live.html'">LIVE</button>
</div>
<script>
document.getElementById('fileInp').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=()=>{ sessionStorage.setItem('pixoro_story_data',r.result); sessionStorage.setItem('pixoro_story_type',f.type.startsWith('video')?'video':'image'); location.href='./story-editor.html'; }; r.readAsDataURL(f);
});
</script></body></html>
