<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Add Pannu - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.pTop{display:flex;align-items:center;padding:14px;gap:12px}
.pTop span{font-size:24px;cursor:pointer}
.pTop b{font-size:22px;background:linear-gradient(90deg,#ff5ea8,#a259ff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tools{display:flex;gap:10px;padding:10px 14px;overflow-x:auto}
.tool{min-width:105px;background:#1a1a1a;border-radius:14px;padding:10px;text-align:center}
.tool div{font-size:26px}.tool p{font-size:12px;font-weight:700;margin-top:4px}
.recHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.recHead b{font-size:20px}.recHead button{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px;padding-bottom:80px;background:#000}
.g{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;overflow:hidden;border-radius:4px;padding:2px}
.g img{width:100%;height:100%;object-fit:cover;display:block;background:#fff;border-radius:2px}
.pickBtn{margin:0 14px 10px;background:linear-gradient(90deg,#ff5ea8,#a259ff,#ff7a00);border:0;color:#fff;padding:14px;width:calc(100% - 28px);border-radius:25px;font-weight:900;font-size:15px}
.bottomTabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#222;border-radius:30px;padding:6px;display:flex;gap:4px}
.bottomTabs button{padding:10px 14px;border:0;border-radius:20px;background:transparent;color:#888;font-weight:800;letter-spacing:1px}
.bottomTabs button.on{background:#fff;color:#000}
</style></head><body>
<div class="pTop"><span onclick="location.href='./index.html'">✕</span><b>Story Add Pannu</b></div>
<div class="tools"><div class="tool"><div>🔄</div><p>Templates</p></div><div class="tool"><div>✨</div><p>Effects</p></div><div class="tool"><div>🎵</div><p>Music</p></div><div class="tool"><div>🖼️</div><p>Collage</p></div></div>
<button class="pickBtn" onclick="document.getElementById('fileInp').click()">📷 Photo / Video Edu Da</button>
<input type="file" id="fileInp" accept="image/*,video/*" hidden>
<div class="recHead"><b>Recents ⌄</b><button onclick="document.getElementById('fileInp').click()">Select</button></div>
<div class="grid" id="grid"><div class="g" onclick="location.href='./story-camera.html'">📷</div><div class="g" onclick="document.getElementById('fileInp').click()">🖼️</div><div class="g" onclick="document.getElementById('fileInp').click()">🎬</div></div>
<div class="bottomTabs"><button onclick="location.href='./post-create.html'">POST</button><button class="on">STORY</button><button>INSTANT</button><button onclick="location.href='./reel-create.html'">REEL</button></div>
<script>
document.getElementById('fileInp').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=()=>{ sessionStorage.setItem('pixoro_story_data',r.result); sessionStorage.setItem('pixoro_story_type',f.type.startsWith('video')?'video':'image'); location.href='./story-editor.html'; }; r.readAsDataURL(f);
});
</script></body></html>
