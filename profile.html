<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro</title>
<link rel="stylesheet" href="css/profile.css">
</head><body>
<div class="top"><b class="topName" id="topUsername"></b><div class="topRight"><span class="topIcon" onclick="openSettings()">☰</span></div></div>
<div style="padding:15px"><div style="display:flex;gap:18px;align-items:center"><div class="pfpBig" onclick="openEditSheet()"><div class="pfpBigInner"><img id="pfpImg" src="https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true" onerror="pfpErr(this,'')"></div></div>
<div class="stats">
<div onclick="pixoroOpenFollowList('posts')"><b id="postCount">0</b><span>Posts</span></div>
<div onclick="pixoroOpenFollowList('followers')"><b id="followerCount">0</b><span>Followers</span></div>
<div onclick="pixoroOpenFollowList('following')"><b id="followingCount">0</b><span>Following</span></div>
</div></div><div style="margin-top:14px"><div id="bioText" style="font-size:14px;margin-top:8px"></div><div id="linkText" style="font-size:13px;color:#fff;margin-top:6px"></div></div><div class="highlights" id="highlightList" style="display:none"></div><div style="display:flex;gap:8px;margin-top:12px" id="actionArea"><button class="btn btnPrimary" onclick="openEditSheet()">Edit Profile</button><button class="btn" onclick="shareProfile()">Share Profile</button></div><div id="blockedBanner" style="display:none;text-align:center;padding:20px;color:#888">This user is blocked da<br><button onclick="unblockUserMain()" style="margin-top:10px;background:transparent;border:1.2px solid #fff;color:#fff;padding:10px 20px;border-radius:20px">Unblock</button></div><div style="display:flex;border-top:1px solid #222;margin-top:18px"><div class="tab active" id="tabPosts" onclick="showTab('all')">⊞ Posts</div><div class="tab" id="tabReels" onclick="showTab('reels')">Reels</div><div class="tab" id="tabSaved" onclick="showTab('saved')">Saved</div></div><div id="myGrid" class="grid"></div></div>
<div id="pixoroMenu" class="pixoroMenu"></div>
<div id="followModal" class="followModal" onclick="if(event.target==this) this.classList.remove('show')"><div style="background:#111;width:100%;max-width:450px;border-radius:22px 22px 0 0;border:1px solid #333;max-height:70vh;overflow-y:auto;padding:10px 0 30px"><div id="followModalTitle" style="text-align:center;font-weight:900;padding:10px">Followers</div><div id="followModalList"></div></div></div>
<div id="hlEditSheet" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:flex-end;justify-content:center"><div style="background:#111;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px;border:1px solid #333"><div style="text-align:center;font-weight:900">⭐ Edit Highlight</div><div style="display:flex;gap:10px;margin:14px 0;overflow-x:auto" id="hlCoverPicker"></div><input id="hlEditName" placeholder="Highlight Name" style="width:100%;background:#222;border:1px solid #fff;color:#fff;padding:12px;border-radius:12px;outline:none"><button onclick="saveHighlightEdit()" class="whiteBtn" style="width:100%;margin-top:10px">Save Changes</button><button onclick="deleteHighlight()" style="width:100%;background:transparent;color:#ff3040;border:1.2px solid #ff3040;padding:12px;border-radius:12px;font-weight:800;margin-top:8px">🗑️ Delete Highlight</button><div onclick="document.getElementById('hlEditSheet').style.display='none'" style="text-align:center;padding:12px;color:#888">Cancel</div></div></div>
<input type="file" id="hlCoverInput" accept="image/*" style="display:none">
<div id="setSheet" class="setSheet"><div class="sheetBox"><div style="text-align:center;font-weight:900;padding-bottom:12px">Pixoro Settings ⚙️</div><div class="sItem" onclick="openEditSheet()"><span>👤 Edit Profile</span><span>›</span></div><div class="sItem" onclick="doPixoroLogout()" style="color:#ff3b30"><span>🚪 Log Out</span><span>›</span></div><div onclick="document.getElementById('setSheet').style.display='none'" style="margin:14px;background:#111;padding:12px;border-radius:12px;text-align:center;color:#888">Cancel</div></div></div>
<div id="editSheet" class="editSheet"><div class="sheetBox"><b style="display:block;text-align:center">Edit Profile</b><div style="text-align:center;margin:14px"><img id="editPfpPreview" src="https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true" style="width:90px;height:90px;border-radius:50%;border:2px solid #fff;object-fit:cover"><br><button onclick="document.getElementById('pfpInput').click()" style="margin-top:8px;background:transparent;border:1.2px solid #fff;color:#fff;padding:6px 14px;border-radius:20px">Change Photo</button><input type="file" id="pfpInput" accept="image/*" style="display:none"></div><div class="fieldBox"><span>Name</span><input id="editName"></div><div class="fieldBox"><span>Username</span><input id="editUsername"></div><div class="fieldBox"><span>Bio</span><textarea id="editBio" rows="2"></textarea></div><div class="fieldBox"><span>Link</span><input id="editLink"></div><button onclick="saveEdit()" style="width:100%;background:transparent;color:#fff;padding:12px;border-radius:20px;font-weight:700;margin-top:16px;border:1.2px solid #fff">Save - Server Sync</button><div onclick="document.getElementById('editSheet').style.display='none'" style="text-align:center;padding:12px;color:#888">Cancel</div></div></div>
<div id="cropOverlay" class="cropOverlay"><div style="padding:14px;display:flex;justify-content:space-between"><span onclick="closeCrop()" style="font-size:20px;cursor:pointer">✕</span><b>Adjust Profile Photo</b><span onclick="applyCrop()" style="color:#fff;font-weight:900;cursor:pointer">Done</span></div><div class="cropStage"><div class="cropCircle" id="cropCircle"><img id="cropImg"></div></div><div style="padding:18px"><input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1"><div style="display:flex;gap:8px;margin-top:14px"><button onclick="resetCrop()" style="flex:1;background:transparent;color:#fff;padding:12px;border-radius:12px;border:1.2px solid #fff">Reset</button><button onclick="applyCrop()" style="flex:2;background:transparent;color:#fff;padding:12px;border-radius:20px;font-weight:700;border:1.2px solid #fff">Crop & Save</button></div></div></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html" class="active"><img class="navPfp" id="navPfp" src="https://ui-avatars.com/api/?name=P&background=111&color=fff&size=200&bold=true" onerror="pfpErr(this,'')"><span>Profile</span></a></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/pixoro-core.js?v=1009"></script>
<script src="js/profile.js?v=1008"></script>
</body></html>
