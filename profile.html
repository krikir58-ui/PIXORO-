<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:80px}
.top{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#000;z-index:50}
.pfpBig{width:96px;height:96px;border-radius:50%;background:#222;padding:3px;cursor:pointer}
.pfpBig.hasStory{background:linear-gradient(135deg,#FF6A00,#FF0A33,#FFD600,#FF8A00);padding:3px;box-shadow:0 0 16px rgba(255,106,0,0.6)}
.pfpBigInner{width:100%;height:100%;border-radius:50%;background:#000;padding:3px;overflow:hidden}
.pfpBigInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.stats{display:flex;gap:25px;text-align:center}.stats div{cursor:pointer}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:10px}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}
.btn{border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;padding:10px 0;border-radius:12px;width:100%;font-weight:600;cursor:pointer}
.btnPrimary{background:#fff;color:#000;border:0;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:70px;background:#000;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;align-items:center;z-index:9999;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#777}
.bottom-nav a svg{width:28px;height:28px;fill:none;stroke:#777;stroke-width:1.6}
.bottom-nav a.active{color:#fff}
.bottom-nav a.active svg{stroke:#fff}
.bottom-nav a.active span{color:#fff;font-weight:700}
.bottom-nav span{font-size:11px;color:#777}
.tab{padding:12px 0;flex:1;text-align:center;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent}.tab.active{color:#fff;border-bottom:2px solid #fff}
.highlights{display:flex;gap:16px;margin:18px 0;overflow-x:auto;padding-bottom:8px}.highlights::-webkit-scrollbar{display:none}
.h-item{text-align:center;min-width:70px;cursor:pointer}.h-circle{width:68px;height:68px;border-radius:50%;background:#101010;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #333}
.h-text{font-size:11px;margin-top:6px;color:#fff;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:500;display:none;flex-direction:column}
.modalTop{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;background:#000}
.followRow{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #111}
.fBtn{border:1px solid #333;background:#222;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.fBtn.following{background:#fff;color:#000}
#storyViewer{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column}
.sProgress{height:3px;background:#333;display:flex;gap:3px;padding:3px}.sBar{flex:1;background:#555;border-radius:10px;overflow:hidden}.sBarFill{height:100%;background:#fff;width:0%}
.topPlus{width:34px;height:34px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;cursor:pointer}
</style></head><body>
<div class="top"><b style="font-size:22px;font-weight:900">Pixoro</b><div style="display:flex;gap:12px;align-items:center"><div class="topPlus" onclick="document.getElementById('createSheet').style.display='flex'">+</div><a href="notifications.html" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 9 6 9H0s6-2 6-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></a><span style="font-size:22px;cursor:pointer">☰</span></div></div>

<div style="padding:15px">
  <div style="display:flex;gap:20px;align-items:center">
    <div class="pfpBig" id="pfpRing" onclick="openProfileStory()"><div class="pfpBigInner"><img id="pfpImg" src="https://i.pravatar.cc/150?u=Giri"></div></div>
    <div class="stats">
      <div onclick="openFollowList('posts')"><b id="postCount">0</b><span>Posts</span></div>
      <div onclick="openFollowList('followers')"><b id="followerCount">0</b><span>Followers</span></div>
      <div onclick="openFollowList('following')"><b id="followingCount">0</b><span>Following</span></div>
    </div>
  </div>
  <div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:6px"><b id="displayName">Giri</b><span style="width:18px;height:18px;background:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px">✓</span></div>
    <div style="font-size:13px;color:#aaa">@<span id="usernameTag">giri_official</span></div>
    <div id="bioText" style="font-size:14px;margin-top:8px;line-height:20px;color:#fff"></div>
  </div>
  <div class="highlights" id="highlightList"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btnPrimary" onclick="openEdit()">Edit Profile</button><button class="btn" onclick="shareProfile()">Share Profile</button></div>
  <div style="display:flex;border-top:1px solid #222;margin-top:18px"><div class="tab active" id="tabPosts">⊞ Posts</div><div class="tab">🎬 Reels</div><div class="tab">🔖 Saved</div></div>
  <div id="myGrid" class="grid"></div>
</div>

<div id="followModal" class="modal"><div class="modalTop"><b id="followTitle">Followers</b><span onclick="closeFollow()" style="font-size:22px;cursor:pointer">✕</span></div><div id="followList" style="flex:1;overflow-y:auto"></div></div>

<div id="storyViewer"><div class="sProgress"><div class="sBar"><div class="sBarFill" id="sFill"></div></div></div>
<div style="padding:10px;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><img id="sPfp" src="" style="width:32px;height:32px;border-radius:50%"><b id="sName">Giri</b></div><span onclick="closeStory()" style="font-size:24px;cursor:pointer">✕</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center" onclick="closeStory()"><img id="sImg" src="" style="max-width:100%;max-height:80vh;object-fit:contain"></div>
</div>

<!-- BOTTOM NAV - UN 2ND PHOTO MARIYE EXACT DA - PROFILE ACTIVE DA -->
<div class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a>
  <a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a>
  <a href="profile.html" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg><span>Profile</span></a>
</div>

<div id="createSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center"><div style="background:#1a1a1a;width:100%;max-width:450px;border-radius:22px 22px 0 0;padding:18px 18px 28px;border:1px solid #333"><div style="width:40px;height:4px;background:#444;border-radius:10px;margin:0 auto 18px"></div><b style="display:block;text-align:center;margin-bottom:16px">Create New</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div onclick="location.href='upload.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">📸</div><div style="margin-top:6px;font-weight:700">Post</div></div>
<div onclick="location.href='reels-upload.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">🎞️</div><div style="margin-top:6px;font-weight:700">Reels</div></div>
<div onclick="location.href='story-add.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">⭕</div><div style="margin-top:6px;font-weight:700">Story</div></div>
<div onclick="location.href='live.html'" style="background:#000;border:1px solid #333;border-radius:16px;padding:18px;text-align:center"><div style="font-size:32px">🔴</div><div style="margin-top:6px;font-weight:700">Live</div></div>
</div><div onclick="document.getElementById('createSheet').style.display='none'" style="margin-top:16px;text-align:center;background:#000;padding:12px;border-radius:12px;color:#888;border:1px solid #333">Cancel</div></div></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME=localStorage.getItem('pixoro_current_user')||'Giri'
let myPosts=[], allFollows=[], currentStories=[], storyTimer=null
async function loadProfile(){
  let target=new URLSearchParams(location.search).get('u')||ME
  document.getElementById('displayName').textContent=target
  document.getElementById('usernameTag').textContent=target.toLowerCase()+'_official'
  let pfp=localStorage.getItem('pixoro_gilli_pfp_'+target)||`https://i.pravatar.cc/150?u=${target}`
  document.getElementById('pfpImg').src=pfp
  document.getElementById('sPfp').src=pfp
  document.getElementById('sName').textContent=target
  document.getElementById('bioText').innerText=localStorage.getItem('pixoro_bio_'+ME)||'🔥 Tiruchengode ➡️ World\n👨‍💻 Pixoro Founder'
  try{ let {data}=await supa.from('posts').select('*').eq('username',target).order('created_at',{ascending:false}); myPosts=data||[] }catch(e){ myPosts=[] }
  document.getElementById('postCount').textContent=myPosts.length
  document.getElementById('myGrid').innerHTML=myPosts.length?myPosts.map(p=>`<img src="${p.image_url}">`).join(''):`<div style="grid-column:1/4;text-align:center;padding:40px;color:#666">No posts yet</div>`
  try{ let {data}=await supa.from('follows').select('*'); allFollows=data||[] }catch(e){ allFollows=[] }
  let followers=allFollows.filter(f=>f.following==target)
  let following=allFollows.filter(f=>f.follower==target)
  document.getElementById('followerCount').textContent=followers.length
  document.getElementById('followingCount').textContent=following.length
  checkStoryRing(target); loadRealHighlights()
}
async function checkStoryRing(target){
  let ring=document.getElementById('pfpRing')
  try{ let {data}=await supa.from('stories').select('*').eq('username',target).gt('expires_at',new Date().toISOString()); currentStories=data||[]; if(currentStories.length>0) ring.classList.add('hasStory'); else ring.classList.remove('hasStory') }catch(e){ ring.classList.remove('hasStory') }
}
function openProfileStory(){ if(!currentStories.length){ if(confirm('Story illa da! Add pannava?')) location.href='upload.html'; return } document.getElementById('sImg').src=currentStories[0].image_url||currentStories[0].image; document.getElementById('storyViewer').style.display='flex'; let fill=document.getElementById('sFill'); fill.style.width='0%'; let w=0; clearInterval(storyTimer); storyTimer=setInterval(()=>{ w+=1; fill.style.width=w+'%'; if(w>=100) closeStory() },40) }
function closeStory(){ document.getElementById('storyViewer').style.display='none'; clearInterval(storyTimer) }
function openFollowList(type){
  let target=new URLSearchParams(location.search).get('u')||ME
  let modal=document.getElementById('followModal'); let title=document.getElementById('followTitle'); let list=document.getElementById('followList'); modal.style.display='flex'
  if(type==='posts'){ title.textContent='Posts'; list.innerHTML=`<div style="padding:20px;text-align:center;color:#777">${myPosts.length} real posts</div>`; return }
  let users= type==='followers'? allFollows.filter(f=>f.following==target).map(f=>f.follower) : allFollows.filter(f=>f.follower==target).map(f=>f.following)
  title.textContent= type==='followers'? 'Followers' : 'Following'
  if(!users.length){ list.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#666"><div style="font-size:40px">👤</div><b style="color:#fff">No ${type} yet</b><p style="font-size:12px;margin-top:8px">Real ${type} thaan varum da</p></div>`; return }
  list.innerHTML=users.map(u=>{ let isFollow=allFollows.some(f=>f.follower==ME&&f.following==u); return `<div class="followRow"><div style="display:flex;align-items:center;gap:10px"><img src="https://i.pravatar.cc/100?u=${u}" style="width:44px;height:44px;border-radius:50%"><div><b>@${u}</b><div style="font-size:11px;color:#666">Real user</div></div></div><button class="fBtn ${isFollow?'following':''}" onclick="toggleFollow('${u}',this)">${isFollow?'Following':'Follow'}</button></div>` }).join('')
}
function closeFollow(){ document.getElementById('followModal').style.display='none' }
async function toggleFollow(u,btn){ let isFollow=allFollows.some(f=>f.follower==ME&&f.following==u); try{ if(isFollow){ await supa.from('follows').delete().eq('follower',ME).eq('following',u); allFollows=allFollows.filter(f=>!(f.follower==ME&&f.following==u)); btn.textContent='Follow'; btn.classList.remove('following') } else { await supa.from('follows').insert({follower:ME,following:u}); allFollows.push({follower:ME,following:u}); btn.textContent='Following'; btn.classList.add('following') } }catch(e){ alert('follows table check pannu da!') } loadProfile() }
function loadRealHighlights(){ let container=document.getElementById('highlightList'); let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]'); let html=saved.map((h,i)=>`<div class="h-item" onclick="openHighlight(${i})"><div class="h-circle">${h.emoji}</div><div class="h-text">${h.title}</div></div>`).join(''); html+=`<div class="h-item" onclick="addHighlight()"><div class="h-circle" style="border:2px dashed #555">➕</div><div class="h-text">New</div></div>`; container.innerHTML=html }
function addHighlight(){ let emoji=prompt('Emoji podu da:'); if(!emoji) return; let title=prompt('Title podu da:'); if(!title) return; let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]'); saved.push({emoji,title}); localStorage.setItem('pixoro_highlights_'+ME,JSON.stringify(saved)); loadRealHighlights() }
function openHighlight(i){ let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]'); if(confirm(`Delete ${saved[i].title}?`)){ saved.splice(i,1); localStorage.setItem('pixoro_highlights_'+ME,JSON.stringify(saved)); loadRealHighlights() } }
function openEdit(){ let b=prompt('Bio podu da:'); if(b){ localStorage.setItem('pixoro_bio_'+ME,b); document.getElementById('bioText').innerText=b } }
function shareProfile(){ navigator.clipboard.writeText(location.href); alert('Copied da!') }
loadProfile()
</script></body></html>
