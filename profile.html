<script src="js/profile.js?v=1009"></script>
<script>
// ===== CORRECTED SERVER-ONLY PROFILE SAVE - NO localStorage - v1009 OREY PHOTO DA =====
let pixoroSelectedPfpFile = null;
let pixoroCropFile = null;

// Photo select pannum pothu crop overlay kaamikka
document.getElementById('pfpInput')?.addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  pixoroCropFile = f;
  const url = URL.createObjectURL(f);
  const cropImg = document.getElementById('cropImg');
  if(cropImg){
    cropImg.src = url;
    document.getElementById('cropOverlay').style.display = 'block';
    document.getElementById('editPfpPreview').src = url;
  } else {
    pixoroSelectedPfpFile = f;
    document.getElementById('editPfpPreview').src = url;
  }
});

// Crop Done -> File ah ready pannu, Save varaikum upload pannaathe
window.applyCrop = function(){
  const cropImg = document.getElementById('cropImg');
  if(!cropImg || !pixoroCropFile){
    const ov = document.getElementById('cropOverlay');
    if(ov) ov.style.display = 'none';
    return;
  }
  const canvas = document.createElement('canvas');
  const size = 400;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
  const s = Math.min(iw, ih);
  const sx = (iw - s)/2, sy = (ih - s)/2;
  ctx.drawImage(cropImg, sx, sy, s, s, 0, 0, size, size);
  canvas.toBlob((blob)=>{
    if(blob){
      pixoroSelectedPfpFile = new File([blob], 'profile.jpg', { type: 'image/jpeg' });
      document.getElementById('editPfpPreview').src = URL.createObjectURL(blob);
    }
    document.getElementById('cropOverlay').style.display = 'none';
  }, 'image/jpeg', 0.9);
};
window.closeCrop = function(){ document.getElementById('cropOverlay').style.display='none'; };
window.resetCrop = function(){ const z=document.getElementById('zoomRange'); if(z) z.value=1; const img=document.getElementById('cropImg'); if(img) img.style.transform='scale(1)'; };

// Zoom slider
document.getElementById('zoomRange')?.addEventListener('input', function(){
  const img = document.getElementById('cropImg');
  if(img) img.style.transform = 'scale(' + this.value + ')';
});

// MAIN SAVE - SERVER ONLY - Photo maathina mattum thaan photo update aagum da, Name maathina photo pogathu da
window.saveEdit = async function(){
  const name = document.getElementById('editName').value.trim();
  const username = document.getElementById('editUsername').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  const link = document.getElementById('editLink').value.trim();

  const client = window.supabaseClient || window.supabase || window.supa;
  if(!client) return alert('Supabase connect aagala da');
  const { data: { user } } = await client.auth.getUser();
  if(!user) return alert('Login pannala da');

  let photoUrl = null;
  if(pixoroSelectedPfpFile){
    const fileName = user.id + '/' + Date.now() + '_profile.jpg';
    const { error: upErr } = await client.storage.from('avatars').upload(fileName, pixoroSelectedPfpFile, { upsert: true, contentType: 'image/jpeg' });
    if(upErr) return alert('Upload fail da: ' + upErr.message);
    const { data: urlData } = client.storage.from('avatars').getPublicUrl(fileName);
    photoUrl = urlData.publicUrl;
  }

  // ✅ Name maathinaalum Photo maara koodathu da - photoUrl iruntha mattum update pannu da
  const updateData = { display_name: name, full_name: name, username, bio, link, website: link };
  if(photoUrl){ updateData.avatar_url = photoUrl; updateData.profile_pic = photoUrl; updateData.photo_url = photoUrl; }

  const { error } = await client.from('profiles').update(updateData).eq('id', user.id);
  if(error) return alert('Save fail da: ' + error.message);

  if(photoUrl){ window.MY_PFP = photoUrl; window.ME_PFP = photoUrl; }
  alert('Server la save aayiduchu da ✅');
  pixoroSelectedPfpFile = null;
  location.reload();
};

// Profile open pannum pothu Server la irunthu photo eduthu kaamikka - Orey Photo da
window.addEventListener('DOMContentLoaded', async ()=>{
  try{
    const client = window.supabaseClient || window.supabase || window.supa;
    if(!client) return;
    const { data: { user } } = await client.auth.getUser();
    if(!user) return;
    const { data } = await client.from('profiles').select('avatar_url,profile_pic,photo_url,username').eq('id', user.id).single();
    if(data){
      let photo = String(data.avatar_url || data.profile_pic || data.photo_url || '').trim();
      if(photo){
        window.MY_PFP = photo; window.ME_PFP = photo;
        let pfp = document.getElementById('pfpImg');
        if(pfp){ pfp.src = photo; pfp.style.display='block'; document.getElementById('pfpLetter').style.display='none'; }
        let ep = document.getElementById('editPfpPreview'); if(ep) ep.src = photo;
        let nav = document.getElementById('navPfp'); if(nav){ nav.src = photo; nav.style.display='block'; }
      }
      let letter = document.getElementById('pfpLetter');
      if(letter && data.username) letter.innerText = data.username.charAt(0).toUpperCase();
    }
  }catch(e){}
});
</script>
