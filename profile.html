<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.pfpBig{width:90px;height:90px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:3px;cursor:pointer}
.pfpBigInner{width:100%;height:100%;border-radius:50%;background:#000;padding:3px}
.pfpBigInner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.stats{display:flex;gap:25px;text-align:center}.stats b{display:block;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:2px}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}
.verifiedBadge{width:18px;height:18px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:5px}
.btn{border:1px solid #333;background:#222;color:#fff;padding:8px 0;border-radius:8px;width:100%;font-weight:600;cursor:pointer}
.btnPrimary{background:#fff;color:#000;border-color:#fff}
.tab{padding:12px 0;flex:1;text-align:center;font-size:14px;cursor:pointer;color:#777;border-bottom:1px solid transparent}
.tab.active{color:#fff;border-bottom:1px solid #fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
#editModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:none;align-items:flex-end;justify-content:center}
#editSheet{background:#111;border-top:1px solid #333;border-radius:20px 20px 0 0;width:100%;max-width:450px;padding:20px;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.inputBox{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:8px 0}
</style></head><body>

<div class="top"><b style="font-size:22px;font-family:cursive">Pixoro 🔵</b><span style="font-size:22px;cursor:pointer" onclick="location.href='index.html'">✕</span></div>

<div style="padding:15px">
  <div style="display:flex;gap:20px;align-items:center">
    <div class="pfpBig" onclick="document.getElementById('pfpFile').click()"><div class="pfpBigInner"><img id="pfpImg" src="https://i.pravatar.cc/150?u=Giri"></div></div>
    <input type="file" id="pfpFile" accept="image/*" style="display:none" onchange="uploadPfp(this)">
    <div class="stats">
      <div><b id="postCount">0</b><span style="color:#aaa;font-size:13px">Posts</span></div>
      <div><b id="followerCount">0</b><span style="color:#aaa;font-size:13px">Followers</span></div>
      <div><b id="followingCount">0</b><span style="color:#aaa;font-size:13px">Following</span></div>
    </div>
  </div>

  <div style="margin-top:14px">
    <div style="display:flex;align-items:center"><b style="font-size:16px">Giri</b><span class="verifiedBadge"><svg viewBox="0 0 24 24" width="11" height="11" fill="none"><path d="M17 8.5L10.5 15L7 11.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div id="bioText" style="color:#fff;font-size:14px;margin-top:4px;line-height:18px">Tiruchengode to World! 🔥 Pixoro Founder</div>
  </div>

  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn btnPrimary" onclick="openEdit()">Edit Profile</button>
    <button class="btn" onclick="shareProfile()">Share Profile</button>
  </div>

  <div style="display:flex;border-top:1px solid #222;margin-top:18px">
    <div class="tab active" id="tabPosts" onclick="switchTab('posts')">⊞ Posts</div>
    <div class="tab" id="tabReels" onclick="switchTab('reels')">🎬 Reels</div>
    <div class="tab" id="tabSaved" onclick="switchTab('saved')">🔖 Saved</div>
  </div>

  <div id="myGrid" class="grid"></div>
  <div id="savedGrid" class="grid" style="display:none"></div>
</div>

<!-- EDIT MODAL - FULL INSTAGRAM STYLE -->
<div id="editModal" onclick="if(event.target==this)closeEdit()">
  <div id="editSheet">
    <div style="width:40px;height:4px;background:#555;border-radius:10px;margin:0 auto 15px"></div>
    <h3 style="text-align:center;margin-bottom:15px">Edit Profile 🔵</h3>
    <div style="text-align:center"><div class="pfpBig" style="margin:0 auto" onclick="document.getElementById('pfpFile').click()"><div class="pfpBigInner"><img id="editPfpPreview" src="https://i.pravatar.cc/150?u=Giri"></div></div><p style="color:#0095F6;margin-top:8px;font-size:14px;cursor:pointer" onclick="document.getElementById('pfpFile').click()">Edit picture</p></div>
    <label style="font-size:12px;color:#777;margin-top:15px;display:block">Bio</label>
    <textarea id="editBio" class="inputBox" rows="3" placeholder="Tiruchengode to World! 🔥"></textarea>
    <label style="font-size:12px;color:#777;display:block">Link</label>
    <input id="editLink" class="inputBox" placeholder="pixoro.com">
    <button onclick="saveProfile()" style="width:100%;background:#0095F6;color:#fff;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:15px">Done</button>
  </div>
</div>

<div style="height:70px"></div>
<div class="nav"><a href="index.html" style="text-decoration:none;font-size:22px">🏠</a><a href="search.html" style="text-decoration:none;font-size:22px">🔎</a><a href="reels.html" style="text-decoration:none;font-size:22px">🎬</a><a href="profile.html" style="text-decoration:none;font-size:22px">👤</a></div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME='Giri'
let myPosts=[], mySaves=[], allFollows=[]

async function loadProfile(){
  let {data:posts}=await supa.from('posts').select('*').eq('username',ME).order('created_at',{ascending:false})
  let {data:follows}=await supa.from('follows').select('*')
  let {data:saves}=await supa.from('saves').select('*').eq('username',ME)
  myPosts=posts||[]; allFollows=follows||[]; mySaves=saves||[]

  // Load saved bio & pfp
  let savedBio=localStorage.getItem('pixoro_bio')
  let savedPfp=localStorage.getItem('pixoro_gilli_pfp')
  if(savedBio) document.getElementById('bioText').innerText=savedBio
  if(savedPfp){ document.getElementById('pfpImg').src=savedPfp; document.getElementById('editPfpPreview').src=savedPfp }

  document.getElementById('postCount').textContent=myPosts.length
  document.getElementById('followerCount').textContent=allFollows.filter(f=>f.following==ME).length
  document.getElementById('followingCount').textContent=allFollows.filter(f=>f.follower==ME).length

  document.getElementById('myGrid').innerHTML=myPosts.map(p=>`<img src="${p.image_url}">`).join('') || '<p style="grid-column:1/4;text-align:center;padding:50px;color:#555">No posts da Giri! 😭</p>'

  // Saved Grid
  if(mySaves.length>0){
    let savedPosts = myPosts.filter(p=> mySaves.some(s=>s.post_id==p.id))
    // For demo, if no saved from own posts, show all as saved
    let html = mySaves.map(s=>{
      let post = myPosts.find(p=>p.id==s.post_id) || myPosts[0]
      return post? `<img src="${post.image_url}">` : ''
    }).join('')
    document.getElementById('savedGrid').innerHTML=html || '<p style="grid-column:1/4;text-align:center;padding:50px;color:#555">No saved posts</p>'
  }
}

function openEdit(){
  document.getElementById('editModal').style.display='flex'
  document.getElementById('editBio').value=localStorage.getItem('pixoro_bio')||'Tiruchengode to World! 🔥 Pixoro Founder'
}
function closeEdit(){ document.getElementById('editModal').style.display='none' }

async function saveProfile(){
  let bio=document.getElementById('editBio').value
  localStorage.setItem('pixoro_bio',bio)
  document.getElementById('bioText').innerText=bio
  await supa.from('profiles').upsert({username:ME, bio:bio, is_verified:true})
  closeEdit()
  alert('Profile Updated da Giri! 🔵✔️')
}

function uploadPfp(input){
  if(input.files && input.files[0]){
    let reader=new FileReader()
    reader.onload=function(e){
      let url=e.target.result
      localStorage.setItem('pixoro_gilli_pfp',url)
      document.getElementById('pfpImg').src=url
      document.getElementById('editPfpPreview').src=url
    }
    reader.readAsDataURL(input.files[0])
  }
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'))
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active')
  if(t==='saved'){ document.getElementById('myGrid').style.display='none'; document.getElementById('savedGrid').style.display='grid' }
  else{ document.getElementById('myGrid').style.display='grid'; document.getElementById('savedGrid').style.display='none' }
}

function shareProfile(){
  if(navigator.share){ navigator.share({title:'Pixoro - Giri', url:location.href}) }
  else{ prompt('Copy link da Giri:', location.href) }
}

loadProfile()
</script>
</body></html>
