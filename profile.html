<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#000;z-index:50}
.pfpBig{width:96px;height:96px;border-radius:50%;background:#222;padding:3px;cursor:pointer}
.pfpBig.hasStory{background:linear-gradient(135deg,#FF6A00,#FF0A33,#FFD600,#FF8A00);padding:3px;box-shadow:0 0 16px rgba(255,106,0,0.6)}
.pfpBigInner{width:100%;height:100%;border-radius:50%;background:#000;padding:3px;overflow:hidden}
.pfpBigInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.stats{display:flex;gap:25px;text-align:center}.stats div{cursor:pointer}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:10px}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}
.btn{border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;padding:10px 0;border-radius:12px;width:100%;font-weight:600;cursor:pointer}
.btnPrimary{background:#fff;color:#000;border:0;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:64px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav a{width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;opacity:0.6}.nav a.active{opacity:1}
.tab{padding:12px 0;flex:1;text-align:center;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent}.tab.active{color:#fff;border-bottom:2px solid #fff}
.highlights{display:flex;gap:16px;margin:18px 0;overflow-x:auto;padding-bottom:8px}.highlights::-webkit-scrollbar{display:none}
.h-item{text-align:center;min-width:70px;cursor:pointer}.h-circle{width:68px;height:68px;border-radius:50%;background:#101010;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #333;position:relative}
.h-text{font-size:11px;margin-top:6px;color:#fff;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:500;display:none;flex-direction:column}
.modalTop{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;background:#000}
.followRow{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #111}
.fBtn{border:1px solid #333;background:#222;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.fBtn.following{background:#fff;color:#000}
#storyViewer{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column}
.sProgress{height:3px;background:#333;display:flex;gap:3px;padding:3px}.sBar{flex:1;background:#555;border-radius:10px;overflow:hidden}.sBarFill{height:100%;background:#fff;width:0%}
</style></head><body>
<div class="top"><b style="font-size:22px;font-weight:900">Pixoro</b><div style="display:flex;gap:18px"><span style="font-size:22px;cursor:pointer" onclick="alert('Settings')">☰</span><span style="font-size:22px;cursor:pointer" onclick="location.href='index.html'">✕</span></div></div>
<div style="padding:15px">
  <div style="display:flex;gap:20px;align-items:center">
    <div class="pfpBig" id="pfpRing" onclick="openProfileStory()"><div class="pfpBigInner"><img id="pfpImg" src="https://i.pravatar.cc/150?u=Giri"></div></div>
    <div class="stats">
      <div onclick="openFollowList('posts')"><b id="postCount">0</b><span>Posts</span></div>
      <div onclick="openFollowList('followers')"><b id="followerCount">0</b><span>Followers</span></div>
      <div onclick="openFollowList('following')"><b id="followingCount">0</b><span>Following</span></div>
    </div>
  </div>
  <div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:6px"><b id="displayName">Giri</b><span style="width:18px;height:18px;background:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:11px">✓</span></div>
    <div style="font-size:13px;color:#aaa">@<span id="usernameTag">giri_official</span></div>
    <div id="bioText" style="font-size:14px;margin-top:8px;line-height:20px;color:#fff"></div>
  </div>

  <!-- REAL HIGHLIGHTS - NAMA PUDICHU KURRA MARI -->
  <div class="highlights" id="highlightList"></div>

  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btnPrimary" onclick="openEdit()">Edit Profile</button><button class="btn" onclick="shareProfile()">Share Profile</button></div>
  <div style="display:flex;border-top:1px solid #222;margin-top:18px"><div class="tab active" id="tabPosts">⊞ Posts</div><div class="tab">🎬 Reels</div><div class="tab">🔖 Saved</div></div>
  <div id="myGrid" class="grid"></div>
</div>

<!-- REAL FOLLOWERS LIST MODAL -->
<div id="followModal" class="modal"><div class="modalTop"><b id="followTitle">Followers</b><span onclick="closeFollow()" style="font-size:22px;cursor:pointer">✕</span></div><div id="followList" style="flex:1;overflow-y:auto"></div></div>

<!-- STORY VIEWER -->
<div id="storyViewer"><div class="sProgress"><div class="sBar"><div class="sBarFill" id="sFill"></div></div></div>
<div style="padding:10px;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><img id="sPfp" src="" style="width:32px;height:32px;border-radius:50%"><b id="sName">Giri</b></div><span onclick="closeStory()" style="font-size:24px;cursor:pointer">✕</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center" onclick="closeStory()"><img id="sImg" src="" style="max-width:100%;max-height:80vh;object-fit:contain"></div>
</div>

<div class="nav"><a href="index.html">🏠</a><a href="search.html">🔎</a><div style="background:#fff;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900" onclick="location.href='upload.html'">+</div><a href="reels.html">🎬</a><a href="profile.html" class="active">👤</a></div>

<script>
const supa=window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
let ME=localStorage.getItem('pixoro_current_user')||'Giri'
let myPosts=[], allFollows=[], currentStories=[], storyTimer=null

async function loadProfile(){
  let target=new URLSearchParams(location.search).get('u')||ME
  document.getElementById('displayName').textContent=target
  document.getElementById('usernameTag').textContent=target.toLowerCase()+'_official'
  document.getElementById('pfpImg').src=localStorage.getItem('pixoro_gilli_pfp_'+target)||`https://i.pravatar.cc/150?u=${target}`
  document.getElementById('sPfp').src=document.getElementById('pfpImg').src
  document.getElementById('sName').textContent=target
  document.getElementById('bioText').innerText=localStorage.getItem('pixoro_bio_'+ME)||'🔥 Tiruchengode ➡️ World\n👨‍💻 Pixoro Founder'

  // REAL POSTS ONLY - NO FAKE
  try{
    let {data, error}=await supa.from('posts').select('*').eq('username',target).order('created_at',{ascending:false})
    if(error) throw error
    myPosts=data||[]
  }catch(e){ myPosts=[] }
  document.getElementById('postCount').textContent=myPosts.length
  document.getElementById('myGrid').innerHTML=myPosts.length?myPosts.map(p=>`<img src="${p.image_url}" onclick="location.href='index.html'">`).join(''):`<div style="grid-column:1/4;text-align:center;padding:40px;color:#666">No posts yet<br><span style="font-size:12px">Upload panna thaan varum da</span></div>`

  // REAL FOLLOWS ONLY - NO FAKE
  try{
    let {data}=await supa.from('follows').select('*')
    allFollows=data||[]
  }catch(e){ allFollows=[] }
  let followers=allFollows.filter(f=>f.following==target)
  let following=allFollows.filter(f=>f.follower==target)
  document.getElementById('followerCount').textContent=followers.length
  document.getElementById('followingCount').textContent=following.length

  // REAL STORY RING ONLY
  checkStoryRing(target)
  loadRealHighlights()
}

async function checkStoryRing(target){
  let ring=document.getElementById('pfpRing')
  try{
    let {data}=await supa.from('stories').select('*').eq('username',target).gt('expires_at',new Date().toISOString())
    currentStories=data||[]
    if(currentStories.length>0) ring.classList.add('hasStory')
    else ring.classList.remove('hasStory')
  }catch(e){ ring.classList.remove('hasStory') }
}

function openProfileStory(){
  if(!currentStories.length){ if(ME==new URLSearchParams(location.search).get('u')||!new URLSearchParams(location.search).get('u')){ if(confirm('Story illa da! Add pannava?')) location.href='upload.html' } return }
  document.getElementById('sImg').src=currentStories[0].image_url||currentStories[0].image
  document.getElementById('storyViewer').style.display='flex'
  let fill=document.getElementById('sFill'); fill.style.width='0%'; let w=0
  clearInterval(storyTimer)
  storyTimer=setInterval(()=>{ w+=1; fill.style.width=w+'%'; if(w>=100) closeStory() },40)
}
function closeStory(){ document.getElementById('storyViewer').style.display='none'; clearInterval(storyTimer) }

// REAL FOLLOW LIST - FAKE ILLA DA
function openFollowList(type){
  let target=new URLSearchParams(location.search).get('u')||ME
  let modal=document.getElementById('followModal')
  let title=document.getElementById('followTitle')
  let list=document.getElementById('followList')
  modal.style.display='flex'

  if(type==='posts'){ title.textContent='Posts'; list.innerHTML=`<div style="padding:20px;text-align:center;color:#777">${myPosts.length} posts<br><span style="font-size:11px">Real posts mattum</span></div>`; return }

  let users= type==='followers'? allFollows.filter(f=>f.following==target).map(f=>f.follower) : allFollows.filter(f=>f.follower==target).map(f=>f.following)
  title.textContent= type==='followers'? 'Followers' : 'Following'

  if(!users.length){
    list.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#666"><div style="font-size:40px">👤</div><b style="color:#fff">No ${type} yet</b><p style="font-size:12px;margin-top:8px">Yaarum ${type==='followers'?'follow pannala':'follow pannala'} da<br>Real follow panna thaan varum da</p></div>`
    return
  }

  list.innerHTML=users.map(u=>{
    let isFollow=allFollows.some(f=>f.follower==ME&&f.following==u)
    return `<div class="followRow"><div style="display:flex;align-items:center;gap:10px"><img src="https://i.pravatar.cc/100?u=${u}" style="width:44px;height:44px;border-radius:50%"><div><b>@${u}</b><div style="font-size:11px;color:#666">Real user • Tiruppur</div></div></div><button class="fBtn ${isFollow?'following':''}" onclick="toggleFollow('${u}',this)">${isFollow?'Following':'Follow'}</button></div>`
  }).join('')
}
function closeFollow(){ document.getElementById('followModal').style.display='none' }
async function toggleFollow(u,btn){
  let isFollow=allFollows.some(f=>f.follower==ME&&f.following==u)
  try{
    if(isFollow){ await supa.from('follows').delete().eq('follower',ME).eq('following',u); allFollows=allFollows.filter(f=>!(f.follower==ME&&f.following==u)); btn.textContent='Follow'; btn.classList.remove('following') }
    else { await supa.from('follows').insert({follower:ME,following:u}); allFollows.push({follower:ME,following:u}); btn.textContent='Following'; btn.classList.add('following') }
  }catch(e){ alert('Supabase follows table check pannu da!') }
  loadProfile()
}

// REAL HIGHLIGHTS - NAMA PUDICHU KURRA MARI
function loadRealHighlights(){
  let container=document.getElementById('highlightList')
  let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]')
  // Default empty - real mattum, fake illa
  let html=saved.map((h,i)=>`<div class="h-item" onclick="openHighlight(${i})"><div class="h-circle">${h.emoji}</div><div class="h-text">${h.title}</div></div>`).join('')
  // + button - nama pudichu add pannalam
  html+=`<div class="h-item" onclick="addHighlight()"><div class="h-circle" style="border:2px dashed #555">➕</div><div class="h-text">New</div></div>`
  container.innerHTML=html
}
function addHighlight(){
  let emoji=prompt('Emoji podu da (ex: 🔥):')
  if(!emoji) return
  let title=prompt('Title podu da (ex: My Work):')
  if(!title) return
  let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]')
  saved.push({emoji,title,images:[]})
  localStorage.setItem('pixoro_highlights_'+ME,JSON.stringify(saved))
  loadRealHighlights()
}
function openHighlight(i){
  let saved=JSON.parse(localStorage.getItem('pixoro_highlights_'+ME)||'[]')
  let h=saved[i]
  if(!h) return
  if(confirm(`Delete "${h.title}" highlight?`)){
    if(confirm('Nijama delete pannava?')){ saved.splice(i,1); localStorage.setItem('pixoro_highlights_'+ME,JSON.stringify(saved)); loadRealHighlights() }
  }
}
function openEdit(){ let b=prompt('Bio podu da:'); if(b){ localStorage.setItem('pixoro_bio_'+ME,b); document.getElementById('bioText').innerText=b } }
function shareProfile(){ navigator.clipboard.writeText(location.href); alert('Link copied da!') }

loadProfile()
</script></body></html>
