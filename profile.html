<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro 🔵</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:50}
.pfpBig{width:90px;height:90px;border-radius:50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:3px}
.pfpBigInner{width:100%;height:100%;border-radius:50%;background:#000;padding:3px}
.pfpBigInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.stats{display:flex;gap:20px;text-align:center}
.stats b{display:block;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:10px}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover}
.verifiedBadge{width:16px;height:16px;background:#0095F6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.btn{border:1px solid #333;background:#222;color:#fff;padding:7px 0;border-radius:8px;width:100%;font-weight:600;cursor:pointer}
.btnPrimary{background:#fff;color:#000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:14px 0;z-index:100;max-width:450px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
</style></head><body>
<div class="top"><b style="font-size:20px;font-family:cursive">Pixoro 🔵</b><span onclick="location.href='index.html'" style="font-size:20px">✕</span></div>

<div style="padding:15px">
  <div style="display:flex;gap:20px;align-items:center">
    <div class="pfpBig"><div class="pfpBigInner"><img id="pfpImg" src="https://i.pravatar.cc/150?u=Giri"></div></div>
    <div class="stats">
      <div><b id="postCount">0</b><span style="color:#777;font-size:13px">Posts</span></div>
      <div><b id="followerCount">0</b><span style="color:#777;font-size:13px">Followers</span></div>
      <div><b id="followingCount">0</b><span style="color:#777;font-size:13px">Following</span></div>
    </div>
  </div>
  
  <div style="margin-top:12px">
    <div style="display:flex;align-items:center"><b>Giri</b><span class="verifiedBadge"><svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M17 8.5L10.5 15L7 11.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div style="color:#777;font-size:14px;margin-top:2px">Tiruchengode to World! 🔥 Pixoro Founder</div>
  </div>

  <div style="display:flex;gap:8px;margin-top:15px">
    <button class="btn btnPrimary" onclick="alert('Edit Profile soon da Giri!')">Edit Profile</button>
    <button class="btn" onclick="alert('Share Profile: ikir58-ui.github.io')">Share Profile</button>
  </div>

  <div style="display:flex;justify-content:space-around;border-top:1px solid #222;margin-top:15px;padding-top:10px;color:#777">
    <span style="color:#fff;border-bottom:1px solid #fff;padding-bottom:5px">⊞ Posts</span><span>🎬 Reels</span><span>🔖 Saved</span>
  </div>

  <div id="myGrid" class="grid"></div>
</div>

<div style="height:70px"></div>
<div class="nav"><a href="index.html" style="text-decoration:none;font-size:22px">🏠</a><a href="search.html" style="text-decoration:none;font-size:22px">🔎</a><a href="reels.html" style="text-decoration:none;font-size:22px">🎬</a><a href="profile.html" style="text-decoration:none;font-size:22px;color:#fff">👤</a></div>

<script>
const supa = window.supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_')
const ME='Giri'
async function loadProfile(){
  let {data:posts}=await supa.from('posts').select('*').eq('username',ME).order('created_at',{ascending:false})
  let {data:follows}=await supa.from('follows').select('*')
  let followers = follows.filter(f=>f.following==ME).length
  let following = follows.filter(f=>f.follower==ME).length
  
  document.getElementById('postCount').textContent=posts?posts.length:0
  document.getElementById('followerCount').textContent=followers
  document.getElementById('followingCount').textContent=following
  
  let grid=document.getElementById('myGrid')
  grid.innerHTML=(posts||[]).map(p=>`<img src="${p.image_url}" onclick="location.href='index.html'">`).join('') || '<p style="grid-column:1/4;text-align:center;padding:40px;color:#555">No posts yet da!</p>'
}
loadProfile()
</script>
</body></html>
