<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Pixoro</title>
<link rel="stylesheet" href="css/pixoro-verified.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}
.top{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#000;z-index:50;height:56px}
.topPlus{width:32px;height:32px;background:#fff!important;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;cursor:pointer}
.bellWhite{width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pfpBig{width:82px;height:82px;border-radius:50%;background:#fff;padding:2px;cursor:pointer}.pfpBigInner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px;overflow:hidden}.pfpBigInner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.stats{display:flex;gap:22px;text-align:center}.stats b{display:block;font-size:17px}.stats span{font-size:12px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:10px}.grid img,.grid video{width:100%;aspect-ratio:1/1;object-fit:cover}
.btn{border:1px solid #333;background:#1a1a1a;color:#fff;padding:10px 0;border-radius:8px;width:100%;font-weight:600}.btnPrimary{background:#fff!important;color:#000!important;border:0;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:0 auto;width:100%;height:60px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:9999}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8e8e8e}.bottom-nav a.active{color:#fff}.bottom-nav span{font-size:10px;color:#8e8e8e}.bottom-nav a.active span{color:#fff;font-weight:700}
.bottom-nav a svg{width:22px;height:22px;fill:none;stroke:#8e8e8e;stroke-width:1.8}.bottom-nav a.active svg{stroke:#fff}
.bottom-nav a img.navPfp{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;background:#111}
.tab{padding:12px 0;flex:1;text-align:center;font-size:13px;color:#666;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:#fff;border-bottom:2px solid #fff}
.highlights{display:flex;gap:16px;margin:18px 0;overflow-x:auto}.h-item{text-align:center;min-width:62px}.h-circle{width:62px;height:62px;border-radius:50%;background:#101010;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff}.h-text{font-size:10px;margin-top:6px}
.editSheet,.setSheet,.createSheet{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:800;display:none;align-items:flex-end;justify-content:center;padding-bottom:60px}
.sheetBox{background:#0a0a0a;width:100%;max-width:450px;border-radius:22px 22px 0 0;border:1px solid #333;max-height:calc(90vh - 60px);overflow-y:auto;padding:18px;padding-bottom:30px}
.sItem{padding:16px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.inp{width:100%;background:#111;border:1px solid #333;padding:12px;border-radius:10px;color:#fff;margin-top:6px}
.fieldBox{border:1px solid #333;border-radius:14px;padding:10px 14px 12px;margin-top:12px;background:#111}
.fieldBox span{display:block;font-size:12px;color:#888}
.fieldBox input,.fieldBox textarea{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:16px;font-weight:600;padding:4px 0 0;font-family:sans-serif;resize:none}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none;white-space:nowrap}
.cropOverlay{position:fixed;inset:0;background:#000;z-index:2000;display:none;flex-direction:column}.cropStage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.cropCircle{width:280px;height:280px;border-radius:50%;overflow:hidden;border:3px solid #fff;touch-action:none;background:#111;box-shadow:0 0 0 9999px rgba(0,0,0,.7);position:relative}.cropCircle img{position:absolute;left:50%;top:50%;max-width:none;cursor:grab;transform:translate(-50%,-50%)}
input[type=range]{width:100%;accent-color:#fff}
</style></head><body>
<div class="top"><b style="font-size:20px;font-weight:900;display:flex;align-items:center" id="topUsername">Loading...</b><div style="display:flex;gap:8px;align-items:center"><div class="topPlus" onclick="document.getElementById('createSheet').style.display='flex'">+</div><div class="bellWhite" onclick="location.href='notifications.html'">🔔</div><span onclick="openSettings()" style="font-size:20px;cursor:pointer">☰</span></div></div>
<div style="padding:15px">
<div style="display:flex;gap:18px;align-items:center"><div class="pfpBig" onclick="openEditSheet()"><div class="pfpBigInner"><img id="pfpImg" src=""></div></div><div class="stats"><div><b id="postCount">0</b><span>Posts</span></div><div><b id="followerCount">0</b><span>Followers</span></div><div><b id="followingCount">0</b><span>Following</span></div></div></div>
<div style="margin-top:14px"><div style="display:flex;gap:6px;align-items:center"><b id="displayName">...</b><span id="goldTick"></span></div><div style="font-size:13px;color:#aaa"><span id="usernameTag">...</span></div><div id="bioText" style="font-size:14px;margin-top:8px"></div><div id="linkText" style="font-size:13px;color:#0095f6;margin-top:6px"></div></div>
<div class="highlights" id="highlightList"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btnPrimary" id="editBtn" onclick="openEditSheet()">Edit Profile</button><button class="btn" onclick="shareProfile()">Share Profile</button></div>
<div style="display:flex;border-top:1px solid #222;margin-top:18px"><div class="tab active" id="tabPosts" onclick="showTab('all')">⊞ Posts</div><div class="tab" id="tabReels" onclick="showTab('reels')">🎬 Reels</div><div class="tab" onclick="location.href='saved.html'">🔖 Saved</div></div>
<div id="myGrid" class="grid"></div></div>
<div id="setSheet" class="setSheet"><div class="sheetBox"><div style="width:40px;height:4px;background:#000;border-radius:10px;margin:12px auto"></div><div style="text-align:center;font-weight:900;padding-bottom:12px;color:#000">Pixoro Settings ⚙️</div>
<div class="sItem" onclick="openEditSheet()"><span>👤 Edit Profile</span><span>›</span></div>
<div class="sItem" onclick="doPixoroLogout()" style="color:#ff3b30"><span>🚪 Log Out</span><span>›</span></div><div onclick="document.getElementById('setSheet').style.display='none'" style="margin:14px;background:#fff;padding:12px;border-radius:12px;text-align:center;color:#666;border:1px solid #000">Cancel</div></div></div>
<div id="editSheet" class="editSheet"><div class="sheetBox"><div style="width:40px;height:4px;background:#fff;border-radius:10px;margin:0 auto 16px"></div><b style="display:block;text-align:center">Edit Profile</b><div style="text-align:center;margin:14px"><img id="editPfpPreview" src="" style="width:90px;height:90px;border-radius:50%;border:2px solid #fff;object-fit:cover"><br><button onclick="document.getElementById('pfpInput').click()" style="margin-top:8px;background:#1a1a1a;border:1px solid #fff;color:#fff;padding:6px 14px;border-radius:20px">Change Photo</button><input type="file" id="pfpInput" accept="image/*" style="display:none"></div><div class="fieldBox"><span>Name</span><input id="editName" placeholder="Name"></div><div class="fieldBox"><span>Username - ID</span><input id="editUsername" placeholder="Username"></div><div class="fieldBox"><span>Bio</span><textarea id="editBio" rows="2" placeholder="Bio"></textarea></div><div class="fieldBox"><span>Link</span><input id="editLink" placeholder="Add link"></div><button onclick="saveEdit()" style="width:100%;background:#fff;color:#000;padding:12px;border-radius:12px;font-weight:900;margin-top:16px;border:0">Save - Server Sync</button><div onclick="document.getElementById('editSheet').style.display='none'" style="text-align:center;padding:12px;color:#888">Cancel</div></div></div>
<div id="cropOverlay" class="cropOverlay"><div style="padding:14px;display:flex;justify-content:space-between"><span onclick="closeCrop()" style="font-size:20px;cursor:pointer">✕</span><b>Adjust Profile Photo</b><span onclick="applyCrop()" style="color:#0095f6;font-weight:900;cursor:pointer">Done ✓</span></div><div class="cropStage"><div class="cropCircle" id="cropCircle"><img id="cropImg"></div></div><div style="padding:18px"><div style="display:flex;gap:10px;align-items:center"><span>➖</span><input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1"><span>➕</span></div><div style="display:flex;gap:8px;margin-top:14px"><button onclick="resetCrop()" style="flex:1;background:#222;color:#fff;border:1px solid #333;padding:12px;border-radius:12px">Reset</button><button onclick="applyCrop()" style="flex:2;background:#fff;color:#000;padding:12px;border-radius:12px;font-weight:900;border:0">Crop & Save ✓</button></div></div></div>
<div class="bottom-nav"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span>Home</span></a><a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.2-3.2"/></svg><span>Search</span></a><a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg><span>Reels</span></a><a href="dm.html"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg><span>DM</span></a><a href="profile.html" class="active"><img class="navPfp" id="navPfp" src=""><span>Profile</span></a></div>
<div id="createSheet" class="createSheet"><div style="background:#1a1a1a;border-radius:28px 28px 0 0;padding:20px 0 30px;width:100%;max-width:450px"><div style="width:50px;height:5px;background:#333;border-radius:10px;margin:0 auto 16px"></div><div style="text-align:center;font-size:22px;font-weight:900;margin-bottom:10px">Create</div><div onclick="location.href='post-create.html'" style="padding:18px 20px;border-bottom:1px solid #2a2a2a;cursor:pointer">+ Post</div><div onclick="location.href='reel-create.html'" style="padding:18px 20px;border-bottom:1px solid #2a2a2a;cursor:pointer">▶ Reels</div><div onclick="location.href='story-create.html'" style="padding:18px 20px;cursor:pointer">◯ Story</div><div onclick="document.getElementById('createSheet').style.display='none'" style="margin-top:12px;text-align:center;padding:12px;color:#777">Cancel</div></div></div>
<div id="toast" class="toast"></div>
<script>
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
function getSupa(){ return window.supa || window.supabase; }
function cleanUser(u){ if(!u) return ''; u=String(u).trim(); if(u.includes('@')) u=u.split('@')[0]; u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase(); return u||''; }
let ME_RAW='', ME_ID='', VIEW_USER='', VIEW_PROFILE=null, myPosts=[]
function getTick(u, profile){
  let c = cleanUser(u);
  if(c==='giri_office' || profile?.verified===true || profile?.is_gold===true) return '<span class="pixoro-verified"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6.5" stroke="black" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  return '';
}
function getPfpFrom(p){ return p?.avatar_url || p?.profile_pic || p?.photo_url || 'https://ui-avatars.com/api/?name='+(cleanUser(p?.username||'G').charAt(0).toUpperCase())+'&background=333&color=fff&size=200&bold=true' }
async function init(){
  let supa = getSupa();
  if(!supa){ setTimeout(init,300); return; }
  let { data: { session } } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return; }
  let { data: myProfile } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  if(!myProfile){ location.href='setup-username.html'; return; }
  ME_RAW = cleanUser(myProfile.username || session.user.email.split('@')[0])
  ME_ID = session.user.id
  let urlU = cleanUser(new URLSearchParams(location.search).get('u') || '')
  VIEW_USER = urlU || ME_RAW
  let isMine = VIEW_USER===ME_RAW
  let vp = null;
  if(isMine) vp = myProfile;
  else {
    let { data } = await supa.from('profiles').select('*').eq('username', VIEW_USER).single();
    vp = data || myProfile;
  }
  VIEW_PROFILE = vp
  document.getElementById('topUsername').innerHTML = cleanUser(VIEW_PROFILE.username)+' '+getTick(VIEW_PROFILE.username, VIEW_PROFILE)
  document.getElementById('displayName').textContent = VIEW_PROFILE.full_name || VIEW_PROFILE.display_name || VIEW_PROFILE.username
  document.getElementById('usernameTag').textContent = '@'+VIEW_PROFILE.username
  document.getElementById('bioText').innerText = VIEW_PROFILE.bio || ''
  document.getElementById('linkText').innerText = VIEW_PROFILE.link || VIEW_PROFILE.website || ''
  document.getElementById('goldTick').innerHTML = getTick(VIEW_PROFILE.username, VIEW_PROFILE)
  document.getElementById('pfpImg').src = getPfpFrom(VIEW_PROFILE)
  document.getElementById('editPfpPreview').src = getPfpFrom(VIEW_PROFILE)
  document.getElementById('navPfp').src = getPfpFrom(myProfile)
  document.getElementById('editBtn').style.display = isMine ? 'block':'none'
  let posts2 = []
  if(VIEW_PROFILE?.id){
    let {data: p1} = await supa.from('posts').select('*').eq('user_id', VIEW_PROFILE.id).order('created_at',{ascending:false})
    if(p1 && p1.length) posts2 = p1
  }
  if(!posts2.length){
    let { data: posts } = await supa.from('posts').select('*').eq('username', VIEW_USER).order('created_at',{ascending:false})
    if(posts && posts.length) posts2 = posts
  }
  if(!posts2.length){
    let { data: posts3 } = await supa.from('posts').select('*').in('username', ['giri_office', VIEW_USER]).order('created_at',{ascending:false})
    if(posts3 && posts3.length) posts2 = posts3
  }
  myPosts = posts2.filter(p=>!p.is_archived)
  document.getElementById('postCount').textContent = myPosts.length
  renderGrid(myPosts)
  let { data: follows } = await supa.from('follows').select('*')
  document.getElementById('followerCount').textContent = (follows||[]).filter(f=> (f.following_id===VIEW_PROFILE.id) || cleanUser(f.following)===VIEW_USER || cleanUser(f.following)==='giri_office').length
  document.getElementById('followingCount').textContent = (follows||[]).filter(f=> (f.follower_id===VIEW_PROFILE.id) || cleanUser(f.follower)===VIEW_USER || cleanUser(f.follower)==='giri_office').length
}
function renderGrid(list){ if(!list.length){ document.getElementById('myGrid').innerHTML=`<div style="grid-column:1/4;text-align:center;padding:40px;color:#666">No posts yet</div>`; return; } document.getElementById('myGrid').innerHTML=list.map(p=>{ let mUrl=p.media_url||p.video_url||p.image_url||p.image||''; let isVid=p.media_type=='reel'||p.media_type=='video'||!!p.video_url||mUrl.includes('.mp4'); if(isVid) return `<div style="position:relative"><video src="${mUrl}" muted playsinline style="width:100%;aspect-ratio:1/1;object-fit:cover"></video><span style="position:absolute;top:6px;right:6px">🎬</span></div>`; return `<img src="${mUrl}">`; }).join('') }
function showTab(type){ document.getElementById('tabPosts').classList.toggle('active', type=='all'); document.getElementById('tabReels').classList.toggle('active', type=='reels'); let list=myPosts; if(type=='reels'){ list=myPosts.filter(p=>{ let u=(p.media_url||p.video_url||'').toLowerCase(); return p.media_type=='reel'||p.media_type=='video'||!!p.video_url||u.includes('.mp4') }); if(!list.length && myPosts.length>1) list=[myPosts[1]]; } renderGrid(list); }
function openSettings(){ document.getElementById('setSheet').style.display='flex' }
function openEditSheet(){ if(VIEW_USER!==ME_RAW) return showToast('Others Profile Edit Panna Mudiyathu da'); document.getElementById('editName').value=VIEW_PROFILE.full_name||VIEW_PROFILE.display_name||''; document.getElementById('editUsername').value=VIEW_USER; document.getElementById('editBio').value=VIEW_PROFILE.bio||''; document.getElementById('editLink').value=VIEW_PROFILE.link||VIEW_PROFILE.website||''; document.getElementById('editSheet').style.display='flex' }
async function doPixoroLogout(){ let supa=getSupa(); await supa.auth.signOut(); location.href='login.html'; }
async function saveEdit(){
  let supa=getSupa();
  let n=document.getElementById('editName').value.trim(), u=cleanUser(document.getElementById('editUsername').value.trim()), b=document.getElementById('editBio').value, l=document.getElementById('editLink').value.trim(), np=document.getElementById('editPfpPreview').dataset.new
  if(!u) return showToast('Username podu da')
  let oldU = ME_RAW
  let avatarUrl = VIEW_PROFILE?.avatar_url || ''
  if(np && np.startsWith('data:')){
    try{
      let res = await fetch(np)
      let blob = await res.blob()
      let fileName = Date.now()+'_'+ME_RAW+'.jpg'
      let { error: upErr } = await supa.storage.from('avatars').upload(fileName, blob, {contentType:'image/jpeg'})
      if(!upErr){
        let { data } = supa.storage.from('avatars').getPublicUrl(fileName)
        avatarUrl = data.publicUrl
      }
    }catch(e){}
  }
  let update = { username: u, display_name: n, full_name: n, bio: b, avatar_url: avatarUrl }
  let { error } = await supa.from('profiles').update(update).eq('id', ME_ID)
  if(error){
    if(error.message.includes('full_name') || error.message.includes('column')){
      let { error: e2 } = await supa.from('profiles').update({ username: u, display_name: n, bio: b, avatar_url: avatarUrl }).eq('id', ME_ID)
      if(e2) return showToast(e2.message)
    } else return showToast(error.message)
  }
  if(l){
    try{ await supa.from('profiles').update({ link: l }).eq('id', ME_ID); }catch(e){}
    try{ await supa.from('profiles').update({ website: l }).eq('id', ME_ID); }catch(e){}
    try{ localStorage.setItem('pixoro_link_'+ME_ID, l); }catch(e){}
  }
  if(u!==oldU){
    await supa.from('posts').update({username: u}).eq('username', oldU)
    await supa.from('stories').update({username: u}).eq('username', oldU)
  }
  document.getElementById('editSheet').style.display='none'; showToast('Server la Saved da ✅'); setTimeout(()=>{ location.href='profile.html?u='+u },600)
}
function shareProfile(){ navigator.clipboard.writeText(location.origin+'/profile.html?u='+VIEW_USER).then(()=>showToast('Profile Link Copy da!')) }
let cropX=0,cropY=0,cropScale=1,cropDragging=false,cropStartX=0,cropStartY=0,cropOrigX=0,cropOrigY=0,cropImgEl=document.getElementById('cropImg');
function updateCropTransform(){ cropImgEl.style.transform=`translate(-50%,-50%) translate(${cropX}px,${cropY}px) scale(${cropScale})`; }
function openCrop(src){ cropX=0; cropY=0; cropScale=1; document.getElementById('zoomRange').value=1; cropImgEl.src=src; cropImgEl.onload=()=>{ let w=cropImgEl.naturalWidth, h=cropImgEl.naturalHeight; if(w>h){ cropImgEl.style.width='auto'; cropImgEl.style.height='280px'; } else { cropImgEl.style.width='280px'; cropImgEl.style.height='auto'; } updateCropTransform(); }; document.getElementById('cropOverlay').style.display='flex'; document.getElementById('editSheet').style.display='none'; }
function closeCrop(){ document.getElementById('cropOverlay').style.display='none'; }
function resetCrop(){ cropX=0; cropY=0; cropScale=1; document.getElementById('zoomRange').value=1; updateCropTransform(); }
document.getElementById('zoomRange').addEventListener('input',e=>{ cropScale=parseFloat(e.target.value); updateCropTransform(); });
let circle=document.getElementById('cropCircle');
circle.addEventListener('pointerdown',e=>{ cropDragging=true; cropStartX=e.clientX; cropStartY=e.clientY; cropOrigX=cropX; cropOrigY=cropY; circle.setPointerCapture(e.pointerId); });
circle.addEventListener('pointermove',e=>{ if(!cropDragging) return; cropX=cropOrigX+(e.clientX-cropStartX); cropY=cropOrigY+(e.clientY-cropStartY); cropX=Math.max(-100,Math.min(100,cropX)); cropY=Math.max(-100,Math.min(100,cropY)); updateCropTransform(); });
circle.addEventListener('pointerup',()=>cropDragging=false);
function applyCrop(){ let canvas=document.createElement('canvas'); canvas.width=400; canvas.height=400; let ctx=canvas.getContext('2d'); let img=new Image(); img.onload=()=>{ ctx.save(); ctx.beginPath(); ctx.arc(200,200,200,0,Math.PI*2); ctx.clip(); let scale=Math.max(400/img.naturalWidth, 400/img.naturalHeight)*cropScale; let dw=img.naturalWidth*scale, dh=img.naturalHeight*scale; let dx=200-dw/2 + cropX*(400/280); let dy=200-dh/2 + cropY*(400/280); ctx.drawImage(img, dx, dy, dw, dh); ctx.restore(); let out=canvas.toDataURL('image/jpeg',0.92); document.getElementById('editPfpPreview').src=out; document.getElementById('editPfpPreview').dataset.new=out; document.getElementById('pfpImg').src=out; closeCrop(); document.getElementById('editSheet').style.display='flex'; showToast('Photo Ready da ✅ - Save pannu'); }; img.src=cropImgEl.src; }
document.getElementById('pfpInput').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=ev=>{ openCrop(ev.target.result) }; r.readAsDataURL(f) })
init()
</script></body></html>
