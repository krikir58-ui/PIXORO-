<style>
html{background:#000}*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;max-width:450px;margin:0 auto;padding-bottom:70px}

.tab{padding:12px 0;flex:1;text-align:center;font-size:13px;color:#666;border-bottom:2px solid transparent;cursor:pointer;background:transparent}

.highlights{display:flex;gap:16px;margin:18px 0;overflow-x:auto}.h-item{text-align:center;min-width:62px}.h-circle{width:62px!important;height:62px!important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;overflow:hidden}.h-circle img{width:100%;height:100%;object-fit:cover}.h-text{font-size:10px;margin-top:6px}

.sheetBox{background:#0a0a0a;width:100%;max-width:450px;border-radius:22px 22px 0 0;border:1px solid #333;max-height:calc(90vh - 60px);overflow-y:auto;padding:18px;padding-bottom:30px}

.cropOverlay{position:fixed;inset:0;background:#000;z-index:2000;display:none;flex-direction:column}.cropStage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.cropCircle{width:280px;height:280px;border-radius:50%;overflow:hidden;border:3px solid #fff;touch-action:none;background:transparent!important;box-shadow:0 0 0 9999px rgba(0,0,0,.7);position:relative}.cropCircle img{position:absolute;left:50%;top:50%;max-width:none;cursor:grab;transform:translate(-50%,-50%)}
input[type=range]{width:100%;accent-color:#fff}
.pixoroMenu{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #fff;border-radius:16px;width:92%;max-width:420px;z-index:9999;display:none;padding:8px}

.hlCover{width:62px!important;height:62px!important;border-radius:50%;object-fit:cover;border:2px solid #fff;cursor:pointer}
.followModal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:none;align-items:flex-end;justify-content:center}

.whiteBtn{background:transparent!important;background-color:transparent!important;color:#fff!important;border:1.2px solid #fff!important;padding:10px 14px;border-radius:20px;font-weight:700;height:30px!important;min-width:80px!important;font-size:14px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:800;z-index:9999;display:none;white-space:nowrap}
</style></head><body>

<script>
function getSupa(){return window.supa} window.getTick=()=>'';
function cleanUser(u){if(!u)return'';u=String(u).trim();if(u.includes('@'))u=u.split('@')[0];u=u.replace(/[^a-zA-Z0-9_.]/g,'').toLowerCase();return u||''}
let ME_RAW='',ME_ID='',VIEW_USER='',VIEW_PROFILE=null,myPosts=[],savedPosts=[],allViews=[],allFollows=[],allProfiles=[],currentTab='all',allHighlights=[],editingHL=null,editingCover='',blockedUsers=[],savedTouchTimer=null,savedLongPressed=false
function showToast(m){let t=document.getElementById('toast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function isReelPost(p){ if(p._from==='reels') return true; if(p.media_type==='reel'||p.media_type==='video'||p.media_type==='reels') return true; let m=(p.media_url||p.video_url||'').toLowerCase().split('?')[0]; return m.endsWith('.mp4')||m.endsWith('.mov')||m.endsWith('.webm')||m.endsWith('.m4v'); }
function getBestMedia(p){ if(p._from==='reels') return {url:p.video_url||p.media_url||'',isVid:true}; let m=(p.media_url||p.video_url||'').toLowerCase().split('?')[0]; if(m.endsWith('.mp4')||m.endsWith('.mov')||m.endsWith('.webm')||m.endsWith('.m4v')) return {url:p.media_url||p.video_url,isVid:true}; return {url:p.media_url||p.video_url||p.image_url||p.image||'',isVid:false}; }
function isRealPhoto(url){ if(!url) return false; if(url.includes('ui-avatars')||url.includes('placeholder')||url.includes('undefined')) return false; return true; }
function letterFor(uname){ let l=(cleanUser(uname||'P').charAt(0).toUpperCase()||'P'); if(!/[A-Z]/.test(l)) l='P'; return l; }
function getPfpFrom(p){ if(p&&(p.avatar_url||p.profile_pic||p.photo_url)) return p.avatar_url||p.profile_pic||p.photo_url; return 'https://ui-avatars.com/api/?name='+letterFor(p?.username||'P')+'&background=111&color=fff&size=200&bold=true'; }
function pfpErr(el,uname){ el.onerror=null; el.src='https://ui-avatars.com/api/?name='+letterFor(uname||VIEW_USER||ME_RAW||'P')+'&background=111&color=fff&size=200&bold=true'; }
window.pfpErr=pfpErr;
function displayNameFor(u){ if(!u) return ME_RAW||'user'; let p=allProfiles.find(x=>String(x.id)===String(u))||allProfiles.find(x=>cleanUser(x.username)===cleanUser(u)); if(p&&p.username) return cleanUser(p.username); if(String(u)===String(ME_ID)) return ME_RAW||'user'; let cu=cleanUser(u); if(cu.length>20) return ME_RAW||'user'; return cu||ME_RAW||'user'; }
function updateFollowMsg(){ return; }
function openMessageFriend(){ if(!VIEW_PROFILE) return; location.href='dm.html?u='+VIEW_PROFILE.id+'&user='+VIEW_USER; }
window.openMessageFriend=openMessageFriend;
async function init(){
  let supa=getSupa(); if(!supa){setTimeout(init,200);return}
  let {data:{session}}=await supa.auth.getSession(); if(!session){location.href='login.html';return}
  let {data:myProfile}=await supa.from('profiles').select('*').eq('id',session.user.id).single(); if(!myProfile){location.href='setup-username.html';return}
  ME_RAW=cleanUser(myProfile.username||session.user.email.split('@')[0]); ME_ID=session.user.id; window.ME_ID=ME_ID; window.ME_RAW=ME_RAW;
  if(window.pixoroLoadFollowing) await window.pixoroLoadFollowing();
  let rawParam = new URLSearchParams(location.search).get('u') || new URLSearchParams(location.search).get('user') || '';
  let vp=null;
  if(rawParam && rawParam.includes('-') && rawParam.length>20){ let {data}=await supa.from('profiles').select('*').eq('id', rawParam).single(); if(data) vp=data; }
  if(!vp){ let urlU=cleanUser(rawParam); VIEW_USER=urlU||ME_RAW; if(urlU===''||urlU===ME_RAW) vp=myProfile; else { let {data}=await supa.from('profiles').select('*').eq('username',VIEW_USER).single(); if(data) vp=data; else { let {data:allP}=await supa.from('profiles').select('*'); vp=(allP||[]).find(p=>cleanUser(p.username)===VIEW_USER)||null } } }
  if(!vp){document.getElementById('topUsername').innerText='User Not Found';return}
  VIEW_PROFILE=vp; VIEW_USER=cleanUser(vp.username);
  let isMine=String(VIEW_PROFILE.id)===String(ME_ID);
  let t=document.getElementById('tabSaved'); if(t) t.style.display='block';
  document.getElementById('topUsername').innerHTML=cleanUser(VIEW_PROFILE.username);
  document.getElementById('bioText').innerText=VIEW_PROFILE.bio||''; document.getElementById('linkText').innerText=VIEW_PROFILE.link||VIEW_PROFILE.website||'';
  let pfpEl=document.getElementById('pfpImg'); pfpEl.src=getPfpFrom(VIEW_PROFILE); pfpEl.onerror=()=>pfpErr(pfpEl,VIEW_USER);
  document.getElementById('editPfpPreview').src=getPfpFrom(VIEW_PROFILE);
  let navEl=document.getElementById('navPfp'); navEl.src=getPfpFrom(myProfile); navEl.onerror=()=>pfpErr(navEl,ME_RAW);
  let [followsRes,allP2Res,blRes,postsRes,reelsRes,viewsRes] = await Promise.all([
    supa.from('follows').select('*').then(r=>r).catch(()=>({data:[]})),
    supa.from('profiles').select('*').then(r=>r).catch(()=>({data:[]})),
    supa.from('blocked_users').select('blocked_user_id').eq('user_id',ME_ID).then(r=>r).catch(()=>({data:[]})),
    supa.from('posts').select('*').order('created_at',{ascending:false}).limit(30).then(r=>r).catch(()=>({data:[]})),
    supa.from('reels').select('*').order('created_at',{ascending:false}).limit(30).then(r=>r).catch(()=>({data:[]})),
    supa.from('views').select('*').then(r=>r).catch(()=>({data:[]})),
  ]);
  let follows=followsRes.data||[]; allFollows=follows;
  if(window.PIXORO_FOLLOWING) window.PIXORO_FOLLOWING=new Set((follows||[]).filter(f=>String(f.follower_id)===String(ME_ID)).map(f=>String(f.following_id)));
  allProfiles=allP2Res.data||[];
  blockedUsers=(blRes.data||[]).map(x=>String(x.blocked_user_id));
  let isFollow = window.PIXORO_FOLLOWING ? window.PIXORO_FOLLOWING.has(String(VIEW_PROFILE.id)) : allFollows.some(f=>String(f.follower_id)==String(ME_ID)&&String(f.following_id)==String(VIEW_PROFILE.id));
  let isBlocked=blockedUsers.includes(String(VIEW_PROFILE.id));
  if(isMine){ document.getElementById('actionArea').innerHTML=`<button class="btn btnPrimary" onclick="openEditSheet()">Edit Profile</button><button class="btn" onclick="shareProfile()">Share Profile</button>` }
  else if(isBlocked){ document.getElementById('actionArea').innerHTML=`<button class="btn" onclick="unblockUserMain()">Unblock</button><button class="btn" onclick="openMessageFriend()">Message</button>` }
  else { document.getElementById('actionArea').innerHTML=`<button class="btn btnPrimary" id="followBtnMain" data-follow-user="${VIEW_USER}" data-follow-username="${VIEW_USER}" onclick="pixoroToggleFollow('${VIEW_USER}')">${isFollow?'Following':'Follow'}</button><button class="btn" onclick="openMessageFriend()">Message</button>` }
  if(window.pixoroPaintAllFollowBtns) window.pixoroPaintAllFollowBtns();
  updateFollowMsg();
  let all=[]; if(postsRes.data) all=all.concat(postsRes.data.map(p=>({...p,_from:'posts'}))); if(reelsRes.data) all=all.concat(reelsRes.data.map(p=>({...p,_from:'reels'})));
  let seenUrl=new Set(),seenId=new Set(),deduped=[];
  for(let p of all){ let raw=(p.media_url||p.video_url||p.image_url||p.image||'').trim(); if(!raw) continue; if(p.is_archived) continue; let u=raw.split('?')[0].toLowerCase(); if(seenUrl.has(u)) continue; if(seenId.has(String(p.id))) continue; seenUrl.add(u); seenId.add(String(p.id)); deduped.push(p); }
  all=deduped;
  let posts2=all.filter(p=> (String(p.user_id)===String(VIEW_PROFILE.id) || cleanUser(p.username)===cleanUser(VIEW_PROFILE.username)) );
  posts2=posts2.filter(p=> isRealPhoto(p.media_url||p.video_url||p.image_url||p.image) );
  posts2.forEach(p=>{ if(!p.username||p.username.length>20) p.username=VIEW_USER; else p.username=cleanUser(p.username); });
  myPosts=posts2;
  allViews=viewsRes.data||[];
  document.getElementById('postCount').textContent=myPosts.length; document.getElementById('tabPosts').innerHTML=`⊞ Posts`; document.getElementById('tabReels').innerHTML=`Reels`; document.getElementById('tabSaved').innerHTML=`Saved`;
  renderGrid(myPosts); loadHighlights();
  document.getElementById('followerCount').textContent=allFollows.filter(f=>String(f.following_id)==String(VIEW_PROFILE.id)).length; document.getElementById('followingCount').textContent=allFollows.filter(f=>String(f.follower_id)==String(VIEW_PROFILE.id)).length;
  if(new URLSearchParams(location.search).get('tab')==='saved'){ showTab('saved'); }
}
async function pixoroOpenFollowList(type){
  let modal=document.getElementById('followModal'); let title=document.getElementById('followModalTitle'); let listEl=document.getElementById('followModalList');
  let targetId = VIEW_PROFILE ? VIEW_PROFILE.id : ME_ID;

  }).join('')||`<div style="color:#888;text-align:center;padding:20px">No ${type} yet</div>`;
  listEl.innerHTML=html; modal.classList.add('show');

}

async function loadSavedList(){
  let isMineNow = String(VIEW_PROFILE.id)===String(ME_ID);
  let supa=getSupa();
  let [s1,s2] = await Promise.all([
    supa.from('saves').select('*').eq('user_id',ME_ID).order('created_at',{ascending:false}).then(r=>r).catch(()=>({data:[]})),
    supa.from('saves').select('*').eq('username',ME_RAW).order('created_at',{ascending:false}).then(r=>r).catch(()=>({data:[]})),
  ]);
  let saves=[...(s1.data||[]),...(s2.data||[])];
  let seen=new Set(), uniq=[];
  saves.forEach(s=>{ let k=String(s.post_id); if(!seen.has(k)){ seen.add(k); uniq.push(s); } });
  if(!uniq.length){ savedPosts=[]; document.getElementById('tabSaved').innerHTML=`Saved`; return; }
  let ids=uniq.map(s=>String(s.post_id));
  let [postsRes,reelsRes] = await Promise.all([
    supa.from('posts').select('*').in('id',ids).then(r=>r).catch(()=>({data:[]})),
    supa.from('reels').select('*').in('id',ids).then(r=>r).catch(()=>({data:[]})),
  ]);
  let map={};
  (postsRes.data||[]).forEach(p=>map[String(p.id)]={...p,_from:'posts'});
  (reelsRes.data||[]).forEach(p=>{ map[String(p.id)]={...p,_from:'reels'}; });
  savedPosts=ids.map(id=>map[id]).filter(Boolean).filter(p=>!p.is_archived);
  if(!isMineNow){ savedPosts=savedPosts.filter(p=>String(p.user_id)===String(VIEW_PROFILE.id) || cleanUser(p.username)===cleanUser(VIEW_USER)); }
  document.getElementById('tabSaved').innerHTML=`Saved`;
}
