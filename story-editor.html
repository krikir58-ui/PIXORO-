<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;max-width:450px;margin:0 auto;height:100dvh;overflow:hidden}
.page{position:relative;width:100%;height:100dvh}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:14px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
.top span{font-size:22px;cursor:pointer}.top b{font-size:17px}
/* RIGHT SIDE BLOCK - INTHA IMAGE LA IRUKKA MARI DA */
.side{position:absolute;right:10px;top:70px;bottom:110px;width:58px;z-index:10;background:rgba(0,0,0,.45);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:16px;overflow-y:auto}
.side div{font-size:20px;cursor:pointer;text-align:center}
.side span{font-size:9px;display:block;color:#ddd;margin-top:2px}
/* BOTTOM */
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:14px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
.cap{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);border-radius:12px;color:#fff;padding:10px;margin-bottom:10px;outline:none}
.actions{display:flex;gap:8px}
.pill{flex:1;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);color:#fff;padding:12px;border-radius:999px;font-weight:700;font-size:13px}
.pill.green{color:#4ade80}
</style></head><body>
<div class="page">
<img class="photo" id="eImg" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1080">
<div class="top"><span onclick="history.back()">✕</span><b>Story</b><span onclick="alert('Settings')">⋯</span></div>
<!-- SIDE BLOCK DA -->
<div class="side">
<div onclick="addText()">Aa<span>Text</span></div>
<div>😊<span>Sticker</span></div>
<div>🎵<span>Music</span></div>
<div>✨<span>Effect</span></div>
<div>@<span>Mention</span></div>
<div>✏️<span>Draw</span></div>
<div>🎛️<span>Filter</span></div>
<div>⏱️<span>Timer</span></div>
<div>👥<span>Close</span></div>
<div>🔒<span>Privacy</span></div>
<div>⚙️<span>Quality</span></div>
</div>
<div class="bottom">
<input class="cap" placeholder="Add a caption...">
<div class="actions"><button class="pill">⊕ Your story</button><button class="pill green">★ Close Friends</button></div>
</div>
</div>
<script>
let m=sessionStorage.getItem('pixoro_pending_media'); if(m) document.getElementById('eImg').src=m;
function addText(){ let t=prompt('Text enna da?'); if(t) alert(t+' added da!') }
</script></body></html>
