<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New reel - Pixoro</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:22px}.top b{font-size:20px}.tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}.tabs div{background:#222;padding:10px 16px;border-radius:20px;white-space:nowrap;font-weight:700}.tabs div.on{background:#fff;color:#000}.head{display:flex;justify-content:space-between;padding:10px 16px}.head button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}.grid img,.grid video{width:100%;aspect-ratio:3/4;object-fit:cover}.cam{display:grid;place-items:center;background:#111;font-size:34px}.bottom{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center}.bottom div{background:#222;padding:12px 20px;border-radius:30px;display:flex;gap:22px;letter-spacing:2px}.bottom b{opacity:.6}.bottom b.on{opacity:1;border-bottom:2px solid #fff}</style></head><body>
<div class="top"><span onclick="location.href='./index.html'">✕</span><b>New reel</b><span>⚙️</span></div>
<div class="tabs"><div>🎬 Edits</div><div>📁 Drafts · 2</div><div>📋 Templates</div></div>
<div class="head"><b>Recents ⌄</b><button onclick="document.getElementById('file').click()">☑️ Select</button></div>
<div class="grid" id="grid">
<div class="cam" onclick="document.getElementById('file').click()">📷</div>
<img src="https://picsum.photos/300/400?random=1" onclick="selectMedia(this.src)">
<img src="https://picsum.photos/300/400?random=2" onclick="selectMedia(this.src)">
<img src="https://picsum.photos/300/400?random=3" onclick="selectMedia(this.src)">
<img src="https://picsum.photos/300/400?random=4" onclick="selectMedia(this.src)">
<img src="https://picsum.photos/300/400?random=5" onclick="selectMedia(this.src)">
</div>
<input type="file" id="file" accept="video/*,image/*" hidden>
<div class="bottom"><div><span>STORY</span><span>INSTANTS</span><b class="on">REEL</b><span>LIVE</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script><script src="js/pixoro-core.js"></script>
<script>function selectMedia(url){ localStorage.setItem('pixoro_reel_media',url); localStorage.setItem('pixoro_reel_type','image'); location.href='./create-reels-edit.html'; }document.getElementById('file').onchange=(e)=>{let f=e.target.files[0]; if(!f) return; let u=URL.createObjectURL(f); localStorage.setItem('pixoro_reel_media',u); localStorage.setItem('pixoro_reel_type',f.type.includes('video')?'video':'image'); localStorage.setItem('pixoro_reel_file_name',f.name); location.href='./create-reels-edit.html'; }</script>
</body></html>
