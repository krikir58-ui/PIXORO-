<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New reel - Pixoro</title>
<link rel="stylesheet" href="css/create-reels.css?v=1035">
</head>
<body>
<div class="top"><span onclick="location.href='./index.html'">✕</span><b>New reel</b><span>⚙️</span></div>
<div class="tabs"><div>🎬 Edits</div><div>📁 Drafts · 2</div><div>📋 Templates</div></div>

<div class="bgToggle">
  <button class="on" onclick="setGridBg('black',this)">⬛ Black Block</button>
  <button onclick="setGridBg('transparent',this)">🔲 BG Remove</button>
</div>

<div class="preview" id="previewBox">
  <div class="empty" id="emptyBox">📷<small>Video / Photo Select Pannu da<br>Black la Varum da</small></div>
  <img id="prevImg" src="" style="display:none">
  <video id="prevVid" src="" style="display:none" muted loop playsinline></video>
</div>

<div class="head"><b>Recents ⌄</b><button onclick="document.getElementById('file').click()">☑️ Select</button></div>

<div class="grid" id="grid">
  <div class="tile cam" onclick="document.getElementById('file').click()">📷<br><small>Gallery</small></div>
  <div class="tile" onclick="document.getElementById('file').click()">➕<br><small>Add</small></div>
  <div class="tile" onclick="document.getElementById('file').click()">➕<br><small>Add</small></div>
</div>

<input type="file" id="file" accept="video/*,image/*" hidden>

<div class="bottomNav">
  <button onclick="location.href='./create-post.html'">POST</button>
  <button class="on" onclick="location.href='./create-reels.html'">REELS</button>
  <button onclick="location.href='./create-story.html'">STORY</button>
  <button onclick="location.href='./live.html'">LIVE</button>
  <button onclick="location.href='./create-reels.html'">INSTANTS</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=1035"></script>
<script src="js/pixoro-core.js?v=1035"></script>
<script>
// ✅ NO LOCALSTORAGE DA - MEMORY LA MATTUM DA - 50MB VIDEO Kooda CRASH AAGAATHU DA
let reelBg = 'black';
window.__pixoroMedia = null; // { file, url, type }
window.__pixoroReelFile = null;

function setGridBg(mode, btn){
  document.querySelectorAll('.bgToggle button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  reelBg = mode; // ✅ localStorage ILLA DA - VARIABLE MATTUM DA
  let preview = document.getElementById('previewBox');
  let img = document.getElementById('prevImg');
  let vid = document.getElementById('prevVid');
  if(mode==='black'){ preview.style.background='#000'; preview.style.borderColor='#222'; img.style.background='#000'; img.style.objectFit='contain'; vid.style.objectFit='contain'; }
  if(mode==='transparent'){ preview.style.background='repeating-conic-gradient(#222 0% 25%, #000 0% 50%) 50% / 20px 20px'; img.style.background='transparent'; img.style.objectFit='contain'; }
}
setGridBg('black', document.querySelectorAll('.bgToggle button')[0]);

document.getElementById('file').onchange = (e) => {
  let f = e.target.files[0]; if(!f) return;
  let isVideo = f.type.includes('video');
  let url = URL.createObjectURL(f); // ✅ DATA URL ILLA DA - BLOB URL DA - MEMORY LA MATTUM DA - FAST DA
  window.__pixoroMedia = { file: f, url: url, type: isVideo ? 'video' : 'image' };
  window.__pixoroReelFile = f;

  if(isVideo){
    if(f.size > 100*1024*1024){ alert('Video - 100MB ku Mela Irukku da - Chinna Video Select Pannu da'); return; }
    let v = document.getElementById('prevVid');
    v.src = url; v.style.display='block'; v.play();
    document.getElementById('prevImg').style.display='none';
    document.getElementById('emptyBox').style.display='none';
    // ✅ NEXT PAGE KU - FILE AH - DIRECT AH - PASS PANNA - IndexedDB / Supabase Upload - Inga Thaan Pannanum da
    // Edit page la - window.opener / Supabase la irundhu edukkanum da - localStorage la VAIKKAVE KOODATHU DA
    setTimeout(()=>{ goToEdit(); }, 500);
    return;
  }

  // IMAGE - CANVAS BLACK DA - AANA - localStorage LA VAIKKALA DA
  let reader = new FileReader();
  reader.onload = function(){
    let img = new Image();
    img.onload = function(){
      let canvas = document.createElement('canvas');
      let maxW = 1080, w = img.width, h = img.height;
      if(w > maxW){ h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      let ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob((blob)=>{
        let blobUrl = URL.createObjectURL(blob);
        let blobFile = new File([blob], 'reel.jpg', {type:'image/jpeg'});
        window.__pixoroMedia = { file: blobFile, url: blobUrl, type:'image' };
        window.__pixoroReelFile = blobFile;
        let p = document.getElementById('prevImg');
        p.src = blobUrl; p.style.display='block';
        document.getElementById('emptyBox').style.display='none';
        setTimeout(()=>{ goToEdit(); }, 400);
      }, 'image/jpeg', 0.85);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
};

function goToEdit(){
  // ✅ NO LOCALSTORAGE DA - EDIT PAGE KU PONA - FILE POYIDUM NU BAYAPADATHA DA
  // Sariyaana Vazhi: Ingaye - Supabase ku Upload Pannidu da - Aprom Edit Page la - URL la irundhu Edu da
  // Temporary ah - Edit page ku pogama - Ingaye - Upload Pannu nu - Alert kaamikuren da
  if(window.__pixoroMedia && window.__pixoroMedia.file){
    // Upload function - js/pixoro-core.js la irundha - Inga call pannu da
    // uploadReelFile(window.__pixoroMedia.file) - nu - Neenga - Supabase ku Upload Pannanum da
    alert('File Ready da ✅ - localStorage la Vaikkala da - Ippo - Supabase ku Upload Pannu da');
    // location.href = './create-reels-edit.html'; // ❌ Itha - Ippo - Use Panna Vendaam da - File Poyidum da
  }
}
</script>
</body>
</html>
