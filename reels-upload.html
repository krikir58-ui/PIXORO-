<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto;padding:14px}
input,textarea,select{width:100%;background:#111;border:1px solid #222;padding:12px;border-radius:12px;color:#fff;margin:8px 0;outline:none}
.btn{background:#fff;color:#000;border:0;width:100%;padding:14px;border-radius:20px;font-weight:900;margin-top:10px}
.prev{height:300px;background:#111;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.prev video,.prev img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;display:none;white-space:nowrap}
.soundBtn{position:absolute;bottom:12px;right:12px;background:#fff;color:#000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:10}
.tapHint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 12px;border-radius:20px;font-size:11px;white-space:nowrap;z-index:10}
.small{font-size:11px;color:#888;margin:0 2px}
/* INSTAGRAM MARI - BACKGROUND BAR DA */
#bgBar{position:fixed;top:0;left:0;right:0;max-width:450px;margin:auto;background:#111;border-bottom:1px solid #222;padding:10px 12px;display:none;z-index:1000}
#bgBar .row{display:flex;gap:10px;align-items:center}
#bgBar img{width:44px;height:60px;object-fit:cover;border-radius:8px;background:#222}
#bgBar .bar{height:6px;background:#222;border-radius:20px;overflow:hidden;margin-top:6px}
#bgBar .bar div{height:100%;width:0%;background:#fff;transition:.3s}
/* REELS FEED - UPLOAD CLOSE AANA ODANE - INGA VARUM DA */
#feed{display:none;padding-bottom:80px}
.feedCard{margin:12px 0;border:1px solid #222;border-radius:16px;overflow:hidden}
.feedCard video,.feedCard img{width:100%;max-height:500px;background:#111;object-fit:cover}
.feedCard .meta{padding:10px;font-size:13px}
.bottomNav{position:fixed;bottom:0;left:0;right:0;max-width:450px;margin:auto;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px;z-index:1000}
.bottomNav span{font-size:22px;cursor:pointer}
</style></head><body>
<!-- UPLOAD PAGE -->
<div id="uploadPage">
<b id="title">PIXORO Reels - Share 🔥</b>
<div class="prev" id="prev">Loading...</div>
<input id="cap" placeholder="Caption eluthu da...">
<input id="tags" placeholder="#Tag - Theva na mattum Podu da - Illana Vidru da">
<div class="small">Example: #pixoro #viral - Neenga Type Panna mattum Save Aagum da</div>
<select id="privacy"><option value="public">🌍 Public - Ellaarum Paakalam</option><option value="followers">👥 Followers Only</option></select>
<button class="btn" id="shareBtn" onclick="share()">upload Reel 🚀</button>
<button class="btn" style="background:#222;color:#fff" onclick="location.href='index.html'">Cancel</button>
</div>

<!-- INSTAGRAM MARI - BACKGROUND BAR -->
<div id="bgBar"><div class="row"><img id="bgThumb"><div style="flex:1"><div style="font-size:13px;font-weight:700">Uploading Reel... <span id="bgPct">0%</span></div><div style="font-size:11px;color:#999" id="bgTxt">Mella Upload Aaguthu da - Neenga Reels Paakalam da</div><div class="bar"><div id="bgFill"></div></div></div><span onclick="location.href='reels.html'" style="font-size:20px">✕</span></div></div>

<!-- REELS FEED - UPLOAD CLOSE AANA ODANE -->
<div id="feed"><div style="display:flex;justify-content:space-between;padding:4px 0 10px"><b>Pixoro Reels 🔥</b><span onclick="location.href='index.html'">🏠</span></div><div id="feedList"></div><div class="bottomNav"><span onclick="location.href='index.html'">🏠</span><span onclick="location.href='reels.html'">🎬</span><span onclick="location.href='reel-create.html'">➕</span><span onclick="location.href='profile.html'">👤</span></div></div>

<div id="toast" class="toast"></div>
<script>
let supa = window.supa
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
let params = new URLSearchParams(location.search)
let media = params.get('media') || ''
let typeParam = params.get('type') || 'video'
let isVid = typeParam==='video' || media.includes('.mp4')
let ME = '', ME_ID = ''
let prev = document.getElementById('prev');
let globalMuted = false;
function toggleSound(btn){
  let v = document.querySelector('#prev video');
  if(!v) return;
  globalMuted = !globalMuted;
  v.muted = globalMuted;
  btn.innerText = globalMuted ? '🔇' : '🔊';
  if(!globalMuted) v.play();
}
async function init(){
  if(!supa){ location.href='login.html'; return }
  let { data: { session } } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return; }
  let { data: profile } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  ME = (profile?.username || session.user.email.split('@')[0]).toLowerCase()
  ME_ID = session.user.id
  if(media){
    if(isVid){
      document.getElementById('title').innerText='PIXORO Reels - Share 🔥';
      document.getElementById('shareBtn').innerText='Share Reel 🚀';
      prev.innerHTML = `<div class="tapHint">Tap pannu 🔊 Sound varum</div><video src="${media}" autoplay loop playsinline controls style="width:100%;height:100%;object-fit:cover" onclick="this.muted=false;this.play();document.getElementById('sndBtn').innerText='🔊'"></video><div class="soundBtn" id="sndBtn" onclick="toggleSound(this)">🔊</div>`;
      let v = prev.querySelector('video');
      v.muted = false; v.volume = 1;
      v.play().catch(()=>{ v.muted=true; v.play(); document.getElementById('sndBtn').innerText='🔇'; globalMuted=true; });
      document.addEventListener('click', function firstTap(){
        let vid = document.querySelector('#prev video');
        if(vid && globalMuted){ vid.muted=false; vid.play(); globalMuted=false; let b=document.getElementById('sndBtn'); if(b) b.innerText='🔊'; }
      }, {once:true});
    } else {
      document.getElementById('title').innerText='PIXORO Post - Share 📸';
      document.getElementById('shareBtn').innerText='upload Post 🚀';
      prev.innerHTML = `<img src="${media}" style="width:100%;height:100%;object-fit:cover">`;
    }
  } else {
    prev.innerHTML = 'Media Illa da - Thumba poi Select pannu da!';
  }
}
init()
// *** MAIN FIX DA - UPLOAD THOTTA - PAGE CLOSE - FEED OPEN - UPLOAD PINNAADI POGUM DA ***
async function share(){
  if(!media){ showToast('Media illa da - Select pannu da'); return; }
  if(!ME){ showToast('Login pannu da'); return; }
  let cap = document.getElementById('cap').value || (isVid ? 'PIXORO Reel 🔥' : 'PIXORO Post 📸');
  let tags = document.getElementById('tags').value.trim();
  let privacy = document.getElementById('privacy').value;
  let type = isVid ? 'reel' : 'image';
  // 1. UPLOAD PAGE AH - FULL CLOSE PANNITOM DA - INSTAGRAM MARI
  document.getElementById('uploadPage').style.display='none';
  document.getElementById('feed').style.display='block';
  document.getElementById('bgBar').style.display='block';
  document.getElementById('bgThumb').src=media;
  document.body.style.padding='14px';
  loadFeed();
  showToast(isVid ? 'Uploading in Background da 🔥 - Reels Paakalam da' : 'Uploading in Background da 📸');
  // 2. BACKGROUND LA - MELLA UPLOAD POGUM DA - PAGE CLOSE AANA KODA - UPLOAD NIKKATHU DA
  try{
    document.getElementById('bgFill').style.width='30%'; document.getElementById('bgPct').innerText='30%';
    let {error} = await supa.from('posts').insert({user_id:ME_ID,username: ME, caption: cap, tags: tags, privacy: privacy, image_url: media, media_url: media, video_url: isVid?media:null, media_type: type});
    if(error){
      let {error:e2} = await supa.from('posts').insert({user_id:ME_ID,username: ME, caption: cap, image_url: media, media_url: media, media_type: type});
      if(e2) throw e2;
    }
    document.getElementById('bgFill').style.width='80%'; document.getElementById('bgPct').innerText='80%'; document.getElementById('bgTxt').innerText='Saving to Server...';
    setTimeout(()=>{
      document.getElementById('bgFill').style.width='100%'; document.getElementById('bgPct').innerText='100%'; document.getElementById('bgTxt').innerText='Done da 🔥 - Un Reel Ready da';
      showToast(isVid ? 'Reel Done da! 🔥' : 'Photo Done da! 📸');
      loadFeed();
      setTimeout(()=>{ document.getElementById('bgBar').style.display='none'; },2000);
    },600);
  }catch(e){ showToast('Adutha side la problem da - '+e.message); document.getElementById('bgTxt').innerText='Failed da - Retry Pannu da'; }
}
async function loadFeed(){
  let {data:posts}=await supa.from('posts').select('*').eq('media_type','reel').order('created_at',{ascending:false}).limit(20);
  let box=document.getElementById('feedList'); box.innerHTML='';
  (posts||[]).forEach(p=>{
    let d=document.createElement('div'); d.className='feedCard';
    let m=p.media_url||p.video_url||p.image_url||'';
    d.innerHTML = `<video src="${m}" controls playsinline loop></video><div class="meta"><b>@${p.username||''}</b> ${p.caption||''} <div style="color:#888">${p.tags||''}</div></div>`;
    box.appendChild(d);
  });
  if(!posts?.length) box.innerHTML='<div style="padding:20px;text-align:center;color:#888">Innum Reels Illa da - Neenga First ah Podunga da 🔥</div>';
}
</script></body></html>
