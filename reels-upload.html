<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;max-width:450px;margin:auto;padding:14px}
input,textarea{width:100%;background:#111;border:1px solid #222;padding:12px;border-radius:12px;color:#fff;margin:8px 0}
.btn{background:#fff;color:#000;border:0;width:100%;padding:14px;border-radius:20px;font-weight:900;margin-top:10px}
.prev{height:300px;background:#111;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.prev video,.prev img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;white-space:nowrap}
</style></head><body>
<b id="title">PIXORO Reels - Share 🔥</b>
<div class="prev" id="prev">Loading...</div>
<input id="cap" placeholder="Caption eluthu da...">
<button class="btn" id="shareBtn" onclick="share()">Share Reel 🚀</button>
<button class="btn" style="background:#222;color:#fff" onclick="location.href='index.html'">Cancel</button>
<div id="toast" class="toast"></div>
<script>
const supa = supabase.createClient('https://yecpltndhlzfjplzhcpm.supabase.co','sb_publishable_byUfZPczrxfkYKTmUNco5w_oqabYQJ_');
function showToast(m){let t=document.getElementById('toast');if(!t) return; t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000)}
window.alert = function(msg){ showToast(String(msg||'').slice(0,40) || 'Adutha side la problem da'); };
window.confirm = function(msg){ showToast(msg); return true; };
// ✅ URL la Irundhu da - Local Illa da
let params = new URLSearchParams(location.search)
let media = params.get('media') || ''
let typeParam = params.get('type') || 'video'
let isVid = typeParam==='video' || media.includes('.mp4')
let ME = '', ME_ID = ''
let prev = document.getElementById('prev');
async function init(){
  let { data: { session } } = await supa.auth.getSession()
  if(!session){ location.href='login.html'; return; }
  let { data: profile } = await supa.from('profiles').select('*').eq('id', session.user.id).single()
  ME = (profile?.username || session.user.email.split('@')[0]).toLowerCase()
  ME_ID = session.user.id
  if(media){
    if(isVid){
      document.getElementById('title').innerText='PIXORO Reels - Share 🔥';
      document.getElementById('shareBtn').innerText='Share Reel 🚀';
      prev.innerHTML = `<video src="${media}" autoplay loop muted playsinline controls style="width:100%;height:100%;object-fit:cover"></video>`;
    } else {
      document.getElementById('title').innerText='PIXORO Post - Share 📸';
      document.getElementById('shareBtn').innerText='Share Post 🚀';
      prev.innerHTML = `<img src="${media}" style="width:100%;height:100%;object-fit:cover">`;
    }
  } else {
    prev.innerHTML = 'Media Illa da - Thumba poi Select pannu da!';
  }
}
init()
async function share(){
  if(!media){ showToast('Media illa da - Select pannu da'); return; }
  if(!ME){ showToast('Login pannu da'); return; }
  document.getElementById('shareBtn').innerText='Uploading... ⏳';
  let cap = document.getElementById('cap').value || (isVid ? 'PIXORO Reel 🔥' : 'PIXORO Post 📸');
  let type = isVid ? 'reel' : 'image';
  // ✅ SERVER ONLY - posts Table la Insert da
  let {error} = await supa.from('posts').insert({username: ME, caption: cap, image_url: media, media_url: media, media_type: type});
  if(error){ showToast('Adutha side la problem da - '+error.message); document.getElementById('shareBtn').innerText='Share Reel 🚀'; return; }
  showToast(isVid ? 'Reel Done da! 🔥' : 'Photo Done da! 📸');
  setTimeout(()=>{ location.href = isVid ? 'reels.html' : 'index.html'; },800);
}
</script></body></html>
