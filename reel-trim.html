<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center} .skeleton{background:#222;height:350px;border-radius:12px;position:relative;overflow:hidden} .skeleton::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);animation:sh 1.2s infinite} @keyframes sh{to{left:100%}} .btns{display:flex;gap:8px;margin:12px 0} .btns button{flex:1;padding:10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff} .btns button.active{background:#ff5ea8;border:0} .next{background:#ff5ea8;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:700}</style></head>
<body><div style="display:flex;justify-content:space-between"><span onclick="history.back()">Back</span><b>Trim</b><span></span></div>
<div class="skeleton"></div>
<div class="btns"><button>15s</button><button class="active">30s</button><button>90s</button></div>
<input type="range" style="width:100%">
<button class="next" onclick="location.href='./reel-editor.html'">Next - Edit</button></body></html>
