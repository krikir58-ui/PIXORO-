<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>New post - Pixoro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.top{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#000;position:relative;z-index:10}
.top .next{color:#0095f6;font-weight:700;display:none;cursor:pointer}
.preview{width:100%;height:48vh;background:#111;display:grid;place-items:center;overflow:hidden;position:relative}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
#emptyBox{color:#888;text-align:center;font-size:14px;position:relative;z-index:2}
#emptyBox div{font-size:48px;margin-bottom:8px}
.gridHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px}
.gridHead button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;height:calc(100vh - 52px - 48vh - 80px);overflow-y:auto}
.grid .tile{aspect-ratio:1;background:#111;overflow:hidden}
.grid .tile img,.grid .tile video{width:100%;height:100%;object-fit:cover}
.gridEmpty{grid-column:1/-1;text-align:center;color:#777;padding:20px;font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:center;gap:22px;padding:14px;border-top:1px solid #222;z-index:10}
.tabs span{color:#888;letter-spacing:1px;font-size:14px;cursor:pointer}
.tabs span.on{color:#fff;font-weight:800}
.editBar{display:none;gap:8px;padding:10px 14px;overflow-x:auto;background:#000}
.editBar button{background:#222;color:#fff;border:0;padding:10px 14px;border-radius:20px;white-space:nowrap}
.editBar button.on{background:#fff;color:#000}
.zoomBar{display:none;align-items:center;gap:10px;padding:0 14px 10px;background:#000}
.zoomBar input{flex:1;accent-color:#0095f6}
.zoomBar button{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:20px}
.drawBar{display:none;gap:8px;padding:10px 14px;overflow-x:auto;background:#111;align-items:center}
.drawBar button{border:0;padding:10px 12px;border-radius:20px;background:#222;color:#fff;white-space:nowrap}
.drawBar .c1{background:#ff2d55;width:28px;height:28px;border-radius:50%;padding:0}
.drawBar .c2{background:#fff;width:28px;height:28px;border-radius:50%;padding:0}
.drawBar .c3{background:#ffcc00;width:28px;height:28px;border-radius:50%;padding:0}
.drawBar .done{background:#0095f6}
.shareBox{display:none;padding:0 14px 90px;overflow-y:auto;height:calc(100vh - 52px);background:#000}
.shareBox textarea{width:100%;background:transparent;border:0;color:#fff;font-size:16px;outline:none;resize:none;padding:14px 0}
.shareBox .row{display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid #222}
.shareTop{display:flex;gap:12px;align-items:flex-start}
.shareTop img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#222}
.shareBtn{width:100%;background:#0095f6;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:800;margin-top:14px}
#status{text-align:center;font-size:13px;color:#ffcc00;padding:10px}
canvas#drawCanvas{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:5;touch-action:none}
canvas#drawCanvas.on{display:block}
#cropGrid{position:absolute;inset:0;pointer-events:none;display:none}
#cropGrid .g1{position:absolute;left:33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.4)}
#cropGrid .g2{position:absolute;left:66%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.4)}
#cropGrid .g3{position:absolute;top:33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.4)}
#cropGrid .g4{position:absolute;top:66%;left:0;right:0;border-top:1px solid rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="top"><span onclick="goBack()">✕</span><b id="topTitle">New post</b><span class="next" id="nextBtn" onclick="goNext()">Next</span></div>

<div id="step12">
  <div class="preview" id="previewBox">
    <img id="prevImg" style="display:none">
    <video id="prevVid" style="display:none" muted loop playsinline></video>
    <div id="emptyBox"><div>📷</div>Photo Select Pannu da</div>
    <canvas id="drawCanvas"></canvas>
    <div id="cropGrid"><div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g4"></div></div>
  </div>

  <div class="editBar" id="editBar">
    <button onclick="setFilter('none',this)" class="on">Original</button>
    <button onclick="setFilter('grayscale(1)',this)">B&W</button>
    <button onclick="setFilter('sepia(.8)',this)">Sepia</button>
    <button onclick="setFilter('contrast(1.4) saturate(1.6)',this)">Vivid</button>
    <button onclick="setFilter('brightness(1.2)',this)">Fade</button>
    <button onclick="toggleDraw()">✏️ Draw</button>
    <button onclick="addText()">Aa Text</button>
  </div>

  <div class="zoomBar" id="zoomBar"><span>➖</span><input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1" oninput="setZoom(parseFloat(this.value))"><span>➕</span><button onclick="setZoom(1)">Reset</button></div>

  <div class="drawBar" id="drawBar">
    <button class="c1" onclick="setColor('#ff2d55')"></button>
    <button class="c2" onclick="setColor('#ffffff')"></button>
    <button class="c3" onclick="setColor('#ffcc00')"></button>
    <button onclick="setEraser()">🧹 Eraser</button>
    <button onclick="undoDraw()">↩ Undo</button>
    <button onclick="clearDraw()">Clear</button>
    <button class="done" onclick="toggleDraw()">✅ Done</button>
  </div>

  <div id="gridSection">
    <div class="gridHead"><b>Recents ⌄</b><button onclick="document.getElementById('file').click()">Select</button></div>
    <div class="grid" id="grid"><div class="gridEmpty">Select Button ah Thodu da<br>Gallery Open Aagum da</div></div>
  </div>

  <div class="tabs" id="typeTabs"><span onclick="setType('post',this)" class="on">POST</span><span onclick="setType('reels',this)">REEL</span><span onclick="setType('story',this)">STORY</span></div>
</div>

<div class="shareBox" id="step3">
  <div class="shareTop"><img id="shareThumb"><textarea id="caption" rows="3" placeholder="Write a caption..."></textarea></div>
  <div class="row" onclick="tagPeople()"><span>Tag people</span><span id="tagTxt">›</span></div>
  <div class="row" onclick="addLocation()"><span>Add location</span><span id="locTxt">›</span></div>
  <div class="row" onclick="togglePrivate()"><span>Audience</span><span id="audTxt">Everyone ›</span></div>
  <div id="status"></div>
  <button class="shareBtn" id="shareBtn" onclick="sharePost()">Share</button>
</div>

<input type="file" id="file" accept="image/*,video/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=1036"></script>
<script src="create.js?v=1036"></script>
</body>
</html>
