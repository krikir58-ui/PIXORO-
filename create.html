<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create - Pixoro</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/create.css">
</head>
<body>

<div class="top">
  <a href="index.html">✕ Cancel</a>
  <b>Create</b>
  <b style="color:#0095f6;cursor:pointer" onclick="goNext()">Next</b>
</div>

<div class="tabs">
  <button id="btn-post" class="active" onclick="showTab('post')">Post</button>
  <button id="btn-reel" onclick="showTab('reel')">Reels</button>
  <button id="btn-story" onclick="showTab('story')">Story</button>
</div>

<div class="preview-box" id="previewBox">
  <img id="previewImg" style="display:none">
  <video id="previewVideo" controls loop style="display:none"></video>
  <div class="skeleton-wrap" id="placeholder">
    <div class="skeleton sk-big"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line2"></div>
    <p id="placeholderText">Photo Select Pannu da</p>
  </div>
  <div id="storyTextOverlay"></div>
</div>

<div class="select-btns">
  <label for="fileInput">📁 Gallery</label>
  <button onclick="document.getElementById('fileInput').click()">📷 Camera</button>
  <input type="file" id="fileInput" accept="image/*,video/*" hidden onchange="onFile(this)">
</div>

<div class="edit-bar" id="editBar">
  <button onclick="setEdit('crop')">✂️ Crop</button>
  <button onclick="setEdit('filter')" class="active">🎨 Filter</button>
  <button onclick="setEdit('bright')">☀️ Bright</button>
  <button onclick="setEdit('text')">🔤 Text</button>
</div>

<div class="filters" id="filterRow">
  <button class="active" onclick="applyFilter('none',this)">Original</button>
  <button onclick="applyFilter('grayscale(1)',this)">B&W</button>
  <button onclick="applyFilter('sepia(1)',this)">Sepia</button>
  <button onclick="applyFilter('contrast(1.4) saturate(1.5)',this)">Vivid</button>
  <button onclick="applyFilter('brightness(1.2) saturate(0.5)',this)">Fade</button>
  <button onclick="applyFilter('hue-rotate(90deg)',this)">Cool</button>
</div>

<div class="music-row" id="musicRow">
  <select id="musicSelect">
    <option value="">🎵 Music Select Pannu da</option>
    <option value="trending">Trending - Tamil Beat</option>
    <option value="chill">Chill - LoFi</option>
    <option value="mass">Mass - Kuthu</option>
  </select>
</div>

<div class="story-tools" id="storyTools">
  <button onclick="addStoryText()">🔤 Text Add</button>
  <button onclick="addSticker()">😍 Sticker</button>
  <button onclick="addMusicStory()">🎵 Music</button>
</div>

<div class="box">
  <textarea id="caption" placeholder="Caption ezhuthu da... ✨ #pixoro"></textarea>
  <input type="text" id="location" placeholder="📍 Location Add Pannu da">
  <input type="text" id="tags" placeholder="👥 People Tag Pannu da">
</div>

<button class="share-btn" onclick="goNext()">Share → Pixoro</button>

<script src="./pixoro-store.js"></script>
<script src="js/create.js"></script>
<script>
let curType = sessionStorage.getItem('pixoro_type') || 'post';
function showTab(t){
  curType = t; sessionStorage.setItem('pixoro_type', t);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+(t==='reel'?'reel':'post'))?.classList.add('active');
  if(t==='reel') document.getElementById('btn-reel').classList.add('active');
  if(t==='story') document.getElementById('btn-story').classList.add('active');
  if(t==='post') document.getElementById('btn-post').classList.add('active');
}
let _oldOnFile = window.onFile;
function onFile(input){
  let f = input.files[0]; if(!f) return;
  pixoroSave(curType, f);
  sessionStorage.setItem('pixoro_caption', document.getElementById('caption').value || '');
  let url = URL.createObjectURL(f);
  document.getElementById('placeholder').style.display='none';
  if(f.type.startsWith('video')){
    let v=document.getElementById('previewVideo'); v.style.display='block'; v.src=url;
    document.getElementById('previewImg').style.display='none';
  } else {
    let im=document.getElementById('previewImg'); im.style.display='block'; im.src=url;
    document.getElementById('previewVideo').style.display='none';
  }
  if(typeof _oldOnFile==='function'){ try{ _oldOnFile(input); }catch(e){} }
}
function setEdit(){}
function applyFilter(f, el){
  document.getElementById('previewImg').style.filter=f;
  document.getElementById('previewVideo').style.filter=f;
  sessionStorage.setItem('pixoro_filter', f);
  if(el){ document.querySelectorAll('#filterRow button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
}
function addStoryText(){ let t=prompt('Text Eluthu da:'); if(t){ document.getElementById('storyTextOverlay').innerText=t; sessionStorage.setItem('pixoro_text', t); } }
function addSticker(){ alert('Sticker - Next Update la da!'); }
function addMusicStory(){ alert('Music - Next Update la da!'); }
function goNext(){
  pixoroGet(b=>{
    if(!b){ alert('Mudhalla Photo Select Pannu da!'); return; }
    sessionStorage.setItem('pixoro_caption', document.getElementById('caption').value || '');
    location.href='./create-edit.html';
  });
}
function shareNow(){ goNext(); }
</script>
</body>
</html>
